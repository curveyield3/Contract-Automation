name: Setup Browser Agent Runtime
description: Restore or install the isolated browser-agent runtime without touching root contract dependencies.

runs:
  using: composite
  steps:
    - name: Cache isolated browser runtime
      id: cache
      uses: actions/cache@v4
      with:
        path: .github/actions/setup-browser-agent-runtime/node_modules
        key: browser-agent-runtime-${{ runner.os }}-node22-${{ hashFiles('.github/actions/setup-browser-agent-runtime/package.json') }}

    - name: Install isolated browser runtime
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        npm install \
          --prefix "$GITHUB_WORKSPACE/.github/actions/setup-browser-agent-runtime" \
          --package-lock=false \
          --ignore-scripts \
          --no-audit \
          --no-fund

    - name: Verify isolated browser runtime
      shell: bash
      run: |
        set -euo pipefail
        node --input-type=module <<'NODE'
        import fs from 'node:fs';
        import path from 'node:path';

        const root = path.join(process.env.GITHUB_WORKSPACE, '.github', 'actions', 'setup-browser-agent-runtime');
        const expected = JSON.parse(fs.readFileSync(path.join(root, 'package.json'), 'utf8')).dependencies;
        for (const [name, version] of Object.entries(expected)) {
          const packagePath = path.join(root, 'node_modules', ...name.split('/'), 'package.json');
          const observed = JSON.parse(fs.readFileSync(packagePath, 'utf8')).version;
          if (observed !== version) throw new Error(`${name} version mismatch: expected ${version}, observed ${observed}`);
        }
        NODE
        echo "BROWSER_AGENT_RUNTIME_ROOT=$GITHUB_WORKSPACE/.github/actions/setup-browser-agent-runtime" >> "$GITHUB_ENV"
