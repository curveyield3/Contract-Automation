name: Setup pinned Phase 0 Node dependencies
description: Restore exact locked node_modules across Phase 0 jobs; install only after a cache miss
runs:
  using: composite
  steps:
    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - name: Restore exact Node dependencies
      id: locked-modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: phase0-primary-node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json', 'package.json', 'packages/*/package.json') }}
    - name: Install Node dependencies on cache miss only
      if: steps.locked-modules.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo 'Node cache MISS: installing exact locked dependencies'
        timeout -s TERM -k 15s 300s npm ci --force --prefer-offline --no-audit --no-fund
    - name: Verify restored Node toolchain
      shell: bash
      run: |
        set -euo pipefail
        node -e "const fs=require('node:fs');for(const p of ['node_modules/@foundry-rs/forge/bin.mjs','node_modules/@foundry-rs/anvil/bin.mjs']){if(!fs.existsSync(p))throw new Error('Missing pinned executable '+p)};for(const name of ['@foundry-rs/forge','@foundry-rs/anvil']){const p=require('./node_modules/'+name+'/package.json');if(p.version!=='1.7.1')throw new Error('Pinned version mismatch '+name+' '+p.version)}"
        npm ls --depth=0 --omit=optional >/dev/null
        echo "Node dependencies verified (cache hit: ${{ steps.locked-modules.outputs.cache-hit }})"
