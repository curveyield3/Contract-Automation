name: Setup Browser Agent Home-Exit Runtime v10
description: Restore or install the isolated Playwright-only runtime for browser-agent v10.

runs:
  using: composite
  steps:
    - name: Cache isolated browser runtime v10
      id: cache
      uses: actions/cache@v4
      with:
        path: packages/browser-agent-original-phase0-v10/runtime-v10/node_modules
        key: browser-agent-home-exit-v10-${{ runner.os }}-node22-${{ hashFiles('packages/browser-agent-original-phase0-v10/runtime-v10/package.json') }}

    - name: Install isolated browser runtime v10
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        npm install \
          --prefix "$GITHUB_WORKSPACE/packages/browser-agent-original-phase0-v10/runtime-v10" \
          --package-lock=false \
          --ignore-scripts \
          --no-audit \
          --no-fund

    - name: Verify isolated browser runtime v10
      shell: bash
      run: |
        set -euo pipefail
        node --input-type=module <<'NODE'
        import fs from 'node:fs';
        import path from 'node:path';
        const root = path.join(process.env.GITHUB_WORKSPACE, 'packages', 'browser-agent-original-phase0-v10', 'runtime-v10');
        const expected = JSON.parse(fs.readFileSync(path.join(root, 'package.json'), 'utf8')).dependencies;
        for (const [name, version] of Object.entries(expected)) {
          const packagePath = path.join(root, 'node_modules', ...name.split('/'), 'package.json');
          const observed = JSON.parse(fs.readFileSync(packagePath, 'utf8')).version;
          if (observed !== version) throw new Error(`${name} version mismatch: expected ${version}, observed ${observed}`);
        }
        NODE
        echo "BROWSER_AGENT_RUNTIME_ROOT=$GITHUB_WORKSPACE/packages/browser-agent-original-phase0-v10/runtime-v10" >> "$GITHUB_ENV"
