# Exact CurveYield DEX v16 audit overlay; no hard-coded RPC.
[profile.default]
src = "contracts"
test = "test"
out = "out-phase6-audit"
libs = ["node_modules", "vendor"]
cache_path = "cache-phase6-audit"
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
"@openzeppelin/=node_modules/@openzeppelin/",
"@balancer-labs/v3-interfaces/=vendor/balancer-v3-upstream/pkg/interfaces/",
"@balancer-labs/v3-solidity-utils/=vendor/balancer-v3-upstream/pkg/solidity-utils/",
"@balancer-labs/v3-vault/=vendor/balancer-v3-upstream/pkg/vault/",
"@balancer-labs/v3-pool-utils/=vendor/balancer-v3-upstream/pkg/pool-utils/",
"@balancer-labs/v3-pool-hooks/=vendor/balancer-v3-upstream/pkg/pool-hooks/",
"@balancer-labs/v3-pool-stable/=vendor/balancer-v3-upstream/pkg/pool-stable/",
"@balancer-labs/v3-pool-weighted/=vendor/balancer-v3-upstream/pkg/pool-weighted/",
"@balancer-labs/v3-pool-gyro/=vendor/balancer-v3-upstream/pkg/pool-gyro/",
"@balancer-labs/v3-standalone-utils/=vendor/balancer-v3-upstream/pkg/standalone-utils/"
]
[fuzz]
runs = 1024
max_test_rejects = 65536
