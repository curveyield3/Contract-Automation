# cyvlSDT v30 Phase 6 revenue-accounting audit-only Foundry configuration v4
# Exact V30 revenue contracts remain frozen. External fee generation, balances and deterministic
# swap routes are supplied by the audit harness only. GitHub Actions supplies the mutable fork RPC.

[profile.default]
src = "contracts"
test = "test"
out = "out-phase6-revenue-accounting-v4"
libs = ["node_modules"]
cache_path = "cache-phase6-revenue-accounting-v4"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/=node_modules/@openzeppelin/"]
skip = [
  "contracts/CurveYieldGovernanceStaking.vy",
  "contracts/external/curve/ChildGauge.vy"
]

[fuzz]
runs = 4096
max_test_rejects = 65536
failure_persist_file = "cache-phase6-revenue-accounting-v4/fuzz-failures"

[invariant]
runs = 1536
depth = 224
fail_on_revert = false
show_metrics = true
failure_persist_dir = "cache-phase6-revenue-accounting-v4/invariant-failures"
