[profile.default]
src = "contracts"
test = "test"
out = "out-phase5-target-cand001"
libs = ["node_modules"]
cache_path = "cache-phase5-target-cand001"
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 1000
via_ir = true

[fuzz]
runs = 1024
max_test_rejects = 65536

[invariant]
runs = 256
depth = 64
fail_on_revert = false
