# cyvlSDT v30 P6.0 audit-only admission configuration v1
# The runner supplies the existing mutable Anvil RPC and frozen block by CLI.
[profile.default]
src = "contracts"
test = "test"
out = "out-phase6-admission-v1"
libs = ["node_modules"]
cache_path = "cache-phase6-admission-v1"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/=node_modules/@openzeppelin/"]
skip = [
  "contracts/CurveYieldGovernanceStaking.vy",
  "contracts/external/curve/ChildGauge.vy"
]

[fuzz]
runs = 1
max_test_rejects = 16

[invariant]
runs = 1
depth = 1
fail_on_revert = true
show_metrics = true
