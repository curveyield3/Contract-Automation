# cyvlSDT v30 Phase 6 audit-only Foundry configuration v2
# Frozen production source remains unchanged. The runner supplies the existing mutable
# Anvil RPC and preflight-frozen block through forge CLI arguments.
# Medusa/crytic-compile consumes Foundry build-info and currently assumes Solidity sourceMap
# fields. The two frozen Vyper contracts are not imported by the Solidity vault harness and
# are compiled/verified separately by the canonical mixed-language runner build.

[profile.default]
src = "contracts"
test = "test"
out = "out-phase6-audit"
libs = ["node_modules"]
cache_path = "cache-phase6-audit"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/=node_modules/@openzeppelin/"]
skip = [
  "contracts/CurveYieldGovernanceStaking.vy",
  "contracts/external/curve/ChildGauge.vy"
]

[fuzz]
runs = 4096
max_test_rejects = 65536
failure_persist_file = "cache-phase6-audit/fuzz-failures"

[invariant]
runs = 1024
depth = 128
fail_on_revert = false
show_metrics = true
failure_persist_dir = "cache-phase6-audit/invariant-failures"
