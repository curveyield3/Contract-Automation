# Runtime materialization name: foundry.toml
# Audit-only template. Match the frozen target compiler/remappings/source layout before use.
# DO NOT add rpc_endpoints or a literal eth_rpc_url here.
# Contract-Automation launches Forge with the existing mutable Anvil RPC secret and the
# preflight-frozen block: --fork-url <runtime secret> --fork-block-number <frozen block>.

[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
cache_path = "cache"
# solc_version = "PHASE6_MATCH_FROZEN_TARGET"
# evm_version = "PHASE6_MATCH_FROZEN_TARGET"
# optimizer = true
# optimizer_runs = PHASE6_MATCH_FROZEN_TARGET
# via_ir = PHASE6_MATCH_FROZEN_TARGET

# No default [fuzz] or [invariant] campaign is configured here.
# An auditor must explicitly select a named test/property and supply any
# test-specific run budgets in their source-bound execution request.
# If a source archive supplies foundry.toml, that file is retained verbatim.
