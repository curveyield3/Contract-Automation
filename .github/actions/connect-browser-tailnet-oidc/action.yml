name: Connect Browser Tailnet through Native OIDC
description: Install a cached Tailscale client and join the tailnet using GitHub OIDC directly, without creating API auth keys.
inputs:
  client-id:
    description: Tailscale federated identity Client ID (TS_OAUTH_CLIENT_ID).
    required: true
  tag:
    description: Tailnet device tag authorized by this federated workload identity.
    required: true
  ping:
    description: Existing home exit-node Tailscale IP or hostname to verify reachability.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Restore pinned Tailscale static distribution
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/tailscale-static-v1.104.2
        key: tailscale-native-oidc-v1.104.2-${{ runner.os }}-${{ runner.arch }}
    - name: Join ephemeral tailnet through GitHub OIDC
      shell: bash
      env:
        TS_CLIENT_ID: ${{ inputs.client-id }}
        TAILNET_TAG: ${{ inputs.tag }}
        TAILNET_PING: ${{ inputs.ping }}
      run: bash "$GITHUB_WORKSPACE/scripts/browser-agent-tailnet-oidc.sh"
