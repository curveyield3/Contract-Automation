name: MI Phase0 deterministic fork deployment toolchain v1
description: Provide pinned project Forge and Cast CLIs without Slither or Medusa setup.
runs:
  using: composite
  steps:
    - name: Enable pinned project Forge CLI
      shell: bash
      run: |
        set -euo pipefail
        forge_entry="$GITHUB_WORKSPACE/machine-intelligence-phase0-deterministic-extraction-fork-v1/node_modules/@foundry-rs/forge/bin.mjs"
        test -f "$forge_entry"
        chmod +x "$forge_entry"
        mkdir -p "$RUNNER_TEMP/mi-phase0-deterministic-fork/bin"
        ln -sfn "$forge_entry" "$RUNNER_TEMP/mi-phase0-deterministic-fork/bin/forge"
        # Pinned cast (same Foundry release) for package deployment entrypoints that read fork state.
        cast_entry="$GITHUB_WORKSPACE/machine-intelligence-phase0-deterministic-extraction-fork-v1/node_modules/@foundry-rs/cast/bin.mjs"
        test -f "$cast_entry"
        chmod +x "$cast_entry"
        ln -sfn "$cast_entry" "$RUNNER_TEMP/mi-phase0-deterministic-fork/bin/cast"
        echo "$RUNNER_TEMP/mi-phase0-deterministic-fork/bin" >> "$GITHUB_PATH"
        echo "$GITHUB_WORKSPACE/machine-intelligence-phase0-deterministic-extraction-fork-v1/node_modules/.bin" >> "$GITHUB_PATH"
