name: MI Phase0 deterministic fork Node dependencies
description: Restore exact locked node_modules across Phase 0 jobs; install only after a cache miss
runs:
  using: composite
  steps:
    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: machine-intelligence-phase0-deterministic-extraction-fork-v1/package-lock.json
    - name: Restore exact Node dependencies
      id: locked-modules
      uses: actions/cache@v4
      with:
        path: machine-intelligence-phase0-deterministic-extraction-fork-v1/node_modules
        key: mi-phase0-deterministic-fork-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('machine-intelligence-phase0-deterministic-extraction-fork-v1/package-lock.json', 'machine-intelligence-phase0-deterministic-extraction-fork-v1/package.json', 'machine-intelligence-phase0-deterministic-extraction-fork-v1/packages/*/package.json') }}
    - name: Install Node dependencies on cache miss only
      if: steps.locked-modules.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo 'Node cache MISS: installing exact locked dependencies'
        cd "$GITHUB_WORKSPACE/machine-intelligence-phase0-deterministic-extraction-fork-v1"
        timeout -s TERM -k 15s 300s npm ci --force --prefer-offline --no-audit --no-fund
    - name: Verify restored Node toolchain
      shell: bash
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE/machine-intelligence-phase0-deterministic-extraction-fork-v1"
        node -e "const fs=require('node:fs');for(const p of ['node_modules/@foundry-rs/forge/bin.mjs','node_modules/@foundry-rs/anvil/bin.mjs']){if(!fs.existsSync(p))throw new Error('Missing pinned executable '+p)};for(const name of ['@foundry-rs/forge','@foundry-rs/anvil']){const p=require('./node_modules/'+name+'/package.json');if(p.version!=='1.7.1')throw new Error('Pinned version mismatch '+name+' '+p.version)}"
        npm ls --depth=0 --omit=optional >/dev/null 2>&1 || echo '::warning::Secondary npm dependency-tree assessment inconclusive; required Forge/Anvil binaries and pinned versions checked above'
        echo "Node dependencies verified (cache hit: ${{ steps.locked-modules.outputs.cache-hit }})"
