name: Lite-Solo Cloudflare lite-audit-browser-orchestrator-v1 v1

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        required: true
        type: string
      campaign_name:
        required: true
        type: string
      campaign_path:
        required: true
        type: string
      audit_controller_ref:
        required: false
        default: main
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: lite-audit-browser-orchestrator-${{ inputs.campaign_id }}
  cancel-in-progress: false

jobs:
  launch-successor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CAMPAIGN_ID: ${{ inputs.campaign_id }}
      CAMPAIGN_NAME: ${{ inputs.campaign_name }}
      CAMPAIGN_PATH: ${{ inputs.campaign_path }}
      AUDIT_CONTROLLER_REF: ${{ inputs.audit_controller_ref }}
    steps:
      - name: Checkout trusted Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/lite-solo-cloudflare-runtime-v1/scripts/select-audit-controller-token.sh

      - name: Resolve campaign directory entry
        id: directory
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CAMPAIGN_PATH" == campaigns/* ]] || { echo "::error::campaign_path must be under campaigns/"; exit 1; }
          if [[ "$CAMPAIGN_ID" =~ ^(.+)-r[0-9]+$ ]]; then slug="${BASH_REMATCH[1]}"; else echo "::error::campaign_id does not end in -rN"; exit 1; fi
          directory_path="Audit Campaign Directory/campaigns/$slug.json"
          echo "path=$directory_path" >> "$GITHUB_OUTPUT"

      - name: Checkout Audit-Controller
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Sparse: campaign folder, its directory entry and the receipt-bound authority package only.
          bash scripts/lite-solo-cloudflare-runtime-v1/scripts/checkout-audit-controller-once-v1.sh .audit-controller "$AUDIT_CONTROLLER_REF" branch "$CAMPAIGN_PATH"
          test "$(jq -r '.campaignId' ".audit-controller/${{ steps.directory.outputs.path }}")" = "$CAMPAIGN_ID"
          test "$(jq -r '.workspacePath' ".audit-controller/${{ steps.directory.outputs.path }}")" = "$CAMPAIGN_PATH"

      - name: Prepare current assignment and dynamic wake message
        id: successor
        shell: bash
        run: |
          set -euo pipefail
          directory_schema="$(jq -r '.schemaVersion' ".audit-controller/${{ steps.directory.outputs.path }}")"
          if [ "$directory_schema" = "curveyield-audit-campaign-directory-entry-v2" ]; then
            node scripts/lite-solo-cloudflare-runtime-v1/scripts/prepare-lite-assignment-successor-v2.mjs \
              --controller-root .audit-controller \
              --campaign-directory-path "${{ steps.directory.outputs.path }}" \
              --audit-controller-ref "$AUDIT_CONTROLLER_REF" | tee /tmp/lite-successor.json
            boundary="PHASE_$(jq -r '.incomingPhaseSequence' /tmp/lite-successor.json)_WORK_PACKET"
          else
            node scripts/lite-solo-cloudflare-runtime-v1/scripts/prepare-lite-receipt-successor-v1.mjs \
              --controller-root .audit-controller \
              --campaign-directory-path "${{ steps.directory.outputs.path }}" | tee /tmp/lite-successor.json
            boundary="$(jq -r '.boundary' /tmp/lite-successor.json)"
          fi
          test "$(jq -r '.status' /tmp/lite-successor.json)" = PASS
          {
            echo "directory_schema=$directory_schema"
            echo "incoming_phase=$(jq -r '.incomingPhaseId' /tmp/lite-successor.json)"
            echo "incoming_reviewer=$(jq -r '.incomingReviewer' /tmp/lite-successor.json)"
            echo "boundary=$boundary"
            echo "wake_b64=$(jq -r '.wakeMessageB64' /tmp/lite-successor.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish legacy successor receipt preparation when applicable
        if: steps.successor.outputs.directory_schema != 'curveyield-audit-campaign-directory-entry-v2'
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd .audit-controller
          git config user.name 'CurveYield Lite Browser Orchestrator'
          git config user.email 'lite-browser-orchestrator@users.noreply.github.com'
          git add -- "$CAMPAIGN_PATH/receipts"
          if ! git diff --cached --quiet; then
            git commit -m "audit(receipt): prepare ${{ steps.successor.outputs.incoming_reviewer }} for $CAMPAIGN_ID"
            git push origin "HEAD:$AUDIT_CONTROLLER_REF"
          fi

      - name: Bind current reviewer to supplied existing chat
        id: registration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          safe_campaign="$(printf '%s' "$CAMPAIGN_ID" | tr -c 'A-Za-z0-9._-' '_')"
          registration="process/browser-agent-wake/registrations/$safe_campaign.json"
          api="repos/$GITHUB_REPOSITORY/contents/$registration"
          reviewer="${{ steps.successor.outputs.incoming_reviewer }}"
          phase_id="${{ steps.successor.outputs.incoming_phase }}"
          boundary="${{ steps.successor.outputs.boundary }}"

          current_payload="$(gh api "$api?ref=main" 2>/dev/null || true)"
          current="$(printf '%s' "$current_payload" | jq -r '.sha // empty')"
          [[ "$current" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Campaign browser registration is missing. Start the audit through Audit Source Initialization with all four agent chat URLs."
            exit 1
          }

          printf '%s' "$current_payload" | jq -r '.content' | tr -d '\n' | base64 -d > /tmp/existing-registration.json
          case "$reviewer" in
            reviewer-1|reviewer-2|reviewer-3|reviewer-3L|reviewer-4) ;;
            *) echo "::error::Unsupported reviewer identity: $reviewer. Expected reviewer-1 through reviewer-4."; exit 1 ;;
          esac

          chat_url="$(jq -r --arg reviewer "$reviewer" '.agentChats[$reviewer] // empty' /tmp/existing-registration.json)"
          [[ "$chat_url" =~ ^https://chatgpt\.com/c/[A-Za-z0-9_-]+/?$ || "$chat_url" =~ ^https://chatgpt\.com/g/g-p-[A-Za-z0-9_-]+/c/[A-Za-z0-9_-]+/?$ ]] || {
            echo "::error::No valid pre-created ChatGPT chat is bound for $reviewer."
            exit 1
          }

          interaction_policy="$(jq -r '.browserInteractionPolicy // "phase1-fixed-x11-normal-chrome-no-chatgpt-page-read-v1"' /tmp/existing-registration.json)"
          jq \
            --arg chat "$chat_url" \
            --arg reviewer "$reviewer" \
            --arg phaseId "$phase_id" \
            --arg boundary "$boundary" \
            --arg interactionPolicy "$interaction_policy" \
            --arg ref "$AUDIT_CONTROLLER_REF" \
            --arg directoryPath "${{ steps.directory.outputs.path }}" \
            '.schemaVersion="curveyield-browser-agent-wake-registration-v1"
             | .campaignId=$ENV.CAMPAIGN_ID
             | .mode="resume_existing"
             | .chatUrl=$chat
             | .browserRoutine=""
             | .chatgptProject={name:"",url:""}
             | .activeChat={name:$reviewer,url:$chat}
             | .wakeMessage=""
             | .thinkingEffort="high"
             | .browserInteractionPolicy=$interactionPolicy
             | .activeAssignment={phaseId:$phaseId,milestoneId:$boundary,workerRole:"reviewer",reviewer:$reviewer,thinkingEffort:"high"}
             | .watchdog=((.watchdog // {}) + {enabled:true,idleMessage:"GET BACK TO WORK"})
             | .watchdog.gate={mode:"LITE",repository:"curveyield3/Audit-Controller",ref:$ref,statePath:$directoryPath,expectedPhaseId:$phaseId,expectedMilestoneId:$boundary,activePointerPath:"",stopStates:["STOPPED_BY_HUMAN"],stopCampaignStatuses:["COMPLETE","STOPPED_BY_HUMAN"]}
             | .repair=((.repair // {}) + {enabled:true,idlePokeThreshold:3,unviewableThreshold:2})
             | .updatedAt=(now|todate)' \
            /tmp/existing-registration.json > /tmp/registration.json

          body="$(base64 -w0 /tmp/registration.json)"
          gh api --method PUT "$api" \
            -f message="chore(wake): bind $CAMPAIGN_ID $reviewer to existing chat" \
            -f content="$body" -f sha="$current" -f branch=main >/dev/null

          echo "chat_url=$chat_url" >> "$GITHUB_OUTPUT"
          echo "reviewer=$reviewer" >> "$GITHUB_OUTPUT"

      - name: Wake assigned existing reviewer chat
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          poke_b64="$(printf '%s' 'GET BACK TO WORK' | base64 -w0)"
          wake_id="$CAMPAIGN_ID-${{ steps.successor.outputs.boundary }}-${{ steps.successor.outputs.incoming_reviewer }}"
          phase_id="${{ steps.successor.outputs.incoming_phase }}"
          chat_url="${{ steps.registration.outputs.chat_url }}"

          # Operational routing guidance supplements, never edits, the frozen skill.
          original_wake="$(printf '%s' '${{ steps.successor.outputs.wake_b64 }}' | base64 -d)"
          fork_note="EXECUTION ROUTING: Use ONLY curveyield3/Audit-Controller as canonical evidence/authority repository and curveyield3/Contract-Automation for GitHub Actions. Read docs/BROWSER_AGENT_BLOCKCHAIN_WORKSTATION_v1.md (Anvil/RPC rule) BEFORE a live-fork test design or execution. The authenticated archive source is GitHub Actions secret RPC_ETHEREUM projected to ETHEREUM_FORK_RPC_URL; the trusted runner verifies pinned historical chain/block/hash and creates a writable 127.0.0.1 Anvil fork. No standalone/Ganache/public-RPC fixture counts as audit evidence. Do not launch test-triggering requests, phase-boundary machine runs, or regressions without explicit audit-owner authorization. Reviewer owns analysis/design; registered test-executor owns authorized machine runs; preserve all high-risk unresolved limitations."
          wake_b64="$(printf '%s\\n\\n%s' "$original_wake" "$fork_note" | base64 -w0)"

          browser_context_b64="$(jq -cn \
            --arg reviewer "${{ steps.successor.outputs.incoming_reviewer }}" \
            '{routineId:"",projectName:"",projectUrl:"",chatName:$reviewer,repair:{enabled:true,idlePokeThreshold:3,unviewableThreshold:2},messagePurpose:"initial_wake"}' | base64 -w0)"

          gh workflow run lite-solo-cloudflare-browser-agent-wake-v1.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f wake_id="$wake_id" \
            -f campaign_id="$CAMPAIGN_ID" \
            -f phase_id="$phase_id" \
            -f mode=resume_existing \
            -f chat_url="$chat_url" \
            -f wake_message_b64="$wake_b64" \
            -f watchdog_enabled=true \
            -f worker_role=reviewer \
            -f watchdog_message_b64="$poke_b64" \
            -f gate_mode=LITE \
            -f gate_repository=curveyield3/Audit-Controller \
            -f gate_ref="$AUDIT_CONTROLLER_REF" \
            -f gate_state_path="${{ steps.directory.outputs.path }}" \
            -f gate_expected_phase_id="$phase_id" \
            -f gate_expected_milestone_id="${{ steps.successor.outputs.boundary }}" \
            -f gate_active_pointer_path="" \
            -f gate_stop_states_csv=STOPPED_BY_HUMAN \
            -f gate_stop_campaign_statuses_csv=COMPLETE,STOPPED_BY_HUMAN \
            -f browser_context_b64="$browser_context_b64"

      - name: Summarize
        run: |
          {
            echo "## Lite receipt successor dispatch"
            echo "- Campaign: $CAMPAIGN_ID"
            echo "- Directory: ${{ steps.directory.outputs.path }}"
            echo "- Incoming phase: ${{ steps.successor.outputs.incoming_phase }}"
            echo "- Incoming reviewer: ${{ steps.successor.outputs.incoming_reviewer }}"
            echo "- Existing reviewer chat: ${{ steps.registration.outputs.chat_url }}"
            echo "- Launch mode: resume_existing (no Project or chat creation)"
            echo "- Stored handoff/wake/start files: none"
            echo "- Active-phase receipt for assignment-v2 campaigns: none"
          } >> "$GITHUB_STEP_SUMMARY"
