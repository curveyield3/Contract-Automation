name: Browser Active Screenshare v2

on:
  workflow_dispatch:
    inputs:
      hold_minutes:
        description: Minutes to keep the interactive browser session alive
        required: true
        default: "20"
        type: string
      home_exit_node:
        description: Tailscale exit-node IP or MagicDNS name
        required: true
        default: "100.112.238.56"
        type: string
      use_home_exit:
        description: Route Chrome through the home exit node
        required: true
        default: true
        type: boolean

  push:
    branches:
      - main
    paths:
      - 'process/browser-active-screenshare-v2-v2/request-v2.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: browser-active-screenshare-v2-v2
  cancel-in-progress: true

jobs:
  screenshare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DISPLAY: ":99"
      CHATGPT_STORAGE_STATE_B64: ${{ secrets.CHATGPT_STORAGE_STATE_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_HOLD_MINUTES: ${{ inputs.hold_minutes }}
          INPUT_HOME_EXIT_NODE: ${{ inputs.home_exit_node }}
          INPUT_USE_HOME_EXIT: ${{ inputs.use_home_exit }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            request="process/browser-active-screenshare-v2-v2/request-v2.json"
            test -s "$request"
            echo "hold_minutes=$(jq -r '.hold_minutes // 20' "$request")" >> "$GITHUB_OUTPUT"
            echo "home_exit_node=$(jq -r '.home_exit_node // "100.112.238.56"' "$request")" >> "$GITHUB_OUTPUT"
            echo "use_home_exit=$(jq -r '.use_home_exit // true' "$request")" >> "$GITHUB_OUTPUT"
          else
            echo "hold_minutes=$INPUT_HOLD_MINUTES" >> "$GITHUB_OUTPUT"
            echo "home_exit_node=$INPUT_HOME_EXIT_NODE" >> "$GITHUB_OUTPUT"
            echo "use_home_exit=$INPUT_USE_HOME_EXIT" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up isolated Playwright runtime
        uses: ./packages/browser-agent-original-phase0-v10/runtime-v10

      - name: Install interactive desktop helpers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y x11vnc novnc websockify openbox xdotool

      - name: Connect runner to tailnet
        uses: ./.github/actions/connect-browser-tailnet-oidc
        with:
          client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tag: ${{ vars.TAILSCALE_NODE_TAG || 'tag:audit-browser' }}
          ping: ${{ steps.request.outputs.home_exit_node }}

      - name: Start interactive desktop and noVNC
        id: desktop
        shell: bash
        run: |
          set -euo pipefail

          Xvfb :99 -screen 0 1920x1080x24 -ac +extension RANDR >/tmp/active-screenshare-v2-xvfb-v1.log 2>&1 &
          echo $! >/tmp/active-screenshare-v2-xvfb-v1.pid

          for i in {1..20}; do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 1
          done
          xdpyinfo -display :99 >/dev/null 2>&1 || {
            echo "::error::Xvfb did not become ready"
            cat /tmp/active-screenshare-v2-xvfb-v1.log || true
            exit 1
          }

          DISPLAY=:99 openbox >/tmp/active-screenshare-v2-openbox-v1.log 2>&1 &
          echo $! >/tmp/active-screenshare-v2-openbox-v1.pid

          # x11vnc accepts keyboard and pointer input by default. It is deliberately
          # local-only; noVNC is the only service exposed on the tailnet.
          x11vnc             -display :99             -rfbport 5900             -listen 127.0.0.1             -nopw             -forever             -shared             -repeat             -noxdamage             >/tmp/active-screenshare-v2-x11vnc-v1.log 2>&1 &
          echo $! >/tmp/active-screenshare-v2-x11vnc-v1.pid

          # Expose the browser-based VNC client on all runner interfaces, including
          # the runner's private Tailscale interface, and proxy only to localhost VNC.
          websockify             --web=/usr/share/novnc             --heartbeat=30             0.0.0.0:6080             127.0.0.1:5900             >/tmp/active-screenshare-v2-novnc-v1.log 2>&1 &
          echo $! >/tmp/active-screenshare-v2-novnc-v1.pid

          ts_ip="$(tailscale ip -4 | head -n1)"
          test -n "$ts_ip"

          url="http://$ts_ip:6080/vnc.html?autoconnect=1&resize=scale&view_only=0&shared=1&reconnect=1"
          echo "TAILSCALE_RUNNER_IP=$ts_ip" >> "$GITHUB_ENV"
          echo "ACTIVE_SCREENSHARE_URL=$url" >> "$GITHUB_ENV"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify interactive transport
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..20}; do
            curl -fsS --connect-timeout 2 --max-time 3 http://127.0.0.1:6080/vnc.html >/dev/null 2>&1 && break
            sleep 1
          done

          curl -fsS --connect-timeout 3 --max-time 5 http://127.0.0.1:6080/vnc.html >/dev/null
          curl -fsS --connect-timeout 3 --max-time 5 "http://$TAILSCALE_RUNNER_IP:6080/vnc.html" >/dev/null

          python3 - <<'PY'
          import socket
          with socket.create_connection(("127.0.0.1", 5900), timeout=5) as s:
              banner = s.recv(12)
          if not banner.startswith(b"RFB "):
              raise SystemExit(f"Unexpected VNC handshake: {banner!r}")
          print("VNC handshake OK:", banner.decode(errors="replace").strip())
          PY

          python3 - <<'PY'
          import base64, os, socket
          key = base64.b64encode(os.urandom(16)).decode()
          request = (
              "GET /websockify HTTP/1.1\r\n"
              "Host: 127.0.0.1:6080\r\n"
              "Upgrade: websocket\r\n"
              "Connection: Upgrade\r\n"
              f"Sec-WebSocket-Key: {key}\r\n"
              "Sec-WebSocket-Version: 13\r\n\r\n"
          ).encode()
          with socket.create_connection(("127.0.0.1", 6080), timeout=5) as s:
              s.sendall(request)
              response = s.recv(4096)
          first = response.split(b"\r\n", 1)[0]
          if b"101" not in first:
              raise SystemExit(f"WebSocket upgrade failed: {first!r}")
          print("noVNC WebSocket upgrade OK:", first.decode(errors="replace"))
          PY

          echo "::notice title=Interactive Browser URL::$ACTIVE_SCREENSHARE_URL"
          {
            echo "### Interactive Browser v2"
            echo ""
            echo "$ACTIVE_SCREENSHARE_URL"
            echo ""
            echo "This session is interactive: mouse, keyboard, scrolling, and clicks are enabled."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Route Chrome through home exit
        if: steps.request.outputs.use_home_exit == 'true'
        shell: bash
        env:
          HOME_EXIT_NODE: ${{ steps.request.outputs.home_exit_node }}
        run: |
          set -euo pipefail
          timeout -k 5s 20s sudo tailscale set --exit-node="$HOME_EXIT_NODE"
          echo "Chrome traffic routed through requested home exit node."

      - name: Launch visible authenticated Chrome
        shell: bash
        env:
          BROWSER_AGENT_RUNTIME_ROOT: ${{ env.BROWSER_AGENT_RUNTIME_ROOT }}
        run: |
          set -euo pipefail

          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          export CHROME_EXECUTABLE="$chrome"
          echo "CHROME_EXECUTABLE=$chrome" >> "$GITHUB_ENV"

          state_args="null"
          if [ -n "${CHATGPT_STORAGE_STATE_B64:-}" ]; then
            printf '%s' "$CHATGPT_STORAGE_STATE_B64" | base64 --decode >/tmp/active-screenshare-v2-storage-v1.json
            state_args="'/tmp/active-screenshare-v2-storage-v1.json'"
          fi

          cat >/tmp/active-screenshare-v2-launch-v1.mjs <<'NODE'
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          const { chromium } = require(process.env.BROWSER_AGENT_RUNTIME_ROOT + '/node_modules/playwright-core');

          const storageState = process.env.HAS_STORAGE_STATE === 'true'
            ? '/tmp/active-screenshare-v2-storage-v1.json'
            : undefined;

          const browser = await chromium.launch({
            headless: false,
            executablePath: process.env.CHROME_EXECUTABLE,
            args: [
              '--no-sandbox',
              '--disable-dev-shm-usage',
              '--disable-quic',
              '--no-first-run',
              '--start-maximized'
            ]
          });

          const context = await browser.newContext({
            storageState,
            viewport: null
          });
          const page = await context.newPage();
          await page.goto('https://chatgpt.com/', { waitUntil: 'domcontentloaded', timeout: 120000 }).catch(() => {});
          console.log('ACTIVE_SCREENSHARE_CHROME_READY');
          await new Promise(() => {});
          NODE

          if [ -s /tmp/active-screenshare-v2-storage-v1.json ]; then
            export HAS_STORAGE_STATE=true
          else
            export HAS_STORAGE_STATE=false
          fi

          nohup node /tmp/active-screenshare-v2-launch-v1.mjs >/tmp/active-screenshare-v2-chrome-v1.log 2>&1 &
          echo $! >/tmp/active-screenshare-v2-chrome-v1.pid

          for i in {1..30}; do
            grep -q ACTIVE_SCREENSHARE_CHROME_READY /tmp/active-screenshare-v2-chrome-v1.log 2>/dev/null && break
            sleep 1
          done

          grep -q ACTIVE_SCREENSHARE_CHROME_READY /tmp/active-screenshare-v2-chrome-v1.log || {
            echo "::error::Visible Chrome did not become ready"
            cat /tmp/active-screenshare-v2-chrome-v1.log || true
            exit 1
          }

          echo "::notice title=Interactive Browser Ready::$ACTIVE_SCREENSHARE_URL"

      - name: Hold interactive session
        shell: bash
        env:
          HOLD_MINUTES: ${{ steps.request.outputs.hold_minutes }}
        run: |
          set -euo pipefail
          case "$HOLD_MINUTES" in
            ''|*[!0-9]*) HOLD_MINUTES=20 ;;
          esac
          if [ "$HOLD_MINUTES" -lt 1 ]; then HOLD_MINUTES=1; fi
          if [ "$HOLD_MINUTES" -gt 25 ]; then HOLD_MINUTES=25; fi

          echo "Interactive session is live at:"
          echo "$ACTIVE_SCREENSHARE_URL"
          echo "Holding for $HOLD_MINUTES minute(s)."
          sleep "$((HOLD_MINUTES * 60))"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          sudo tailscale set --exit-node=""
          for f in             /tmp/active-screenshare-v2-chrome-v1.pid             /tmp/active-screenshare-v2-novnc-v1.pid             /tmp/active-screenshare-v2-x11vnc-v1.pid             /tmp/active-screenshare-v2-openbox-v1.pid             /tmp/active-screenshare-v2-xvfb-v1.pid
          do
            [ -f "$f" ] && kill "$(cat "$f")" 2>/dev/null || true
          done
