name: BoostHub Fraxtal v40 source-bound compile (no tests)
on:
  push:
    branches: [boosthub-fraxtal-v40]
    paths:
      - 'github-native-sim/boosthub-fraxtal-v40/**'
      - '.github/workflows/boosthub-v13-full-stack-anvil-v1.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile exact Vyper and Solidity production contracts, no tests
        shell: bash
        run: |
          set -euo pipefail
          cd github-native-sim/boosthub-fraxtal-v40
          npm install --prefix dependencies --no-audit --no-fund --ignore-scripts --package-lock=false
          python -m pip install --disable-pip-version-check 'vyper==0.4.3'
          vyper --version
          python tooling/make_staking_artifact.py
          forge build script/DeployFraxtalSupplementV40.s.sol --force
      - name: Upload source-bound artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-fraxtal-v40-compile
          path: |
            github-native-sim/boosthub-fraxtal-v40/artifacts/staking.json
            github-native-sim/boosthub-fraxtal-v40/build/forge/
          if-no-files-found: warn
          retention-days: 7
