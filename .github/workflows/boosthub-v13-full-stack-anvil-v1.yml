name: BoostHub Fraxtal v41 fresh OmniRouter live fork and accounting
on:
  push:
    branches: [boosthub-fraxtal-v40]
    paths:
      - 'github-native-sim/boosthub-fraxtal-v40/**'
      - '.github/workflows/boosthub-v13-full-stack-anvil-v1.yml'
permissions:
  contents: write
concurrency:
  group: boosthub-fraxtal-v40-fork
  cancel-in-progress: true
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile exact v40 BoostHub production contracts and fork-only price fixture
        shell: bash
        run: |
          set -euo pipefail
          cd github-native-sim/boosthub-fraxtal-v40
          npm install --prefix dependencies --no-audit --no-fund --ignore-scripts --package-lock=false
          npm install --prefix dependencies --no-save --no-audit --no-fund --ignore-scripts --package-lock=false ethers@6.15.0
          python -m pip install --disable-pip-version-check 'vyper==0.4.3'
          python tooling/make_staking_artifact.py
          forge build script/DeployFraxtalSupplementV41.s.sol --force
          if [ -f market-creator/CurveYieldMorphoFeeSplitter.sol ]; then
            forge build market-creator/CurveYieldMorphoFeeSplitter.sol --force
          fi
      - name: Clone exact unmodified Morpho Blue and compile new Fraxtal IRM/oracles
        shell: bash
        run: |
          set -euo pipefail
          cd github-native-sim/boosthub-fraxtal-v40
          git clone --no-checkout https://github.com/morpho-org/morpho-blue.git .upstream-morpho
          git -C .upstream-morpho fetch --depth 1 origin 339a885801972740eb27f51da110a4675b839d42
          git -C .upstream-morpho checkout --detach 339a885801972740eb27f51da110a4675b839d42
          git -C .upstream-morpho submodule update --init --recursive --depth 1
          mkdir -p .upstream-morpho/src/fraxtal .upstream-morpho/script
          cp morpho-blue/src/fraxtal/*.sol .upstream-morpho/src/fraxtal/
          cp morpho-blue/script/DeployFraxtalMorpho.s.sol .upstream-morpho/script/
          forge build --root .upstream-morpho src/Morpho.sol src/fraxtal/CollateralYieldIRM.sol src/fraxtal/OmniRouterBeefyShareOracle.sol script/DeployFraxtalMorpho.s.sol --force
      - name: Perform Fraxtal live-state fork simulation, no broadcast to Fraxtal
        shell: bash
        env:
          RPC_FRAXTAL: ${{ secrets.RPC_FRAXTAL }}
        run: |
          set -euo pipefail
          FORK_SOURCE="${RPC_FRAXTAL:-https://fraxtal-rpc.publicnode.com}"
          if [ -n "${RPC_FRAXTAL:-}" ]; then echo "Using configured Fraxtal RPC"; else echo "Using PublicNode Fraxtal RPC"; fi
          mkdir -p github-native-sim/boosthub-fraxtal-v40/sim-results
          anvil --fork-url "$FORK_SOURCE" --chain-id 252 --port 8545 --host 127.0.0.1 --gas-limit 30000000 --block-time 1 > github-native-sim/boosthub-fraxtal-v40/sim-results/anvil.log 2>&1 &
          ANVIL_PID=$!
          trap 'kill "$ANVIL_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if [ "$(cast chain-id --rpc-url http://127.0.0.1:8545 2>/dev/null || true)" = 252 ]; then break; fi
            sleep 2
          done
          test "$(cast chain-id --rpc-url http://127.0.0.1:8545)" = 252
          export FORK_RPC=http://127.0.0.1:8545
          timeout -s TERM -k 5s 420s node github-native-sim/boosthub-fraxtal-v40/simulation/simulate_fraxtal_v1.cjs 2>&1 | tee github-native-sim/boosthub-fraxtal-v40/sim-results/run.log
      - name: Publish exact compiled creation and runtime bytecode for connected-wallet broadcasts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('github-native-sim/boosthub-fraxtal-v40')
          entries={
            'router':root/'build/forge/CurveYieldOmniRouter.sol/CurveYieldOmniRouter.json',
            'strategy':root/'build/forge/StrategyConvexBoostHubStakingV5.sol/StrategyConvexBoostHubStakingV5.json',
            'vault':root/'build/forge/BeefyVaultV7FixedV2.sol/BeefyVaultV7FixedV2.json',
            'morpho':root/'.upstream-morpho/out/Morpho.sol/Morpho.json',
            'irm':root/'.upstream-morpho/out/CollateralYieldIRM.sol/CollateralYieldIRM.json',
            'oracle':root/'.upstream-morpho/out/OmniRouterBeefyShareOracle.sol/OmniRouterBeefyShareOracle.json',
            'staking':root/'artifacts/staking.json',
          }
          folder=root/'broadcast-artifacts'
          folder.mkdir(parents=True,exist_ok=True)
          for name,filename in entries.items():
              item=json.loads(filename.read_text())
              b=item['bytecode']
              r=item.get('deployedBytecode','0x')
              creation=b['object'] if isinstance(b,dict) else b
              runtime=r['object'] if isinstance(r,dict) else r
              info={'abi':item['abi'],'bytecode':creation,'deployedBytecode':runtime}
              if name=='staking':
                  info['sourceSha256']=item['sourceSha256']
                  info['compilerVersion']=item['compilerVersion']
              (folder/(name+'.json')).write_text(json.dumps(info,separators=(',',':'))+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-native-sim/boosthub-fraxtal-v40/broadcast-artifacts/
          if ! git diff --cached --quiet; then
            git commit -m "Export exact v41 source-bound compiled bytecodes for approved broadcasts [skip ci]"
            git push origin HEAD:boosthub-fraxtal-v40
          fi
      - name: Keep source, simulation, state and compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-fraxtal-v41-fresh-router-real-routes-fork-v2
          path: |
            github-native-sim/boosthub-fraxtal-v40/sim-results/
            github-native-sim/boosthub-fraxtal-v40/artifacts/staking.json
            github-native-sim/boosthub-fraxtal-v40/contracts/CurveYieldOmniRouter.sol
            github-native-sim/boosthub-fraxtal-v40/script/DeployFraxtalSupplementV41.s.sol
            github-native-sim/boosthub-fraxtal-v40/simulation/simulate_fraxtal_v1.cjs
            github-native-sim/boosthub-fraxtal-v40/build/forge/*/*.json
            github-native-sim/boosthub-fraxtal-v40/.upstream-morpho/out/Morpho.sol/Morpho.json
            github-native-sim/boosthub-fraxtal-v40/.upstream-morpho/out/CollateralYieldIRM.sol/CollateralYieldIRM.json
            github-native-sim/boosthub-fraxtal-v40/.upstream-morpho/out/OmniRouterBeefyShareOracle.sol/OmniRouterBeefyShareOracle.json
          if-no-files-found: warn
          retention-days: 7
