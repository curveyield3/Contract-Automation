name: BoostHub v65 shared vault and strategy compilation
on:
  push:
    branches: [simulation/boosthub-v65-shared-implementation-compile-v1]
    paths: ['github-native-sim/boosthub-v13-full-stack-v1/safe-v62-fork-v2.cjs']
permissions:
  contents: read
jobs:
  safe-vault-gas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROOT: .safe-v64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Materialize exact uploaded v64 source using retained v61 and v63 files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,io,lzma,pathlib,tarfile
          root=pathlib.Path('.safe-v64');root.mkdir(exist_ok=True)
          base=pathlib.Path('github-native-sim/boosthub-v13-full-stack-v1/source')
          x=(base/'BoostHub_v61_SDT_v8_Source_Bundle_v1.md').read_text().strip().splitlines()
          assert x[0]=='BOOSTHUB_V61_SDT_V8_XZ_BASE64_V1'
          raw=base64.b64decode(x[1],validate=True)
          assert hashlib.sha256(raw).hexdigest()=='31160e9e19c22a95db298893563b1d15150958f72330c02a3510f32cfefd98aa'
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(raw))) as t:
              t.extractall(root,filter='data')
          c=root/'contracts'
          old=c/'BeefyVaultV7FixedV2.sol'
          v63=(base/'BeefyVaultV7FixedV2_v63.sol').read_bytes()
          assert hashlib.sha256(v63).hexdigest()=='6b150c72b1d33609f452e1809719a1da4ba3b929011ea16e65fba7dbbfbec245'
          (c/'BeefyCurveYieldVaultv8.sol').write_bytes(v63.replace(b'BeefyVaultV7FixedV2',b'BeefyCurveYieldVaultv8'))
          old.unlink()
          expected={
              'BaseAllToWantBoostHubV5.sol':'5697ec68f2d93e9931677980300774e9c65faf085f57f1efb00801be62504453',
              'BeefyCurveYieldVaultv8.sol':'ce25fb6139ef9dbc62f34ff465cbdf96224f3dde2714bc7533e38b1a3d10f1e5',
              'StrategyBoostHubChildV42.sol':'16cbc2696794a348543433512575c64dc76c1e44e2c437cbf7fce59e15f701bc',
              'StrategyConvexBoostHubStakingV5.sol':'7db200d36276e7a8cab179f99ce9c47fba824f6500fd1138f56b84ed3cd054d0',
              'StrategyConvexFXNPool8V42.sol':'4487687523a79879d879e731074a09250021d00e725515ac43caec625b8741b4',
              'StrategyDualFXNMasterV42.sol':'db76c69e004d6f97108b625dad83520cb996c02618ab30dbfe3dbd26d1d99288',
              'interfaces/IBeefySwapperV2.sol':'cfea0ac9bfa9980f316d1cb246c788b40631bc625b19b8a0c7279af32eb2ad65',
              'interfaces/IBoostHubStakingV1.sol':'90f7579d64fdb8727d1c6bd52f7bcdf49dbb0752c44f00a55ceac109a99fd6be',
              'interfaces/IStrategyBoostHubV1.sol':'d3b3ccae007294a9d572623a4e8c9da3162f4463328152b14041241d385b1c98'
          }
          for file,digest in expected.items():
              actual=hashlib.sha256((c/file).read_bytes()).hexdigest()
              print('SOURCE_SHA256',file,actual,flush=True)
              assert actual==digest, f'Uploaded source mismatch: {file}'
          print('UPLOADED_V64_ALL_TRANSITIVE_SOURCES_MATCH')
          # Only exact transitive sources for the six deployments are needed.
          for f in c.rglob('*.sol'):
              if str(f.relative_to(c)) not in expected: f.unlink()
          (root/'foundry.toml').write_text('''[profile.default]
          src = "contracts"
          script = "script"
          out = "build/forge"
          libs = ["dependencies/node_modules"]
          remappings = [
            "@openzeppelin/contracts/=dependencies/node_modules/@openzeppelin/contracts/",
            "@openzeppelin-4/contracts/=dependencies/node_modules/@openzeppelin-4/contracts/",
            "@openzeppelin-5/contracts/=dependencies/node_modules/@openzeppelin-5/contracts/",
            "@openzeppelin/contracts-upgradeable/=dependencies/node_modules/@openzeppelin/contracts-upgradeable/",
            "solmate/src/=dependencies/solmate/src/"
          ]
          auto_detect_solc = true
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          fs_permissions = [
            { access = "read", path = "./contracts" },
            { access = "read", path = "./artifacts" }
          ]

          [fmt]
          line_length = 120
          ''')
          PY
      - name: Apply exact v65 vault changes and verify uploaded source hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,lzma,pathlib,hashlib,subprocess,json
          root=pathlib.Path('.safe-v64')
          p=json.loads(pathlib.Path('github-native-sim/boosthub-v13-full-stack-v1/safe-v62-fork-v2.cjs').read_text())
          def unpack(key,digest):
              b=lzma.decompress(base64.b64decode(p[key],validate=True))
              assert hashlib.sha256(b).hexdigest()==digest,key
              return b
          patch=root/'v65.patch'
          patch.write_bytes(unpack('patch','745f9b983369f0def18bb04f165709e513c91dc1c805676283dbb153714f11c5'))
          subprocess.run(['patch','-p1','--batch','--forward','-i',str(patch.resolve())],cwd=root,check=True)
          patch.unlink()
          (root/'contracts/StrategyBoostHubChildV42.sol').unlink()
          if (root/'script').exists():
              import shutil
              shutil.rmtree(root/'script')
          (root/'script').mkdir()
          (root/'script/DeployBoostHubVaultsV57.s.sol').write_bytes(unpack('script','cb3de1d6cb50154714543414899db959046e88d8efe81aadd9e6ffd65fd8a331'))
          (root/'contracts/interfaces/IBoostHub.sol').write_bytes(unpack('hub','7435f5664dd82c68307f1cc0d8e072cc4405436d8968f7adeb2f4e3eaa1cf793'))
          expected={
              'BaseAllToWantBoostHubV5.sol':'1cb67cdad7ae7c140af809e3ead6eea02c8bb600ab364cda23d943c1ae745bc8',
              'BeefyCurveYieldVaultv8.sol':'7cd66d50c5145cd3dc579d93de38546da24e306319c4a1a50b926215ca2d523a',
              'StrategyConvexBoostHubStakingV5.sol':'6d7b80d018181224095f138b06a38fecf574fa5996bfea362d2b1032ee37703e',
              'StrategyConvexFXNPool8V42.sol':'44dfa8e49df7286fec66cc185aa356d72fc273e35b59c248cfdc1d07bf94ba6c',
              'StrategyDualFXNMasterV42.sol':'50370755e4d59f5f7c8779cff472e98d0ab9616f441df8d7aff37bcd3498c0e5',
              'BoostHubInitializedClone.sol':'e80b779b51d97843b8104772f17cdfad2204b34b54d5826a39c16dd56d260ff6'
          }
          for f,d in expected.items():
              h=hashlib.sha256((root/'contracts'/f).read_bytes()).hexdigest()
              assert h==d,(f,h,d)
              print('V65_SOURCE_MATCH',f,h)
          PY
      - name: Compile v65 target contracts and deployment script, optimizer 200 and sweeps
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$ROOT/dependencies" --no-save --ignore-scripts --no-audit --no-fund '@openzeppelin-4/contracts@npm:@openzeppelin/contracts@4.9.6' '@openzeppelin/contracts@5.4.0' '@openzeppelin/contracts-upgradeable@4.9.6'
          for RUNS in 200 1 25 50; do
            echo "COMPILER_RUNS=$RUNS"
            FOUNDRY_OPTIMIZER_RUNS="$RUNS" forge build --root "$ROOT" --use 0.8.28 --force --skip test
            python3 - "$RUNS" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path('.safe-v64/build/forge')
          names=['BeefyCurveYieldVaultv8','StrategyConvexBoostHubStakingV5','StrategyDualFXNMasterV42','StrategyConvexFXNPool8V42','BoostHubInitializedClone']
          out={}
          for n in names:
              a=json.loads((root/(n+'.sol')/(n+'.json')).read_text())
              out[n]={'runtime':len(bytes.fromhex(a['deployedBytecode']['object'][2:])),'creation':len(bytes.fromhex(a['bytecode']['object'][2:]))}
          a=json.loads((root/'DeployBoostHubVaultsV57.s.sol'/'DeployBoostHubVaultsV57.json').read_text())
          assert a['bytecode']['object']!='0x'
          print('V65_METRICS',sys.argv[1],json.dumps(out))
          PY
          done
