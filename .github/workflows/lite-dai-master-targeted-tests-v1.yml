name: Lite DAI Master Targeted Tests v1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lite-dai-master-targeted-tests-v1.yml'
      - 'process/dai-master-targeted-tests/trigger_v1.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/lite-dai-master-targeted-tests-v1.yml'
      - 'process/dai-master-targeted-tests/trigger_v1.json'

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact DAI compiler unit and install isolated EVM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dai-targeted-raw
          cp process/dai-master-targeted-tests/source-compiler-unit_v1.json dai-targeted-raw/compiler-unit.json
          sha256sum dai-targeted-raw/compiler-unit.json > dai-targeted-raw/COMPILER_UNIT_SHA256_v1.txt
          set +e
          npm install --prefix /tmp/dai-targeted-deps --no-package-lock --no-audit --no-fund solc@0.5.12 ethers@6.15.0 ganache@7.9.2 > dai-targeted-raw/INSTALL_LOG_v1.txt 2>&1
          code=$?
          echo "$code" > dai-targeted-raw/INSTALL_EXIT_v1.txt
          exit 0
      - name: Execute real EVM assertions, chain reads and preserve traces
        env:
          ETHEREUM_RPC: ${{ secrets.ETHEREUM_RPC }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        shell: bash
        run: |
          set +e
          NODE_PATH=/tmp/dai-targeted-deps/node_modules node > dai-targeted-raw/EXECUTION_LOG_v1.txt 2>&1 <<'NODE'
          const fs=require('fs'), crypto=require('crypto');
          const root='dai-targeted-raw/';
          const request='9a2224086736252ebea4be900c7f5574407a30a814a669b973c5e56e7f1197e4';
          const ids=['X001-ADMIN-LOCKOUT','X001-ALLOWANCE-RACE','X001-ROLE-VERIFY'];
          const out={schemaVersion:'dai-targeted-evm-raw-v1',campaignId:'live-ethereum-dai-6b175474-r2',requestId:request,sourceSha256:'457b6121c4a613730251f2f81ae17d27c9c08674696b73d1f5828c623e705ee5',runnerUrl:'https://github.com/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID,runnerCommit:process.env.GITHUB_SHA,candidates:{},traces:[],historical:{},errors:[],toolchain:{node:process.version}};
          for(const id of ids)out.candidates[id]={executedCalls:0,assertions:[],failedAssertions:0,notes:[]};
          const record=(id,label,ok,details)=>{out.candidates[id].assertions.push({label,pass:!!ok,details});if(!ok)out.candidates[id].failedAssertions++;console.log(JSON.stringify({candidate:id,label,pass:!!ok,details}));};
          const note=(id,message)=>out.candidates[id].notes.push(message);
          const sha=x=>crypto.createHash('sha256').update(x).digest('hex');
          const save=()=>fs.writeFileSync(root+'EXECUTION_v1.json',JSON.stringify(out,null,2)+'\n');
          const U=(v)=>String(v);
          async function main(){
            const ethers=require('ethers'),ganache=require('ganache'),solc=require('solc');
            out.toolchain.solc=solc.version();out.toolchain.ethers=ethers.version;out.toolchain.ganache='7.9.2';
            const unit=JSON.parse(fs.readFileSync(root+'compiler-unit.json','utf8'));
            const source=unit.input.sources['Dai.sol'].content;
            const input=JSON.parse(JSON.stringify(unit.input));
            input.settings.outputSelection={'*':{'*':['abi','evm.bytecode.object','evm.deployedBytecode.object','evm.methodIdentifiers']}};
            const compiled=JSON.parse(solc.compile(JSON.stringify(input)));
            if(compiled.errors&&compiled.errors.some(x=>x.severity==='error'))throw Error(JSON.stringify(compiled.errors));
            const artifact=compiled.contracts['Dai.sol'].Dai;
            const runtime=artifact.evm.deployedBytecode.object, bytecode='0x'+artifact.evm.bytecode.object;
            const methods=artifact.abi.filter(x=>x.type==='function').map(x=>x.name);
            out.source={compiler:solc.version(),unitCompiler:unit.compilerVersion,unitInputSha256:sha(Buffer.from(JSON.stringify(unit.input))),soliditySourceSha256:sha(Buffer.from(source)),compiledRuntimeSha256:sha(Buffer.from(runtime,'hex')),compiledRuntimeKeccak256:ethers.keccak256('0x'+runtime),creationBytecodeSha256:sha(Buffer.from(bytecode.slice(2),'hex')),compiledRuntimeBytes:runtime.length/2,methods,sourceAuthMethods:['rely','deny','mint'],noExternalRecoveryFunction:!methods.some(x=>/recover|unpause|bootstrap|initialize|grantWard/.test(x))};
            fs.writeFileSync(root+'SOURCE_BUILD_v1.json',JSON.stringify(out.source,null,2)+'\n');
            const g=ganache.provider({logging:{quiet:true},chain:{chainId:1,hardfork:'shanghai',vmErrorsOnRPCResponse:false},wallet:{deterministic:true,totalAccounts:12,defaultBalance:100},miner:{blockGasLimit:30000000}});
            const provider=new ethers.BrowserProvider(g);
            const signers=await Promise.all(Array.from({length:8},(_,i)=>provider.getSigner(i)));
            const addresses=await Promise.all(signers.map(x=>x.getAddress()));
            const [A,B,C,D,H,S,T,R]=addresses;
            out.syntheticActors={A,B,C,D,H,S,T,R,chainId:1};
            const iface=new ethers.Interface(artifact.abi);
            const deployed=[];
            async function deploy(id){
              const factory=new ethers.ContractFactory(artifact.abi,bytecode,signers[0]);
              const d=await factory.deploy(1n,{gasLimit:4000000n});const receipt=await d.deploymentTransaction().wait();await d.waitForDeployment();
              const at=await d.getAddress();const code=await provider.getCode(at);
              const f={contract:d,address:at,constructorTx:receipt.hash,constructorGas:U(receipt.gasUsed),runtimeSha256:sha(Buffer.from(code.slice(2),'hex'))};
              deployed.push({candidate:id,address:at,creationTx:receipt.hash,runtimeSha256:f.runtimeSha256});
              record(id,'deployed code equals exact compiled runtime',code.slice(2).toLowerCase()===runtime.toLowerCase(),{runtimeSha256:f.runtimeSha256});
              return f;
            }
            const snapshot=async(d)=>({
              wards:Object.fromEntries(await Promise.all([A,B,C,D].map(async x=>[x,U(await d.wards(x))]))),
              balances:Object.fromEntries(await Promise.all([A,B,C,D,H,S,T,R].map(async x=>[x,U(await d.balanceOf(x))]))),
              allowanceHS:U(await d.allowance(H,S)),
              allowanceHD:U(await d.allowance(H,D)),
              supply:U(await d.totalSupply()),
              nonceH:U(await d.nonces(H))
            });
            async function act(id,label,f,actor,method,args,shouldSucceed){
              const caller=await actor.getAddress(),before=await snapshot(f.contract),data=iface.encodeFunctionData(method,args);
              let receipt=null,hash=null,error=null,success=false,trace=null;
              try{
                const tx=await actor.sendTransaction({to:f.address,data,gasLimit:800000n});
                hash=tx.hash;
                try{receipt=await tx.wait();success=receipt.status===1;}catch(e){
                  error=String(e.shortMessage||e.message).slice(0,1200);
                  receipt=e.receipt||await provider.getTransactionReceipt(hash).catch(()=>null);
                  success=receipt?.status===1;
                }
              }catch(e){error=String(e.shortMessage||e.message).slice(0,1200);}
              const after=await snapshot(f.contract);
              trace={candidateId:id,label,contract:f.address,from:caller,method,args:args.map(U),calldata:data,txHash:hash,receipt:receipt?{status:receipt.status,blockNumber:receipt.blockNumber,gasUsed:U(receipt.gasUsed),logs:receipt.logs.map(l=>({topics:l.topics,data:l.data,address:l.address}))}:null,error,expectedSuccess:shouldSucceed,observedSuccess:success,before,after};
              out.traces.push(trace);
              if(receipt)out.candidates[id].executedCalls++;
              record(id,label+' transaction outcome',success===shouldSucceed,{hash,receiptStatus:receipt?.status,error});
              if(!shouldSucceed)record(id,label+' reverted without storage/log mutation',!success&&JSON.stringify(before)===JSON.stringify(after)&&(!receipt||receipt.logs.length===0),{hash,receiptStatus:receipt?.status});
              return trace;
            }
            const admin=ids[0],race=ids[1],role=ids[2];
            {
              const f=await deploy(admin), d=f.contract;
              await act(admin,'healthy A rely(D)',f,signers[0],'rely',[D],true);
              await act(admin,'healthy A mint(D,1)',f,signers[0],'mint',[D,1n],true);
              for(const [label,method,args] of [['C rely','rely',[D]],['C deny','deny',[A]],['C mint','mint',[D,1n]]]) await act(admin,label,f,signers[2],method,args,false);
            }
            {
              const f=await deploy(admin),d=f.contract;
              await act(admin,'sole ward A funds H 500',f,signers[0],'mint',[H,500n],true);
              record(admin,'sole fixture exactly one known ward',U(await d.wards(A))==='1'&&[B,C,D].every(x=>out.syntheticActors.A!==x),{wards:await Promise.all([A,B,C,D].map(async x=>U(await d.wards(x))))});
              await act(admin,'sole ward A deny(A)',f,signers[0],'deny',[A],true);
              record(admin,'sole A,B,C,D ward getters zero', (await Promise.all([A,B,C,D].map(x=>d.wards(x)))).every(x=>x===0n),{});
              for(const idx of [0,2,3]){await act(admin,'post deny actor '+idx+' rely(D)',f,signers[idx],'rely',[D],false);await act(admin,'post deny actor '+idx+' mint(D,1)',f,signers[idx],'mint',[D,1n],false);}
              await act(admin,'post deny H transfer(T,1)',f,signers[4],'transfer',[T,1n],true);
              record(admin,'public ABI has no alternative authority recovery path',out.source.noExternalRecoveryFunction&&methods.filter(x=>['rely','deny','mint'].includes(x)).length===3,{methods});
              note(admin,'Sole ward is a synthetic deployed fixture, NOT the real mainnet roster.');
            }
            {
              const f=await deploy(admin);
              await act(admin,'two-ward A rely(B)',f,signers[0],'rely',[B],true);
              await act(admin,'two-ward A deny(A)',f,signers[0],'deny',[A],true);
              await act(admin,'remaining B rely(D)',f,signers[1],'rely',[D],true);
              await act(admin,'remaining B mint(H,1)',f,signers[1],'mint',[H,1n],true);
              await act(admin,'unwarded A mint(H,1)',f,signers[0],'mint',[H,1n],false);
              await act(admin,'unwarded C mint(H,1)',f,signers[2],'mint',[H,1n],false);
            }
            async function allowanceFixture(label){
              const f=await deploy(race);await act(race,label+' fund H',f,signers[0],'mint',[H,1000n],true);return f;
            }
            {
              const f=await allowanceFixture('control A');
              await act(race,'control approve 100',f,signers[4],'approve',[S,100n],true);
              await act(race,'control spend 100',f,signers[5],'transferFrom',[H,T,100n],true);
              await act(race,'control overspend 1',f,signers[5],'transferFrom',[H,T,1n],false);
              record(race,'control remaining allowance zero',(await f.contract.allowance(H,S))===0n,{});
            }
            {
              const f=await allowanceFixture('control B');
              await act(race,'replacement approve 100',f,signers[4],'approve',[S,100n],true);
              await act(race,'replacement approve 50',f,signers[4],'approve',[S,50n],true);
              await act(race,'replacement spend 50',f,signers[5],'transferFrom',[H,T,50n],true);
              await act(race,'replacement overspend 1',f,signers[5],'transferFrom',[H,T,1n],false);
            }
            {
              const f=await allowanceFixture('adversarial'),d=f.contract;
              const h0=await d.balanceOf(H),t0=await d.balanceOf(T),sup0=await d.totalSupply();
              await act(race,'adversarial approve 100',f,signers[4],'approve',[S,100n],true);
              await act(race,'adversarial front-run spend 100',f,signers[5],'transferFrom',[H,T,100n],true);
              await act(race,'adversarial replace approve 50',f,signers[4],'approve',[S,50n],true);
              await act(race,'adversarial spend 50',f,signers[5],'transferFrom',[H,T,50n],true);
              await act(race,'adversarial overspend 1',f,signers[5],'transferFrom',[H,T,1n],false);
              const metrics={holderDebit:U(h0-await d.balanceOf(H)),recipientCredit:U((await d.balanceOf(T))-t0),supplyDelta:U((await d.totalSupply())-sup0),finalAllowance:U(await d.allowance(H,S))};
              record(race,'ordered adversarial debit 150 credit 150 supply unchanged allowance zero',metrics.holderDebit==='150'&&metrics.recipientCredit==='150'&&metrics.supplyDelta==='0'&&metrics.finalAllowance==='0',metrics);
              out.candidates[race].economicMeasurements=metrics;
            }
            {
              const f=await allowanceFixture('zero control');
              await act(race,'zero-control approve 100',f,signers[4],'approve',[S,100n],true);
              await act(race,'zero-control reset 0',f,signers[4],'approve',[S,0n],true);
              await act(race,'zero-control grant 50',f,signers[4],'approve',[S,50n],true);
              await act(race,'zero-control spend 50',f,signers[5],'transferFrom',[H,T,50n],true);
              await act(race,'zero-control overspend',f,signers[5],'transferFrom',[H,T,1n],false);
            }
            {
              const f=await allowanceFixture('infinity control');
              const max=(1n<<256n)-1n;
              await act(race,'infinity approve max',f,signers[4],'approve',[S,max],true);
              await act(race,'infinity spend 1',f,signers[5],'transferFrom',[H,T,1n],true);
              record(race,'max allowance remains unchanged after spend',await f.contract.allowance(H,S)===max,{});
            }
            {
              const f=await deploy(role),d=f.contract;
              const sep=await d.DOMAIN_SEPARATOR();
              const domain={name:'Dai Stablecoin',version:'1',chainId:1,verifyingContract:f.address};
              const expected=ethers.TypedDataEncoder.hashDomain(domain);
              record(role,'fixture domain equals typed-domain chain 1 hash',sep===expected,{stored:sep,expected,domain});
              const keys=g.getInitialAccounts();const key=keys[H.toLowerCase()].secretKey;
              const wallet=new ethers.Wallet(key);
              const fields={Permit:[{name:'holder',type:'address'},{name:'spender',type:'address'},{name:'nonce',type:'uint256'},{name:'expiry',type:'uint256'},{name:'allowed',type:'bool'}]};
              const expiry=BigInt(Math.floor(Date.now()/1000)+3600);
              const params={holder:H,spender:S,nonce:0n,expiry,allowed:true};
              const signature=async(dom,p)=>ethers.Signature.from(await wallet.signTypedData(dom,fields,p));
              const callPermit=async(label,dom,p,shouldSucceed,overrides={})=>{
                const sig=await signature(dom,p);
                const x={...p,...overrides};
                const args=[x.holder,x.spender,x.nonce,x.expiry,x.allowed,sig.v,sig.r,sig.s];
                return act(role,label,f,signers[7],'permit',args,shouldSucceed);
              };
              await callPermit('valid permit',domain,params,true);
              const max=(1n<<256n)-1n;
              record(role,'valid permit nonce increments and allowance max',(await d.nonces(H))===1n&&(await d.allowance(H,S))===max,{nonce:U(await d.nonces(H)),allowance:U(await d.allowance(H,S))});
              await callPermit('replay nonce zero',domain,params,false);
              const p1={...params,nonce:1n};
              await callPermit('altered spender signature',domain,p1,false,{spender:T});
              await callPermit('altered allowed signature',domain,p1,false,{allowed:false});
              await callPermit('wrong-chain signature',{...domain,chainId:5},p1,false);
              await callPermit('wrong-contract signature',{...domain,verifyingContract:D},p1,false);
              await callPermit('expired signature',domain,{...p1,expiry:1n},false);
              record(role,'invalid permits did not increment nonce or change allowance',(await d.nonces(H))===1n&&(await d.allowance(H,S))===max,{});
              await callPermit('valid disallow',domain,{...p1,allowed:false},true);
              record(role,'valid disallow clears allowance and increments nonce',(await d.nonces(H))===2n&&(await d.allowance(H,S))===0n,{});
              out.candidates[role].signatureVectors={domain,expectedSeparator:expected,validSignature:U(await wallet.signTypedData(domain,fields,params)),invalidDomains:[{...domain,chainId:5},{...domain,verifyingContract:D}]};
            }
            out.deployments=deployed;
            const target='0x6b175474e89094c44da98b954eedeac495271d0f',block='0x'+(26253174).toString(16),hash='0x2f25fb08063d74fbdc6eaf56d1482019b6055b07c72c6b14c46d48df1ab7f83f';
            let chain=null,endpoint=null,failures=[];
            const candidates=[process.env.ETHEREUM_RPC,'https://ethereum-rpc.publicnode.com','https://eth.llamarpc.com'].filter(Boolean);
            async function rpc(url,method,params){
              const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),18000);
              try{const res=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params}),signal:ctrl.signal});const o=await res.json();if(o.error)throw Error(JSON.stringify(o.error));if(!res.ok)throw Error('HTTP '+res.status);return o.result;}finally{clearTimeout(timer)}
            }
            for(const url of candidates){try{let b=await rpc(url,'eth_getBlockByNumber',[block,false]);if(!b||b.hash?.toLowerCase()!==hash)throw Error('frozen block hash mismatch or missing: '+b?.hash);endpoint=url;chain=b;break;}catch(e){failures.push({url,error:String(e).slice(0,350)})}}
            out.historical={target,blockNumber:26253174,expectedBlockHash:hash,endpoint,endpointErrors:failures,blockHash:chain?.hash||null,readOnly:true};
            if(chain){
              try{
                const code=await rpc(endpoint,'eth_getCode',[target,block]);
                out.historical.deployedRuntimeSha256=sha(Buffer.from(code.slice(2),'hex'));
                out.historical.runtimeMatchesCompiled=code.toLowerCase()==='0x'+runtime.toLowerCase();
                const sepData=iface.encodeFunctionData('DOMAIN_SEPARATOR',[]);
                const sepHex=await rpc(endpoint,'eth_call',[{to:target,data:sepData},block]);
                const actual=iface.decodeFunctionResult('DOMAIN_SEPARATOR',sepHex)[0];
                const expectedMainnet=ethers.TypedDataEncoder.hashDomain({name:'Dai Stablecoin',version:'1',chainId:1,verifyingContract:target});
                out.historical.domainSeparator={stored:actual,expected:expectedMainnet,equal:actual===expectedMainnet,encodedDomain:{name:'Dai Stablecoin',version:'1',chainId:1,verifyingContract:target}};
                const supply=await rpc(endpoint,'eth_call',[{to:target,data:iface.encodeFunctionData('totalSupply',[])},block]);
                out.historical.totalSupply=U(iface.decodeFunctionResult('totalSupply',supply)[0]);
                record(role,'frozen mainnet stored domain equality is bound to verified hash',actual===expectedMainnet,{blockHash:chain.hash,stored:actual,expected:expectedMainnet});
                record(role,'historical runtime identical to compiled source',out.historical.runtimeMatchesCompiled,{onchainSha256:out.historical.deployedRuntimeSha256,compiledSha256:out.source.compiledRuntimeSha256});
              }catch(e){out.historical.readError=String(e)}
              const selector1=iface.getFunction('rely').selector.slice(2).padEnd(64,'0');
              const selector2=iface.getFunction('deny').selector.slice(2).padEnd(64,'0');
              const topic0=['0x'+selector1,'0x'+selector2];
              try{const logs=await rpc(endpoint,'eth_getLogs',[{address:target,fromBlock:'0x0',toBlock:block,topics:[topic0]}]);out.historical.fullRoleLogAttempt={success:true,count:logs.length,logs:logs.map(x=>({blockNumber:x.blockNumber,transactionHash:x.transactionHash,topics:x.topics,data:x.data}))};}catch(e){out.historical.fullRoleLogAttempt={success:false,error:String(e).slice(0,900)};}
              try{const from='0x'+(26252174).toString(16);const logs=await rpc(endpoint,'eth_getLogs',[{address:target,fromBlock:from,toBlock:block,topics:[topic0]}]);out.historical.recentRoleLogSample={fromBlock:26252174,toBlock:26253174,count:logs.length,logs};}catch(e){out.historical.recentRoleLogSample={error:String(e).slice(0,900)}}
              if(process.env.ETHERSCAN_API_KEY){
                try{
                  const q=new URL('https://api.etherscan.io/v2/api');for(const [k,v]of Object.entries({chainid:'1',module:'contract',action:'getcontractcreation',contractaddresses:target,apikey:process.env.ETHERSCAN_API_KEY}))q.searchParams.set(k,v);
                  const res=await fetch(q);const j=await res.json();out.historical.creationLookup={status:j.status,message:j.message,result:j.result};
                  if(j.status==='1'&&j.result?.length){
                    const creator=j.result[0].contractCreator;
                    const returned=await rpc(endpoint,'eth_call',[{to:target,data:iface.encodeFunctionData('wards',[creator])},block]);
                    out.historical.deployerWard={creator,ward:U(iface.decodeFunctionResult('wards',returned)[0])};
                  }
                }catch(e){out.historical.creationLookup={error:String(e).slice(0,700)}}
              }else out.historical.creationLookup={error:'ETHERSCAN_API_KEY secret unavailable'};
            }
            out.historical.effectiveRosterComplete=false;
            note(role,'No complete authenticated genesis-to-block role replay established; live effective ward roster and intended governance policy INCONCLUSIVE.');
            note(admin,'Live sole-ward exposure remains INCONCLUSIVE without authenticated exhaustive effective roster and policy.');
            for(const id of ids)out.candidates[id].assertionCount=out.candidates[id].assertions.length;
            save();
          }
          main().then(()=>{save();console.log('RUN_COMPLETE '+JSON.stringify(Object.fromEntries(Object.entries(out.candidates).map(([k,v])=>[k,{calls:v.executedCalls,assertions:v.assertionCount,failed:v.failedAssertions}]))));}).catch(e=>{out.errors.push({fatal:String(e),stack:String(e?.stack||'').slice(0,4000)});save();console.error('RUN_FATAL',e);process.exitCode=1;});
          NODE
          echo "$?" > dai-targeted-raw/EXECUTION_EXIT_v1.txt
          {
            node --version
            npm --version
            sha256sum dai-targeted-raw/compiler-unit.json
            cat dai-targeted-raw/INSTALL_EXIT_v1.txt
            cat dai-targeted-raw/EXECUTION_EXIT_v1.txt
          } > dai-targeted-raw/TOOLCHAIN_v1.txt
          exit 0
      - name: Build SHA-256 bound raw results and digest-bound master result
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const root='dai-targeted-raw/';
          const dest='campaigns/live-ethereum-Dai-6b175474 r2/evidence/master-targeted-tests/9a2224086736252ebea4be900c7f5574407a30a814a669b973c5e56e7f1197e4/';
          const x=fs.existsSync(root+'EXECUTION_v1.json')?JSON.parse(fs.readFileSync(root+'EXECUTION_v1.json')):null;
          const ids=['X001-ADMIN-LOCKOUT','X001-ALLOWANCE-RACE','X001-ROLE-VERIFY'];
          const files=fs.readdirSync(root).filter(f=>fs.statSync(root+f).isFile()).sort();
          const evidence=files.map(f=>({path:dest+f,sha256:crypto.createHash('sha256').update(fs.readFileSync(root+f)).digest('hex')}));
          const tests=ids.map(id=>{
            const t=x?.candidates?.[id];
            const done=t&&t.executedCalls>0&&t.assertions.length>0&&t.failedAssertions===0&&!x.errors.length;
            const conclusive=done&&(id==='X001-ADMIN-LOCKOUT'||id==='X001-ALLOWANCE-RACE');
            return {candidateId:id,disposition:conclusive?'CONFIRMED':'INCONCLUSIVE',
              executionNarrative:id==='X001-ROLE-VERIFY'?'Isolated exact-compiled-code permit signature and invalid-signature controls; independently attempted frozen Ethereum mainnet runtime/domain reads and full authority-log enumeration; do not conflate fixture with deployed roster.':'Executed exact Solidity 0.5.12 Dai bytecode with isolated Ganache EVM accounts, mined transaction receipts, pre/post getter snapshots and explicit adversarial ordering. Synthetic local roles/funding are not live Ethereum state. '+(x?.runnerUrl||''),
              observedAssertions:t?JSON.stringify({assertions:t.assertions.length,failed:t.failedAssertions,executedCalls:t.executedCalls,sample:t.assertions.map(a=>({label:a.label,pass:a.pass}))}):'No executable result produced',
              impactAssessment:id==='X001-ALLOWANCE-RACE'?'When prior allowance A=100 is spent before replacement B=50, recorded cumulative debit should be 150 raw base units, 100 above intended new cap, bounded by holder balance.':id==='X001-ADMIN-LOCKOUT'?'Conditional authority liveness loss after last-ward removal in isolated fixture. Existing user transfers remain available; no proven live compromise or dollar loss.':'Potential unbounded ward mint power if held by an authorized ward, but actual effective live roster/policy unresolved. Valid max-permit allowance only risks holders that sign it.',
              executedCalls:t?.executedCalls||0,evidence,
              ...(!conclusive?{remainingUncertainty:id==='X001-ROLE-VERIFY'?'Complete authenticated deployment-to-frozen-block rely/deny event replay, constructor deployer identity and governance policy required; correlate archive RPC, Etherscan creation/events, and final wards getters. Verify any RPC read errors.':'Machine execution incomplete or assertions failed; inspect raw logs and rerun qualified EVM controls.'}:{})};
          });
          const result={schemaVersion:'curveyield-lite-master-targeted-test-result-v1',campaignId:'live-ethereum-dai-6b175474-r2',segmentId:'reviewer-2-phase-04',requestId:'9a2224086736252ebea4be900c7f5574407a30a814a669b973c5e56e7f1197e4',sourceSha256:'457b6121c4a613730251f2f81ae17d27c9c08674696b73d1f5828c623e705ee5',reviewer:'test-executor',tests};
          fs.writeFileSync('TARGETED_RESULT_v1.json',JSON.stringify(result,null,2)+'\n');
          fs.writeFileSync(root+'EVIDENCE_DIGESTS_v1.json',JSON.stringify({schemaVersion:'dai-targeted-evidence-digests-v1',evidence},null,2)+'\n');
          NODE
          echo 'Machine evidence and result staged in immutable GitHub Actions artifact; upload to original campaign requires post-run verification.'
      - name: Upload runner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dai-master-targeted-tests-v1
          path: |
            dai-targeted-raw/
            TARGETED_RESULT_v1.json
          if-no-files-found: warn

      - name: Preserve raw evidence for controller relay
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/dai-targeted-preserve-evidence-v1.sh
