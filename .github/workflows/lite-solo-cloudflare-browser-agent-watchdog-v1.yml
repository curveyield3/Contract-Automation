name: Lite-Solo Cloudflare browser-agent-watchdog v1

on:
  workflow_dispatch:
    inputs:
      wake_id:
        description: Active wake/watchdog identifier (empty sweeps every active target)
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      has_targets: ${{ steps.targets.outputs.has_targets }}
      browser_ready: ${{ steps.credentials.outputs.browser_ready }}
    steps:
      - name: Discover active watchdog targets
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_WAKE_ID: ${{ inputs.wake_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$REQUESTED_WAKE_ID" ]; then
            jq -cn --arg id "$REQUESTED_WAKE_ID" '[$id]' > /tmp/watchdog-targets.json
          else
            api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-watchdog/active?ref=main"
            if gh api "$api" --jq '.[]? | select(.type=="file") | .name' > /tmp/watchdog-active-files.txt 2>/dev/null; then
              sed -n 's/\.json$//p' /tmp/watchdog-active-files.txt | LC_ALL=C sort -u | jq -R -s 'split("\n") | map(select(length>0))' > /tmp/watchdog-targets.json
            else
              printf '[]\n' > /tmp/watchdog-targets.json
            fi
          fi

          count="$(jq 'length' /tmp/watchdog-targets.json)"
          if [ "$count" -eq 0 ]; then
            targets='["__NO_ACTIVE_WATCHDOG__"]'
            has_targets=false
          else
            targets="$(jq -c . /tmp/watchdog-targets.json)"
            has_targets=true
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "has_targets=$has_targets" >> "$GITHUB_OUTPUT"
          echo "watchdog_targets=$count" >> "$GITHUB_STEP_SUMMARY"

      - name: Check Tailscale OIDC and browser-session readiness
        id: credentials
        shell: bash
        env:
          TS_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          CHATGPT_STATE: ${{ secrets.CHATGPT_STORAGE_STATE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$TS_CLIENT_ID" ] && [ -n "$CHATGPT_STATE" ]; then
            echo 'browser_ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'browser_ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Watchdog browser work is paused until TS_OAUTH_CLIENT_ID and CHATGPT_STORAGE_STATE_B64 are all configured.'
          fi
  # GitHub drops scheduled runs under load (hours between cron sweeps), so while any
  # target stays active the watchdog re-dispatches itself every 15 minutes; one pending re-arm at a time.
  rearm:
    needs: [discover, supervise]
    if: always() && needs.discover.outputs.has_targets == 'true' && needs.discover.outputs.browser_ready == 'true'
    concurrency:
      group: browser-agent-watchdog-rearm
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait 15 minutes and re-dispatch while targets remain active
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 900
          active="$(gh api "repos/$GITHUB_REPOSITORY/contents/process/browser-agent-watchdog/active?ref=main" --jq '[.[]? | select(.type=="file" and (.name|endswith(".json")))] | length' 2>/dev/null || echo 0)"
          if [ "$active" -gt 0 ]; then
            gh workflow run lite-solo-cloudflare-browser-agent-watchdog-v1.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "re-dispatched watchdog for $active active target(s)" >> "$GITHUB_STEP_SUMMARY"
          fi

  supervise:
    needs: discover
    if: needs.discover.outputs.has_targets == 'true' && needs.discover.outputs.browser_ready == 'true'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        wake_id: ${{ fromJSON(needs.discover.outputs.targets) }}
    concurrency:
      # A wake and its own watchdog cannot operate the same session simultaneously.
      # Independent sessions run on isolated GitHub-hosted runners.
      group: chatgpt-browser-session-${{ matrix.wake_id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      WAKE_ID: ${{ matrix.wake_id }}
      CHATGPT_STORAGE_STATE_B64: ${{ secrets.CHATGPT_STORAGE_STATE_B64 }}
      BROWSER_HEADLESS: 'false'
      DISPLAY: ':99'
      INTERACTIVE_VIEW_ENABLED: 'true'
      MANUAL_CHALLENGE_WAIT_MS: '900000'
      HOME_EXIT_NODE: ${{ vars.BROWSER_HOME_EXIT_NODE || '100.112.238.56' }}

    steps:
      - name: Checkout trusted Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Validate active watchdog target before browser setup
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          CHATGPT_THINKING_EFFORT: high
        shell: bash
        run: |
          set -euo pipefail
          safe_id="$(printf '%s' "$WAKE_ID" | tr -c 'A-Za-z0-9._-' '_')"
          api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-watchdog/active/$safe_id.json?ref=main"
          encoded="$(gh api "$api" --jq '.content' 2>/dev/null || true)"
          if [ -z "$encoded" ]; then
            echo 'valid=false' >> "$GITHUB_OUTPUT"
            echo "Watchdog target disappeared before supervision: $WAKE_ID"
            exit 0
          fi
          if ! printf '%s' "$encoded" | base64 -d | jq -e --arg wake "$WAKE_ID" '
            type=="object"
            and .schemaVersion=="curveyield-browser-agent-watchdog-state-v1"
            and .wakeId==$wake
            and .status=="ACTIVE"
            and (.campaignId|type=="string" and length>0)
            and (.phaseId|type=="string" and length>0)
            and (.workerRole=="reviewer" or .workerRole=="interphase_mechanical")
            and (.chatUrl|type=="string")
            and (.idleMessage|type=="string")
            and (.observation|type=="object")
            and (.gate|type=="object")
            and (.gate.mode=="FULL_V26" or .gate.mode=="LITE")
            and (.gate.repository|type=="string" and length>0)
            and (.gate.ref|type=="string" and length>0)
            and (.gate.statePath|type=="string")
          ' >/dev/null; then
            echo 'valid=false' >> "$GITHUB_OUTPUT"
            echo "::warning::Malformed or stale watchdog state for $WAKE_ID; browser setup and supervision skipped."
            exit 0
          fi
          echo 'valid=true' >> "$GITHUB_OUTPUT"

      - name: Select optional Audit-Controller credential
        if: steps.target.outputs.valid == 'true'
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'false'
        shell: bash
        run: bash scripts/lite-solo-cloudflare-runtime-v1/scripts/select-audit-controller-token.sh

      - name: Set up Node.js
        if: steps.target.outputs.valid == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up isolated browser-agent runtime
        if: steps.target.outputs.valid == 'true'
        uses: ./scripts/lite-solo-cloudflare-runtime-v1/.github/actions/setup-browser-agent-runtime

      # Same weekly APT archive cache as lite-solo-cloudflare-browser-agent-wake-v1.yml: both use
      # identical packages, and each receives a fresh GitHub-hosted runner.
      - name: Set private VNC APT cache epoch
        if: steps.target.outputs.valid == 'true'
        shell: bash
        run: echo "VNC_APT_CACHE_WEEK=$(date -u +%G-W%V)" >> "$GITHUB_ENV"

      - name: Restore private VNC APT package cache
        if: steps.target.outputs.valid == 'true'
        id: private-vnc-apt-cache
        uses: actions/cache/restore@v4
        with:
          # Cache packages only: APT lock and partial/ are root-owned and break tar.
          path: ~/.cache/browser-agent-vnc-apt/archives/*.deb
          key: browser-agent-vnc-apt-${{ runner.os }}-ubuntu24.04-v1-${{ env.VNC_APT_CACHE_WEEK }}
          restore-keys: |
            browser-agent-vnc-apt-${{ runner.os }}-ubuntu24.04-v1-

      - name: Install private VNC helper
        if: steps.target.outputs.valid == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apt_archives="$HOME/.cache/browser-agent-vnc-apt/archives"
          mkdir -p "$apt_archives"
          chmod 755 "$apt_archives"
          # APT downloads as _apt; keep its scratch directory writable only by _apt.
          # Cache restore/save intentionally excludes partial/ and the root-owned lock.
          sudo install -d -o _apt -g root -m 0700 "$apt_archives/partial"
          sudo apt-get update -qq
          sudo apt-get \
            -o Dir::Cache::archives="$apt_archives" \
            -o APT::Keep-Downloaded-Packages=true \
            install -y x11vnc xclip xdotool scrot imagemagick
          echo "Reusable VNC APT archives: $(find "$apt_archives" -maxdepth 1 -type f -name '*.deb' | wc -l) packages"
          command -v scrot >/dev/null
          command -v xclip >/dev/null

      # Persist the download before subsequent browser operations can fail.
      - name: Save private VNC APT package cache
        if: steps.target.outputs.valid == 'true' && steps.private-vnc-apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          # Cache packages only: APT lock and partial/ are root-owned and break tar.
          path: ~/.cache/browser-agent-vnc-apt/archives/*.deb
          key: browser-agent-vnc-apt-${{ runner.os }}-ubuntu24.04-v1-${{ env.VNC_APT_CACHE_WEEK }}

      - name: Record runner egress before home exit node
        if: steps.target.outputs.valid == 'true'
        shell: bash
        run: |
          set -euo pipefail
          direct="$(curl -fsS --max-time 15 https://api.ipify.org)"
          test -n "$direct"
          printf '%s' "$direct" | sha256sum | awk '{print "DIRECT_EGRESS_HASH="$1}' >> "$GITHUB_ENV"

      - name: Connect runner to tailnet
        if: steps.target.outputs.valid == 'true'
        uses: ./scripts/lite-solo-cloudflare-runtime-v1/.github/actions/connect-browser-tailnet-oidc
        with:
          client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tag: tag:audit-browser
          ping: ${{ env.HOME_EXIT_NODE }}

      - name: Start visible Chrome display and private tailnet VNC
        if: steps.target.outputs.valid == 'true'
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension RANDR >/tmp/xvfb-browser-watchdog.log 2>&1 &
          echo $! >/tmp/xvfb-browser-watchdog.pid
          for i in {1..20}; do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 1
          done
          xdpyinfo -display :99 >/dev/null 2>&1 || { cat /tmp/xvfb-browser-watchdog.log || true; exit 1; }
          ts_ip="$(tailscale ip -4 | head -n1)"
          test -n "$ts_ip"
          echo "TAILSCALE_RUNNER_IP=$ts_ip" >> "$GITHUB_ENV"
          x11vnc -display :99 -rfbport 5900 -listen "$ts_ip" -nopw -forever -shared -quiet >/tmp/x11vnc-browser-watchdog.log 2>&1 &
          echo $! >/tmp/x11vnc-browser-watchdog.pid
          echo "TAILSCALE_VNC=$ts_ip:5900"

      - name: Route watchdog browser sweep through home exit node
        if: steps.target.outputs.valid == 'true'
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 3s 10s tailscale status
          timeout -k 5s 20s sudo tailscale set --exit-node="$HOME_EXIT_NODE"
          changed=false
          for i in {1..8}; do
            current="$(curl -fsS --connect-timeout 3 --max-time 5 https://api.ipify.org || true)"
            if [ -n "$current" ]; then
              current_hash="$(printf '%s' "$current" | sha256sum | awk '{print $1}')"
              if [ "$current_hash" != "$DIRECT_EGRESS_HASH" ]; then changed=true; break; fi
            fi
            sleep 2
          done
          [ "$changed" = true ] || { echo "::error::Tailscale exit node did not change runner egress."; exit 1; }
          echo "HOME_EXIT_EGRESS_ACTIVE=true"

      - name: Supervise agent for one watchdog sweep
        if: steps.target.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          safe_id="$(printf '%s' "$WAKE_ID" | tr -c 'A-Za-z0-9._-' '_')"
          active_api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-watchdog/active/$safe_id.json"

          fetch_state() {
            local encoded
            encoded="$(gh api "$active_api?ref=main" --jq '.content' 2>/dev/null || true)"
            if [ -z "$encoded" ]; then return 1; fi
            printf '%s' "$encoded" | base64 -d > /tmp/watchdog-state.json || return 1
            jq -e --arg wake "$WAKE_ID" '
              type=="object"
              and .schemaVersion=="curveyield-browser-agent-watchdog-state-v1"
              and .wakeId==$wake
              and .status=="ACTIVE"
              and (.campaignId|type=="string" and length>0)
              and (.phaseId|type=="string" and length>0)
              and (.workerRole=="reviewer" or .workerRole=="interphase_mechanical")
              and (.chatUrl|type=="string")
              and (.idleMessage|type=="string")
              and (.observation|type=="object")
              and (.gate|type=="object")
              and (.gate.mode=="FULL_V26" or .gate.mode=="LITE")
              and (.gate.repository|type=="string" and length>0)
              and (.gate.ref|type=="string" and length>0)
              and (.gate.statePath|type=="string")
            ' /tmp/watchdog-state.json >/dev/null || return 1
          }

          persist_state() {
            local sha content
            sha="$(gh api "$active_api?ref=main" --jq '.sha' 2>/dev/null || true)"
            [ -n "$sha" ] || return 1
            content="$(base64 -w0 /tmp/watchdog-state.json)"
            gh api --method PUT "$active_api" \
              -f message="chore(watchdog): observe $WAKE_ID" \
              -f content="$content" -f sha="$sha" -f branch=main >/dev/null
          }

          prune_completed_states() {
            local completed_dir_api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-watchdog/completed"
            local retention_max="${WATCHDOG_COMPLETED_RETENTION_MAX:-100}"
            local listing total excess file_name safe_name active_probe encoded completed_at completed_epoch current_sha
            local valid_count prune_count
            local index_file='/tmp/watchdog-completed-retention.txt'
            : > "$index_file"

            listing="$(gh api "$completed_dir_api?ref=main" --jq '.[]? | select(.type=="file" and (.name|endswith(".json"))) | .name' 2>/dev/null || true)"
            [ -n "$listing" ] || return 0
            total="$(printf '%s\n' "$listing" | sed '/^$/d' | wc -l | tr -d ' ')"
            [[ "$retention_max" =~ ^[0-9]+$ ]] || retention_max=100
            [ "$retention_max" -ge 1 ] || retention_max=100
            [ "$total" -gt "$retention_max" ] || return 0
            excess=$((total - retention_max))

            while IFS= read -r file_name; do
              [ -n "$file_name" ] || continue
              [[ "$file_name" =~ ^[A-Za-z0-9._-]+\.json$ ]] || continue
              safe_name="${file_name%.json}"
              active_probe="$(gh api "repos/$GITHUB_REPOSITORY/contents/process/browser-agent-watchdog/active/$file_name?ref=main" --jq '.sha' 2>/dev/null || true)"
              [ -z "$active_probe" ] || continue
              encoded="$(gh api "$completed_dir_api/$file_name?ref=main" --jq '.content' 2>/dev/null || true)"
              [ -n "$encoded" ] || continue
              printf '%s' "$encoded" | base64 -d > /tmp/watchdog-retention-candidate.json 2>/dev/null || continue
              if ! jq -e --arg safe "$safe_name" '
                type=="object"
                and .schemaVersion=="curveyield-browser-agent-watchdog-state-v1"
                and .status=="COMPLETED_CANONICAL_GATE"
                and (.completedAt|type=="string" and length>0)
                and (.wakeId|type=="string" and (gsub("[^A-Za-z0-9._-]";"_"))==$safe)
              ' /tmp/watchdog-retention-candidate.json >/dev/null; then
                continue
              fi
              completed_at="$(jq -r '.completedAt' /tmp/watchdog-retention-candidate.json)"
              completed_epoch="$(date -u -d "$completed_at" +%s 2>/dev/null || true)"
              [[ "$completed_epoch" =~ ^[0-9]+$ ]] || continue
              current_sha="$(gh api "$completed_dir_api/$file_name?ref=main" --jq '.sha' 2>/dev/null || true)"
              [ -n "$current_sha" ] || continue
              printf '%020d|%s|%s\n' "$completed_epoch" "$file_name" "$current_sha" >> "$index_file"
            done <<< "$listing"

            valid_count="$(wc -l < "$index_file" | tr -d ' ')"
            [ "$valid_count" -gt 0 ] || return 0
            prune_count="$excess"
            [ "$prune_count" -le "$valid_count" ] || prune_count="$valid_count"
            LC_ALL=C sort -n "$index_file" | head -n "$prune_count" | while IFS='|' read -r _ file_name current_sha; do
              [ -n "$file_name" ] || continue
              gh api --method DELETE "$completed_dir_api/$file_name" \
                -f message="chore(watchdog): prune terminal state $file_name" \
                -f sha="$current_sha" -f branch=main >/dev/null 2>&1 || true
            done
          }
          retire_state() {
            local reason="$1"
            local active_sha completed_api completed_sha content
            active_sha="$(gh api "$active_api?ref=main" --jq '.sha' 2>/dev/null || true)"
            [ -n "$active_sha" ] || return 0
            jq --arg reason "$reason" \
              '.status="COMPLETED_CANONICAL_GATE" | .completionReason=$reason | .completedAt=(now|todate)' \
              /tmp/watchdog-state.json > /tmp/watchdog-completed.json
            completed_api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-watchdog/completed/$safe_id.json"
            completed_sha="$(gh api "$completed_api?ref=main" --jq '.sha' 2>/dev/null || true)"
            content="$(base64 -w0 /tmp/watchdog-completed.json)"
            if [ -n "$completed_sha" ]; then
              gh api --method PUT "$completed_api" -f message="chore(watchdog): retire $WAKE_ID" -f content="$content" -f sha="$completed_sha" -f branch=main >/dev/null
            else
              gh api --method PUT "$completed_api" -f message="chore(watchdog): retire $WAKE_ID" -f content="$content" -f branch=main >/dev/null
            fi
            gh api --method DELETE "$active_api" -f message="chore(watchdog): retire active $WAKE_ID" -f sha="$active_sha" -f branch=main >/dev/null
            prune_completed_states
          }
          safe_repo_path() {
            local value="$1"
            [ -n "$value" ] || return 1
            case "$value" in
              /*|*\*|../*|*/../*|*/..|..) return 1 ;;
            esac
            return 0
          }

          load_lite_interphase_packet() {
            local packet_path="$1"
            local handoff_path="$2"
            local expected_milestone="$3"
            local gate_repo="$4"
            local gate_ref="$5"
            local encoded path allowed_prefix

            safe_repo_path "$packet_path" || return 2
            allowed_prefix="$(dirname "$handoff_path")/MECHANICAL/"
            encoded="$(GH_TOKEN="$AUDIT_CONTROLLER_GITHUB_TOKEN" gh api "repos/$gate_repo/contents/$packet_path?ref=$gate_ref" --jq '.content' 2>/dev/null || true)"
            [ -n "$encoded" ] || return 1
            printf '%s' "$encoded" | base64 -d > /tmp/lite-interphase-work-packet.json

            jq -e               --arg campaign "$campaign_id"               --arg milestone "$expected_milestone"               --arg handoff "$handoff_path"               '.schemaVersion=="curveyield-lite-interphase-work-packet-v2"
               and .taskClass=="MECHANICAL_ONLY"
               and ((keys|sort)==(["schemaVersion","taskClass","campaignId","completedMilestoneId","handoffPath","instructions","workUnits","reconciliationOutputPath","requiredOutputs"]|sort))
               and .campaignId==$campaign
               and .completedMilestoneId==$milestone
               and .handoffPath==$handoff
               and (.instructions|type=="string" and length>0)
               and (.workUnits|type=="array" and length>=10)
               and all(.workUnits[]; type=="object"
                 and ((keys|sort)==(["id","instructions","outputPath","verification"]|sort))
                 and (.id|type=="string" and length>0)
                 and (.instructions|type=="string" and length>0)
                 and (.outputPath|type=="string" and length>0)
                 and (.verification|type=="string" and length>0))
               and (.reconciliationOutputPath|type=="string" and length>0)
               and (.requiredOutputs|type=="array" and length>=11)
               and all(.requiredOutputs[]; type=="object"
                 and ((keys|sort)==(["path"]|sort) or (keys|sort)==(["path","purpose"]|sort))
                 and (.path|type=="string" and length>0)
                 and ((has("purpose")|not) or (.purpose|type=="string")))'               /tmp/lite-interphase-work-packet.json >/dev/null || return 2

            if grep -Eiq '\b(TBD|TODO)\b|\{\{[^}]+\}\}|<[^>]*(placeholder|fill|insert)[^>]*>' /tmp/lite-interphase-work-packet.json; then
              return 2
            fi
            unit_total="$(jq '.workUnits | length' /tmp/lite-interphase-work-packet.json)"
            unit_id_unique="$(jq -r '.workUnits[].id' /tmp/lite-interphase-work-packet.json | LC_ALL=C sort -u | wc -l | tr -d ' ')"
            unit_output_unique="$(jq -r '.workUnits[].outputPath' /tmp/lite-interphase-work-packet.json | LC_ALL=C sort -u | wc -l | tr -d ' ')"
            [ "$unit_total" -ge 10 ] || return 2
            [ "$unit_total" = "$unit_id_unique" ] || return 2
            [ "$unit_total" = "$unit_output_unique" ] || return 2

            required_total="$(jq '.requiredOutputs | length' /tmp/lite-interphase-work-packet.json)"
            required_unique="$(jq -r '.requiredOutputs[]?.path // empty' /tmp/lite-interphase-work-packet.json | LC_ALL=C sort -u | wc -l | tr -d ' ')"
            [ "$required_total" = "$required_unique" ] || return 2

            expected_required="$( { jq -r '.workUnits[].outputPath' /tmp/lite-interphase-work-packet.json; jq -r '.reconciliationOutputPath' /tmp/lite-interphase-work-packet.json; } | LC_ALL=C sort -u )"
            observed_required="$(jq -r '.requiredOutputs[].path' /tmp/lite-interphase-work-packet.json | LC_ALL=C sort -u)"
            [ "$expected_required" = "$observed_required" ] || return 2
            [ "$required_total" -eq "$((unit_total + 1))" ] || return 2

            while IFS= read -r path; do
              safe_repo_path "$path" || return 2
              case "$path" in
                "$allowed_prefix"*) ;;
                *) return 2 ;;
              esac
            done < <(jq -r '.requiredOutputs[]?.path // empty' /tmp/lite-interphase-work-packet.json)

            sha256sum /tmp/lite-interphase-work-packet.json | awk '{print $1}' > /tmp/lite-interphase-work-packet.sha256
            return 0
          }

          verify_lite_interphase_completion() {
            local packet_path="$1"
            local completion_path="$2"
            local handoff_path="$3"
            local expected_milestone="$4"
            local gate_repo="$5"
            local gate_ref="$6"
            local encoded packet_sha required observed output_path expected_sha output_encoded observed_sha
            local packet_units receipt_units receipt_unit_count receipt_unit_unique unit_id unit_path unit_receipt_sha output_sha

            load_lite_interphase_packet "$packet_path" "$handoff_path" "$expected_milestone" "$gate_repo" "$gate_ref" || return 1
            packet_sha="$(cat /tmp/lite-interphase-work-packet.sha256)"
            if [ "$worker_role" = "interphase_mechanical" ]; then
              [ "$packet_path" = "$gate_interphase_work_packet_path" ] || return 1
              [ "$completion_path" = "$gate_interphase_completion_path" ] || return 1
              [ "$handoff_path" = "$gate_interphase_handoff_path" ] || return 1
              [ "$packet_sha" = "$(jq -r '.gate.interphase.workPacketSha256 // empty' /tmp/watchdog-state.json)" ] || return 1
            fi
            [ "$completion_path" = "$(dirname "$handoff_path")/MECHANICAL_WORK_COMPLETION_v2.json" ] || return 1
            safe_repo_path "$completion_path" || return 1
            encoded="$(GH_TOKEN="$AUDIT_CONTROLLER_GITHUB_TOKEN" gh api "repos/$gate_repo/contents/$completion_path?ref=$gate_ref" --jq '.content' 2>/dev/null || true)"
            [ -n "$encoded" ] || return 1
            printf '%s' "$encoded" | base64 -d > /tmp/lite-interphase-completion.json

            jq -e               --arg campaign "$campaign_id"               --arg milestone "$expected_milestone"               --arg handoff "$handoff_path"               --arg packet "$packet_path"               --arg packetSha "$packet_sha"               '.schemaVersion=="curveyield-lite-interphase-completion-v2"
               and .status=="PASS"
               and ((keys|sort)==(["schemaVersion","status","campaignId","completedMilestoneId","handoffPath","workPacketPath","workPacketSha256","workUnitReceipts","outputs","completedAt"]|sort))
               and .campaignId==$campaign
               and .completedMilestoneId==$milestone
               and .handoffPath==$handoff
               and .workPacketPath==$packet
               and .workPacketSha256==$packetSha
               and (.workUnitReceipts|type=="array" and length>=10)
               and all(.workUnitReceipts[]; type=="object"
                 and ((keys|sort)==(["id","outputPath","sha256"]|sort))
                 and (.id|type=="string" and length>0)
                 and (.outputPath|type=="string" and length>0)
                 and (.sha256|type=="string" and test("^[0-9a-f]{64}$")))
               and (.outputs|type=="array" and length>=11)
               and all(.outputs[]; type=="object"
                 and ((keys|sort)==(["path","sha256"]|sort))
                 and (.path|type=="string" and length>0)
                 and (.sha256|type=="string" and test("^[0-9a-f]{64}$")))
               and (.completedAt|type=="string" and length>0)'               /tmp/lite-interphase-completion.json >/dev/null || return 1

            required="$(jq -r '.requiredOutputs[]?.path // empty' /tmp/lite-interphase-work-packet.json | LC_ALL=C sort -u)"
            observed="$(jq -r '.outputs[]?.path // empty' /tmp/lite-interphase-completion.json | LC_ALL=C sort -u)"
            observed_total="$(jq '.outputs | length' /tmp/lite-interphase-completion.json)"
            observed_unique="$(jq -r '.outputs[]?.path // empty' /tmp/lite-interphase-completion.json | LC_ALL=C sort -u | wc -l | tr -d ' ')"
            [ "$observed_total" = "$observed_unique" ] || return 1
            [ "$observed_total" = "$(jq '.requiredOutputs | length' /tmp/lite-interphase-work-packet.json)" ] || return 1
            [ "$required" = "$observed" ] || return 1

            packet_units="$(jq -r '.workUnits[] | [.id,.outputPath] | @tsv' /tmp/lite-interphase-work-packet.json | LC_ALL=C sort)"
            receipt_units="$(jq -r '.workUnitReceipts[] | [.id,.outputPath] | @tsv' /tmp/lite-interphase-completion.json | LC_ALL=C sort)"
            receipt_unit_count="$(jq '.workUnitReceipts | length' /tmp/lite-interphase-completion.json)"
            receipt_unit_unique="$(jq -r '.workUnitReceipts[].id' /tmp/lite-interphase-completion.json | LC_ALL=C sort -u | wc -l | tr -d ' ')"
            [ "$receipt_unit_count" = "$(jq '.workUnits | length' /tmp/lite-interphase-work-packet.json)" ] || return 1
            [ "$receipt_unit_count" = "$receipt_unit_unique" ] || return 1
            [ "$packet_units" = "$receipt_units" ] || return 1

            while IFS="$(printf '\t')" read -r unit_id unit_path; do
              [ -n "$unit_id" ] || continue
              unit_receipt_sha="$(jq -r --arg id "$unit_id" '.workUnitReceipts[] | select(.id==$id) | .sha256 // empty' /tmp/lite-interphase-completion.json | tail -n1)"
              output_sha="$(jq -r --arg p "$unit_path" '.outputs[] | select(.path==$p) | .sha256 // empty' /tmp/lite-interphase-completion.json | tail -n1)"
              [ "$unit_receipt_sha" = "$output_sha" ] || return 1
            done <<< "$packet_units"

            while IFS= read -r output_path; do
              [ -n "$output_path" ] || continue
              safe_repo_path "$output_path" || return 1
              expected_sha="$(jq -r --arg p "$output_path" '.outputs[] | select(.path==$p) | .sha256 // empty' /tmp/lite-interphase-completion.json | tail -n1)"
              [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]] || return 1
              output_encoded="$(GH_TOKEN="$AUDIT_CONTROLLER_GITHUB_TOKEN" gh api "repos/$gate_repo/contents/$output_path?ref=$gate_ref" --jq '.content' 2>/dev/null || true)"
              [ -n "$output_encoded" ] || return 1
              printf '%s' "$output_encoded" | base64 -d > /tmp/lite-interphase-output.bin
              observed_sha="$(sha256sum /tmp/lite-interphase-output.bin | awk '{print $1}')"
              [ "$observed_sha" = "$expected_sha" ] || return 1
            done <<< "$required"

            return 0
          }

          dispatch_registered_backup() {
            # One standby is consumed once, and only after repeated missed wakes.
            # All GitHub reads/writes here are registry bookkeeping; the actual
            # ChatGPT message is still delivered by the existing human-style sender.
            [ "$worker_role" = reviewer ] && [ "$gate_mode" = LITE ] || return 1
            [ "$gate_repo" = 'curveyield3/Audit-Controller' ] || return 1
            [ -s /tmp/audit-campaign-directory.json ] || return 1
            local safe_campaign registration api sha planned updated backup message
            safe_campaign="$(printf '%s' "$campaign_id" | tr -c 'A-Za-z0-9._-' '_')"
            api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-wake/registrations/$safe_campaign.json"
            registration="$(gh api "$api?ref=main" 2>/dev/null || true)"
            [ -n "$registration" ] || return 1
            printf '%s' "$registration" | jq -r '.content' | base64 -d > /tmp/failover-registration.json || return 1
            planned="$(node scripts/lite-solo-cloudflare-runtime-v1/scripts/browser-backup-failover-v1.mjs /tmp/failover-registration.json /tmp/audit-campaign-directory.json "$chat_url")" || return 1
            if [ "$(printf '%s' "$planned" | jq -r '.status')" != ELIGIBLE ]; then
              echo "No eligible pre-registered backup: $(printf '%s' "$planned" | jq -r '.reason')"
              return 1
            fi
            backup="$(printf '%s' "$planned" | jq -r '.backupChatUrl')"
            message="$(printf '%s' "$planned" | jq -r '.message')"
            printf '%s' "$planned" | jq '.registration' > /tmp/failover-registration-next.json
            updated="$(base64 -w0 /tmp/failover-registration-next.json)"
            sha="$(printf '%s' "$registration" | jq -r '.sha')"
            # SHA conditional ensures another watchdog cannot steal the standby.
            gh api --method PUT "$api" -f message="fix(watchdog): rebind $campaign_id to one-time backup chat" \
              -f content="$updated" -f sha="$sha" -f branch=main >/dev/null || return 1
            gh workflow run lite-solo-cloudflare-browser-agent-wake-v1.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f wake_id="$campaign_id-$gate_expected_milestone-backup" \
              -f campaign_id="$campaign_id" -f phase_id="$gate_expected_phase" \
              -f mode=resume_existing -f chat_url="$backup" \
              -f wake_message_b64="$(printf '%s' "$message" | base64 -w0)" \
              -f watchdog_enabled=true -f worker_role=reviewer -f gate_mode=LITE \
              -f gate_repository="$gate_repo" -f gate_ref="$gate_ref" \
              -f gate_state_path="$gate_path" \
              -f gate_expected_phase_id="$gate_expected_phase" \
              -f gate_expected_milestone_id="$gate_expected_milestone" || return 1
            echo "Backup chat accepted one-time $campaign_id/$gate_expected_milestone handoff." >> "$GITHUB_STEP_SUMMARY"
            return 0
          }

          dispatch_reviewer_repair() {
            local reason="$1"
            [ "$(jq -r '.repair.enabled // false' /tmp/watchdog-state.json)" = "true" ] || return 1
            [ "$worker_role" = "reviewer" ] || return 1
            [ "$gate_mode" = "LITE" ] || return 1
            [ -n "$gate_expected_milestone" ] || return 1

            # P0_BOOTSTRAP is repairable: the repair workflow has a dedicated
            # resume-from-durable-state path that does not require a predecessor handoff.
            echo "Dispatching replacement reviewer for $campaign_id / $gate_expected_milestone: $reason"
            gh workflow run lite-solo-cloudflare-browser-agent-reviewer-repair-v1.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f campaign_id="$campaign_id" \
              -f repair_mode=auto \
              -f force_reset=false \
              -f reason="$reason"
            return 0
          }

          check_reviewer_repair_request() {
            local campaign_root repair_path encoded_request encoded_pointer active_reviewer active_handoff active_baseline
            [ "$worker_role" = "reviewer" ] || return 1
            [ "$gate_mode" = "LITE" ] || return 1
            [ -n "$gate_path" ] || return 1
            [ -n "$gate_pointer_path" ] || return 1
            campaign_root="${gate_path%/controller/*}"
            repair_path="$campaign_root/controller/REVIEWER_REPAIR_REQUEST_v1.json"

            encoded_request="$(GH_TOKEN="$AUDIT_CONTROLLER_GITHUB_TOKEN" gh api "repos/$gate_repo/contents/$repair_path?ref=$gate_ref" --jq '.content' 2>/dev/null || true)"
            [ -n "$encoded_request" ] || return 1
            printf '%s' "$encoded_request" | base64 -d > /tmp/reviewer-repair-request.json

            encoded_pointer="$(GH_TOKEN="$AUDIT_CONTROLLER_GITHUB_TOKEN" gh api "repos/$gate_repo/contents/$gate_pointer_path?ref=$gate_ref" --jq '.content' 2>/dev/null || true)"
            [ -n "$encoded_pointer" ] || return 1
            printf '%s' "$encoded_pointer" | base64 -d > /tmp/reviewer-repair-pointer.json

            active_reviewer="$(jq -r --arg m "$gate_expected_milestone" '.routingPlan.workers[]? | select(.milestone==$m) | .lineage // empty' /tmp/canonical-campaign-state.json | tail -n1)"
            active_handoff="$(jq -r '.authoritativeHandoff // empty' /tmp/reviewer-repair-pointer.json)"
            active_baseline="$(jq -r '.authoritativeHandoffIdentity.contentCommit // empty' /tmp/reviewer-repair-pointer.json)"
            [ -n "$active_reviewer" ] || return 1

            jq -e \
              --arg campaign "$campaign_id" \
              --arg reviewer "$active_reviewer" \
              --arg milestone "$gate_expected_milestone" \
              --arg handoff "$active_handoff" \
              --arg baseline "$active_baseline" \
              '.schemaVersion=="curveyield-reviewer-repair-request-v1"
               and .campaignId==$campaign
               and .reviewer==$reviewer
               and .milestoneId==$milestone
               and .action=="RESET_TO_HANDOFF"
               and .handoffPath==$handoff
               and .baselineCommit==$baseline
               and (.reason|type=="string" and length>0)
               and (.requestedAt|type=="string" and length>0)' \
              /tmp/reviewer-repair-request.json >/dev/null
          }

          launch_lite_successor() {
            echo "::error::Legacy create-fresh Lite successor launcher is retired by the audit browser interaction invariant."
            echo "::error::Current audits must transition through lite-solo-cloudflare-audit-browser-orchestrator-v1.yml with pre-created reviewer chats and the Phase-1 fixed X11 sender."
            return 2
          }

          if ! fetch_state; then
            echo 'Watchdog state already retired; nothing to supervise.'
            exit 0
          fi

          jq --arg run "$GITHUB_RUN_ID" \
            '.watchdogRunId=$run | .watchdogSweepStartedAt=(now|todate)' \
            /tmp/watchdog-state.json > /tmp/watchdog-state-next.json
          mv /tmp/watchdog-state-next.json /tmp/watchdog-state.json
          persist_state || true

          for cycle in 1; do
            if ! fetch_state; then
              echo 'Watchdog state was retired by approved completion; exiting immediately.'
              exit 0
            fi

            campaign_id="$(jq -r '.campaignId' /tmp/watchdog-state.json)"
            phase_id="$(jq -r '.phaseId' /tmp/watchdog-state.json)"
            worker_role="$(jq -r '.workerRole // "reviewer"' /tmp/watchdog-state.json)"
            chat_url="$(jq -r '.chatUrl // empty' /tmp/watchdog-state.json)"

            gate_mode="$(jq -r '.gate.mode // "FULL_V26"' /tmp/watchdog-state.json)"
            gate_repo="$(jq -r '.gate.repository // "curveyield3/Audit-Controller"' /tmp/watchdog-state.json)"
            gate_ref="$(jq -r '.gate.ref // "main"' /tmp/watchdog-state.json)"
            gate_path="$(jq -r '.gate.statePath // empty' /tmp/watchdog-state.json)"
            gate_expected_phase="$(jq -r '.gate.expectedPhaseId // empty' /tmp/watchdog-state.json)"
            gate_expected_milestone="$(jq -r '.gate.expectedMilestoneId // empty' /tmp/watchdog-state.json)"
            gate_pointer_path="$(jq -r '.gate.activePointerPath // empty' /tmp/watchdog-state.json)"
            gate_interphase_handoff_path="$(jq -r '.gate.interphase.handoffPath // empty' /tmp/watchdog-state.json)"
            gate_interphase_work_packet_path="$(jq -r '.gate.interphase.workPacketPath // empty' /tmp/watchdog-state.json)"
            gate_interphase_completion_path="$(jq -r '.gate.interphase.completionPath // empty' /tmp/watchdog-state.json)"
            receipt_gate_mode=false
            # Preserve controller rejection identity across sweeps; only an actual
            # browser delivery marks that rework as notified.
            rework_identity=""
            rework_feedback=""
            force_rework_poke=false
            if [ "$gate_mode" = "LITE" ] && [[ "$gate_path" == "Audit Campaign Directory/campaigns/"*.json ]] && [ -n "${AUDIT_CONTROLLER_GITHUB_TOKEN:-}" ]; then
              receipt_gate_mode=true
              encoded_directory="$(GH_TOKEN="$AUDIT_CONTROLLER_GITHUB_TOKEN" gh api "repos/$gate_repo/contents/$gate_path?ref=$gate_ref" --jq '.content' 2>/dev/null || true)"
              if [ -z "$encoded_directory" ]; then
                echo "::warning::Audit Campaign Directory entry unavailable; watchdog will retry."
              else
                printf '%s' "$encoded_directory" | base64 -d > /tmp/audit-campaign-directory.json
                directory_schema="$(jq -r '.schemaVersion // empty' /tmp/audit-campaign-directory.json)"
                campaign_root="$(jq -r '.workspacePath // empty' /tmp/audit-campaign-directory.json)"
                campaign_title="$(jq -r '.campaignName // empty' /tmp/audit-campaign-directory.json)"

                if [ "$directory_schema" = "curveyield-audit-campaign-directory-entry-v2" ]; then
                  campaign_status="$(jq -r '.campaignStatus // empty' /tmp/audit-campaign-directory.json)"
                  assignment_status="$(jq -r '.currentAssignment.status // empty' /tmp/audit-campaign-directory.json)"
                  assignment_phase="$(jq -r '.currentAssignment.phaseId // empty' /tmp/audit-campaign-directory.json)"
                  assignment_seq="$(jq -r '.currentAssignment.phaseSequence // empty' /tmp/audit-campaign-directory.json)"
                  assignment_reviewer="$(jq -r '.currentAssignment.reviewer // empty' /tmp/audit-campaign-directory.json)"
                  packet_path="$(jq -r '.currentAssignment.packetPath // empty' /tmp/audit-campaign-directory.json)"

                  if [ "$campaign_status" = "COMPLETE" ] || [ "$campaign_status" = "STOPPED_BY_HUMAN" ] || [ "$campaign_status" = "CLOSED_INCOMPLETE" ]; then
                    retire_state "LITE_ASSIGNMENT_CAMPAIGN_TERMINAL_$campaign_status"
                    exit 0
                  fi

                  if jq -e --arg state "$campaign_status" '.gate.stopCampaignStatuses | index($state) != null' /tmp/watchdog-state.json >/dev/null; then
                    retire_state "LITE_CAMPAIGN_GATE_STOP_$campaign_status"
                    exit 0
                  fi

                  # Targeted-test work has no currentAssignment. Supervise exactly the
                  # outstanding master request; retire on result, re-review or cancellation.
                  if [ "$campaign_status" = "WAITING_FOR_TARGETED_TESTS" ]; then
                    if [ "$gate_expected_phase" != "master-targeted-tests" ]; then
                      retire_state "LITE_TESTS_OWNED_BY_DELEGATED_REVIEWER"
                      exit 0
                    fi
                    if [ -z "$gate_expected_milestone" ] || ! jq -e --arg request "$gate_expected_milestone" \
                      '.pendingMasterReview.targetedTests[]? | select(.requestId==$request and .status=="AWAITING_EXECUTION")' \
                      /tmp/audit-campaign-directory.json >/dev/null; then
                      retire_state "LITE_TARGETED_REQUEST_NO_LONGER_PENDING"
                      exit 0
                    fi
                  elif [ "$gate_expected_phase" = "master-targeted-tests" ]; then
                    retire_state "LITE_TARGETED_REQUEST_NO_LONGER_PENDING"
                    exit 0
                  fi

                  # A finished reviewer's browser may have held the single
                  # shared session while the master wake was queued. GitHub
                  # permits only one waiting concurrency run and may cancel
                  # the master wake when a subsequent watchdog starts. Replay
                  # ONLY an already-published, exact master delivery (never
                  # a controller request, tests, or a new master decision).
                  if [ "$campaign_status" = "WAITING_FOR_MASTER_REVIEW" ] && [ "$gate_expected_phase" != "master-review" ]; then
                    if [ "$gate_repo" = "curveyield3/Audit-Controller" ] &&
                       [ -n "${AUDIT_CONTROLLER_GITHUB_TOKEN:-}" ]; then
                      master_segment="$(jq -r '.pendingMasterReview.segmentId // empty' /tmp/audit-campaign-directory.json)"
                      master_boundary="$(jq -r '.pendingMasterReview.boundaryPhase // empty' /tmp/audit-campaign-directory.json)"
                      if [[ "$master_segment" =~ ^[A-Za-z0-9._-]+$ ]] && [[ "$master_boundary" =~ ^([1-9]|10)$ ]]; then
                        ledger_api="repos/$gate_repo/contents/${campaign_root// /%20}/controller/delivery/DELIVERY_LEDGER_v1.json?ref=$gate_ref"
                        encoded_ledger="$(GH_TOKEN="$AUDIT_CONTROLLER_GITHUB_TOKEN" gh api "$ledger_api" --jq '.content' 2>/dev/null || true)"
                        if [ -n "$encoded_ledger" ]; then
                          printf '%s' "$encoded_ledger" | base64 -d > /tmp/master-handoff-delivery-ledger.json
                          replay_ref="$(jq -r --arg lane "phase:$master_boundary:none" --arg segment "$master_segment" '
                            (.latestByLane[$lane] // "") as $digest
                            | (.results[$digest] // {})
                            | select(.state=="PUBLISHED" and .status=="WAITING_FOR_MASTER_REVIEW" and .segmentId==$segment)
                            | .detailRef // empty' /tmp/master-handoff-delivery-ledger.json)"
                          if [[ "$replay_ref" =~ ^controller/results/[a-f0-9]{20}/INDEX_v1.json$ ]]; then
                            timeout -k 10s 90s gh workflow run lite-solo-cloudflare-controller-delivery-replay-v1.yml \
                              --repo "$GITHUB_REPOSITORY" --ref main \
                              -f campaign_id="$campaign_id" -f detail_ref="$replay_ref" \
                              -f audit_controller_ref="$gate_ref" || echo "::warning::Published master handoff replay dispatch failed; retain exact PUBLISHED delivery for retry."
                          fi
                        fi
                      fi
                    fi
                    retire_state "LITE_SEGMENT_HANDED_TO_MASTER_REVIEW"
                    exit 0
                  fi

                  if [ -n "$assignment_phase" ] && [ "$assignment_phase" != "$gate_expected_phase" ]; then
                    if [ "$assignment_status" = "WAITING_FOR_SUCCESSOR_AGENT" ] || [ "$gate_expected_phase" = "master-review" ]; then
                      echo "Fresh successor assignment $assignment_phase is pending; retiring predecessor watchdog."
                      retire_state "LITE_ASSIGNMENT_FRESH_SUCCESSOR_PENDING_$assignment_phase"
                      exit 0
                    fi
                    echo "Lite assignment advanced $gate_expected_phase -> $assignment_phase; keeping same reviewer chat."
                    jq --arg phase "$assignment_phase" '.phaseId=$phase | .gate.expectedPhaseId=$phase | .gate.expectedMilestoneId=("PHASE_"+($phase|sub("phase-";""))+"_WORK_PACKET") | .lastDecision=("ASSIGNMENT_PHASE_SYNC_"+$phase)' /tmp/watchdog-state.json > /tmp/watchdog-state-next.json
                    mv /tmp/watchdog-state-next.json /tmp/watchdog-state.json
                    persist_state || true
                    gate_expected_phase="$assignment_phase"
                  fi

                  # A rejected phase has no PASS successor and no controller-driven
                  # reviewer wake. Read the already published work packet and deliver
                  # exact errors to the existing reviewer at the NEXT watchdog sweep.
                  # Do not start a controller run here: Phase 5 can execute tests,
                  # which require separate explicit audit-owner authorization.
                  if [ "$assignment_status" = "REWORK_REQUIRED" ] &&
                     [ "$worker_role" = "reviewer" ] &&
                     [ "$assignment_phase" = "$gate_expected_phase" ] &&
                     [ -n "$packet_path" ]; then
                    packet_api_path="$(printf '%s' "$packet_path" | sed 's/ /%20/g')"
                    encoded_packet="$(GH_TOKEN="$AUDIT_CONTROLLER_GITHUB_TOKEN" gh api "repos/$gate_repo/contents/$packet_api_path?ref=$gate_ref" --jq '.content' 2>/dev/null || true)"
                    if [ -n "$encoded_packet" ] &&
                       printf '%s' "$encoded_packet" | base64 -d > /tmp/lite-rework-packet.json &&
                       jq -e --arg id "$campaign_id" --argjson phase "$assignment_seq" '
                         .campaignId==$id and .phaseSequence==$phase
                         and .controllerValidation.status=="FAIL"
                         and (.submissionAttempt|type=="number")
                       ' /tmp/lite-rework-packet.json >/dev/null; then
                      rework_identity="$(jq -r '[.submissionAttempt, .submittedAt, .controllerValidation.status] | map(tostring) | join(":")' /tmp/lite-rework-packet.json)"
                      rework_feedback="$(jq -r --arg packet "$packet_path" '
                        "CONTROLLER NEEDS_REWORK: inspect the CURRENT failed phase packet " + $packet
                        + " (submission attempt " + (.submissionAttempt|tostring) + ").\n"
                        + ((.controllerValidation.deficiencies // [])[:8] | join("\n- "))
                        + "\nThis is not an accepted phase or a successful simulation. Compare failed runner commit/timestamp against CURRENT Contract-Automation main before diagnosing; do not repeat an obsolete error after a subsequent repair. Fix the precise cause using the existing runner and controller, and keep all accepted reviewer shards. Do not create, modify, or run tests or re-dispatch Phase 5 machine execution without explicit audit-owner authorization. Resume all non-test work immediately, then report the exact remaining authorization/dependency."
                      ' /tmp/lite-rework-packet.json | cut -c1-3800)"
                      previously_notified="$(jq -r '.lastReworkNotifiedIdentity // empty' /tmp/watchdog-state.json)"
                      if [ "$rework_identity" != "$previously_notified" ]; then
                        force_rework_poke=true
                        echo "Controller rejection $rework_identity requires immediate reviewer notification." >> "$GITHUB_STEP_SUMMARY"
                      fi
                    else
                      echo "::warning::Rework packet missing or invalid; watchdog retains the target and retries."
                    fi
                  fi

                  # Assignment-v2 controller validation is reviewer-request driven.
                  # The controller owns packet creation, so the watchdog must never wait
                  # for or manufacture a SUBMITTED packet as a validation trigger.
                else
                  directory_status="$(jq -r '.status // empty' /tmp/audit-campaign-directory.json)"
                  current_receipt_path="$(jq -r '.currentReceiptPath // empty' /tmp/audit-campaign-directory.json)"
                  if [ "$directory_status" = "COMPLETE" ] || [ "$directory_status" = "STOPPED_BY_HUMAN" ] || [ "$directory_status" = "CLOSED_INCOMPLETE" ]; then
                    retire_state "LITE_RECEIPT_CAMPAIGN_TERMINAL_$directory_status"
                    exit 0
                  fi
                  if [ -n "$current_receipt_path" ]; then
                    encoded_receipt="$(GH_TOKEN="$AUDIT_CONTROLLER_GITHUB_TOKEN" gh api "repos/$gate_repo/contents/$current_receipt_path?ref=$gate_ref" --jq '.content' 2>/dev/null || true)"
                    if [ -n "$encoded_receipt" ]; then
                      printf '%s' "$encoded_receipt" | base64 -d > /tmp/lite-phase-receipt.json
                      receipt_status="$(jq -r '.phase.status // empty' /tmp/lite-phase-receipt.json)"
                      receipt_phase="$(jq -r '.phase.id // empty' /tmp/lite-phase-receipt.json)"
                      receipt_seq="$(jq -r '.phase.sequence // empty' /tmp/lite-phase-receipt.json)"
                      handoff_required="$(jq -r '.handoff.required // false' /tmp/lite-phase-receipt.json)"
                      handoff_status="$(jq -r '.handoff.status // empty' /tmp/lite-phase-receipt.json)"
                      if [ -n "$receipt_phase" ] && [ "$receipt_phase" != "$gate_expected_phase" ]; then
                        jq --arg phase "$receipt_phase" '.phaseId=$phase | .gate.expectedPhaseId=$phase | .lastDecision=("RECEIPT_PHASE_SYNC_"+$phase)' /tmp/watchdog-state.json > /tmp/watchdog-state-next.json
                        mv /tmp/watchdog-state-next.json /tmp/watchdog-state.json
                        persist_state || true
                        gate_expected_phase="$receipt_phase"
                      fi
                      if [ "$receipt_status" = "EVIDENCE_READY" ]; then
                        GH_TOKEN="$GH_TOKEN" gh workflow run lite-solo-cloudflare-phase-receipt-controller-v1.yml --repo "$GITHUB_REPOSITORY" --ref main \
                          -f campaign_id="$campaign_id" -f campaign_path="$campaign_root" -f phase_sequence="$receipt_seq" -f audit_controller_ref="$gate_ref" || true
                      elif [ "$receipt_status" = "SEALED" ] && [ "$handoff_required" = "true" ] && [ "$handoff_status" = "SUCCESSOR_PENDING" ]; then
                        GH_TOKEN="$GH_TOKEN" gh workflow run lite-solo-cloudflare-audit-browser-orchestrator-v1.yml --repo "$GITHUB_REPOSITORY" --ref main \
                          -f campaign_id="$campaign_id" -f campaign_name="$campaign_title" -f campaign_path="$campaign_root" -f audit_controller_ref="$gate_ref"
                        retire_state "LITE_RECEIPT_SUCCESSOR_ORCHESTRATION_DISPATCHED_$receipt_phase"
                        exit 0
                      elif [ "$receipt_status" = "COMPLETE" ]; then
                        retire_state "LITE_RECEIPT_PHASE10_COMPLETE"
                        exit 0
                      fi
                    fi
                  fi
                fi
              fi
            fi

            # Lite campaign state is versioned immutably (v1, v2, v3...). Always
            # follow the newest canonical state/pointer in the same controller
            # directory instead of pinning a watchdog forever to its launch-time v1.
            if [ "$gate_mode" = "LITE" ] && [[ "$gate_path" == */controller/CAMPAIGN_STATE_v*.json ]] && [ -n "${AUDIT_CONTROLLER_GITHUB_TOKEN:-}" ]; then
              campaign_root_from_gate="${gate_path%/controller/*}"
              controller_api="repos/$gate_repo/contents/$campaign_root_from_gate/controller?ref=$gate_ref"
              latest_state_name="$(GH_TOKEN="$AUDIT_CONTROLLER_GITHUB_TOKEN" gh api "$controller_api" --jq '.[].name' 2>/dev/null | sed -n 's/^\(CAMPAIGN_STATE_v[0-9][0-9]*\.json\)$/\1/p' | sort -V | tail -n1)"
              latest_pointer_name="$(GH_TOKEN="$AUDIT_CONTROLLER_GITHUB_TOKEN" gh api "$controller_api" --jq '.[].name' 2>/dev/null | sed -n 's/^\(ACTIVE_PHASE_POINTER_v[0-9][0-9]*\.json\)$/\1/p' | sort -V | tail -n1)"
              if [ -n "$latest_state_name" ]; then gate_path="$campaign_root_from_gate/controller/$latest_state_name"; fi
              if [ -n "$latest_pointer_name" ]; then gate_pointer_path="$campaign_root_from_gate/controller/$latest_pointer_name"; fi
              jq --arg state "$gate_path" --arg pointer "$gate_pointer_path"                 '.gate.statePath=$state | .gate.activePointerPath=$pointer | .lastDecision="FOLLOW_LATEST_LITE_CONTROLLER_VERSION"'                 /tmp/watchdog-state.json > /tmp/watchdog-state-next.json
              mv /tmp/watchdog-state-next.json /tmp/watchdog-state.json
              persist_state || true

              safe_campaign="$(printf '%s' "$campaign_id" | tr -c 'A-Za-z0-9._-' '_')"
              reg_api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-wake/registrations/$safe_campaign.json"
              reg_encoded="$(gh api "$reg_api?ref=main" --jq '.content' 2>/dev/null || true)"
              if [ -n "$reg_encoded" ]; then
                printf '%s' "$reg_encoded" | base64 -d > /tmp/latest-state-registration.json
                reg_sha="$(gh api "$reg_api?ref=main" --jq '.sha' 2>/dev/null || true)"
                jq --arg state "$gate_path" --arg pointer "$gate_pointer_path"                   '.watchdog.gate.statePath=$state | .watchdog.gate.activePointerPath=$pointer | .updatedAt=(now|todate)'                   /tmp/latest-state-registration.json > /tmp/latest-state-registration-next.json
                reg_content="$(base64 -w0 /tmp/latest-state-registration-next.json)"
                [ -n "$reg_sha" ] && gh api --method PUT "$reg_api" -f message="chore(lite): follow latest controller state $campaign_id" -f content="$reg_content" -f sha="$reg_sha" -f branch=main >/dev/null || true
              fi
            fi

            if [ "$receipt_gate_mode" != "true" ] && [ -n "$gate_path" ] && [ -n "${AUDIT_CONTROLLER_GITHUB_TOKEN:-}" ]; then
              encoded_state="$(GH_TOKEN="$AUDIT_CONTROLLER_GITHUB_TOKEN" gh api "repos/$gate_repo/contents/$gate_path?ref=$gate_ref" --jq '.content' 2>/dev/null || true)"
              if [ -n "$encoded_state" ]; then
                printf '%s' "$encoded_state" | base64 -d > /tmp/canonical-campaign-state.json

                if [ "$gate_mode" = "LITE" ]; then
                  if check_reviewer_repair_request; then
                    reason="$(jq -r '.reason' /tmp/reviewer-repair-request.json)"
                    if dispatch_reviewer_repair "FILED_RESET_REQUEST: $reason"; then
                      retire_state "REVIEWER_REPAIR_RESET_DISPATCHED_$gate_expected_milestone"
                      exit 0
                    fi
                  fi

                  if [ "$worker_role" = "interphase_mechanical" ]; then
                    if verify_lite_interphase_completion "$gate_interphase_work_packet_path" "$gate_interphase_completion_path" "$gate_interphase_handoff_path" "$gate_expected_milestone" "$gate_repo" "$gate_ref"; then
                      echo "Inter-phase mechanical completion is machine-valid; launching the existing Lite successor path."
                      if launch_lite_successor "$gate_pointer_path" "$gate_expected_milestone" "$gate_repo" "$gate_ref"; then
                        retire_state "LITE_INTERPHASE_COMPLETE_SUCCESSOR_DISPATCHED_$gate_expected_milestone"
                        exit 0
                      else
                        rc=$?
                        if [ "$rc" -eq 3 ]; then
                          echo "::warning::Mechanical completion has no successor pointer yet, but campaignStatus is not terminal; keeping campaign automation active."
                        fi
                        echo "::warning::Mechanical completion is valid, but successor packet is not machine-ready yet; keeping mechanical worker supervised."
                      fi
                    fi
                    lite_campaign_status="$(jq -r '.campaignCompletionStatus // .campaignStatus // empty' /tmp/canonical-campaign-state.json)"
                    if [ "$lite_campaign_status" = "COMPLETE" ] || [ "$lite_campaign_status" = "STOPPED_BY_HUMAN" ] || [ "$lite_campaign_status" = "CLOSED_INCOMPLETE" ]; then
                      retire_state "LITE_CAMPAIGN_TERMINAL_DURING_INTERPHASE_$lite_campaign_status"
                      exit 0
                    fi
                  else
                  lite_campaign_status="$(jq -r '.campaignCompletionStatus // .campaignStatus // empty' /tmp/canonical-campaign-state.json)"
                  lite_phase_id="$(jq -r '.phase.id // empty' /tmp/canonical-campaign-state.json)"
                  lite_phase_state="$(jq -r '.phase.state // .phase.status // empty' /tmp/canonical-campaign-state.json)"
                  lite_milestone="$(jq -r '(.phase.milestoneId // empty) as $m | if $m != "" then $m else (.activeReviewer.lineage // empty) as $r | ([.routingPlan.workers[]? | select(.lineage==$r) | .milestone][0] // empty) end' /tmp/canonical-campaign-state.json)"
                  lite_worker_status="$(jq -r --arg m "$gate_expected_milestone" '.routingPlan.workers[]? | select(.milestone==$m) | .status' /tmp/canonical-campaign-state.json | tail -n1)"

                  # Overall automation terminates only at campaign-level terminal status.
                  # A closed/sealed phase or internal phase-number change is not terminal.
                  if [ "$lite_campaign_status" = "COMPLETE" ] || [ "$lite_campaign_status" = "STOPPED_BY_HUMAN" ] || [ "$lite_campaign_status" = "CLOSED_INCOMPLETE" ]; then
                    echo "Lite campaign reached terminal campaign status $lite_campaign_status; retiring watchdog."
                    retire_state "LITE_CAMPAIGN_TERMINAL_$lite_campaign_status"
                    exit 0
                  fi

                  # Same reviewer milestone may span multiple phases (2-5, 6-7, 8-10).
                  # Synchronize the existing chat/watchdog in place instead of spawning a new chat.
                  if [ "$worker_role" = "reviewer" ]                      && [ -n "$lite_milestone" ]                      && [ "$lite_milestone" = "$gate_expected_milestone" ]                      && [ -n "$lite_phase_id" ]                      && [ "$lite_phase_id" != "$gate_expected_phase" ]; then
                    echo "Internal phase advancement $gate_expected_phase -> $lite_phase_id within milestone $lite_milestone; keeping the same reviewer chat."
                    jq --arg phase "$lite_phase_id"                       '.phaseId=$phase | .gate.expectedPhaseId=$phase | .idleMessage="GET BACK TO WORK" | .lastDecision=("INTERNAL_PHASE_SYNC_"+$phase)'                       /tmp/watchdog-state.json > /tmp/watchdog-state-next.json
                    mv /tmp/watchdog-state-next.json /tmp/watchdog-state.json
                    persist_state || true
                    gate_expected_phase="$lite_phase_id"

                    safe_campaign="$(printf '%s' "$campaign_id" | tr -c 'A-Za-z0-9._-' '_')"
                    reg_api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-wake/registrations/$safe_campaign.json"
                    reg_encoded="$(gh api "$reg_api?ref=main" --jq '.content' 2>/dev/null || true)"
                    if [ -n "$reg_encoded" ]; then
                      printf '%s' "$reg_encoded" | base64 -d > /tmp/phase-sync-registration.json
                      reg_sha="$(gh api "$reg_api?ref=main" --jq '.sha' 2>/dev/null || true)"
                      jq --arg phase "$lite_phase_id"                         '.activeAssignment.phaseId=$phase | .watchdog.gate.expectedPhaseId=$phase | .watchdog.idleMessage="GET BACK TO WORK" | .updatedAt=(now|todate)'                         /tmp/phase-sync-registration.json > /tmp/phase-sync-registration-next.json
                      reg_content="$(base64 -w0 /tmp/phase-sync-registration-next.json)"
                      [ -n "$reg_sha" ] && gh api --method PUT "$reg_api" -f message="chore(lite): sync $campaign_id to $lite_phase_id" -f content="$reg_content" -f sha="$reg_sha" -f branch=main >/dev/null || true
                    fi
                  fi

                  if [ "$gate_expected_milestone" = "P0_BOOTSTRAP" ] && [ "$lite_phase_state" = "WAITING_FOR_SUCCESSOR_AGENT" ]; then
                    if launch_lite_successor "$gate_pointer_path" "$gate_expected_milestone" "$gate_repo" "$gate_ref"; then
                      retire_state "LITE_SUCCESSOR_DISPATCHED_P0_BOOTSTRAP"
                      exit 0
                    else
                      rc=$?
                      if [ "$rc" -eq 4 ]; then
                        retire_state "LITE_INTERPHASE_DISPATCHED_P0_BOOTSTRAP"
                        exit 0
                      fi
                    fi
                    echo "::warning::Phase-0 bootstrap is waiting for successor, but its transition packet is not machine-ready yet; keeping bootstrap agent supervised."
                  fi

                  case "$lite_worker_status" in
                    COMPLETE|COMPLETED|SEALED|PASS)
                      if launch_lite_successor "$gate_pointer_path" "$gate_expected_milestone" "$gate_repo" "$gate_ref"; then
                        retire_state "LITE_SUCCESSOR_DISPATCHED_$gate_expected_milestone"
                        exit 0
                      else
                        rc=$?
                        if [ "$rc" -eq 4 ]; then
                          retire_state "LITE_INTERPHASE_DISPATCHED_$gate_expected_milestone"
                          exit 0
                        fi
                        if [ "$rc" -eq 3 ]; then
                          echo "::warning::Milestone has no successor but campaignStatus is not COMPLETE; keeping automation active until final campaign completion is durable."
                        fi
                        echo "::warning::Lite milestone is sealed but successor packet is not machine-ready yet; current agent remains supervised."
                      fi
                      ;;
                  esac

                  if [ -n "$gate_expected_phase" ] && [ -n "$lite_phase_id" ] && [ "$lite_phase_id" != "$gate_expected_phase" ] && [ "$lite_worker_status" != "ACTIVE" ]; then
                    echo "Lite phase moved beyond $gate_expected_phase but successor packet is not yet ready; keeping watchdog active for handoff completion."
                  fi
                  fi
                else
                  canonical_state="$(jq -r '.state // empty' /tmp/canonical-campaign-state.json)"
                  canonical_campaign_status="$(jq -r '.campaignStatus // empty' /tmp/canonical-campaign-state.json)"
                  canonical_phase="$(jq -r '.currentPhase // empty' /tmp/canonical-campaign-state.json)"

                  if jq -e --arg s "$canonical_state" '.gate.stopStates | index($s) != null' /tmp/watchdog-state.json >/dev/null; then
                    echo "Canonical V26 gate reached terminal agent state $canonical_state; retiring watchdog."
                    retire_state "CANONICAL_GATE_STATE_$canonical_state"
                    exit 0
                  fi
                  if jq -e --arg s "$canonical_campaign_status" '.gate.stopCampaignStatuses | index($s) != null' /tmp/watchdog-state.json >/dev/null; then
                    echo "Canonical campaign status $canonical_campaign_status is terminal; retiring watchdog."
                    retire_state "CANONICAL_CAMPAIGN_STATUS_$canonical_campaign_status"
                    exit 0
                  fi
                  if [ -n "$gate_expected_phase" ] && [ -n "$canonical_phase" ] && [ "$canonical_phase" != "$gate_expected_phase" ]; then
                    echo "Canonical V26 gate advanced from $gate_expected_phase to $canonical_phase; retiring watchdog."
                    retire_state "CANONICAL_PHASE_ADVANCED_TO_$canonical_phase"
                    exit 0
                  fi
                fi
              else
                echo "::warning::Canonical campaign state could not be read; watchdog will continue and retry."
              fi
            fi

            if [ -z "$chat_url" ]; then
              echo "::warning::No chat URL for $WAKE_ID; next scheduled sweep will retry."
              continue
            fi

            # Audit browser invariant: the watchdog never reads ChatGPT DOM/page
            # state. Controller/campaign state above determines whether the phase is
            # still active. The browser is touched only when the elapsed-time gate
            # calls for a human-style Phase-1 X11 poke.
            # Durable progress resets this chat's own clock. Each watched chat keeps a separate
            # timer: only commits to paths this chat writes count (its wake check-in file and the
            # work/submission folders of the phase it is on), so another reviewer's commits in the
            # same campaign never hide a stalled chat.
            if [ "$receipt_gate_mode" = "true" ] && [ -n "${campaign_root:-}" ] && [ -n "${AUDIT_CONTROLLER_GITHUB_TOKEN:-}" ]; then
              chat_paths=()
              ack_path="$(jq -r '.ackPath // empty' /tmp/watchdog-state.json)"
              [ -n "$ack_path" ] && chat_paths+=("$ack_path")
              phase_n="$(jq -r '.gate.expectedPhaseId // .phaseId // empty' /tmp/watchdog-state.json | sed -n 's/^phase-\([0-9][0-9]*\)$/\1/p')"
              if [ -n "$phase_n" ]; then
                phase_dir="$(printf 'work/phase-%02d' "$phase_n")"
                if [[ "$(jq -r '.gate.expectedMilestoneId // empty' /tmp/watchdog-state.json)" == DISCOVERY_* ]]; then
                  chat_paths+=("$campaign_root/$phase_dir/discovery")
                elif [ "$phase_n" = "5" ]; then
                  # Controller writes generated Phase-5 submissions/reports and
                  # evidence. Those commits are NOT reviewer progress.
                  chat_paths+=("$campaign_root/$phase_dir/shards")
                else
                  chat_paths+=("$campaign_root/$phase_dir")
                fi
              fi
              [ "${#chat_paths[@]}" -gt 0 ] || chat_paths=("$campaign_root")
              progress_at=""
              for chat_path in "${chat_paths[@]}"; do
                encoded_path="$(printf '%s' "$chat_path" | sed 's/ /%20/g')"
                at="$(GH_TOKEN="$AUDIT_CONTROLLER_GITHUB_TOKEN" gh api "repos/$gate_repo/commits?sha=$gate_ref&path=$encoded_path&per_page=1" --jq '.[0].commit.committer.date // empty' 2>/dev/null || true)"
                if [ -n "$at" ] && { [ -z "$progress_at" ] || [ "$(date -u -d "$at" +%s)" -gt "$(date -u -d "$progress_at" +%s)" ]; }; then progress_at="$at"; fi
              done
              previous_progress="$(jq -r '.lastProgressAt // empty' /tmp/watchdog-state.json)"
              if [ -n "$progress_at" ] && [ "$progress_at" != "$previous_progress" ]; then
                progress_epoch="$(date -u -d "$progress_at" +%s 2>/dev/null || echo 0)"
                armed_epoch="$(date -u -d "$(jq -r '.lastPokedAt // .armedAt // empty' /tmp/watchdog-state.json)" +%s 2>/dev/null || echo 0)"
                if [ "$progress_epoch" -gt "$armed_epoch" ]; then
                  jq --arg at "$progress_at" '.lastProgressAt=$at | .repair.consecutiveIdlePokes=0 | .lastDecision="DURABLE_PROGRESS_RESETS_POKE_CLOCK"' \
                    /tmp/watchdog-state.json > /tmp/watchdog-state-next.json
                  mv /tmp/watchdog-state-next.json /tmp/watchdog-state.json
                  persist_state || true
                fi
              fi
            fi
            reference_at="$(jq -r '[.lastPokedAt, .armedAt, .lastProgressAt] | map(select(. != null and . != "")) | max // empty' /tmp/watchdog-state.json)"
            poke_interval_minutes="$(jq -r '.pokeIntervalMinutes // 20' /tmp/watchdog-state.json)"
            [[ "$poke_interval_minutes" =~ ^[0-9]+$ ]] || poke_interval_minutes=20
            now_epoch="$(date -u +%s)"
            reference_epoch="$(date -u -d "$reference_at" +%s 2>/dev/null || echo 0)"
            if [ "$reference_epoch" -le 0 ]; then
              reference_epoch="$now_epoch"
            fi
            elapsed_minutes="$(( (now_epoch - reference_epoch) / 60 ))"

            if [ "$force_rework_poke" != true ] && [ "$elapsed_minutes" -lt "$poke_interval_minutes" ]; then
              echo "Watchdog $WAKE_ID: controller still active; no ChatGPT read. Next X11 poke eligible after ${poke_interval_minutes} minutes (elapsed=${elapsed_minutes})."
              jq --argjson elapsed "$elapsed_minutes" --argjson interval "$poke_interval_minutes" \
                '.lastDecision="WAITING_NO_CHATGPT_READ"
                 | .lastNoReadSweepAt=(now|todate)
                 | .elapsedSinceLastPokeMinutes=$elapsed
                 | .pokeIntervalMinutes=$interval' \
                /tmp/watchdog-state.json > /tmp/watchdog-state-next.json
              mv /tmp/watchdog-state-next.json /tmp/watchdog-state.json
              persist_state || true
              continue
            fi

            prior_idle_pokes="$(jq -r '.repair.consecutiveIdlePokes // 0' /tmp/watchdog-state.json)"
            idle_threshold="$(jq -r '.repair.idlePokeThreshold // 3' /tmp/watchdog-state.json)"
            if [ "$prior_idle_pokes" -ge "$idle_threshold" ]; then
              # Three visibly delivered pokes with no verified reviewer-authored
              # Git progress prove that re-waking the same chat has not recovered
              # the assignment. A successfully QUEUED repair of that same chat is
              # not proof of takeover. Promote the already registered one-time
              # standby first, preserving the current phase/receipt/work shards.
              # Do not launch controller simulation or tests from this watchdog.
              if dispatch_registered_backup; then
                retire_state "BACKUP_CHAT_REBOUND_AFTER_${prior_idle_pokes}_NO_PROGRESS_POKES"
                exit 0
              fi
              # If no eligible standby remains, use existing reviewer repair
              # as a bounded last-resort wake, without inventing another chat.
              if dispatch_reviewer_repair "NO_CONTROLLER_ADVANCE_AFTER_${prior_idle_pokes}_PHASE1_X11_POKES"; then
                retire_state "REVIEWER_REPAIR_DISPATCHED_AFTER_${prior_idle_pokes}_NO_PROGRESS_POKES"
                exit 0
              fi
              echo "::error::Reviewer recovery could not dispatch either registered standby or repair."
              exit 1
            fi

            echo "Watchdog $WAKE_ID: elapsed-time gate reached; sending configured GET BACK TO WORK using the proven Phase-1 fixed X11 path."
            export WAKE_MODE='resume_existing'
            export CHAT_URL="$chat_url"
            if [ "$force_rework_poke" = true ] && [ -n "$rework_feedback" ]; then
              export WAKE_MESSAGE="$rework_feedback"
            else
              export WAKE_MESSAGE="$(jq -r '.idleMessage' /tmp/watchdog-state.json)"
            fi
            export WAKE_RESULT_PATH="/tmp/$safe_id-poke.json"
            # A stalled chat still showing the stop button is stopped first so the poke lands.
            export STOP_BEFORE_SEND='true'
            # Same delivery as the reviewer wake; only the message text differs.
            bash scripts/lite-solo-cloudflare-runtime-v1/scripts/browser-deliver-message-v1.sh > "/tmp/$safe_id-poke.out" || true
            poke_ok="$(sed -n 's/^ok=//p' "/tmp/$safe_id-poke.out")"
            poke_skipped="$(sed -n 's/^skipped=//p' "/tmp/$safe_id-poke.out")"
            stop_click="$(jq -c '.stopClick // null' "$WAKE_RESULT_PATH" 2>/dev/null || echo null)"
            echo "Watchdog $WAKE_ID stop click: $stop_click" >> "$GITHUB_STEP_SUMMARY"
            jq --argjson sc "${stop_click:-null}" '.lastStopClick=$sc' /tmp/watchdog-state.json > /tmp/watchdog-state-sc.json && mv /tmp/watchdog-state-sc.json /tmp/watchdog-state.json

            if [ "$poke_ok" = true ]; then
              jq --argjson interval "$poke_interval_minutes" \
                 --arg rework "$rework_identity" \
                 --argjson force "$force_rework_poke" \
                '.lastPokedAt=(now|todate)
                 | (if $force and $rework!="" then .lastReworkNotifiedIdentity=$rework else . end)
                 | .pokeCount=((.pokeCount // 0)+1)
                 | .repair.consecutiveIdlePokes=((.repair.consecutiveIdlePokes // 0)+1)
                 | .pokeFailureCount=0
                 | .lastDecision="TIME_GATED_PHASE1_X11_POKE_SENT_NO_CHATGPT_READ"
                 | .pokeIntervalMinutes=$interval' \
                /tmp/watchdog-state.json > /tmp/watchdog-state-next.json
            elif [ -n "$poke_skipped" ]; then
              echo "::warning::Watchdog poke not sent ($poke_skipped); not counted as a poke."
              jq --arg why "$poke_skipped" '.lastDecision=("POKE_NOT_SENT_"+$why) | .lastPokeSkippedAt=(now|todate)' \
                /tmp/watchdog-state.json > /tmp/watchdog-state-next.json
            else
              echo "::warning::Watchdog X11 poke transport failed; treating as infrastructure noise and not as reviewer failure."
              jq '.lastDecision="PHASE1_X11_POKE_TRANSPORT_FAILED_RETRY_LATER"
                   | .lastPokeFailureAt=(now|todate)
                   | .pokeFailureCount=((.pokeFailureCount // 0)+1)' \
                /tmp/watchdog-state.json > /tmp/watchdog-state-next.json
            fi

            mv /tmp/watchdog-state-next.json /tmp/watchdog-state.json
            persist_state || true
            if [ "$poke_ok" != true ] && [ -z "$poke_skipped" ] &&
               [ "$(jq -r '.pokeFailureCount // 0' /tmp/watchdog-state.json)" -ge 2 ]; then
              # Green workflow runs must not mask repeated failed browser delivery.
              # Existing rearm keeps the target active for the next recovery sweep.
              echo "::error::Watchdog browser transport failed on consecutive sweeps; canonical target remains ACTIVE for recovery."
              exit 1
            fi
           done

          if fetch_state; then
            echo 'Watchdog sweep complete; active state remains for the next scheduled sweep.'
          else
            echo 'Watchdog was retired during this sweep.'
          fi

      - name: Disable home exit node
        if: always()
        shell: bash
        run: |
          set +e
          sudo tailscale set --exit-node=""

      - name: Cleanup browser display
        if: always()
        shell: bash
        run: |
          set +e
          [ -f /tmp/x11vnc-browser-watchdog.pid ] && kill "$(cat /tmp/x11vnc-browser-watchdog.pid)" 2>/dev/null
          [ -f /tmp/xvfb-browser-watchdog.pid ] && kill "$(cat /tmp/xvfb-browser-watchdog.pid)" 2>/dev/null
