name: RangeManager isolated runtime compilation v1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rangemanager-size-compile-v1.yml'
      - 'scratch/rangemanager-size-v1/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile Solidity only and report deployed bytecode
        shell: bash
        run: |
          set -euo pipefail
          ROOT="scratch/rangemanager-size-v1"
          cd "$ROOT"
          mkdir -p vendor
          git clone --depth 1 -q --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git vendor/openzeppelin-contracts
          mkdir -p source
          cp RangeManager.sol RangeManager_original.sol source/
          cp -R router lib positions source/
          cat > foundry.toml <<'EOF'
          [profile.default]
          src = "source"
          out = "out"
          test = "unused"
          libs = ["vendor"]
          solc_version = "0.8.30"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          bytecode_hash = "ipfs"
          remappings = ["@openzeppelin/contracts/=vendor/openzeppelin-contracts/contracts/"]
          EOF
          for runs in 200 1; do
            sed -i "s/optimizer_runs = .*/optimizer_runs = $runs/" foundry.toml
            rm -rf out cache
            echo "=== BUILD optimizer_runs=$runs via_ir=true ==="
            forge build --skip unused
            python3 - "$runs" <<'PY'
          import json,sys
          from pathlib import Path
          for path in sorted(Path("out").glob("**/RangeManager.json")):
              payload=json.loads(path.read_text())
              b=payload.get("deployedBytecode",{}).get("object","")
              print(f"DEPLOYED_BYTES source={path.parent.name} contract=RangeManager optimizer_runs={sys.argv[1]} size={(len(b)-2)//2} limit=24576")
          for path in sorted(Path("out").glob("**/BotSwapRouter.json")):
              payload=json.loads(path.read_text())
              b=payload.get("deployedBytecode",{}).get("object","")
              print(f"DEPLOYED_BYTES source={path.parent.name} contract=BotSwapRouter optimizer_runs={sys.argv[1]} size={(len(b)-2)//2} limit=24576")
          PY
          done
