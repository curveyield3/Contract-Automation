name: Original Phase0 Home-Exit Browser v10

on:
  workflow_dispatch:
    inputs:
      action:
        description: Observe/authenticate only or send a wake
        required: true
        default: observe
        type: choice
        options:
          - observe
          - wake
          - recover
          - project_wake
      mode:
        description: Browser mode
        required: true
        default: create_fresh
        type: choice
        options:
          - create_fresh
          - resume_existing
      chat_url:
        description: Existing ChatGPT conversation URL for resume_existing
        required: false
        default: https://chatgpt.com/c/6abe90a0-fd68-83e8-8026-8af0171605fc
        type: string
      project_name:
        description: Project name for action=project_wake
        required: false
        default: "Home Exit Project Test"
        type: string
      wake_message:
        description: Message to send when action=wake or project_wake
        required: false
        default: "[HOME_EXIT_PLAYWRIGHT_WAKE_v10] Assistant: when you personally receive this as a new user message, reply exactly HOME_EXIT_PLAYWRIGHT_WAKE_PERSONALLY_SEEN_v10"
        type: string
      home_exit_node:
        description: Windows PC Tailscale IP or MagicDNS name
        required: true
        default: 100.112.238.56
        type: string
      interactive_view:
        description: Expose the runner Chrome display privately over Tailscale VNC
        required: true
        default: true
        type: boolean
      manual_challenge_wait_minutes:
        description: Maximum wait for manual login/verification
        required: true
        default: "5"
        type: string

  push:
    branches:
      - main
    paths:
      - 'process/browser-agent-home-exit-v10/current-request-v10.json'

permissions:
  contents: read
  id-token: write

concurrency:
  # One saved ChatGPT browser state is shared by every browser workflow.
  # Queue ownership transfers; never cancel or overlap another browser owner.
  group: chatgpt-shared-browser-session-v1
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CHATGPT_STORAGE_STATE_B64: ${{ secrets.CHATGPT_STORAGE_STATE_B64 }}
      DISPLAY: ":99"
      BROWSER_HEADLESS: "false"
      WAKE_RESULT_PATH: /tmp/browser-agent-home-exit-v10-result.json

    steps:
      - name: Checkout trusted browser package
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1


      - name: Resolve browser request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SHA: ${{ github.sha }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CHAT_URL: ${{ inputs.chat_url }}
          INPUT_WAKE_MESSAGE: ${{ inputs.wake_message }}
          INPUT_PROJECT_NAME: ${{ inputs.project_name }}
          INPUT_HOME_EXIT_NODE: ${{ inputs.home_exit_node }}
          INPUT_INTERACTIVE_VIEW: ${{ inputs.interactive_view }}
          INPUT_MANUAL_WAIT: ${{ inputs.manual_challenge_wait_minutes }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            request_path="process/browser-agent-home-exit-v10/current-request-v10.json"
            request="/tmp/browser-home-exit-request-at-trigger.json"
            git fetch --no-tags --depth=1 origin "$TRIGGER_SHA"
            git show "$TRIGGER_SHA:$request_path" > "$request"
            test -s "$request"
            echo "Resolved push request from triggering commit $TRIGGER_SHA, not mutable main."
            echo "action=$(jq -r '.action // "observe"' "$request")" >> "$GITHUB_OUTPUT"
            echo "mode=$(jq -r '.mode // "create_fresh"' "$request")" >> "$GITHUB_OUTPUT"
            echo "chat_url=$(jq -r '.chat_url // ""' "$request")" >> "$GITHUB_OUTPUT"
            {
              echo 'wake_message<<__CURVEYIELD_WAKE__'
              jq -r '.wake_message // ""' "$request"
              echo '__CURVEYIELD_WAKE__'
            } >> "$GITHUB_OUTPUT"
            echo "project_name=$(jq -r '.project_name // ""' "$request")" >> "$GITHUB_OUTPUT"
            echo "home_exit_node=$(jq -r '.home_exit_node' "$request")" >> "$GITHUB_OUTPUT"
            echo "interactive_view=$(jq -r '.interactive_view // true' "$request")" >> "$GITHUB_OUTPUT"
            echo "manual_wait=$(jq -r '.manual_challenge_wait_minutes // 5' "$request")" >> "$GITHUB_OUTPUT"
          else
            echo "action=$INPUT_ACTION" >> "$GITHUB_OUTPUT"
            echo "mode=$INPUT_MODE" >> "$GITHUB_OUTPUT"
            echo "chat_url=$INPUT_CHAT_URL" >> "$GITHUB_OUTPUT"
            {
              echo 'wake_message<<__CURVEYIELD_WAKE__'
              printf '%s\n' "$INPUT_WAKE_MESSAGE"
              echo '__CURVEYIELD_WAKE__'
            } >> "$GITHUB_OUTPUT"
            echo "project_name=$INPUT_PROJECT_NAME" >> "$GITHUB_OUTPUT"
            echo "home_exit_node=$INPUT_HOME_EXIT_NODE" >> "$GITHUB_OUTPUT"
            echo "interactive_view=$INPUT_INTERACTIVE_VIEW" >> "$GITHUB_OUTPUT"
            echo "manual_wait=$INPUT_MANUAL_WAIT" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up isolated Playwright runtime
        uses: ./packages/browser-agent-original-phase0-v10/runtime-v10

      - name: Install visible browser input helpers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xdotool
          if [ "${{ steps.request.outputs.interactive_view }}" = "true" ]; then
            sudo apt-get install -y x11vnc
          fi

      - name: Record runner egress before home exit node
        shell: bash
        run: |
          set -euo pipefail
          direct="$(curl -fsS --max-time 15 https://api.ipify.org)"
          test -n "$direct"
          printf '%s' "$direct" | sha256sum | awk '{print "DIRECT_EGRESS_HASH="$1}' >> "$GITHUB_ENV"
          echo "Recorded runner egress fingerprint without logging the address."

      - name: Connect runner to tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: api.tailscale.com/${{ secrets.TS_OAUTH_CLIENT_ID }}
          tags: tag:audit-browser
          ping: ${{ steps.request.outputs.home_exit_node }}

      - name: Start visible Chrome display and private tailnet VNC
        shell: bash
        env:
          INTERACTIVE_VIEW: ${{ steps.request.outputs.interactive_view }}
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension RANDR >/tmp/xvfb-v10.log 2>&1 &
          echo $! >/tmp/xvfb-v10.pid
          for i in {1..20}; do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 1
          done
          xdpyinfo -display :99 >/dev/null 2>&1 || {
            echo "::error::Xvfb did not become ready."
            cat /tmp/xvfb-v10.log || true
            exit 1
          }

          ts_ip="$(tailscale ip -4 | head -n1)"
          test -n "$ts_ip"
          echo "TAILSCALE_RUNNER_IP=$ts_ip" >> "$GITHUB_ENV"

          if [ "$INTERACTIVE_VIEW" = "true" ]; then
            x11vnc -display :99 -rfbport 5900 -listen "$ts_ip" -nopw -forever -shared -quiet >/tmp/x11vnc-v10.log 2>&1 &
            echo $! >/tmp/x11vnc-v10.pid
            echo "TAILSCALE_VNC=$ts_ip:5900"
            echo "Connect your VNC viewer from the Windows PC to $ts_ip:5900 while this job is running."
          fi

      - name: Route browser phase through home exit node
        shell: bash
        env:
          HOME_EXIT_NODE: ${{ steps.request.outputs.home_exit_node }}
        run: |
          set -euo pipefail
          timeout -k 3s 10s tailscale status
          timeout -k 5s 20s sudo tailscale set --exit-node="$HOME_EXIT_NODE"

          changed=false
          for i in {1..8}; do
            current="$(curl -fsS --connect-timeout 3 --max-time 5 https://api.ipify.org || true)"
            if [ -n "$current" ]; then
              current_hash="$(printf '%s' "$current" | sha256sum | awk '{print $1}')"
              if [ "$current_hash" != "$DIRECT_EGRESS_HASH" ]; then
                changed=true
                break
              fi
            fi
            sleep 2
          done

          if [ "$changed" != "true" ]; then
            echo "::error::Tailscale exit node did not change runner egress."
            exit 1
          fi
          echo "HOME_EXIT_EGRESS_ACTIVE=true"

      - name: Run Playwright through home exit node
        id: browser
        shell: bash
        env:
          WAKE_ACTION: ${{ steps.request.outputs.action }}
          WAKE_MODE: ${{ steps.request.outputs.mode }}
          CHAT_URL: ${{ steps.request.outputs.chat_url }}
          WAKE_MESSAGE: ${{ steps.request.outputs.wake_message }}
          PROJECT_NAME: ${{ steps.request.outputs.project_name }}
          WAKE_ID: home-exit-playwright-v10-${{ github.run_id }}
          INTERACTIVE_VIEW_ENABLED: ${{ steps.request.outputs.interactive_view }}
          MANUAL_CHALLENGE_WAIT_MINUTES: ${{ steps.request.outputs.manual_wait }}
        run: |
          set -euo pipefail
          export MANUAL_CHALLENGE_WAIT_MS=$((MANUAL_CHALLENGE_WAIT_MINUTES * 60000))
          if [ "$INTERACTIVE_VIEW_ENABLED" = "true" ]; then
            echo "Private VNC: $TAILSCALE_RUNNER_IP:5900"
          fi

          node packages/browser-agent-original-phase0-v10/browser-agent-wake-v10.mjs
          test -s "$WAKE_RESULT_PATH"
          cat "$WAKE_RESULT_PATH"

          if [ "$WAKE_ACTION" = "observe" ]; then
            jq -e '.ok==true and (.provider=="github-playwright" or .provider=="normal-system-chrome-x11")' "$WAKE_RESULT_PATH" >/dev/null
          elif [ "$WAKE_ACTION" = "recover" ]; then
            jq -e '.ok==true and .provider=="github-playwright" and .recovered==true and (.chatUrl|test("^https://chatgpt.com/c/"))' "$WAKE_RESULT_PATH" >/dev/null
          else
            jq -e '.ok==true and (.provider=="github-playwright" or .provider=="normal-system-chrome-x11") and (.posted==true or .skipped=="PRODUCTIVE_GENERATING")' "$WAKE_RESULT_PATH" >/dev/null
          fi

      - name: Upload Project create evidence v1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-project-create-evidence-v1
          path: /tmp/browser-project-create-evidence-v1/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload wake send evidence v1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-wake-evidence-v1
          path: /tmp/browser-wake-evidence-v1/
          if-no-files-found: warn
          retention-days: 7

      - name: Disable home exit node
        if: always()
        shell: bash
        run: |
          set +e
          sudo tailscale set --exit-node=""
          echo "Home exit-node routing disabled for post-browser workflow steps."

      - name: Cleanup browser display
        if: always()
        shell: bash
        run: |
          set +e
          [ -f /tmp/x11vnc-v10.pid ] && kill "$(cat /tmp/x11vnc-v10.pid)" 2>/dev/null || true
          [ -f /tmp/xvfb-v10.pid ] && kill "$(cat /tmp/xvfb-v10.pid)" 2>/dev/null || true
