name: Lite Phase Boundary Controller v3

on:
  push:
    branches: [main]
    paths:
      - 'process/agent-upload/lite-phase-boundary/*.json'
  workflow_dispatch:
    inputs:
      campaign_id:
        required: true
        type: string
      campaign_path:
        required: false
        default: ''
        type: string
      campaign_directory_path:
        required: false
        default: ''
        type: string
      review_kind:
        required: false
        default: phase
        type: choice
        options: [phase, discovery, master, master-test-result, sealed-rework, post-completion-followup]
      unit_id:
        required: false
        default: ''
        type: string
      phase_sequence:
        required: false
        default: ''
        type: string
      segment_id:
        required: false
        default: ''
        type: string
      master_outcome:
        description: Master review outcome (AMENDED, ACCEPT_WITHOUT_MODIFICATIONS, REQUEST_TARGETED_TESTS, or owner-deferred CLOSE_INCOMPLETE)
        required: false
        default: ''
        type: string
      test_plan_path:
        required: false
        default: ''
        type: string
      test_result_path:
        required: false
        default: ''
        type: string
      rework_request_path:
        description: Private Audit-Controller path to typed sealed-phase rework admission
        required: false
        default: ''
        type: string
      hold_successor_delivery:
        description: Branch qualification hold; blocks every browser wake and successor dispatch
        required: false
        default: false
        type: boolean
      audit_controller_ref:
        required: false
        default: main
        type: string

permissions:
  contents: write
  actions: write

jobs:
  # Discover every changed campaign boundary before applying independent locks.
  resolve_campaign_lock:
    runs-on: ubuntu-latest
    outputs:
      requests: ${{ steps.identity.outputs.requests }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve campaign-specific boundary requests
        id: identity
        env:
          DISPATCH_CAMPAIGN_ID: ${{ inputs.campaign_id }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/lite-boundary-requests.ndjson
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [[ "$DISPATCH_CAMPAIGN_ID" =~ ^[A-Za-z0-9._-]+-r[0-9]+$ ]] || exit 1
            jq -nc --arg id "$DISPATCH_CAMPAIGN_ID" '{campaign_id:$id,request_path:"__MANUAL__"}' >> /tmp/lite-boundary-requests.ndjson
          else
            root=process/agent-upload/lite-phase-boundary
            if [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
              mapfile -t changed < <(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- "$root/")
            else
              mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- "$root/")
            fi
            for request in "${changed[@]}"; do
              [[ "$request" =~ ^process/agent-upload/lite-phase-boundary/[A-Za-z0-9._-]+\.json$ ]] || continue
              test -f "$request" || continue
              jq -ec --arg file "$request" '
                select((.campaignId|type)=="string"
                  and (.campaignId|test("^[A-Za-z0-9._-]+-r[0-9]+$")))
                | {campaign_id:.campaignId,request_path:$file}
              ' "$request" >> /tmp/lite-boundary-requests.ndjson
            done
          fi
          echo "requests=$(jq -sc '{include:.}' /tmp/lite-boundary-requests.ndjson)" >> "$GITHUB_OUTPUT"

  validate-bookkeep-advance:
    needs: resolve_campaign_lock
    if: ${{ needs.resolve_campaign_lock.outputs.requests != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve_campaign_lock.outputs.requests) }}
    # Same-campaign push and manual dispatch share a lock. Keep cancel off.
    concurrency:
      group: lite-phase-boundary-controller-${{ matrix.campaign_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Phase 5 may run multiple 35-minute candidate-specific V7 executions.
    # Preflight fails immediately on missing RPC; this is only the outer ceiling.
    timeout-minutes: 90
    steps:
      - name: Checkout trusted Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve controller-validation request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_CAMPAIGN_ID: ${{ inputs.campaign_id }}
          DISPATCH_CAMPAIGN_PATH: ${{ inputs.campaign_path }}
          DISPATCH_DIRECTORY_PATH: ${{ inputs.campaign_directory_path }}
          DISPATCH_REVIEW_KIND: ${{ inputs.review_kind }}
          DISPATCH_UNIT_ID: ${{ inputs.unit_id }}
          DISPATCH_PHASE_SEQUENCE: ${{ inputs.phase_sequence }}
          DISPATCH_SEGMENT_ID: ${{ inputs.segment_id }}
          DISPATCH_MASTER_OUTCOME: ${{ inputs.master_outcome }}
          DISPATCH_TEST_PLAN_PATH: ${{ inputs.test_plan_path }}
          DISPATCH_TEST_RESULT_PATH: ${{ inputs.test_result_path }}
          DISPATCH_REWORK_REQUEST_PATH: ${{ inputs.rework_request_path }}
          DISPATCH_HOLD_DELIVERY: ${{ inputs.hold_successor_delivery }}
          DISPATCH_CONTROLLER_REF: ${{ inputs.audit_controller_ref }}
          MATRIX_REQUEST_PATH: ${{ matrix.request_path }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            campaign_id="$DISPATCH_CAMPAIGN_ID"
            review_kind="${DISPATCH_REVIEW_KIND:-phase}"
            unit_id="$DISPATCH_UNIT_ID"
            phase_sequence="$DISPATCH_PHASE_SEQUENCE"
            segment_id="$DISPATCH_SEGMENT_ID"
            master_outcome="$DISPATCH_MASTER_OUTCOME"
            master_summary_b64=""
            test_plan_path="$DISPATCH_TEST_PLAN_PATH"
            test_result_path="$DISPATCH_TEST_RESULT_PATH"
            rework_request_path="$DISPATCH_REWORK_REQUEST_PATH"
            hold_delivery="${DISPATCH_HOLD_DELIVERY:-false}"
            controller_ref="${DISPATCH_CONTROLLER_REF:-main}"
            supplied_campaign_path="$DISPATCH_CAMPAIGN_PATH"
            supplied_directory_path="$DISPATCH_DIRECTORY_PATH"
          else
            request_path="$MATRIX_REQUEST_PATH"
            [[ "$request_path" =~ ^process/agent-upload/lite-phase-boundary/[A-Za-z0-9._-]+\.json$ ]] || exit 1
            encoded="$(gh api "repos/$GITHUB_REPOSITORY/contents/$request_path?ref=$GITHUB_SHA" --jq '.content')"
            printf '%s' "$encoded" | base64 -d > /tmp/lite-phase-boundary-request.json
            jq -e '
              .schemaVersion=="curveyield-lite-phase-boundary-request-v1" and
              ((.campaignId|type)=="string") and (.campaignId|length)>0 and
              (((.reviewKind // "phase")=="phase" and ((.phaseSequence|type)=="number") and ((.phaseSequence|floor)==.phaseSequence) and .phaseSequence>=1 and .phaseSequence<=10) or
               ((.reviewKind // "phase")=="discovery" and ((.unitId|type)=="string") and (.unitId|test("^[FRX]-[0-9]{3}$"))) or
               ((.reviewKind // "phase")=="master" and ((.segmentId|type)=="string") and (.segmentId|length)>0 and (.masterOutcome=="AMENDED" or .masterOutcome=="ACCEPT_WITHOUT_MODIFICATIONS" or .masterOutcome=="CLOSE_INCOMPLETE" or (.masterOutcome=="REQUEST_TARGETED_TESTS" and ((.testPlanPath|type)=="string") and (.testPlanPath|length)>0)) and ((.summary // "")|type)=="string") or
               ((.reviewKind // "phase")=="master-test-result" and ((.segmentId|type)=="string") and (.segmentId|length)>0 and ((.testResultPath|type)=="string") and (.testResultPath|length)>0) or
               ((.reviewKind // "phase")=="sealed-rework" and ((.phaseSequence|type)=="number") and .phaseSequence==1 and ((.reworkRequestPath|type)=="string") and (.reworkRequestPath|length)>0 and .holdSuccessorDelivery==true) or
               ((.reviewKind // "phase")=="post-completion-followup" and .phaseSequence==5 and ((.reworkRequestPath|type)=="string") and (.reworkRequestPath|length)>0 and .holdSuccessorDelivery==true)) and
              ((.auditControllerRef|type)=="string") and (.auditControllerRef|length)>0 and
              ((.attempt|type)=="number") and ((.attempt|floor)==.attempt) and .attempt>=1
            ' /tmp/lite-phase-boundary-request.json >/dev/null
            campaign_id="$(jq -r '.campaignId' /tmp/lite-phase-boundary-request.json)"
            review_kind="$(jq -r '.reviewKind // "phase"' /tmp/lite-phase-boundary-request.json)"
            unit_id="$(jq -r '.unitId // empty' /tmp/lite-phase-boundary-request.json)"
            phase_sequence="$(jq -r '.phaseSequence // empty' /tmp/lite-phase-boundary-request.json)"
            segment_id="$(jq -r '.segmentId // empty' /tmp/lite-phase-boundary-request.json)"
            master_outcome="$(jq -r '.masterOutcome // empty' /tmp/lite-phase-boundary-request.json)"
            master_summary_b64="$(jq -j '.summary // ""' /tmp/lite-phase-boundary-request.json | base64 -w0)"
            test_plan_path="$(jq -r '.testPlanPath // empty' /tmp/lite-phase-boundary-request.json)"
            test_result_path="$(jq -r '.testResultPath // empty' /tmp/lite-phase-boundary-request.json)"
            rework_request_path="$(jq -r '.reworkRequestPath // empty' /tmp/lite-phase-boundary-request.json)"
            hold_delivery="$(jq -r '.holdSuccessorDelivery // false' /tmp/lite-phase-boundary-request.json)"
            controller_ref="$(jq -r '.auditControllerRef' /tmp/lite-phase-boundary-request.json)"
            supplied_campaign_path=""
            supplied_directory_path=""
          fi
          [[ "$campaign_id" =~ ^[A-Za-z0-9._-]+-r[0-9]+$ ]] || { echo "::error::Invalid campaign_id"; exit 1; }
          case "$review_kind" in phase|discovery|master|master-test-result|sealed-rework|post-completion-followup) ;; *) echo "::error::Invalid review_kind"; exit 1;; esac
          if [ "$review_kind" = phase ]; then [[ "$phase_sequence" =~ ^([1-9]|10)$ ]] || { echo "::error::Invalid phase_sequence"; exit 1; }; fi
          if [ "$review_kind" = discovery ]; then [[ "$unit_id" =~ ^[FRX]-[0-9]{3}$ ]] || { echo "::error::Invalid unit_id"; exit 1; }; fi
          if [ "$review_kind" = master ]; then
            [[ "$segment_id" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid segment_id"; exit 1; }
            case "$master_outcome" in AMENDED|ACCEPT_WITHOUT_MODIFICATIONS|REQUEST_TARGETED_TESTS|CLOSE_INCOMPLETE) ;; *) echo "::error::Invalid master outcome"; exit 1;; esac
            if [ "$master_outcome" = REQUEST_TARGETED_TESTS ]; then
              [[ "$test_plan_path" == campaigns/* ]] && [[ "$test_plan_path" =~ ^[A-Za-z0-9._()/[:space:]-]+$ ]] || { echo "::error::Invalid campaign-local test plan"; exit 1; }
            fi
          fi
          if [ "$review_kind" = master-test-result ]; then
            [[ "$segment_id" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid segment_id"; exit 1; }
            [[ "$test_result_path" == campaigns/* ]] && [[ "$test_result_path" =~ ^[A-Za-z0-9._()/[:space:]-]+$ ]] || { echo "::error::Invalid campaign-local test result"; exit 1; }
          fi
          if [ "$review_kind" = sealed-rework ]; then
            [ "$phase_sequence" = 1 ] || { echo "::error::sealed-rework is restricted to Phase 1"; exit 1; }
            [[ "$rework_request_path" == campaigns/* ]] || { echo "::error::rework_request_path must be private campaign-relative state"; exit 1; }
            [ "$hold_delivery" = true ] || { echo "::error::sealed-rework requires hold_successor_delivery"; exit 1; }
            [ "$controller_ref" != main ] || { echo "::error::sealed-rework requires an Audit-Controller review branch"; exit 1; }
          fi
          if [ "$review_kind" = post-completion-followup ]; then
            [ "$phase_sequence" = 5 ] || { echo "::error::post-completion followup must bind technical Phase-5 scope"; exit 1; }
            case "$rework_request_path" in
              'campaigns/CurveYield DEX v16 Source/CurveYield DEX v16 Source r4/controller/POST_COMPLETION_FOLLOWUP_REQUEST_v1.json' | \
              'campaigns/CurveYield DEX v16 Source r4/controller/POST_COMPLETION_FOLLOWUP_REQUEST_v1.json') ;; # canonical or frozen legacy path
              *) echo "::error::Wrong typed followup request path"; exit 1;;
            esac
            [ "$hold_delivery" = true ] || { echo "::error::Followup requires no automatic successor delivery"; exit 1; }
            [ "$controller_ref" = main ] || { echo "::error::Followup requires current accepted main campaign"; exit 1; }
          fi
          case "$hold_delivery" in true|false) ;; *) echo "::error::Invalid hold_successor_delivery"; exit 1;; esac
          [[ "$controller_ref" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::Invalid audit_controller_ref"; exit 1; }
          {
            echo "campaign_id=$campaign_id"
            echo "review_kind=$review_kind"
            echo "unit_id=$unit_id"
            echo "phase_sequence=$phase_sequence"
            echo "segment_id=$segment_id"
            echo "master_outcome=$master_outcome"
            echo "master_summary_b64=$master_summary_b64"
            echo "test_plan_path=$test_plan_path"
            echo "test_result_path=$test_result_path"
            echo "rework_request_path=$rework_request_path"
            echo "hold_delivery=$hold_delivery"
            echo "audit_controller_ref=$controller_ref"
            echo "supplied_campaign_path=$supplied_campaign_path"
            echo "supplied_directory_path=$supplied_directory_path"
          } >> "$GITHUB_OUTPUT"
      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh

      - name: Checkout Audit-Controller assignment state
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ steps.request.outputs.audit_controller_ref }}"
          case "${{ steps.request.outputs.review_kind }}" in phase|discovery|master|master-test-result) sparse=true;; *) sparse=false;; esac
          if [ "$sparse" = true ]; then
            # These reviews read only the campaign folder, its directory entry and the bound
            # (or frozen) authority, so a sparse checkout suffices. Sealed rework and
            # post-completion follow-up keep the full clone.
            campaign_id="${{ steps.request.outputs.campaign_id }}"
            [[ "$campaign_id" =~ ^(.+)-r[0-9]+$ ]] || { echo "::error::campaign_id must end in -rN"; exit 1; }
            directory_api="repos/curveyield3/Audit-Controller/contents/Audit%20Campaign%20Directory/campaigns/${BASH_REMATCH[1]}.json?ref=$ref"
            campaign_path="$(gh api "$directory_api" --jq '.content' | base64 -d | jq -r '.workspacePath')"
            timeout -k 10s 300s bash scripts/checkout-audit-controller-once-v1.sh .audit-controller "$ref" branch "$campaign_path"
            exit 0
          fi
          gh auth setup-git
          rm -rf .audit-controller
          timeout -k 10s 300s gh repo clone curveyield3/Audit-Controller .audit-controller -- --filter=blob:none --no-checkout
          cd .audit-controller
          timeout -k 10s 180s git fetch origin "${{ steps.request.outputs.audit_controller_ref }}"
          git checkout -B "${{ steps.request.outputs.audit_controller_ref }}" "origin/${{ steps.request.outputs.audit_controller_ref }}"

      - name: Resolve canonical campaign routing
        id: routing
        shell: bash
        run: |
          set -euo pipefail
          campaign_id="${{ steps.request.outputs.campaign_id }}"
          if [[ "$campaign_id" =~ ^(.+)-r[0-9]+$ ]]; then slug="${BASH_REMATCH[1]}"; else echo "::error::campaign_id must end in -rN"; exit 1; fi
          directory_path="Audit Campaign Directory/campaigns/$slug.json"
          directory_file=".audit-controller/$directory_path"
          test -s "$directory_file"
          test "$(jq -r '.schemaVersion' "$directory_file")" = "curveyield-audit-campaign-directory-entry-v2"
          test "$(jq -r '.campaignId' "$directory_file")" = "$campaign_id"
          if [ "${{ steps.request.outputs.review_kind }}" = phase ]; then
            test "$(jq -r '.currentAssignment.phaseSequence' "$directory_file")" = "${{ steps.request.outputs.phase_sequence }}"
          elif [ "${{ steps.request.outputs.review_kind }}" = discovery ]; then
            # Any unit of the active window may name the request.
            if ! jq -e --arg u "${{ steps.request.outputs.unit_id }}" '(.discovery.activeUnitIds // [.discovery.activeUnitId]) | index($u) != null' "$directory_file" >/dev/null; then
              echo "::notice::stale discovery request"
              stale=true
            fi
          elif [ "${{ steps.request.outputs.review_kind }}" = master ] || [ "${{ steps.request.outputs.review_kind }}" = master-test-result ]; then
            test "$(jq -r '.pendingMasterReview.segmentId' "$directory_file")" = "${{ steps.request.outputs.segment_id }}"
          else
            test "${{ steps.request.outputs.hold_delivery }}" = true
          fi
          campaign_path="$(jq -r '.workspacePath' "$directory_file")"
          [[ "$campaign_path" == campaigns/* ]] || { echo "::error::Canonical workspacePath must be under campaigns/"; exit 1; }
          supplied_campaign="${{ steps.request.outputs.supplied_campaign_path }}"
          supplied_directory="${{ steps.request.outputs.supplied_directory_path }}"
          [ -z "$supplied_campaign" ] || test "$supplied_campaign" = "$campaign_path"
          [ -z "$supplied_directory" ] || test "$supplied_directory" = "$directory_path"
          effective_hold="${{ steps.request.outputs.hold_delivery }}"
          campaign_status="$(jq -r '.campaignStatus // empty' "$directory_file")"
          if [ "$campaign_status" = STOPPED_BY_HUMAN ] || [ "$campaign_status" = BLOCKED ]; then
            effective_hold=true
          fi
          persistent_hold_file=".audit-controller/$campaign_path/controller/SUCCESSOR_DELIVERY_HOLD_v1.json"
          if [ -s "$persistent_hold_file" ] && [ "$(jq -r '.status // empty' "$persistent_hold_file")" = ACTIVE ]; then
            test "$(jq -r '.campaignId' "$persistent_hold_file")" = "${{ steps.request.outputs.campaign_id }}"
            effective_hold=true
          fi
          {
            echo "stale=${stale:-false}"
            echo "campaign_path=$campaign_path"
            echo "campaign_directory_path=$directory_path"
            echo "effective_hold=$effective_hold"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for controller validation and Phase-5 execution
        if: steps.routing.outputs.stale != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install locked Node dependencies for controller validation
        if: steps.routing.outputs.stale != 'true'
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 10s 360s npm ci --force --ignore-scripts --no-audit --no-fund

      - name: Preflight Phase-5 bound execution requests without toolchain
        id: phase5_preflight
        if: steps.routing.outputs.stale != 'true' && steps.request.outputs.review_kind == 'phase' && steps.request.outputs.phase_sequence == '5'
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(jq -r '.sourceSha256' ".audit-controller/${{ steps.routing.outputs.campaign_directory_path }}")"
          if ! node scripts/lite-phase5-preflight-v1.mjs .audit-controller "${{ steps.routing.outputs.campaign_path }}" "${{ steps.request.outputs.campaign_id }}" "$source_sha" > /tmp/lite-phase5-preflight.json; then
            # A valid design rework goes back to the reviewer without spending on
            # toolchain/Anvil/RPC; malformed preflight crashes still fail closed.
            jq -e '.status=="REWORK_REQUIRED" and (.failures|type=="array") and (.failures|length)>0' /tmp/lite-phase5-preflight.json >/dev/null
            jq -r '.failures[] | "::warning::" + .path + ": " + .reason + " (shard: " + (.shardPath // "unsharded") + ")"' /tmp/lite-phase5-preflight.json
          fi
          report_path=".audit-controller/${{ steps.routing.outputs.campaign_path }}/controller/preflight/PHASE5_REQUEST_PREFLIGHT_v1.json"
          mkdir -p "$(dirname "$report_path")"
          cp /tmp/lite-phase5-preflight.json "$report_path"
          echo "runnable=$(jq -r '.runnable' /tmp/lite-phase5-preflight.json)" >> "$GITHUB_OUTPUT"
          echo "generated_count=$(jq '.generated|length' /tmp/lite-phase5-preflight.json)" >> "$GITHUB_OUTPUT"
          echo "harness_rework=$(jq -r '[.failures[]? | select(.path|contains("executionBlueprint"))]|length>0' /tmp/lite-phase5-preflight.json)" >> "$GITHUB_OUTPUT"
          echo "rework=$(jq -r '.status=="REWORK_REQUIRED"' /tmp/lite-phase5-preflight.json)" >> "$GITHUB_OUTPUT"
          jq '{status,designCount,readyCount,failureCount:(.failures|length),generatedCount:(.generated|length)}' /tmp/lite-phase5-preflight.json

      - name: Determine whether master amendment needs Phase-5 execution
        id: phase5_plan
        if: steps.routing.outputs.stale != 'true' && steps.request.outputs.review_kind == 'master' && (steps.request.outputs.segment_id == 'reviewer-2-phases-02-05' || (steps.request.outputs.segment_id == 'reviewer-3-phases-05-07' || steps.request.outputs.segment_id == 'reviewer-3-phases-05-06')) && steps.request.outputs.master_outcome == 'AMENDED'
        shell: bash
        run: |
          set -euo pipefail
          sha="$(jq -r '.sourceSha256' ".audit-controller/${{ steps.routing.outputs.campaign_directory_path }}")"
          decision="$(node scripts/lite-master-phase5-execution-plan-v1.mjs             .audit-controller "${{ steps.routing.outputs.campaign_path }}"             "${{ steps.request.outputs.campaign_id }}" "$sha")"
          echo "requires_execution=$(printf '%s' "$decision" | jq -r '.requiresExecution')" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$decision" | jq .

      - name: Install retained audit toolchain for Phase-5 boundary execution
        if: steps.routing.outputs.stale != 'true' && ((steps.request.outputs.review_kind == 'phase' && steps.request.outputs.phase_sequence == '5' && steps.phase5_preflight.outputs.runnable == 'true') || (steps.phase5_plan.outputs.requires_execution == 'true'))
        uses: ./.github/actions/setup-v7-toolchain

      - name: Generate packet/report, validate semantic work, then bookkeep after PASS
        if: steps.routing.outputs.stale != 'true'
        id: controller
        env:
          ETHEREUM_FORK_RPC_URL: ${{ secrets.RPC_ETHEREUM }}
          RPC_KATANA: ${{ secrets.RPC_KATANA }}
          RPC_BASE: ${{ secrets.RPC_BASE }}
        shell: bash
        run: |
          set -euo pipefail
          if { [ "${{ steps.request.outputs.review_kind }}" = phase ] && [ "${{ steps.request.outputs.phase_sequence }}" = 5 ] && [ "${{ steps.phase5_preflight.outputs.runnable }}" = true ]; } ||
             { [ "${{ steps.phase5_plan.outputs.requires_execution }}" = true ]; }; then
            # Phase-5 accepts Ethereum, Base, and Katana. Do not require Ethereum
            # for a Katana-only source; the downstream per-request preflight
            # verifies exact chain identity and reports missing chain RPCs.
            if [ -z "${ETHEREUM_FORK_RPC_URL:-}" ] && [ -z "${RPC_KATANA:-}" ] && [ -z "${RPC_BASE:-}" ]; then
              echo "::error::No configured fork RPC for Phase-5 execution"
              exit 1
            fi
          fi
          args=(--controller-root .audit-controller --campaign-id "${{ steps.request.outputs.campaign_id }}" --campaign-path "${{ steps.routing.outputs.campaign_path }}" --campaign-directory-path "${{ steps.routing.outputs.campaign_directory_path }}" --review-kind "${{ steps.request.outputs.review_kind }}" --audit-controller-ref "${{ steps.request.outputs.audit_controller_ref }}")
          if [ "${{ steps.request.outputs.review_kind }}" = master-test-result ]; then
            args+=(--segment-id "${{ steps.request.outputs.segment_id }}" --test-result-path "${{ steps.request.outputs.test_result_path }}")
          fi
          if [ "${{ steps.request.outputs.review_kind }}" = master ]; then
            args+=(--segment-id "${{ steps.request.outputs.segment_id }}" --master-outcome "${{ steps.request.outputs.master_outcome }}")
            if [ "${{ steps.request.outputs.master_outcome }}" = REQUEST_TARGETED_TESTS ]; then
              args+=(--test-plan-path "${{ steps.request.outputs.test_plan_path }}")
            fi
            if [ -n "${{ steps.request.outputs.master_summary_b64 }}" ]; then
              args+=(--master-summary-b64 "${{ steps.request.outputs.master_summary_b64 }}")
            fi
          elif [ "${{ steps.request.outputs.review_kind }}" = discovery ]; then
            args+=(--unit-id "${{ steps.request.outputs.unit_id }}")
          else
            args+=(--phase-sequence "${{ steps.request.outputs.phase_sequence }}")
          fi
          if [ "${{ steps.request.outputs.review_kind }}" = sealed-rework ] || [ "${{ steps.request.outputs.review_kind }}" = post-completion-followup ]; then
            args+=(--rework-request-path "${{ steps.request.outputs.rework_request_path }}")
          fi
          timeout -k 30s 5100s node scripts/lite-phase-packet-controller-v1.mjs "${args[@]}" | tee /tmp/lite-phase-packet-envelope.json
          # Reject empty, malformed, multi-line, oversized and unknown-status stdout.
          test "$(wc -c < /tmp/lite-phase-packet-envelope.json)" -le 8192
          jq -es '
            length==1 and
            .[0].schemaVersion=="curveyield-lite-controller-envelope-v1" and
            (.[0].status | IN("PASS","WAITING_FOR_MASTER_REVIEW","NEEDS_REWORK",
              "MASTER_TESTS_REQUESTED","FOLLOWUP_ADMITTED","DISCOVERY_REWORK",
              "DISCOVERY_NEXT","DISCOVERY_PARTIAL","DISCOVERY_COMPLETE",
              "DISCOVERY_STALE_REQUEST","MASTER_REVIEW_INVALID","MASTER_REVIEW_HELD",
              "ALREADY_ACCEPTED","CONTROLLER_ERROR","CLOSED_INCOMPLETE")) and
            (.[0].detailRef|type=="string") and
            (.[0].sha256|test("^[a-f0-9]{64}$"))
          ' /tmp/lite-phase-packet-envelope.json >/dev/null
          node --input-type=module -e '
            import fs from "node:fs";
            import {restoreControllerResultV1} from "./scripts/lib/lite-boundary-result-v1.mjs";
            const [root,campaignPath]=process.argv.slice(1);
            const envelope=JSON.parse(fs.readFileSync("/tmp/lite-phase-packet-envelope.json","utf8"));
            const full=restoreControllerResultV1({root,campaignPath,envelope});
            fs.writeFileSync("/tmp/lite-phase-packet-result.json",JSON.stringify(full)+"\n");
          ' .audit-controller "${{ steps.routing.outputs.campaign_path }}"
          # Always retain a bounded list of failing shard files and keys in
          # the wake even when the full diagnostic pages exceed the output cap.
          packet_ref="$(jq -r '.packetPath // empty' /tmp/lite-phase-packet-result.json)"
          shard_brief=""
          if [[ -n "$packet_ref" && -f ".audit-controller/$packet_ref" ]]; then
            shard_brief="$(jq -r '
              [.controllerValidation.shardRework.shards[:12][]? |
                .path + " [" + ((.recordKeys[:3] // [])|join(",")) + "]"] | join("; ")
            ' ".audit-controller/$packet_ref" | cut -c1-1600)"
          fi
          jq -r --arg ref "$(jq -r '.detailRef' /tmp/lite-phase-packet-envelope.json)" \
            --arg shard_brief "$shard_brief" '
            if ((.feedbackB64 // "")|length)>4096 then
              .feedbackB64=(("Controller details exceed wake size. Failing shards/keys: " +
                (if $shard_brief=="" then "see result pages" else $shard_brief end) +
                ". Complete diagnostics: " + $ref)|@base64)
            else . end
          ' /tmp/lite-phase-packet-result.json > /tmp/lite-phase-packet-delivery.json
          {

            echo "status=$(jq -r '.status' /tmp/lite-phase-packet-result.json)"
            echo "feedback_b64=$(jq -r '.feedbackB64 // empty' /tmp/lite-phase-packet-delivery.json)"
            echo "fresh=$(jq -r '.freshSuccessorRequired // false' /tmp/lite-phase-packet-result.json)"
            echo "same=$(jq -r '.sameReviewerAdvanced // false' /tmp/lite-phase-packet-result.json)"
            echo "next_phase=$(jq -r '.nextAssignment.phaseSequence // empty' /tmp/lite-phase-packet-result.json)"
            echo "next_reviewer=$(jq -r '.nextAssignment.reviewer // empty' /tmp/lite-phase-packet-result.json)"
            echo "campaign_name=$(jq -r '.campaignName // empty' /tmp/lite-phase-packet-result.json)"
            echo "segment_id=$(jq -r '.segmentId // empty' /tmp/lite-phase-packet-result.json)"
            echo "master_chat_url=$(jq -r '.masterChatUrl // empty' /tmp/lite-phase-packet-result.json)"
            echo "master_review=$(jq -r '.masterReviewRequired // false' /tmp/lite-phase-packet-result.json)"
            echo "master_accepted=$(jq -r '.masterReviewAccepted // false' /tmp/lite-phase-packet-result.json)"
            echo "test_reviewer=$(jq -r '.testReviewer // empty' /tmp/lite-phase-packet-result.json)"
            echo "test_request_id=$(jq -r '.testRequestId // empty' /tmp/lite-phase-packet-result.json)"
            echo "authority_link_root=$(jq -r '.authorityLinkRoot // empty' /tmp/lite-phase-packet-result.json)"
            echo "discovery_wake_chat_key=$(jq -r '.discoveryWakeChatKey // empty' /tmp/lite-phase-packet-result.json)"
            echo "discovery_wake_id=$(jq -r '.discoveryWakeId // empty' /tmp/lite-phase-packet-result.json)"
            echo "discovery_wake_phase_id=$(jq -r '.discoveryWakePhaseId // empty' /tmp/lite-phase-packet-result.json)"
            echo "discovery_wake_milestone_id=$(jq -r '.discoveryWakeMilestoneId // empty' /tmp/lite-phase-packet-result.json)"
            echo "discovery_wake_message_b64=$(jq -r '.discoveryWakeMessageB64 // empty' /tmp/lite-phase-packet-result.json)"
            echo "discovery_wakes_b64=$(jq -r '.discoveryWakesB64 // empty' /tmp/lite-phase-packet-result.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Record v13 controller delivery result and latest per-assignment identity
        id: delivery_state
        if: steps.routing.outputs.stale != 'true' && steps.controller.outcome == 'success' && contains(steps.controller.outputs.authority_link_root, 'Audit_Litemode_v13') && ((steps.controller.outputs.status == 'PASS' && steps.controller.outputs.fresh == 'true') || steps.controller.outputs.status == 'WAITING_FOR_MASTER_REVIEW')
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            import {publishedDeliveryStateV1} from "./scripts/lib/lite-controller-delivery-state-v1.mjs";
            const [campaign,kind,phase,runId]=process.argv.slice(1);
            const envelope=JSON.parse(fs.readFileSync("/tmp/lite-phase-packet-envelope.json","utf8"));
            const record=publishedDeliveryStateV1({
              root:".audit-controller",campaignPath:campaign,envelope,
              reviewKind:kind,phaseSequence:phase?Number(phase):null,
              requestId:runId,now:new Date().toISOString()
            });
            fs.appendFileSync(process.env.GITHUB_OUTPUT,"wake_id="+record.wakeId+"\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT,"result_sha256="+record.resultSha256+"\n");
          ' "${{ steps.routing.outputs.campaign_path }}" "${{ steps.request.outputs.review_kind }}" "${{ steps.request.outputs.phase_sequence }}" "${{ github.run_id }}"

      - name: Publish validation response or successful phase transaction
        id: publish_result
        if: ${{ steps.routing.outputs.stale != 'true' && steps.routing.outcome == 'success' && steps.controller.outcome == 'success' && (steps.controller.outputs.status == 'PASS' || steps.controller.outputs.status == 'WAITING_FOR_MASTER_REVIEW' || steps.controller.outputs.status == 'NEEDS_REWORK' || steps.controller.outputs.status == 'MASTER_TESTS_REQUESTED' || steps.controller.outputs.status == 'FOLLOWUP_ADMITTED' || steps.controller.outputs.status == 'DISCOVERY_REWORK' || steps.controller.outputs.status == 'DISCOVERY_NEXT' || steps.controller.outputs.status == 'DISCOVERY_PARTIAL' || steps.controller.outputs.status == 'DISCOVERY_COMPLETE' || steps.controller.outputs.status == 'DISCOVERY_STALE_REQUEST' || steps.controller.outputs.status == 'MASTER_REVIEW_INVALID' || steps.controller.outputs.status == 'MASTER_REVIEW_HELD' || steps.controller.outputs.status == 'ALREADY_ACCEPTED' || steps.controller.outputs.status == 'CONTROLLER_ERROR' || steps.controller.outputs.status == 'CLOSED_INCOMPLETE') }}
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd .audit-controller
          git config user.name 'CurveYield Lite Phase Controller'
          git config user.email 'lite-phase-controller@users.noreply.github.com'
          git add -- "${{ steps.routing.outputs.campaign_path }}" "${{ steps.routing.outputs.campaign_directory_path }}"
          if ! git diff --cached --quiet; then
            git commit -m "audit(controller): ${{ steps.request.outputs.review_kind }} ${{ steps.request.outputs.phase_sequence || steps.request.outputs.segment_id }} validation ${{ steps.controller.outputs.status }} for ${{ steps.request.outputs.campaign_id }}"
            for attempt in 1 2 3; do
              if timeout -k 10s 120s git push origin "HEAD:${{ steps.request.outputs.audit_controller_ref }}"; then break; fi
              [ "$attempt" -lt 3 ] || { echo "::error::Publish failed after 3 attempts"; exit 1; }
              timeout -k 10s 120s git pull --rebase origin "${{ steps.request.outputs.audit_controller_ref }}"
            done
          fi
          echo 'published=true' >> "$GITHUB_OUTPUT"

      # Previously a published NEEDS_REWORK had no durable continuation event:
      # the workflow ended green, while the reviewer was expected to poll Actions.
      # Reuse the existing acknowledged browser wake; never repeat machine tests here.
      - name: Resolve optional Work relay transport (original browser implementation unchanged)
        id: delivery_transport
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          directory=".audit-controller/${{ steps.routing.outputs.campaign_directory_path }}"
          [ -s "$directory" ] || { echo "::error::Canonical campaign directory unavailable"; exit 1; }
          mode="$(jq -r '.deliveryTransport // "GITHUB_BROWSER"' "$directory")"
          case "$mode" in
            AGENT_DELIVERY) wake=lite-work-relay-v1.yml; successor=lite-work-relay-v1.yml ;;
            GITHUB_BROWSER) wake=browser-agent-wake.yml; successor=lite-audit-browser-orchestrator-v1.yml ;;
            *) echo "::error::Unknown delivery transport $mode"; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "wake_workflow=$wake" >> "$GITHUB_OUTPUT"
          echo "successor_workflow=$successor" >> "$GITHUB_OUTPUT"
      - name: Resume same reviewer after published phase rework
        if: steps.routing.outputs.effective_hold != 'true' && steps.routing.outputs.stale != 'true' && steps.request.outputs.review_kind == 'phase' && steps.controller.outputs.status == 'NEEDS_REWORK' && steps.publish_result.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_CAMPAIGN: ${{ steps.request.outputs.campaign_id }}
          AUDIT_DIRECTORY: ${{ steps.routing.outputs.campaign_directory_path }}
          AUDIT_REF: ${{ steps.request.outputs.audit_controller_ref }}
        shell: bash
        run: |
          set -euo pipefail
          directory=".audit-controller/$AUDIT_DIRECTORY"
          test -s "$directory"
          test "$(jq -r '.campaignId' "$directory")" = "$AUDIT_CAMPAIGN"
          test "$(jq -r '.campaignStatus' "$directory")" = ACTIVE
          test "$(jq -r '.currentAssignment.status' "$directory")" = REWORK_REQUIRED
          reviewer="$(jq -r '.currentAssignment.reviewer' "$directory")"
          phase="$(jq -r '.currentAssignment.phaseSequence' "$directory")"
          case "$reviewer" in reviewer-1|reviewer-2|reviewer-3|reviewer-4) ;; *) echo "::error::Invalid active rework reviewer"; exit 1;; esac
          [[ "$phase" =~ ^([1-9]|10)$ ]] || { echo "::error::Invalid rework phase"; exit 1; }
          test "$phase" = "${{ steps.request.outputs.phase_sequence }}"
          packet="$(jq -r '.currentAssignment.packetPath // empty' "$directory")"
          test -n "$packet" && test -s ".audit-controller/$packet"
          jq -e --arg id "$AUDIT_CAMPAIGN" --argjson p "$phase" \
            '.campaignId==$id and .phaseSequence==$p and .controllerValidation.status=="FAIL"' \
            ".audit-controller/$packet" >/dev/null

          safe_campaign="$(printf '%s' "$AUDIT_CAMPAIGN" | tr -c 'A-Za-z0-9._-' '_')"
          registration="process/browser-agent-wake/registrations/$safe_campaign.json"
          encoded="$(gh api "repos/$GITHUB_REPOSITORY/contents/$registration?ref=main" --jq '.content')"
          printf '%s' "$encoded" | base64 -d > /tmp/rework-registration.json
          test "$(jq -r '.campaignId' /tmp/rework-registration.json)" = "$AUDIT_CAMPAIGN"
          chat="$(jq -r --arg r "$reviewer" '.agentChats[$r] // empty' /tmp/rework-registration.json)"
          [[ "$chat" =~ ^https://chatgpt[.]com/c/[A-Za-z0-9_-]+/?$ || "$chat" =~ ^https://chatgpt[.]com/g/g-p-[A-Za-z0-9_-]+/c/[A-Za-z0-9_-]+/?$ ]] || {
            echo "::error::Current rework reviewer has no registered chat"
            exit 1
          }

          # The controller result is an actual workflow outcome, not a reviewer
          # response. A new first-action ACK is required by browser-agent-wake.
          brief="$(jq -r '.controllerValidation.deficiencies[:4][]? // empty' ".audit-controller/$packet" | cut -c1-1400)"
          message="CONTROLLER NEEDS_REWORK — $AUDIT_CAMPAIGN, $reviewer, phase $phase.
          The controller has published a REWORK_REQUIRED assignment. Do not stop, wait for a reminder, or treat the green Actions job as phase PASS.
          Read the exact latest controller work packet at $packet and the corresponding result pages on curveyield3/Audit-Controller main.
          Preserve accepted reviewer shards, source identity, sealed predecessor receipts, and unresolved risk. Diagnose the exact rejected fields or runner evidence. Before repeating an infrastructure diagnosis compare the failing Actions run timestamp and head commit to current curveyield3/Contract-Automation main.
          Fix every currently executable non-test issue using the EXISTING mechanisms. Tests and machine-executing Phase-5 boundary reruns remain prohibited without explicit audit-owner authorization; do not invent evidence or issue redundant submissions.
          Confirm your wake ACK, then continue working on the current assignment and report only genuinely blocked work.
          First reported deficiencies:
          $brief"
          message+="
          INFRASTRUCTURE: Read curveyield3/Contract-Automation/docs/BROWSER_AGENT_BLOCKCHAIN_WORKSTATION_v1.md, Anvil/RPC rule. Historical Ethereum upstream is RPC_ETHEREUM projected by trusted Actions as ETHEREUM_FORK_RPC_URL; only a pinned/hash-verified LOCAL Anvil fork may receive mutable test calls. No synthetic fixture or alternate RPC. Diagnose stale runner commit/secret/pin first. Do not execute or automatically resubmit tests without owner authorization."
          b64="$(printf '%s' "$message" | base64 -w0)"
          timeout -k 10s 90s gh workflow run "${{ steps.delivery_transport.outputs.wake_workflow }}" --repo "$GITHUB_REPOSITORY" --ref main \
            -f wake_id="$AUDIT_CAMPAIGN-phase-$phase-$reviewer-rework-${{ github.run_id }}" \
            -f campaign_id="$AUDIT_CAMPAIGN" -f phase_id="phase-$phase" \
            -f mode=resume_existing -f chat_url="$chat" -f wake_message_b64="$b64" \
            -f watchdog_enabled=true -f worker_role=reviewer -f gate_mode=LITE \
            -f gate_repository=curveyield3/Audit-Controller -f gate_ref="$AUDIT_REF" \
            -f gate_state_path="$AUDIT_DIRECTORY" -f gate_expected_phase_id="phase-$phase" \
            -f gate_expected_milestone_id="PHASE_${phase}_WORK_PACKET" \
            -f gate_stop_states_csv=STOPPED_BY_HUMAN \
            -f gate_stop_campaign_statuses_csv=COMPLETE,STOPPED_BY_HUMAN
          echo "Dispatched exact rework reviewer wake; ACK and real progress required for recovery." >> "$GITHUB_STEP_SUMMARY"

      - name: Delegate v13 Phase-5 generated harness requests to test executor
        if: steps.routing.outputs.effective_hold != 'true' && steps.routing.outputs.stale != 'true' && contains(steps.controller.outputs.authority_link_root, 'Audit_Litemode_v13') && steps.request.outputs.review_kind == 'phase' && steps.request.outputs.phase_sequence == '5' && (steps.phase5_preflight.outputs.harness_rework == 'true' || (steps.phase5_preflight.outputs.generated_count != '0' && steps.phase5_preflight.outputs.generated_count != ''))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          safe_campaign="$(printf '%s' "${{ steps.request.outputs.campaign_id }}" | tr -c 'A-Za-z0-9._-' '_')"
          registration="process/browser-agent-wake/registrations/$safe_campaign.json"
          encoded="$(gh api "repos/$GITHUB_REPOSITORY/contents/$registration?ref=main" --jq '.content')"
          printf '%s' "$encoded" | base64 -d > /tmp/phase5-test-executor-registration.json
          chat="$(jq -r '.agentChats["test-executor"] // empty' /tmp/phase5-test-executor-registration.json)"
          [[ "$chat" =~ ^https://chatgpt[.]com/c/[A-Za-z0-9_-]+/?$ || "$chat" =~ ^https://chatgpt[.]com/g/g-p-[A-Za-z0-9_-]+/c/[A-Za-z0-9_-]+/?$ ]] || {
            echo "::error::V13 requires a distinct registered test-executor chat"
            exit 1
          }
          refs="$(jq -r '[.generated[:12][]?.executionRequestRef] | join(", ")' /tmp/lite-phase5-preflight.json)"
          count="$(jq '.generated|length' /tmp/lite-phase5-preflight.json)"
          message="PHASE5_TEST_EXECUTOR_HANDOFF: v13 campaign ${{ steps.request.outputs.campaign_id }}. $count candidate-bound requests are published. Read ${{ steps.routing.outputs.campaign_path }}/controller/preflight/PHASE5_REQUEST_PREFLIGHT_v1.json and the listed request and *.design-v1.json sidecars from Audit-Controller. First request paths (possibly none until the required harness is authored): $refs. Preflight may list exact missing executionBlueprint fields; implement those runner-owned harnesses, then pass valid bundle IDs back to the reviewer for shard entry. You are the TEST EXECUTOR: author/verify exact runnable harnesses, preserve every required ABI method/actor/transaction sequence and oracle, do not impose arbitrary native-fuzz quotas; only execute candidate-bound fuzz when explicitly selected and authorized, retain raw execution evidence. Do NOT alter reviewer shards or fabricate successful executions. Unready targets remain preflight REWORK."
          message+="
          EXECUTION RULES: curveyield3/Audit-Controller is canonical; use curveyield3/Contract-Automation existing qualified Actions lane, RPC_ETHEREUM -> ETHEREUM_FORK_RPC_URL, frozen chain/block/hash proof and local Anvil 127.0.0.1, no Ganache/standalone/public fallback or unpinned snapshot. Read docs/BROWSER_AGENT_BLOCKCHAIN_WORKSTATION_v1.md, Anvil/RPC rule. Obtain explicit audit-owner authorization for this specific test before any execution; preserve all raw receipts and unresolved governance uncertainty."
          b64="$(printf '%s' "$message" | base64 -w0)"
          timeout -k 10s 90s gh workflow run "${{ steps.delivery_transport.outputs.wake_workflow }}" --repo "$GITHUB_REPOSITORY" --ref main \
            -f wake_id="${{ steps.request.outputs.campaign_id }}-phase5-test-executor-${{ github.run_id }}" \
            -f campaign_id="${{ steps.request.outputs.campaign_id }}" -f phase_id=phase-5 \
            -f mode=resume_existing -f chat_url="$chat" -f wake_message_b64="$b64" \
            -f watchdog_enabled=true -f worker_role=test-executor -f gate_mode=LITE \
            -f gate_repository=curveyield3/Audit-Controller -f gate_ref="${{ steps.request.outputs.audit_controller_ref }}" \
            -f gate_state_path="${{ steps.routing.outputs.campaign_directory_path }}" \
            -f gate_expected_phase_id=phase-5 -f gate_expected_milestone_id=PHASE_5_WORK_PACKET

      - name: Record v13 per-unit Git-commit depth audit for master review
        if: steps.routing.outputs.stale != 'true' && contains(steps.controller.outputs.authority_link_root, 'Audit_Litemode_v13') && steps.controller.outputs.status == 'DISCOVERY_COMPLETE'
        # Observation must never roll back or block an already published boundary.
        # A missing spotcheck instead prevents later independent qualification.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          campaign="${{ steps.routing.outputs.campaign_path }}"
          cd .audit-controller
          # Resolve individual historical commits; the primary controller uses a
          # shallow checkout. Fetch commit/tree history only, never an extra build.
          git fetch --no-tags --deepen=800 --filter=blob:none origin "${{ steps.request.outputs.audit_controller_ref }}"
          node ../scripts/adr-v13-unit-depth-review-v1.mjs "$PWD" "$campaign"
          git config user.name 'CurveYield V13 Depth Review Controller'
          git config user.email 'v13-depth-controller@users.noreply.github.com'
          git add -- "$campaign/work/master-review/DEPTH_SPOTCHECK_RESULTS_v1.json"
          if ! git diff --cached --quiet; then
            git commit -m "audit(depth): bind every unit to exact per-unit Git commits"
            git push origin "HEAD:${{ steps.request.outputs.audit_controller_ref }}"
          fi

      - name: Wake discovery chat
        if: steps.routing.outputs.effective_hold != 'true' && steps.routing.outputs.stale != 'true' && steps.controller.outputs.discovery_wake_chat_key != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WAKES_B64: ${{ steps.controller.outputs.discovery_wakes_b64 }}
        shell: bash
        run: |
          set -euo pipefail
          safe_campaign="$(printf '%s' "${{ steps.request.outputs.campaign_id }}" | tr -c 'A-Za-z0-9._-' '_')"
          registration="process/browser-agent-wake/registrations/$safe_campaign.json"
          encoded="$(gh api "repos/$GITHUB_REPOSITORY/contents/$registration?ref=main" --jq '.content')"
          printf '%s' "$encoded" | base64 -d > /tmp/discovery-registration.json
          # Reassigned v13: one reviewer-2 chat, flow then attack; frozen campaigns retain their own registered reviewer windows.
          printf '%s' "$WAKES_B64" | base64 -d > /tmp/discovery-wakes.json
          count="$(jq 'length' /tmp/discovery-wakes.json)"
          if [ "$count" -eq 0 ]; then exit 0; fi
          submitted_chat=""
          if [ "${{ steps.request.outputs.review_kind }}" = discovery ]; then
            state=".audit-controller/${{ steps.routing.outputs.campaign_path }}/work/phase-04/discovery/DISCOVERY_STATE_v1.json"
            [ -s "$state" ] || { echo "::error::Discovery state unavailable for self-wake filtering"; exit 1; }
            submitted_chat="$(jq -r --arg unit "${{ steps.request.outputs.unit_id }}" '.payload.units[$unit].chatKey // empty' "$state")"
            [ -n "$submitted_chat" ] || { echo "::error::Submitting discovery reviewer identity missing"; exit 1; }
          fi
          for index in $(seq 0 $((count - 1))); do
            jq -c ".[$index]" /tmp/discovery-wakes.json > /tmp/discovery-wake.json
            reviewer="$(jq -r '.chatKey' /tmp/discovery-wake.json)"
            if [ -n "$submitted_chat" ] && [ "$reviewer" = "$submitted_chat" ]; then
              echo "Same discovery reviewer $reviewer reads own run and continues without wake."
              continue
            fi
            case "$reviewer" in reviewer-2|reviewer-3|reviewer-3L) ;; *) echo "::error::Wrong discovery reviewer"; exit 1;; esac
            chat="$(jq -r --arg reviewer "$reviewer" '.agentChats[$reviewer] // empty' /tmp/discovery-registration.json)"
            [[ "$chat" =~ ^https://chatgpt\.com/c/[A-Za-z0-9_-]+/?$ || "$chat" =~ ^https://chatgpt\.com/g/g-p-[A-Za-z0-9_-]+/c/[A-Za-z0-9_-]+/?$ ]] || { echo "::error::No assigned discovery chat"; exit 1; }
            # Progress-aware watchdog: any campaign commit resets its clock, so it only pokes a stalled chat.
            timeout -k 10s 90s gh workflow run "${{ steps.delivery_transport.outputs.wake_workflow }}" --repo "$GITHUB_REPOSITORY" --ref main \
              -f wake_id="$(jq -r '.wakeId' /tmp/discovery-wake.json)" \
              -f campaign_id="${{ steps.request.outputs.campaign_id }}" \
              -f phase_id="$(jq -r '.phaseId' /tmp/discovery-wake.json)" \
              -f mode=resume_existing \
              -f chat_url="$chat" \
              -f wake_message_b64="$(jq -r '.messageB64' /tmp/discovery-wake.json)" \
              -f watchdog_enabled=true \
              -f worker_role=reviewer \
              -f gate_mode=LITE \
              -f gate_repository=curveyield3/Audit-Controller \
              -f gate_ref="${{ steps.request.outputs.audit_controller_ref }}" \
              -f gate_state_path="${{ steps.routing.outputs.campaign_directory_path }}" \
              -f gate_expected_phase_id="$(jq -r '.phaseId' /tmp/discovery-wake.json)" \
              -f gate_expected_milestone_id="$(jq -r '.milestoneId' /tmp/discovery-wake.json)" \
              -f gate_stop_campaign_statuses_csv=COMPLETE,STOPPED_BY_HUMAN
          done

      - name: Dispatch fresh successor after controller PASS
        if: steps.routing.outputs.effective_hold != 'true' && steps.controller.outputs.status == 'PASS' && steps.controller.outputs.fresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ steps.delivery_transport.outputs.mode }}" = AGENT_DELIVERY ]; then
            timeout -k 10s 90s gh workflow run lite-work-relay-v1.yml --repo "$GITHUB_REPOSITORY" --ref main -f operation=successor -f campaign_id="${{ steps.request.outputs.campaign_id }}" -f campaign_name="${{ steps.controller.outputs.campaign_name }}" -f campaign_path="${{ steps.routing.outputs.campaign_path }}" -f audit_controller_ref="${{ steps.request.outputs.audit_controller_ref }}"
          else
            timeout -k 10s 90s gh workflow run lite-audit-browser-orchestrator-v1.yml --repo "$GITHUB_REPOSITORY" --ref main             -f campaign_id="${{ steps.request.outputs.campaign_id }}"             -f campaign_name="${{ steps.controller.outputs.campaign_name }}"             -f campaign_path="${{ steps.routing.outputs.campaign_path }}"             -f audit_controller_ref="${{ steps.request.outputs.audit_controller_ref }}"
          fi

      - name: Resolve reviewer for master-directed tests
        id: testchat
        if: steps.routing.outputs.effective_hold != 'true' && steps.controller.outputs.status == 'MASTER_TESTS_REQUESTED'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          safe_campaign="$(printf '%s' "${{ steps.request.outputs.campaign_id }}" | tr -c 'A-Za-z0-9._-' '_')"
          registration="process/browser-agent-wake/registrations/$safe_campaign.json"
          encoded="$(gh api "repos/$GITHUB_REPOSITORY/contents/$registration?ref=main" --jq '.content')"
          printf '%s' "$encoded" | base64 -d > /tmp/master-test-registration.json
          reviewer="${{ steps.controller.outputs.test_reviewer }}"
          chat="$(jq -r --arg reviewer "$reviewer" '.agentChats[$reviewer] // empty' /tmp/master-test-registration.json)"
          [[ "$chat" =~ ^https://chatgpt\.com/c/[A-Za-z0-9_-]+/?$ || "$chat" =~ ^https://chatgpt\.com/g/g-p-[A-Za-z0-9_-]+/c/[A-Za-z0-9_-]+/?$ ]] || { echo "::error::No preassigned test reviewer chat"; exit 1; }
          echo "url=$chat" >> "$GITHUB_OUTPUT"

      - name: Wake test reviewer on master's directive
        if: steps.routing.outputs.effective_hold != 'true' && steps.controller.outputs.status == 'MASTER_TESTS_REQUESTED' && steps.testchat.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          guide="${{ steps.controller.outputs.authority_link_root }}/master-review/TARGETED_TEST_DIRECTIVE_v1.md"
          message_b64="$({ printf 'TARGETED TEST EXECUTOR: your only task is to run the tests in the plan named below and submit their results; you are not auditing. Read the exact plan and needed source files, the "Instructions for the executing reviewer" section of %s in curveyield3/Audit-Controller, and ONLY these execution guides in curveyield3/Contract-Automation: docs/BROWSER_AGENT_BLOCKCHAIN_WORKSTATION_v1.md, packages/github-native-sim/harness-skeletons-v2/README_v2.md, docs/CHATGPT_GITHUB_ACTIONS_VIA_GITHUB_APP.md. Do not open unrelated audit phases. Use existing trusted GitHub Actions execution infrastructure; the configured secret RPC_ETHEREUM is the archive-capable dRPC upstream mapped by the runner to ETHEREUM_FORK_RPC_URL. The runner must start a local ephemeral Anvil fork at the exact historical chain-1 block and independently verify its block hash, chain identity and target code. Send state-changing ABI calls only to local Anvil, never upstream mainnet. Foundry and Medusa require the LOCAL verified Anvil URL, not an absent local command or a second private RPC. A connector without direct workflow_dispatch access or a public eth_getLogs range error does NOT mean archive RPC is unavailable. Check actual workflow env mapping and run logs, repair the existing runner first, use the existing event/trigger, and never invent a campaign-specific RPC provider or parallel workflow. Preserve raw evidence, submit the separate controller result boundary, and verify the controller accepts it. A run executing zero assertions is a failure to repair, not progress.\n\n' "$guide"; printf '%s' "${{ steps.controller.outputs.feedback_b64 }}" | base64 -d; } | base64 -w0)"
          timeout -k 10s 90s gh workflow run "${{ steps.delivery_transport.outputs.wake_workflow }}" --repo "$GITHUB_REPOSITORY" --ref main \
            -f wake_id="${{ steps.request.outputs.campaign_id }}-${{ steps.controller.outputs.test_request_id }}-test-reviewer" \
            -f campaign_id="${{ steps.request.outputs.campaign_id }}" \
            -f phase_id=master-targeted-tests \
            -f mode=resume_existing \
            -f chat_url="${{ steps.testchat.outputs.url }}" \
            -f wake_message_b64="$message_b64" \
            -f watchdog_enabled=true \
            -f worker_role=reviewer \
            -f gate_mode=LITE \
            -f gate_repository=curveyield3/Audit-Controller \
            -f gate_ref="${{ steps.request.outputs.audit_controller_ref }}" \
            -f gate_state_path="${{ steps.routing.outputs.campaign_directory_path }}" \
            -f gate_expected_phase_id=master-targeted-tests \
            -f gate_expected_milestone_id="${{ steps.controller.outputs.test_request_id }}" \
            -f gate_stop_states_csv=STOPPED_BY_HUMAN \
            -f gate_stop_campaign_statuses_csv=COMPLETE,STOPPED_BY_HUMAN

      - name: Wake master reviewer for newly staged segment or delegated results
        if: steps.routing.outputs.effective_hold != 'true' && steps.controller.outputs.status == 'WAITING_FOR_MASTER_REVIEW' && steps.controller.outputs.master_chat_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Distinct-chat master handoff only; the master reads invalid own submissions in its Actions run.
          poke_b64="$(printf '%s' 'GET BACK TO WORK' | base64 -w0)"
          purpose=initial_wake
          browser_context_b64="$(jq -cn --arg purpose "$purpose" \
            '{routineId:"",projectName:"",projectUrl:"",chatName:"master-reviewer",repair:{enabled:true,idlePokeThreshold:3,unviewableThreshold:2},messagePurpose:$purpose}' | base64 -w0)"
          timeout -k 10s 90s gh workflow run "${{ steps.delivery_transport.outputs.wake_workflow }}" --repo "$GITHUB_REPOSITORY" --ref main \
            -f wake_id="${{ steps.delivery_state.outputs.wake_id || format('{0}-{1}-master-reviewer',steps.request.outputs.campaign_id,steps.controller.outputs.segment_id) }}" \
            -f campaign_id="${{ steps.request.outputs.campaign_id }}" \
            -f phase_id=master-review \
            -f mode=resume_existing \
            -f chat_url="${{ steps.controller.outputs.master_chat_url }}" \
            -f wake_message_b64="${{ steps.controller.outputs.feedback_b64 }}" \
            -f watchdog_enabled=true \
            -f worker_role=reviewer \
            -f watchdog_message_b64="$poke_b64" \
            -f gate_mode=LITE \
            -f gate_repository=curveyield3/Audit-Controller \
            -f gate_ref="${{ steps.request.outputs.audit_controller_ref }}" \
            -f gate_state_path="${{ steps.routing.outputs.campaign_directory_path }}" \
            -f gate_expected_phase_id=master-review \
            -f gate_expected_milestone_id="${{ steps.controller.outputs.segment_id }}" \
            -f gate_active_pointer_path="" \
            -f gate_stop_states_csv=STOPPED_BY_HUMAN \
            -f gate_stop_campaign_statuses_csv=COMPLETE,STOPPED_BY_HUMAN,WAITING_FOR_TARGETED_TESTS \
            -f browser_context_b64="$browser_context_b64"

      - name: Summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CAMPAIGN_ID: ${{ steps.request.outputs.campaign_id }}
          REVIEW_KIND: ${{ steps.request.outputs.review_kind }}
          PHASE: ${{ steps.request.outputs.phase_sequence }}
          SEGMENT: ${{ steps.request.outputs.segment_id }}
          UNIT: ${{ steps.request.outputs.unit_id }}
          CONTROLLER_STATUS: ${{ steps.controller.outputs.status }}
          PUBLISHED: ${{ steps.publish_result.outputs.published }}
          CAMPAIGN_PATH: ${{ steps.routing.outputs.campaign_path }}
          CONTROLLER_REF: ${{ steps.request.outputs.audit_controller_ref }}
        shell: bash
        run: |
          set -euo pipefail
          controller_status="${CONTROLLER_STATUS:-CONTROLLER_RESULT_UNAVAILABLE}"
          publication=NOT_ATTEMPTED
          if [ "${PUBLISHED:-}" = true ]; then publication=PUBLISHED
          elif [ -n "${CONTROLLER_STATUS:-}" ]; then publication=FAILED
          fi
          result_file='/tmp/lite-phase-packet-result.json'
          envelope_file='/tmp/lite-phase-packet-envelope.json'
          detail_ref=""
          digest=""
          error_count=0
          if [ -s "$envelope_file" ]; then
            detail_ref="$(jq -r '.detailRef // empty' "$envelope_file" 2>/dev/null || true)"
            digest="$(jq -r '.sha256 // empty' "$envelope_file" 2>/dev/null || true)"
          fi
          machine_gate=NOT_APPLICABLE
          if [ "$controller_status" = NEEDS_REWORK ] && [ -s "$result_file" ]; then
            packet="$(jq -r '.packetPath // empty' "$result_file")"
            if [ -n "$packet" ] && [ -s ".audit-controller/$packet" ]; then
              machine_gate="$(jq -r '.controllerValidation.machineExecutionGate // "NOT_APPLICABLE"' ".audit-controller/$packet")"
            fi
          fi
          case "$controller_status" in
            NEEDS_REWORK)
              if [ "$machine_gate" = BLOCKED ]; then
                decision=MACHINE_EVIDENCE_BLOCKED
                next="Preserve accepted reviewer shards. Compare failed runner SHA/time to current main and repair any remaining runner defect. Do not re-dispatch machine execution or resubmit without explicit audit-owner authorization."
              else
                decision=REWORK_THIS_SAME_AGENT
                next="Read exact errors below, correct only reviewer-owned fields, increment the existing boundary request attempt and resubmit. Do not wait for a wake."
              fi ;;
            DISCOVERY_REWORK|MASTER_REVIEW_INVALID)
              decision=REWORK_THIS_SAME_AGENT
              next="Read exact errors below, correct only reviewer-owned fields, increment the existing boundary request attempt and resubmit. Do not wait for a wake." ;;
            DISCOVERY_NEXT) decision=CONTINUE_SAME_AGENT; next="Read the new active discovery window and complete its assigned units without waiting for a wake." ;;
            DISCOVERY_PARTIAL) decision=CONTINUE_SAME_AGENT; next="Continue assigned discovery work; do not infer another reviewer's completion." ;;
            DISCOVERY_COMPLETE) decision=CONTINUE_SAME_AGENT; next="Read the current Campaign Directory. Continue only if it assigns your chat the next phase; otherwise await the formal boundary." ;;
            PASS)
              if [ "${{ steps.controller.outputs.same }}" = true ]; then
                decision=CONTINUE_SAME_AGENT; next="Read the current Campaign Directory and begin your next assigned phase immediately."
              elif [ "${{ steps.controller.outputs.fresh }}" = true ]; then
                decision=DELIVER_DISTINCT_AGENT; next="Your phase is accepted; the controller owns the distinct-agent handoff."
              else
                decision=ACCEPTED_TERMINAL; next="Verify the matching final master approval or terminal Campaign Directory before ending your assignment."
              fi ;;
            WAITING_FOR_MASTER_REVIEW) decision=CONTROLLER_ACCEPTED_REVIEWER_RELEASED; next="Controller accepted and sealed your final segment. Your assignment is complete; stop. Master review and onward handoff belong to the controller; do not wait for the master." ;;
            MASTER_TESTS_REQUESTED) decision=DELIVER_DISTINCT_AGENT; next="Master-directed executor is assigned; await its verified result, do not run its tests yourself." ;;
            CONTROLLER_ERROR|MASTER_REVIEW_HELD) decision=AUTOMATION_BLOCKED; next="Do not edit correct reviewer data or blindly resubmit. Inspect failed component and report exact automation blocker." ;;
            ALREADY_ACCEPTED) decision=VERIFY_ACCEPTED_STATE; next="Confirm the same accepted decision in the authoritative Campaign Directory; do not submit a duplicate." ;;
            *) decision=CHECK_CURRENT_ASSIGNMENT; next="Inspect the precise current controller result and Campaign Directory; never infer approval from workflow success." ;;
          esac
          {
            echo "## CurveYield Lite boundary result"
            echo ""
            echo "**GitHub Actions success does NOT mean controller PASS.** Only a published, correctly bound controller result and current assignment authorize action."
            echo ""
            echo "- Run ID: ${GITHUB_RUN_ID} | submission commit: ${GITHUB_SHA} | event: ${GITHUB_EVENT_NAME}"
            echo "- Campaign: ${CAMPAIGN_ID:-UNKNOWN} | kind: ${REVIEW_KIND:-UNKNOWN} | phase: ${PHASE:-none} | segment: ${SEGMENT:-none} | discovery unit: ${UNIT:-none}"
            echo "- Controller status: **$controller_status** | publication: **$publication**"
            echo "- Decision: **$decision**"
            echo "- Next action: $next"
            echo "- Full controller result: ${CAMPAIGN_PATH:-UNKNOWN}/${detail_ref:-UNAVAILABLE} on Audit-Controller ref ${CONTROLLER_REF:-UNKNOWN}"
            echo "- Full result SHA-256: ${digest:-UNAVAILABLE}"
            echo "- Workflow status/conclusion: inspect this run's completed status; a failed job or failed publication is not an approval."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$result_file" ]; then
            : > /tmp/boundary-deficiencies.txt
            if [ "$controller_status" = NEEDS_REWORK ]; then
              packet="$(jq -r '.packetPath // empty' "$result_file")"
              if [ -n "$packet" ] && [ -s ".audit-controller/$packet" ]; then
                jq -r '.controllerValidation.deficiencies[]? // empty' ".audit-controller/$packet" > /tmp/boundary-deficiencies.txt
                jq -r '.controllerValidation.shardRework.shards[]? | "Shard: "+(.path//"unknown")+" | record keys: "+((.recordKeys//[])|join(","))' ".audit-controller/$packet" >> /tmp/boundary-deficiencies.txt
              fi
            fi
            if [ ! -s /tmp/boundary-deficiencies.txt ]; then
              jq -r '.feedbackText // empty' "$result_file" | sed -n '1,120p' > /tmp/boundary-deficiencies.txt
            fi
            error_count="$(wc -l </tmp/boundary-deficiencies.txt | tr -d ' ')"
            if [ "$controller_status" = NEEDS_REWORK ] || [ "$controller_status" = DISCOVERY_REWORK ] || [ "$controller_status" = MASTER_REVIEW_INVALID ]; then
              if [ "$controller_status" = NEEDS_REWORK ] && [ "$machine_gate" = BLOCKED ]; then
                owner_notice="Owner: MACHINE_EXECUTION_BLOCKED. Preserve accepted reviewer shards and sealed receipts; compare failure SHA/time to current repaired runner. No machine-executing resubmission without explicit audit-owner authorization."
                warning_suffix="Machine-evidence blocker, not a reviewer-field defect. Preserve all existing work; no unauthorized test or rerun."
              else
                owner_notice="Owner: REVIEWER_FIX for reviewer-owned semantic fields; never modify controller-prefilled records or run additional tests to silence a form error."
                warning_suffix="Correct the cited reviewer-owned field; preserve all other existing work."
              fi
              {
                echo "### Exact errors to correct"
                echo "$owner_notice"
                echo ""
              } >> "$GITHUB_STEP_SUMMARY"
              sed -n '1,30p' /tmp/boundary-deficiencies.txt | while IFS= read -r line; do
                [ -n "$line" ] || continue
                clean="$(printf '%s' "$line" | tr '\r\n' '  ' | cut -c1-1100)"
                printf -- '- %s\n' "$clean" >> "$GITHUB_STEP_SUMMARY"
                echo "::warning::CONTROLLER_REWORK [${CAMPAIGN_ID:-UNKNOWN}/${PHASE:-${SEGMENT:-${UNIT:-UNKNOWN}}}]: $clean. $warning_suffix"
              done
              if [ "$error_count" -gt 30 ]; then
                echo "- Additional errors: $((error_count-30)); read full controller result at $detail_ref." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          else
            echo "::warning::CONTROLLER_RESULT_UNAVAILABLE: No controller JSON result found in this run; inspect the exact failing job step before any resubmission."
          fi
          echo "- Detailed diagnostic lines: $error_count (first 30 shown where applicable)." >> "$GITHUB_STEP_SUMMARY"
          if [ "$publication" = FAILED ]; then
            echo "::error::CONTROLLER_RESULT_NOT_PUBLISHED: Controller status $controller_status has no confirmed Audit-Controller publication. Do not treat this as accepted or repeat an identical request."
          fi

      - name: Fail on infrastructure error or held machine-evidence gate
        if: steps.controller.outputs.status == 'CONTROLLER_ERROR' || steps.controller.outputs.status == 'MASTER_REVIEW_HELD'
        run: |
          echo "::error::Controller maintenance required; do not request reviewer changes for automation failures."
          exit 1
