name: BoostHub v13 Inline TWAP Size Qualification v1
on:
  push:
    branches: [main, cyvlsdt-v43-optimization]
    paths:
      - '.github/workflows/boosthub-v13-inline-twap-size-v1.yml'
      - 'github-native-sim/cyvlsdt-v44/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inline-evaluation:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: false}
      - uses: foundry-rs/foundry-toolchain@v1
        with: {version: stable}
      - name: Inline exact v13 TWAP function and measure EIP-170 runtime sizes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .inline-eval
          tar -xJf github-native-sim/boosthub-v13-full-stack-v1/source/BoostHub_v13_helper_overlay_v1.tar.xz -C .inline-eval
          cd .inline-eval
          python3 - <<'PY'
          from pathlib import Path
          root=Path('beefy/contracts/converter')
          helper=root/'BoostHubV3TwapQuote_v1.sol'
          s=helper.read_text()
          assert 'contract BoostHubV3TwapQuote' in s
          assert ' external view returns (uint256)' in s
          s=s.replace('contract BoostHubV3TwapQuote {','library BoostHubV3TwapQuoteInline {',1)
          s=s.replace(' external view returns (uint256)', ' internal view returns (uint256)',1)
          helper.write_text(s)
          engine=root/'BoostHubDexTwapRoutes_v2.sol'
          s=engine.read_text()
          print('ENGINE HEAD',s[:600])
          s=s.replace('import {BoostHubV3TwapQuote} from "./BoostHubV3TwapQuote_v1.sol";','import {BoostHubV3TwapQuoteInline} from "./BoostHubV3TwapQuote_v1.sol";')
          assert 'BoostHubV3TwapQuoteInline' in s
          s=s.replace('    BoostHubV3TwapQuote public immutable v3TwapHelper;\n    constructor() { v3TwapHelper = new BoostHubV3TwapQuote(); }\n','')
          assert 'v3TwapHelper.quote' in s
          s=s.replace('v3TwapHelper.quote(','BoostHubV3TwapQuoteInline.quote(')
          assert 'v3TwapHelper' not in s
          engine.write_text(s)
          print('INLINE ROOT:',root)
          PY
          mkdir -p lib
          git clone --depth 1 -q --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts
          cat > foundry.toml <<'EOF'
          [profile.default]
          src = "beefy/contracts/converter"
          out = "out"
          test = "unused"
          libs = ["lib"]
          solc_version = "0.8.28"
          optimizer = true
          optimizer_runs = 1
          via_ir = true
          bytecode_hash = "none"
          remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
          EOF
          for cfg in "1 cancun" "0 cancun" "20 cancun" "200 cancun" "1 shanghai" "1 paris"; do
            set -- $cfg; runs="$1"; evm="$2"
            sed -i -e "s/^optimizer_runs = .*/optimizer_runs = $runs/" -e '/^evm_version = /d' foundry.toml
            echo "evm_version = \"$evm\"" >> foundry.toml
            echo "=== INLINE COMPILER CONFIG optimizer_runs=$runs evm=$evm ==="
            rm -rf out cache
            if forge build --silent > inline-build.err 2>&1; then
              python3 - "$runs" "$evm" <<'PY'
          from pathlib import Path
          import sys,json
          out=Path('out')
          for name in ('BoostHubEthereumRewardConverter','BoostHubFraxtalRewardConverter'):
              found=list(out.rglob(name+'.json'))
              assert len(found)==1,(name,found)
              j=json.loads(found[0].read_text())
              obj=j.get('deployedBytecode',{}).get('object','')
              print(f'RUNTIME_BYTES {name} runs={sys.argv[1]} evm={sys.argv[2]} bytes={(len(obj)-2)//2} limit=24576 delta={(len(obj)-2)//2-24576}')
          PY
            else
              echo "BUILD_FAILED runs=$runs evm=$evm"
              tail -35 inline-build.err
            fi
          done
      - name: Save result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-inline-twap-sizes-v1-${{ github.run_id }}
          path: .inline-eval/inline-build.err
          if-no-files-found: warn
          retention-days: 7

  cyvlsdt-v45-size:
    if: github.ref_name == 'cyvlsdt-v43-optimization'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with: {version: stable}
      - name: Compile cyvlSDT v45 source delta over v44 and report EIP-170 deployed bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cyvlsdt-v44-compile
          tar -xJf github-native-sim/cyvlsdt-v44/source/cyvlsdt-v44-sources.tar.xz -C .cyvlsdt-v44-compile
          cd .cyvlsdt-v44-compile
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,subprocess,zlib
          compressed = ""
          patch = zlib.decompress(base64.b64decode(compressed))
          result = subprocess.run(['patch','-p0','--batch','--forward'],input=patch,capture_output=True)
          if result.returncode: raise RuntimeError(result.stdout.decode()+result.stderr.decode())
          for path,expected in {
              'contracts/CurveYieldVlSDTLocker.sol':'ea624b164c7697756e28d8f75bd029d2a41901eb49e66781720b9486b1ea8a1a',
              'contracts/interfaces/IStakeDao.sol':'8693022ab2b33b18dc5da31ce6e46283e7a66531ca4a4576e7ce79e098ccf9b3',
          }.items():
              actual=hashlib.sha256(Path(path).read_bytes()).hexdigest()
              assert actual==expected,(path,actual,expected)
          print('CYVLSDT_V45_SOURCE_VERIFIED')
          PY
          mkdir -p lib
          git clone --depth 1 -q --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts
          cat > foundry.toml <<'EOF'
          [profile.default]
          src = "contracts"
          out = "out"
          test = "unused"
          libs = ["lib"]
          solc_version = "0.8.28"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          evm_version = "cancun"
          bytecode_hash = "ipfs"
          remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
          EOF
          forge build --sizes 2>&1 | tee build.log
          python3 - <<'PY'
          from pathlib import Path
          import json
          for name in ('CurveYieldVlSDTLocker','CurveYieldvlSDTStaking','CurveYieldVlSDTBoostMerchant'):
              artifact = Path('out') / f'{name}.sol' / f'{name}.json'
              data=json.loads(artifact.read_text())
              deployed=data['deployedBytecode']['object'].removeprefix('0x')
              count=len(deployed)//2
              print('EIP170_RUNTIME',name,'bytes',count,'headroom',24576-count,
                    'PASS' if count<=24576 else 'OVER_LIMIT')
          PY
