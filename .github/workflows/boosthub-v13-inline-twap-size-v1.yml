name: BoostHub v13 Inline TWAP Size Qualification v1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boosthub-v13-inline-twap-size-v1.yml'
      - 'github-native-sim/curveyield-protected-vault-v9/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inline-evaluation:
    if: ${{ !contains(github.event.head_commit.message, '[vault-fee-compile]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: false}
      - uses: foundry-rs/foundry-toolchain@v1
        with: {version: stable}
      - name: Inline exact v13 TWAP function and measure EIP-170 runtime sizes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .inline-eval
          tar -xJf github-native-sim/boosthub-v13-full-stack-v1/source/BoostHub_v13_helper_overlay_v1.tar.xz -C .inline-eval
          cd .inline-eval
          python3 - <<'PY'
          from pathlib import Path
          root=Path('beefy/contracts/converter')
          helper=root/'BoostHubV3TwapQuote_v1.sol'
          s=helper.read_text()
          assert 'contract BoostHubV3TwapQuote' in s
          assert ' external view returns (uint256)' in s
          s=s.replace('contract BoostHubV3TwapQuote {','library BoostHubV3TwapQuoteInline {',1)
          s=s.replace(' external view returns (uint256)', ' internal view returns (uint256)',1)
          helper.write_text(s)
          engine=root/'BoostHubDexTwapRoutes_v2.sol'
          s=engine.read_text()
          print('ENGINE HEAD',s[:600])
          s=s.replace('import {BoostHubV3TwapQuote} from "./BoostHubV3TwapQuote_v1.sol";','import {BoostHubV3TwapQuoteInline} from "./BoostHubV3TwapQuote_v1.sol";')
          assert 'BoostHubV3TwapQuoteInline' in s
          s=s.replace('    BoostHubV3TwapQuote public immutable v3TwapHelper;\n    constructor() { v3TwapHelper = new BoostHubV3TwapQuote(); }\n','')
          assert 'v3TwapHelper.quote' in s
          s=s.replace('v3TwapHelper.quote(','BoostHubV3TwapQuoteInline.quote(')
          assert 'v3TwapHelper' not in s
          engine.write_text(s)
          print('INLINE ROOT:',root)
          PY
          mkdir -p lib
          git clone --depth 1 -q --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts
          cat > foundry.toml <<'EOF'
          [profile.default]
          src = "beefy/contracts/converter"
          out = "out"
          test = "unused"
          libs = ["lib"]
          solc_version = "0.8.28"
          optimizer = true
          optimizer_runs = 1
          via_ir = true
          bytecode_hash = "none"
          remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
          EOF
          for cfg in "1 cancun" "0 cancun" "20 cancun" "200 cancun" "1 shanghai" "1 paris"; do
            set -- $cfg; runs="$1"; evm="$2"
            sed -i -e "s/^optimizer_runs = .*/optimizer_runs = $runs/" -e '/^evm_version = /d' foundry.toml
            echo "evm_version = \"$evm\"" >> foundry.toml
            echo "=== INLINE COMPILER CONFIG optimizer_runs=$runs evm=$evm ==="
            rm -rf out cache
            if forge build --silent > inline-build.err 2>&1; then
              python3 - "$runs" "$evm" <<'PY'
          from pathlib import Path
          import sys,json
          out=Path('out')
          for name in ('BoostHubEthereumRewardConverter','BoostHubFraxtalRewardConverter'):
              found=list(out.rglob(name+'.json'))
              assert len(found)==1,(name,found)
              j=json.loads(found[0].read_text())
              obj=j.get('deployedBytecode',{}).get('object','')
              print(f'RUNTIME_BYTES {name} runs={sys.argv[1]} evm={sys.argv[2]} bytes={(len(obj)-2)//2} limit=24576 delta={(len(obj)-2)//2-24576}')
          PY
            else
              echo "BUILD_FAILED runs=$runs evm=$evm"
              tail -35 inline-build.err
            fi
          done
      - name: Save result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-inline-twap-sizes-v1-${{ github.run_id }}
          path: .inline-eval/inline-build.err
          if-no-files-found: warn
          retention-days: 7

  compile-protected-vault:
    if: ${{ contains(github.event.head_commit.message, '[vault-fee-compile]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install Foundry compiler
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile protected vault Solidity 0.8.28 and report EIP-170 runtime size
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/curveyield-protected-vault"
          mkdir -p "$ROOT/src" "protected-vault-compile-evidence-v9"
          cp github-native-sim/curveyield-protected-vault-v9/contracts/CurveYieldProtectedVaultController-v9.sol "$ROOT/src/"
          sha256sum "$ROOT/src/CurveYieldProtectedVaultController-v9.sol" | tee protected-vault-compile-evidence-v9/source-sha256.txt
          cat > "$ROOT/foundry.toml" <<'TOML'
          [profile.default]
          src = "src"
          out = "out"
          libs = ["lib"]
          solc_version = "0.8.28"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          evm_version = "cancun"
          TOML
          echo "commit=$GITHUB_SHA" | tee protected-vault-compile-evidence-v9/provenance.txt
          forge --version | tee -a protected-vault-compile-evidence-v9/provenance.txt
          ( cd "$ROOT" && forge build --sizes --force ) 2>&1 | tee protected-vault-compile-evidence-v9/compile.log
          python3 - "$ROOT/out" <<'PY' | tee protected-vault-compile-evidence-v9/runtime-sizes.txt
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          for name in ('CurveYieldProtectedVaultController','CurveYieldFeeShareCustody'):
              matches=list(root.rglob(f'{name}.json'))
              if len(matches)!=1: raise SystemExit(f'ERROR: missing/duplicate {name} artifact: {matches}')
              artifact=json.loads(matches[0].read_text())
              obj=artifact['deployedBytecode']['object'].removeprefix('0x')
              size=len(obj)//2
              print(f'{name}: runtime_bytes={size} eip170_limit=24576 headroom={24576-size}')
              if size>24576: raise SystemExit(f'ERROR: EIP-170 runtime size exceeded by {name}')
          PY
          cp -a "$ROOT/out" "protected-vault-compile-evidence-v9/foundry-out"
          # Emit publicly compiled creation bytecode for the existing transaction signer tool.
          python3 - "$ROOT/out" <<'PYINIT'
          import json,sys
          from pathlib import Path
          p=next(Path(sys.argv[1]).rglob('CurveYieldProtectedVaultController.json'))
          b=json.loads(p.read_text())['bytecode']['object']
          print('CURVEYIELD_V9_DEPLOY_BYTECODE='+ ('0x'+b.removeprefix('0x')))
          PYINIT
      - name: Upload compile-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curveyield-protected-vault-v9-compile-${{ github.run_id }}
          path: protected-vault-compile-evidence-v9/
          if-no-files-found: warn
          retention-days: 30
