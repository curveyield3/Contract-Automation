name: BoostHub v13 Inline TWAP Size Qualification v1
on:
  push:
    branches: [main, boosthub-apr15-v36-compile]
    paths:
      - '.github/workflows/boosthub-v13-inline-twap-size-v1.yml'
      - 'github-native-sim/boosthub-v13-full-stack-v1/source/BeefyVaultV7FixedV2.sol'
      - 'github-native-sim/boosthub-v13-full-stack-v1/source/interfaces/IStrategyBoostHubV1.sol'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inline-evaluation:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: false}
      - uses: foundry-rs/foundry-toolchain@v1
        with: {version: stable}
      - name: Inline exact v13 TWAP function and measure EIP-170 runtime sizes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .inline-eval
          tar -xJf github-native-sim/boosthub-v13-full-stack-v1/source/BoostHub_v13_helper_overlay_v1.tar.xz -C .inline-eval
          cd .inline-eval
          python3 - <<'PY'
          from pathlib import Path
          root=Path('beefy/contracts/converter')
          helper=root/'BoostHubV3TwapQuote_v1.sol'
          s=helper.read_text()
          assert 'contract BoostHubV3TwapQuote' in s
          assert ' external view returns (uint256)' in s
          s=s.replace('contract BoostHubV3TwapQuote {','library BoostHubV3TwapQuoteInline {',1)
          s=s.replace(' external view returns (uint256)', ' internal view returns (uint256)',1)
          helper.write_text(s)
          engine=root/'BoostHubDexTwapRoutes_v2.sol'
          s=engine.read_text()
          print('ENGINE HEAD',s[:600])
          s=s.replace('import {BoostHubV3TwapQuote} from "./BoostHubV3TwapQuote_v1.sol";','import {BoostHubV3TwapQuoteInline} from "./BoostHubV3TwapQuote_v1.sol";')
          assert 'BoostHubV3TwapQuoteInline' in s
          s=s.replace('    BoostHubV3TwapQuote public immutable v3TwapHelper;\n    constructor() { v3TwapHelper = new BoostHubV3TwapQuote(); }\n','')
          assert 'v3TwapHelper.quote' in s
          s=s.replace('v3TwapHelper.quote(','BoostHubV3TwapQuoteInline.quote(')
          assert 'v3TwapHelper' not in s
          engine.write_text(s)
          print('INLINE ROOT:',root)
          PY
          mkdir -p lib
          git clone --depth 1 -q --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts
          cat > foundry.toml <<'EOF'
          [profile.default]
          src = "beefy/contracts/converter"
          out = "out"
          test = "unused"
          libs = ["lib"]
          solc_version = "0.8.28"
          optimizer = true
          optimizer_runs = 1
          via_ir = true
          bytecode_hash = "none"
          remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
          EOF
          for cfg in "1 cancun" "0 cancun" "20 cancun" "200 cancun" "1 shanghai" "1 paris"; do
            set -- $cfg; runs="$1"; evm="$2"
            sed -i -e "s/^optimizer_runs = .*/optimizer_runs = $runs/" -e '/^evm_version = /d' foundry.toml
            echo "evm_version = \"$evm\"" >> foundry.toml
            echo "=== INLINE COMPILER CONFIG optimizer_runs=$runs evm=$evm ==="
            rm -rf out cache
            if forge build --silent > inline-build.err 2>&1; then
              python3 - "$runs" "$evm" <<'PY'
          from pathlib import Path
          import sys,json
          out=Path('out')
          for name in ('BoostHubEthereumRewardConverter','BoostHubFraxtalRewardConverter'):
              found=list(out.rglob(name+'.json'))
              assert len(found)==1,(name,found)
              j=json.loads(found[0].read_text())
              obj=j.get('deployedBytecode',{}).get('object','')
              print(f'RUNTIME_BYTES {name} runs={sys.argv[1]} evm={sys.argv[2]} bytes={(len(obj)-2)//2} limit=24576 delta={(len(obj)-2)//2-24576}')
          PY
            else
              echo "BUILD_FAILED runs=$runs evm=$evm"
              tail -35 inline-build.err
            fi
          done
      - name: Save result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-inline-twap-sizes-v1-${{ github.run_id }}
          path: .inline-eval/inline-build.err
          if-no-files-found: warn
          retention-days: 7
  vault-v36-compile:
    if: github.ref_name == 'boosthub-apr15-v36-compile'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: foundry-rs/foundry-toolchain@v1
        with: {version: stable}
      - name: Set up isolated exact-source vault compilation
        shell: bash
        run: |
          set -euo pipefail
          src='github-native-sim/boosthub-v13-full-stack-v1/source'
          mkdir -p .apr-v36/contracts/interfaces .apr-v36/dependencies
          cp "$src/BeefyVaultV7FixedV2.sol" .apr-v36/contracts/
          cp "$src/interfaces/IStrategyBoostHubV1.sol" .apr-v36/contracts/interfaces/
          npm install --prefix .apr-v36/dependencies --no-save --no-package-lock --ignore-scripts --no-audit --no-fund '@openzeppelin/contracts@4.9.6'
          cat > .apr-v36/foundry.toml <<'TOML'
          [profile.default]
          src = "contracts"
          out = "out"
          libs = ["dependencies/node_modules"]
          remappings = ["@openzeppelin-4/contracts/=dependencies/node_modules/@openzeppelin/contracts/"]
          solc_version = "0.8.28"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          TOML
          echo 'EXACT_SOURCE_SHA256:'
          sha256sum .apr-v36/contracts/BeefyVaultV7FixedV2.sol .apr-v36/contracts/interfaces/IStrategyBoostHubV1.sol
      - name: Compile v36 vault and enforce EIP-170
        shell: bash
        run: |
          set -euo pipefail
          (cd .apr-v36 && forge build --force --sizes) 2>&1 | tee boosthub-v36-compile.log
          python3 - <<'PY' | tee boosthub-v36-runtime-size.txt
          import json
          from pathlib import Path
          p = Path('.apr-v36/out/BeefyVaultV7FixedV2.sol/BeefyVaultV7FixedV2.json')
          a = json.loads(p.read_text())
          code = a['deployedBytecode']['object']
          assert code.startswith('0x') and len(code) > 2, 'missing deployed runtime bytecode'
          n = (len(code) - 2) // 2
          print(f'EIP170_RUNTIME_BYTES={n}')
          print(f'EIP170_LIMIT_BYTES=24576')
          print(f'EIP170_HEADROOM_BYTES={24576-n}')
          assert n < 24576, f'EIP-170 size exceeded: {n} bytes'
          print('COMPILATION_AND_SIZE_STATUS=PASS')
          PY
      - name: Retain compile result (no tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-v36-vault-compile
          path: |
            boosthub-v36-compile.log
            boosthub-v36-runtime-size.txt
            .apr-v36/out/BeefyVaultV7FixedV2.sol/BeefyVaultV7FixedV2.json
          if-no-files-found: warn
