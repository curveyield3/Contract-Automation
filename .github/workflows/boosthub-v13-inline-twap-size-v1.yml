name: Curve Pair Oracle Bounds v3 Compile (isolated branch)
on:
  push:
    branches: [curve-pair-oracle-bounds-v3]
    paths:
      - '.github/workflows/boosthub-v13-inline-twap-size-v1.yml'
      - 'contracts/oracles/CurvePairOracleBounds_v3.sol'
permissions:
  contents: read
jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile exact v3 source without tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .curve-compile/src
          cp contracts/oracles/CurvePairOracleBounds_v3.sol .curve-compile/src/
          cat > .curve-compile/foundry.toml <<'EOF'
          [profile.default]
          src = "src"
          out = "out"
          test = "no-tests"
          solc_version = "0.8.30"
          optimizer = true
          optimizer_runs = 200
          evm_version = "cancun"
          EOF
          cd .curve-compile
          forge build --skip test
          python3 - <<'PY'
          from pathlib import Path
          import json
          j=json.loads(Path("out/CurvePairOracleBounds_v3.sol/CurvePairOracleBoundsV3.json").read_text())
          creation=j["bytecode"]["object"]
          runtime=j["deployedBytecode"]["object"]
          print("CREATION_BYTES",len(creation.removeprefix("0x"))//2)
          print("RUNTIME_BYTES",len(runtime.removeprefix("0x"))//2)
          print("CREATION_BYTECODE="+creation)
          PY
      - name: Preserve compilation artifact
        uses: actions/upload-artifact@v4
        with:
          name: curve-pair-oracle-bounds-v3-compiled
          path: .curve-compile/out/CurvePairOracleBounds_v3.sol/CurvePairOracleBoundsV3.json
          if-no-files-found: error
          retention-days: 7
