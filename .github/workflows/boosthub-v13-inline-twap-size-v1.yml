name: BoostHub v13 Inline TWAP Size Qualification v1
on:
  push:
    branches: [main, pol-manager-v3-size]
    paths:
      - '.github/workflows/boosthub-v13-inline-twap-size-v1.yml'
      - 'github-native-sim/pol-manager-v3/PoL_Manager_Contract_v12.sol'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inline-evaluation:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: false}
      - uses: foundry-rs/foundry-toolchain@v1
        with: {version: stable}
      - name: Inline exact v13 TWAP function and measure EIP-170 runtime sizes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .inline-eval
          tar -xJf github-native-sim/boosthub-v13-full-stack-v1/source/BoostHub_v13_helper_overlay_v1.tar.xz -C .inline-eval
          cd .inline-eval
          python3 - <<'PY'
          from pathlib import Path
          root=Path('beefy/contracts/converter')
          helper=root/'BoostHubV3TwapQuote_v1.sol'
          s=helper.read_text()
          assert 'contract BoostHubV3TwapQuote' in s
          assert ' external view returns (uint256)' in s
          s=s.replace('contract BoostHubV3TwapQuote {','library BoostHubV3TwapQuoteInline {',1)
          s=s.replace(' external view returns (uint256)', ' internal view returns (uint256)',1)
          helper.write_text(s)
          engine=root/'BoostHubDexTwapRoutes_v2.sol'
          s=engine.read_text()
          print('ENGINE HEAD',s[:600])
          s=s.replace('import {BoostHubV3TwapQuote} from "./BoostHubV3TwapQuote_v1.sol";','import {BoostHubV3TwapQuoteInline} from "./BoostHubV3TwapQuote_v1.sol";')
          assert 'BoostHubV3TwapQuoteInline' in s
          s=s.replace('    BoostHubV3TwapQuote public immutable v3TwapHelper;\n    constructor() { v3TwapHelper = new BoostHubV3TwapQuote(); }\n','')
          assert 'v3TwapHelper.quote' in s
          s=s.replace('v3TwapHelper.quote(','BoostHubV3TwapQuoteInline.quote(')
          assert 'v3TwapHelper' not in s
          engine.write_text(s)
          print('INLINE ROOT:',root)
          PY
          mkdir -p lib
          git clone --depth 1 -q --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts
          cat > foundry.toml <<'EOF'
          [profile.default]
          src = "beefy/contracts/converter"
          out = "out"
          test = "unused"
          libs = ["lib"]
          solc_version = "0.8.28"
          optimizer = true
          optimizer_runs = 1
          via_ir = true
          bytecode_hash = "none"
          remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
          EOF
          for cfg in "1 cancun" "0 cancun" "20 cancun" "200 cancun" "1 shanghai" "1 paris"; do
            set -- $cfg; runs="$1"; evm="$2"
            sed -i -e "s/^optimizer_runs = .*/optimizer_runs = $runs/" -e '/^evm_version = /d' foundry.toml
            echo "evm_version = \"$evm\"" >> foundry.toml
            echo "=== INLINE COMPILER CONFIG optimizer_runs=$runs evm=$evm ==="
            rm -rf out cache
            if forge build --silent > inline-build.err 2>&1; then
              python3 - "$runs" "$evm" <<'PY'
          from pathlib import Path
          import sys,json
          out=Path('out')
          for name in ('BoostHubEthereumRewardConverter','BoostHubFraxtalRewardConverter'):
              found=list(out.rglob(name+'.json'))
              assert len(found)==1,(name,found)
              j=json.loads(found[0].read_text())
              obj=j.get('deployedBytecode',{}).get('object','')
              print(f'RUNTIME_BYTES {name} runs={sys.argv[1]} evm={sys.argv[2]} bytes={(len(obj)-2)//2} limit=24576 delta={(len(obj)-2)//2-24576}')
          PY
            else
              echo "BUILD_FAILED runs=$runs evm=$evm"
              tail -35 inline-build.err
            fi
          done
      - name: Save result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-inline-twap-sizes-v1-${{ github.run_id }}
          path: .inline-eval/inline-build.err
          if-no-files-found: warn
          retention-days: 7

  pol-v3-size:
    if: github.ref == 'refs/heads/pol-manager-v3-size'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: foundry-rs/foundry-toolchain@v1
        with: {version: stable}
      - name: Compile source-only and report EIP-170 deployed bytes
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/pol-manager-v3"
          mkdir -p "$WORK/src"
          cp github-native-sim/pol-manager-v3/PoL_Manager_Contract_v12.sol "$WORK/src/"
          cd "$WORK"
          FOUND=0
          for runs in 200 1; do
            cat > foundry.toml <<EOF
          [profile.default]
          src = "src"
          test = "unused"
          out = "out"
          solc_version = "0.8.28"
          optimizer = true
          optimizer_runs = $runs
          via_ir = true
          evm_version = "cancun"
          bytecode_hash = "none"
          EOF
            echo "=== BUILD optimizer_runs=$runs via_ir=true ===" | tee -a "$GITHUB_WORKSPACE/pol-manager-v3-size.log"
            if forge build --skip test --force 2>&1 | tee -a "$GITHUB_WORKSPACE/pol-manager-v3-size.log"; then
              python3 - "$runs" <<'PY' | tee -a "$GITHUB_WORKSPACE/pol-manager-v3-size.log"
          import json,sys
          from pathlib import Path
          for contract in ("PoLManager",):
              found=list(Path("out").rglob(contract+".json"))
              if len(found)!=1: raise SystemExit(f"Missing unique artifact for {contract}: {found}")
              artifact=json.loads(found[0].read_text())
              runtime=artifact["deployedBytecode"]["object"].removeprefix("0x")
              creation=artifact["bytecode"]["object"].removeprefix("0x")
              if not runtime or len(runtime)%2: raise SystemExit("Missing runtime")
              size=len(runtime)//2
              print(f"POL_V12_RUNTIME_BYTES contract={contract} bytes={size} optimizer_runs={sys.argv[1]} limit=24576 headroom={24576-size} over_limit={size>24576}",flush=True)
              print(f"POL_V12_CREATION_BYTES contract={contract} bytes={len(creation)//2} optimizer_runs={sys.argv[1]}",flush=True)
          PY
              FOUND=1
            else
              echo "POL_V3_BUILD_FAILED optimizer_runs=$runs" | tee -a "$GITHUB_WORKSPACE/pol-manager-v3-size.log"
            fi
          done
          [ "$FOUND" = 1 ]
      - name: Preserve compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pol-manager-v3-size-${{ github.run_id }}
          path: pol-manager-v3-size.log
          if-no-files-found: warn
          retention-days: 14
