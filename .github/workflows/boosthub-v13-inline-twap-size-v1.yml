name: BoostHub v13 Inline TWAP Size Qualification v1
on:
  push:
    branches: [main, morpho-fraxtal-compile-v1]
    paths:
      - '.github/workflows/boosthub-v13-inline-twap-size-v1.yml'
      - 'github-native-sim/morpho-fraxtal-v1/CurveYieldMorphoOwnerAndSplitterV1.sol'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inline-evaluation:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: false}
      - uses: foundry-rs/foundry-toolchain@v1
        with: {version: stable}
      - name: Inline exact v13 TWAP function and measure EIP-170 runtime sizes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .inline-eval
          tar -xJf github-native-sim/boosthub-v13-full-stack-v1/source/BoostHub_v13_helper_overlay_v1.tar.xz -C .inline-eval
          cd .inline-eval
          python3 - <<'PY'
          from pathlib import Path
          root=Path('beefy/contracts/converter')
          helper=root/'BoostHubV3TwapQuote_v1.sol'
          s=helper.read_text()
          assert 'contract BoostHubV3TwapQuote' in s
          assert ' external view returns (uint256)' in s
          s=s.replace('contract BoostHubV3TwapQuote {','library BoostHubV3TwapQuoteInline {',1)
          s=s.replace(' external view returns (uint256)', ' internal view returns (uint256)',1)
          helper.write_text(s)
          engine=root/'BoostHubDexTwapRoutes_v2.sol'
          s=engine.read_text()
          print('ENGINE HEAD',s[:600])
          s=s.replace('import {BoostHubV3TwapQuote} from "./BoostHubV3TwapQuote_v1.sol";','import {BoostHubV3TwapQuoteInline} from "./BoostHubV3TwapQuote_v1.sol";')
          assert 'BoostHubV3TwapQuoteInline' in s
          s=s.replace('    BoostHubV3TwapQuote public immutable v3TwapHelper;\n    constructor() { v3TwapHelper = new BoostHubV3TwapQuote(); }\n','')
          assert 'v3TwapHelper.quote' in s
          s=s.replace('v3TwapHelper.quote(','BoostHubV3TwapQuoteInline.quote(')
          assert 'v3TwapHelper' not in s
          engine.write_text(s)
          print('INLINE ROOT:',root)
          PY
          mkdir -p lib
          git clone --depth 1 -q --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts
          cat > foundry.toml <<'EOF'
          [profile.default]
          src = "beefy/contracts/converter"
          out = "out"
          test = "unused"
          libs = ["lib"]
          solc_version = "0.8.28"
          optimizer = true
          optimizer_runs = 1
          via_ir = true
          bytecode_hash = "none"
          remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
          EOF
          for cfg in "1 cancun" "0 cancun" "20 cancun" "200 cancun" "1 shanghai" "1 paris"; do
            set -- $cfg; runs="$1"; evm="$2"
            sed -i -e "s/^optimizer_runs = .*/optimizer_runs = $runs/" -e '/^evm_version = /d' foundry.toml
            echo "evm_version = \"$evm\"" >> foundry.toml
            echo "=== INLINE COMPILER CONFIG optimizer_runs=$runs evm=$evm ==="
            rm -rf out cache
            if forge build --silent > inline-build.err 2>&1; then
              python3 - "$runs" "$evm" <<'PY'
          from pathlib import Path
          import sys,json
          out=Path('out')
          for name in ('BoostHubEthereumRewardConverter','BoostHubFraxtalRewardConverter'):
              found=list(out.rglob(name+'.json'))
              assert len(found)==1,(name,found)
              j=json.loads(found[0].read_text())
              obj=j.get('deployedBytecode',{}).get('object','')
              print(f'RUNTIME_BYTES {name} runs={sys.argv[1]} evm={sys.argv[2]} bytes={(len(obj)-2)//2} limit=24576 delta={(len(obj)-2)//2-24576}')
          PY
            else
              echo "BUILD_FAILED runs=$runs evm=$evm"
              tail -35 inline-build.err
            fi
          done
      - name: Save result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-inline-twap-sizes-v1-${{ github.run_id }}
          path: .inline-eval/inline-build.err
          if-no-files-found: warn
          retention-days: 7

  morpho-v1-compile:
    permissions:
      contents: write
    name: Compile exact Fraxtal Morpho governance + splitter v1
    if: github.ref_name == 'morpho-fraxtal-compile-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile isolated original source (no tests)
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .morpho-compile
          cat > foundry.toml <<'TOML'
          [profile.default]
          src = "github-native-sim/morpho-fraxtal-v1"
          test = ".morpho-compile/unused"
          out = ".morpho-compile/out"
          libs = []
          solc_version = "0.8.28"
          optimizer = true
          optimizer_runs = 200
          evm_version = "cancun"
          TOML
          echo "Exact compiler-input identity:"
          sha256sum github-native-sim/morpho-fraxtal-v1/CurveYieldMorphoOwnerAndSplitterV1.sol | tee .morpho-compile/source-sha256.txt
          forge build --force --sizes 2>&1 | tee .morpho-compile/compile.log
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path('.morpho-compile/out')
          rows = []
          for p in root.rglob('*.json'):
              d = json.loads(p.read_text())
              bc = d.get('deployedBytecode',{}).get('object','')
              if not isinstance(bc,str) or not bc.startswith('0x') or len(bc)<=2: continue
              rows.append({'contract':p.stem,'runtimeBytes':(len(bc)-2)//2,'eip170Pass':(len(bc)-2)//2 <= 24576})
          wanted = {'CurveYieldMorphoOwnerV1','CurveYieldMorphoFeeSplitterV2'}
          names = {r['contract'] for r in rows}
          assert wanted <= names, f'Missing deployable contracts: {wanted - names}'
          assert all(row['eip170Pass'] for row in rows), 'Runtime bytecode exceeds EIP-170'
          Path('.morpho-compile/compiler-summary.json').write_text(json.dumps({'status':'PASS','compiler':'0.8.28','optimizerRuns':200,'evmVersion':'cancun','contracts':rows},indent=2)+'\n')
          print(json.dumps(rows,indent=2))
          PY
      - name: Retain compiler evidence (no tests executed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morpho-fraxtal-v1-compiler-evidence
          path: |
            .morpho-compile/compile.log
            .morpho-compile/source-sha256.txt
            .morpho-compile/compiler-summary.json
          if-no-files-found: warn
      - name: Publish branch-local compilation receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
        run: |
          set -euo pipefail
          # Only the current branch head may publish a receipt.
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq '.object.sha')"
          if [ "$head_sha" != "$GITHUB_SHA" ]; then echo 'Stale run: skipping receipt'; exit 0; fi
          mkdir -p .morpho-compile
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, os
          repo = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['GITHUB_RUN_ID']
          path = 'github-native-sim/morpho-fraxtal-v1/CurveYieldMorphoOwnerAndSplitterV1.sol'
          src = Path(path).read_bytes()
          summary = Path('.morpho-compile/compiler-summary.json')
          log = Path('.morpho-compile/compile.log')
          data = {
            'status': 'PASS' if os.environ.get('COMPILE_OUTCOME') == 'success' else 'FAIL',
            'workflowRunId': int(run_id),
            'workflowRunUrl': 'https://github.com/' + repo + '/actions/runs/' + run_id,
            'headSha': os.environ['GITHUB_SHA'],
            'sourceSha256': hashlib.sha256(src).hexdigest(),
            'compilation': json.loads(summary.read_text()) if summary.exists() else None,
            'compileLogTail': log.read_text(errors='replace')[-12000:] if log.exists() else None
          }
          if data['status'] == 'PASS':
              artifacts = {}
              for name in ('CurveYieldMorphoOwnerV1','CurveYieldMorphoFeeSplitterV2'):
                  matches = list(Path('.morpho-compile/out').rglob(name+'.json'))
                  assert len(matches)==1, (name,matches)
                  c = json.loads(matches[0].read_text())
                  code = c['bytecode']['object']
                  assert code.startswith('0x') and len(code)>2 and '__
          payload = {'message':'Record Morpho compiler result and deployment bytecode','branch':os.environ['GITHUB_REF_NAME'],'content':content}
          import subprocess
          remote = subprocess.run(['gh','api','repos/'+repo+'/contents/github-native-sim/morpho-fraxtal-v1/compilation-receipt-v1.json','--jq','.sha'],capture_output=True,text=True)
          if remote.returncode == 0:
              payload['sha'] = remote.stdout.strip()
          Path('.morpho-compile/receipt-request.json').write_text(json.dumps(payload))
          print('COMPILATION_RECEIPT',data['status'],data['workflowRunUrl'])
          PY
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/github-native-sim/morpho-fraxtal-v1/compilation-receipt-v1.json" --input .morpho-compile/receipt-request.json
 not in code
                  artifacts[name] = {'abi':c['abi'], 'creationBytecode':code,
                      'runtimeBytecode':c['deployedBytecode']['object'], 'metadata':c.get('metadata')}
              data['deployableArtifacts'] = artifacts
          content = base64.b64encode((json.dumps(data,indent=2)+'\n').encode()).decode()
          payload = {'message':'Record Morpho Fraxtal compiler result', 'branch':os.environ['GITHUB_REF_NAME'], 'content':content}
          Path('.morpho-compile/receipt-request.json').write_text(json.dumps(payload))
          print('COMPILATION_RECEIPT',data['status'],data['workflowRunUrl'])
          PY
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/github-native-sim/morpho-fraxtal-v1/compilation-receipt-v1.json" --input .morpho-compile/receipt-request.json
