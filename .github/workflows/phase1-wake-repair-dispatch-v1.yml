name: Phase 1 Existing Chat Wake Repair Dispatch v1
on:
  push:
    branches: [main]
    paths:
      - 'process/agent-upload/phase1-wake-repair/*.json'
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Resolve one exact campaign wake repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t requests < <(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.files[]? | select(.status!="removed") | .filename | select(startswith("process/agent-upload/phase1-wake-repair/") and endswith(".json"))')
          test "${#requests[@]}" -eq 1
          request="${requests[0]}"
          jq -e '.schemaVersion=="curveyield-phase1-wake-repair-request-v1" and .campaignId=="curveyield-dex-v16-source-r4" and .reviewer=="reviewer-1" and .phaseId=="phase-1" and .milestoneId=="PHASE_1_WORK_PACKET" and (.diagnosticOnly|type=="boolean")' "$request" >/dev/null
          diagnostic="$(jq -r '.diagnosticOnly' "$request")"
          registration='process/browser-agent-wake/registrations/curveyield-dex-v16-source-r4.json'
          chat_url="$(jq -r '."agentChats"."reviewer-1"' "$registration")"
          test "$chat_url" = "$(jq -r '.chatUrl' "$registration")"
          wake_b64="$(jq -r .wakeMessage "$registration" | base64 -w0)"
          test -n "$wake_b64"
          context_b64="$(jq -cn --argjson diagnostic "$diagnostic" '{routineId:"",projectName:"",projectUrl:"",chatName:"reviewer-1",diagnosticOnly:$diagnostic,repair:{enabled:true,idlePokeThreshold:3,unviewableThreshold:2},messagePurpose:"initial_wake"}' | base64 -w0)"
          gh workflow run browser-agent-wake.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f wake_id=curveyield-dex-v16-source-r4-PHASE_1_WORK_PACKET-reviewer-1 \
            -f campaign_id=curveyield-dex-v16-source-r4 \
            -f phase_id=phase-1 \
            -f mode=resume_existing \
            -f chat_url="$chat_url" \
            -f wake_message_b64="$wake_b64" \
            -f watchdog_enabled=false \
            -f worker_role=reviewer \
            -f gate_mode=LITE \
            -f gate_repository=curveyield3/Audit-Controller \
            -f gate_ref=main \
            -f gate_state_path='Audit Campaign Directory/campaigns/curveyield-dex-v16-source.json' \
            -f gate_expected_phase_id=phase-1 \
            -f gate_expected_milestone_id=PHASE_1_WORK_PACKET \
            -f gate_stop_states_csv=STOPPED_BY_HUMAN \
            -f gate_stop_campaign_statuses_csv=COMPLETE,STOPPED_BY_HUMAN \
            -f browser_context_b64="$context_b64"
          echo "Phase-1 existing-chat diagnostic_only=$diagnostic submitted." >> "$GITHUB_STEP_SUMMARY"
