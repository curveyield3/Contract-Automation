name: Build cyvbusdc Foundry package v17

on:
  push:
    branches: [main]
    paths:
      - ".github/package-build-requests/cyvbusdc-v17.json"

permissions:
  contents: read

concurrency:
  group: cyvbusdc-package-build-v17
  cancel-in-progress: false

jobs:
  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Validate the one-shot package request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/package-build-requests/cyvbusdc-v17.json
          jq -e '
            .schemaVersion == "cyvbusdc-package-build-request-v1" and
            .version == "v17" and
            .sourceArchive == "campaigns/cyvbusdc_yearn_v3_1_0_strategy_stack_v16.zip" and
            .outputArchive == "campaigns/cyvbusdc_yearn_v3_1_0_strategy_stack_v17.zip"
          ' .github/package-build-requests/cyvbusdc-v17.json >/dev/null

      - name: Authenticate read/write Audit-Controller access
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: "true"
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Fetch exact v16 package archive
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --depth 1 --filter=blob:none --sparse https://github.com/curveyield3/Audit-Controller.git .audit-controller
          git -C .audit-controller sparse-checkout set --no-cone "campaigns/cyvbusdc_yearn_v3_1_0_strategy_stack_v16.zip"
          test -s .audit-controller/campaigns/cyvbusdc_yearn_v3_1_0_strategy_stack_v16.zip
          mkdir -p "$RUNNER_TEMP/cyvbusdc-v17"
          cp .audit-controller/campaigns/cyvbusdc_yearn_v3_1_0_strategy_stack_v16.zip "$RUNNER_TEMP/cyvbusdc-v17/v16.zip"
          sha256sum "$RUNNER_TEMP/cyvbusdc-v17/v16.zip"

      - name: Extract and repair package configuration (contracts immutable)
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, zipfile
          work = pathlib.Path(os.environ["RUNNER_TEMP"]) / "cyvbusdc-v17"
          archive = work / "v16.zip"
          extracted = work / "extracted"
          extracted.mkdir()
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  p = pathlib.PurePosixPath(info.filename)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit(f"Unsafe ZIP member: {info.filename}")
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt v16 ZIP member: {bad}")
              z.extractall(extracted)
          manifests = list(extracted.rglob("package_manifest_v16.json"))
          if len(manifests) != 1:
              raise SystemExit(f"Expected one v16 package manifest, found {len(manifests)}")
          root = manifests[0].parent
          package = "cyvbusdc_yearn_v3_1_0_strategy_stack_v17"
          if root.name != package:
              destination = root.parent / package
              if destination.exists():
                  raise SystemExit("v17 extraction destination already exists")
              root.rename(destination)
              root = destination
          manifest_path = root / "package_manifest_v16.json"
          manifest = json.loads(manifest_path.read_text())
          if manifest.get("version") != "v16":
              raise SystemExit("Base package manifest is not v16")
          # The campaign's extracted source omits npm-layout mirrors in some
          # materializations. Recreate those exact source copies from the
          # package's vendored dependency trees when they are absent.
          aliases = [
              ("node_modules/forge-std/", "dependencies_v6/forge-std/src/"),
              ("node_modules/@openzeppelin/contracts/", "dependencies_v6/openzeppelin-contracts/contracts/"),
              ("node_modules/@tokenized-strategy/", "dependencies_v6/tokenized-strategy/src/"),
              ("node_modules/@morpho-blue/", "dependencies_v6/morpho-blue/src/")
          ]
          for rel in manifest["files"]:
              target = root / rel
              if target.is_file():
                  continue
              if rel.startswith("node_modules/"):
                  copied = False
                  for prefix, source_prefix in aliases:
                      if rel.startswith(prefix):
                          source = root / (source_prefix + rel[len(prefix):])
                          if source.is_file():
                              target.parent.mkdir(parents=True, exist_ok=True)
                              shutil.copy2(source, target)
                              copied = True
                              break
                  if copied:
                      continue
              raise SystemExit(f"Package manifest member missing from source ZIP: {rel}")
          def digest(path):
              b = path.read_bytes()
              return hashlib.sha256(b).hexdigest(), len(b)
          original_contract_hashes = {}
          for folder in ("contracts", "audited_router"):
              for p in sorted((root / folder).rglob("*.sol")):
                  original_contract_hashes[p.relative_to(root).as_posix()] = digest(p)[0]
          # Verify every v16 manifest member before modifying the package.
          for rel, expected in manifest["files"].items():
              actual, size = digest(root / rel)
              if actual != expected["sha256"] or size != expected["sizeBytes"]:
                  raise SystemExit(f"v16 manifest integrity mismatch: {rel}")
          # Foundry vm.getCode reads the router artifact from ./out. Foundry
          # requires explicit read permission for that file-cheatcode access.
          toml = (root / "foundry.toml").read_text()
          toml, restriction_count = re.subn(
              r'(paths\s*=\s*"contracts/CurveYieldSushiV3FeeRouter\.sol",\s*version\s*=\s*)"0\.7\.6"',
              r'\1"=0.7.6", profile = "router-istanbul"',
              toml
          )
          if restriction_count != 1 and 'version = "=0.7.6"' not in toml:
              raise SystemExit("Foundry router compiler restriction must be pinned exactly to =0.7.6")
          if "additional_compiler_profiles" not in toml:
              marker_profile = "ffi = false"
              if marker_profile not in toml:
                  raise SystemExit("Cannot locate ffi=false for router compiler profile insertion")
              toml = toml.replace(
                  marker_profile,
                  marker_profile + '\nfs_permissions = [{ access = "read", path = "./out" }]'
                  + '\nadditional_compiler_profiles = [ { name = "router-istanbul", evm_version = "istanbul" } ]',
                  1
              )
          if 'additional_compiler_profiles = [ { name = "router-istanbul", evm_version = "istanbul" } ]' not in toml:
              raise SystemExit("Missing router-istanbul compiler profile")
          if 'profile = "router-istanbul"' not in toml:
              raise SystemExit("Router compilation restriction does not select router-istanbul")
          if "fs_permissions" not in toml:
              marker = "ffi = false"
              if marker not in toml:
                  raise SystemExit("Cannot locate ffi=false in foundry.toml")
              toml = toml.replace(marker, marker + '\nfs_permissions = [{ access = "read", path = "./out" }]', 1)
          if 'fs_permissions = [{ access = "read", path = "./out" }]' not in toml:
              raise SystemExit("Foundry output read permission was not set exactly")
          (root / "foundry.toml").write_text(toml)
          old_script = root / "script/DeployCurveYieldVbUSDCYearn_v16.s.sol"
          new_script = root / "script/DeployCurveYieldVbUSDCYearn_v17.s.sol"
          if not old_script.is_file() or new_script.exists():
              raise SystemExit("Unexpected v16 deployment script state")
          script_text = old_script.read_text()
          if "contract DeployCurveYieldVbUSDCYearn_v16 is Script" not in script_text:
              raise SystemExit("v16 script contract declaration mismatch")
          script_text = script_text.replace("DeployCurveYieldVbUSDCYearn_v16", "DeployCurveYieldVbUSDCYearn_v17")
          new_script.write_text(script_text)
          old_script.unlink()
          old_instructions = root / "Deployment_Instructions_v16.md"
          new_instructions = root / "Deployment_Instructions_v17.md"
          if not old_instructions.is_file() or new_instructions.exists():
              raise SystemExit("Unexpected v16 deployment instructions state")
          instructions = old_instructions.read_text().replace("v16", "v17")
          instructions = instructions.replace("DeployCurveYieldVbUSDCYearn_v16", "DeployCurveYieldVbUSDCYearn_v17")
          section = (
              "## Foundry artifact access\n\n"
              "The deployment script loads the router's separately compiled 0.7.6 creation bytecode (router-istanbul compiler profile) with "
              "`vm.getCode`. Foundry file cheatcodes deny this read unless the output directory is explicitly "
              "permitted. This package grants read-only access to `./out` in `foundry.toml`; do not remove "
              "this permission or widen it to the project root.\n\n"
          )
          instructions = instructions.replace("## Build and deploy", section + "## Build and deploy", 1)
          instructions = instructions.replace(
              "forge build\n",
              "forge build --force\n"
              'if (!(Test-Path ".\\out\\CurveYieldSushiV3FeeRouter.sol\\CurveYieldSushiV3FeeRouter.json")) { throw "Router compiler artifact missing" }\n'
              '$routerArtifact = Get-Content ".\\out\\CurveYieldSushiV3FeeRouter.sol\\CurveYieldSushiV3FeeRouter.json" -Raw | ConvertFrom-Json\n'
              'if ([string]::IsNullOrWhiteSpace($routerArtifact.bytecode.object) -or $routerArtifact.bytecode.object -eq "0x") { throw "Router creation bytecode is empty" }\n',
              1
          )
          new_instructions.write_text(instructions)
          old_instructions.unlink()
          deployment_path = root / "audit-deployment.json"
          deployment = json.loads(deployment_path.read_text())
          deployment["scripts"][0]["entry"] = deployment["scripts"][0]["entry"].replace("_v16", "_v17")
          deployment["scripts"][0]["sha256"] = hashlib.sha256(new_script.read_bytes()).hexdigest()
          deployment_path.write_text(json.dumps(deployment, indent=2) + "\n")
          manifest["version"] = "v17"
          manifest["package"] = package
          manifest["singleDeploymentScript"] = "script/DeployCurveYieldVbUSDCYearn_v17.s.sol:DeployCurveYieldVbUSDCYearn_v17"
          manifest.setdefault("compilerConfiguration", {})["artifactAccess"] = "Foundry vm.getCode requires read-only fs_permissions for ./out"
          manifest["compilerConfiguration"]["routerProfile"] = "router-istanbul"
          manifest.setdefault("verification", {})["compilationRun"] = False
          manifest["verification"]["testsRun"] = False
          manifest["verification"]["broadcast"] = False
          manifest["files"] = {}
          for rel in sorted(p for p in manifest_path.parent.rglob("*") if p.is_file()):
              relative = rel.relative_to(root).as_posix()
              if relative in ("package_manifest_v16.json", "package_manifest_v17.json"):
                  continue
              if relative.startswith(("out/", "cache/", "broadcast/")) or "/out/" in relative or "/cache/" in relative:
                  continue
              sha, size = digest(rel)
              manifest["files"][relative] = {"sha256": sha, "sizeBytes": size}
          for rel, before in original_contract_hashes.items():
              if digest(root / rel)[0] != before:
                  raise SystemExit(f"Smart-contract source changed: {rel}")
          (root / "package_manifest_v17.json").write_text(json.dumps(manifest, indent=2) + "\n")
          manifest_path.unlink()
          output = work / "project-dir.txt"
          output.write_text(str(root))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"project_dir={root}\n")
          print(json.dumps({
              "package": package,
              "sourceFiles": len(manifest["files"]),
              "contractsUnchanged": len(original_contract_hashes),
              "foundryPermissions": 'fs_permissions = [{ access = "read", path = "./out" }]',
              "deploymentScript": manifest["singleDeploymentScript"]
          }, indent=2))
          PY

      - name: Install pinned Foundry compiler toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Compile package only (no tests, no broadcast)
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          forge --version
          forge build --force --build-info

      - name: Verify compiler outputs and finalize v17 manifest/ZIP
        id: package
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root = pathlib.Path(os.environ["PROJECT_DIR"])
          def sha(path):
              b = path.read_bytes()
              return hashlib.sha256(b).hexdigest(), len(b)
          infos = sorted((root / "out/build-info").glob("*.json"))
          if not infos:
              raise SystemExit("Foundry emitted no build-info")
          router_versions, script_versions, versions = [], [], set()
          for path in infos:
              data = json.loads(path.read_text())
              version = data.get("solcVersion") or data.get("solcLongVersion", "")
              versions.add(version.split("+")[0])
              sources = list((data.get("input") or {}).get("sources", {}))
              if any(s.endswith("CurveYieldSushiV3FeeRouter.sol") for s in sources):
                  router_versions.append(version)
              if any(s.endswith("DeployCurveYieldVbUSDCYearn_v17.s.sol") for s in sources):
                  script_versions.append(version)
          if not any(v.startswith("0.7.6") for v in router_versions):
              raise SystemExit(f"Router was not compiled with Solidity 0.7.6: {router_versions}")
          if not any(v.startswith("0.8.30") for v in script_versions):
              raise SystemExit(f"Deployment script was not compiled with Solidity 0.8.30: {script_versions}")
          artifacts = list((root / "out").rglob("CurveYieldSushiV3FeeRouter.json"))
          if len(artifacts) != 1:
              raise SystemExit(f"Expected one router artifact, found {len(artifacts)}")
          artifact = json.loads(artifacts[0].read_text())
          bytecode = ((artifact.get("bytecode") or {}).get("object") or "").removeprefix("0x")
          if not bytecode:
              raise SystemExit("Router creation bytecode is empty")
          manifest_path = root / "package_manifest_v17.json"
          manifest = json.loads(manifest_path.read_text())
          manifest["verification"]["compilationRun"] = True
          manifest["buildVerification"] = {
              "status": "PASS",
              "command": "forge build --force --build-info",
              "compilerVersions": sorted(v for v in versions if v),
              "routerCompiler": "0.7.6",
              "deploymentScriptCompiler": "0.8.30",
              "routerArtifact": artifacts[0].relative_to(root).as_posix(),
              "testsRun": False,
              "broadcast": False
          }
          manifest["files"] = {}
          for rel in sorted(p for p in root.rglob("*") if p.is_file()):
              relative = rel.relative_to(root).as_posix()
              if relative == "package_manifest_v17.json":
                  continue
              if relative.startswith(("out/", "cache/", "broadcast/")) or "/out/" in relative or "/cache/" in relative:
                  continue
              digest, size = sha(rel)
              manifest["files"][relative] = {"sha256": digest, "sizeBytes": size}
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "cyvbusdc_yearn_v3_1_0_strategy_stack_v17.zip"
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for rel in sorted(p for p in root.rglob("*") if p.is_file()):
                  relative = rel.relative_to(root).as_posix()
                  if relative.startswith(("out/", "cache/", "broadcast/")) or "/out/" in relative or "/cache/" in relative:
                      continue
                  info = zipfile.ZipInfo(f"{root.name}/{relative}", date_time=(2026, 10, 31, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  z.writestr(info, rel.read_bytes())
          with zipfile.ZipFile(output) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Final ZIP failed integrity check: {bad}")
              names = z.namelist()
              if not any(n.endswith("/foundry.toml") for n in names):
                  raise SystemExit("Final ZIP missing foundry.toml")
              if not any(n.endswith("/package_manifest_v17.json") for n in names):
                  raise SystemExit("Final ZIP missing v17 manifest")
          digest, size = sha(output)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"zip_sha256={digest}\nzip_size={size}\n")
          print(json.dumps({"zip": str(output), "sha256": digest, "sizeBytes": size, "compilerVersions": sorted(versions)}, indent=2))
          PY

      - name: Upload package build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyvbusdc-yearn-v17-package
          path: ${{ runner.temp }}/cyvbusdc_yearn_v3_1_0_strategy_stack_v17.zip
          if-no-files-found: error
          retention-days: 7

      - name: Publish v17 ZIP to Audit-Controller
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          EXPECTED_SHA256: ${{ steps.package.outputs.zip_sha256 }}
          EXPECTED_SIZE: ${{ steps.package.outputs.zip_size }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          cd .audit-controller
          git fetch origin main
          destination="campaigns/cyvbusdc_yearn_v3_1_0_strategy_stack_v17.zip"
          if git cat-file -e "origin/main:$destination" 2>/dev/null; then
            echo "::error::v17 package path already exists; refusing overwrite"
            exit 1
          fi
          cp "$RUNNER_TEMP/cyvbusdc_yearn_v3_1_0_strategy_stack_v17.zip" "$destination"
          git config user.name "CurveYield Package Builder"
          git config user.email "package-builder@users.noreply.github.com"
          git add -- "$destination"
          git commit -m "package(cyvbusdc): add v17 Foundry artifact-read fix"
          git push origin HEAD:main
          git fetch origin main
          git show "origin/main:$destination" > "$RUNNER_TEMP/v17-remote.zip"
          actual_sha="$(sha256sum "$RUNNER_TEMP/v17-remote.zip" | awk '{print $1}')"
          actual_size="$(stat -c '%s' "$RUNNER_TEMP/v17-remote.zip")"
          test "$actual_sha" = "$EXPECTED_SHA256"
          test "$actual_size" = "$EXPECTED_SIZE"
          echo "Published and verified $destination sha256=$actual_sha bytes=$actual_size"
