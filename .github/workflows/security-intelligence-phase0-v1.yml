          name: security-pipeline-stage-admit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-pipeline/fork_setup/input/admit
        continue-on-error: true
      - name: Retrieve original same-run source evidence
        id: source_evidence
        uses: actions/download-artifact@v4
        with:
          name: security-preflight-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-pipeline/fork_setup/input/preflight
        continue-on-error: true
      - name: Derive factual G2B source and native prerequisites
        id: native_plan
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/security-pipeline/fork_setup"
          mkdir -p "$base/input" "$base/native" "$base/report"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const dest=path.join(process.env.RUNNER_TEMP,'security-pipeline/fork_setup/input/RUN_IDENTITY_v1.json');
          fs.writeFileSync(dest,JSON.stringify({
            schemaVersion:'curveyield-security-pipeline-run-identity-v1',
            runId:process.env.GITHUB_RUN_ID,
            runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),
            workflowHeadSha:process.env.GITHUB_SHA,
            repository:process.env.GITHUB_REPOSITORY},null,2)+'\n');
          NODE

          node security-intelligence-phase0/scripts/security-pipeline-config-v1.mjs \
            --operation fork-plan --input-root "$base/input/preflight" \
            --output-root "$base/native" \
            --run-identity "$base/input/RUN_IDENTITY_v1.json"
      - name: Retrieve existing same-run admitted source ZIP only after independent fork approval
        id: original_admitted_source
        if: ${{ needs.admit.outputs.extended_approved == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: security-preflight-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-pipeline/fork_setup/input/restricted-source
      - name: Inspect original fork execution capability and exact source/funding gaps
        id: fork_native_inspect
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/security-pipeline/fork_setup"
          mkdir -p "$base/native" "$base/report"
          if [ ! -s "$base/input/admit/EXTENDED_MODE_DISPOSITION_v1.json" ]; then
            echo "::warning title=G2B.AUTHORITY_ARTIFACT_MISSING::Source-bound admission disposition absent from original same-run artifact"
          fi
          node security-intelligence-phase0/scripts/security-pipeline-fork-v1.mjs \
            --operation inspect \
            --plan "$base/native/FORK_EXECUTION_PLAN_v1.json" \
            --authority "$base/input/admit/EXTENDED_MODE_DISPOSITION_v1.json" \
            --source-manifest "$base/input/preflight/PREFLIGHT_MANIFEST_v1.json" \
            --run-identity "$base/input/RUN_IDENTITY_v1.json" \
            --output-root "$base/native"
      - name: Execute only independently authorized exact source deployment on restricted Anvil
        id: authorized_fork_native
        if: ${{ needs.admit.outputs.extended_approved == 'true' && steps.original_admitted_source.outcome == 'success' && steps.consumer_foundry_node_verify.outputs.usableForExecution == 'true' && steps.consumer_source_compilers_verify.outputs.usableForExecution == 'true' }}
        continue-on-error: true
        shell: bash
        env:
          MI_FORK_ETHEREUM_RPC_URL: ${{ secrets.MI_FORK_ETHEREUM_RPC_URL }}
          KATANA_FORK_RPC_URL: ${{ secrets.KATANA_FORK_RPC_URL }}
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/security-pipeline/fork_setup"
          mkdir -p "$base/private" "$base/native"
          node security-intelligence-phase0/scripts/security-pipeline-fork-v1.mjs \
            --operation execute \
            --plan "$base/native/FORK_EXECUTION_PLAN_v1.json" \
            --authority "$base/input/admit/EXTENDED_MODE_DISPOSITION_v1.json" \
            --source-manifest "$base/input/preflight/PREFLIGHT_MANIFEST_v1.json" \
            --run-identity "$base/input/RUN_IDENTITY_v1.json" \
            --source-zip "$base/input/restricted-source/source.zip" \
            --build-evidence "$base/input/preflight/PROJECT_READINESS_AUTOMATED_v1.json" \
            --toolkit-profile "$RUNNER_TEMP/security-pipeline/toolkit-profile/TOOLKIT_PROFILE_v1.json" \
            --toolkit-root "$base/consumer-toolkit/receipts" \
            --private-root "$base/private" --output-root "$base/native"
      - name: Record exact G2B missing native state without pretending execution
        if: ${{ always() }}
        shell: bash
        run: |
          base="$RUNNER_TEMP/security-pipeline/fork_setup"
          mkdir -p "$base/report"
          python3 security-intelligence-phase0/scripts/security-pipeline-verify-v1.py \
            --mode verify-stage --job fork_setup --stage G2B \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --native-result "$base/native/SECURITY_PIPELINE_CONFIG_RESULT_v1.json" \
            --input-root "$base/native" --report-root "$base/report"
      - name: Publish original safe C2 disposition (not fork-state bytes)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: security-pipeline-fork-c2-disposition-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-pipeline/fork_setup/native/FORK_NATIVE_STATE_v1.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish only non-secret G2B stage warnings and status
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: security-pipeline-stage-fork_setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-pipeline/fork_setup/report/
          if-no-files-found: warn
