name: CurveYield Security Intelligence — Standalone Phase 0 v1
run-name: security-preflight-${{ github.run_id }}
on:
  push:
    branches: [machine-intelligence-audit-controller-v1]
    paths:
      - 'security-intelligence-phase0/requests/active-request.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: security-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  admit:
    outputs:
      request_present: ${{ steps.request_present.outputs.request_present }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted standalone workflow and copied dependencies
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check whether an active request exists
        id: request_present
        shell: bash
        run: |
          if [ -f security-intelligence-phase0/requests/active-request.json ]; then
            echo 'request_present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'request_present=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Clean fork reset: no active source request; no audit started'
          fi
      - name: Admit source-bound request and download ZIP without running it
        if: ${{ steps.request_present.outputs.request_present == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?GitHub Actions read token unavailable}"
          mkdir -p .preflight-input
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source=JSON.parse(fs.readFileSync('security-intelligence-phase0/requests/active-request.json','utf8'));
          if(source.schemaVersion!=='curveyield-security-preflight-request-v1'||source.runMode!=='SOURCE_PREFLIGHT')throw Error('REQUEST_SCHEMA_OR_MODE_INVALID');
          if(typeof source.requestId!=='string'||!/^[a-zA-Z0-9._-]{6,100}$/.test(source.requestId))throw Error('REQUEST_ID_INVALID');
          const s=source.source??{};
          if(typeof s.repository!=='string'||!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(s.repository))throw Error('SOURCE_REPOSITORY_INVALID');
          if(typeof s.commit!=='string'||!/^[a-f0-9]{40}$/.test(s.commit))throw Error('SOURCE_COMMIT_UNPINNED');
          if(typeof s.archiveSha256!=='string'||!/^[a-f0-9]{64}$/.test(s.archiveSha256))throw Error('SOURCE_SHA_UNPINNED');
          if(typeof s.archivePath!=='string'||!s.archivePath.endsWith('.zip')||s.archivePath.length>512||
             s.archivePath.startsWith('/')||s.archivePath.includes('..')||s.archivePath.includes('\\')||s.archivePath.split('/').some(x=>!x))throw Error('SOURCE_ARCHIVE_PATH_INVALID');
          const adapted={schemaVersion:'curveyield-lite-phase0-intelligence-request-v1',
            requestId:source.requestId,campaignId:source.requestId,
            campaignGenerationId:'preflight-'+s.archiveSha256.slice(0,20),
            source:{repository:s.repository,commit:s.commit,archivePath:s.archivePath,archiveSha256:s.archiveSha256},
            destination:{repository:'curveyield3/Contract-Automation',ref:'machine-intelligence-audit-controller-v1',campaignPath:'security-intelligence-phase0'}};
          fs.writeFileSync('.preflight-input/request.json',JSON.stringify(adapted,null,2)+'\n');
          NODE
          repo="$(jq -er '.source.repository' .preflight-input/request.json)"
          commit="$(jq -er '.source.commit' .preflight-input/request.json)"
          rel="$(jq -er '.source.archivePath' .preflight-input/request.json)"
          expected="$(jq -er '.source.archiveSha256' .preflight-input/request.json)"
          encoded="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe="/"))' "$rel")"
          blob="$(gh api "repos/$repo/contents/$encoded?ref=$commit" --jq '.sha')"
          [[ "$blob" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SOURCE_GIT_BLOB_UNAVAILABLE"; exit 1; }
          gh api "repos/$repo/git/blobs/$blob" --jq '.content' | base64 -d > .preflight-input/source.zip
          test -s .preflight-input/source.zip
          test "$(sha256sum .preflight-input/source.zip | awk '{print $1}')" = "$expected"
          test "$(stat -c%s .preflight-input/source.zip)" -le 16777216
          unzip -tqq .preflight-input/source.zip
          # Parse source manifests as inert DATA, before any dependency download.
          python3 security-intelligence-phase0/scripts/source-toolchain-plan-v1.py \
            .preflight-input/source.zip .preflight-plan
          test "$(jq -er .sourceZipSha256 .preflight-plan/toolchain-plan.json)" = "$expected"
          echo "Exact ZIP and source-derived toolchain plan admitted; no source execution"
      - name: Hand off ZIP and non-secret request to isolated collector
        if: ${{ steps.request_present.outputs.request_present == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: security-preflight-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: .preflight-input/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

      - name: Publish data-only toolchain manifest independently of source ZIP
        if: ${{ steps.request_present.outputs.request_present == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: security-preflight-toolchain-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .preflight-plan/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  collect:
    needs: admit
    if: ${{ needs.admit.outputs.request_present == 'true' && needs.admit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout only trusted forked collection code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Receive only inert toolchain requirements before Docker build
        uses: actions/download-artifact@v4
        with:
          name: security-preflight-toolchain-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .preflight-plan
      - name: Bind toolchain plan to pinned admitted source digest
        shell: bash
        run: |
          set -euo pipefail
          test -s .preflight-plan/toolchain-plan.json
          jq -e '.schemaVersion=="curveyield-standalone-toolchain-plan-v1"
                 and (.sourceZipSha256 | test("^[0-9a-f]{64}$"))' \
                 .preflight-plan/toolchain-plan.json >/dev/null
      - name: Build source-blind isolated toolchain BEFORE downloading untrusted ZIP
        shell: bash
        run: |
          set -euo pipefail
          docker build --file security-intelligence-phase0/Dockerfile --tag curveyield-security-preflight:local .
      - name: Receive exact source artifact; no source credentials in collector job
        uses: actions/download-artifact@v4
        with:
          name: security-preflight-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: .preflight-input
      - name: Create writable output for sandboxed collection
        run: mkdir -p .preflight-output
      - name: Run copied compiler, Source Intelligence, inventory, Slither, Wake and Mythril in network-isolated sandbox
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 --memory 6g \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,size=3g,mode=1777 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.preflight-input,target=/input,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.preflight-plan,target=/toolchain-plan,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.preflight-output,target=/output" \
            --env SECURITY_PREFLIGHT_LOCAL_ARCHIVE=/input/source.zip \
            --env PHASE0_PRIVATE_BUILD_CACHE_ENABLED=false \
            --env SECURITY_PREFLIGHT_OFFLINE_COMPILERS=1 \
            --env ADR_DETECTION_POLICY=audit-detection-rebuild-v1 \
            --env CI=true --env HOME=/tmp \
            --env XDG_CACHE_HOME=/opt/preflight/.cache \
            --env VIRTUAL_ENV=/tmp \
            --workdir /opt/preflight \
            curveyield-security-preflight:local \
            node packages/github-native-sim/src/lite-solo-phase0-intelligence-v1.mjs \
              --request /input/request.json --output /output/evidence
      - name: Produce reader-facing discovery and cryptographic evidence index
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .preflight-output/evidence
          cp .preflight-plan/toolchain-plan.json .preflight-output/evidence/TOOLCHAIN_REQUIREMENTS_v1.json
          node security-intelligence-phase0/scripts/standalone-preflight-summary-v1.mjs \
            .preflight-output/evidence .preflight-input/request.json
          # Remove the untrusted, extracted working copy; upload only analytical evidence.
          rm -rf .preflight-output/evidence/work
      - name: Upload standalone preflight evidence (never source ZIP)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-preflight-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .preflight-output/evidence/*.json
            .preflight-output/evidence/*.md
          if-no-files-found: error
          retention-days: 14
      - name: Require source-bound inventory before claiming collection success
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s .preflight-output/evidence/PREFLIGHT_MANIFEST_v1.json
          # Wake must produce a real native evidence artifact, including explicit
          # zero-Solidity non-applicability; absence is never an all-clear.
          test -s .preflight-output/evidence/WAKE_v1.json
          # Mythril must retain per-contract runtime bytecode coverage and bounded symbolic results.
          test -s .preflight-output/evidence/MYTHRIL_v1.json
          # Source-only collection is a valid PARTIAL data handoff, never an
          # ABI, AST, Slither, Wake, Mythril, or security-coverage success claim.
          jq -e '.source.expectedSha256 == .source.observedSha256 and
                   .sourceAdmissionVerified == true and
                   (.status=="COLLECTED" or .status=="PARTIAL")' \
                   .preflight-output/evidence/PREFLIGHT_MANIFEST_v1.json >/dev/null
          if jq -e '.sourceOnly == true' .preflight-output/evidence/PREFLIGHT_MANIFEST_v1.json >/dev/null; then
            jq -e '.buildStatus=="UNAVAILABLE" and .status=="PARTIAL" and
                   .admittedSourceCount>0' \
                   .preflight-output/evidence/PREFLIGHT_MANIFEST_v1.json >/dev/null
            echo "::warning::Source-only structural inventory preserved; compilation and AST evidence unavailable"
          else
            jq -e '((.componentStatus=="COMPLETED" and .solidityUnitCount>0 and
                        (.unitResults|length)==.solidityUnitCount and
                        (.unitResults|all(.status=="COMPLETED"))) or
                       (.componentStatus=="NOT_APPLICABLE" and .solidityUnitCount==0))' \
              .preflight-output/evidence/WAKE_v1.json >/dev/null
            jq -e '((.componentStatus=="COMPLETED" and .eligibleCount>0 and
                        .completedCount==.eligibleCount and .failedCount==0 and
                        ([.contractResults[] | select(.status=="COMPLETED")]|length)==.eligibleCount) or
                       (.componentStatus=="NOT_APPLICABLE" and .eligibleCount==0 and
                        (.contractResults|length)==.sourceArtifactCount))' \
              .preflight-output/evidence/MYTHRIL_v1.json >/dev/null
            test -s .preflight-output/evidence/REVIEW_INVENTORY_v1.json
            jq -e --slurpfile inv .preflight-output/evidence/REVIEW_INVENTORY_v1.json '
              .buildStatus=="completed" and
              .sourceOnly==false and
              ($inv[0].payload.sourceUnits | type=="array") and
              ([$inv[0].payload.sourceUnits[] | select(.scopeTier=="IN_SCOPE")] | length>0) and
              (all($inv[0].payload.sourceUnits[];
                .scopeTier != "IN_SCOPE" or .astStatus == "AVAILABLE" or
                (. as $unit |
                  .astStatus == "UNSUPPORTED_LANGUAGE" and
                  (.path | endswith(".vy")) and
                  any($inv[0].payload.limitations[];
                    .code == "UNSUPPORTED_LANGUAGE_FILE_FALLBACK" and
                    .path == $unit.path)
                ) or
                (. as $unit |
                  .astStatus == "AVAILABLE_VYPER_AST" and
                  (.path | endswith(".vy")) and
                  any($inv[0].payload.limitations[];
                    .code == "VYPER_AST_STRUCTURAL_STATIC_ONLY" and
                    .path == $unit.path)
                )
              ))' .preflight-output/evidence/PREFLIGHT_MANIFEST_v1.json >/dev/null
            echo "Compiled source-bound evidence accepted with recorded limitations; no security verdict"
          fi

  formal:
    name: formal
    needs: [admit, collect]
    if: ${{ needs.admit.result == 'success' && needs.collect.result == 'success' && needs.admit.outputs.request_present == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
      actions: write
      id-token: write
    steps:
      - name: Checkout exact trusted formal dispatcher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read same-run original source artifact without unpacking
        uses: actions/download-artifact@v4
        with:
          name: security-preflight-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formal-source
      - name: Read same-run successful native scanner evidence
        uses: actions/download-artifact@v4
        with:
          name: security-preflight-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formal-evidence
      - name: Authenticate matching source and native build before I05.2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          base=Path(os.environ["RUNNER_TEMP"])
          request=json.loads(Path("security-intelligence-phase0/requests/active-request.json").read_text())
          admitted=json.loads((base/"formal-source/request.json").read_text())
          identity_file=base/"formal-evidence/BUILD_AND_SOURCE_IDENTITY_v1.json"
          manifest_file=base/"formal-evidence/PREFLIGHT_MANIFEST_v1.json"
          compiled_file=base/"formal-evidence/PHASE0_EXECUTION_BUILD_ARTIFACTS_v2.json"
          identity=json.loads(identity_file.read_text())
          manifest=json.loads(manifest_file.read_text())
          compiled=json.loads(compiled_file.read_text())
          source=request["source"]
          if (request.get("schemaVersion")!="curveyield-security-preflight-request-v1"
              or request.get("runMode")!="SOURCE_PREFLIGHT"
              or admitted.get("requestId")!=request.get("requestId")
              or admitted.get("source")!=source
              or identity.get("requestId")!=request.get("requestId")
              or identity.get("source",{}).get("archiveSha256")!=source["archiveSha256"]
              or identity.get("source",{}).get("archiveSha256Observed")!=source["archiveSha256"]
              or compiled.get("requestIdentity",{}).get("requestId")!=request.get("requestId")
              or any(compiled.get("source", {}).get(k)!=source[k] for k in ("repository","commit","archivePath","archiveSha256"))):
              raise SystemExit("FORMAL_INTAKE_IDENTITY_INVALID")
          source_zip=base/"formal-source/source.zip"
          if (not source_zip.is_file() or source_zip.stat().st_size>16*1024*1024
              or hashlib.sha256(source_zip.read_bytes()).hexdigest()!=source["archiveSha256"]):
              raise SystemExit("FORMAL_INTAKE_ZIP_HASH_MISMATCH")
          if (identity.get("status")!="PASS" or identity.get("build",{}).get("status")!="completed"
              or manifest.get("status")!="COLLECTED"
              or manifest.get("sourceAdmissionVerified") is not True
              or manifest.get("source",{}).get("observedSha256")!=source["archiveSha256"]
              or compiled.get("schemaVersion")!="curveyield-phase0-execution-build-artifacts-v2"
              or compiled.get("buildConfigurationDigestSha256")!=identity["build"].get("buildConfigurationDigestSha256")):
              raise SystemExit("FORMAL_INTAKE_NATIVE_SCANNER_NOT_ACCEPTED")
          hashes={entry["name"]:entry["sha256"] for entry in manifest.get("files",[])
                  if isinstance(entry,dict) and "name" in entry and "sha256" in entry}
          for name,path in (("BUILD_AND_SOURCE_IDENTITY_v1.json",identity_file),
                             ("PHASE0_EXECUTION_BUILD_ARTIFACTS_v2.json",compiled_file)):
              if hashlib.sha256(path.read_bytes()).hexdigest()!=hashes.get(name):
                  raise SystemExit("FORMAL_INTAKE_EVIDENCE_HASH_MISMATCH: "+name)
          dest=base/"formal-intake-v1.json"
          result={
              "status":"FORMAL_SAME_RUN_INTAKE_READY",
              "originRunId":int(os.environ["GITHUB_RUN_ID"]),
              "originRunAttempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "originCommit":os.environ["GITHUB_SHA"],
              "requestId":request["requestId"],
              "source":source,
              "compilationUnitCount":len(identity["build"].get("compilationUnits") or []),
              "compiledArtifactCount":len(compiled.get("artifacts") or []),
              "actualScannerEvidence":True,
              "sourceUnpacked":False,
              "nativeProverExecuted":False,
              "modelSessionStarted":False,
              "nextStep":"I05.2"
          }
          dest.write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps({k:v for k,v in result.items() if k!="source"},sort_keys=True))
          PY
          test -s "$RUNNER_TEMP/formal-intake-v1.json"
          echo 'Live formal job reached with exact same-run authenticated source and scanner evidence.' >> "$GITHUB_STEP_SUMMARY"
      - name: Dispatch existing exact-run pinned MiMo private inference
        id: mimo_dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GITHUB_REPOSITORY/branches/$GITHUB_REF_NAME" --jq '.commit.sha')"
          test "$latest" = "$GITHUB_SHA" || {
            echo "::error::Formal branch changed before exact-run private model dispatch"; exit 1;
          }
          title="CERTORA-QA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          runs_api="repos/$GITHUB_REPOSITORY/actions/workflows/lite-solo-ai-inference-v1.yml/runs?event=workflow_dispatch&per_page=100"
          existing="$(gh api "$runs_api" --jq ".workflow_runs | map(select(.display_title == \"$title\" and .head_sha == \"$GITHUB_SHA\")) | length")"
          test "$existing" -eq 0 || {
            echo "::error::Exactly matching MiMo workflow already exists; do not duplicate dispatch"; exit 1;
          }
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/lite-solo-ai-inference-v1.yml/dispatches" \
            -f "ref=$GITHUB_REF_NAME" \
            -f 'inputs[mode]=certora_qa' \
            -f "inputs[source_run_id]=$GITHUB_RUN_ID" \
            -f "inputs[source_run_attempt]=$GITHUB_RUN_ATTEMPT" \
            -f "inputs[source_head_sha]=$GITHUB_SHA" \
            -f 'inputs[inference_runners]=1' \
            -f 'inputs[submission_mode]=draft' >/dev/null
          discovered=''
          for attempt in $(seq 1 50); do
            matches="$(gh api "$runs_api" --jq ".workflow_runs | map(select(.display_title == \"$title\" and .head_sha == \"$GITHUB_SHA\" and .event == \"workflow_dispatch\"))")"
            count="$(jq 'length' <<< "$matches")"
            if [ "$count" -eq 1 ]; then
              discovered="$(jq -r '.[0].id' <<< "$matches")"
              break
            fi
            if [ "$count" -gt 1 ]; then
              echo "::error::Ambiguous exact-run MiMo workflow response"; exit 1
            fi
            sleep 5
          done
          [[ "$discovered" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::MiMo dispatch not found after bounded discovery"; exit 1;
          }
          echo "MIMO_RUN_ID=$discovered" >> "$GITHUB_ENV"
          echo "mimo_run_id=$discovered" >> "$GITHUB_OUTPUT"
          echo "Dispatched exact-run pinned MiMo private inference: $discovered"
      - name: Select Certora pinned Java 19
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '19'
      - name: Select upstream AutoProver Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore checked binary-only local Certora build cache
        id: cached_certora
        uses: actions/cache/restore@v4
        with:
          key: curve-certora-prover-4ef546d00cd67d333914845dead2d72081e1f014-jdk19-v1-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/curve-certora-formal/installed
            ${{ runner.temp }}/curve-certora-formal/python-venv
            ${{ runner.temp }}/curve-certora-formal/tool-bin
            ${{ runner.temp }}/curve-certora-formal/toolchain-bootstrap-v1.json
      - name: Rebuild pinned native Certora only on actual binary cache miss
        if: ${{ steps.cached_certora.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 security-intelligence-phase0/scripts/security-formal-v1.py prepare-toolchain \
            --work-dir "$RUNNER_TEMP/curve-certora-formal"
      - name: Save verified native build bytes before any model or source execution
        if: ${{ steps.cached_certora.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          key: curve-certora-prover-4ef546d00cd67d333914845dead2d72081e1f014-jdk19-v1-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/curve-certora-formal/installed
            ${{ runner.temp }}/curve-certora-formal/python-venv
            ${{ runner.temp }}/curve-certora-formal/tool-bin
            ${{ runner.temp }}/curve-certora-formal/toolchain-bootstrap-v1.json
      - name: Restore native solver packages and verify cached JAR and optimizer
        if: ${{ steps.cached_certora.outputs.cache-hit == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3 cvc5 llvm clang
          export PATH="$RUNNER_TEMP/curve-certora-formal/tool-bin:$PATH"
          python3 security-intelligence-phase0/scripts/security-formal-v1.py verify-native-cache \
            --work-dir "$RUNNER_TEMP/curve-certora-formal"
      - name: Install actual source-matched Solidity compiler binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 security-intelligence-phase0/scripts/security-formal-v1.py prepare-compilers \
            --work-dir "$RUNNER_TEMP/curve-certora-formal" \
            --identity "$RUNNER_TEMP/formal-evidence/BUILD_AND_SOURCE_IDENTITY_v1.json" \
            --requirements "$RUNNER_TEMP/formal-evidence/TOOLCHAIN_REQUIREMENTS_v1.json" \
            --artifacts "$RUNNER_TEMP/formal-evidence/PHASE0_EXECUTION_BUILD_ARTIFACTS_v2.json" \
            --request security-intelligence-phase0/requests/active-request.json
      - name: Admit verified ZIP into private scratch and map authentic targets
        shell: bash
        run: |
          set -euo pipefail
          python3 security-intelligence-phase0/scripts/security-formal-v1.py prepare-source-targets \
            --work-dir "$RUNNER_TEMP/formal-targets" \
            --source-zip "$RUNNER_TEMP/formal-source/source.zip" \
            --artifact-request "$RUNNER_TEMP/formal-source/request.json" \
            --request security-intelligence-phase0/requests/active-request.json \
            --manifest "$RUNNER_TEMP/formal-evidence/PREFLIGHT_MANIFEST_v1.json" \
            --identity "$RUNNER_TEMP/formal-evidence/BUILD_AND_SOURCE_IDENTITY_v1.json" \
            --artifacts "$RUNNER_TEMP/formal-evidence/PHASE0_EXECUTION_BUILD_ARTIFACTS_v2.json" \
            --native-toolchain "$RUNNER_TEMP/curve-certora-formal/toolchain-bootstrap-v1.json" \
            --native-compilers "$RUNNER_TEMP/curve-certora-formal/compiler-bootstrap-v1.json" \
            --preflight-run-id "$GITHUB_RUN_ID" \
            --preflight-head-sha "$GITHUB_SHA"
          jq -e '.status=="AUTHENTICATED_SOURCE_TARGETS_READY" and
                  (.eligible | length)>0 and
                  .noSourceAuthoredScriptsExecuted==true and .noSourceCompiledOrProved==true' \
            "$RUNNER_TEMP/formal-targets/target-map-v1.json" >/dev/null
      - name: Publish sanitized same-run formal readiness
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: certora-formal-intake-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formal-intake-v1.json
          if-no-files-found: error
          retention-days: 14
