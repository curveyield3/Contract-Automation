          node security-intelligence-phase0/scripts/security-pipeline-toolkit-v1.mjs \
            --operation restore-consumer --component foundry-node --profile "$RUNNER_TEMP/security-pipeline/toolkit-profile/TOOLKIT_PROFILE_v1.json" --run-identity "$RUNNER_TEMP/security-pipeline/fork_setup/consumer-toolkit/RUN_IDENTITY_v1.json" \
            --toolkit-root "$RUNNER_TEMP/security-pipeline/toolkit/foundry-node/payload" --output-root "$RUNNER_TEMP/security-pipeline/fork_setup/consumer-toolkit/foundry-node" \
            --consumer-job fork_setup --cache-hit "$CACHE_HIT" --restore-outcome "$RESTORE_OUTCOME" \
            --github-output "$GITHUB_OUTPUT" || true
