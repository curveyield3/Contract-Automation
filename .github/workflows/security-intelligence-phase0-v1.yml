name: CurveYield Security Intelligence — Standalone Phase 0 v1
run-name: security-preflight-${{ github.run_id }}
on:
  push:
    branches: [machine-intelligence-audit-controller-v1]
    paths:
      - 'security-intelligence-phase0/requests/active-request.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: security-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  admit:
    outputs:
      request_present: ${{ steps.request_present.outputs.request_present }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted standalone workflow and copied dependencies
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check whether an active request exists
        id: request_present
        shell: bash
        run: |
          if [ -f security-intelligence-phase0/requests/active-request.json ]; then
            echo 'request_present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'request_present=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Clean fork reset: no active source request; no audit started'
          fi
      - name: Admit source-bound request and download ZIP without running it
        if: ${{ steps.request_present.outputs.request_present == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?GitHub Actions read token unavailable}"
          mkdir -p .preflight-input
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source=JSON.parse(fs.readFileSync('security-intelligence-phase0/requests/active-request.json','utf8'));
          if(source.schemaVersion!=='curveyield-security-preflight-request-v1'||source.runMode!=='SOURCE_PREFLIGHT')throw Error('REQUEST_SCHEMA_OR_MODE_INVALID');
          if(typeof source.requestId!=='string'||!/^[a-zA-Z0-9._-]{6,100}$/.test(source.requestId))throw Error('REQUEST_ID_INVALID');
          const s=source.source??{};
          if(typeof s.repository!=='string'||!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(s.repository))throw Error('SOURCE_REPOSITORY_INVALID');
          if(typeof s.commit!=='string'||!/^[a-f0-9]{40}$/.test(s.commit))throw Error('SOURCE_COMMIT_UNPINNED');
          if(typeof s.archiveSha256!=='string'||!/^[a-f0-9]{64}$/.test(s.archiveSha256))throw Error('SOURCE_SHA_UNPINNED');
          if(typeof s.archivePath!=='string'||!s.archivePath.endsWith('.zip')||s.archivePath.length>512||
             s.archivePath.startsWith('/')||s.archivePath.includes('..')||s.archivePath.includes('\\')||s.archivePath.split('/').some(x=>!x))throw Error('SOURCE_ARCHIVE_PATH_INVALID');
          const adapted={schemaVersion:'curveyield-lite-phase0-intelligence-request-v1',
            requestId:source.requestId,campaignId:source.requestId,
            campaignGenerationId:'preflight-'+s.archiveSha256.slice(0,20),
            source:{repository:s.repository,commit:s.commit,archivePath:s.archivePath,archiveSha256:s.archiveSha256},
            destination:{repository:'curveyield3/Contract-Automation',ref:'machine-intelligence-audit-controller-v1',campaignPath:'security-intelligence-phase0'}};
          fs.writeFileSync('.preflight-input/request.json',JSON.stringify(adapted,null,2)+'\n');
          NODE
          repo="$(jq -er '.source.repository' .preflight-input/request.json)"
          commit="$(jq -er '.source.commit' .preflight-input/request.json)"
          rel="$(jq -er '.source.archivePath' .preflight-input/request.json)"
          expected="$(jq -er '.source.archiveSha256' .preflight-input/request.json)"
          encoded="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe="/"))' "$rel")"
          blob="$(gh api "repos/$repo/contents/$encoded?ref=$commit" --jq '.sha')"
          [[ "$blob" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SOURCE_GIT_BLOB_UNAVAILABLE"; exit 1; }
          gh api "repos/$repo/git/blobs/$blob" --jq '.content' | base64 -d > .preflight-input/source.zip
          test -s .preflight-input/source.zip
          test "$(sha256sum .preflight-input/source.zip | awk '{print $1}')" = "$expected"
          test "$(stat -c%s .preflight-input/source.zip)" -le 16777216
          unzip -tqq .preflight-input/source.zip
          # Parse source manifests as inert DATA, before any dependency download.
          python3 security-intelligence-phase0/scripts/source-toolchain-plan-v1.py \
            .preflight-input/source.zip .preflight-plan
          test "$(jq -er .sourceZipSha256 .preflight-plan/toolchain-plan.json)" = "$expected"
          echo "Exact ZIP and source-derived toolchain plan admitted; no source execution"
      - name: Hand off ZIP and non-secret request to isolated collector
        if: ${{ steps.request_present.outputs.request_present == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: security-preflight-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: .preflight-input/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

      - name: Publish data-only toolchain manifest independently of source ZIP
        if: ${{ steps.request_present.outputs.request_present == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: security-preflight-toolchain-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .preflight-plan/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  collect:
    needs: admit
    if: ${{ needs.admit.outputs.request_present == 'true' && needs.admit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout only trusted forked collection code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Receive only inert toolchain requirements before Docker build
        uses: actions/download-artifact@v4
        with:
          name: security-preflight-toolchain-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .preflight-plan
      - name: Bind toolchain plan to pinned admitted source digest
        shell: bash
        run: |
          set -euo pipefail
          test -s .preflight-plan/toolchain-plan.json
          jq -e '.schemaVersion=="curveyield-standalone-toolchain-plan-v1"
                 and (.sourceZipSha256 | test("^[0-9a-f]{64}$"))' \
                 .preflight-plan/toolchain-plan.json >/dev/null
      - name: Set up existing Docker build for source-blind scanner caching
        uses: docker/setup-buildx-action@v3
      - name: Restore or publish pinned Slither, Wake, Mythril, Semgrep and SMTChecker scanner layers
        uses: docker/build-push-action@v6
        with:
          context: .
          file: security-intelligence-phase0/Dockerfile
          target: phase0-scanner-tools
          load: true
          tags: curveyield-security-scanners:local
          cache-from: type=gha,scope=curve-security-scanners-v1
          cache-to: type=gha,scope=curve-security-scanners-v1,mode=max
          provenance: false
          sbom: false
      - name: Build source-blind isolated toolchain BEFORE downloading untrusted ZIP
        uses: docker/build-push-action@v6
        with:
          context: .
          file: security-intelligence-phase0/Dockerfile
          load: true
          tags: curveyield-security-preflight:local
          cache-from: type=gha,scope=curve-security-scanners-v1
          provenance: false
          sbom: false
      - name: Receive exact source artifact; no source credentials in collector job
        uses: actions/download-artifact@v4
        with:
          name: security-preflight-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: .preflight-input
      - name: Create writable output for sandboxed collection
        run: mkdir -p .preflight-output
      - name: Run copied compiler, Source Intelligence, inventory, Slither, Wake, Mythril, Semgrep and SMTChecker in network-isolated sandbox
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 --memory 6g \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,size=3g,mode=1777 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.preflight-input,target=/input,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.preflight-plan,target=/toolchain-plan,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.preflight-output,target=/output" \
            --env SECURITY_PREFLIGHT_LOCAL_ARCHIVE=/input/source.zip \
            --env PHASE0_PRIVATE_BUILD_CACHE_ENABLED=false \
            --env SECURITY_PREFLIGHT_OFFLINE_COMPILERS=1 \
            --env FOUNDRY_OFFLINE=true \
            --env ADR_DETECTION_POLICY=audit-detection-rebuild-v1 \
            --env CI=true --env HOME=/tmp \
            --env XDG_CACHE_HOME=/opt/preflight/.cache \
            --env VIRTUAL_ENV=/tmp \
            --workdir /opt/preflight \
            curveyield-security-preflight:local \
            sh -c 'ln -s /opt/preflight/.svm /tmp/.svm && exec node packages/github-native-sim/src/lite-solo-phase0-intelligence-v1.mjs --request /input/request.json --output /output/evidence'
      - name: Produce reader-facing discovery and cryptographic evidence index
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .preflight-output/evidence
          cp .preflight-plan/toolchain-plan.json .preflight-output/evidence/TOOLCHAIN_REQUIREMENTS_v1.json
          node security-intelligence-phase0/scripts/standalone-preflight-summary-v1.mjs \
            .preflight-output/evidence .preflight-input/request.json
          # Remove the untrusted, extracted working copy; upload only analytical evidence.
          rm -rf .preflight-output/evidence/work
      - name: Upload standalone preflight evidence (never source ZIP)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-preflight-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .preflight-output/evidence/*.json
            .preflight-output/evidence/*.md
          if-no-files-found: error
          retention-days: 14
      - name: Publish independent Semgrep remediation-review evidence
        if: ${{ always() && hashFiles('.preflight-output/semgrep-review/SEMGREP_v1.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: security-preflight-semgrep-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: .preflight-output/semgrep-review/SEMGREP_v1.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish independent SMTChecker correctness-review evidence
        if: ${{ always() && hashFiles('.preflight-output/smtchecker-review/SMTCHECKER_v1.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: security-preflight-smtchecker-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: .preflight-output/smtchecker-review/SMTCHECKER_v1.json
          if-no-files-found: error
          retention-days: 14
      - name: Require source-bound inventory before claiming collection success
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s .preflight-output/evidence/PREFLIGHT_MANIFEST_v1.json
          # Wake must produce a real native evidence artifact, including explicit
          # zero-Solidity non-applicability; absence is never an all-clear.
          test -s .preflight-output/evidence/WAKE_v1.json
          # Mythril must retain per-contract runtime bytecode coverage and bounded symbolic results.
          test -s .preflight-output/evidence/MYTHRIL_v1.json
          # Source-only collection is a valid PARTIAL data handoff, never an
          # ABI, AST, Slither, Wake, Mythril, or security-coverage success claim.
          jq -e '.source.expectedSha256 == .source.observedSha256 and
                   .sourceAdmissionVerified == true and
                   (.status=="COLLECTED" or .status=="COLLECTED_WITH_ANALYZER_LIMITATION" or .status=="PARTIAL")' \
                   .preflight-output/evidence/PREFLIGHT_MANIFEST_v1.json >/dev/null
          if jq -e '.sourceOnly == true' .preflight-output/evidence/PREFLIGHT_MANIFEST_v1.json >/dev/null; then
            jq -e '.buildStatus=="UNAVAILABLE" and .status=="PARTIAL" and
                   .admittedSourceCount>0' \
                   .preflight-output/evidence/PREFLIGHT_MANIFEST_v1.json >/dev/null
            echo "::warning::Source-only structural inventory preserved; compilation and AST evidence unavailable"
          else
            jq -e '((.componentStatus=="COMPLETED" and .solidityUnitCount>0 and
                        (.unitResults|length)==.solidityUnitCount and
                        (.unitResults|all(.status=="COMPLETED"))) or
                       (.componentStatus=="NOT_APPLICABLE" and .solidityUnitCount==0) or
                        (.componentStatus=="UNSUPPORTED_COMPILER" and .solidityUnitCount>0 and
                         (.unitResults|length)==.solidityUnitCount and
                         (.unitResults|all(.status=="UNSUPPORTED_COMPILER" and
                           .unsupportedReason=="WAKE_HARD_MIN_SOLC_0.6.2" and
                           .supportedMinimum=="0.6.2" and .exitCode==1))))' \
              .preflight-output/evidence/WAKE_v1.json >/dev/null
            jq -e '((.componentStatus=="COMPLETED" and .eligibleCount>0 and
                        .completedCount==.eligibleCount and .failedCount==0 and
                        ([.contractResults[] | select(.status=="COMPLETED")]|length)==.eligibleCount) or
                       (.componentStatus=="NOT_APPLICABLE" and .eligibleCount==0 and
                        (.contractResults|length)==.sourceArtifactCount))' \
              .preflight-output/evidence/MYTHRIL_v1.json >/dev/null
            test -s .preflight-output/evidence/REVIEW_INVENTORY_v1.json
            jq -e --slurpfile inv .preflight-output/evidence/REVIEW_INVENTORY_v1.json '
              .buildStatus=="completed" and
              .sourceOnly==false and
              ($inv[0].payload.sourceUnits | type=="array") and
              ([$inv[0].payload.sourceUnits[] | select(.scopeTier=="IN_SCOPE")] | length>0) and
              (all($inv[0].payload.sourceUnits[];
                .scopeTier != "IN_SCOPE" or .astStatus == "AVAILABLE" or
                (. as $unit |
                  .astStatus == "UNSUPPORTED_LANGUAGE" and
                  (.path | endswith(".vy")) and
                  any($inv[0].payload.limitations[];
                    .code == "UNSUPPORTED_LANGUAGE_FILE_FALLBACK" and
                    .path == $unit.path)
                ) or
                (. as $unit |
                  .astStatus == "AVAILABLE_VYPER_AST" and
                  (.path | endswith(".vy")) and
                  any($inv[0].payload.limitations[];
                    .code == "VYPER_AST_STRUCTURAL_STATIC_ONLY" and
                    .path == $unit.path)
                )
              ))' .preflight-output/evidence/PREFLIGHT_MANIFEST_v1.json >/dev/null
            echo "Compiled source-bound evidence accepted with recorded limitations; no security verdict"
          fi

