            "$RUNNER_TEMP/security-pipeline/fork_setup/consumer-toolkit/receipts/source-compilers/TOOLKIT_CACHE_COMPONENT_VERIFICATION_v1.json"
      - name: Read exact G0 independently admitted fork capability disposition
