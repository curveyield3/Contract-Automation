name: SMTChecker independent WASM installation qualification
on:
  push:
    branches: [mi-smtchecker-installation-qualification-v1]
    paths:
      - 'security-intelligence-phase0/requests/active-request.json'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build clean Phase 0 scanner layer with official integrity-pinned npm compilers
        uses: docker/build-push-action@v6
        with:
          context: .
          file: security-intelligence-phase0/Dockerfile
          target: phase0-scanner-tools
          load: true
          tags: curveyield-smt-wasm:qualification
          cache-from: type=gha,scope=curve-security-scanners-v1
          provenance: false
          sbom: false
      - name: Demonstrate actual proofs and invalid-assertion diagnostics without network or external solver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification
          for version in 0.8.28 0.8.30; do
            for engine in bmc chc; do
              docker run --rm -i --network none --read-only --cap-drop ALL \
                --security-opt no-new-privileges --pids-limit 128 --memory 3g \
                --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 \
                --env HOME=/tmp --env PATH=/usr/local/bin:/usr/bin:/bin --env LD_LIBRARY_PATH= \
                --workdir /opt/preflight curveyield-smt-wasm:qualification \
                node --input-type=commonjs - "$version" "$engine" <<'NODE' | tee "qualification/${version}-${engine}.json"
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const [version, engine] = process.argv.slice(2);
          const file = '/opt/preflight/smt-wasm/' + version + '.cjs';
          const compiler = require('solc/wrapper')(require(file));
          const actualVersion = compiler.version();
          if (!actualVersion.startsWith(version + '+commit.')) throw Error('Compiler version mismatch: ' + actualVersion);
          const source = 'pragma solidity ' + version + '; contract MathProbe { function valid(uint x) external pure { require(x == 7); assert(x + 1 == 8); } function invalid(uint x) external pure { require(x == 7); assert(x + 1 == 9); } }';
          const input = {language:'Solidity',sources:{'MathProbe.sol':{content:source}},settings:{modelChecker:{engine,solvers:['z3'],targets:['assert'],showProvedSafe:true,showUnproved:true,showUnsupported:true},outputSelection:{'*':{'*':['abi']}}}};
          const output = JSON.parse(compiler.compile(JSON.stringify(input)));
          const diagnostics = output.errors || [];
          const location = (diagnostic, assertion) => {
            const at = source.indexOf(assertion);
            const loc = diagnostic.sourceLocation;
            return loc?.file === 'MathProbe.sol' && loc.start <= at + assertion.length && loc.end >= at;
          };
          const label = engine.toUpperCase() + ':';
          const proved = diagnostics.some(d => d.message?.startsWith(label) && /assertion violation check is safe/i.test(d.message) && location(d,'assert(x + 1 == 8)'));
          const rejected = diagnostics.some(d => d.message?.startsWith(label) && /assertion violation happens here/i.test(d.message) && location(d,'assert(x + 1 == 9)'));
          const failed = diagnostics.some(d => d.severity === 'error' || /solver.*not available|analysis was not possible|could not be proved|might happen here/i.test(d.message || ''));
          const passed = proved && rejected && !failed;
          console.log(JSON.stringify({version:actualVersion,engine,sha256:crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex'),proved,rejected,passed,diagnostics},null,2));
          if (!passed) process.exitCode = 1;
          NODE
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smtchecker-wasm-qualification-v1
          path: qualification/
          if-no-files-found: warn
