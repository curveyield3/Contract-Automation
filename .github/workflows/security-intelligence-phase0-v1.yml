      - name: Verify original foundry-node bytes locally before native G2B
        id: consumer_foundry_node_verify
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          RESTORE_OUTCOME: ${{ steps.consumer_foundry_node_restore.outcome }}
          CACHE_HIT: ${{ steps.consumer_foundry_node_restore.outputs.cache-hit || 'false' }}
        run: |
