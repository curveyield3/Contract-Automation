name: CurveYield Security Intelligence — Standalone Phase 0 v1
run-name: security-preflight-${{ github.run_id }}
on:
  push:
    branches: [machine-intelligence-audit-controller-v1]
    paths:
      - 'security-intelligence-phase0/requests/active-request.json'
      # One-time I02.1 native bootstrap; remove at the I05.1 formal-job integration.
      - '.github/workflows/security-intelligence-phase0-v1.yml'
      - 'security-intelligence-phase0/scripts/security-formal-v1.py'
permissions:
  contents: read
  actions: read
concurrency:
  # Keep the I02-only compiler qualification from queueing behind an unintended
  # source rescanning push. The source scanner jobs and their logic are unchanged.
  group: >-
    security-preflight-${{ github.ref }}-${{ (github.event.head_commit.message == 'I02.2: qualify native Solidity compilers' || github.event.head_commit.message == 'I02.3: qualify source boundary' || (github.event.head_commit.message == 'I03.1: install upstream AutoProver' || (github.event.head_commit.message == 'FORMAL-QUALIFY: I03.2 register local MiMo provider' || (github.event.head_commit.message == 'FORMAL-QUALIFY: I03.3 enforce local MiMo response routing' || (github.event.head_commit.message == 'FORMAL-QUALIFY: I03.4 prepare local PostgreSQL RAG' || github.event.head_commit.message == 'FORMAL-QUALIFY: I04.1 authenticate source target mapping'))))) && 'formal-qualification' || 'source-scan' }}
  cancel-in-progress: false
jobs:
  admit:
    # Preserve source-scanner behavior; skip only the isolated I02.1 bootstrap commit.
    if: >-
      github.event.head_commit.message != 'I02.2: qualify native Solidity compilers' &&
      github.event.head_commit.message != 'I02.3: qualify source boundary' &&
      github.event.head_commit.message != 'I03.1: install upstream AutoProver' &&
      !startsWith(github.event.head_commit.message, 'FORMAL-QUALIFY:')
    outputs:
      request_present: ${{ steps.request_present.outputs.request_present }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted standalone workflow and copied dependencies
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check whether an active request exists
        id: request_present
        shell: bash
        run: |
          if [ -f security-intelligence-phase0/requests/active-request.json ]; then
            echo 'request_present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'request_present=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Clean fork reset: no active source request; no audit started'
          fi
      - name: Admit source-bound request and download ZIP without running it
        if: ${{ steps.request_present.outputs.request_present == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?GitHub Actions read token unavailable}"
          mkdir -p .preflight-input
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source=JSON.parse(fs.readFileSync('security-intelligence-phase0/requests/active-request.json','utf8'));
          if(source.schemaVersion!=='curveyield-security-preflight-request-v1'||source.runMode!=='SOURCE_PREFLIGHT')throw Error('REQUEST_SCHEMA_OR_MODE_INVALID');
          if(typeof source.requestId!=='string'||!/^[a-zA-Z0-9._-]{6,100}$/.test(source.requestId))throw Error('REQUEST_ID_INVALID');
          const s=source.source??{};
          if(typeof s.repository!=='string'||!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(s.repository))throw Error('SOURCE_REPOSITORY_INVALID');
          if(typeof s.commit!=='string'||!/^[a-f0-9]{40}$/.test(s.commit))throw Error('SOURCE_COMMIT_UNPINNED');
          if(typeof s.archiveSha256!=='string'||!/^[a-f0-9]{64}$/.test(s.archiveSha256))throw Error('SOURCE_SHA_UNPINNED');
          if(typeof s.archivePath!=='string'||!s.archivePath.endsWith('.zip')||s.archivePath.length>512||
             s.archivePath.startsWith('/')||s.archivePath.includes('..')||s.archivePath.includes('\\')||s.archivePath.split('/').some(x=>!x))throw Error('SOURCE_ARCHIVE_PATH_INVALID');
          const adapted={schemaVersion:'curveyield-lite-phase0-intelligence-request-v1',
            requestId:source.requestId,campaignId:source.requestId,
            campaignGenerationId:'preflight-'+s.archiveSha256.slice(0,20),
            source:{repository:s.repository,commit:s.commit,archivePath:s.archivePath,archiveSha256:s.archiveSha256},
            destination:{repository:'curveyield3/Contract-Automation',ref:'machine-intelligence-audit-controller-v1',campaignPath:'security-intelligence-phase0'}};
          fs.writeFileSync('.preflight-input/request.json',JSON.stringify(adapted,null,2)+'\n');
          NODE
          repo="$(jq -er '.source.repository' .preflight-input/request.json)"
          commit="$(jq -er '.source.commit' .preflight-input/request.json)"
          rel="$(jq -er '.source.archivePath' .preflight-input/request.json)"
          expected="$(jq -er '.source.archiveSha256' .preflight-input/request.json)"
          encoded="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe="/"))' "$rel")"
          blob="$(gh api "repos/$repo/contents/$encoded?ref=$commit" --jq '.sha')"
          [[ "$blob" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SOURCE_GIT_BLOB_UNAVAILABLE"; exit 1; }
          gh api "repos/$repo/git/blobs/$blob" --jq '.content' | base64 -d > .preflight-input/source.zip
          test -s .preflight-input/source.zip
          test "$(sha256sum .preflight-input/source.zip | awk '{print $1}')" = "$expected"
          test "$(stat -c%s .preflight-input/source.zip)" -le 16777216
          unzip -tqq .preflight-input/source.zip
          # Parse source manifests as inert DATA, before any dependency download.
          python3 security-intelligence-phase0/scripts/source-toolchain-plan-v1.py \
            .preflight-input/source.zip .preflight-plan
          test "$(jq -er .sourceZipSha256 .preflight-plan/toolchain-plan.json)" = "$expected"
          echo "Exact ZIP and source-derived toolchain plan admitted; no source execution"
      - name: Hand off ZIP and non-secret request to isolated collector
        if: ${{ steps.request_present.outputs.request_present == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: security-preflight-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: .preflight-input/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

      - name: Publish data-only toolchain manifest independently of source ZIP
        if: ${{ steps.request_present.outputs.request_present == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: security-preflight-toolchain-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .preflight-plan/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  collect:
    needs: admit
    if: ${{ needs.admit.outputs.request_present == 'true' && needs.admit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout only trusted forked collection code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Receive only inert toolchain requirements before Docker build
        uses: actions/download-artifact@v4
        with:
          name: security-preflight-toolchain-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .preflight-plan
      - name: Bind toolchain plan to pinned admitted source digest
        shell: bash
        run: |
          set -euo pipefail
          test -s .preflight-plan/toolchain-plan.json
          jq -e '.schemaVersion=="curveyield-standalone-toolchain-plan-v1"
                 and (.sourceZipSha256 | test("^[0-9a-f]{64}$"))' \
                 .preflight-plan/toolchain-plan.json >/dev/null
      - name: Build source-blind isolated toolchain BEFORE downloading untrusted ZIP
        shell: bash
        run: |
          set -euo pipefail
          docker build --file security-intelligence-phase0/Dockerfile --tag curveyield-security-preflight:local .
      - name: Receive exact source artifact; no source credentials in collector job
        uses: actions/download-artifact@v4
        with:
          name: security-preflight-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: .preflight-input
      - name: Create writable output for sandboxed collection
        run: mkdir -p .preflight-output
      - name: Run copied compiler, Source Intelligence, inventory, Slither, Wake and Mythril in network-isolated sandbox
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 --memory 6g \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,size=3g,mode=1777 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.preflight-input,target=/input,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.preflight-plan,target=/toolchain-plan,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.preflight-output,target=/output" \
            --env SECURITY_PREFLIGHT_LOCAL_ARCHIVE=/input/source.zip \
            --env PHASE0_PRIVATE_BUILD_CACHE_ENABLED=false \
            --env SECURITY_PREFLIGHT_OFFLINE_COMPILERS=1 \
            --env ADR_DETECTION_POLICY=audit-detection-rebuild-v1 \
            --env CI=true --env HOME=/tmp \
            --env XDG_CACHE_HOME=/opt/preflight/.cache \
            --env VIRTUAL_ENV=/tmp \
            --workdir /opt/preflight \
            curveyield-security-preflight:local \
            node packages/github-native-sim/src/lite-solo-phase0-intelligence-v1.mjs \
              --request /input/request.json --output /output/evidence
      - name: Produce reader-facing discovery and cryptographic evidence index
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .preflight-output/evidence
          cp .preflight-plan/toolchain-plan.json .preflight-output/evidence/TOOLCHAIN_REQUIREMENTS_v1.json
          node security-intelligence-phase0/scripts/standalone-preflight-summary-v1.mjs \
            .preflight-output/evidence .preflight-input/request.json
          # Remove the untrusted, extracted working copy; upload only analytical evidence.
          rm -rf .preflight-output/evidence/work
      - name: Upload standalone preflight evidence (never source ZIP)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-preflight-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .preflight-output/evidence/*.json
            .preflight-output/evidence/*.md
          if-no-files-found: error
          retention-days: 14
      - name: Require source-bound inventory before claiming collection success
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s .preflight-output/evidence/PREFLIGHT_MANIFEST_v1.json
          # Wake must produce a real native evidence artifact, including explicit
          # zero-Solidity non-applicability; absence is never an all-clear.
          test -s .preflight-output/evidence/WAKE_v1.json
          # Mythril must retain per-contract runtime bytecode coverage and bounded symbolic results.
          test -s .preflight-output/evidence/MYTHRIL_v1.json
          # Source-only collection is a valid PARTIAL data handoff, never an
          # ABI, AST, Slither, Wake, Mythril, or security-coverage success claim.
          jq -e '.source.expectedSha256 == .source.observedSha256 and
                   .sourceAdmissionVerified == true and
                   (.status=="COLLECTED" or .status=="PARTIAL")' \
                   .preflight-output/evidence/PREFLIGHT_MANIFEST_v1.json >/dev/null
          if jq -e '.sourceOnly == true' .preflight-output/evidence/PREFLIGHT_MANIFEST_v1.json >/dev/null; then
            jq -e '.buildStatus=="UNAVAILABLE" and .status=="PARTIAL" and
                   .admittedSourceCount>0' \
                   .preflight-output/evidence/PREFLIGHT_MANIFEST_v1.json >/dev/null
            echo "::warning::Source-only structural inventory preserved; compilation and AST evidence unavailable"
          else
            jq -e '((.componentStatus=="COMPLETED" and .solidityUnitCount>0 and
                        (.unitResults|length)==.solidityUnitCount and
                        (.unitResults|all(.status=="COMPLETED"))) or
                       (.componentStatus=="NOT_APPLICABLE" and .solidityUnitCount==0))' \
              .preflight-output/evidence/WAKE_v1.json >/dev/null
            jq -e '((.componentStatus=="COMPLETED" and .eligibleCount>0 and
                        .completedCount==.eligibleCount and .failedCount==0 and
                        ([.contractResults[] | select(.status=="COMPLETED")]|length)==.eligibleCount) or
                       (.componentStatus=="NOT_APPLICABLE" and .eligibleCount==0 and
                        (.contractResults|length)==.sourceArtifactCount))' \
              .preflight-output/evidence/MYTHRIL_v1.json >/dev/null
            test -s .preflight-output/evidence/REVIEW_INVENTORY_v1.json
            jq -e --slurpfile inv .preflight-output/evidence/REVIEW_INVENTORY_v1.json '
              .buildStatus=="completed" and
              .sourceOnly==false and
              ($inv[0].payload.sourceUnits | type=="array") and
              ([$inv[0].payload.sourceUnits[] | select(.scopeTier=="IN_SCOPE")] | length>0) and
              (all($inv[0].payload.sourceUnits[];
                .scopeTier != "IN_SCOPE" or .astStatus == "AVAILABLE" or
                (. as $unit |
                  .astStatus == "UNSUPPORTED_LANGUAGE" and
                  (.path | endswith(".vy")) and
                  any($inv[0].payload.limitations[];
                    .code == "UNSUPPORTED_LANGUAGE_FILE_FALLBACK" and
                    .path == $unit.path)
                ) or
                (. as $unit |
                  .astStatus == "AVAILABLE_VYPER_AST" and
                  (.path | endswith(".vy")) and
                  any($inv[0].payload.limitations[];
                    .code == "VYPER_AST_STRUCTURAL_STATIC_ONLY" and
                    .path == $unit.path)
                )
              ))' .preflight-output/evidence/PREFLIGHT_MANIFEST_v1.json >/dev/null
            echo "Compiled source-bound evidence accepted with recorded limitations; no security verdict"
          fi

  certora-bootstrap-i02:
    # I02.1-only native toolchain qualification, not the I05 formal-analysis job.
    if: >-
      github.event.head_commit.message == 'I02.2: qualify native Solidity compilers' ||
      github.event.head_commit.message == 'I02.3: qualify source boundary' ||
      github.event.head_commit.message == 'I03.1: install upstream AutoProver' ||
      github.event.head_commit.message == 'FORMAL-QUALIFY: I03.2 register local MiMo provider' ||
      github.event.head_commit.message == 'FORMAL-QUALIFY: I03.3 enforce local MiMo response routing' ||
      github.event.head_commit.message == 'FORMAL-QUALIFY: I03.4 prepare local PostgreSQL RAG' ||
      github.event.head_commit.message == 'FORMAL-QUALIFY: I04.1 authenticate source target mapping'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout exact trusted bootstrap revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download source-bound prior successful Phase 0 evidence (not source ZIP)
        if: >-
          github.event.head_commit.message == 'I02.2: qualify native Solidity compilers'
        uses: actions/download-artifact@v4
        with:
          repository: curveyield3/Contract-Automation
          run-id: 45144607076
          name: security-preflight-evidence-45144607076-1
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/certora-i02-evidence
      - name: Native source-bound Solidity compiler qualification
        if: >-
          github.event.head_commit.message == 'I02.2: qualify native Solidity compilers'
        shell: bash
        run: |
          set -euo pipefail
          python3 security-intelligence-phase0/scripts/security-formal-v1.py prepare-compilers \
            --work-dir "$RUNNER_TEMP/curve-certora-i02" \
            --identity "$RUNNER_TEMP/certora-i02-evidence/BUILD_AND_SOURCE_IDENTITY_v1.json" \
            --requirements "$RUNNER_TEMP/certora-i02-evidence/TOOLCHAIN_REQUIREMENTS_v1.json" \
            --artifacts "$RUNNER_TEMP/certora-i02-evidence/PHASE0_EXECUTION_BUILD_ARTIFACTS_v2.json" \
            --request security-intelligence-phase0/requests/active-request.json
      - name: Publish authenticated compiler qualification evidence
        if: >-
          always() && github.event.head_commit.message == 'I02.2: qualify native Solidity compilers'
        uses: actions/upload-artifact@v4
        with:
          name: certora-i02-compilers-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/curve-certora-i02/compiler-bootstrap-v1.json
          if-no-files-found: error
          retention-days: 7
      - name: Reopen accepted native Certora bootstrap receipt
        if: >-
          github.event.head_commit.message == 'I02.3: qualify source boundary'
        uses: actions/download-artifact@v4
        with:
          repository: curveyield3/Contract-Automation
          run-id: 45162422101
          name: certora-i02-bootstrap-45162422101-1
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/certora-i02-native
      - name: Reopen accepted native compiler qualification receipt
        if: >-
          github.event.head_commit.message == 'I02.3: qualify source boundary'
        uses: actions/download-artifact@v4
        with:
          repository: curveyield3/Contract-Automation
          run-id: 45166425004
          name: certora-i02-compilers-45166425004-1
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/certora-i02-native
      - name: Verify trusted source-boundary dispatcher before source admission
        if: >-
          github.event.head_commit.message == 'I02.3: qualify source boundary'
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.status=="LOCAL_TOOLCHAIN_STARTUP_VERIFIED" and .proverGitCommit=="4ef546d00cd67d333914845dead2d72081e1f014" and .cliHelpObserved==true' \
            "$RUNNER_TEMP/certora-i02-native/toolchain-bootstrap-v1.json" >/dev/null
          jq -e '.status=="COMPILER_TOOLCHAIN_VERIFIED" and .stage=="I02.2" and .noSourceZipRead==true' \
            "$RUNNER_TEMP/certora-i02-native/compiler-bootstrap-v1.json" >/dev/null
          python3 -m py_compile security-intelligence-phase0/scripts/security-formal-v1.py
          python3 security-intelligence-phase0/scripts/security-formal-v1.py --help >/dev/null
          test ! -e .preflight-input/source.zip
          echo 'I02.3 native dispatcher syntax/readiness and I02.1/I02.2 prerequisites observed.'
          echo 'No source ZIP loaded; authentic source admission remains required at I04/I05.'
      - name: Select pinned JDK 19 for local native Certora dependency
        if: >-
          github.event.head_commit.message == 'I03.1: install upstream AutoProver'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '19'
      - name: Select Python 3.12 required by upstream AutoProver
        if: >-
          github.event.head_commit.message == 'I03.1: install upstream AutoProver'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild exact pinned local Certora dependency in fresh runner
        if: >-
          github.event.head_commit.message == 'I03.1: install upstream AutoProver'
        shell: bash
        run: |
          set -euo pipefail
          python3 security-intelligence-phase0/scripts/security-formal-v1.py prepare-toolchain \
            --work-dir "$RUNNER_TEMP/curve-certora-i03"
      - name: Install pinned AutoProver with locked production dependencies and inspect native CLI
        if: >-
          github.event.head_commit.message == 'I03.1: install upstream AutoProver'
        shell: bash
        run: |
          set -euo pipefail
          python3 security-intelligence-phase0/scripts/security-formal-v1.py prepare-autoprover \
            --work-dir "$RUNNER_TEMP/curve-certora-i03"
      - name: Preserve exact I03.1 native GitHub qualification receipts
        if: >-
          always() && github.event.head_commit.message == 'I03.1: install upstream AutoProver'
        uses: actions/upload-artifact@v4
        with:
          name: certora-i03-autoprover-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/curve-certora-i03/toolchain-bootstrap-v1.json
            ${{ runner.temp }}/curve-certora-i03/autoprover-bootstrap-v1.json
          if-no-files-found: error
          retention-days: 14
      - name: Select upstream AutoProver Python 3.12 for I03.2 only
        if: >-
          github.event.head_commit.message == 'FORMAL-QUALIFY: I03.2 register local MiMo provider' ||
          github.event.head_commit.message == 'FORMAL-QUALIFY: I03.3 enforce local MiMo response routing' ||
          github.event.head_commit.message == 'FORMAL-QUALIFY: I03.4 prepare local PostgreSQL RAG'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned upstream AutoProver and register the exact local MiMo entry point
        if: >-
          github.event.head_commit.message == 'FORMAL-QUALIFY: I03.2 register local MiMo provider' ||
          github.event.head_commit.message == 'FORMAL-QUALIFY: I03.3 enforce local MiMo response routing' ||
          github.event.head_commit.message == 'FORMAL-QUALIFY: I03.4 prepare local PostgreSQL RAG'
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/autoprover-i032"
          python3 -m venv "$RUNNER_TEMP/uv-i032"
          "$RUNNER_TEMP/uv-i032/bin/pip" install --disable-pip-version-check 'uv==0.13.9'
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='url.https://github.com/.insteadOf'
          export GIT_CONFIG_VALUE_0='git@github.com:'
          git clone --filter=blob:none --no-checkout https://github.com/Certora/AutoProver.git "$source"
          git -C "$source" fetch --depth=1 origin 81d9626c249a70c0a0f0648a89de175443c0344c
          git -C "$source" checkout --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = '81d9626c249a70c0a0f0648a89de175443c0344c'
          git -C "$source" submodule update --init --recursive
          test "$(git -C "$source/graphcore" rev-parse HEAD)" = 'c03be3aa9c1cbad4f89dddd0bf2f784bbe77f4bc'
          (
            cd "$source"
            "$RUNNER_TEMP/uv-i032/bin/uv" sync --locked --no-dev --extra certora-cli --python "$(command -v python3)"
          )
          "$RUNNER_TEMP/uv-i032/bin/uv" pip install --python "$source/.venv/bin/python" --no-deps --editable \
            "$GITHUB_WORKSPACE/security-intelligence-phase0/formal-mimo-provider"
          "$source/.venv/bin/python" - <<'PY'
          import importlib.metadata
          import json
          from dataclasses import dataclass
          from composer.llm.registry import get_provider_for
          from curveyield_formal_mimo import MODEL_ID, MiMoModelProvider, MiMoService
          from composer.llm.provider import ProviderSpec

          @dataclass
          class Options:
              tokens: int = 1024
              thinking_tokens: int | None = None
              memory_tool: bool = False
              interleaved_thinking: bool = False

          entries = [entry for entry in importlib.metadata.entry_points(
              group="certora.autoprove.llm_provider") if entry.name == "curveyield-mimo"]
          if len(entries) != 1 or not isinstance(entries[0].load(), ProviderSpec):
              raise RuntimeError("Pinned upstream MiMo provider entry point not discoverable")
          provider = get_provider_for(model_name=MODEL_ID, options=Options())
          if not isinstance(provider, MiMoModelProvider):
              raise RuntimeError("Upstream provider registry did not select local MiMo")
          if not isinstance(provider.provider, MiMoService):
              raise RuntimeError("MiMo provider lacks real upstream ProviderService")
          if provider.model_name != MODEL_ID or provider.max_prompt_tokens <= 0:
              raise RuntimeError("Registered MiMo adapter has invalid identity/context")
          print(json.dumps({
              "status":"LOCAL_MIMO_PROVIDER_REGISTERED",
              "stage":"I03.2", "model":provider.model_name,
              "entryPoint":entries[0].value, "pythonRegistry":True,
              "upstreamProviderInterface":True, "nativeCertoraBuild":False,
              "modelInference":False, "externalProviderCalls":False,
              "realPrivateModelSessionDeferredTo":"I05.2"
          }, sort_keys=True))
          PY
      - name: Qualify heavy/lite, AutoSetup and strict local MiMo API contracts
        if: >-
          github.event.head_commit.message == 'FORMAL-QUALIFY: I03.3 enforce local MiMo response routing'
        shell: bash
        run: |
          set -euo pipefail
          # Shape-only adapter qualification; no Tailscale join or live model call.
          # Runtime I05.2 will replace this placeholder with verified rendezvous IP.
          export CURVEYIELD_MIMO_VERIFIED_TAILNET_IP=100.64.0.42
          export CURVEYIELD_MIMO_BASE_URL=http://100.64.0.42:8080/v1
          "$RUNNER_TEMP/autoprover-i032/.venv/bin/python" - <<'PY'
          import json
          from dataclasses import dataclass
          from pydantic import BaseModel
          from composer.llm.registry import get_provider_for
          from curveyield_formal_mimo import (
              MODEL_ID, MiMoModelProvider, configure_local_mimo_runtime,
              mimo_autoprover_model_args, validate_mimo_chat_completion,
          )

          @dataclass
          class Options:
              tokens: int = 1024
              thinking_tokens: int | None = None
              memory_tool: bool = False
              interleaved_thinking: bool = False

          class NativeSchema(BaseModel):
              status: str

          args = mimo_autoprover_model_args()
          if args != ["--heavy-model", MODEL_ID, "--lite-model", MODEL_ID]:
              raise RuntimeError("AutoProver heavy/lite are not both pinned to MiMo")
          provider = get_provider_for(model_name=MODEL_ID, options=Options())
          if not isinstance(provider, MiMoModelProvider):
              raise RuntimeError("Upstream registry selected non-MiMo provider")
          chat = provider.builder_for()
          if chat.use_responses_api is not False or chat.disable_streaming is not True:
              raise RuntimeError("MiMo is not pinned to non-streamed chat completions")
          if not chat.with_structured_output(NativeSchema, method="json_schema"):
              raise RuntimeError("Required upstream JSON Schema binding unavailable")
          tool = {
              "type": "function",
              "function": {
                  "name": "read_authorized_source",
                  "description": "A tool whose authority remains with AutoProver",
                  "parameters": {
                      "type": "object",
                      "properties": {"path": {"type": "string"}},
                      "required": ["path"],
                  },
              },
          }
          if not chat.bind_tools([tool]):
              raise RuntimeError("Native MiMo tool binding unavailable")
          request = {"model": MODEL_ID, "tools": [tool]}
          wire = {"model": MODEL_ID, "choices": [{
              "finish_reason": "tool_calls", "message": {
                  "role": "assistant", "content": None,
                  "tool_calls": [{"id": "call_local", "type": "function",
                                  "function": {"name": "read_authorized_source",
                                               "arguments": '{"path":"src/Vault.sol"}'}}],
              }}]}
          validate_mimo_chat_completion(wire, request)
          routed = configure_local_mimo_runtime()
          import certora_autosetup.utils.llm_util as autosetup
          if (routed["backend"] != "local" or routed["model"] != MODEL_ID
                  or autosetup._get_backend().value != "local"
                  or autosetup._local_call_structured.__name__ != "_strict_sync"
                  or autosetup._local_call_structured_async.__name__ != "_strict_async"):
              raise RuntimeError("AutoSetup not exclusively routed through strict MiMo")
          print(json.dumps({
              "status": "MIMO_ALL_CONSUMERS_ROUTED",
              "stage": "I03.3",
              "heavy": MODEL_ID, "lite": MODEL_ID,
              "autosetup": routed["model"],
              "jsonSchemaBinding": True,
              "strictAutoSetupSchemaWithoutFallback": True,
              "toolCallsRequireNativeAutoProverAuthority": True,
              "localPrivateURLShape": True,
              "liveInferenceVerified": False, "liveVerificationDeferredTo": "I05.2",
              "nativeCertoraBuild": False, "contractTests": False,
          }, sort_keys=True))
          PY
      - name: Prepare upstream PostgreSQL pgvector and genuine CVL RAG corpus
        if: >-
          github.event.head_commit.message == 'FORMAL-QUALIFY: I03.4 prepare local PostgreSQL RAG'
        shell: bash
        env:
          CERTORA_AI_COMPOSER_PGHOST: 127.0.0.1
          CERTORA_AI_COMPOSER_PGPORT: '5432'
          COMPOSER_EMBED_DEVICE: cpu
          UV_NO_DEV: '1'
          UV_LINK_MODE: copy
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/autoprover-i032"
          docs="$RUNNER_TEMP/certora-docs"
          docsenv="$RUNNER_TEMP/docs-env"
          pg="certora-rag-$GITHUB_RUN_ID"
          docker run --rm -d --name "$pg" \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=postgres --env POSTGRES_PASSWORD=postgres_admin_password \
            --mount "type=bind,source=$source/composer/scripts/init-db.sql,target=/docker-entrypoint-initdb.d/init-db.sql,readonly" \
            pgvector/pgvector:pg16 >/dev/null
          trap 'docker stop "$pg" >/dev/null 2>&1 || true' EXIT
          ready=false
          for iteration in $(seq 1 90); do
            if docker exec "$pg" pg_isready -U postgres -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          [ "$ready" = true ] || { docker logs "$pg" | tail -n 80; exit 1; }
          # The upstream Dockerfile prescribes CPU and ML RAG dependencies.
          # Do not install any dev/test or CUDA extras.
          (
            cd "$source"
            "$RUNNER_TEMP/uv-i032/bin/uv" sync --locked --no-dev \
              --extra certora-cli --extra cpu --extra ml --group ragbuild \
              --python "$(command -v python3)"
          )
          # Use upstream's own CVL-only Sphinx build (from its Dockerfile).
          git clone --depth=1 https://github.com/Certora/Documentation.git "$docs"
          python3 -m venv "$docsenv"
          "$docsenv/bin/pip" install --disable-pip-version-check -r "$docs/requirements.txt"
          cp "$docs/conf.py" "$docs/docs/cvl/conf.py"
          (
            cd "$docs/docs/cvl"
            "$docsenv/bin/sphinx-build" -M singlehtml . tmp
          )
          mkdir -p "$source/scripts/prover-docs"
          cp "$docs/docs/cvl/tmp/singlehtml/index.html" "$source/scripts/prover-docs/cvl.html"
          test -s "$source/scripts/prover-docs/cvl.html"
          (
            cd "$source"
            "$source/.venv/bin/python" -m composer.scripts.ragbuild \
              --output postgresql://rag_user:rag_password@127.0.0.1:5432/rag_db \
              "$source/scripts/prover-docs/cvl.html"
          )
          "$source/.venv/bin/python" - <<'PY'
          import asyncio
          import json
          import psycopg
          from composer.rag.db import PostgreSQLRAGDatabase, DEFAULT_CONNECTION
          from composer.rag.models import get_model

          async def read_upstream_rag():
              db = PostgreSQLRAGDatabase(DEFAULT_CONNECTION, get_model())
              try:
                  await db.test_connection()
              finally:
                  await db.aclose()

          asyncio.run(read_upstream_rag())
          with psycopg.connect("postgresql://rag_user:rag_password@127.0.0.1:5432/rag_db") as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT count(*) FROM rag.documents")
                  documents = cur.fetchone()[0]
                  cur.execute("SELECT count(*) FROM rag.manual_sections")
                  sections = cur.fetchone()[0]
                  cur.execute("SELECT count(*) FROM pg_indexes WHERE schemaname='rag' AND indexname='documents_embedding_idx'")
                  index_count = cur.fetchone()[0]
          if documents <= 0 or sections <= 0 or index_count != 1:
              raise RuntimeError("Upstream CVL corpus or pgvector index missing")
          print(json.dumps({
              "status": "LOCAL_AUTOPROVER_RAG_READY",
              "stage": "I03.4",
              "cvlDocuments": documents,
              "cvlManualSections": sections,
              "pgvectorIndex": True,
              "upstreamClientConnected": True,
              "dbHost": "127.0.0.1",
              "paidModelCalls": False,
              "certoraRebuilt": False,
              "realFormalRunnerMustRestoreDB": True,
          }, sort_keys=True))
          PY
