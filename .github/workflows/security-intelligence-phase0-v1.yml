name: CurveYield Security Intelligence — Standalone Phase 0 v1
run-name: security-preflight-${{ github.run_id }}
on:
  push:
    branches: [machine-intelligence-audit-controller-v1]
    paths:
      - 'security-intelligence-phase0/requests/active-request.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: security-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      extended_approved: ${{ steps.extended_disposition.outputs.extended_approved }}
      extended_requested: ${{ steps.extended_disposition.outputs.extended_requested }}
    steps:
      - name: Checkout trusted standalone workflow and copied dependencies
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Admit source-bound request and download ZIP without running it
        id: admit_native
        env:
          GH_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?AUDIT_CONTROLLER_GITHUB_TOKEN secret is required to read source repository}"
          mkdir -p .preflight-input
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source=JSON.parse(fs.readFileSync('security-intelligence-phase0/requests/active-request.json','utf8'));
          if(source.schemaVersion!=='curveyield-security-preflight-request-v1'||source.runMode!=='SOURCE_PREFLIGHT')throw Error('REQUEST_SCHEMA_OR_MODE_INVALID');
          if(typeof source.requestId!=='string'||!/^[a-zA-Z0-9._-]{6,100}$/.test(source.requestId))throw Error('REQUEST_ID_INVALID');
          const s=source.source??{};
          if(typeof s.repository!=='string'||!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(s.repository))throw Error('SOURCE_REPOSITORY_INVALID');
          if(typeof s.commit!=='string'||!/^[a-f0-9]{40}$/.test(s.commit))throw Error('SOURCE_COMMIT_UNPINNED');
          if(typeof s.archiveSha256!=='string'||!/^[a-f0-9]{64}$/.test(s.archiveSha256))throw Error('SOURCE_SHA_UNPINNED');
          if(typeof s.archivePath!=='string'||!s.archivePath.endsWith('.zip')||s.archivePath.length>512||
             s.archivePath.startsWith('/')||s.archivePath.includes('..')||s.archivePath.includes('\\')||s.archivePath.split('/').some(x=>!x))throw Error('SOURCE_ARCHIVE_PATH_INVALID');
          const adapted={schemaVersion:'curveyield-lite-phase0-intelligence-request-v1',
            requestId:source.requestId,campaignId:source.requestId,
            campaignGenerationId:'preflight-'+s.archiveSha256.slice(0,20),
            source:{repository:s.repository,commit:s.commit,archivePath:s.archivePath,archiveSha256:s.archiveSha256},
            destination:{repository:'curveyield3/Contract-Automation',ref:'machine-intelligence-audit-controller-v1',campaignPath:'security-intelligence-phase0'}};
          fs.writeFileSync('.preflight-input/request.json',JSON.stringify(adapted,null,2)+'\n');
          NODE
          repo="$(jq -er '.source.repository' .preflight-input/request.json)"
          commit="$(jq -er '.source.commit' .preflight-input/request.json)"
          rel="$(jq -er '.source.archivePath' .preflight-input/request.json)"
          expected="$(jq -er '.source.archiveSha256' .preflight-input/request.json)"
          encoded="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe="/"))' "$rel")"
          blob="$(gh api "repos/$repo/contents/$encoded?ref=$commit" --jq '.sha')"
          [[ "$blob" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SOURCE_GIT_BLOB_UNAVAILABLE"; exit 1; }
          gh api "repos/$repo/git/blobs/$blob" --jq '.content' | base64 -d > .preflight-input/source.zip
          test -s .preflight-input/source.zip
          test "$(sha256sum .preflight-input/source.zip | awk '{print $1}')" = "$expected"
          test "$(stat -c%s .preflight-input/source.zip)" -le 16777216
          unzip -tqq .preflight-input/source.zip
          # Parse source manifests as inert DATA, before any dependency download.
          python3 security-intelligence-phase0/scripts/source-toolchain-plan-v1.py \
            .preflight-input/source.zip .preflight-plan
          test "$(jq -er .sourceZipSha256 .preflight-plan/toolchain-plan.json)" = "$expected"
          echo "Exact ZIP and source-derived toolchain plan admitted; no source execution"
      - name: Decide optional extended pipeline from verified original source
        id: extended_disposition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/security-pipeline/admit/report"
          python3 security-intelligence-phase0/scripts/security-pipeline-verify-v1.py \
            --mode admit-extended --job admit --stage ADMIT \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --request-file security-intelligence-phase0/requests/active-request.json \
            --source-zip .preflight-input/source.zip \
            --toolchain-plan .preflight-plan/toolchain-plan.json \
            --report-root "$RUNNER_TEMP/security-pipeline/admit/report" \
            --github-output "$GITHUB_OUTPUT"
      - name: Hand off ZIP and non-secret request to isolated collector
        uses: actions/upload-artifact@v4
        with:
          name: security-preflight-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: .preflight-input/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

      - name: Publish data-only toolchain manifest independently of source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: security-preflight-toolchain-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .preflight-plan/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
      - name: Summarize admission diagnostics
        if: ${{ always() }}
        shell: bash
        env:
          ADMISSION_OUTCOME: ${{ steps.admit_native.outcome }}
          EXTENDED_DISPOSITION_OUTCOME: ${{ steps.extended_disposition.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/security-pipeline/admit/report"
          python3 security-intelligence-phase0/scripts/security-pipeline-verify-v1.py \
            --mode summarize-job --job admit --stage ADMIT \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --report-root "$RUNNER_TEMP/security-pipeline/admit/report" \
            --native-outcome "$ADMISSION_OUTCOME" \
            --summary-outcome "$EXTENDED_DISPOSITION_OUTCOME"
      - name: Upload admission warning part
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: security-pipeline-stage-admit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-pipeline/admit/report/
          if-no-files-found: warn
          retention-days: 14

  collect:
    needs: admit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout only trusted forked collection code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Receive only inert toolchain requirements before Docker build
        uses: actions/download-artifact@v4
        with:
          name: security-preflight-toolchain-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .preflight-plan
      - name: Bind toolchain plan to pinned admitted source digest
        shell: bash
        run: |
          set -euo pipefail
          test -s .preflight-plan/toolchain-plan.json
          jq -e '.schemaVersion=="curveyield-standalone-toolchain-plan-v1"
                 and (.sourceZipSha256 | test("^[0-9a-f]{64}$"))' \
                 .preflight-plan/toolchain-plan.json >/dev/null
      - name: Build source-blind isolated toolchain BEFORE downloading untrusted ZIP
        shell: bash
        run: |
          set -euo pipefail
          docker build --file security-intelligence-phase0/Dockerfile --tag curveyield-security-preflight:local .
      - name: Receive exact source artifact; no source credentials in collector job
        uses: actions/download-artifact@v4
        with:
          name: security-preflight-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: .preflight-input
      - name: Create writable output for sandboxed collection
        run: mkdir -p .preflight-output
      - name: Run copied compiler, Source Intelligence, inventory and Slither in network-isolated sandbox
        id: collect_native
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 --memory 6g \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,size=3g,mode=1777 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.preflight-input,target=/input,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.preflight-plan,target=/toolchain-plan,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.preflight-output,target=/output" \
            --env SECURITY_PREFLIGHT_LOCAL_ARCHIVE=/input/source.zip \
            --env PHASE0_PRIVATE_BUILD_CACHE_ENABLED=false \
            --env SECURITY_PREFLIGHT_OFFLINE_COMPILERS=1 \
            --env CI=true --env HOME=/opt/preflight \
            --env VIRTUAL_ENV=/tmp \
            --workdir /opt/preflight \
            curveyield-security-preflight:local \
            node packages/github-native-sim/src/lite-solo-phase0-intelligence-v1.mjs \
              --request /input/request.json --output /output/evidence
      - name: Produce reader-facing discovery and cryptographic evidence index
        id: preflight_summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .preflight-output/evidence
          cp .preflight-plan/toolchain-plan.json .preflight-output/evidence/TOOLCHAIN_REQUIREMENTS_v1.json
          node security-intelligence-phase0/scripts/standalone-preflight-summary-v1.mjs \
            .preflight-output/evidence .preflight-input/request.json
          # Remove the untrusted, extracted working copy; upload only analytical evidence.
          rm -rf .preflight-output/evidence/work
      - name: Upload standalone preflight evidence (never source ZIP)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-preflight-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .preflight-output/evidence/*.json
            .preflight-output/evidence/*.md
          if-no-files-found: error
          retention-days: 14
      - name: Require source-bound inventory before claiming collection success
        id: inventory_acceptance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s .preflight-output/evidence/PREFLIGHT_MANIFEST_v1.json
          # Source-only collection is a valid PARTIAL data handoff, never an
          # ABI, AST, Slither, or security-coverage success claim.
          jq -e '.source.expectedSha256 == .source.observedSha256 and
                   .sourceAdmissionVerified == true and
                   (.status=="COLLECTED" or .status=="PARTIAL")' \
                   .preflight-output/evidence/PREFLIGHT_MANIFEST_v1.json >/dev/null
          if jq -e '.sourceOnly == true' .preflight-output/evidence/PREFLIGHT_MANIFEST_v1.json >/dev/null; then
            jq -e '.buildStatus=="UNAVAILABLE" and .status=="PARTIAL" and
                   .admittedSourceCount>0' \
                   .preflight-output/evidence/PREFLIGHT_MANIFEST_v1.json >/dev/null
            echo "::warning::Source-only structural inventory preserved; compilation and AST evidence unavailable"
          else
            test -s .preflight-output/evidence/REVIEW_INVENTORY_v1.json
            jq -e --slurpfile inv .preflight-output/evidence/REVIEW_INVENTORY_v1.json '
              .buildStatus=="completed" and
              .sourceOnly==false and
              ($inv[0].payload.sourceUnits | type=="array") and
              ([$inv[0].payload.sourceUnits[] | select(.scopeTier=="IN_SCOPE")] | length>0) and
              (all($inv[0].payload.sourceUnits[];
                .scopeTier != "IN_SCOPE" or .astStatus == "AVAILABLE" or
                (. as $unit |
                  .astStatus == "UNSUPPORTED_LANGUAGE" and
                  (.path | endswith(".vy")) and
                  any($inv[0].payload.limitations[];
                    .code == "UNSUPPORTED_LANGUAGE_FILE_FALLBACK" and
                    .path == $unit.path)
                ) or
                (. as $unit |
                  .astStatus == "AVAILABLE_VYPER_AST" and
                  (.path | endswith(".vy")) and
                  any($inv[0].payload.limitations[];
                    .code == "VYPER_AST_STRUCTURAL_STATIC_ONLY" and
                    .path == $unit.path)
                )
              ))' .preflight-output/evidence/PREFLIGHT_MANIFEST_v1.json >/dev/null
            if jq -e '.status=="PARTIAL"' .preflight-output/evidence/PREFLIGHT_MANIFEST_v1.json >/dev/null; then
              echo "::warning::Phase 0 has named coverage gaps (Vyper semantics, ABI origins or compilation). See PREFLIGHT_MANIFEST_v1.json and DISCOVERY_SUMMARY_v1.md in the published artifact."
            else
              echo "Compiled source-bound evidence collected; standalone audit-gate review still required"
            fi
          fi
      - name: Summarize original collection and exact limitations
        if: ${{ always() }}
        shell: bash
        env:
          COLLECT_NATIVE_OUTCOME: ${{ steps.collect_native.outcome }}
          SOURCE_SUMMARY_OUTCOME: ${{ steps.preflight_summary.outcome }}
          INVENTORY_ACCEPTANCE_OUTCOME: ${{ steps.inventory_acceptance.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/security-pipeline/collect/report"
          python3 security-intelligence-phase0/scripts/security-pipeline-verify-v1.py \
            --mode summarize-job --job collect --stage COLLECT \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --input-root "$GITHUB_WORKSPACE/.preflight-output/evidence" \
            --report-root "$RUNNER_TEMP/security-pipeline/collect/report" \
            --native-outcome "$COLLECT_NATIVE_OUTCOME" \
            --summary-outcome "$SOURCE_SUMMARY_OUTCOME" \
            --inventory-outcome "$INVENTORY_ACCEPTANCE_OUTCOME"
      - name: Upload collection warning part
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: security-pipeline-stage-collect-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-pipeline/collect/report/
          if-no-files-found: warn
          retention-days: 14


  prepare_targets:
    needs: [admit, collect]
    if: ${{ always() && !cancelled() && needs.admit.outputs.extended_requested == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact immutable pipeline v1 implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin original toolkit adapter Node runtime to major 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download original same-attempt preflight evidence
        id: original_preflight
        uses: actions/download-artifact@v4
        with:
          name: security-preflight-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-pipeline/prepare_targets/input/preflight
        continue-on-error: true
      - name: Create trusted run identity from GitHub event context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/security-pipeline/prepare_targets/input" \
                   "$RUNNER_TEMP/security-pipeline/prepare_targets/target-config" \
                   "$RUNNER_TEMP/security-pipeline/prepare_targets/toolkit-config" \
                   "$RUNNER_TEMP/security-pipeline/prepare_targets/report"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const identity={
            schemaVersion:'curveyield-security-pipeline-run-identity-v1',
            runId:process.env.GITHUB_RUN_ID,
            runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),
            workflowHeadSha:process.env.GITHUB_SHA,
            repository:process.env.GITHUB_REPOSITORY
          };
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'security-pipeline/prepare_targets/input/RUN_IDENTITY_v1.json'),
            JSON.stringify(identity,null,2)+'\n',{mode:0o600});
          NODE
      - name: Construct source-bound target, build and compatibility records
        id: target_config
        continue-on-error: true
        shell: bash
        run: |
          node security-intelligence-phase0/scripts/security-pipeline-config-v1.mjs \
            --operation enumerate-targets \
            --input-root "$RUNNER_TEMP/security-pipeline/prepare_targets/input/preflight" \
            --output-root "$RUNNER_TEMP/security-pipeline/prepare_targets/target-config" \
            --run-identity "$RUNNER_TEMP/security-pipeline/prepare_targets/input/RUN_IDENTITY_v1.json"
      - name: Record exact G0 G1 G2 source-bound target statuses
        if: ${{ always() }}
        shell: bash
        env:
          TARGET_CONFIG_OUTCOME: ${{ steps.target_config.outcome }}
          ORIGINAL_PREFLIGHT_OUTCOME: ${{ steps.original_preflight.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/security-pipeline/prepare_targets/report"
          python3 security-intelligence-phase0/scripts/security-pipeline-verify-v1.py \
            --mode verify-stage --job prepare_targets --stage G0 \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --native-result "$RUNNER_TEMP/security-pipeline/prepare_targets/target-config/SECURITY_PIPELINE_CONFIG_RESULT_v1.json" \
            --input-root "$RUNNER_TEMP/security-pipeline/prepare_targets/target-config" \
            --report-root "$RUNNER_TEMP/security-pipeline/prepare_targets/report"
      - name: Project current tool requirements to a safe non-authoritative profile
        id: toolkit_profile
        continue-on-error: true
        shell: bash
        run: |
          node security-intelligence-phase0/scripts/security-pipeline-config-v1.mjs \
            --operation toolkit-profile \
            --input-root "$RUNNER_TEMP/security-pipeline/prepare_targets/target-config" \
            --output-root "$RUNNER_TEMP/security-pipeline/prepare_targets/toolkit-config" \
            --run-identity "$RUNNER_TEMP/security-pipeline/prepare_targets/input/RUN_IDENTITY_v1.json"
      - name: Upload only stage status and sanitized warning part
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: security-pipeline-stage-prepare_targets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-pipeline/prepare_targets/report/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload non-executable toolkit profile metadata
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: security-pipeline-toolkit-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-pipeline/prepare_targets/toolkit-config/TOOLKIT_PROFILE_v1.json
          if-no-files-found: warn
          retention-days: 14


  toolkit_prepare:
    needs: [admit, prepare_targets]
    if: ${{ always() && !cancelled() && needs.admit.outputs.extended_requested == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        component:
          - foundry-node
          - source-compilers
          - slither-storage
          - medusa
          - wake
          - mythril
          - certora-prover
          - autoprover
          - mimo-runtime
          - mimo-weights
    steps:
      - name: Checkout immutable current-run toolkit source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin original toolkit adapter Node runtime to major 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact same-run non-executable profile metadata
        id: profile_download
        uses: actions/download-artifact@v4
        with:
          name: security-pipeline-toolkit-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-pipeline/toolkit-profile
        continue-on-error: true
      - name: Establish fixed component-local directories and run context
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/security-pipeline/toolkit/$COMPONENT/run" \
                   "$RUNNER_TEMP/security-pipeline/toolkit/$COMPONENT/safe" \
                   "$RUNNER_TEMP/security-pipeline/toolkit/$COMPONENT/report"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const dir=path.join(process.env.RUNNER_TEMP,'security-pipeline','toolkit',process.env.COMPONENT,'run');
          fs.writeFileSync(path.join(dir,'RUN_IDENTITY_v1.json'),JSON.stringify({
            schemaVersion:'curveyield-security-pipeline-run-identity-v1',
            runId:process.env.GITHUB_RUN_ID,
            runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),
            workflowHeadSha:process.env.GITHUB_SHA,
            repository:process.env.GITHUB_REPOSITORY
          },null,2)+'\n',{mode:0o600});
          NODE
      - name: Plan component-only cache identity and trusted pin
        id: tool_plan
        continue-on-error: true
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          node security-intelligence-phase0/scripts/security-pipeline-toolkit-v1.mjs \
            --operation plan --component "$COMPONENT" \
            --profile "$RUNNER_TEMP/security-pipeline/toolkit-profile/TOOLKIT_PROFILE_v1.json" \
            --run-identity "$RUNNER_TEMP/security-pipeline/toolkit/$COMPONENT/run/RUN_IDENTITY_v1.json" \
            --toolkit-root "$RUNNER_TEMP/security-pipeline/toolkit/$COMPONENT/payload" \
            --output-root "$RUNNER_TEMP/security-pipeline/toolkit/$COMPONENT/safe" \
            --github-output "$GITHUB_OUTPUT"
      - name: Restore only exact approved component cache key
        id: cache_restore
        if: ${{ steps.tool_plan.outputs.provisionable == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.tool_plan.outputs.cache_path }}
          key: ${{ steps.tool_plan.outputs.cache_key }}
      - name: Provision original trusted software bytes on exact cache miss
        id: cache_provision
        if: ${{ steps.tool_plan.outputs.provisionable == 'true' && steps.cache_restore.outcome == 'success' && steps.cache_restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          RESTORE_OUTCOME: ${{ steps.cache_restore.outcome }}
          RESTORED: ${{ steps.cache_restore.outputs.cache-hit || 'false' }}
        run: |
          node security-intelligence-phase0/scripts/security-pipeline-toolkit-v1.mjs \
            --operation provision --cache-hit "$RESTORED" --restore-outcome "$RESTORE_OUTCOME" --component "$COMPONENT" \
            --profile "$RUNNER_TEMP/security-pipeline/toolkit-profile/TOOLKIT_PROFILE_v1.json" \
            --run-identity "$RUNNER_TEMP/security-pipeline/toolkit/$COMPONENT/run/RUN_IDENTITY_v1.json" \
            --toolkit-root "$RUNNER_TEMP/security-pipeline/toolkit/$COMPONENT/payload" \
            --output-root "$RUNNER_TEMP/security-pipeline/toolkit/$COMPONENT/safe"
      - name: Inspect exact restored component without executing it
        id: tool_prepare
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          RESTORED: ${{ steps.cache_restore.outputs.cache-hit || 'false' }}
          RESTORE_OUTCOME: ${{ steps.cache_restore.outcome }}
        run: |
          node security-intelligence-phase0/scripts/security-pipeline-toolkit-v1.mjs \
            --operation inspect --component "$COMPONENT" \
            --profile "$RUNNER_TEMP/security-pipeline/toolkit-profile/TOOLKIT_PROFILE_v1.json" \
            --run-identity "$RUNNER_TEMP/security-pipeline/toolkit/$COMPONENT/run/RUN_IDENTITY_v1.json" \
            --toolkit-root "$RUNNER_TEMP/security-pipeline/toolkit/$COMPONENT/payload" \
            --output-root "$RUNNER_TEMP/security-pipeline/toolkit/$COMPONENT/safe" \
            --cache-hit "$RESTORED" --restore-outcome "$RESTORE_OUTCOME"
      - name: Independently verify original component bytes and publish exact warning
        id: tool_verify
        if: ${{ always() }}
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          python3 security-intelligence-phase0/scripts/security-pipeline-verify-v1.py \
            --mode verify-toolkit-component --job toolkit_prepare --stage G2T \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --component "$COMPONENT" \
            --profile "$RUNNER_TEMP/security-pipeline/toolkit/$COMPONENT/safe/TOOLKIT_CACHE_COMPONENT_METRICS_v1.json" \
            --toolkit-root "$RUNNER_TEMP/security-pipeline/toolkit/$COMPONENT/payload" \
            --report-root "$RUNNER_TEMP/security-pipeline/toolkit/$COMPONENT/report" \
            --github-output "$GITHUB_OUTPUT"
      - name: Save a new independently verified cache only
        id: cache_save
        if: ${{ steps.cache_restore.outcome == 'success' && steps.cache_restore.outputs.cache-hit != 'true' && steps.tool_verify.outputs.usableForExecution == 'true' && steps.tool_plan.outputs.provisionable == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.tool_plan.outputs.cache_path }}
          key: ${{ steps.tool_plan.outputs.cache_key }}
      - name: Finalize only observed cache save outcome and original component metrics
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          RESTORED: ${{ steps.cache_restore.outputs.cache-hit || 'false' }}
          RESTORE_OUTCOME: ${{ steps.cache_restore.outcome }}
          CACHE_SAVE_OUTCOME: ${{ steps.cache_save.outcome }}
        run: |
          node security-intelligence-phase0/scripts/security-pipeline-toolkit-v1.mjs \
            --operation finalize --component "$COMPONENT" \
            --profile "$RUNNER_TEMP/security-pipeline/toolkit-profile/TOOLKIT_PROFILE_v1.json" \
            --run-identity "$RUNNER_TEMP/security-pipeline/toolkit/$COMPONENT/run/RUN_IDENTITY_v1.json" \
            --toolkit-root "$RUNNER_TEMP/security-pipeline/toolkit/$COMPONENT/payload" \
            --output-root "$RUNNER_TEMP/security-pipeline/toolkit/$COMPONENT/safe" \
            --cache-hit "$RESTORED" --restore-outcome "$RESTORE_OUTCOME"
      - name: Publish component metrics, original restore result and warning part
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: security-pipeline-stage-toolkit_prepare-${{ matrix.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-pipeline/toolkit/${{ matrix.component }}/report/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload digest-only component metadata, never cache binaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: security-pipeline-toolkit-component-${{ matrix.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/security-pipeline/toolkit/${{ matrix.component }}/safe/TOOLKIT_CACHE_COMPONENT_IDENTITY_v1.json
            ${{ runner.temp }}/security-pipeline/toolkit/${{ matrix.component }}/safe/TOOLKIT_CACHE_COMPONENT_METRICS_v1.json
          if-no-files-found: warn
          retention-days: 14

  toolkit_qualify:
    needs: [admit, toolkit_prepare]
    if: ${{ always() && !cancelled() && needs.admit.outputs.extended_requested == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact toolkit qualification implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download original same-run component metadata census
        id: component_metadata
        uses: actions/download-artifact@v4
        with:
          pattern: security-pipeline-toolkit-component-*-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: false
          path: ${{ runner.temp }}/security-pipeline/toolkit-qualify/input
        continue-on-error: true
      - name: Download original byte verifier receipts for all ten components
        id: component_verification_receipts
        uses: actions/download-artifact@v4
        with:
          pattern: security-pipeline-stage-toolkit_prepare-*-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: false
          path: ${{ runner.temp }}/security-pipeline/toolkit-qualify/input/stage-verifications
        continue-on-error: true
      - name: Enumerate ten independently verified or missing component states
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/security-pipeline/toolkit-qualify/report"
          python3 security-intelligence-phase0/scripts/security-pipeline-verify-v1.py \
            --mode summarize-job --job toolkit_qualify --stage G2T \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --native-outcome "${{ needs.toolkit_prepare.result }}" \
            --input-root "$RUNNER_TEMP/security-pipeline/toolkit-qualify/input" \
            --report-root "$RUNNER_TEMP/security-pipeline/toolkit-qualify/report"
      - name: Upload aggregate toolkit qualification and exact warnings
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: security-pipeline-stage-toolkit_qualify-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-pipeline/toolkit-qualify/report/
          if-no-files-found: warn
          retention-days: 14

  mimo_configure:
    needs: [admit, collect, prepare_targets, toolkit_qualify]
    if: ${{ always() && !cancelled() && needs.admit.outputs.extended_requested == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout current-run immutable code and original MiMo pin source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Receive exact admitted source-intelligence evidence
        id: mimo_source
        uses: actions/download-artifact@v4
        with:
          name: security-preflight-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-pipeline/mimo/input/preflight
        continue-on-error: true
      - name: Receive exact non-secret extended-mode disposition
        id: mimo_authority
        uses: actions/download-artifact@v4
        with:
          name: security-pipeline-stage-admit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-pipeline/mimo/input/admit
        continue-on-error: true
      - name: Create same-run identity and enumerate G2A targets
        id: mimo_plan
        continue-on-error: true
        shell: bash
        run: |
          base="$RUNNER_TEMP/security-pipeline/mimo"
          mkdir -p "$base/input" "$base/plan" "$base/targets" "$base/report" "$base/private"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'security-pipeline/mimo/input/RUN_IDENTITY_v1.json'),
            JSON.stringify({schemaVersion:'curveyield-security-pipeline-run-identity-v1',
              runId:process.env.GITHUB_RUN_ID,runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),
              workflowHeadSha:process.env.GITHUB_SHA,repository:process.env.GITHUB_REPOSITORY},null,2)+'\n');
          NODE
          node security-intelligence-phase0/scripts/security-pipeline-config-v1.mjs \
            --operation enumerate-targets --input-root "$base/input/preflight" \
            --output-root "$base/plan" --run-identity "$base/input/RUN_IDENTITY_v1.json"
      - name: Resolve model and runtime pins from the installed MiMo workflow
        id: mimo_pins
        if: ${{ needs.admit.outputs.extended_approved == 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source=fs.readFileSync('.github/workflows/lite-solo-ai-inference-v1.yml','utf8');
          for(const [key,pat] of Object.entries({
            LLAMA_SHA:'[a-f0-9]{40}',MODEL_SHA256:'[a-f0-9]{64}',
            MODEL_REVISION:'[a-f0-9]{40}',MODEL_FILE:'[A-Za-z0-9._-]+'
          })){
            const matches=[...source.matchAll(new RegExp('^\\s*'+key+':\\s*('+pat+')\\s*$','gm'))];
            if(matches.length!==1)throw Error('PIN_NOT_UNIQUE:'+key);
            fs.appendFileSync(process.env.GITHUB_ENV,key+'='+matches[0][1]+'\n');
          }
          NODE
      - name: Download same-run source-bound software profile for MiMo reuse
        id: mimo_component_profile
        if: ${{ needs.admit.outputs.extended_approved == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: security-pipeline-toolkit-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-pipeline/toolkit-profile
        continue-on-error: true
      - name: Derive exact pinned MiMo GGUF cache key independently
        id: mimo_cache_plan
        if: ${{ steps.mimo_component_profile.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          node security-intelligence-phase0/scripts/security-pipeline-toolkit-v1.mjs \
            --operation plan --component mimo-weights \
            --profile "$RUNNER_TEMP/security-pipeline/toolkit-profile/TOOLKIT_PROFILE_v1.json" \
            --run-identity "$RUNNER_TEMP/security-pipeline/mimo/input/RUN_IDENTITY_v1.json" \
            --toolkit-root "$RUNNER_TEMP/security-pipeline/toolkit/mimo-weights/payload" \
            --output-root "$RUNNER_TEMP/security-pipeline/mimo/component-meta" \
            --github-output "$GITHUB_OUTPUT"
      - name: Restore exact MiMo GGUF cache (never accept a prefix key)
        id: mimo_cache_restore
        if: ${{ steps.mimo_cache_plan.outputs.provisionable == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.mimo_cache_plan.outputs.cache_path }}
          key: ${{ steps.mimo_cache_plan.outputs.cache_key }}
      - name: Independently check restored MiMo bytes against original source pin
        id: mimo_cached_bytes
        if: ${{ steps.mimo_cache_restore.outputs.cache-hit == 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          node security-intelligence-phase0/scripts/security-pipeline-toolkit-v1.mjs \
            --operation restore-consumer --component mimo-weights \
            --profile "$RUNNER_TEMP/security-pipeline/toolkit-profile/TOOLKIT_PROFILE_v1.json" \
            --run-identity "$RUNNER_TEMP/security-pipeline/mimo/input/RUN_IDENTITY_v1.json" \
            --toolkit-root "$RUNNER_TEMP/security-pipeline/toolkit/mimo-weights/payload" \
            --output-root "$RUNNER_TEMP/security-pipeline/mimo/component-meta" \
            --cache-hit true --restore-outcome success
          python3 security-intelligence-phase0/scripts/security-pipeline-verify-v1.py \
            --mode verify-toolkit-component --job mimo_configure --stage G2A \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --component mimo-weights \
            --profile "$RUNNER_TEMP/security-pipeline/mimo/component-meta/TOOLKIT_CACHE_COMPONENT_METRICS_v1.json" \
            --toolkit-root "$RUNNER_TEMP/security-pipeline/toolkit/mimo-weights/payload" \
            --report-root "$RUNNER_TEMP/security-pipeline/mimo/report" \
            --github-output "$GITHUB_OUTPUT"
      - name: Independently plan original pinned MiMo CPU runtime cache
        id: mimo_runtime_plan
        continue-on-error: true
        shell: bash
        run: |
          node security-intelligence-phase0/scripts/security-pipeline-toolkit-v1.mjs \
            --operation plan --component mimo-runtime \
            --profile "$RUNNER_TEMP/security-pipeline/toolkit-profile/TOOLKIT_PROFILE_v1.json" \
            --run-identity "$RUNNER_TEMP/security-pipeline/mimo/input/RUN_IDENTITY_v1.json" \
            --toolkit-root "$RUNNER_TEMP/security-pipeline/toolkit/mimo-runtime/payload" \
            --output-root "$RUNNER_TEMP/security-pipeline/mimo/component-runtime-meta" \
            --consumer-job mimo_configure --github-output "$GITHUB_OUTPUT"
      - name: Restore exact previously qualified MiMo CPU runtime bytes
        id: mimo_runtime_restore
        if: ${{ steps.mimo_runtime_plan.outputs.provisionable == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.mimo_runtime_plan.outputs.cache_path }}
          key: ${{ steps.mimo_runtime_plan.outputs.cache_key }}
      - name: Independently verify MiMo CPU runtime before local inference
        id: mimo_runtime_verify
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          CACHE_HIT: ${{ steps.mimo_runtime_restore.outputs.cache-hit || 'false' }}
          RESTORE_OUTCOME: ${{ steps.mimo_runtime_restore.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/security-pipeline/mimo/component-runtime-meta" "$RUNNER_TEMP/security-pipeline/mimo/report"
          node security-intelligence-phase0/scripts/security-pipeline-toolkit-v1.mjs \
            --operation restore-consumer --component mimo-runtime \
            --profile "$RUNNER_TEMP/security-pipeline/toolkit-profile/TOOLKIT_PROFILE_v1.json" \
            --run-identity "$RUNNER_TEMP/security-pipeline/mimo/input/RUN_IDENTITY_v1.json" \
            --toolkit-root "$RUNNER_TEMP/security-pipeline/toolkit/mimo-runtime/payload" \
            --output-root "$RUNNER_TEMP/security-pipeline/mimo/component-runtime-meta" \
            --consumer-job mimo_configure --cache-hit "$CACHE_HIT" \
            --restore-outcome "$RESTORE_OUTCOME" --github-output "$GITHUB_OUTPUT" || true
          python3 security-intelligence-phase0/scripts/security-pipeline-verify-v1.py \
            --mode verify-toolkit-component --job mimo_configure --stage G2A \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --component mimo-runtime \
            --profile "$RUNNER_TEMP/security-pipeline/mimo/component-runtime-meta/TOOLKIT_CACHE_COMPONENT_METRICS_v1.json" \
            --toolkit-root "$RUNNER_TEMP/security-pipeline/toolkit/mimo-runtime/payload" \
            --report-root "$RUNNER_TEMP/security-pipeline/mimo/report" \
            --github-output "$GITHUB_OUTPUT"
      - name: Use only independently verified pinned CPU llama-server and original GGUF
        id: mimo_prepare
        if: ${{ steps.mimo_pins.outcome == 'success' && steps.mimo_runtime_verify.outputs.usableForExecution == 'true' && needs.admit.outputs.extended_approved == 'true' }}
        continue-on-error: true
        shell: bash
        env:
          PINNED_CACHE_VERIFIED: ${{ steps.mimo_cached_bytes.outputs.usableForExecution || 'false' }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/security-pipeline/mimo"
          # U07: never rebuild another unauthenticated executable after U06
          # independently verified the original, pinned cached ELF bytes.
          runtime="$RUNNER_TEMP/security-pipeline/toolkit/mimo-runtime/payload"
          manifest="$runtime/TOOLKIT_CACHE_COMPONENT_MANIFEST_v1.json"
          original="$runtime/llama-server"
          expected="$(jq -r '.components[] | select(.componentId == "mimo-runtime") | .expectedBinarySha256 // empty' "$RUNNER_TEMP/security-pipeline/toolkit-profile/TOOLKIT_PROFILE_v1.json")"
          [[ "$expected" =~ ^[a-f0-9]{64}$ ]] || {
            echo "::warning::G2A.RUNTIME_ORIGINAL_BINARY_PIN_UNAVAILABLE expected independently qualified llama-server SHA256; observed missing"; exit 1;
          }
          test -f "$original" && test ! -L "$original" && test -f "$manifest"
          jq -e --arg rev "$LLAMA_SHA" --arg sha "$expected" \
            '.schemaVersion == "curveyield-toolkit-component-manifest-v1" and .sourceRevision == $rev and .originalExpectedBinarySha256 == $sha' \
            "$manifest" >/dev/null
          printf '%s  %s\n' "$expected" "$original" | sha256sum --check
          mkdir -p "$root/llama-build/bin" "$root/models"
          install -m 0700 "$original" "$root/llama-build/bin/llama-server"
          printf '%s  %s\n' "$expected" "$root/llama-build/bin/llama-server" | sha256sum --check
          cached="$RUNNER_TEMP/security-pipeline/toolkit/mimo-weights/payload/$MODEL_FILE"
          if [ "$PINNED_CACHE_VERIFIED" = true ] && [ -f "$cached" ]; then
            ln "$cached" "$root/models/$MODEL_FILE" || cp "$cached" "$root/models/$MODEL_FILE"
          else
            curl -fL --retry 3 --retry-all-errors -o "$root/models/$MODEL_FILE" \
              "https://huggingface.co/bartowski/MiMo-V2.6-Distill-Qwen-9B-GGUF/resolve/$MODEL_REVISION/$MODEL_FILE"
          fi
          printf '%s  %s\n' "$MODEL_SHA256" "$root/models/$MODEL_FILE" | sha256sum --check
          available="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
          model_bytes="$(stat -c%s "$root/models/$MODEL_FILE")"
          test "$available" -gt "$((model_bytes/1024+1048576))" || {
            echo "::warning::G2A.INSUFFICIENT_MODEL_RAM: observed availableKiB=$available and GGUFBytes=$model_bytes; required GGUF plus 1GiB"; exit 1;
          }
      - name: Start and health-check verified job-local MiMo on localhost
        id: mimo_server
        if: ${{ steps.mimo_prepare.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/security-pipeline/mimo"
          "$root/llama-build/bin/llama-server" --model "$root/models/$MODEL_FILE" \
            --alias lite-solo-mimo-v1 --host 127.0.0.1 --port 8080 \
            --ctx-size 4096 --cache-type-k q4_0 --cache-type-v q4_0 --flash-attn on \
            --threads 4 --parallel 1 --n-gpu-layers 0 > "$root/private/server.log" 2>&1 &
          echo "$!" > "$root/input/server.pid"
          for i in $(seq 1 36); do
            kill -0 "$(cat "$root/input/server.pid")" || break
            if curl -fsS --max-time 2 http://127.0.0.1:8080/health > "$root/private/health.json"; then
              exit 0
            fi
            sleep 5
          done
          echo "::warning::G2A.MODEL_SERVER_START: local 127.0.0.1:8080 did not report healthy before 180s"
          exit 1
      - name: Generate a bounded source-bound objective and proposal per compiled target
        id: mimo_rounds
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          MODEL_APPROVED: ${{ needs.admit.outputs.extended_approved }}
          MODEL_STATUS: ${{ steps.mimo_server.outcome }}
          PREP_STATUS: ${{ steps.mimo_prepare.outcome }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/security-pipeline/mimo"
          plan="$root/plan/SECURITY_TARGET_PLAN_v1.json"
          if [ ! -s "$plan" ]; then
            echo "::warning::G2A.TARGET_PLAN_MISSING: no exact source-bound plan from this run"
            exit 0
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'security-pipeline/mimo/input/model-unavailable.json'),
            JSON.stringify({configurationField:'toolkit.mimo-runtime_and_mimo-weights',
              expected:'approved, verified MiMo CPU runtime and exact model bytes',
              observed:{approved:process.env.MODEL_APPROVED,
                modelStatus:process.env.MODEL_STATUS,prepareStatus:process.env.PREP_STATUS},
              requiredCorrection:'Restore independent source-bound inference authority and pinned native model checks'},null,2)+'\n');
          NODE
          deadline="$(($(date +%s)+9600))"
          jq -r '.targets[] | select(.compilationStatus=="EXACT_COMPILER_ARTIFACT" and .sourceBound==true) | .targetId' "$plan" \
            > "$root/input/targets.txt"
          while IFS= read -r target; do
            [[ "$target" =~ ^TARGET-[a-f0-9]{32}$ ]] || continue
            out="$root/targets/$target"
            mkdir -p "$out"
            node security-intelligence-phase0/scripts/security-pipeline-config-v1.mjs \
              --operation mimo-objective --input-root "$root/input/preflight" \
              --output-root "$out" --run-identity "$root/input/RUN_IDENTITY_v1.json" \
              --target-id "$target" || continue
            mode=record-unavailable
            if [ "$MODEL_APPROVED" = true ] && [ "$MODEL_STATUS" = success ] && \
               [ "$(date +%s)" -lt "$deadline" ]; then mode=propose; fi
            node security-intelligence-phase0/scripts/security-pipeline-mimo-v1.mjs \
              --operation "$mode" --objective "$out/MIMO_STAGE_OBJECTIVE_v1.json" \
              --authority "$root/input/admit/EXTENDED_MODE_DISPOSITION_v1.json" \
              --run-identity "$root/input/RUN_IDENTITY_v1.json" \
              --output-root "$out" --private-root "$root/private/$target" \
              --reason-file "$root/input/model-unavailable.json" || true
            if [ -s "$out/MIMO_PROPOSAL_v1.json" ]; then
              node security-intelligence-phase0/scripts/security-pipeline-config-v1.mjs \
                --operation validate-proposal --input-root "$out" --output-root "$out" \
                --run-identity "$root/input/RUN_IDENTITY_v1.json" \
                --proposal "$out/MIMO_PROPOSAL_v1.json" || true
            fi
          done < "$root/input/targets.txt"
      - name: Summarize original MiMo target facts and exact unavailable requirements
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/security-pipeline/mimo/report"
          python3 security-intelligence-phase0/scripts/security-pipeline-verify-v1.py \
            --mode summarize-job --job mimo_configure --stage G2A \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --input-root "$RUNNER_TEMP/security-pipeline/mimo/targets" \
            --source-manifest "$RUNNER_TEMP/security-pipeline/mimo/input/preflight/PREFLIGHT_MANIFEST_v1.json" \
            --report-root "$RUNNER_TEMP/security-pipeline/mimo/report"
      - name: Terminate this job's own localhost inference server
        if: ${{ always() }}
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/security-pipeline/mimo/input/server.pid"
          if [ -s "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            [[ "$pid" =~ ^[0-9]+$ ]] && kill "$pid" 2>/dev/null || true
          fi
      - name: Upload only digest and sanitized G2A warning status
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: security-pipeline-stage-mimo_configure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-pipeline/mimo/report/
          if-no-files-found: warn
          retention-days: 14

  fork_setup:
    needs: [admit, collect, mimo_configure]
    if: ${{ always() && !cancelled() && needs.admit.outputs.extended_requested == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout immutable source-bound stage code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Load original source-bound G2 toolkit profile for fork_setup
        id: consumer_toolkit_profile
        uses: actions/download-artifact@v4
        with:
          name: security-pipeline-toolkit-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-pipeline/toolkit-profile
        continue-on-error: true
      - name: Set pinned Node 22 for independent component verification
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve immutable run/attempt identity for fork_setup software consumers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/security-pipeline/fork_setup/consumer-toolkit"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const dest=path.join(process.env.RUNNER_TEMP,'security-pipeline','fork_setup','consumer-toolkit','RUN_IDENTITY_v1.json');
          fs.writeFileSync(dest,JSON.stringify({schemaVersion:'curveyield-security-pipeline-run-identity-v1',
           runId:process.env.GITHUB_RUN_ID,runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),
           workflowHeadSha:process.env.GITHUB_SHA,repository:process.env.GITHUB_REPOSITORY},null,2)+'\n');
          NODE
      - name: Plan the original fixed foundry-node component identity
        id: consumer_foundry_node_plan
        continue-on-error: true
        shell: bash
        run: |
          node security-intelligence-phase0/scripts/security-pipeline-toolkit-v1.mjs \
