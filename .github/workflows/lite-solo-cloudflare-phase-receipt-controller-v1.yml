name: Lite-Solo Cloudflare lite-phase-receipt-controller-v1 v1

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        required: true
        type: string
      campaign_path:
        required: true
        type: string
      phase_sequence:
        required: true
        type: string
      audit_controller_ref:
        required: false
        default: main
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: lite-phase-receipt-controller-${{ inputs.campaign_id }}-${{ inputs.phase_sequence }}
  cancel-in-progress: false

jobs:
  validate-and-advance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/lite-solo-cloudflare-runtime-v1/scripts/select-audit-controller-token.sh
      - name: Checkout Audit-Controller
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          rm -rf .audit-controller
          gh repo clone curveyield3/Audit-Controller .audit-controller -- --filter=blob:none --no-checkout
          cd .audit-controller
          git fetch origin "${{ inputs.audit_controller_ref }}"
          git checkout -B "${{ inputs.audit_controller_ref }}" "origin/${{ inputs.audit_controller_ref }}"
      - name: Validate and advance the single receipt
        id: advance
        run: |
          set -euo pipefail
          node scripts/lite-solo-cloudflare-runtime-v1/scripts/lite-phase-receipt-controller-v1.mjs \
            --controller-root .audit-controller \
            --campaign-path "${{ inputs.campaign_path }}" \
            --phase-sequence "${{ inputs.phase_sequence }}" | tee /tmp/receipt-transition.json
          echo "status=$(jq -r '.status' /tmp/receipt-transition.json)" >> "$GITHUB_OUTPUT"
          echo "fresh=$(jq -r '.freshSuccessorRequired // false' /tmp/receipt-transition.json)" >> "$GITHUB_OUTPUT"
          echo "campaign_name=$(jq -r '.campaignName // empty' /tmp/receipt-transition.json)" >> "$GITHUB_OUTPUT"
      - name: Publish receipt transition
        if: steps.advance.outputs.status == 'PASS'
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd .audit-controller
          git config user.name 'CurveYield Lite Receipt Controller'
          git config user.email 'lite-receipt-controller@users.noreply.github.com'
          git add -- "${{ inputs.campaign_path }}/receipts" "Audit Campaign Directory/campaigns"
          git diff --cached --quiet && { echo "No durable receipt transition."; exit 0; }
          git commit -m "audit(receipt): advance ${{ inputs.campaign_id }} phase ${{ inputs.phase_sequence }}"
          git push origin "HEAD:${{ inputs.audit_controller_ref }}"
      - name: Dispatch fresh successor orchestration
        if: steps.advance.outputs.status == 'PASS' && steps.advance.outputs.fresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run lite-solo-cloudflare-audit-browser-orchestrator-v1.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f campaign_id="${{ inputs.campaign_id }}" \
            -f campaign_name="${{ steps.advance.outputs.campaign_name }}" \
            -f campaign_path="${{ inputs.campaign_path }}" \
            -f audit_controller_ref="${{ inputs.audit_controller_ref }}"
