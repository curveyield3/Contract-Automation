name: V7 Live DAI Runner Qualification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v7-live-dai-runner-qualification-v1.yml']
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install pinned dependencies
        run: npm ci --force
      - name: Install and verify canonical V7 toolchain
        uses: ./.github/actions/setup-v7-toolchain
      - name: Verify pinned toolchain and runner manifest
        run: |
          npm run v7:manifest -- --check
          npm run v7:toolchain:verify
          node --check packages/github-native-sim/src/run-job-file-v2.mjs
          node --check packages/github-native-sim/src/phase6-mutable-rpc-v1.mjs
      - name: Execute existing full repository Node suite
        run: npm test
      - name: Execute existing static checks
        run: npm run lint
      - name: Qualify archived DAI bytecode and reversible live fork
        env:
          ETHEREUM_FORK_RPC_URL: ${{ secrets.RPC_ETHEREUM }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ETHEREUM_FORK_RPC_URL"
          mkdir -p .audit-evidence/v7-dai-qualification
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createPhase6MutableRpcSession} from './packages/github-native-sim/src/phase6-mutable-rpc-v1.mjs';
          import {runMedusaEndToEndSmokeV1} from './packages/github-native-sim/src/medusa-e2e-smoke-v1.mjs';
          const block=26283885,hash='0xe9a7c98f604a48f1b8885578ec8f54e73ec33e9f34cc5161c049a59640b6eab5';
          const target='0x6b175474e89094c44da98b954eedeac495271d0f';
          const runtime='5ce810033426a017721777f241665c27bdd4663ca8a1c27558b4b372a1731f4e';
          const session=await createPhase6MutableRpcSession({environment:process.env,
            frozenBlockNumber:block,frozenBlockHash:hash,
            attestedTargets:[{address:target,qualifiedName:'Dai.sol:Dai',runtimeSha256:runtime}]});
          try{
            if(session.evidence?.status!=='PASS'||!session.runtime?.url
              ||session.evidence.deployedTargetAttestation?.status!=='PASS')
              throw Error('DAI_FORK_NOT_QUALIFIED: '+JSON.stringify(session.evidence).slice(0,800));
            const smoke=await runMedusaEndToEndSmokeV1({rpcUrl:session.runtime.url,
              rpcBlock:session.runtime.blockNumber,rpcBlockHash:session.runtime.blockHash,
              rpcProfile:session.runtime.profile,sourceCommit:process.env.GITHUB_SHA,
              evidenceDir:'.audit-evidence/v7-dai-qualification/medusa'});
            const checks={
              block:session.runtime.blockNumber===block,
              hash:session.runtime.blockHash?.toLowerCase()===hash,
              deployedBytecode:session.evidence.deployedTargetAttestation.targets[0].runtimeSha256===runtime,
              localWrite:session.evidence.deployedTargetAttestation.mutableWriteObserved===true,
              rollback:session.evidence.deployedTargetAttestation.snapshotReverted===true,
              medusaPass:smoke.checks?.medusaSmokePass===true,
              medusaFalsification:smoke.checks?.medusaSmokeFalsification===true,
              medusaNoTests:smoke.checks?.medusaSmokeNoTests===true,
              medusaRawEvidence:smoke.checks?.rawEvidencePreserved===true,
              noRpcDisclosure:!JSON.stringify(session.evidence).includes(process.env.ETHEREUM_FORK_RPC_URL)
                &&!JSON.stringify(smoke).includes(process.env.ETHEREUM_FORK_RPC_URL)};
            const proof={schemaVersion:'v7-live-dai-qualification-v1',
              status:Object.values(checks).every(Boolean)?'PASS':'FAIL',
              qualifiedCommit:process.env.GITHUB_SHA,workflowRunId:process.env.GITHUB_RUN_ID,
              target,block,hash,checks};
            fs.writeFileSync('.audit-evidence/v7-dai-qualification/proof.json',JSON.stringify(proof,null,2)+'\n');
            if(proof.status!=='PASS')throw Error('V7_RUNNER_QUALIFICATION_FAILED');
          }finally{await session.close();}
          NODE
      - name: Rebind exact qualified commit only after all checks PASS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const q=JSON.parse(fs.readFileSync('.audit-evidence/v7-dai-qualification/proof.json','utf8'));
          if(q.status!=='PASS'||q.qualifiedCommit!==process.env.GITHUB_SHA
            ||q.workflowRunId!==process.env.GITHUB_RUN_ID)throw Error('QUALIFICATION_IDENTITY_INVALID');
          const s={schemaVersion:'curveyield-v7-current-qualification-status-v1',
            status:'PASS',qualifiedCommit:q.qualifiedCommit,workflowRunId:q.workflowRunId,
            qualifiedAt:new Date().toISOString(),qualificationLane:'FULL_NODE_TOOLCHAIN_DAI_ANVIL_MEDUSA',
            evidencePath:'.audit-evidence/v7-dai-qualification/proof.json',
            requestSchema:'deep-assurance-github-request-v2',
            testMatrix:{fullNodeSuite:'PASS',staticChecks:'PASS',toolchainVerification:'PASS',
              anvilRunner:'PASS',githubNative:'PASS'},
            phase6:{status:'PASS',engine:'anvil',target:q.target,
              blockNumber:q.block,blockHash:q.hash,checks:q.checks}};
          fs.writeFileSync('/tmp/qualified-status.json',JSON.stringify(s,null,2)+'\n');
          NODE
          for i in 1 2 3; do
            sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/process/V7_QUALIFICATION_STATUS.json?ref=main" --jq .sha)"
            data="$(base64 -w0 /tmp/qualified-status.json)"
            if gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/process/V7_QUALIFICATION_STATUS.json" \
              -f message='chore(v7): record fully evidenced current-runner qualification' \
              -f content="$data" -f sha="$sha" -f branch=main >/dev/null; then exit 0; fi
            sleep "$i"
          done
          exit 1
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dai-v7-qualification-${{ github.sha }}
          path: .audit-evidence/v7-dai-qualification/
