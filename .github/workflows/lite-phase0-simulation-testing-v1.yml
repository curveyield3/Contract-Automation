name: Lite Phase 0 Forked Deploy Config Smoke v3
on:
  push:
    paths:
      - '.github/smoke-trigger/lite-phase0-simulation-testing-v1.json'
  workflow_dispatch:
    inputs:
      campaign_id:
        required: true
        type: string
      campaign_path:
        required: true
        type: string
      audit_controller_ref:
        required: false
        default: main
        type: string
  workflow_call:
    inputs:
      campaign_id:
        required: true
        type: string
      campaign_path:
        required: true
        type: string
      audit_controller_ref:
        required: false
        default: main
        type: string
permissions:
  contents: read
jobs:
  fork-deploy-config-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore dependencies
        uses: ./.github/actions/setup-phase0-node-cache
      - name: Enable native package Forge scripts
        uses: ./.github/actions/setup-phase0-deployment-only-toolchain-v1
      - name: Resolve smoke request
        id: request
        env:
          MANUAL_CAMPAIGN_ID: ${{ inputs.campaign_id }}
          MANUAL_CAMPAIGN_PATH: ${{ inputs.campaign_path }}
          MANUAL_CONTROLLER_REF: ${{ inputs.audit_controller_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = push ]; then
            file=.github/smoke-trigger/lite-phase0-simulation-testing-v1.json
            jq -e '.schemaVersion=="curveyield-lite-phase0-deploy-config-smoke-request-v1" and (.campaign_id|length>0) and (.campaign_path|startswith("campaigns/"))' "$file" >/dev/null
            id="$(jq -r '.campaign_id' "$file")"
            location="$(jq -r '.campaign_path' "$file")"
            ref="$(jq -r '.audit_controller_ref // "main"' "$file")"
          else
            id="$MANUAL_CAMPAIGN_ID"
            location="$MANUAL_CAMPAIGN_PATH"
            ref="${MANUAL_CONTROLLER_REF:-main}"
          fi
          test -n "$id" && [[ "$location" == campaigns/* ]]
          echo "campaign_id=$id" >> "$GITHUB_OUTPUT"
          echo "campaign_path=$location" >> "$GITHUB_OUTPUT"
          echo "controller_ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh
      - name: Checkout exact campaign
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_REF: ${{ steps.request.outputs.controller_ref }}
        run: bash scripts/checkout-audit-controller-once-v1.sh .audit-controller "$AUDIT_CONTROLLER_REF" branch "${{ steps.request.outputs.campaign_path }}"
      - name: Run native deploy/config scripts on Anvil and validate evidence
        env:
          ETHEREUM_FORK_RPC_URL: ${{ secrets.RPC_ETHEREUM }}
          CAMPAIGN_PATH: ${{ steps.request.outputs.campaign_path }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ETHEREUM_FORK_RPC_URL:-}" || { echo "::error::RPC_ETHEREUM missing"; exit 1; }
          python3 scripts/audit-command-guard-v1.py --label phase0-fork-deploy --wall 2400 --idle 300 --log "$GITHUB_WORKSPACE/.phase0-deploy-command-v1.log" -- node scripts/run-phase0-fork-deploy-config-v1.mjs \
            --controller-root .audit-controller --campaign-path "$CAMPAIGN_PATH" \
            --output .phase0-deploy-smoke --fork-url "$ETHEREUM_FORK_RPC_URL" | tee .phase0-deploy-smoke.log
          file=.phase0-deploy-smoke/PHASE0_DEPLOY_CONFIG_EXECUTION_v1.json
          if jq -e '.status=="BLOCKED_SCRIPT_FAILURE"' "$file" >/dev/null; then
            node scripts/reconcile-phase0-deploy-evidence-v1.mjs \
              --input "$file" --output "$file" \
              --campaign-root ".audit-controller/$CAMPAIGN_PATH" \
              --source-run-id "$GITHUB_RUN_ID"
          fi
          node --input-type=module -e 'import fs from "node:fs";import {assertDeployGateEvidenceV2} from "./scripts/lib/phase0-deploy-gate-v2.mjs";assertDeployGateEvidenceV2(JSON.parse(fs.readFileSync(process.argv[1],"utf8")))' "$file"
      - name: Diagnose native deployment script dispositions
        if: ${{ always() }}
        shell: bash
        run: |
          evidence=.phase0-deploy-smoke/PHASE0_DEPLOY_CONFIG_EXECUTION_v1.json
          if [ -f "$evidence" ]; then
            echo "---- detected native package script dispositions ----"
            jq '[.scriptDispositions[]? | {scriptKey,disposition,attemptStatus,gapType,gapReason}]' "$evidence"
            echo "---- non-passing script attempts ----"
            jq '[.attempts[]? | select(.status!="PASS") | {script,path,status,exitCode}]' "$evidence"
            echo "---- typed limitations ----"
            jq '[.gaps[]? | {type,script,path,reason}]' "$evidence"
          fi

      - name: Retain full smoke evidence on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase0-deploy-smoke-${{ github.run_id }}
          path: |
            .phase0-deploy-smoke
            .phase0-deploy-smoke.log
            .phase0-deploy-command-v1.log
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
