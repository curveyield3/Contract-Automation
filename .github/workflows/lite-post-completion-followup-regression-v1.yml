name: Lite Post-Completion Followup Admission Regression v1
# Regression execution requires explicit audit-owner permission; never auto-run on source push.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify current controller source syntax
        run: |
          node --check scripts/lib/lite-post-completion-followup-v1.mjs
          node --check scripts/lib/lite-master-review-v1.mjs
          node --check scripts/lite-phase-packet-controller-v1.mjs
          node --check scripts/tests/lite-post-completion-followup-v1.test.mjs
      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh
      - name: Checkout accepted campaign and bound authority for read-only regression
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone curveyield3/Audit-Controller .audit-controller -- --filter=blob:none --sparse
          cd .audit-controller
          git sparse-checkout set \
            'Audit Campaign Directory/campaigns' \
            'Audit Skill - Current Authority/Audit_Litemode_v11' \
            'audit-process/v7/frozen-authorities' \
            'campaigns/CurveYield DEX v16 Source r4/work' \
            'campaigns/CurveYield DEX v16 Source r4/derived' \
            'campaigns/CurveYield DEX v16 Source r4/receipts' \
            'campaigns/CurveYield DEX v16 Source r4/submissions' \
            'campaigns/CurveYield DEX v16 Source r4/controller' \
            'campaigns/CurveYield DEX v16 Source r4/evidence/build' \
            'campaigns/CurveYield DEX v16 Source r4/evidence/source-intelligence'
      - name: Install controller runtime imports inside GitHub Actions
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate bounded admission in ephemeral checkout only
        run: node scripts/tests/lite-post-completion-followup-v1.test.mjs .audit-controller
