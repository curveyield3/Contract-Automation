name: Lite-Solo v4 Production Qualification
on:
  push:
    branches: [main]
    paths:
      - 'scripts/tests/lite-solo-v4-acceptance/RUN_PRODUCTION.md'
      - 'scripts/tests/lite-solo-v4-acceptance/cases/**'
      - 'test/phase0-deploy-gate-v2.test.mjs'
      - 'scripts/lite-solo-fork-integration-check-v1.mjs'
      - '.github/workflows/lite-solo-v4-production-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --force --ignore-scripts --no-audit --no-fund
      - name: Parse-check all production entrypoints
        run: |
          node --check scripts/lib/lite-solo-unit-queue-v1.mjs
          node --check scripts/lite-solo-unit-request-drain-v1.mjs
          node --check scripts/lite-solo-phase-controller-v1.mjs
          node --check scripts/lite-solo-phase0-finalize-v1.mjs
          bash -n scripts/lite-solo-source-initialization/run-v1.sh
      - name: Verify current fork integration and source syntax
        run: |
          set -euo pipefail
          find scripts packages/github-native-sim/src -type f -name '*lite-solo*.mjs' -print0 | xargs -0 -r -n1 node --check
          node scripts/lite-solo-fork-integration-check-v1.mjs
      - name: Verify strict Phase-0 deployment waiver gate
        run: node --test test/phase0-deploy-gate-v2.test.mjs
      - name: Execute all 30 acceptance local fixtures plus decisive-proof regressions
        run: |
          set -o pipefail
          mkdir -p scripts/tests/lite-solo-v4-acceptance/output
          node --test --test-concurrency=1 scripts/tests/lite-solo-v4-acceptance/cases/*.test.mjs
      - name: Verify pinned runner manifest
        run: npm run v7:manifest -- --check
      - name: Enable pinned Forge and Cast
        uses: ./.github/actions/setup-phase0-deployment-only-toolchain-v1
      - name: Real Phase-0 Anvil fork and deployment E2E
        env:
          PHASE0_E2E: '1'
        run: timeout -k 10s 600s node --test packages/github-native-sim/test/phase0-erc20-deploy-e2e-v1.test.mjs
      - name: Select existing private authority read credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh
      - name: Verify complete live v4 authority manifest and exact hashes
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone curveyield3/Audit-Controller .lite-solo-authority-check -- --branch main --depth 1 --filter=blob:none --sparse
          git -C .lite-solo-authority-check sparse-checkout set --no-cone '/Audit Skill - Lite-Solo Authority/lite-solo-v4/'
          node scripts/lite-solo-verify-authority-v1.mjs '.lite-solo-authority-check/Audit Skill - Lite-Solo Authority/lite-solo-v4'
      - name: Publish per-scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lite-solo-v4-production-qualification
          path: scripts/tests/lite-solo-v4-acceptance/output/
          if-no-files-found: warn
