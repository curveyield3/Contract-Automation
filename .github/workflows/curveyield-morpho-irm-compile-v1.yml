name: CurveYield Fraxtal Morpho IRM Compile v19

# Compile-only validation. No tests, deployments, broadcast or RPC use.
on:
  push:
    branches:
      - morpho-fraxtal-compile-v1
    paths:
      - 'github-native-sim/morpho-fraxtal-v1/CurveYieldMorphoIRMsV6.sol'
      - 'github-native-sim/morpho-fraxtal-v1/CurveYieldMorphoIRMsV7.sol'
      - 'github-native-sim/morpho-fraxtal-v1/CurveYieldTriggerMasterIRMV3.sol'
      - 'github-native-sim/morpho-fraxtal-v1/CurveYieldMorphoIRMFactoriesV6.sol'
      - 'github-native-sim/morpho-fraxtal-v1/CurveYieldOmniIRMFactoryV3.sol'
      - 'github-native-sim/morpho-fraxtal-v1/CurveYieldMarketFactory_v1.sol'
      - 'github-native-sim/morpho-fraxtal-v1/CurveYieldMarketFactory_v2.sol'
      - 'github-native-sim/morpho-fraxtal-v1/CurveYieldMarketFactory_v3.sol'
      - 'github-native-sim/morpho-fraxtal-v1/CurveYieldMarketFactory_v4.sol'
      - 'github-native-sim/morpho-fraxtal-v1/CurveYieldMorphoOwnerAndSplitterV5.sol'
      - '.github/workflows/curveyield-morpho-irm-compile-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing pinned Solidity compiler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile six IRMs, standalone OmniFactory, six legacy factories and governance
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import solc from 'solc';
          const path = 'github-native-sim/morpho-fraxtal-v1/CurveYieldMorphoIRMsV6.sol';
          const candidate = 'github-native-sim/morpho-fraxtal-v1/CurveYieldMorphoIRMsV7.sol';
          const master = 'github-native-sim/morpho-fraxtal-v1/CurveYieldTriggerMasterIRMV3.sol';
          const factories = 'github-native-sim/morpho-fraxtal-v1/CurveYieldMorphoIRMFactoriesV6.sol';
          const governor = 'github-native-sim/morpho-fraxtal-v1/CurveYieldMorphoOwnerAndSplitterV5.sol';
          const omni = 'github-native-sim/morpho-fraxtal-v1/CurveYieldOmniIRMFactoryV3.sol';
          const marketV1 = 'github-native-sim/morpho-fraxtal-v1/CurveYieldMarketFactory_v1.sol';
          const marketV2 = 'github-native-sim/morpho-fraxtal-v1/CurveYieldMarketFactory_v2.sol';
          const marketV3 = 'github-native-sim/morpho-fraxtal-v1/CurveYieldMarketFactory_v3.sol';
          const marketV4 = 'github-native-sim/morpho-fraxtal-v1/CurveYieldMarketFactory_v4.sol';
          const input = {
            language: 'Solidity',
            sources: { [path]: { content: fs.readFileSync(path, 'utf8') }, [candidate]: { content: fs.readFileSync(candidate, 'utf8') }, [master]: { content: fs.readFileSync(master, 'utf8') }, [factories]: { content: fs.readFileSync(factories, 'utf8') }, [governor]: { content: fs.readFileSync(governor, 'utf8') }, [omni]: { content: fs.readFileSync(omni, 'utf8') }, [marketV1]: { content: fs.readFileSync(marketV1, 'utf8') }, [marketV2]: { content: fs.readFileSync(marketV2, 'utf8') }, [marketV3]: { content: fs.readFileSync(marketV3, 'utf8') }, [marketV4]: { content: fs.readFileSync(marketV4, 'utf8') } },
            settings: {
              optimizer: { enabled: true, runs: 200 },
              evmVersion: 'cancun',
              outputSelection: { '*': { '*': ['abi','evm.deployedBytecode.object','evm.bytecode.object'] } }
            }
          };
          console.log('CY_FULL_SOLC_VERSION', solc.version());
          const output = JSON.parse(solc.compile(JSON.stringify(input)));
          for (const err of output.errors ?? []) {
            console.log(err.formattedMessage);
          }
          const errors = (output.errors ?? []).filter(e => e.severity === 'error');
          if (errors.length) process.exit(1);
          // Compile-only comparison; V7 bounded-math optimized models are used by OmniFactory V3.
          const oldIrms = output.contracts?.[path] ?? {};
          const optIrms = output.contracts?.[candidate] ?? {};
          for (const name of Object.keys(oldIrms)) {
            if (!name.startsWith('CurveYield')) continue;
            const oldRuntime = oldIrms[name].evm.deployedBytecode.object.length / 2;
            const optRuntime = optIrms[name]?.evm?.deployedBytecode?.object.length / 2;
            console.log('CY_OPT_COMPARE_' + name + '=' + oldRuntime + ',' + optRuntime + ',' + (optRuntime - oldRuntime));
            if (!Number.isFinite(optRuntime) || optRuntime > oldRuntime) {
              console.error('Candidate runtime regression:', name);
              process.exitCode = 1;
            }
          }
          const splitLegacy = output.contracts?.[governor]?.CurveYieldMorphoFeeSplitterV3;
          const splitA = output.contracts?.[marketV1]?.CurveYieldMarketFactory;
          const splitB = output.contracts?.[marketV2]?.CurveYieldMarketFactory;
          const splitC = output.contracts?.[marketV3]?.CurveYieldMarketFactory;
          const splitD = output.contracts?.[marketV4]?.CurveYieldMarketFactory;
          if (!splitA || !splitB || !splitC || !splitD || !splitLegacy) { console.error('Missing MarketFactory compilation'); process.exit(1); }
          const sz = c => c.evm.deployedBytecode.object.length / 2;
          console.log('CY_MARKET_FACTORY_SIZES=' + [sz(splitLegacy),sz(splitA),sz(splitB),sz(splitC),sz(splitD)].join(','));
          console.log('CY_MARKET_FACTORY_CREATION_SIZES=' + [splitA.evm.bytecode.object.length/2,splitB.evm.bytecode.object.length/2,splitC.evm.bytecode.object.length/2,splitD.evm.bytecode.object.length/2].join(','));
          console.log('CY_MARKET_FACTORY_ABI_ENTRIES=' + [splitA.abi.length,splitB.abi.length,splitC.abi.length,splitD.abi.length].join(','));
          // Separate viaIR optimizer check, using the same deployed-source Solidity compiler.
          const irInput = {
            language: 'Solidity',
            sources: { [governor]: input.sources[governor], [marketV2]: input.sources[marketV2], [marketV4]: input.sources[marketV4] },
            settings: { optimizer: { enabled: true, runs: 200 }, viaIR: true, evmVersion: 'cancun',
              outputSelection: { '*': { '*': ['evm.deployedBytecode.object'] } } }
          };
          const irOutput = JSON.parse(solc.compile(JSON.stringify(irInput)));
          for (const err of irOutput.errors ?? []) { if (err.severity === 'error') console.error(err.formattedMessage); }
          if ((irOutput.errors ?? []).some(e => e.severity === 'error')) process.exit(1);
          const irContract = irOutput.contracts?.[marketV2]?.CurveYieldMarketFactory;
          const irV4 = irOutput.contracts?.[marketV4]?.CurveYieldMarketFactory;
          if (!irContract || !irV4) { console.error('Missing viaIR MarketFactory'); process.exit(1); }
          console.log('CY_MARKET_FACTORY_VIAIR_RUNTIME=' + irContract.evm.deployedBytecode.object.length / 2);
          console.log('CY_MARKET_FACTORY_V4_VIAIR_RUNTIME=' + irV4.evm.deployedBytecode.object.length / 2);
          const contracts = { ...(output.contracts?.[path] ?? {}), ...(output.contracts?.[master] ?? {}), ...(output.contracts?.[factories] ?? {}), ...(output.contracts?.[governor] ?? {}), ...(output.contracts?.[omni] ?? {}) };
          const models = Object.entries(contracts).filter(([name]) => name.startsWith('CurveYield'));
          if (models.length !== 18) {
            console.error('Expected six IRMs, six factories, owner V3, splitter V3, OmniFactory and bytecode store, found', models.map(([name]) => name));
            process.exit(1);
          }
          for (const [name, contract] of models) {
            const bytecode = contract.evm.deployedBytecode.object;
            const size = bytecode.length / 2;
            console.log(name, 'runtime bytes:', size, 'ABI entries:', contract.abi.length);
            if (size > 24576) {
              console.error('EIP-170 runtime size exceeded:', name);
              process.exitCode = 1;
            }
          }
          for (const [name, contract] of models) {
            if (name === 'CurveYieldIrmBase' || name === 'CurveYieldIRMFactoryBaseV6') continue;
            const creation = contract.evm.bytecode.object;
            if (name === 'CurveYieldOmniIRMFactoryV3') {
              const initBytes = creation.length / 2;
              console.log('CY_OMNI_CREATION_BYTES=' + initBytes);
              if (initBytes > 49152) { console.error('OmniFactory EIP-3860 initcode limit exceeded'); process.exitCode = 1; }
            }
            if (!creation || !/^[0-9a-fA-F]+$/.test(creation)) {
              console.error('Missing creation bytecode:', name);
              process.exitCode = 1;
            } else {
              console.log('CY_CREATION_BYTECODE_' + name + '=0x' + creation);
            }
          }
          NODE

      - name: Package exact compiled IRM sources and deployment helpers
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='CurveYield_Fraxtal_Morpho_IRMs_v10'
          ROOT="$RUNNER_TEMP/$PACKAGE"
          mkdir -p "$ROOT/contracts" "$ROOT/build"
          cp github-native-sim/morpho-fraxtal-v1/CurveYieldMorphoIRMsV6.sol "$ROOT/contracts/"
          cp github-native-sim/morpho-fraxtal-v1/CurveYieldMorphoIRMsV7.sol "$ROOT/contracts/"
          cp github-native-sim/morpho-fraxtal-v1/CurveYieldTriggerMasterIRMV3.sol "$ROOT/contracts/"
          cp github-native-sim/morpho-fraxtal-v1/CurveYieldMorphoIRMFactoriesV6.sol "$ROOT/contracts/"
          cp github-native-sim/morpho-fraxtal-v1/CurveYieldOmniIRMFactoryV3.sol "$ROOT/contracts/"
          cp github-native-sim/morpho-fraxtal-v1/CurveYieldMarketFactory_v1.sol "$ROOT/contracts/"
          cp github-native-sim/morpho-fraxtal-v1/CurveYieldMarketFactory_v2.sol "$ROOT/contracts/"
          cp github-native-sim/morpho-fraxtal-v1/CurveYieldMarketFactory_v3.sol "$ROOT/contracts/"
          cp github-native-sim/morpho-fraxtal-v1/CurveYieldMarketFactory_v4.sol "$ROOT/contracts/"
          cp github-native-sim/morpho-fraxtal-v1/CurveYieldMorphoOwnerAndSplitterV5.sol "$ROOT/contracts/"
          cp .github/workflows/curveyield-morpho-irm-compile-v1.yml "$ROOT/build/compilation-workflow.yml"
          cat > "$ROOT/foundry.toml" <<'TOML'
          [profile.default]
          src = "contracts"
          out = "out"
          libs = []
          solc = "0.8.30"
          optimizer = true
          optimizer_runs = 200
          evm_version = "cancun"
          TOML
          cat > "$ROOT/README_v10.md" <<'MD'
          # CurveYield Fraxtal Morpho IRM source package v10

          Standalone OmniFactory V3 compiles against optimized IRMs V7 and
          unchanged TriggerMaster V3. Original IRMs V6 are retained as
          benchmark references, not used by the new standalone factory.
          Existing SPDX license identifiers are preserved.

          Models: CurveYieldMorphoIRMsV6.sol
          Optimized creation templates: CurveYieldMorphoIRMsV7.sol
          Master: CurveYieldTriggerMasterIRMV3.sol
          Factories: CurveYieldMorphoIRMFactoriesV6.sol
          Standalone single-entrypoint OmniFactory: CurveYieldOmniIRMFactoryV2.sol
          Governance and splitter: CurveYieldMorphoOwnerAndSplitterV5.sol

          Built with solc v0.8.30, optimizer 200 runs, EVM Cancun.
          The GitHub compile workflow is in build/compilation-workflow.yml.
          The new owner V3 is an exact code copy of the verified live owner V1, with
          only Safe-controlled approvedFactory and enableIrm authorization edits.
          The V3 splitter preserves V2 fee and share accounting; its Safe can rotate
          controllers after validation, including a not-yet-registered governor.
          Rotate atomically: setGovernance, configureSplitter, transfer ownership.

          OmniFactory deploys and owns its six IRM creation-bytecode stores during
          its constructor. It calls NO existing individual IRM factory.
          Direct-Morpho creation requires Safe to whitelist OmniFactory separately.
          Existing six individual factories remain deployed and approved.

          Important: Safe activation and factory allowlisting are NOT automatic.
          Prior Safe proposal 0x93382b1fdb27866ccc2451a687ab3485f7a9809b52a62e71fe8d5af4b5f258a7
          targets an obsolete module and must NOT be executed.
          Migrating the Morpho owner requires the paired fee splitter to be
          deployed pointing to the new governance, and its fee-recipient migration.
          MD
          (
            cd "$ROOT"
            sha256sum contracts/*.sol > SOURCE_SHA256SUMS_v10.txt
            printf 'repository=curveyield3/Contract-Automation\nbranch=morpho-fraxtal-compile-v1\ncommit=%s\nworkflow_run=%s\ncompiler=solc 0.8.30\noptimizer_runs=200\nevm_version=cancun\n' \
              "$GITHUB_SHA" "$GITHUB_RUN_ID" > BUILD_PROVENANCE_v10.txt
          )
          ( cd "$RUNNER_TEMP" && zip -q -r "$GITHUB_WORKSPACE/$PACKAGE.zip" "$PACKAGE" )
          unzip -t "$PACKAGE.zip"
          sha256sum "$PACKAGE.zip"
      - name: Publish CurveYield IRM ZIP v5
        uses: actions/upload-artifact@v4
        with:
          name: CurveYield_Fraxtal_Morpho_IRMs_v10
          path: CurveYield_Fraxtal_Morpho_IRMs_v10.zip
          if-no-files-found: error
          retention-days: 30
