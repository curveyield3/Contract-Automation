name: CurveYield Fraxtal Morpho IRM Compile v11

# Compile-only validation. No tests, deployments, broadcast or RPC use.
on:
  push:
    branches:
      - morpho-fraxtal-compile-v1
    paths:
      - 'github-native-sim/morpho-fraxtal-v1/CurveYieldMorphoIRMsV6.sol'
      - 'github-native-sim/morpho-fraxtal-v1/CurveYieldTriggerMasterIRMV3.sol'
      - 'github-native-sim/morpho-fraxtal-v1/CurveYieldMorphoIRMFactoriesV3.sol'
      - 'github-native-sim/morpho-fraxtal-v1/CurveYieldMorphoOwnerV4.sol'
      - '.github/workflows/curveyield-morpho-irm-compile-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing pinned Solidity compiler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile header-complete six IRMs, six factories and governance V4
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import solc from 'solc';
          const path = 'github-native-sim/morpho-fraxtal-v1/CurveYieldMorphoIRMsV6.sol';
          const master = 'github-native-sim/morpho-fraxtal-v1/CurveYieldTriggerMasterIRMV3.sol';
          const factories = 'github-native-sim/morpho-fraxtal-v1/CurveYieldMorphoIRMFactoriesV3.sol';
          const governor = 'github-native-sim/morpho-fraxtal-v1/CurveYieldMorphoOwnerV4.sol';
          const input = {
            language: 'Solidity',
            sources: { [path]: { content: fs.readFileSync(path, 'utf8') }, [master]: { content: fs.readFileSync(master, 'utf8') }, [factories]: { content: fs.readFileSync(factories, 'utf8') }, [governor]: { content: fs.readFileSync(governor, 'utf8') } },
            settings: {
              optimizer: { enabled: true, runs: 200 },
              evmVersion: 'cancun',
              outputSelection: { '*': { '*': ['abi','evm.deployedBytecode.object','evm.bytecode.object'] } }
            }
          };
          console.log('CY_FULL_SOLC_VERSION', solc.version());
          const output = JSON.parse(solc.compile(JSON.stringify(input)));
          for (const err of output.errors ?? []) {
            console.log(err.formattedMessage);
          }
          const errors = (output.errors ?? []).filter(e => e.severity === 'error');
          if (errors.length) process.exit(1);
          const contracts = { ...(output.contracts?.[path] ?? {}), ...(output.contracts?.[master] ?? {}), ...(output.contracts?.[factories] ?? {}), ...(output.contracts?.[governor] ?? {}) };
          const models = Object.entries(contracts).filter(([name]) => name.startsWith('CurveYield'));
          if (models.length !== 15) {
            console.error('Expected six IRMs, six factories, governance V3 and two abstract bases, found', models.map(([name]) => name));
            process.exit(1);
          }
          for (const [name, contract] of models) {
            const bytecode = contract.evm.deployedBytecode.object;
            const size = bytecode.length / 2;
            console.log(name, 'runtime bytes:', size, 'ABI entries:', contract.abi.length);
            if (size > 24576) {
              console.error('EIP-170 runtime size exceeded:', name);
              process.exitCode = 1;
            }
          }
          for (const [name, contract] of models) {
            if (name === 'CurveYieldIrmBase' || name === 'CurveYieldIRMFactoryBaseV3') continue;
            const creation = contract.evm.bytecode.object;
            if (!creation || !/^[0-9a-fA-F]+$/.test(creation)) {
              console.error('Missing creation bytecode:', name);
              process.exitCode = 1;
            } else {
              console.log('CY_CREATION_BYTECODE_' + name + '=0x' + creation);
            }
          }
          NODE

      - name: Package exact compiled IRM sources and deployment helpers
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='CurveYield_Fraxtal_Morpho_IRMs_v2'
          ROOT="$RUNNER_TEMP/$PACKAGE"
          mkdir -p "$ROOT/contracts" "$ROOT/build"
          cp github-native-sim/morpho-fraxtal-v1/CurveYieldMorphoIRMsV6.sol "$ROOT/contracts/"
          cp github-native-sim/morpho-fraxtal-v1/CurveYieldTriggerMasterIRMV3.sol "$ROOT/contracts/"
          cp github-native-sim/morpho-fraxtal-v1/CurveYieldMorphoIRMFactoriesV3.sol "$ROOT/contracts/"
          cp github-native-sim/morpho-fraxtal-v1/CurveYieldMorphoOwnerV4.sol "$ROOT/contracts/"
          cp .github/workflows/curveyield-morpho-irm-compile-v1.yml "$ROOT/build/compilation-workflow.yml"
          cat > "$ROOT/foundry.toml" <<'TOML'
          [profile.default]
          src = "contracts"
          out = "out"
          libs = []
          solc = "0.8.30"
          optimizer = true
          optimizer_runs = 200
          evm_version = "cancun"
          TOML
          cat > "$ROOT/README_v2.md" <<'MD'
          # CurveYield Fraxtal Morpho IRM source package v2

          Four current Solidity files with the exact CurveYield v48 extended header
          preceding each of the 15 concrete or abstract contract declarations.
          Existing SPDX license identifiers are preserved.

          Models: CurveYieldMorphoIRMsV6.sol
          Master: CurveYieldTriggerMasterIRMV3.sol
          Factories: CurveYieldMorphoIRMFactoriesV3.sol
          Governance module: CurveYieldMorphoOwnerV4.sol

          Built with solc v0.8.30, optimizer 200 runs, EVM Cancun.
          The GitHub compile workflow is in build/compilation-workflow.yml.
          The separate immutable on-chain legacy V1 owner and fee splitter are
          not replaced or modified by this source package.

          Important: Safe activation and factory allowlisting are NOT automatic.
          Existing proposals targeting previous V3/V2 deployments must not be
          assumed to authorize these new contracts.
          MD
          (
            cd "$ROOT"
            sha256sum contracts/*.sol > SOURCE_SHA256SUMS_v2.txt
            printf 'repository=curveyield3/Contract-Automation\nbranch=morpho-fraxtal-compile-v1\ncommit=%s\nworkflow_run=%s\ncompiler=solc 0.8.30\noptimizer_runs=200\nevm_version=cancun\n' \
              "$GITHUB_SHA" "$GITHUB_RUN_ID" > BUILD_PROVENANCE_v2.txt
          )
          ( cd "$RUNNER_TEMP" && zip -q -r "$GITHUB_WORKSPACE/$PACKAGE.zip" "$PACKAGE" )
          unzip -t "$PACKAGE.zip"
          sha256sum "$PACKAGE.zip"
      - name: Publish CurveYield IRM ZIP v2
        uses: actions/upload-artifact@v4
        with:
          name: CurveYield_Fraxtal_Morpho_IRMs_v2
          path: CurveYield_Fraxtal_Morpho_IRMs_v2.zip
          if-no-files-found: error
          retention-days: 30
