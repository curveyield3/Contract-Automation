name: Lite Agent Delivery v1
on:
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        required: false
        default: deliver
        options: [deliver, successor, switch, sweep]
      campaign_id: {type: string, required: false}
      campaign_name: {type: string, required: false}
      campaign_path: {type: string, required: false}
      audit_controller_ref: {type: string, required: false, default: main}
      wake_id: {type: string, required: false}
      phase_id: {type: string, required: false}
      mode: {type: string, required: false}
      chat_url: {type: string, required: false}
      wake_message_b64: {type: string, required: false}
      watchdog_enabled: {type: boolean, required: false, default: true}
      worker_role: {type: string, required: false, default: reviewer}
      watchdog_message_b64: {type: string, required: false}
      gate_mode: {type: string, required: false}
      gate_repository: {type: string, required: false}
      gate_ref: {type: string, required: false, default: main}
      gate_state_path: {type: string, required: false}
      gate_expected_phase_id: {type: string, required: false}
      gate_expected_milestone_id: {type: string, required: false}
      gate_active_pointer_path: {type: string, required: false}
      gate_stop_states_csv: {type: string, required: false}
      gate_stop_campaign_statuses_csv: {type: string, required: false}
      browser_context_b64: {type: string, required: false}
      target_mode:
        type: choice
        required: false
        options: ["Original Browser Automation", "Agent Delivery"]
permissions:
  contents: write
  actions: write
concurrency:
  group: lite-work-relay-${{ (github.event_name == 'schedule' || inputs.operation == 'sweep') && 'sweep' || inputs.campaign_id }}
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CAMPAIGN_ID: ${{ inputs.campaign_id }}
      CAMPAIGN_PATH: ${{ inputs.campaign_path }}
      AUDIT_CONTROLLER_REF: ${{ inputs.audit_controller_ref || 'main' }}
      CONTRACT_AUTOMATION_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh
      - name: Work watchdog — GitHub state only, never browser
        if: github.event_name == 'schedule' || inputs.operation == 'sweep'
        run: node scripts/work-relay-v1.mjs --operation sweep
      - name: Publish exact message in Work relay file
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'deliver'
        env:
          WAKE_ID: ${{ inputs.wake_id }}
          PHASE_ID: ${{ inputs.phase_id }}
          CHAT_URL: ${{ inputs.chat_url }}
          MESSAGE_B64: ${{ inputs.wake_message_b64 }}
          WORKER_ROLE: ${{ inputs.worker_role }}
          GATE_STATE_PATH: ${{ inputs.gate_state_path }}
          GATE_MILESTONE: ${{ inputs.gate_expected_milestone_id }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/work-relay-v1.mjs --operation deliver \
            --campaign-id "$CAMPAIGN_ID" --wake-id "$WAKE_ID" \
            --phase-id "$PHASE_ID" --chat-url "$CHAT_URL" \
            --worker-role "$WORKER_ROLE" --wake-message-b64 "$MESSAGE_B64" \
            --gate-state-path "$GATE_STATE_PATH" --gate-expected-milestone-id "$GATE_MILESTONE"
      - name: Prepare and queue successor using existing reviewer assignment generator
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'successor'
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$AUDIT_CONTROLLER_REF" = main
          [[ "$CAMPAIGN_PATH" == campaigns/* ]] && [[ "$CAMPAIGN_ID" =~ ^(.+)-r[0-9]+$ ]]
          slug="$(printf '%s' "$CAMPAIGN_ID" | sed -E 's/-r[0-9]+$//')"
          directory_path="Audit Campaign Directory/campaigns/$slug.json"
          bash scripts/checkout-audit-controller-once-v1.sh .audit-controller main branch "$CAMPAIGN_PATH"
          test "$(jq -r '.campaignId' ".audit-controller/$directory_path")" = "$CAMPAIGN_ID"
          node scripts/prepare-lite-assignment-successor-v2.mjs \
            --controller-root .audit-controller --campaign-directory-path "$directory_path" \
            --audit-controller-ref main > /tmp/work-successor.json
          reviewer="$(jq -r '.currentAssignment.reviewer' ".audit-controller/$directory_path")"
          encoded="$(GH_TOKEN="$GITHUB_TOKEN" gh api "repos/$GITHUB_REPOSITORY/contents/process/browser-agent-wake/registrations/$(printf '%s' "$CAMPAIGN_ID" | tr -c 'A-Za-z0-9._-' '_').json?ref=main" --jq '.content')"
          chat="$(printf '%s' "$encoded" | base64 -d | jq -r --arg r "$reviewer" '.agentChats[$r] // empty')"
          [ -n "$chat" ] && [ "$chat" != null ]
          wake="$(jq -r '.wakeMessageB64' /tmp/work-successor.json)"
          phase="$(jq -r '.incomingPhaseId // .incomingPhase // empty' /tmp/work-successor.json)"
          boundary="PHASE_$(jq -r '.incomingPhaseSequence' /tmp/work-successor.json)_WORK_PACKET"
          node scripts/work-relay-v1.mjs --operation deliver \
            --campaign-id "$CAMPAIGN_ID" --wake-id "$CAMPAIGN_ID-$boundary-$reviewer" \
            --phase-id "$phase" --chat-url "$chat" --worker-role reviewer \
            --wake-message-b64 "$wake" --gate-state-path "$directory_path" \
            --gate-expected-milestone-id "$boundary"
      - name: Change delivery lane during active campaign
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'switch'
        env:
          TARGET_MODE: ${{ inputs.target_mode }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET_MODE" in
            "Agent Delivery") TARGET_MODE=AGENT_DELIVERY ;;
            "Original Browser Automation") TARGET_MODE=GITHUB_BROWSER ;;
            *) echo "::error::Unknown delivery option"; exit 1 ;;
          esac
          node scripts/work-relay-v1.mjs --operation switch \
            --campaign-id "$CAMPAIGN_ID" --target-mode "$TARGET_MODE" | tee /tmp/switch.json
          # Re-dispatch a canonical wake even when a previous switch updated the
          # mode but failed before delivering the wake. The command ID is stable,
          # so the Agent Delivery file deduplicates retries.
          encoded="$(GH_TOKEN="$GITHUB_TOKEN" gh api "repos/$GITHUB_REPOSITORY/contents/process/browser-agent-wake/registrations/$(printf '%s' "$CAMPAIGN_ID" | tr -c 'A-Za-z0-9._-' '_').json?ref=main" --jq '.content')"
          printf '%s' "$encoded" | base64 -d > /tmp/switch-registration.json
          slug="$(printf '%s' "$CAMPAIGN_ID" | sed -E 's/-r[0-9]+$//')"
          directory_path="Audit Campaign Directory/campaigns/$slug.json"
          directory_b64="$(GH_TOKEN="$AUDIT_CONTROLLER_GITHUB_TOKEN" gh api "repos/curveyield3/Audit-Controller/contents/$(printf '%s' "$directory_path" | sed 's/ /%20/g')?ref=main" --jq '.content')"
          printf '%s' "$directory_b64" | base64 -d > /tmp/switch-directory.json
          status="$(jq -r '.campaignStatus // empty' /tmp/switch-directory.json)"
          campaign_path="$(jq -r '.workspacePath' /tmp/switch-directory.json)"
          if [ "$status" = WAITING_FOR_SUCCESSOR_AGENT ] && [ "$(jq -r '.currentAssignment.status // empty' /tmp/switch-directory.json)" = WAITING_FOR_SUCCESSOR_AGENT ]; then
            if [ "$TARGET_MODE" = AGENT_DELIVERY ]; then
              gh workflow run lite-work-relay-v1.yml --repo "$GITHUB_REPOSITORY" --ref main \
                -f operation=successor -f campaign_id="$CAMPAIGN_ID" \
                -f campaign_path="$campaign_path" -f audit_controller_ref=main
            else
              gh workflow run lite-audit-browser-orchestrator-v1.yml --repo "$GITHUB_REPOSITORY" --ref main \
                -f campaign_id="$CAMPAIGN_ID" -f campaign_name="$(jq -r '.campaignName' /tmp/switch-directory.json)" \
                -f campaign_path="$campaign_path" -f audit_controller_ref=main
            fi
            echo 'A full canonical successor instruction has been dispatched after switching transport.'
            exit 0
          fi
          role="$(jq -r '.activeAssignment.reviewer // .activeChat.name // empty' /tmp/switch-registration.json)"
          if [ "$status" = WAITING_FOR_MASTER_REVIEW ]; then role=master-reviewer; fi
          chat="$(jq -r --arg r "$role" '.agentChats[$r] // empty' /tmp/switch-registration.json)"
          phase="$(jq -r '.activeAssignment.phaseId // empty' /tmp/switch-registration.json)"
          worker_role=reviewer
          pending_is_current=false
          if [ "$TARGET_MODE" = GITHUB_BROWSER ]; then
            pending_chat="$(jq -r '.pendingCommand.chatUrl // empty' /tmp/switch.json)"
            if [ -n "$pending_chat" ] && [ "$pending_chat" = "$chat" ]; then
              pending_is_current=true
              phase="$(jq -r '.pendingCommand.phaseId // empty' /tmp/switch.json)"
              worker_role="$(jq -r '.pendingCommand.workerRole // "reviewer"' /tmp/switch.json)"
            elif [ -n "$pending_chat" ]; then
              echo "::warning::Archived pending command is for a different chat; using canonical current assignment instead."
            fi
          fi
          [ -n "$chat" ] || { echo "::warning::No registered active chat; next controller handoff will use selected mode."; exit 0; }
          message=""
          if [ "$pending_is_current" = true ]; then
            message="$(jq -r '.pendingCommand.message // empty' /tmp/switch.json)"
          fi
          if [ -z "$message" ]; then
            message="DELIVERY TRANSPORT SWITCH — RESUME NOW. Campaign: $CAMPAIGN_ID. Canonical directory: https://github.com/curveyield3/Audit-Controller/blob/main/Audit%20Campaign%20Directory/campaigns/$slug.json. Current campaign status: $status. Read the current assignment, bound audit authority and exact latest controller packet; continue the unfinished phase, discovery or master-review assignment. Preserve sealed phases and accepted shards. If a previous controller result needs rework, diagnose and repair it rather than waiting. Do not run tests or machine simulations without the owner's separate authorization."
          fi
          b64="$(printf '%s' "$message" | base64 -w0)"
          wake_id="$CAMPAIGN_ID-switch-$(jq -r '.epoch' /tmp/switch.json)-$role"
          if [ "$TARGET_MODE" = AGENT_DELIVERY ]; then
            node scripts/work-relay-v1.mjs --operation deliver \
              --campaign-id "$CAMPAIGN_ID" --wake-id "$wake_id" \
              --phase-id "$phase" --chat-url "$chat" --worker-role reviewer \
              --wake-message-b64 "$b64"
          else
            gh workflow run browser-agent-wake.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f wake_id="$wake_id" -f campaign_id="$CAMPAIGN_ID" \
              -f phase_id="$phase" -f mode=resume_existing -f chat_url="$chat" \
              -f wake_message_b64="$b64" -f worker_role="$worker_role" \
              -f watchdog_enabled=true -f gate_mode=LITE \
              -f gate_repository=curveyield3/Audit-Controller -f gate_ref=main \
              -f gate_state_path="$(jq -r '.watchdog.gate.statePath // empty' /tmp/switch-registration.json)" \
              -f gate_expected_phase_id="$phase" \
              -f gate_expected_milestone_id="$(jq -r '.watchdog.gate.expectedMilestoneId // empty' /tmp/switch-registration.json)"
          fi
      - name: Summary
        if: always()
        run: |
          echo 'Work relay never opens ChatGPT, runs tests or marks a phase PASS.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The receiving agent places its exact COMPLETE code as FIRST LINE of DELIVERY_COMMAND_v1.md.' >> "$GITHUB_STEP_SUMMARY"
  rearm:
    needs: relay
    if: always() && (github.event_name == 'schedule' || inputs.operation == 'sweep')
    concurrency:
      group: agent-delivery-watchdog-rearm-v1
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Select private Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh
      - name: Re-arm supervision while a nonterminal Agent Delivery campaign exists
        env:
          CONTRACT_AUTOMATION_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          count="$(node scripts/work-relay-v1.mjs --operation active-count)"
          if [ "$count" -eq 0 ]; then
            echo "No active Agent Delivery campaigns; stop rearm without an idle runner delay." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sleep 900
          count="$(node scripts/work-relay-v1.mjs --operation active-count)"
          if [ "$count" -gt 0 ]; then
            gh workflow run lite-work-relay-v1.yml --repo "$GITHUB_REPOSITORY" --ref main -f operation=sweep
            echo "Agent Delivery watchdog re-armed for $count nonterminal campaign(s)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No active Agent Delivery campaigns; watchdog re-arm stopped." >> "$GITHUB_STEP_SUMMARY"
          fi

