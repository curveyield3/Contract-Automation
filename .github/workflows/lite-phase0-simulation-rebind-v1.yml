name: Retired Phase 0 Randomized Simulation Rebind v2
# Legacy Phase 0 random simulation rebind has been retired and its workflow trigger removed.
# Historical implementations are preserved in curveyield3/archive/sim enabled simulator.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Explain retired Phase 0 rebind mechanism
        run: |
          echo "The old Phase 0 Medusa/ABI telemetry rebind is retired." >> "$GITHUB_STEP_SUMMARY"
          echo "Use the active Lite Phase 0 bootstrap with forked deploy/configuration simulation only." >> "$GITHUB_STEP_SUMMARY"
