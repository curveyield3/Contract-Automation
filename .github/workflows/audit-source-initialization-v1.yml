name: Audit Source Initialization v3

on:
  workflow_dispatch:
    inputs:
      single_agent_simulation:
        description: "Explicit test-only mode: one existing ChatGPT chat plays every reviewer, master, executor, and backup role"
        required: false
        default: false
        type: boolean
      delivery_transport:
        description: "ChatGPT instruction transport (original browser unchanged; Work uses campaign command file)"
        type: choice
        required: false
        default: GITHUB_BROWSER
        options: [GITHUB_BROWSER, CHATGPT_WORK]
      source_url:
        description: Optional direct ZIP file URL (mutually exclusive with scan_urls)
        required: false
        type: string
      scan_urls:
        description: "One or more Etherscan/KatanaScan contract page links, separated by newlines (instead of ZIP)"
        required: false
        type: string
      agent_chat_1_url:
        description: Existing ChatGPT conversation URL for reviewer-1
        required: true
        type: string
      agent_chat_2_url:
        description: Existing ChatGPT conversation URL for reviewer-2
        required: true
        type: string
      agent_chat_3_url:
        description: Existing ChatGPT conversation URL for reviewer-3L
        required: true
        type: string
      agent_chat_4_url:
        description: Existing ChatGPT conversation URL for reviewer-4
        required: true
        type: string
      master_chat_url:
        description: Persistent ChatGPT conversation URL for the Maximum master reviewer
        required: true
        type: string
      test_executor_chat_url:
        description: Dedicated ChatGPT conversation URL for the targeted-test executor
        required: true
        type: string
      backup_chat_url:
        description: Pre-created standby ChatGPT conversation for automatic reviewer failover
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'process/agent-upload/audit-source-initialization/*.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: audit-source-initialization
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve source and reviewer chat request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_URL: ${{ inputs.source_url }}
          DISPATCH_SCAN_URLS: ${{ inputs.scan_urls }}
          DISPATCH_SIMULATION: ${{ inputs.single_agent_simulation }}
          DISPATCH_DELIVERY_TRANSPORT: ${{ inputs.delivery_transport }}
          DISPATCH_CHAT_1_URL: ${{ inputs.agent_chat_1_url }}
          DISPATCH_CHAT_2_URL: ${{ inputs.agent_chat_2_url }}
          DISPATCH_CHAT_3_URL: ${{ inputs.agent_chat_3_url }}
          DISPATCH_CHAT_4_URL: ${{ inputs.agent_chat_4_url }}
          DISPATCH_MASTER_CHAT_URL: ${{ inputs.master_chat_url }}
          DISPATCH_TEST_EXECUTOR_CHAT_URL: ${{ inputs.test_executor_chat_url }}
          DISPATCH_BACKUP_CHAT_URL: ${{ inputs.backup_chat_url }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            source_url="$DISPATCH_URL"
            scan_urls="$(SCAN_INPUT="$DISPATCH_SCAN_URLS" python3 -c 'import os,json; s=os.environ.get("SCAN_INPUT",""); print(json.dumps([x.strip() for x in s.splitlines() if x.strip()],separators=(",",":")))')"
            agent_chat_1_url="$DISPATCH_CHAT_1_URL"
            agent_chat_2_url="$DISPATCH_CHAT_2_URL"
            agent_chat_3_url="$DISPATCH_CHAT_3_URL"
            agent_chat_4_url="$DISPATCH_CHAT_4_URL"
            master_chat_url="$DISPATCH_MASTER_CHAT_URL"
            test_executor_chat_url="$DISPATCH_TEST_EXECUTOR_CHAT_URL"
            backup_chat_url="$DISPATCH_BACKUP_CHAT_URL"
            single_agent_simulation="${DISPATCH_SIMULATION:-false}"
            delivery_transport="${DISPATCH_DELIVERY_TRANSPORT:-GITHUB_BROWSER}"
            request_id="dispatch-$GITHUB_RUN_ID"
          else
            mapfile -t requests < <(
              gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
                --jq '.files[]? | select(.status!="removed") | .filename | select(startswith("process/agent-upload/audit-source-initialization/") and endswith(".json"))'
            )
            [ "${#requests[@]}" -eq 1 ] || {
              echo "::error::Exactly one Audit Source Initialization request file must change per trigger."
              exit 1
            }
            request="${requests[0]}"
            source_url="$(jq -r '.source_url // empty' "$request")"
            scan_urls="$(jq -c 'if (.scan_urls // null) == null then [] elif (.scan_urls | type) == "array" then .scan_urls else [(.scan_urls | tostring)] end' "$request")"
            agent_chat_1_url="$(jq -r '.agent_chat_1_url // empty' "$request")"
            agent_chat_2_url="$(jq -r '.agent_chat_2_url // empty' "$request")"
            agent_chat_3_url="$(jq -r '.agent_chat_3_url // empty' "$request")"
            agent_chat_4_url="$(jq -r '.agent_chat_4_url // empty' "$request")"
            master_chat_url="$(jq -r '.master_chat_url // empty' "$request")"
            test_executor_chat_url="$(jq -r '.test_executor_chat_url // empty' "$request")"
            backup_chat_url="$(jq -r '.backup_chat_url // empty' "$request")"
            single_agent_simulation="$(jq -r '.single_agent_simulation // false' "$request")"
            delivery_transport="$(jq -r '.delivery_transport // "GITHUB_BROWSER"' "$request")"
            request_id="push-$GITHUB_SHA"
          fi

          if [ -n "$source_url" ] && [ "$scan_urls" != '[]' ]; then
            echo "::error::SOURCE_INPUT_CONFLICT: provide source_url OR scan_urls, never both"; exit 1
          fi
          if [ -z "$source_url" ] && [ "$scan_urls" = '[]' ]; then
            echo "::error::SOURCE_INPUT_MISSING: provide source_url or scan_urls"; exit 1
          fi
          echo "$scan_urls" | jq -e 'type=="array" and length>=0 and length<=64 and all(.[]; type=="string")' >/dev/null || {
            echo "::error::scan_urls must contain at most 64 strings"; exit 1
          }
          if printf '%s' "$source_url" | grep -q $'[\r\n]'; then
            echo "::error::source_url contains a line break"
            exit 1
          fi

          validate_chat_url() {
            local label="$1"
            local value="$2"
            test -n "$value" || { echo "::error::$label is required"; exit 1; }
            if printf '%s' "$value" | grep -q $'[\r\n]'; then
              echo "::error::$label contains a line break"
              exit 1
            fi
            if [[ "$value" =~ ^https://chatgpt\.com/c/[A-Za-z0-9_-]+/?$ ]]; then
              return 0
            fi
            if [[ "$value" =~ ^https://chatgpt\.com/g/g-p-[A-Za-z0-9_-]+/c/[A-Za-z0-9_-]+/?$ ]]; then
              return 0
            fi
            echo "::error::$label must be an existing durable ChatGPT conversation URL."
            exit 1
          }

          validate_chat_url agent_chat_1_url "$agent_chat_1_url"
          validate_chat_url agent_chat_2_url "$agent_chat_2_url"
          validate_chat_url agent_chat_3_url "$agent_chat_3_url"
          validate_chat_url agent_chat_4_url "$agent_chat_4_url"
          validate_chat_url master_chat_url "$master_chat_url"
          validate_chat_url test_executor_chat_url "$test_executor_chat_url"
          validate_chat_url backup_chat_url "$backup_chat_url"
          # Test-only explicit shared-chat operation. Production still requires
          # independent master, execution, and backup chats as before.
          [[ "$single_agent_simulation" == true || "$single_agent_simulation" == false ]] || {
            echo "::error::single_agent_simulation must be boolean"
            exit 1
          }
          [[ "$delivery_transport" == GITHUB_BROWSER || "$delivery_transport" == CHATGPT_WORK ]] || {
            echo "::error::delivery_transport must be GITHUB_BROWSER or CHATGPT_WORK"; exit 1;
          }
          if [ "$single_agent_simulation" = true ]; then
            for slot_url in "$agent_chat_2_url" "$agent_chat_3_url" "$agent_chat_4_url" "$master_chat_url" "$test_executor_chat_url" "$backup_chat_url"; do
              [ "$slot_url" = "$agent_chat_1_url" ] || {
                echo "::error::Single-agent simulation requires the same existing chat URL in ALL seven role slots"
                exit 1
              }
            done
            echo "::notice::Single-agent simulation: one chat accepts all roles; normal audit validation and automatic reviewer wakes remain enabled."
          else
          for reviewer_chat_url in "$agent_chat_1_url" "$agent_chat_2_url" "$agent_chat_3_url" "$agent_chat_4_url"; do
            [ "$master_chat_url" != "$reviewer_chat_url" ] || { echo "::error::master_chat_url must be distinct from every normal reviewer chat URL"; exit 1; }
            [ "$test_executor_chat_url" != "$reviewer_chat_url" ] || { echo "::error::test_executor_chat_url must be distinct from every normal reviewer chat URL"; exit 1; }
          done
          [ "$test_executor_chat_url" != "$master_chat_url" ] || { echo "::error::test_executor_chat_url must be distinct from master_chat_url"; exit 1; }
          for reserved_chat in "$agent_chat_1_url" "$agent_chat_2_url" "$agent_chat_3_url" "$agent_chat_4_url" "$master_chat_url" "$test_executor_chat_url"; do
            [ "$backup_chat_url" != "$reserved_chat" ] || { echo "::error::backup_chat_url must be a distinct unused chat"; exit 1; }
          done

          fi

          {
            echo "single_agent_simulation=$single_agent_simulation"
            echo "delivery_transport=$delivery_transport"
            echo "source_url=$source_url"
            echo "scan_urls=$scan_urls"
            echo "agent_chat_1_url=$agent_chat_1_url"
            echo "agent_chat_2_url=$agent_chat_2_url"
            echo "agent_chat_3_url=$agent_chat_3_url"
            echo "agent_chat_4_url=$agent_chat_4_url"
            echo "master_chat_url=$master_chat_url"
            echo "test_executor_chat_url=$test_executor_chat_url"
            echo "backup_chat_url=$backup_chat_url"
            echo "request_id=$request_id"
          } >> "$GITHUB_OUTPUT"

      - name: Select working Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Initialize audit source and Lite campaign
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRACT_AUTOMATION_TOKEN: ${{ github.token }}
          AUDIT_CONTROLLER_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          SOURCE_URL: ${{ steps.request.outputs.source_url }}
          SCAN_URLS: ${{ steps.request.outputs.scan_urls }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          AGENT_CHAT_1_URL: ${{ steps.request.outputs.agent_chat_1_url }}
          AGENT_CHAT_2_URL: ${{ steps.request.outputs.agent_chat_2_url }}
          AGENT_CHAT_3_URL: ${{ steps.request.outputs.agent_chat_3_url }}
          AGENT_CHAT_4_URL: ${{ steps.request.outputs.agent_chat_4_url }}
          MASTER_CHAT_URL: ${{ steps.request.outputs.master_chat_url }}
          TEST_EXECUTOR_CHAT_URL: ${{ steps.request.outputs.test_executor_chat_url }}
          BACKUP_CHAT_URL: ${{ steps.request.outputs.backup_chat_url }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          SINGLE_AGENT_SIMULATION: ${{ steps.request.outputs.single_agent_simulation }}
          DELIVERY_TRANSPORT: ${{ steps.request.outputs.delivery_transport }}
        shell: bash
        run: python3 scripts/audit-command-guard-v1.py --label audit-source-initialization --wall 1080 --idle 720 --log /tmp/audit-source-initialization-guard-v1.log -- bash scripts/audit-source-initialization/run-v1.sh
