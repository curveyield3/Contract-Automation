name: Audit Detection Rebuild Verify v1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adr-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies without scripts
        run: timeout -k 10s 360s npm ci --force --ignore-scripts --no-audit --no-fund
      - name: Program tests (adr-*)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Also carries the master targeted-test and command-guard checks from the retired
          # Lite Master Targeted Tests Regression workflow.
          files=(scripts/tests/adr-*.test.mjs packages/github-native-sim/test/adr-*.test.mjs scripts/tests/lite-master-targeted-tests-v1.test.mjs test/audit-command-guard-v1.test.mjs)
          if [ "${#files[@]}" -eq 0 ]; then echo "No adr tests yet"; exit 0; fi
          timeout -k 10s 900s node --test "${files[@]}"
      - name: Validate V7 runner manifest pin
        run: timeout -k 10s 120s npm run v7:manifest -- --check
      - name: Confirm retired Phase 0 fork has no active references
        shell: bash
        run: |
          set -euo pipefail
          unresolved=0
          while IFS= read -r file; do
            case "$file" in
              docs/*|.github/actions/setup-no*telemetry-node-cache/*|.github/actions/setup-no*telemetry-v7-toolchain/*|process/RUNNER_MANIFEST.json|packages/github-native-sim/src/v7-policy.mjs|packages/github-native-sim/test/*) ;;
              *) echo "::error::Retired fork reference remains in $file"; unresolved=1 ;;
            esac
          done < <(git grep -l "no""-telemetry" || true)
          test "$unresolved" = 0
      - name: Focused controller replay, shard and saved-state regression tests
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 10s 180s node --test \
            scripts/tests/lite-controller-delivery-replay-v1.test.mjs \
            scripts/tests/lite-controller-delivery-state-v1.test.mjs \
            packages/github-native-sim/test/lite-phase5-request-generation-v1.test.mjs \
            packages/github-native-sim/test/browser-backup-failover-v1.test.mjs \
            packages/github-native-sim/test/phase0-fork-state-reuse-v1.test.mjs \
            packages/github-native-sim/test/phase7-saved-state-preflight-v1.test.mjs \
            packages/github-native-sim/test/lite-work-shards-v1.test.mjs \
            scripts/tests/lite-v13-protected-shards-v1.test.mjs \
            packages/runner/test/anvil-engine-v1.test.mjs
      - name: Isolated real Anvil saved-state roundtrip (bounded)
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 5s 90s node --test packages/github-native-sim/test/phase0-fork-state-actual-anvil-v1.test.mjs
      - name: Existing controller regression tests
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 10s 900s node --test \
            packages/github-native-sim/test/lite-phase-packet-controller-integration-v1.test.mjs \
            packages/github-native-sim/test/lite-assignment-successor-v1.test.mjs \
            packages/github-native-sim/test/lite-phase5-execution-gate-v1.test.mjs \
            packages/github-native-sim/test/lite-phase-schema-policy-v1.test.mjs \
            packages/github-native-sim/test/source-intelligence-technical-v1.test.mjs \
            packages/github-native-sim/test/native-fuzz-v1.test.mjs \
            packages/github-native-sim/test/medusa-cli-output-v1.test.mjs \
            packages/github-native-sim/test/medusa-no-tests-real-output-v2.test.mjs \
            packages/github-native-sim/test/phase0-optimization4-v1.test.mjs \
            packages/github-native-sim/test/phase0-compiler-watchdog-30m-v1.test.mjs \
            packages/github-native-sim/test/phase0-private-build-cache-v1.test.mjs \
            packages/github-native-sim/test/v7-unified-test-qualification-v1.test.mjs \
            packages/github-native-sim/test/lite-phase0-automation-v2.test.mjs \
            packages/github-native-sim/test/phase0-stage2-balancer-stall-repair-v1.test.mjs \
            packages/github-native-sim/test/phase0-v2-consumers.test.mjs \
            scripts/tests/lite-master-targeted-tests-v1.test.mjs

  audit-controller-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validator dependencies before cross-repository authority checks
        run: timeout -k 10s 360s npm ci --force --ignore-scripts --no-audit --no-fund
      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh
      - name: Audit-Controller checks (no new failures versus main)
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        run: bash scripts/adr-audit-controller-checks-v1.sh

      - name: Frozen r4 real-data Phase5 and all 78 discovery regression
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 10s 360s npm ci --force --ignore-scripts --no-audit --no-fund
          (
            cd .ac-target
            git sparse-checkout add \
              'campaigns/cyavKATv25b r4/receipts/PHASE_00_RECEIPT_v1.json' \
              'campaigns/cyavKATv25b r4/work/phase-05/PHASE_05_WORK_FORM_v1.json' \
              'campaigns/cyavKATv25b r4/work/phase-04/discovery/' \
              'campaigns/cyavKATv25b r4/evidence/review-inventory/scope-corrected/REVIEW_INVENTORY_v1.json'
          )
          AC_R4_ROOT="$PWD/.ac-target" timeout -k 10s 240s node --test scripts/tests/adr-pr706-step1-r4-v1.test.mjs
          AC_R4_ROOT="$PWD/.ac-target" timeout -k 10s 240s node --test scripts/tests/adr-pr706-step5-r4-v1.test.mjs
