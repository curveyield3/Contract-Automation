name: Browser Agent Wake

on:
  workflow_dispatch:
    inputs:
      wake_id:
        required: true
        type: string
      campaign_id:
        required: true
        type: string
      phase_id:
        required: true
        type: string
      thinking_effort:
        description: ChatGPT reasoning effort to enforce before posting a wake
        required: false
        default: high
        type: choice
        options: [high, maximum]
      mode:
        required: true
        default: resume_existing
        type: choice
        options: [resume_existing]
      chat_url:
        required: false
        type: string
      wake_message_b64:
        required: true
        type: string
      watchdog_enabled:
        required: true
        default: true
        type: boolean
      worker_role:
        required: false
        default: reviewer
        type: choice
        options: [reviewer, interphase_mechanical, master_reviewer, test-executor, repair_child]
      watchdog_message_b64:
        required: false
        type: string
      gate_mode:
        required: false
        default: FULL_V26
        type: choice
        options: [FULL_V26, LITE]
      gate_repository:
        required: false
        default: curveyield3/Audit-Controller
        type: string
      gate_ref:
        required: false
        default: main
        type: string
      gate_state_path:
        required: false
        type: string
      gate_expected_phase_id:
        required: false
        type: string
      gate_expected_milestone_id:
        required: false
        type: string
      gate_active_pointer_path:
        required: false
        type: string
      gate_interphase_handoff_path:
        required: false
        type: string
      gate_interphase_work_packet_path:
        required: false
        type: string
      gate_interphase_completion_path:
        required: false
        type: string
      gate_interphase_work_packet_sha256:
        required: false
        type: string
      gate_stop_states_csv:
        required: false
        default: WAITING_FOR_HUMAN_RESPONSE,WAITING_FOR_SUCCESSOR_AGENT,CLOSED,STOPPED_BY_HUMAN
        type: string
      gate_stop_campaign_statuses_csv:
        required: false
        default: COMPLETE,CLOSED_INCOMPLETE,STOPPED_BY_HUMAN
        type: string
      runner_retry_attempt:
        description: Internal fresh-runner retry attempt counter
        required: false
        default: '0'
        type: string
      browser_context_b64:
        description: Optional Base64 JSON browser context for routine, project, chat, and repair policy
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  # Serialize wake and watchdog only for the same durable session.
  # Independent campaign chats have isolated browser processes and may run in parallel.
  group: chatgpt-browser-session-${{ inputs.wake_id }}
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      WAKE_ID: ${{ inputs.wake_id }}
      CAMPAIGN_ID: ${{ inputs.campaign_id }}
      PHASE_ID: ${{ inputs.phase_id }}
      CHATGPT_THINKING_EFFORT: ${{ inputs.thinking_effort }}
      WORKER_ROLE: ${{ inputs.worker_role }}
      WAKE_MODE: ${{ inputs.mode }}
      CHAT_URL: ${{ inputs.chat_url }}
      CHATGPT_STORAGE_STATE_B64: ${{ secrets.CHATGPT_STORAGE_STATE_B64 }}
      BROWSER_HEADLESS: 'false'
      DISPLAY: ':99'
      INTERACTIVE_VIEW_ENABLED: 'true'
      MANUAL_CHALLENGE_WAIT_MS: '900000'
      HOME_EXIT_NODE: ${{ vars.BROWSER_HOME_EXIT_NODE || '100.112.238.56' }}

    steps:
      - name: Checkout trusted Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Validate OIDC runner and browser session credentials
        shell: bash
        env:
          TS_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        run: |
          set -euo pipefail
          [ -n "$TS_CLIENT_ID" ] || { echo '::error::Missing TS_OAUTH_CLIENT_ID (Tailscale OIDC client ID)'; exit 1; }
          [ -n "$CHATGPT_STORAGE_STATE_B64" ] || { echo '::error::Missing CHATGPT_STORAGE_STATE_B64 for existing browser session'; exit 1; }
          echo 'OIDC identity and browser-session configuration present; no credentials printed.'
      - name: Select Audit-Controller credential
        if: inputs.gate_mode == 'LITE'
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Resolve idempotent reviewer wake
        if: inputs.worker_role == 'reviewer'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_MILESTONE: ${{ inputs.gate_expected_milestone_id }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_CHAT_URL: ${{ inputs.chat_url }}
        shell: bash
        run: |
          set -euo pipefail
          safe_campaign="$(printf '%s' "$CAMPAIGN_ID" | tr -c 'A-Za-z0-9._-' '_')"
          api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-wake/registrations/$safe_campaign.json"
          encoded="$(gh api "$api?ref=main" --jq '.content' 2>/dev/null || true)"
          [ -n "$encoded" ] || {
            echo "::error::Reviewer wake requires a current campaign browser registration."
            exit 1
          }
          printf '%s' "$encoded" | base64 -d > /tmp/existing-registration.json

          interaction_policy="$(jq -r '.browserInteractionPolicy // empty' /tmp/existing-registration.json)"
          [ "$interaction_policy" = "phase1-fixed-x11-normal-chrome-no-chatgpt-page-read-v1" ] || {
            echo "::error::Reviewer wake registration does not carry the required Phase-1 fixed X11 interaction policy."
            exit 1
          }

          [ "$REQUESTED_MODE" = "resume_existing" ] || {
            echo "::error::Reviewer wake must use resume_existing."
            exit 1
          }

          if [ -n "$REQUESTED_CHAT_URL" ]; then
            jq -e --arg chat "$REQUESTED_CHAT_URL" '[.agentChats[]?] | index($chat) != null' /tmp/existing-registration.json >/dev/null || {
              echo "::error::Requested reviewer chat is not one of the pre-created registered reviewer chats."
              exit 1
            }
          fi

            existing_milestone="$(jq -r '.activeAssignment.milestoneId // empty' /tmp/existing-registration.json)"
            existing_chat="$(jq -r '.activeChat.url // .chatUrl // empty' /tmp/existing-registration.json)"
            delivered_milestone="$(jq -r '.wakeDelivery.milestoneId // empty' /tmp/existing-registration.json)"
            delivered_chat="$(jq -r '.wakeDelivery.chatUrl // empty' /tmp/existing-registration.json)"
            if [ "$REQUESTED_MODE" = "resume_existing" ] \
              && [ "$delivered_milestone" = "$REQUESTED_MILESTONE" ] \
              && [ -n "$REQUESTED_CHAT_URL" ] \
              && [ "$delivered_chat" = "$REQUESTED_CHAT_URL" ]; then
              echo "Initial existing-chat wake already delivered for $CAMPAIGN_ID / $REQUESTED_MILESTONE; this run will use the watchdog poke message."
              echo "INITIAL_WAKE_DEDUPED=true" >> "$GITHUB_ENV"
            fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up isolated browser-agent runtime
        uses: ./.github/actions/setup-browser-agent-runtime

      # GitHub-hosted runners are fresh on each wake; reuse verified Ubuntu package
      # archives rather than re-downloading the same VNC/image utilities every run.
      # Rotate weekly to capture security updates without discarding prior packages.
      - name: Set private VNC APT cache epoch
        shell: bash
        run: echo "VNC_APT_CACHE_WEEK=$(date -u +%G-W%V)" >> "$GITHUB_ENV"

      - name: Restore private VNC APT package cache
        id: private-vnc-apt-cache
        uses: actions/cache/restore@v4
        with:
          # Cache packages only: APT lock and partial/ are root-owned and break tar.
          path: ~/.cache/browser-agent-vnc-apt/archives/*.deb
          key: browser-agent-vnc-apt-${{ runner.os }}-ubuntu24.04-v1-${{ env.VNC_APT_CACHE_WEEK }}
          restore-keys: |
            browser-agent-vnc-apt-${{ runner.os }}-ubuntu24.04-v1-

      - name: Install private VNC helper
        shell: bash
        run: |
          set -euo pipefail
          apt_archives="$HOME/.cache/browser-agent-vnc-apt/archives"
          mkdir -p "$apt_archives"
          chmod 755 "$apt_archives"
          # APT downloads as _apt; keep its scratch directory writable only by _apt.
          # Cache restore/save intentionally excludes partial/ and the root-owned lock.
          sudo install -d -o _apt -g root -m 0700 "$apt_archives/partial"
          sudo apt-get update -qq
          sudo apt-get \
            -o Dir::Cache::archives="$apt_archives" \
            -o APT::Keep-Downloaded-Packages=true \
            install -y x11vnc xclip xdotool scrot imagemagick
          echo "Reusable VNC APT archives: $(find "$apt_archives" -maxdepth 1 -type f -name '*.deb' | wc -l) packages"

      # Save now: browser delivery may fail later, but its APT download can still be reused.
      - name: Save private VNC APT package cache
        if: steps.private-vnc-apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          # Cache packages only: APT lock and partial/ are root-owned and break tar.
          path: ~/.cache/browser-agent-vnc-apt/archives/*.deb
          key: browser-agent-vnc-apt-${{ runner.os }}-ubuntu24.04-v1-${{ env.VNC_APT_CACHE_WEEK }}

      - name: Record runner egress before home exit node
        shell: bash
        run: |
          set -euo pipefail
          direct="$(curl -fsS --max-time 15 https://api.ipify.org)"
          test -n "$direct"
          printf '%s' "$direct" | sha256sum | awk '{print "DIRECT_EGRESS_HASH="$1}' >> "$GITHUB_ENV"
          echo "Recorded runner egress fingerprint without logging the address."

      - name: Connect runner to tailnet
        uses: ./.github/actions/connect-browser-tailnet-oidc
        with:
          client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tag: tag:audit-browser
          ping: ${{ env.HOME_EXIT_NODE }}

      - name: Start visible Chrome display and private tailnet VNC
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension RANDR >/tmp/xvfb-browser-agent.log 2>&1 &
          echo $! >/tmp/xvfb-browser-agent.pid
          for i in {1..20}; do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 1
          done
          xdpyinfo -display :99 >/dev/null 2>&1 || { cat /tmp/xvfb-browser-agent.log || true; exit 1; }
          ts_ip="$(tailscale ip -4 | head -n1)"
          test -n "$ts_ip"
          echo "TAILSCALE_RUNNER_IP=$ts_ip" >> "$GITHUB_ENV"
          x11vnc -display :99 -rfbport 5900 -listen "$ts_ip" -nopw -forever -shared -quiet >/tmp/x11vnc-browser-agent.log 2>&1 &
          echo $! >/tmp/x11vnc-browser-agent.pid
          echo "TAILSCALE_VNC=$ts_ip:5900"

      - name: Route browser phase through home exit node
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 3s 10s tailscale status
          timeout -k 5s 20s sudo tailscale set --exit-node="$HOME_EXIT_NODE"
          changed=false
          for i in {1..8}; do
            current="$(curl -fsS --connect-timeout 3 --max-time 5 https://api.ipify.org || true)"
            if [ -n "$current" ]; then
              current_hash="$(printf '%s' "$current" | sha256sum | awk '{print $1}')"
              if [ "$current_hash" != "$DIRECT_EGRESS_HASH" ]; then changed=true; break; fi
            fi
            sleep 2
          done
          [ "$changed" = true ] || { echo "::error::Tailscale exit node did not change runner egress."; exit 1; }
          echo "HOME_EXIT_EGRESS_ACTIVE=true"

      - name: Decode wake messages
        env:
          WAKE_MESSAGE_B64: ${{ inputs.wake_message_b64 }}
          WATCHDOG_MESSAGE_B64: ${{ inputs.watchdog_message_b64 }}
          BROWSER_CONTEXT_B64: ${{ inputs.browser_context_b64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${BROWSER_CONTEXT_B64:-}" ]; then
            printf '%s' "$BROWSER_CONTEXT_B64" | base64 -d > /tmp/browser-context.json
          else
            printf '{}\n' > /tmp/browser-context.json
          fi
          message_purpose="$(jq -r '.messagePurpose // "standard"' /tmp/browser-context.json)"

          # Preserve caller-authored reviewer, phase-continuation, master-review
          # and rework messages. Only explicit watchdog messages use the fixed poke.
          if [ "$message_purpose" = "watchdog_poke" ] || { [ "$message_purpose" = "initial_wake" ] && [ "${INITIAL_WAKE_DEDUPED:-false}" = "true" ]; }; then
            printf '%s\n' 'GET BACK TO WORK' > /tmp/wake-message.txt
          else
            printf '%s' "$WAKE_MESSAGE_B64" | base64 -d > /tmp/wake-message.txt
            test -s /tmp/wake-message.txt
          fi
          # Mandatory current infrastructure notice for EVERY substantive Lite
          # reviewer/master/test-executor wake; preserves the caller's first-action
          # ACK and skips pure watchdog pokes.
          if [ "${{ inputs.gate_mode }}" = 'LITE' ] \
            && [ "${{ inputs.gate_repository }}" = 'curveyield3/Audit-Controller' ] \
            && [ "$(cat /tmp/wake-message.txt)" != 'GET BACK TO WORK' ] \
            && ! grep -q 'docs/BROWSER_AGENT_BLOCKCHAIN_WORKSTATION_v1.md' /tmp/wake-message.txt; then
            printf '\n\n%s\n' 'REQUIRED LIVE-FORK ROUTING: The bound Lite skill remains frozen. For all simulation design, technical execution or recovery, read curveyield3/Contract-Automation/docs/BROWSER_AGENT_BLOCKCHAIN_WORKSTATION_v1.md (Anvil/RPC rule and phase table). Use only curveyield3/Audit-Controller and curveyield3/Contract-Automation. The authenticated archive is GitHub Actions secret RPC_ETHEREUM mapped to ETHEREUM_FORK_RPC_URL, which feeds a verified chain-1 historical, pinned-block/hash, writable LOCAL Anvil fork. Never use synthetic fixtures, bare Anvil or public RPC as historical audit evidence. Tests/boundary reruns require explicit audit-owner authorization; the registered executor runs approved tests and the reviewer interprets their raw evidence.' >> /tmp/wake-message.txt
          fi
          printf '%s\n' 'GET BACK TO WORK' > /tmp/watchdog-message.txt

          # Every substantive Lite reviewer/master-reviewer wake requires a check-in,
          # including phase continuation, handoff, and rework. Pure GET BACK TO WORK
          # messages are pokes and never require acknowledgement.
          echo 'WAKE_ACK_PATH=' >> "$GITHUB_ENV"
          echo 'WAKE_ACK_ID=' >> "$GITHUB_ENV"
          if [ "$(cat /tmp/wake-message.txt)" != 'GET BACK TO WORK' ] \
            && [ "${{ inputs.gate_mode }}" = 'LITE' ] \
            && [[ "$WORKER_ROLE" == 'reviewer' || "$WORKER_ROLE" == 'master_reviewer' || "$WORKER_ROLE" == 'test-executor' ]] \
            && [ "${{ inputs.gate_repository }}" = 'curveyield3/Audit-Controller' ]; then
            token="${AUDIT_CONTROLLER_GITHUB_TOKEN:-}"
            gate_ref="${{ inputs.gate_ref }}"
            [ -n "$gate_ref" ] || gate_ref=main
            safe_campaign="$(printf '%s' "$CAMPAIGN_ID" | tr -c 'A-Za-z0-9._-' '_')"
            registration_api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-wake/registrations/$safe_campaign.json?ref=main"
            registration_b64="$(GH_TOKEN="${{ github.token }}" gh api "$registration_api" --jq '.content' 2>/dev/null || true)"
            registration_json="$(printf '%s' "$registration_b64" | base64 -d 2>/dev/null || true)"
            reviewer="$(printf '%s' "$registration_json" | jq -r --arg chat "$CHAT_URL" '
              if .singleAgentSimulation==true then
                . as $r | .activeAssignment.reviewer as $role |
                if ($role|type)=="string" and $r.agentChats[$role]==$chat then $role else empty end
              else [.agentChats // {} | to_entries[] | select(.value==$chat) | .key] |
                if length==1 then .[0] else empty end end' 2>/dev/null || true)"
            gate_path="${{ inputs.gate_state_path }}"
            if [ -z "$gate_path" ]; then
              gate_path="$(printf '%s' "$registration_json" | jq -r '.watchdog.gate.statePath // empty' 2>/dev/null || true)"
            fi
            if [ -n "$token" ] && [ -n "$reviewer" ] && [[ "$gate_path" == "Audit Campaign Directory/campaigns/"*.json ]]; then
              encoded_gate="${gate_path// /%20}"
              encoded="$(GH_TOKEN="$token" gh api "repos/curveyield3/Audit-Controller/contents/$encoded_gate?ref=$gate_ref" --jq '.content' 2>/dev/null || true)"
              workspace="$(printf '%s' "$encoded" | base64 -d 2>/dev/null | jq -r --arg campaign "$CAMPAIGN_ID" 'select(.campaignId==$campaign) | .workspacePath // empty' 2>/dev/null || true)"
              if [[ "$workspace" == campaigns/* ]] && [[ "$reviewer" =~ ^(reviewer-[1234]|reviewer-3L|master-reviewer|test-executor)$ ]]; then
                ack_file="$workspace/work/browser/WAKE_ACK_${reviewer}_v1.json"
                ack_id="$WAKE_ID/$GITHUB_RUN_ID"
                # ackId already binds wake and run; the reviewer is bound by the file path.
                ack_payload="$(jq -cn --arg id "$ack_id" '{ack:$id}')"
                {
                  echo "FIRST, before anything else: write exactly $ack_payload as the whole file $ack_file on curveyield3/Audit-Controller branch $gate_ref (update with its current SHA if it exists, create it only on 404, stop on any other error)."
                  echo 'Do nothing else until that write succeeds, then follow the instructions below.'
                  echo
                  cat /tmp/wake-message.txt
                } > /tmp/reviewer-wake-with-ack.txt
                mv /tmp/reviewer-wake-with-ack.txt /tmp/wake-message.txt
                echo "WAKE_ACK_PATH=$ack_file" >> "$GITHUB_ENV"
                echo "WAKE_ACK_ID=$ack_id" >> "$GITHUB_ENV"
                echo "WAKE_ACK_REVIEWER=$reviewer" >> "$GITHUB_ENV"
              else
                echo '::error::Reviewer wake could not resolve the exact campaign workspace or registered chat identity; no message was sent.'
                exit 1
              fi
            else
              echo '::error::Reviewer wake requires an accessible Audit-Controller directory, registered chat, and credential; no message was sent.'
              exit 1
            fi
          fi
          jq -e '
            type=="object"
            and ((.routineId // "")|type=="string")
            and ((.projectName // "")|type=="string")
            and ((.projectUrl // "")|type=="string")
            and ((.chatName // "")|type=="string")
            and ((.repair // {})|type=="object")
            and ((.requestedModel // "PRESERVE")=="PRESERVE" or (.requestedModel // "PRESERVE")=="MASTER" or (.requestedModel // "PRESERVE")=="SOL")
            and ((.messagePurpose // "standard")=="standard" or (.messagePurpose // "standard")=="watchdog_poke" or (.messagePurpose // "standard")=="repair_notice" or (.messagePurpose // "standard")=="repair_verification" or (.messagePurpose // "standard")=="initial_wake")
            and (((.routineId // "") | test("[\\r\\n]")) | not)
            and (((.projectName // "") | test("[\\r\\n]")) | not)
            and (((.projectUrl // "") | test("[\\r\\n]")) | not)
            and (((.chatName // "") | test("[\\r\\n]")) | not)
          ' /tmp/browser-context.json >/dev/null

          echo "WAKE_MESSAGE_PURPOSE=$message_purpose" >> "$GITHUB_ENV"
          if [ "$(cat /tmp/wake-message.txt)" = 'GET BACK TO WORK' ]; then
            echo 'WAKE_IS_POKE=true' >> "$GITHUB_ENV"
          else
            echo 'WAKE_IS_POKE=false' >> "$GITHUB_ENV"
          fi
          echo "WAKE_DIAGNOSTIC_ONLY=$(jq -r '.diagnosticOnly // false' /tmp/browser-context.json)" >> "$GITHUB_ENV"

          {
            echo "BROWSER_ROUTINE_ID=$(jq -r '.routineId // empty' /tmp/browser-context.json)"
            echo "CHATGPT_PROJECT_NAME=$(jq -r '.projectName // empty' /tmp/browser-context.json)"
            echo "CHATGPT_PROJECT_URL=$(jq -r '.projectUrl // empty' /tmp/browser-context.json)"
            echo "CHATGPT_CHAT_NAME=$(jq -r '.chatName // empty' /tmp/browser-context.json)"
            echo "CHATGPT_REQUESTED_MODEL=$(jq -r '.requestedModel // "PRESERVE"' /tmp/browser-context.json)"
            echo "REPAIR_ENABLED=$(jq -r '.repair.enabled // false' /tmp/browser-context.json)"
            echo "REPAIR_IDLE_POKE_THRESHOLD=$(jq -r '.repair.idlePokeThreshold // 3' /tmp/browser-context.json)"
            echo "REPAIR_UNVIEWABLE_THRESHOLD=$(jq -r '.repair.unviewableThreshold // 2' /tmp/browser-context.json)"
          } >> "$GITHUB_ENV"

      - name: Deliver wake through normal Chrome Phase-1 X11 path
        id: deliver
        shell: bash
        run: |
          set -euo pipefail
          export WAKE_MESSAGE="$(cat /tmp/wake-message.txt)"
          export WAKE_RESULT_PATH='/tmp/browser-agent-wake-result.json'
          bash scripts/browser-deliver-message-v1.sh > /tmp/deliver.out
          cat /tmp/deliver.out >> "$GITHUB_OUTPUT"
          ok="$(sed -n 's/^ok=//p' /tmp/deliver.out)"
          rc="$(sed -n 's/^rc=//p' /tmp/deliver.out)"
          retryable="$(jq -r '[.failures[]? | select(.retryable==true)] | length > 0' "$WAKE_RESULT_PATH")"
          retry_code="$(jq -r '[.failures[]? | select(.retryable==true) | .code][0] // empty' "$WAKE_RESULT_PATH")"
          echo "retryable=$retryable" >> "$GITHUB_OUTPUT"
          echo "retry_code=$retry_code" >> "$GITHUB_OUTPUT"
          echo "chat_url=$(jq -r '.chatUrl // .after.url // .url // empty' "$WAKE_RESULT_PATH")" >> "$GITHUB_OUTPUT"
          echo "provider=$(jq -r '.provider // empty' "$WAKE_RESULT_PATH")" >> "$GITHUB_OUTPUT"
          echo "assistant_count=$(jq -r '.after.assistantCount // .assistantCount // 0' "$WAKE_RESULT_PATH")" >> "$GITHUB_OUTPUT"
          echo "last_hash=$(jq -r '.after.lastAssistantHash // .lastAssistantHash // empty' "$WAKE_RESULT_PATH")" >> "$GITHUB_OUTPUT"
          if [ "$ok" != true ]; then
            echo "::warning::Browser wake did not complete on this runner (retryable=$retryable code=$retry_code rc=$rc)."
          fi

      - name: Disable home exit node
        if: always()
        shell: bash
        run: |
          set +e
          timeout -k 5s 20s sudo tailscale set --exit-node=""
          echo "Home exit-node routing disabled for post-browser workflow steps."

      - name: Await first-action reviewer check-in for substantive wake
        id: receipt
        if: env.WAKE_ACK_PATH != '' && (steps.deliver.outputs.ok == 'true' || steps.deliver.outputs.send_attempted == 'true')
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'verified=false' >> "$GITHUB_OUTPUT"
          ack_ref="${{ inputs.gate_ref }}"
          [ -n "$ack_ref" ] || ack_ref=main
          ack_url="repos/curveyield3/Audit-Controller/contents/${WAKE_ACK_PATH// /%20}?ref=$ack_ref"
          for i in $(seq 0 10); do
            encoded="$(gh api "$ack_url" --jq '.content' 2>/dev/null || true)"
            if [ -n "$encoded" ] && printf '%s' "$encoded" | base64 -d 2>/dev/null \
              | jq -e --arg id "$WAKE_ACK_ID" '.ack==$id' >/dev/null 2>&1; then
              echo 'verified=true' >> "$GITHUB_OUTPUT"
              echo "Reviewer wake $WAKE_ID independently confirmed by matching GitHub check-in." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$i" -lt 10 ]; then sleep 30; fi
          done
          echo "::warning::No matching reviewer check-in within 5 minutes (11 checks, 30-second interval). Delivery remains UNCONFIRMED; no duplicate wake is dispatched."
          echo 'Reviewer wake unconfirmed after 5 minutes; browser visual send evidence is not proof of reception.' >> "$GITHUB_STEP_SUMMARY"

      - name: Record delivered controller result only after exact first-action acknowledgement
        if: steps.receipt.outputs.verified == 'true'
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          ACKED_WAKE_ID: ${{ inputs.wake_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ACKED_WAKE_ID" != "$CAMPAIGN_ID-delivery-"* ]]; then exit 0; fi
          [[ "$WAKE_ACK_PATH" == campaigns/*/work/browser/WAKE_ACK_*_v1.json ]] || {
            echo "::error::Exact wake ack path required to mark delivered"; exit 1;
          }
          campaign="${WAKE_ACK_PATH%/work/browser/*}"
          api="repos/curveyield3/Audit-Controller/contents/${campaign// /%20}/controller/delivery/DELIVERY_LEDGER_v1.json"
          for attempt in 1 2 3; do
            response="$(gh api "$api?ref=${{ inputs.gate_ref }}" )"
            sha="$(printf '%s' "$response" | jq -r '.sha')"
            printf '%s' "$response" | jq -r '.content' | base64 -d > /tmp/phase-delivery-ledger.json
            node --input-type=module -e '
              import fs from "node:fs";
              import {advanceDeliveryStateV1} from "./scripts/lib/lite-controller-delivery-state-v1.mjs";
              const original=JSON.parse(fs.readFileSync("/tmp/phase-delivery-ledger.json","utf8"));
              if(original.campaignId!==process.argv[1])throw Error("wrong campaign on delivered result");
              const entry=Object.values(original.results??{}).find(x=>x.wakeId===process.env.ACKED_WAKE_ID);
              if(!entry)throw Error("acknowledged result missing in controller ledger");
              const updated=advanceDeliveryStateV1({
                ledger:original,resultSha256:entry.resultSha256,wakeId:process.env.ACKED_WAKE_ID,
                to:"DELIVERED",now:new Date().toISOString()
              });
              fs.writeFileSync("/tmp/phase-delivery-ledger-next.json",JSON.stringify(updated,null,2)+"\n");
            ' "$CAMPAIGN_ID"
            encoded="$(base64 -w0 /tmp/phase-delivery-ledger-next.json)"
            if gh api --method PUT "$api" -f branch="${{ inputs.gate_ref }}" \
                -f message="audit(delivery): acknowledge $CAMPAIGN_ID $ACKED_WAKE_ID" \
                -f sha="$sha" -f content="$encoded" >/dev/null; then
              echo "Verified delivered controller wake $ACKED_WAKE_ID" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::error::Unable to persist acknowledged controller delivery" >&2
          exit 1

      - name: Dispatch fresh-runner retry for retryable pre-post failure
        id: fresh-runner-retry
        if: steps.deliver.outputs.ok != 'true' && steps.deliver.outputs.retryable == 'true' && steps.deliver.outputs.send_attempted != 'true' && steps.receipt.outputs.verified != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_INPUTS_JSON: ${{ toJSON(inputs) }}
        shell: bash
        run: |
          set -euo pipefail
          attempt='${{ inputs.runner_retry_attempt }}'
          max=3
          [[ "$attempt" =~ ^[0-9]+$ ]] || attempt=0

          if [ "$attempt" -ge "$max" ]; then
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Fresh-runner retry budget exhausted at attempt $attempt/$max."
            exit 0
          fi

          next=$((attempt + 1))
          retry_inputs="$(printf '%s' "$RETRY_INPUTS_JSON" | jq -c --arg next "$next" --arg max "$max" '
            with_entries(.value |= tostring)
            | .runner_retry_attempt=$next
          ')"

          printf '%s\n' "$retry_inputs" | gh workflow run browser-agent-wake.yml             --repo "$GITHUB_REPOSITORY"             --ref main             --json

          echo "dispatched=true" >> "$GITHUB_OUTPUT"
          echo "next_attempt=$next" >> "$GITHUB_OUTPUT"
          echo "Fresh-runner retry $next/$max dispatched for $WAKE_ID after ${{ steps.deliver.outputs.retry_code }}." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail terminal browser wake
        if: steps.deliver.outputs.ok != 'true' && steps.deliver.outputs.send_attempted != 'true' && steps.receipt.outputs.verified != 'true' && steps.fresh-runner-retry.outputs.dispatched != 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq '{ok,wakeId,failures}' /tmp/browser-agent-wake-result.json
          exit 1

      - name: Create watchdog state
        if: ${{ inputs.watchdog_enabled && (steps.receipt.outputs.verified == 'true' || steps.deliver.outputs.ok == 'true' || steps.deliver.outputs.send_attempted == 'true') }}
        env:
          CHAT_URL_RESOLVED: ${{ steps.deliver.outputs.chat_url }}
          PROVIDER: ${{ steps.deliver.outputs.provider }}
          ASSISTANT_COUNT: ${{ steps.deliver.outputs.assistant_count }}
          LAST_HASH: ${{ steps.deliver.outputs.last_hash }}
          GATE_MODE: ${{ inputs.gate_mode }}
          GATE_REPOSITORY: ${{ inputs.gate_repository }}
          GATE_REF: ${{ inputs.gate_ref }}
          GATE_STATE_PATH: ${{ inputs.gate_state_path }}
          GATE_EXPECTED_PHASE_ID: ${{ inputs.gate_expected_phase_id }}
          GATE_EXPECTED_MILESTONE_ID: ${{ inputs.gate_expected_milestone_id }}
          GATE_ACTIVE_POINTER_PATH: ${{ inputs.gate_active_pointer_path }}
          GATE_INTERPHASE_HANDOFF_PATH: ${{ inputs.gate_interphase_handoff_path }}
          GATE_INTERPHASE_WORK_PACKET_PATH: ${{ inputs.gate_interphase_work_packet_path }}
          GATE_INTERPHASE_COMPLETION_PATH: ${{ inputs.gate_interphase_completion_path }}
          GATE_INTERPHASE_WORK_PACKET_SHA256: ${{ inputs.gate_interphase_work_packet_sha256 }}
          GATE_STOP_STATES_CSV: ${{ inputs.gate_stop_states_csv }}
          GATE_STOP_CAMPAIGN_STATUSES_CSV: ${{ inputs.gate_stop_campaign_statuses_csv }}
          REPAIR_ENABLED: ${{ env.REPAIR_ENABLED }}
          REPAIR_IDLE_POKE_THRESHOLD: ${{ env.REPAIR_IDLE_POKE_THRESHOLD }}
          REPAIR_UNVIEWABLE_THRESHOLD: ${{ env.REPAIR_UNVIEWABLE_THRESHOLD }}
          WAKE_ACK_PATH: ${{ env.WAKE_ACK_PATH }}
          WAKE_ACK_ID: ${{ env.WAKE_ACK_ID }}
          WAKE_ACK_REVIEWER: ${{ env.WAKE_ACK_REVIEWER }}
          ACKNOWLEDGEMENT_VERIFIED: ${{ steps.receipt.outputs.verified }}
        shell: bash
        run: |
          set -euo pipefail
          safe_id="$(printf '%s' "$WAKE_ID" | tr -c 'A-Za-z0-9._-' '_')"
          # A substantive wake the reviewer has not acknowledged may never have reached it (a busy
          # chat can drop it). Arm the watchdog anyway and make its poke repeat the whole wake, so
          # the reviewer gets its instructions instead of a bare GET BACK TO WORK.
          if [ -n "$WAKE_ACK_PATH" ] && [ "$ACKNOWLEDGEMENT_VERIFIED" != 'true' ]; then
            cp /tmp/wake-message.txt /tmp/watchdog-message.txt
          fi
          jq -n \
            --arg schemaVersion 'curveyield-browser-agent-watchdog-state-v1' \
            --arg wakeId "$WAKE_ID" \
            --arg campaignId "$CAMPAIGN_ID" \
            --arg phaseId "$PHASE_ID" \
            --arg workerRole "$WORKER_ROLE" \
            --arg chatUrl "$CHAT_URL_RESOLVED" \
            --arg provider "$PROVIDER" \
            --arg armedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg idleMessage "$(cat /tmp/watchdog-message.txt)" \
            --arg gateMode "$GATE_MODE" \
            --arg gateRepository "$GATE_REPOSITORY" \
            --arg gateRef "$GATE_REF" \
            --arg gateStatePath "$GATE_STATE_PATH" \
            --arg gateExpectedPhaseId "$GATE_EXPECTED_PHASE_ID" \
            --arg gateExpectedMilestoneId "$GATE_EXPECTED_MILESTONE_ID" \
            --arg gateActivePointerPath "$GATE_ACTIVE_POINTER_PATH" \
            --arg gateInterphaseHandoffPath "$GATE_INTERPHASE_HANDOFF_PATH" \
            --arg gateInterphaseWorkPacketPath "$GATE_INTERPHASE_WORK_PACKET_PATH" \
            --arg gateInterphaseCompletionPath "$GATE_INTERPHASE_COMPLETION_PATH" \
            --arg gateInterphaseWorkPacketSha256 "$GATE_INTERPHASE_WORK_PACKET_SHA256" \
            --arg gateStopStatesCsv "$GATE_STOP_STATES_CSV" \
            --arg gateStopCampaignStatusesCsv "$GATE_STOP_CAMPAIGN_STATUSES_CSV" \
            --arg repairEnabled "$REPAIR_ENABLED" \
            --arg repairIdlePokeThreshold "$REPAIR_IDLE_POKE_THRESHOLD" \
            --arg repairUnviewableThreshold "$REPAIR_UNVIEWABLE_THRESHOLD" \
            --arg lastHash "$LAST_HASH" \
            --arg ackPath "$WAKE_ACK_PATH" \
            --arg ackId "$WAKE_ACK_ID" \
            --arg acknowledgementVerified "$ACKNOWLEDGEMENT_VERIFIED" \
            --arg wakeAckReviewer "$WAKE_ACK_REVIEWER" \
            --argjson assistantCount "${ASSISTANT_COUNT:-0}" \
            '{
              schemaVersion:$schemaVersion,wakeId:$wakeId,campaignId:$campaignId,phaseId:$phaseId,workerRole:$workerRole,
              status:"ACTIVE",chatUrl:$chatUrl,lastProvider:$provider,armedAt:$armedAt,intervalMinutes:5,
              pokeIntervalMinutes:(if $wakeAckReviewer=="master-reviewer" and $acknowledgementVerified!="true" then 10 else 40 end),
              deliveryConfirmed:($acknowledgementVerified=="true"),ackPath:$ackPath,ackId:$ackId,
              idleMessage:$idleMessage,
              observation:{assistantCount:$assistantCount,lastAssistantHash:$lastHash,observedAt:$armedAt},
              gate:{
                mode:$gateMode,
                repository:$gateRepository,
                ref:$gateRef,
                statePath:$gateStatePath,
                expectedPhaseId:$gateExpectedPhaseId,
                expectedMilestoneId:$gateExpectedMilestoneId,
                activePointerPath:$gateActivePointerPath,
                interphase:{
                  handoffPath:$gateInterphaseHandoffPath,
                  workPacketPath:$gateInterphaseWorkPacketPath,
                  completionPath:$gateInterphaseCompletionPath,
                  workPacketSha256:$gateInterphaseWorkPacketSha256
                },
                stopStates:($gateStopStatesCsv|split(",")|map(gsub("^ +| +$";""))),
                stopCampaignStatuses:($gateStopCampaignStatusesCsv|split(",")|map(gsub("^ +| +$";"")))
              },
              repair:{
                enabled:($repairEnabled=="true"),
                idlePokeThreshold:(($repairIdlePokeThreshold|tonumber?) // 3),
                unviewableThreshold:(($repairUnviewableThreshold|tonumber?) // 2),
                consecutiveIdlePokes:0,
                consecutiveUnviewable:0
              }
            }' > "/tmp/$safe_id.json"
          echo "WATCHDOG_STATE=/tmp/$safe_id.json" >> "$GITHUB_ENV"
          echo "WATCHDOG_SAFE_ID=$safe_id" >> "$GITHUB_ENV"

      - name: Persist watchdog state
        if: ${{ inputs.watchdog_enabled && (steps.receipt.outputs.verified == 'true' || steps.deliver.outputs.ok == 'true' || steps.deliver.outputs.send_attempted == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          content="$(base64 -w0 "$WATCHDOG_STATE")"
          api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-watchdog/active/$WATCHDOG_SAFE_ID.json"
          existing="$(gh api "$api?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            gh api --method PUT "$api" -f message="chore(watchdog): refresh $WAKE_ID" -f content="$content" -f sha="$existing" -f branch=main >/dev/null
          else
            gh api --method PUT "$api" -f message="chore(watchdog): arm $WAKE_ID" -f content="$content" -f branch=main >/dev/null
          fi
          # One watchdog target per campaign chat: this wake supersedes older targets for the
          # same campaign and chat, so a reviewer is never poked by several stale targets.
          campaign="$(jq -r '.campaignId' "$WATCHDOG_STATE")"; chat="$(jq -r '.chatUrl' "$WATCHDOG_STATE")"
          for name in $(gh api "repos/$GITHUB_REPOSITORY/contents/process/browser-agent-watchdog/active?ref=main" --jq '.[].name' 2>/dev/null || true); do
            [ "$name" != "$WATCHDOG_SAFE_ID.json" ] || continue
            other_api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-watchdog/active/$name"
            other="$(gh api "$other_api?ref=main" 2>/dev/null || true)"
            [ -n "$other" ] || continue
            body="$(printf '%s' "$other" | jq -r '.content' | base64 -d 2>/dev/null || true)"
            if [ "$(printf '%s' "$body" | jq -r '.campaignId // empty')" = "$campaign" ] && [ "$(printf '%s' "$body" | jq -r '.chatUrl // empty')" = "$chat" ]; then
              gh api --method DELETE "$other_api" -f message="chore(watchdog): superseded by $WAKE_ID" -f sha="$(printf '%s' "$other" | jq -r '.sha')" -f branch=main >/dev/null || true
            fi
          done

      - name: Persist existing-chat reviewer wake into campaign registration
        if: ${{ inputs.mode == 'resume_existing' && inputs.worker_role == 'reviewer' && env.WAKE_IS_POKE != 'true' && (steps.receipt.outputs.verified == 'true' || (env.WAKE_ACK_PATH == '' && steps.deliver.outputs.ok == 'true')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVED_CHAT_URL: ${{ steps.deliver.outputs.chat_url }}
          CURRENT_REVIEWER: ${{ env.CHATGPT_CHAT_NAME }}
          CURRENT_PHASE_ID: ${{ inputs.phase_id }}
          CURRENT_MILESTONE_ID: ${{ inputs.gate_expected_milestone_id }}
          CURRENT_THINKING_EFFORT: ${{ inputs.thinking_effort }}
          CURRENT_GATE_MODE: ${{ inputs.gate_mode }}
          CURRENT_GATE_REPOSITORY: ${{ inputs.gate_repository }}
          CURRENT_GATE_REF: ${{ inputs.gate_ref }}
          CURRENT_GATE_STATE_PATH: ${{ inputs.gate_state_path }}
          CURRENT_GATE_POINTER_PATH: ${{ inputs.gate_active_pointer_path }}
          WAKE_ACK_ID: ${{ env.WAKE_ACK_ID }}
          WAKE_ACK_REVIEWER: ${{ env.WAKE_ACK_REVIEWER }}
          ACKNOWLEDGEMENT_VERIFIED: ${{ steps.receipt.outputs.verified }}
        shell: bash
        run: |
          set -euo pipefail
          safe_campaign="$(printf '%s' "$CAMPAIGN_ID" | tr -c 'A-Za-z0-9._-' '_')"
          api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-wake/registrations/$safe_campaign.json"
          gh api "$api?ref=main" --jq '.content' | base64 -d > /tmp/existing-chat-registration.json
          delivered_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ -n "$WAKE_ACK_REVIEWER" ]; then
            CURRENT_REVIEWER="$WAKE_ACK_REVIEWER"
          elif [ -z "$CURRENT_REVIEWER" ]; then
            CURRENT_REVIEWER="$(jq -r '.activeChat.name // .activeAssignment.reviewer // empty' /tmp/existing-chat-registration.json)"
          fi

          jq \
            --arg url "$RESOLVED_CHAT_URL" \
            --arg reviewer "$CURRENT_REVIEWER" \
            --arg phaseId "$CURRENT_PHASE_ID" \
            --arg milestoneId "$CURRENT_MILESTONE_ID" \
            --arg workerRole "$WORKER_ROLE" \
            --arg thinkingEffort "$CURRENT_THINKING_EFFORT" \
            --arg wakeMessage "$(cat /tmp/wake-message.txt)" \
            --arg idleMessage "$(cat /tmp/watchdog-message.txt)" \
            --arg gateMode "$CURRENT_GATE_MODE" \
            --arg gateRepository "$CURRENT_GATE_REPOSITORY" \
            --arg gateRef "$CURRENT_GATE_REF" \
            --arg gateStatePath "$CURRENT_GATE_STATE_PATH" \
            --arg gatePointerPath "$CURRENT_GATE_POINTER_PATH" \
            --arg deliveredAt "$delivered_at" \
            --arg ackId "$WAKE_ACK_ID" \
            --arg ackVerified "$ACKNOWLEDGEMENT_VERIFIED" \
            '.mode="resume_existing"
             | .chatUrl=$url
             | .browserRoutine=""
             | .chatgptProject={name:"",url:""}
             | .activeChat={name:$reviewer,url:$url}
             | .wakeMessage=$wakeMessage
             | .thinkingEffort=$thinkingEffort
             | .activeAssignment={phaseId:$phaseId,milestoneId:$milestoneId,workerRole:$workerRole,reviewer:$reviewer,thinkingEffort:$thinkingEffort}
             | if $ackVerified=="true" then
                 .wakeDelivery={milestoneId:$milestoneId,chatUrl:$url,deliveredAt:$deliveredAt,verification:"REVIEWER_GITHUB_CHECK_IN",ackId:$ackId}
               else
                 .lastWakeAttempt={milestoneId:$milestoneId,chatUrl:$url,attemptedAt:$deliveredAt,verification:"X11_VISUAL_SEND_ATTEMPT"}
               end
             | .watchdog=((.watchdog // {}) + {idleMessage:$idleMessage})
             | .watchdog.gate=((.watchdog.gate // {}) + {mode:$gateMode,repository:$gateRepository,ref:$gateRef,statePath:$gateStatePath,expectedPhaseId:$phaseId,expectedMilestoneId:$milestoneId,activePointerPath:$gatePointerPath})
             | .updatedAt=(now|todate)' \
            /tmp/existing-chat-registration.json > /tmp/existing-chat-registration-updated.json

          sha="$(gh api "$api?ref=main" --jq '.sha')"
          content="$(base64 -w0 /tmp/existing-chat-registration-updated.json)"
          gh api --method PUT "$api" \
            -f message="chore(wake): record existing-chat wake for $CAMPAIGN_ID $CURRENT_MILESTONE_ID" \
            -f content="$content" -f sha="$sha" -f branch=main >/dev/null

      - name: Activate prepared Lite receipt successor
        if: ${{ inputs.worker_role == 'reviewer' && inputs.gate_mode == 'LITE' && env.WAKE_IS_POKE != 'true' && (steps.receipt.outputs.verified == 'true' || (env.WAKE_ACK_PATH == '' && steps.deliver.outputs.ok == 'true')) }}
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          DIRECTORY_PATH: ${{ inputs.gate_state_path }}
          AUDIT_CONTROLLER_REF: ${{ inputs.gate_ref }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DIRECTORY_PATH" in "Audit Campaign Directory/campaigns/"*.json) ;; *) exit 0;; esac
          gh auth setup-git
          rm -rf .audit-controller-wake
          gh repo clone curveyield3/Audit-Controller .audit-controller-wake -- --filter=blob:none --no-checkout
          cd .audit-controller-wake
          git fetch origin "$AUDIT_CONTROLLER_REF"
          directory_schema="$(git show "origin/$AUDIT_CONTROLLER_REF:$DIRECTORY_PATH" | jq -r '.schemaVersion // empty')"
          if [ "$directory_schema" = "curveyield-audit-campaign-directory-entry-v2" ]; then
            # Only the directory entry is touched: sparse checkout keeps this fast, and the push
            # retries on top of the reviewer's own concurrent commits.
            git sparse-checkout set --no-cone "/$DIRECTORY_PATH"
            git checkout -B "$AUDIT_CONTROLLER_REF" "origin/$AUDIT_CONTROLLER_REF"
            git config user.name 'CurveYield Browser Wake'
            git config user.email 'browser-wake@users.noreply.github.com'
            for attempt in 1 2 3 4 5; do
              if [ "$attempt" -gt 1 ]; then
                sleep $((attempt * 2))
                git fetch origin "$AUDIT_CONTROLLER_REF"
                git reset -q --hard "origin/$AUDIT_CONTROLLER_REF"
              fi
              campaign_status="$(jq -r '.campaignStatus // empty' "$DIRECTORY_PATH")"
              assignment_status="$(jq -r '.currentAssignment.status // empty' "$DIRECTORY_PATH")"
              if [ "$campaign_status" != "WAITING_FOR_SUCCESSOR_AGENT" ] || [ "$assignment_status" != "WAITING_FOR_SUCCESSOR_AGENT" ]; then
                echo "Assignment-v2 wake resumes the current reviewer state without creating or modifying a phase receipt."
                exit 0
              fi
              now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              jq --arg now "$now" '.campaignStatus="ACTIVE" | .currentAssignment.status="ACTIVE" | .updatedAt=$now' "$DIRECTORY_PATH" > /tmp/directory-v2.json
              mv /tmp/directory-v2.json "$DIRECTORY_PATH"
              reviewer="$(jq -r '.currentAssignment.reviewer' "$DIRECTORY_PATH")"
              git add -- "$DIRECTORY_PATH"
              git commit -m "audit(assignment): activate $CAMPAIGN_ID $reviewer"
              if git push origin "HEAD:$AUDIT_CONTROLLER_REF"; then exit 0; fi
            done
            echo "::error::Could not push assignment activation after 5 attempts"
            exit 1
          fi
          git checkout -B "$AUDIT_CONTROLLER_REF" "origin/$AUDIT_CONTROLLER_REF"
          directory_status="$(jq -r '.status // empty' "$DIRECTORY_PATH")"
          if [ "$directory_status" = "ACTIVE" ] || [ "$directory_status" = "BLOCKED" ]; then
            current_path="$(jq -r '.currentReceiptPath' "$DIRECTORY_PATH")"
            test -f "$current_path"
            if [ "$directory_status" = "BLOCKED" ]; then
              now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              receipt_status="$(jq -r '.phase.status // empty' "$current_path")"
              if [ "$receipt_status" = "BLOCKED" ]; then
                jq --arg now "$now" '.phase.status="ACTIVE" | .updatedAt=$now' "$current_path" > /tmp/repaired-current-receipt.json
                mv /tmp/repaired-current-receipt.json "$current_path"
              fi
              jq --arg now "$now" '.status="ACTIVE" | .updatedAt=$now' "$DIRECTORY_PATH" > /tmp/repaired-directory.json
              mv /tmp/repaired-directory.json "$DIRECTORY_PATH"
              git config user.name 'CurveYield Browser Wake'
              git config user.email 'browser-wake@users.noreply.github.com'
              git add -- "$current_path" "$DIRECTORY_PATH"
              if ! git diff --cached --quiet; then
                git commit -m "audit(receipt): resume blocked reviewer $CAMPAIGN_ID"
                git push origin "HEAD:$AUDIT_CONTROLLER_REF"
              fi
            fi
            echo "Current Lite reviewer assignment is being resumed in a replacement chat; no successor transition is required."
            exit 0
          fi
          test "$directory_status" = "WAITING_FOR_SUCCESSOR_AGENT"
          outgoing_path="$(jq -r '.currentReceiptPath' "$DIRECTORY_PATH")"
          incoming_path="$(jq -r '.handoff.incomingReceiptPath // empty' "$outgoing_path")"
          test -n "$incoming_path"
          test -f "$incoming_path"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq --arg now "$now" '.handoff.status="SUCCESSOR_ACTIVATED" | .updatedAt=$now' "$outgoing_path" > /tmp/outgoing.json
          mv /tmp/outgoing.json "$outgoing_path"
          jq --arg now "$now" '.phase.status="ACTIVE" | .updatedAt=$now' "$incoming_path" > /tmp/incoming.json
          mv /tmp/incoming.json "$incoming_path"
          phase_seq="$(jq -r '.phase.sequence' "$incoming_path")"
          reviewer="$(jq -r '.executor.lineage' "$incoming_path")"
          jq --arg path "$incoming_path" --arg reviewer "$reviewer" --arg now "$now" --argjson seq "$phase_seq"             '.currentReceiptPath=$path | .currentPhaseSequence=$seq | .currentReviewer=$reviewer | .status="ACTIVE" | .updatedAt=$now'             "$DIRECTORY_PATH" > /tmp/directory.json
          mv /tmp/directory.json "$DIRECTORY_PATH"
          git config user.name 'CurveYield Browser Wake'
          git config user.email 'browser-wake@users.noreply.github.com'
          git add -- "$outgoing_path" "$incoming_path" "$DIRECTORY_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "audit(receipt): activate $CAMPAIGN_ID $reviewer"
            git push origin "HEAD:$AUDIT_CONTROLLER_REF"
          fi

      - name: Arm immediate watchdog observation
        if: ${{ inputs.watchdog_enabled && (steps.receipt.outputs.verified == 'true' || steps.deliver.outputs.ok == 'true' || steps.deliver.outputs.send_attempted == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run browser-agent-watchdog.yml --repo "$GITHUB_REPOSITORY" --ref main -f wake_id="$WAKE_ID"

      - name: Fail unacknowledged substantive wake after watchdog is armed
        if: ${{ env.WAKE_ACK_PATH != '' && steps.receipt.outputs.verified != 'true' && (steps.deliver.outputs.ok == 'true' || steps.deliver.outputs.send_attempted == 'true') }}
        shell: bash
        run: |
          echo "::error::X11 send attempt is NOT reviewer takeover. No exact first-action GitHub ACK was written. A 10-minute recovery watchdog is armed for unconfirmed master wakes; keep this run red until the reviewer acknowledges."
          exit 1

      - name: Upload browser wake evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-agent-wake-evidence-${{ github.run_id }}
          path: /tmp/browser-wake-evidence-v1/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true

      - name: Cleanup browser display
        if: always()
        shell: bash
        run: |
          set +e
          [ -f /tmp/x11vnc-browser-agent.pid ] && kill "$(cat /tmp/x11vnc-browser-agent.pid)" 2>/dev/null
          [ -f /tmp/xvfb-browser-agent.pid ] && kill "$(cat /tmp/xvfb-browser-agent.pid)" 2>/dev/null
