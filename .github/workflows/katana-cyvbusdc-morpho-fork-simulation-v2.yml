name: Katana cyvbUSDC Morpho Venue Fork Simulation v2

# Simulation execution only after explicit audit-owner authorization.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: katana-cyvbusdc-morpho-fork-simulation
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Start authenticated, historical pinned Katana Anvil fork
        env:
          KATANA_UPSTREAM: ${{ secrets.RPC_KATANA }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KATANA_UPSTREAM:-}" || { echo "::error::RPC_KATANA secret missing"; exit 1; }
          test "$(cast chain-id --rpc-url "$KATANA_UPSTREAM")" = 747474
          PIN="$(cast block-number --rpc-url "$KATANA_UPSTREAM")"
          [[ "$PIN" =~ ^[0-9]+$ ]] && [ "$PIN" -gt 0 ]
          UPSTREAM_HASH="$(cast block "$PIN" --field hash --rpc-url "$KATANA_UPSTREAM" | tr -d '\r\n')"
          [[ "$UPSTREAM_HASH" =~ ^0x[0-9a-fA-F]{64}$ ]]
          (timeout 13m anvil --fork-url "$KATANA_UPSTREAM" --fork-block-number "$PIN" --chain-id 747474 --port 8545 --host 127.0.0.1 > "$RUNNER_TEMP/anvil.log" 2>&1 &)
          ready=0
          for i in $(seq 1 100); do
            if curl --fail --silent --max-time 2 -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
              http://127.0.0.1:8545 | grep -q '"result":"0xb67d2"'; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            tail -80 "$RUNNER_TEMP/anvil.log"
            echo '::error::Katana fork did not start with the requested chain ID'
            exit 1
          fi
          LOCAL_HASH="$(cast block "$PIN" --field hash --rpc-url http://127.0.0.1:8545 | tr -d '\r\n')"
          test "${LOCAL_HASH,,}" = "${UPSTREAM_HASH,,}" || { echo "::error::Historical Katana block hash mismatch"; exit 1; }
          echo "Authenticated pinned Katana Anvil fork: chain=747474 block=$PIN hash=$LOCAL_HASH (no mainnet writes)" >> "$GITHUB_STEP_SUMMARY"
      - name: Inspect live config and simulate governance on fork
        env:
          KATANA_RPC_URL: http://127.0.0.1:8545
        run: node test/katana/cyvbusdc-morpho-venue-fork-v2.mjs
      - name: Upload simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyvbusdc-morpho-venue-fork-v2-${{ github.run_id }}
          path: |
            cyvbusdc-morpho-simulation-v2.json
          if-no-files-found: warn
          retention-days: 14
      - name: Print Anvil diagnostic tail on failure
        if: failure()
        shell: bash
        run: tail -100 "$RUNNER_TEMP/anvil.log" || true
