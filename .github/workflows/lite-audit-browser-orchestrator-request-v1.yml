name: Lite Audit Browser Orchestrator Request v1

on:
  push:
    branches: [main]
    paths:
      - 'process/browser-agent-wake/orchestrator-requests/*.json'

permissions:
  contents: read
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      requests: ${{ steps.ids.outputs.requests }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: ids
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          root=process/browser-agent-wake/orchestrator-requests
          if [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            mapfile -t changed < <(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- "$root/")
          else
            mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- "$root/")
          fi
          : > /tmp/lite-orchestrator-requests.ndjson
          for request in "${changed[@]}"; do
            [[ "$request" =~ ^process/browser-agent-wake/orchestrator-requests/[A-Za-z0-9._-]+\.json$ ]] || continue
            test -f "$request" || continue
            jq -ec --arg file "$request" '
              select(.schemaVersion=="curveyield-lite-browser-orchestrator-request-v1"
                and (.campaignId|type)=="string"
                and (.campaignId|test("^[A-Za-z0-9._-]+-r[0-9]+$")))
              | {request_path:$file,campaign_id:.campaignId}
            ' "$request" >> /tmp/lite-orchestrator-requests.ndjson
          done
          echo "requests=$(jq -sc '{include:.}' /tmp/lite-orchestrator-requests.ndjson)" >> "$GITHUB_OUTPUT"
  dispatch:
    needs: discover
    if: ${{ needs.discover.outputs.requests != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.requests) }}
    concurrency:
      group: lite-browser-orchestrator-request-${{ matrix.campaign_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Resolve campaign orchestrator request
        id: request
        env:
          MATRIX_REQUEST: ${{ matrix.request_path }}
        shell: bash
        run: |
          set -euo pipefail
          request="$MATRIX_REQUEST"
          [[ "$request" =~ ^process/browser-agent-wake/orchestrator-requests/[A-Za-z0-9._-]+\.json$ ]]
          test -f "$request"
          jq -e '
            .schemaVersion == "curveyield-lite-browser-orchestrator-request-v1"
            and (.requestId | type == "string" and length > 0)
            and (.campaignId | type == "string" and length > 0)
            and (.campaignName | type == "string" and length > 0)
            and (.campaignPath | type == "string" and startswith("campaigns/"))
            and (.auditControllerRef | type == "string" and length > 0)
          ' "$request" >/dev/null

          campaign_id="$(jq -r '.campaignId' "$request")"
          expected="process/browser-agent-wake/orchestrator-requests/$campaign_id.json"
          [ "$request" = "$expected" ] || {
            echo "::error::Request path must be $expected"
            exit 1
          }

          {
            echo "campaign_id=$campaign_id"
            echo "campaign_name=$(jq -r '.campaignName' "$request")"
            echo "campaign_path=$(jq -r '.campaignPath' "$request")"
            echo "audit_controller_ref=$(jq -r '.auditControllerRef' "$request")"
            echo "request_id=$(jq -r '.requestId' "$request")"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch existing Lite browser orchestrator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run lite-audit-browser-orchestrator-v1.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f campaign_id="${{ steps.request.outputs.campaign_id }}" \
            -f campaign_name="${{ steps.request.outputs.campaign_name }}" \
            -f campaign_path="${{ steps.request.outputs.campaign_path }}" \
            -f audit_controller_ref="${{ steps.request.outputs.audit_controller_ref }}"

      - name: Summarize
        run: |
          {
            echo "## Lite browser orchestrator request"
            echo "- Request: ${{ steps.request.outputs.request_id }}"
            echo "- Campaign: ${{ steps.request.outputs.campaign_id }}"
            echo "- Dispatched: lite-audit-browser-orchestrator-v1.yml"
          } >> "$GITHUB_STEP_SUMMARY"
