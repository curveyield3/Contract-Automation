name: Development Agent Task Manager

on:
  schedule:
    - cron: '4-59/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'process/development-agent-task-manager/requests/*.json'
  workflow_dispatch:
    inputs:
      operation:
        description: Start a managed development task or sweep existing tasks
        required: true
        default: start
        type: choice
        options: [start, sweep]
      manager_id:
        description: Stable task-manager identifier
        required: true
        type: string
      specification_path:
        description: Development specification path in Contract-Automation
        required: false
        type: string
      skill_path:
        description: Supporting skill/authority path in Contract-Automation
        required: false
        type: string
      authority_ref:
        description: Exact ref containing specification and skill
        required: false
        default: main
        type: string
      target_repository:
        description: Repository the development agents must modify
        required: false
        default: curveyield3/Contract-Automation
        type: string
      target_branch:
        description: Durable development branch
        required: false
        type: string
      base_ref:
        description: Base ref used only when the target branch does not exist
        required: false
        default: main
        type: string
      continuity_mode:
        description: Development-agent continuity mode; Project-backed is the default
        required: false
        default: managed_project
        type: choice
        options: [managed_project, standalone]
      runner_retry_attempt:
        description: Internal fresh-runner browser retry attempt counter
        required: false
        default: '0'
        type: string
      initial_assignment:
        description: Optional extra instruction appended to the authoritative specification
        required: false
        type: string

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: development-agent-task-manager-${{ inputs.manager_id || github.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  start:
    if: (github.event_name == 'workflow_dispatch' && inputs.operation == 'start') || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MANAGER_ID: ${{ inputs.manager_id }}
      SPEC_PATH: ${{ inputs.specification_path }}
      SKILL_PATH: ${{ inputs.skill_path }}
      AUTHORITY_REF: ${{ inputs.authority_ref }}
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
      BASE_REF: ${{ inputs.base_ref }}
      CONTINUITY_MODE: ${{ inputs.continuity_mode }}
      RUNNER_RETRY_ATTEMPT: ${{ inputs.runner_retry_attempt }}
      INITIAL_ASSIGNMENT: ${{ inputs.initial_assignment }}
      TASK_LOCK_PROTOCOL_PATH: process/development-agent-task-manager/TASK_LOCK_PROTOCOL_v1.md
      TASK_LOCK_TEMPLATE_PATH: process/development-agent-task-manager/TASK_LOCK_STATE_TEMPLATE_v1.md
      CHATGPT_STORAGE_STATE_B64: ${{ secrets.CHATGPT_STORAGE_STATE_B64 }}
      BROWSER_HEADLESS: 'false'
      DISPLAY: ':99'
      INTERACTIVE_VIEW_ENABLED: 'true'
      MANUAL_CHALLENGE_WAIT_MS: '300000'
      HOME_EXIT_NODE: ${{ vars.BROWSER_HOME_EXIT_NODE || '100.112.238.56' }}
    steps:
      - name: Checkout trusted Contract-Automation control plane
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve declarative start request
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t request_paths < <(
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA"               --jq '.files[]? | select(.status!="removed") | .filename | select(startswith("process/development-agent-task-manager/requests/") and endswith(".json"))'
          )
          [ "${#request_paths[@]}" -eq 1 ] || {
            echo "::error::Exactly one task-manager request file must be created or changed per triggering commit."
            exit 1
          }
          request_path="${request_paths[0]}"
          encoded="$(gh api -X GET "repos/$GITHUB_REPOSITORY/contents/$request_path" -f ref="$GITHUB_SHA" --jq '.content')"
          printf '%s' "$encoded" | base64 -d > /tmp/task-manager-request.json
          jq -e '
            type=="object"
            and .schemaVersion=="curveyield-development-agent-task-request-v1"
            and .status=="READY"
            and (.managerId|type=="string" and test("^[A-Za-z0-9._-]{1,160}$"))
            and (.specificationPath|type=="string" and length>0)
            and (.skillPath|type=="string" and length>0)
            and ((.authorityRef // "main")|type=="string" and length>0)
            and (.targetRepository|type=="string" and length>0)
            and (.targetBranch|type=="string" and length>0)
            and ((.baseRef // "main")|type=="string" and length>0)
            and ((.continuityMode // "managed_project")=="managed_project" or (.continuityMode // "managed_project")=="standalone")
            and ((.initialAssignment // "")|type=="string")
          ' /tmp/task-manager-request.json >/dev/null

          manager_id="$(jq -r '.managerId' /tmp/task-manager-request.json)"
          safe_id="$(printf '%s' "$manager_id" | tr -c 'A-Za-z0-9._-' '_')"
          active_probe="$(gh api "repos/$GITHUB_REPOSITORY/contents/process/development-agent-task-manager/active/$safe_id.json?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [[ "$active_probe" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Manager $manager_id is already active; refusing to create a duplicate agent."
            exit 1
          fi

          {
            echo "MANAGER_ID=$manager_id"
            echo "SPEC_PATH=$(jq -r '.specificationPath' /tmp/task-manager-request.json)"
            echo "SKILL_PATH=$(jq -r '.skillPath' /tmp/task-manager-request.json)"
            echo "AUTHORITY_REF=$(jq -r '.authorityRef // "main"' /tmp/task-manager-request.json)"
            echo "TARGET_REPOSITORY=$(jq -r '.targetRepository' /tmp/task-manager-request.json)"
            echo "TARGET_BRANCH=$(jq -r '.targetBranch' /tmp/task-manager-request.json)"
            echo "BASE_REF=$(jq -r '.baseRef // "main"' /tmp/task-manager-request.json)"
            echo "CONTINUITY_MODE=$(jq -r '.continuityMode // "managed_project"' /tmp/task-manager-request.json)"
            echo "TASK_MANAGER_REQUEST_PATH=$request_path"
            echo 'INITIAL_ASSIGNMENT<<__TASK_MANAGER_INITIAL_ASSIGNMENT__'
            jq -r '.initialAssignment // ""' /tmp/task-manager-request.json
            echo '__TASK_MANAGER_INITIAL_ASSIGNMENT__'
          } >> "$GITHUB_ENV"

      - name: Select target-repository credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TARGET_REPOSITORY" = 'curveyield3/Audit-Controller' ]; then
            bash scripts/select-audit-controller-token.sh
          fi

      - name: Validate specification and durable branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MANAGER_ID"
          test -n "$SPEC_PATH"
          test -n "$SKILL_PATH"
          test -n "$TARGET_REPOSITORY"
          test -n "$TARGET_BRANCH"
          continuity_mode="${CONTINUITY_MODE:-managed_project}"
          case "$continuity_mode" in managed_project|standalone) ;; *) echo "::error::Unsupported continuity mode: $continuity_mode"; exit 1;; esac
          safe_id="$(printf '%s' "$MANAGER_ID" | tr -c 'A-Za-z0-9._-' '_')"
          [[ "$safe_id" =~ ^[A-Za-z0-9._-]+$ ]]
          spec_b64="$(gh api "repos/$GITHUB_REPOSITORY/contents/$SPEC_PATH?ref=$AUTHORITY_REF" --jq '.content')"
          skill_b64="$(gh api "repos/$GITHUB_REPOSITORY/contents/$SKILL_PATH?ref=$AUTHORITY_REF" --jq '.content')"
          task_lock_protocol_b64="$(gh api -X GET "repos/$GITHUB_REPOSITORY/contents/$TASK_LOCK_PROTOCOL_PATH" -f ref=main --jq '.content')"
          task_lock_template_b64="$(gh api -X GET "repos/$GITHUB_REPOSITORY/contents/$TASK_LOCK_TEMPLATE_PATH" -f ref=main --jq '.content')"
          printf '%s' "$spec_b64" | base64 -d > /tmp/task-manager-spec.md
          printf '%s' "$skill_b64" | base64 -d > /tmp/task-manager-skill.md
          printf '%s' "$task_lock_protocol_b64" | base64 -d > /tmp/task-lock-protocol.md
          printf '%s' "$task_lock_template_b64" | base64 -d > /tmp/task-lock-template.md
          test -s /tmp/task-manager-spec.md
          test -s /tmp/task-manager-skill.md
          test -s /tmp/task-lock-protocol.md
          test -s /tmp/task-lock-template.md
          spec_sha="$(sha256sum /tmp/task-manager-spec.md | awk '{print $1}')"
          skill_sha="$(sha256sum /tmp/task-manager-skill.md | awk '{print $1}')"
          task_lock_protocol_sha="$(sha256sum /tmp/task-lock-protocol.md | awk '{print $1}')"
          task_lock_template_sha="$(sha256sum /tmp/task-lock-template.md | awk '{print $1}')"
          task_lock_state_path="process/development-agent-task-manager/task-locks/${safe_id}_v1.md"
          target_token="${AUDIT_CONTROLLER_GITHUB_TOKEN:-$GH_TOKEN}"

          target_branch_uri="$(jq -rn --arg v "$TARGET_BRANCH" '$v|@uri')"
          target_head="$(GH_TOKEN="$target_token" gh api "repos/$TARGET_REPOSITORY/git/ref/heads/$target_branch_uri" --jq '.object.sha' 2>/dev/null || true)"
          if ! [[ "$target_head" =~ ^[0-9a-f]{40}$ ]]; then
            base_sha="$(GH_TOKEN="$target_token" gh api -X GET "repos/$TARGET_REPOSITORY/commits" -f sha="$BASE_REF" -f per_page=1 --jq '.[0].sha')"
            [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
            GH_TOKEN="$target_token" gh api --method POST "repos/$TARGET_REPOSITORY/git/refs" \
              -f ref="refs/heads/$TARGET_BRANCH" -f sha="$base_sha" >/dev/null
            target_head="$base_sha"
          fi
          [[ "$target_head" =~ ^[0-9a-f]{40}$ ]]

          {
            echo "TASK_MANAGER_SAFE_ID=$safe_id"
            echo "TASK_MANAGER_SPEC_SHA=$spec_sha"
            echo "TASK_MANAGER_SKILL_SHA=$skill_sha"
            echo "TASK_MANAGER_TASK_LOCK_PROTOCOL_SHA=$task_lock_protocol_sha"
            echo "TASK_MANAGER_TASK_LOCK_TEMPLATE_SHA=$task_lock_template_sha"
            echo "TASK_MANAGER_TASK_LOCK_STATE_PATH=$task_lock_state_path"
            echo "TASK_MANAGER_CONTINUITY_MODE=$continuity_mode"
            echo "TASK_MANAGER_PROJECT_NAME=Development $MANAGER_ID"
            echo "TASK_MANAGER_TARGET_HEAD=$target_head"
          } >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up isolated browser-agent runtime
        uses: ./.github/actions/setup-browser-agent-runtime

      - name: Install private VNC helper
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y x11vnc

      - name: Record runner egress before home exit node
        shell: bash
        run: |
          set -euo pipefail
          direct="$(curl -fsS --max-time 15 https://api.ipify.org)"
          test -n "$direct"
          printf '%s' "$direct" | sha256sum | awk '{print "DIRECT_EGRESS_HASH="$1}' >> "$GITHUB_ENV"

      - name: Connect runner to tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ env.HOME_EXIT_NODE }}

      - name: Start visible Chrome display and private tailnet VNC
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension RANDR >/tmp/xvfb-development-agent.log 2>&1 &
          echo $! >/tmp/xvfb-development-agent.pid
          for i in {1..20}; do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 1
          done
          xdpyinfo -display :99 >/dev/null 2>&1 || { cat /tmp/xvfb-development-agent.log || true; exit 1; }
          ts_ip="$(tailscale ip -4 | head -n1)"
          test -n "$ts_ip"
          echo "TAILSCALE_RUNNER_IP=$ts_ip" >> "$GITHUB_ENV"
          x11vnc -display :99 -rfbport 5900 -listen "$ts_ip" -nopw -forever -shared -quiet >/tmp/x11vnc-development-agent.log 2>&1 &
          echo $! >/tmp/x11vnc-development-agent.pid

      - name: Route browser phase through home exit node
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 3s 10s tailscale status
          timeout -k 5s 20s sudo tailscale set --exit-node="$HOME_EXIT_NODE"
          changed=false
          for i in {1..8}; do
            current="$(curl -fsS --connect-timeout 3 --max-time 5 https://api.ipify.org || true)"
            if [ -n "$current" ]; then
              current_hash="$(printf '%s' "$current" | sha256sum | awk '{print $1}')"
              if [ "$current_hash" != "$DIRECT_EGRESS_HASH" ]; then changed=true; break; fi
            fi
            sleep 2
          done
          [ "$changed" = true ] || { echo "::error::Tailscale exit node did not change runner egress."; exit 1; }

      - name: Create initial fresh development agent
        id: initial_agent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/task-manager-assignment.txt <<EOF
          [DEVELOPMENT_AGENT_TASK_MANAGER_V1]
          manager_id=$MANAGER_ID
          specification_repository=$GITHUB_REPOSITORY
          specification_ref=$AUTHORITY_REF
          specification_path=$SPEC_PATH
          specification_sha256=$TASK_MANAGER_SPEC_SHA
          skill_repository=$GITHUB_REPOSITORY
          skill_ref=$AUTHORITY_REF
          skill_path=$SKILL_PATH
          skill_sha256=$TASK_MANAGER_SKILL_SHA
          target_repository=$TARGET_REPOSITORY
          target_branch=$TARGET_BRANCH
          exact_resume_head=$TASK_MANAGER_TARGET_HEAD
          task_lock_scope=development_upgrade_only
          task_lock_protocol_repository=$GITHUB_REPOSITORY
          task_lock_protocol_ref=main
          task_lock_protocol_path=$TASK_LOCK_PROTOCOL_PATH
          task_lock_protocol_sha256=$TASK_MANAGER_TASK_LOCK_PROTOCOL_SHA
          task_lock_template_path=$TASK_LOCK_TEMPLATE_PATH
          task_lock_template_sha256=$TASK_MANAGER_TASK_LOCK_TEMPLATE_SHA
          task_lock_state_path=$TASK_MANAGER_TASK_LOCK_STATE_PATH

          You are the active implementation agent for this development specification. Read the exact specification and supporting skill before changing code. Continue implementation on the exact target branch above. Commit durable progress frequently so a replacement agent can resume from repository state without chat memory.

          Before implementation work, read the exact task-lock protocol above and create or update the single task-specific state file at task_lock_state_path using the template. Record the concrete END-STATE INVARIANT, current main SHA, already SATISFIED requirements, the smallest REMAINING DELTA, PARKED OBSERVATIONS, ACTIVE BLOCKER, and one NEXT ACTION. Do not perform implementation work until that lock exists. Before each meaningful action, require that it eliminates or verifies a REMAINING DELTA item. Discovery of an adjacent problem is not authorization to repair it.

          This task lock governs development/upgrade work only. Do not inject, propagate, or wire it into audit reviewer wakes, audit watchdogs/monitors, audit campaign orchestration, audit phase handoffs, audit-source initialization, Audit V7 execution/qualification, lite-audit workflows, or other audit-specific execution paths unless a future human instruction explicitly changes that boundary.

          Governing implementation rules:
          - Reuse and integrate existing workflows, scripts, schemas, queues, bridges, and tests whenever a similar admitted primitive already exists.
          - Create a new workflow only when no existing workflow can correctly own the responsibility.
          - Audit-Controller must contain no GitHub Actions workflows; workflows belong in Contract-Automation.
          - Do not restart completed work. Inspect the branch and current authoritative state first.
          - Keep testing as part of implementation. Do not declare completion merely because code was written.
          - When the specification is fully implemented and verified, write process/development-agent-task-manager/completions/$TASK_MANAGER_SAFE_ID.json on the target branch using schema curveyield-development-task-completion-v1. It must include managerId, status COMPLETE, specificationSha256, skillSha256, implementationHeadSha equal to the commit immediately before the completion-receipt commit, and tests with every entry status PASS.
          - Continue until that machine-readable completion condition is genuinely satisfied.

          $INITIAL_ASSIGNMENT
          EOF
          export WAKE_ACTION='wake'
          export WAKE_MODE='create_fresh'
          export WAKE_ID="$MANAGER_ID-generation-1"
          export WAKE_MESSAGE="$(cat /tmp/task-manager-assignment.txt)"
          export WAKE_RESULT_PATH='/tmp/task-manager-start.json'
          export CHATGPT_CHAT_NAME="$MANAGER_ID generation 1"
          if [ "$TASK_MANAGER_CONTINUITY_MODE" = managed_project ]; then
            export BROWSER_ROUTINE_ID='development-agent-project-create-v1'
            export CHATGPT_PROJECT_NAME="$TASK_MANAGER_PROJECT_NAME"
            export CHATGPT_PROJECT_URL=''
          else
            unset BROWSER_ROUTINE_ID CHATGPT_PROJECT_NAME CHATGPT_PROJECT_URL
          fi
          set +e
          node scripts/browser-agent-wake.mjs
          wake_rc=$?
          set -e

          if [ ! -s /tmp/task-manager-start.json ]; then
            jq -n --argjson rc "$wake_rc"               '{ok:false,wakeId:"unknown",failures:[{provider:"github-playwright",code:"NO_RESULT",retryable:false,error:("browser runtime exited without a result; rc="+($rc|tostring))}]}'               > /tmp/task-manager-start.json
          fi

          ok="$(jq -r '.ok // false' /tmp/task-manager-start.json)"
          retryable="$(jq -r '[.failures[]? | select(.provider=="github-playwright" and .retryable==true)] | length > 0' /tmp/task-manager-start.json)"
          retry_code="$(jq -r '[.failures[]? | select(.provider=="github-playwright" and .retryable==true) | .code][0] // empty' /tmp/task-manager-start.json)"

          if [ "$ok" = true ]; then
            jq -e '.ok==true and (.chatUrl|type=="string" and test("^https://chatgpt.com/(c/|g/g-p-[^/]+/c/)"))' /tmp/task-manager-start.json >/dev/null
            if [ "$TASK_MANAGER_CONTINUITY_MODE" = managed_project ]; then
              jq -e '.projectUrl|type=="string" and test("^https://chatgpt.com/g/g-p-[^/]+/project/?$")' /tmp/task-manager-start.json >/dev/null
            fi
            echo 'created=true' >> "$GITHUB_OUTPUT"
            echo 'retry_dispatched=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          attempt="${RUNNER_RETRY_ATTEMPT:-0}"
          max=3
          [[ "$attempt" =~ ^[0-9]+$ ]] || attempt=0

          if [ "$retryable" = true ] && [ "$attempt" -lt "$max" ]; then
            next=$((attempt + 1))
            gh workflow run development-agent-task-manager.yml               --repo "$GITHUB_REPOSITORY"               --ref main               --field operation=start               --field manager_id="$MANAGER_ID"               --field specification_path="$SPEC_PATH"               --field skill_path="$SKILL_PATH"               --field authority_ref="$AUTHORITY_REF"               --field target_repository="$TARGET_REPOSITORY"               --field target_branch="$TARGET_BRANCH"               --field base_ref="$BASE_REF"               --field continuity_mode="$TASK_MANAGER_CONTINUITY_MODE"               --field runner_retry_attempt="$next"               --field initial_assignment="$INITIAL_ASSIGNMENT"

            echo 'created=false' >> "$GITHUB_OUTPUT"
            echo 'retry_dispatched=true' >> "$GITHUB_OUTPUT"
            echo "Fresh-runner development-agent retry $next/$max dispatched for $MANAGER_ID after $retry_code." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo 'created=false' >> "$GITHUB_OUTPUT"
          echo 'retry_dispatched=false' >> "$GITHUB_OUTPUT"
          jq '{ok,wakeId,failures,browserRoutineId,projectName,projectUrl}' /tmp/task-manager-start.json
          echo "::error::Initial development agent creation failed (retryable=$retryable code=$retry_code attempt=$attempt/$max rc=$wake_rc)."
          exit 1

      - name: Persist active task-manager state
        if: steps.initial_agent.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          chat_url="$(jq -r '.chatUrl' /tmp/task-manager-start.json)"
          assistant_count="$(jq -r '.after.assistantCount // .assistantCount // 0' /tmp/task-manager-start.json)"
          assistant_hash="$(jq -r '.after.lastAssistantHash // .lastAssistantHash // empty' /tmp/task-manager-start.json)"
          project_name="$(jq -r '.projectName // empty' /tmp/task-manager-start.json)"
          project_url="$(jq -r '.projectUrl // empty' /tmp/task-manager-start.json)"
          if [ "$TASK_MANAGER_CONTINUITY_MODE" = managed_project ]; then
            [ -n "$project_name" ] || project_name="$TASK_MANAGER_PROJECT_NAME"
            [[ "$project_url" =~ ^https://chatgpt\.com/g/g-p-[^/]+/project/?$ ]] || {
              echo "::error::Managed development task requires a persisted private Project URL."
              exit 1
            }
          fi
          idle_message='[DEVELOPMENT_AGENT_WATCHDOG_V1] Re-read the existing task-lock state on the target branch, refresh current main if needed, and continue only the smallest REMAINING DELTA. Do not reopen SATISFIED work or repair PARKED OBSERVATIONS. Every meaningful action must reduce/verify REMAINING DELTA or remove ACTIVE BLOCKER. Commit durable progress, run required tests, and continue until the task-lock completion conditions and machine completion receipt are both valid.'
          jq -n             --arg managerId "$MANAGER_ID"             --arg safeId "$TASK_MANAGER_SAFE_ID"             --arg specPath "$SPEC_PATH"             --arg specRef "$AUTHORITY_REF"             --arg specSha "$TASK_MANAGER_SPEC_SHA"             --arg skillPath "$SKILL_PATH"             --arg skillRef "$AUTHORITY_REF"             --arg skillSha "$TASK_MANAGER_SKILL_SHA"             --arg taskLockProtocolPath "$TASK_LOCK_PROTOCOL_PATH"             --arg taskLockProtocolSha "$TASK_MANAGER_TASK_LOCK_PROTOCOL_SHA"             --arg taskLockTemplatePath "$TASK_LOCK_TEMPLATE_PATH"             --arg taskLockTemplateSha "$TASK_MANAGER_TASK_LOCK_TEMPLATE_SHA"             --arg taskLockStatePath "$TASK_MANAGER_TASK_LOCK_STATE_PATH"             --arg continuityMode "$TASK_MANAGER_CONTINUITY_MODE"             --arg projectName "$project_name"             --arg projectUrl "$project_url"             --arg targetRepo "$TARGET_REPOSITORY"             --arg targetBranch "$TARGET_BRANCH"             --arg targetHead "$TASK_MANAGER_TARGET_HEAD"             --arg chatUrl "$chat_url"             --arg idleMessage "$idle_message"             --argjson assistantCount "$assistant_count"             --arg assistantHash "$assistant_hash"             '{
              schemaVersion:"curveyield-development-agent-task-manager-state-v1",
              managerId:$managerId,safeId:$safeId,status:"ACTIVE",generation:1,
              specification:{path:$specPath,ref:$specRef,sha256:$specSha},
              skill:{path:$skillPath,ref:$skillRef,sha256:$skillSha},
              taskLock:{scope:"development_upgrade_only",protocol:{path:$taskLockProtocolPath,ref:"main",sha256:$taskLockProtocolSha},template:{path:$taskLockTemplatePath,ref:"main",sha256:$taskLockTemplateSha},statePath:$taskLockStatePath},
              continuity:{mode:$continuityMode,project:{name:$projectName,url:$projectUrl}},
              target:{repository:$targetRepo,branch:$targetBranch,lastCheckpointSha:$targetHead},
              chat:{url:$chatUrl,assistantCount:$assistantCount,lastAssistantHash:$assistantHash},
              idleMessage:$idleMessage,replacementCount:0,
              responsePolicy:{attempts:3,minimumWaitMsPerAttempt:120000,refreshBetweenAttempts:true},
              createdAt:(now|todate),updatedAt:(now|todate)
            }' > /tmp/task-manager-state.json
          api="repos/$GITHUB_REPOSITORY/contents/process/development-agent-task-manager/active/$TASK_MANAGER_SAFE_ID.json"
          content="$(base64 -w0 /tmp/task-manager-state.json)"
          existing="$(gh api "$api?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [[ "$existing" =~ ^[0-9a-f]{40}$ ]]; then
            gh api --method PUT "$api" -f message="chore(task-manager): restart $MANAGER_ID" -f content="$content" -f sha="$existing" -f branch=main >/dev/null
          else
            gh api --method PUT "$api" -f message="chore(task-manager): start $MANAGER_ID" -f content="$content" -f branch=main >/dev/null
          fi

      - name: Disable home exit node
        if: always()
        shell: bash
        run: |
          set +e
          sudo tailscale set --exit-node=""

      - name: Cleanup browser display
        if: always()
        shell: bash
        run: |
          set +e
          [ -f /tmp/x11vnc-development-agent.pid ] && kill "$(cat /tmp/x11vnc-development-agent.pid)" 2>/dev/null
          [ -f /tmp/xvfb-development-agent.pid ] && kill "$(cat /tmp/xvfb-development-agent.pid)" 2>/dev/null

  discover:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'sweep')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      has_targets: ${{ steps.targets.outputs.has_targets }}
    steps:
      - name: Discover active development agents
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MANAGER_ID: ${{ inputs.manager_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ -n "${REQUESTED_MANAGER_ID:-}" ]; then
            safe_id="$(printf '%s' "$REQUESTED_MANAGER_ID" | tr -c 'A-Za-z0-9._-' '_')"
            jq -cn --arg id "$safe_id" '[$id]' > /tmp/task-manager-targets.json
          else
            api="repos/$GITHUB_REPOSITORY/contents/process/development-agent-task-manager/active?ref=main"
            if gh api "$api" --jq '.[]? | select(.type=="file") | .name' > /tmp/task-manager-files.txt 2>/dev/null; then
              sed -n 's/\.json$//p' /tmp/task-manager-files.txt | LC_ALL=C sort -u | jq -R -s 'split("\n") | map(select(length>0))' > /tmp/task-manager-targets.json
            else
              printf '[]\n' > /tmp/task-manager-targets.json
            fi
          fi
          count="$(jq 'length' /tmp/task-manager-targets.json)"
          if [ "$count" -eq 0 ]; then
            echo 'targets=["__NO_ACTIVE_MANAGER__"]' >> "$GITHUB_OUTPUT"
            echo 'has_targets=false' >> "$GITHUB_OUTPUT"
          else
            echo "targets=$(jq -c . /tmp/task-manager-targets.json)" >> "$GITHUB_OUTPUT"
            echo 'has_targets=true' >> "$GITHUB_OUTPUT"
          fi

  supervise:
    needs: discover
    if: needs.discover.outputs.has_targets == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        manager_id: ${{ fromJSON(needs.discover.outputs.targets) }}
    concurrency:
      group: development-agent-task-manager-supervise-${{ matrix.manager_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SAFE_ID: ${{ matrix.manager_id }}
      CHATGPT_STORAGE_STATE_B64: ${{ secrets.CHATGPT_STORAGE_STATE_B64 }}
      BROWSER_HEADLESS: 'false'
      DISPLAY: ':99'
      INTERACTIVE_VIEW_ENABLED: 'true'
      MANUAL_CHALLENGE_WAIT_MS: '300000'
      HOME_EXIT_NODE: ${{ vars.BROWSER_HOME_EXIT_NODE || '100.112.238.56' }}
    steps:
      - name: Checkout trusted Contract-Automation control plane
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Load and validate active manager state
        id: manager_state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/contents/process/development-agent-task-manager/active/$SAFE_ID.json"
          encoded="$(gh api "$api?ref=main" --jq '.content' 2>/dev/null || true)"
          if [ -z "$encoded" ]; then
            echo 'valid=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$encoded" | base64 -d > /tmp/task-manager-state.json
          jq -e --arg safe "$SAFE_ID" '
            .schemaVersion=="curveyield-development-agent-task-manager-state-v1"
            and .safeId==$safe and .status=="ACTIVE"
            and (.managerId|type=="string" and length>0)
            and (.generation|type=="number" and .>=1)
            and (.specification.sha256|test("^[0-9a-f]{64}$"))
            and (.skill.sha256|test("^[0-9a-f]{64}$"))
            and .taskLock.scope=="development_upgrade_only"
            and (.taskLock.protocol.path|type=="string" and length>0)
            and (.taskLock.protocol.sha256|test("^[0-9a-f]{64}$"))
            and (.taskLock.template.path|type=="string" and length>0)
            and (.taskLock.template.sha256|test("^[0-9a-f]{64}$"))
            and (.taskLock.statePath|type=="string" and length>0)
            and (.continuity.mode=="managed_project" or .continuity.mode=="standalone")
            and (.continuity.project.name|type=="string")
            and (.continuity.project.url|type=="string")
            and (if .continuity.mode=="managed_project" then (.continuity.project.url|test("^https://chatgpt.com/g/g-p-[^/]+/project/?$")) else true end)
            and (.target.repository|type=="string" and length>0)
            and (.target.branch|type=="string" and length>0)
            and (.chat.url|type=="string")
            and .responsePolicy.attempts==3
            and .responsePolicy.minimumWaitMsPerAttempt==120000
            and .responsePolicy.refreshBetweenAttempts==true
          ' /tmp/task-manager-state.json >/dev/null
          echo "STATE_API=$api" >> "$GITHUB_ENV"
          echo 'valid=true' >> "$GITHUB_OUTPUT"

      - name: Select target-repository credential
        if: steps.manager_state.outputs.valid == 'true'
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: |
          set -euo pipefail
          target_repo="$(jq -r '.target.repository' /tmp/task-manager-state.json)"
          if [ "$target_repo" = 'curveyield3/Audit-Controller' ]; then
            bash scripts/select-audit-controller-token.sh
          fi

      - name: Verify pinned development authorities
        if: steps.manager_state.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          spec_path="$(jq -r '.specification.path' /tmp/task-manager-state.json)"
          spec_ref="$(jq -r '.specification.ref' /tmp/task-manager-state.json)"
          spec_sha="$(jq -r '.specification.sha256' /tmp/task-manager-state.json)"
          skill_path="$(jq -r '.skill.path' /tmp/task-manager-state.json)"
          skill_ref="$(jq -r '.skill.ref' /tmp/task-manager-state.json)"
          skill_sha="$(jq -r '.skill.sha256' /tmp/task-manager-state.json)"
          task_lock_protocol_path="$(jq -r '.taskLock.protocol.path' /tmp/task-manager-state.json)"
          task_lock_protocol_ref="$(jq -r '.taskLock.protocol.ref' /tmp/task-manager-state.json)"
          task_lock_protocol_sha="$(jq -r '.taskLock.protocol.sha256' /tmp/task-manager-state.json)"
          task_lock_template_path="$(jq -r '.taskLock.template.path' /tmp/task-manager-state.json)"
          task_lock_template_ref="$(jq -r '.taskLock.template.ref' /tmp/task-manager-state.json)"
          task_lock_template_sha="$(jq -r '.taskLock.template.sha256' /tmp/task-manager-state.json)"

          observed_spec="$(gh api -X GET "repos/$GITHUB_REPOSITORY/contents/$spec_path" -f ref="$spec_ref" --jq '.content' | base64 -d | sha256sum | awk '{print $1}')"
          observed_skill="$(gh api -X GET "repos/$GITHUB_REPOSITORY/contents/$skill_path" -f ref="$skill_ref" --jq '.content' | base64 -d | sha256sum | awk '{print $1}')"
          observed_task_lock_protocol="$(gh api -X GET "repos/$GITHUB_REPOSITORY/contents/$task_lock_protocol_path" -f ref="$task_lock_protocol_ref" --jq '.content' | base64 -d | sha256sum | awk '{print $1}')"
          observed_task_lock_template="$(gh api -X GET "repos/$GITHUB_REPOSITORY/contents/$task_lock_template_path" -f ref="$task_lock_template_ref" --jq '.content' | base64 -d | sha256sum | awk '{print $1}')"
          [ "$observed_spec" = "$spec_sha" ] || {
            echo "::error::Development specification bytes changed after manager admission."
            exit 1
          }
          [ "$observed_skill" = "$skill_sha" ] || {
            echo "::error::Skill authority bytes changed after manager admission."
            exit 1
          }
          [ "$observed_task_lock_protocol" = "$task_lock_protocol_sha" ] || {
            echo "::error::Development task-lock protocol bytes changed after manager admission."
            exit 1
          }
          [ "$observed_task_lock_template" = "$task_lock_template_sha" ] || {
            echo "::error::Development task-lock template bytes changed after manager admission."
            exit 1
          }

      - name: Check machine completion gate
        if: steps.manager_state.outputs.valid == 'true'
        id: completion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manager_id="$(jq -r '.managerId' /tmp/task-manager-state.json)"
          target_repo="$(jq -r '.target.repository' /tmp/task-manager-state.json)"
          target_branch="$(jq -r '.target.branch' /tmp/task-manager-state.json)"
          target_token="${AUDIT_CONTROLLER_GITHUB_TOKEN:-$GH_TOKEN}"
          spec_sha="$(jq -r '.specification.sha256' /tmp/task-manager-state.json)"
          skill_sha="$(jq -r '.skill.sha256' /tmp/task-manager-state.json)"
          task_lock_state_path="$(jq -r '.taskLock.statePath' /tmp/task-manager-state.json)"
          lock_encoded="$(GH_TOKEN="$target_token" gh api "repos/$target_repo/contents/$task_lock_state_path?ref=$target_branch" --jq '.content' 2>/dev/null || true)"
          if [ -z "$lock_encoded" ]; then
            echo 'complete=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$lock_encoded" | base64 -d > /tmp/task-lock-state.md
          remaining_delta="$(awk '/^REMAINING DELTA:$/ {capture=1; next} /^[A-Z][A-Z -]*:$/ {if(capture) exit} capture {print}' /tmp/task-lock-state.md | sed '/^[[:space:]]*$/d')"
          active_blocker="$(awk '/^ACTIVE BLOCKER:$/ {capture=1; next} /^[A-Z][A-Z -]*:$/ {if(capture) exit} capture {print}' /tmp/task-lock-state.md | sed '/^[[:space:]]*$/d')"
          [ "$remaining_delta" = "- None" ] || { echo 'complete=false' >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$active_blocker" = "None" ] || { echo 'complete=false' >> "$GITHUB_OUTPUT"; exit 0; }
          receipt_path="process/development-agent-task-manager/completions/$SAFE_ID.json"
          encoded="$(GH_TOKEN="$target_token" gh api "repos/$target_repo/contents/$receipt_path?ref=$target_branch" --jq '.content' 2>/dev/null || true)"
          if [ -z "$encoded" ]; then
            echo 'complete=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$encoded" | base64 -d > /tmp/task-manager-completion.json
          if ! jq -e --arg manager "$manager_id" --arg spec "$spec_sha" --arg skill "$skill_sha" '
            .schemaVersion=="curveyield-development-task-completion-v1"
            and .managerId==$manager and .status=="COMPLETE"
            and .specificationSha256==$spec and .skillSha256==$skill
            and (.implementationHeadSha|test("^[0-9a-f]{40}$"))
            and (.tests|type=="array" and length>0)
            and all(.tests[]; .status=="PASS")
          ' /tmp/task-manager-completion.json >/dev/null; then
            echo 'complete=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          implementation_head="$(jq -r '.implementationHeadSha' /tmp/task-manager-completion.json)"
          current_head="$(GH_TOKEN="$target_token" gh api -X GET "repos/$target_repo/commits" -f sha="$target_branch" -f per_page=1 --jq '.[0].sha')"
          receipt_commit="$(GH_TOKEN="$target_token" gh api -X GET "repos/$target_repo/commits" -f sha="$target_branch" -f path="$receipt_path" -f per_page=1 --jq '.[0].sha // empty' 2>/dev/null || true)"
          [ -n "$receipt_commit" ] || { echo 'complete=false' >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$receipt_commit" = "$current_head" ] || { echo 'complete=false' >> "$GITHUB_OUTPUT"; exit 0; }
          receipt_parent="$(GH_TOKEN="$target_token" gh api "repos/$target_repo/commits/$receipt_commit" --jq '.parents[0].sha // empty')"
          [ "$receipt_parent" = "$implementation_head" ] || { echo 'complete=false' >> "$GITHUB_OUTPUT"; exit 0; }
          echo 'complete=true' >> "$GITHUB_OUTPUT"
          echo "completion_head=$current_head" >> "$GITHUB_OUTPUT"

      - name: Finalize verified implementation into target main
        if: steps.manager_state.outputs.valid == 'true' && steps.completion.outputs.complete == 'true'
        id: finalization
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manager_id="$(jq -r '.managerId' /tmp/task-manager-state.json)"
          target_repo="$(jq -r '.target.repository' /tmp/task-manager-state.json)"
          target_branch="$(jq -r '.target.branch' /tmp/task-manager-state.json)"
          target_head="${{ steps.completion.outputs.completion_head }}"
          target_token="${AUDIT_CONTROLLER_GITHUB_TOKEN:-$GH_TOKEN}"
          owner="${target_repo%%/*}"
          base_branch='main'
          summary="$(jq -r '.summary // ""' /tmp/task-manager-completion.json)"
          [ -n "$summary" ] || summary="Verified implementation for $manager_id"

          pulls_json="$(GH_TOKEN="$target_token" gh api -X GET "repos/$target_repo/pulls"             -f state=all -f head="$owner:$target_branch" -f base="$base_branch" -f per_page=100)"
          pr_json="$(printf '%s' "$pulls_json" | jq -c --arg head "$target_head" '
            ([.[] | select(.state=="open")] | first) //
            ([.[] | select(.merged_at!=null and .head.sha==$head)] | first) //
            empty
          ')"

          if [ -z "$pr_json" ]; then
            body="$(printf 'Automated finalization for managed development task %s.\n\n%s\n\nThe Development Agent Task Manager verified the task lock and completion receipt before opening this PR.\n' "$manager_id" "$summary")"
            pr_json="$(GH_TOKEN="$target_token" gh api --method POST "repos/$target_repo/pulls"               -f title="Upgrade: $manager_id" -f head="$target_branch" -f base="$base_branch" -f body="$body")"
          fi

          pr_number="$(printf '%s' "$pr_json" | jq -r '.number')"
          pr_url="$(printf '%s' "$pr_json" | jq -r '.html_url')"
          pr_state="$(GH_TOKEN="$target_token" gh api "repos/$target_repo/pulls/$pr_number")"
          pr_head="$(printf '%s' "$pr_state" | jq -r '.head.sha')"
          merged_at="$(printf '%s' "$pr_state" | jq -r '.merged_at // empty')"

          if [ -n "$merged_at" ]; then
            if [ "$pr_head" != "$target_head" ]; then
              echo "::error::Existing merged PR does not contain the verified target head."
              jq --arg url "$pr_url" --arg head "$target_head"                 '.merge={status:"REPAIR_REQUIRED",targetBranch:"main",pullRequestUrl:$url,reason:"Merged PR head does not match the currently verified completion head."}
                 | .lastDecision="MERGE_REPAIR_REQUIRED"
                 | .updatedAt=(now|todate)'                 /tmp/task-manager-state.json > /tmp/task-manager-next.json
              mv /tmp/task-manager-next.json /tmp/task-manager-state.json
              echo 'merged=false' >> "$GITHUB_OUTPUT"
              echo 'requires_agent=true' >> "$GITHUB_OUTPUT"
              echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            merge_sha="$(printf '%s' "$pr_state" | jq -r '.merge_commit_sha')"
          else
            set +e
            GH_TOKEN="$target_token" gh api --method PUT "repos/$target_repo/pulls/$pr_number/merge"               -f merge_method=squash -f sha="$target_head" > /tmp/task-manager-merge.json 2>/tmp/task-manager-merge.err
            merge_rc=$?
            set -e

            if [ "$merge_rc" -eq 0 ] && jq -e '.merged==true' /tmp/task-manager-merge.json >/dev/null 2>&1; then
              merge_sha="$(jq -r '.sha' /tmp/task-manager-merge.json)"
            else
              pr_state="$(GH_TOKEN="$target_token" gh api "repos/$target_repo/pulls/$pr_number")"
              mergeable_state="$(printf '%s' "$pr_state" | jq -r '.mergeable_state // "unknown"')"
              reason="$(tr '\n' ' ' < /tmp/task-manager-merge.err | sed 's/[[:space:]]\+/ /g' | cut -c1-600)"
              [ -n "$reason" ] || reason="GitHub did not admit the merge; mergeable_state=$mergeable_state"

              if [ "$mergeable_state" = dirty ] || [ "$mergeable_state" = behind ]; then
                jq --arg url "$pr_url" --arg reason "$reason" --arg state "$mergeable_state"                   '.merge={status:"REPAIR_REQUIRED",targetBranch:"main",pullRequestUrl:$url,reason:$reason,mergeableState:$state}
                   | .lastDecision="MERGE_REPAIR_REQUIRED"
                   | .updatedAt=(now|todate)'                   /tmp/task-manager-state.json > /tmp/task-manager-next.json
                mv /tmp/task-manager-next.json /tmp/task-manager-state.json
                echo 'merged=false' >> "$GITHUB_OUTPUT"
                echo 'requires_agent=true' >> "$GITHUB_OUTPUT"
                echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              jq --arg url "$pr_url" --arg reason "$reason" --arg state "$mergeable_state"                 '.merge={status:"PENDING",targetBranch:"main",pullRequestUrl:$url,reason:$reason,mergeableState:$state}
                 | .lastDecision="MERGE_PENDING"
                 | .updatedAt=(now|todate)'                 /tmp/task-manager-state.json > /tmp/task-manager-next.json
              mv /tmp/task-manager-next.json /tmp/task-manager-state.json
              echo 'merged=false' >> "$GITHUB_OUTPUT"
              echo 'requires_agent=false' >> "$GITHUB_OUTPUT"
              echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Merged PR did not return a merge commit SHA."; exit 1; }
          target_main_sha="$(GH_TOKEN="$target_token" gh api -X GET "repos/$target_repo/commits" -f sha=main -f per_page=1 --jq '.[0].sha')"
          [[ "$target_main_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Unable to verify target main after merge."; exit 1; }

          jq             --arg url "$pr_url"             --arg mergeSha "$merge_sha"             --arg mainSha "$target_main_sha"             '.merge={status:"MERGED",targetBranch:"main",pullRequestUrl:$url,mergeCommitSha:$mergeSha,targetMainSha:$mainSha}
             | .output={url:$url,kind:"pull_request",artifactPath:null}
             | .lastDecision="MERGED_TO_TARGET_MAIN"
             | .updatedAt=(now|todate)'             /tmp/task-manager-state.json > /tmp/task-manager-next.json
          mv /tmp/task-manager-next.json /tmp/task-manager-state.json
          echo 'merged=true' >> "$GITHUB_OUTPUT"
          echo 'requires_agent=false' >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "merge_commit_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "target_main_sha=$target_main_sha" >> "$GITHUB_OUTPUT"
          echo "output_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Persist merge-pending or repair state
        if: steps.manager_state.outputs.valid == 'true' && steps.completion.outputs.complete == 'true' && steps.finalization.outputs.merged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          active_sha="$(gh api "$STATE_API?ref=main" --jq '.sha')"
          content="$(base64 -w0 /tmp/task-manager-state.json)"
          gh api --method PUT "$STATE_API"             -f message="chore(task-manager): persist merge state $SAFE_ID"             -f content="$content" -f sha="$active_sha" -f branch=main >/dev/null

      - name: Retire merged manager
        if: steps.manager_state.outputs.valid == 'true' && steps.completion.outputs.complete == 'true' && steps.finalization.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq --arg head "${{ steps.completion.outputs.completion_head }}"             '.status="COMPLETE"
             | .target.lastCheckpointSha=$head
             | .completedAt=(now|todate)
             | .updatedAt=(now|todate)'             /tmp/task-manager-state.json > /tmp/task-manager-completed.json
          jq -e '
            .merge.status=="MERGED"
            and (.merge.pullRequestUrl|test("^https://github.com/"))
            and (.merge.mergeCommitSha|test("^[0-9a-f]{40}$"))
            and (.merge.targetMainSha|test("^[0-9a-f]{40}$"))
            and (.output.url|test("^https://github.com/"))
          ' /tmp/task-manager-completed.json >/dev/null
          active_sha="$(gh api "$STATE_API?ref=main" --jq '.sha')"
          completed_api="repos/$GITHUB_REPOSITORY/contents/process/development-agent-task-manager/completed/$SAFE_ID.json"
          content="$(base64 -w0 /tmp/task-manager-completed.json)"
          existing="$(gh api "$completed_api?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [[ "$existing" =~ ^[0-9a-f]{40}$ ]]; then
            gh api --method PUT "$completed_api" -f message="chore(task-manager): complete merged $SAFE_ID" -f content="$content" -f sha="$existing" -f branch=main >/dev/null
          else
            gh api --method PUT "$completed_api" -f message="chore(task-manager): complete merged $SAFE_ID" -f content="$content" -f branch=main >/dev/null
          fi
          gh api --method DELETE "$STATE_API" -f message="chore(task-manager): retire merged $SAFE_ID" -f sha="$active_sha" -f branch=main >/dev/null

      - name: Stop after terminal merged completion
        if: steps.manager_state.outputs.valid == 'true' && steps.completion.outputs.complete == 'true' && steps.finalization.outputs.merged == 'true'
        shell: bash
        run: exit 0

      - name: Set up Node.js
        if: steps.manager_state.outputs.valid == 'true' && (steps.completion.outputs.complete != 'true' || steps.finalization.outputs.requires_agent == 'true')
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up isolated browser-agent runtime
        if: steps.manager_state.outputs.valid == 'true' && (steps.completion.outputs.complete != 'true' || steps.finalization.outputs.requires_agent == 'true')
        uses: ./.github/actions/setup-browser-agent-runtime

      - name: Install private VNC helper
        if: steps.manager_state.outputs.valid == 'true' && (steps.completion.outputs.complete != 'true' || steps.finalization.outputs.requires_agent == 'true')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y x11vnc

      - name: Record runner egress before home exit node
        if: steps.manager_state.outputs.valid == 'true' && (steps.completion.outputs.complete != 'true' || steps.finalization.outputs.requires_agent == 'true')
        shell: bash
        run: |
          set -euo pipefail
          direct="$(curl -fsS --max-time 15 https://api.ipify.org)"
          test -n "$direct"
          printf '%s' "$direct" | sha256sum | awk '{print "DIRECT_EGRESS_HASH="$1}' >> "$GITHUB_ENV"

      - name: Connect runner to tailnet
        if: steps.manager_state.outputs.valid == 'true' && (steps.completion.outputs.complete != 'true' || steps.finalization.outputs.requires_agent == 'true')
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ env.HOME_EXIT_NODE }}

      - name: Start visible Chrome display and private tailnet VNC
        if: steps.manager_state.outputs.valid == 'true' && (steps.completion.outputs.complete != 'true' || steps.finalization.outputs.requires_agent == 'true')
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension RANDR >/tmp/xvfb-development-agent.log 2>&1 &
          echo $! >/tmp/xvfb-development-agent.pid
          for i in {1..20}; do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 1
          done
          xdpyinfo -display :99 >/dev/null 2>&1 || { cat /tmp/xvfb-development-agent.log || true; exit 1; }
          ts_ip="$(tailscale ip -4 | head -n1)"
          test -n "$ts_ip"
          echo "TAILSCALE_RUNNER_IP=$ts_ip" >> "$GITHUB_ENV"
          x11vnc -display :99 -rfbport 5900 -listen "$ts_ip" -nopw -forever -shared -quiet >/tmp/x11vnc-development-agent.log 2>&1 &
          echo $! >/tmp/x11vnc-development-agent.pid

      - name: Route browser phase through home exit node
        if: steps.manager_state.outputs.valid == 'true' && (steps.completion.outputs.complete != 'true' || steps.finalization.outputs.requires_agent == 'true')
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 3s 10s tailscale status
          timeout -k 5s 20s sudo tailscale set --exit-node="$HOME_EXIT_NODE"
          changed=false
          for i in {1..8}; do
            current="$(curl -fsS --connect-timeout 3 --max-time 5 https://api.ipify.org || true)"
            if [ -n "$current" ]; then
              current_hash="$(printf '%s' "$current" | sha256sum | awk '{print $1}')"
              if [ "$current_hash" != "$DIRECT_EGRESS_HASH" ]; then changed=true; break; fi
            fi
            sleep 2
          done
          [ "$changed" = true ] || { echo "::error::Tailscale exit node did not change runner egress."; exit 1; }

      - name: Observe worker and execute bounded recovery policy
        if: steps.manager_state.outputs.valid == 'true' && (steps.completion.outputs.complete != 'true' || steps.finalization.outputs.requires_agent == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manager_id="$(jq -r '.managerId' /tmp/task-manager-state.json)"
          chat_url="$(jq -r '.chat.url' /tmp/task-manager-state.json)"
          idle_message="$(jq -r '.idleMessage' /tmp/task-manager-state.json)"
          previous_count="$(jq -r '.chat.assistantCount // 0' /tmp/task-manager-state.json)"
          previous_hash="$(jq -r '.chat.lastAssistantHash // empty' /tmp/task-manager-state.json)"
          target_repo="$(jq -r '.target.repository' /tmp/task-manager-state.json)"
          target_branch="$(jq -r '.target.branch' /tmp/task-manager-state.json)"
          target_token="${AUDIT_CONTROLLER_GITHUB_TOKEN:-$GH_TOKEN}"
          continuity_mode="$(jq -r '.continuity.mode' /tmp/task-manager-state.json)"
          project_name="$(jq -r '.continuity.project.name // empty' /tmp/task-manager-state.json)"
          project_url="$(jq -r '.continuity.project.url // empty' /tmp/task-manager-state.json)"
          if [ "${{ steps.finalization.outputs.requires_agent }}" = true ]; then
            idle_message='[DEVELOPMENT_AGENT_MERGE_REPAIR_V1] Final merge into target main is blocked by branch integration state. Re-read the task lock and current target main, reconcile the same target branch without broadening scope, rerun every test affected by reconciliation, update the task lock, and write a fresh valid completion receipt. Do not create a new task or branch. Continue until the manager can merge this exact task into target main.'
          fi

          export WAKE_MODE='resume_existing'
          export CHAT_URL="$chat_url"
          export WAKE_ID="$manager_id"
          export WAKE_ACTION='observe'
          export WAKE_RESULT_PATH='/tmp/task-manager-observe.json'

          if ! node scripts/browser-agent-wake.mjs; then
            echo "::warning::Browser providers could not observe the chat; preserving the current worker for the next sweep rather than guessing that the agent died."
            jq '.lastDecision="OBSERVATION_PROVIDER_FAILURE" | .updatedAt=(now|todate)' /tmp/task-manager-state.json > /tmp/task-manager-next.json
            mv /tmp/task-manager-next.json /tmp/task-manager-state.json
          else
            chat_viewable="$(jq -r '.chatViewable // false' /tmp/task-manager-observe.json)"
            generating="$(jq -r '.generating // false' /tmp/task-manager-observe.json)"
            current_count="$(jq -r '.assistantCount // 0' /tmp/task-manager-observe.json)"
            current_hash="$(jq -r '.lastAssistantHash // empty' /tmp/task-manager-observe.json)"
            dead=false

            if [ "$chat_viewable" != true ]; then
              dead=true
              failure_reason='CHAT_UNVIEWABLE'
            elif [ "$generating" = true ] || [ "$current_count" -gt "$previous_count" ] || { [ -n "$current_hash" ] && [ "$current_hash" != "$previous_hash" ]; }; then
              jq --argjson count "$current_count" --arg hash "$current_hash"                 '.chat.assistantCount=$count | .chat.lastAssistantHash=$hash | .lastDecision="PRODUCTIVE" | .lastProductiveAt=(now|todate) | .updatedAt=(now|todate)'                 /tmp/task-manager-state.json > /tmp/task-manager-next.json
              mv /tmp/task-manager-next.json /tmp/task-manager-state.json
            else
              for attempt in 1 2 3; do
                export WAKE_ACTION='wake_and_wait'
                export WAKE_MESSAGE="$idle_message"
                export RESPONSE_WAIT_MS='120000'
                export REFRESH_BEFORE_WAKE='false'
                if [ "$attempt" -gt 1 ]; then export REFRESH_BEFORE_WAKE='true'; fi
                export WAKE_RESULT_PATH="/tmp/task-manager-attempt-$attempt.json"
                if ! node scripts/browser-agent-wake.mjs; then
                  echo "::warning::Prompt attempt $attempt hit a browser-provider failure; preserving the worker instead of declaring it dead."
                  dead=false
                  failure_reason='PROMPT_PROVIDER_FAILURE'
                  break
                fi
                attempt_dead_reason="$(jq -r '.deadReason // empty' "$WAKE_RESULT_PATH")"
                if [ "$attempt_dead_reason" = 'CHAT_UNVIEWABLE' ]; then
                  dead=true
                  failure_reason='CHAT_UNVIEWABLE'
                  break
                fi
                if [ "$(jq -r '.responded // false' "$WAKE_RESULT_PATH")" = true ]; then
                  next_count="$(jq -r '.after.assistantCount // 0' "$WAKE_RESULT_PATH")"
                  next_hash="$(jq -r '.after.lastAssistantHash // empty' "$WAKE_RESULT_PATH")"
                  jq --argjson count "$next_count" --arg hash "$next_hash" --argjson attempt "$attempt"                     '.chat.assistantCount=$count | .chat.lastAssistantHash=$hash | .lastDecision=("RESPONDED_AFTER_PROMPT_"+($attempt|tostring)) | .lastProductiveAt=(now|todate) | .updatedAt=(now|todate)'                     /tmp/task-manager-state.json > /tmp/task-manager-next.json
                  mv /tmp/task-manager-next.json /tmp/task-manager-state.json
                  dead=false
                  failure_reason=''
                  break
                fi
                if [ "$attempt" -eq 3 ]; then
                  dead=true
                  failure_reason='THREE_CONSECUTIVE_UNANSWERED_PROMPTS'
                fi
              done
            fi

            if [ "$dead" = true ]; then
              checkpoint_sha="$(GH_TOKEN="$target_token" gh api -X GET "repos/$target_repo/commits" -f sha="$target_branch" -f per_page=1 --jq '.[0].sha')"
              [[ "$checkpoint_sha" =~ ^[0-9a-f]{40}$ ]]
              generation="$(jq -r '.generation' /tmp/task-manager-state.json)"
              next_generation=$((generation + 1))
              spec_path="$(jq -r '.specification.path' /tmp/task-manager-state.json)"
              spec_ref="$(jq -r '.specification.ref' /tmp/task-manager-state.json)"
              spec_sha="$(jq -r '.specification.sha256' /tmp/task-manager-state.json)"
              skill_path="$(jq -r '.skill.path' /tmp/task-manager-state.json)"
              skill_ref="$(jq -r '.skill.ref' /tmp/task-manager-state.json)"
              skill_sha="$(jq -r '.skill.sha256' /tmp/task-manager-state.json)"
              task_lock_protocol_path="$(jq -r '.taskLock.protocol.path' /tmp/task-manager-state.json)"
              task_lock_protocol_ref="$(jq -r '.taskLock.protocol.ref' /tmp/task-manager-state.json)"
              task_lock_protocol_sha="$(jq -r '.taskLock.protocol.sha256' /tmp/task-manager-state.json)"
              task_lock_template_path="$(jq -r '.taskLock.template.path' /tmp/task-manager-state.json)"
              task_lock_template_sha="$(jq -r '.taskLock.template.sha256' /tmp/task-manager-state.json)"
              task_lock_state_path="$(jq -r '.taskLock.statePath' /tmp/task-manager-state.json)"
              predecessor="$chat_url"

              jq --arg predecessor "$predecessor" --arg reason "$failure_reason" --arg head "$checkpoint_sha"                 '.predecessorChatUrl=$predecessor
                 | .lastReplacementReason=$reason
                 | .target.lastCheckpointSha=$head
                 | .lastDecision="AGENT_DEAD_CHECKPOINT_SAVED"
                 | .checkpointSavedAt=(now|todate)
                 | .updatedAt=(now|todate)'                 /tmp/task-manager-state.json > /tmp/task-manager-next.json
              mv /tmp/task-manager-next.json /tmp/task-manager-state.json
              checkpoint_state_sha="$(gh api "$STATE_API?ref=main" --jq '.sha')"
              checkpoint_content="$(base64 -w0 /tmp/task-manager-state.json)"
              gh api --method PUT "$STATE_API"                 -f message="chore(task-manager): checkpoint dead agent $SAFE_ID"                 -f content="$checkpoint_content" -f sha="$checkpoint_state_sha" -f branch=main >/dev/null

              cat > /tmp/task-manager-recovery.txt <<EOF
              [DEVELOPMENT_AGENT_RECOVERY_V1]
              manager_id=$manager_id
              replacement_generation=$next_generation
              predecessor_chat=$predecessor
              replacement_reason=$failure_reason
              specification_repository=$GITHUB_REPOSITORY
              specification_ref=$spec_ref
              specification_path=$spec_path
              specification_sha256=$spec_sha
              skill_repository=$GITHUB_REPOSITORY
              skill_ref=$skill_ref
              skill_path=$skill_path
              skill_sha256=$skill_sha
              target_repository=$target_repo
              target_branch=$target_branch
              exact_resume_head=$checkpoint_sha
              task_lock_scope=development_upgrade_only
              task_lock_protocol_repository=$GITHUB_REPOSITORY
              task_lock_protocol_ref=$task_lock_protocol_ref
              task_lock_protocol_path=$task_lock_protocol_path
              task_lock_protocol_sha256=$task_lock_protocol_sha
              task_lock_template_path=$task_lock_template_path
              task_lock_template_sha256=$task_lock_template_sha
              task_lock_state_path=$task_lock_state_path

              The previous implementation chat is no longer functioning. Repository state is authoritative. Resume from the exact target-branch head above and continue the same development specification without repeating completed work. Before any implementation action, read the exact task-lock protocol and the existing task-lock state at task_lock_state_path. Preserve SATISFIED entries unless live verification disproves them, refresh CURRENT MAIN, and continue only the smallest REMAINING DELTA. If the lock state is unexpectedly missing, reconstruct it from the specification and current branch before implementation work. Do not turn PARKED OBSERVATIONS into scope. Reuse existing workflows and primitives whenever possible. Never add a GitHub Actions workflow to Audit-Controller. The task lock applies only to development/upgrade agents and must not be propagated into audit reviewer wakes, audit monitors/watchdogs, audit campaign orchestration, or other audit execution paths. Commit durable progress frequently.

              Completion remains machine-gated by process/development-agent-task-manager/completions/$SAFE_ID.json using schema curveyield-development-task-completion-v1 with exact specification/skill digests and passing tests. Continue until that condition is genuinely satisfied.
              EOF

              export WAKE_MODE='create_fresh'
              export CHAT_URL=''
              export WAKE_ACTION='wake'
              export WAKE_ID="$manager_id-generation-$next_generation"
              export WAKE_MESSAGE="$(cat /tmp/task-manager-recovery.txt)"
              export WAKE_RESULT_PATH='/tmp/task-manager-replacement.json'
              export CHATGPT_CHAT_NAME="$manager_id generation $next_generation"
              if [ "$continuity_mode" = managed_project ]; then
                export BROWSER_ROUTINE_ID='development-agent-project-open-v1'
                export CHATGPT_PROJECT_NAME="$project_name"
                export CHATGPT_PROJECT_URL="$project_url"
              else
                unset BROWSER_ROUTINE_ID CHATGPT_PROJECT_NAME CHATGPT_PROJECT_URL
              fi
              unset REFRESH_BEFORE_WAKE RESPONSE_WAIT_MS
              if node scripts/browser-agent-wake.mjs && jq -e '.ok==true and (.chatUrl|test("^https://chatgpt.com/(c/|g/g-p-[^/]+/c/)"))' /tmp/task-manager-replacement.json >/dev/null; then
                new_url="$(jq -r '.chatUrl' /tmp/task-manager-replacement.json)"
                new_count="$(jq -r '.after.assistantCount // 0' /tmp/task-manager-replacement.json)"
                new_hash="$(jq -r '.after.lastAssistantHash // empty' /tmp/task-manager-replacement.json)"
                if [ "$continuity_mode" = managed_project ]; then
                  replacement_project_url="$(jq -r '.projectUrl // empty' /tmp/task-manager-replacement.json)"
                  [ "$replacement_project_url" = "$project_url" ] || {
                    echo "::error::Replacement agent did not reopen the persisted managed Project URL."
                    exit 1
                  }
                fi
                jq --argjson generation "$next_generation" --arg predecessor "$predecessor" --arg reason "$failure_reason"                   --arg head "$checkpoint_sha" --arg url "$new_url" --argjson count "$new_count" --arg hash "$new_hash"                   '.generation=$generation | .replacementCount=((.replacementCount // 0)+1)
                   | .predecessorChatUrl=$predecessor | .lastReplacementReason=$reason
                   | .target.lastCheckpointSha=$head | .chat.url=$url
                   | .chat.assistantCount=$count | .chat.lastAssistantHash=$hash
                   | .lastDecision="REPLACED_DEAD_AGENT" | .replacedAt=(now|todate) | .updatedAt=(now|todate)'                    /tmp/task-manager-state.json > /tmp/task-manager-next.json
                mv /tmp/task-manager-next.json /tmp/task-manager-state.json
              else
                jq --arg reason "$failure_reason" --arg head "$checkpoint_sha"                   '.target.lastCheckpointSha=$head | .lastDecision="REPLACEMENT_CREATION_FAILED" | .lastReplacementReason=$reason | .updatedAt=(now|todate)'                   /tmp/task-manager-state.json > /tmp/task-manager-next.json
                mv /tmp/task-manager-next.json /tmp/task-manager-state.json
              fi
            fi
          fi

          current_sha="$(gh api "$STATE_API?ref=main" --jq '.sha' 2>/dev/null || true)"
          [ -n "$current_sha" ] || exit 0
          content="$(base64 -w0 /tmp/task-manager-state.json)"
          gh api --method PUT "$STATE_API" -f message="chore(task-manager): supervise $SAFE_ID" -f content="$content" -f sha="$current_sha" -f branch=main >/dev/null

      - name: Disable home exit node
        if: always() && steps.manager_state.outputs.valid == 'true' && (steps.completion.outputs.complete != 'true' || steps.finalization.outputs.requires_agent == 'true')
        shell: bash
        run: |
          set +e
          sudo tailscale set --exit-node=""

      - name: Cleanup browser display
        if: always() && steps.manager_state.outputs.valid == 'true' && (steps.completion.outputs.complete != 'true' || steps.finalization.outputs.requires_agent == 'true')
        shell: bash
        run: |
          set +e
          [ -f /tmp/x11vnc-development-agent.pid ] && kill "$(cat /tmp/x11vnc-development-agent.pid)" 2>/dev/null
          [ -f /tmp/xvfb-development-agent.pid ] && kill "$(cat /tmp/xvfb-development-agent.pid)" 2>/dev/null
