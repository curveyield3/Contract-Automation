name: Lite Phase 0 Bootstrap Recovery Dispatch v2

on:
  push:
    branches: [main]
    paths:
      - 'process/agent-upload/lite-phase0-bootstrap-recovery/*.json'

permissions:
  contents: read
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      requests: ${{ steps.requests.outputs.requests }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Find independent Phase-0 recovery requests
        id: requests
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          root=process/agent-upload/lite-phase0-bootstrap-recovery
          if [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            mapfile -t changed < <(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- "$root/")
          else
            mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- "$root/")
          fi
          : > /tmp/lite-phase0-recovery-requests.ndjson
          for request in "${changed[@]}"; do
            [[ "$request" =~ ^process/agent-upload/lite-phase0-bootstrap-recovery/[A-Za-z0-9._-]+\.json$ ]] || continue
            test -f "$request" || continue
            jq -ec --arg file "$request" '
              select(.schemaVersion=="curveyield-lite-phase0-bootstrap-recovery-v1"
                and (.campaign_id|type)=="string"
                and (.campaign_id|test("^[A-Za-z0-9._-]+-r[0-9]+$"))
                and (.campaign_path|type)=="string"
                and (.campaign_path|startswith("campaigns/")))
              | {request_path:$file,campaign_id:.campaign_id}
            ' "$request" >> /tmp/lite-phase0-recovery-requests.ndjson
          done
          echo "requests=$(jq -sc '{include:.}' /tmp/lite-phase0-recovery-requests.ndjson)" >> "$GITHUB_OUTPUT"
  dispatch:
    needs: discover
    if: ${{ needs.discover.outputs.requests != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.requests) }}
    concurrency:
      group: lite-phase0-bootstrap-recovery-${{ matrix.campaign_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve one recovery request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX_REQUEST: ${{ matrix.request_path }}
        shell: bash
        run: |
          set -euo pipefail
          req="$MATRIX_REQUEST"
          [[ "$req" =~ ^process/agent-upload/lite-phase0-bootstrap-recovery/[A-Za-z0-9._-]+\.json$ ]]
          test -f "$req"
          jq -e '
            .schemaVersion=="curveyield-lite-phase0-bootstrap-recovery-v1" and
            (.campaign_id|type=="string" and length>0) and
            (.campaign_path|type=="string" and startswith("campaigns/")) and
            (.audit_controller_ref|type=="string" and length>0) and
            ((.resume_from_finalize // false)|type=="boolean")
          ' "$req" >/dev/null
          {
            echo "resume_from_finalize=$(jq -r '.resume_from_finalize // false' "$req")"
            echo "campaign_id=$(jq -r '.campaign_id' "$req")"
            echo "campaign_path=$(jq -r '.campaign_path' "$req")"
            echo "audit_controller_ref=$(jq -r '.audit_controller_ref' "$req")"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch the same Phase-0 campaign
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run lite-phase0-bootstrap-v1.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f campaign_id="${{ steps.request.outputs.campaign_id }}" \
            -f campaign_path="${{ steps.request.outputs.campaign_path }}" \
            -f audit_controller_ref="${{ steps.request.outputs.audit_controller_ref }}" \
            -f resume_from_finalize="${{ steps.request.outputs.resume_from_finalize }}"

      - name: Summarize
        shell: bash
        run: |
          {
            echo "## Lite Phase-0 bootstrap recovery dispatch"
            echo "- Campaign: ${{ steps.request.outputs.campaign_id }}"
            echo "- Workspace: ${{ steps.request.outputs.campaign_path }}"
            echo "- Audit-Controller ref: ${{ steps.request.outputs.audit_controller_ref }}"
            echo "- Action: re-dispatched the existing campaign; no new campaign revision was created."
          } >> "$GITHUB_STEP_SUMMARY"
