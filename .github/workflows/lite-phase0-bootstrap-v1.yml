name: Lite Fully Automated Phase 0 Deploy Config Only v2

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: Exact campaign ID created by Audit Source Initialization
        required: true
        type: string
      campaign_path:
        description: Exact Audit-Controller campaign workspace path
        required: true
        type: string
      audit_controller_ref:
        description: Audit-Controller ref containing the campaign
        required: false
        default: main
        type: string

      resume_from_finalize:
        description: Finalize already-published Phase 0 build and forked native deployment/configuration evidence
        required: false
        default: false
        type: boolean


permissions:
  contents: write
  actions: write

concurrency:
  group: lite-phase0-bootstrap-${{ inputs.campaign_id }}
  cancel-in-progress: false

jobs:
  intelligence:
    if: ${{ !inputs.resume_from_finalize }}
    uses: ./.github/workflows/lite-phase0-intelligence-v1.yml
    with:
      campaign_id: ${{ inputs.campaign_id }}
      campaign_path: ${{ inputs.campaign_path }}
      audit_controller_ref: ${{ inputs.audit_controller_ref }}
    secrets: inherit

  fork-deploy-config:
    needs: intelligence
    if: ${{ !inputs.resume_from_finalize && needs.intelligence.result == 'success' }}
    uses: ./.github/workflows/lite-phase0-randomized-simulation-v1.yml
    with:
      campaign_id: ${{ inputs.campaign_id }}
      campaign_path: ${{ inputs.campaign_path }}
      audit_controller_ref: ${{ inputs.audit_controller_ref }}
    secrets: inherit

  finalize-and-launch-reviewer1:
    needs: [fork-deploy-config]
    if: ${{ always() && (needs.fork-deploy-config.result == 'success' || inputs.resume_from_finalize) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CAMPAIGN_ID: ${{ inputs.campaign_id }}
      CAMPAIGN_PATH: ${{ inputs.campaign_path }}
      AUDIT_CONTROLLER_REF: ${{ inputs.audit_controller_ref }}
    steps:
      - name: Checkout trusted Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Restore pinned Node dependencies (shared Phase 0 cache)
        uses: ./.github/actions/setup-phase0-node-cache

      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Checkout exact Audit-Controller campaign
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/checkout-audit-controller-once-v1.sh .audit-controller "$AUDIT_CONTROLLER_REF" branch "$CAMPAIGN_PATH"

      - name: Finalize machine Phase 0 receipt
        id: finalize
        shell: bash
        run: |
          set -euo pipefail
          node scripts/lite-phase0-finalize-v1.mjs             --controller-root .audit-controller             --campaign-path "$CAMPAIGN_PATH"             --contract-automation-sha "$GITHUB_SHA" --bootstrap-sha "$GITHUB_SHA"             --workflow-run-id "$GITHUB_RUN_ID" | tee /tmp/phase0-finalize.json
          test "$(jq -r '.status' /tmp/phase0-finalize.json)" = PASS
          echo "campaign_name=$(jq -r '.campaignName' /tmp/phase0-finalize.json)" >> "$GITHUB_OUTPUT"

      - name: Publish sealed Phase 0 receipt
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd .audit-controller
          git config user.name 'CurveYield Phase0 Automation'
          git config user.email 'phase0-automation@users.noreply.github.com'
          git add -- "$CAMPAIGN_PATH" "Audit Campaign Directory/campaigns"
          if git diff --cached --quiet; then
            echo "::error::Phase 0 finalizer produced no durable changes"
            exit 1
          fi
          git commit -m "audit(phase0): seal automated bootstrap $CAMPAIGN_ID"
          git push origin "HEAD:$AUDIT_CONTROLLER_REF"

      - name: Activate first audit agent through existing orchestrator/watchdog
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          slug="$(printf '%s' "$CAMPAIGN_ID" | sed -E 's/-r[0-9]+$//')"
          directory=".audit-controller/Audit Campaign Directory/campaigns/$slug.json"
          [ -s "$directory" ] || { echo "::error::Canonical campaign directory missing"; exit 1; }
          transport="$(jq -r '.deliveryTransport // "GITHUB_BROWSER"' "$directory")"
          if [ "$transport" = AGENT_DELIVERY ]; then
            gh workflow run lite-work-relay-v1.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f operation=successor -f campaign_id="$CAMPAIGN_ID" \
              -f campaign_name="${{ steps.finalize.outputs.campaign_name }}" \
              -f campaign_path="$CAMPAIGN_PATH" -f audit_controller_ref="$AUDIT_CONTROLLER_REF"
          elif [ "$transport" = GITHUB_BROWSER ]; then
            gh workflow run lite-audit-browser-orchestrator-v1.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f campaign_id="$CAMPAIGN_ID" \
              -f campaign_name="${{ steps.finalize.outputs.campaign_name }}" \
              -f campaign_path="$CAMPAIGN_PATH" -f audit_controller_ref="$AUDIT_CONTROLLER_REF"
          else
            echo "::error::Unknown campaign delivery transport $transport"; exit 1
          fi

      - name: Summarize
        shell: bash
        run: |
          {
            echo "## Fully automated Lite Phase 0"
            echo
            echo "- Campaign: $CAMPAIGN_ID"
            echo "- Source input surface: one ZIP URL through Audit Source Initialization"
            echo "- Phase 0 agent: none"
            echo "- Phase-0 receipt: sealed and validated"
            echo "- Separate completion/validation/handoff receipt files: not created"
            echo "- First audit agent: reviewer-1 activation dispatched through the existing orchestrator/watchdog system"
          } >> "$GITHUB_STEP_SUMMARY"
