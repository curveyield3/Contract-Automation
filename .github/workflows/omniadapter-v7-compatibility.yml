name: CurveYield OmniAdapter V7 Compatibility
on:
  push:
    branches: [ethereum-omniadapter-v7-compatibility-v1]
    paths:
      - github-native-sim/morpho-ethereum-v1/CurveYieldOmniAdapterV7.sol
      - github-native-sim/morpho-ethereum-v1/test/OmniAdapterV7Compatibility.t.sol
      - .github/workflows/omniadapter-v7-compatibility.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-and-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: foundry-rs/foundry-toolchain@v1
        with: {version: stable}
      - name: Compile original exact Solidity 0.8.28 version and enforce EIP-170
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .omni-v7-build
          cat > foundry.toml <<'TOML'
          [profile.default]
          src = "github-native-sim/morpho-ethereum-v1"
          test = "github-native-sim/morpho-ethereum-v1/test"
          out = ".omni-v7-build/out"
          libs = []
          solc_version = "0.8.28"
          optimizer = true
          optimizer_runs = 200
          evm_version = "cancun"
          TOML
          forge build --force --sizes 2>&1 | tee .omni-v7-build/compile.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('CurveYieldOmniAdapterV7','CurveYieldOmniAdapterDeployerV7'):
              artifacts=list(Path('.omni-v7-build/out').rglob(name+'.json'))
              assert len(artifacts)==1,(name,artifacts)
              d=json.loads(artifacts[0].read_text())
              deployed=d['deployedBytecode']['object']
              created=d['bytecode']['object']
              size=(len(deployed)-2)//2
              print('RUNTIME_BYTES',name,size,'CREATION_BYTES',(len(created)-2)//2)
              assert size<=24576,(name,'EIP-170',size)
          PY
      - name: Execute dedicated Vault V2 callback compatibility tests
        shell: bash
        run: |
          set -euo pipefail
          forge test --match-path 'github-native-sim/morpho-ethereum-v1/test/OmniAdapterV7Compatibility.t.sol' -vvv 2>&1 | tee .omni-v7-build/compatibility-test.log
      - name: Archive exact compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omniadapter-v7-compilation-${{ github.run_id }}
          path: |
            .omni-v7-build/compile.log
            .omni-v7-build/compatibility-test.log
          if-no-files-found: warn
