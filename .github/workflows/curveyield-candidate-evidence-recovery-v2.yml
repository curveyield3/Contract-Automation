name: CurveYield v16 Candidate Evidence Recovery v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/curveyield-candidate-evidence-recovery-v2.yml'
      - 'scripts/recover-curveyield-candidate-evidence-v2.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curveyield-dex-v16-source-r4-read-only-raw-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh
      - name: Sparse checkout of frozen candidate evidence
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone curveyield3/Audit-Controller .audit-controller -- --filter=blob:none --sparse
          cd .audit-controller
          git sparse-checkout set 'campaigns/CurveYield DEX v16 Source r4/evidence/phase5-boundary' 'campaigns/CurveYield DEX v16 Source r4/work/phase-05/execution-requests' 'Audit Campaign Directory/campaigns'
          jq -e '.campaignId=="curveyield-dex-v16-source-r4" and .campaignStatus=="COMPLETE" and .sourceSha256=="201a70f61f14e1919d111a972d090b07cf13e5fc06fee10738785adfb6760f4e"' 'Audit Campaign Directory/campaigns/curveyield-dex-v16-source.json'
      - name: Authenticate and extract old raw results without simulation
        run: node scripts/recover-curveyield-candidate-evidence-v2.mjs .audit-controller
      - name: Publish campaign-local readable evidence
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd .audit-controller
          git config user.name 'CurveYield Audit Evidence Recovery'
          git config user.email 'audit-evidence-recovery@users.noreply.github.com'
          git add -A -- 'campaigns/CurveYield DEX v16 Source r4/evidence/phase5-boundary'
          if git diff --cached --quiet; then echo 'Existing extraction is identical; no write'; exit 0; fi
          git commit -m 'audit(evidence): recover digest-verified raw candidate observations v2'
          git pull --rebase origin main
          git push origin HEAD:main
