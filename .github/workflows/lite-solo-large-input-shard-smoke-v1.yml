name: Lite-Solo Oversized Machine Input Shard Smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lite-solo-large-input-shard-smoke-v1.yml'
      - 'scripts/lib/lite-solo-work-shards-v1.mjs'
permissions:
  contents: read
jobs:
  shard-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert exact work-form round-trip and tamper rejection
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import {shardWorkFormV1,restoreWorkShardsV1} from './scripts/lib/lite-solo-work-shards-v1.mjs';
          const root=fs.mkdtempSync(path.join(os.tmpdir(),'solo-shard-test-'));
          const rel='campaigns/fixture/work/phase-01/WORK_FORM_v1.json';
          const full=path.join(root,rel);
          fs.mkdirSync(path.dirname(full),{recursive:true});
          const big={
            surfaceId:'SURF-0001',
            relatedFunctions:Array.from({length:2400},(_,i)=>({functionId:'FUNCTION-'+i,exposure:'external',evidence:'SOURCE-'+i,detail:'T'.repeat(65)})),
            nested:{paragraph:'Multibyte Ω例🙂'.repeat(8000)}
          };
          const original={schemaVersion:'curveyield-lite-phase-work-form-v1',phase:1,
            automationInputs:{controllerOwnedAutomationInputs:['structuralInventory'],
              structuralInventory:{securitySurfaces:[big,{surfaceId:'SURF-0002',note:'second item'}]}},
            actions:{'step-1':{section:'Discovery',outputs:{sourceReviewRecords:Array.from({length:60},(_,i)=>({recordKey:'AUTO-SRC-'+i,observation:'<REQUIRED>'}))}}}};
          const originalText=JSON.stringify(original,null,2)+'\n';
          fs.writeFileSync(full,originalText);
          const shard=shardWorkFormV1({root,formRel:rel,phase:1});
          assert.ok(shard&&shard.shards>=2);
          assert.ok(!fs.existsSync(full));
          const dir=path.dirname(path.join(root,shard.indexRel));
          const chunkFiles=fs.readdirSync(dir).filter(n=>/^input-[0-9]{4}-[0-9]{4}_v1.json$/.test(n));
          assert.ok(chunkFiles.length>=2);
          for(const f of fs.readdirSync(dir).filter(n=>n.endsWith('.json')&&!n.startsWith('INDEX')))
            assert.ok(fs.statSync(path.join(dir,f)).size<=64*1024,'oversized shard '+f);
          const restored=restoreWorkShardsV1({root,indexRel:shard.indexRel});
          assert.equal(restored.content,originalText,'exact source work-form content changed');
          const part=path.join(dir,chunkFiles[0]);
          const j=JSON.parse(fs.readFileSync(part,'utf8'));j.base64=Buffer.from('tampered').toString('base64');
          fs.writeFileSync(part,JSON.stringify(j,null,2)+'\n');
          assert.throws(()=>restoreWorkShardsV1({root,indexRel:shard.indexRel}),/digest mismatch|declared length|chunk/);
          const giantEditable={schemaVersion:'curveyield-lite-phase-work-form-v1',phase:1,actions:{step:{outputs:{records:[{content:'A'.repeat(180000)}]}}}};
          fs.writeFileSync(full,JSON.stringify(giantEditable,null,2)+'\n');
          assert.throws(()=>shardWorkFormV1({root,formRel:rel,phase:1}),/oversized editable work-form/);
          console.log('PASS: 64 KiB bounded sharding, exact reconstruction, tamper rejection, oversized editable fail-closed');
          NODE
