                  continue
              lines = target.read_bytes().decode().splitlines(True) if target.exists() else []
              for i,j,s in reversed(ops):
                  lines[i:j] = s.splitlines(True)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes("".join(lines).encode())
          files = sorted(p for p in (root / "workspace").rglob("*") if p.is_file())
          manifest = "".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}\n" for p in files)
          assert len(files) == 313, len(files)
          digest = hashlib.sha256(manifest.encode()).hexdigest()
          assert digest == os.environ["V12_WORKSPACE_SHA256"], digest
          print("Exact V12 workspace verified:", len(files), "files; SHA256", digest)
          delta = json.loads(zlib.decompress(pathlib.Path(".source-zip-smoke/workspace-v13.delta").read_bytes()))
          for name, ops in delta.items():
              p = pathlib.PurePosixPath(name)
              assert p.parts[0] == "workspace" and not p.is_absolute() and ".." not in p.parts
              target = root.joinpath(*p.parts)
              if ops is None:
                  target.unlink()
                  continue
              lines = target.read_bytes().decode().splitlines(True) if target.exists() else []
              for i,j,s in reversed(ops):
                  lines[i:j] = s.splitlines(True)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes("".join(lines).encode())
          files = sorted(p for p in (root / "workspace").rglob("*") if p.is_file())
          manifest = "".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}\n" for p in files)
          assert len(files) == 313, len(files)
          digest = hashlib.sha256(manifest.encode()).hexdigest()
          assert digest == os.environ["V13_WORKSPACE_SHA256"], digest
          print("Exact V13 workspace verified:", len(files), "files; SHA256", digest)
          delta = json.loads(zlib.decompress(pathlib.Path(".source-zip-smoke/workspace-v14.delta").read_bytes()))
          for name, ops in delta.items():
              p = pathlib.PurePosixPath(name)
              assert p.parts[0] == "workspace" and not p.is_absolute() and ".." not in p.parts
              target = root.joinpath(*p.parts)
              if ops is None:
                  target.unlink()
                  continue
              lines = target.read_bytes().decode().splitlines(True) if target.exists() else []
              for i,j,s in reversed(ops):
                  lines[i:j] = s.splitlines(True)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes("".join(lines).encode())
          files = sorted(p for p in (root / "workspace").rglob("*") if p.is_file())
          manifest = "".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}\n" for p in files)
          assert len(files) == 313, len(files)
          digest = hashlib.sha256(manifest.encode()).hexdigest()
          assert digest == os.environ["V14_WORKSPACE_SHA256"], digest
          print("Exact V14 workspace verified:", len(files), "files; SHA256", digest)
          delta = json.loads(zlib.decompress(pathlib.Path(".source-zip-smoke/workspace-v15.delta").read_bytes()))
          for name, ops in delta.items():
              p = pathlib.PurePosixPath(name)
              assert p.parts[0] == "workspace" and not p.is_absolute() and ".." not in p.parts
              target = root.joinpath(*p.parts)
              if ops is None:
                  target.unlink()
                  continue
              lines = target.read_bytes().decode().splitlines(True) if target.exists() else []
              for i,j,s in reversed(ops):
                  lines[i:j] = s.splitlines(True)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes("".join(lines).encode())
          files = sorted(p for p in (root / "workspace").rglob("*") if p.is_file())
          manifest = "".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}\n" for p in files)
          assert len(files) == 313, len(files)
          digest = hashlib.sha256(manifest.encode()).hexdigest()
          assert digest == os.environ["V15_WORKSPACE_SHA256"], digest
          print("Exact V15 workspace verified:", len(files), "files; SHA256", digest)
          delta = json.loads(zlib.decompress(pathlib.Path(".source-zip-smoke/workspace-v16.delta").read_bytes()))
          for name, ops in delta.items():
              p = pathlib.PurePosixPath(name)
              assert p.parts[0] == "workspace" and not p.is_absolute() and ".." not in p.parts
              target = root.joinpath(*p.parts)
              if ops is None:
                  target.unlink()
                  continue
              lines = target.read_bytes().decode().splitlines(True) if target.exists() else []
              for i,j,s in reversed(ops):
                  lines[i:j] = s.splitlines(True)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes("".join(lines).encode())
          files = sorted(p for p in (root / "workspace").rglob("*") if p.is_file())
          manifest = "".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}\n" for p in files)
          assert len(files) == 312, len(files)
          digest = hashlib.sha256(manifest.encode()).hexdigest()
          assert digest == os.environ["V16_WORKSPACE_SHA256"], digest
          print("Exact V16 workspace verified:", len(files), "files; SHA256", digest)
          delta = json.loads(zlib.decompress(pathlib.Path(".source-zip-smoke/workspace-v17.delta").read_bytes()))
          for name, ops in delta.items():
              p = pathlib.PurePosixPath(name)
              assert p.parts[0] == "workspace" and not p.is_absolute() and ".." not in p.parts
              target = root.joinpath(*p.parts)
              if ops is None:
                  target.unlink()
                  continue
              lines = target.read_bytes().decode().splitlines(True) if target.exists() else []
              for i,j,s in reversed(ops):
                  lines[i:j] = s.splitlines(True)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes("".join(lines).encode())
          files = sorted(p for p in (root / "workspace").rglob("*") if p.is_file())
          manifest = "".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}\n" for p in files)
          assert len(files) == 312, len(files)
          digest = hashlib.sha256(manifest.encode()).hexdigest()
          assert digest == os.environ["V17_WORKSPACE_SHA256"], digest
          print("Exact V17 workspace verified:", len(files), "files; SHA256", digest)
          project = root / "workspace" / "contracts-repo" / "CurveYield DEX"
          assert (project / "package-lock.json").is_file()
          assert (project / "tooling/scripts/deployCurveYieldDexFresh.mjs").is_file()
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"project_dir={project}\n")
          PY
      - name: Install locked compiler dependencies
        id: install
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm ci --no-audit --no-fund --ignore-scripts > "$GITHUB_WORKSPACE/.source-zip-smoke/install.log" 2>&1
          compiler_dir="$(mktemp -d)"
          npm install --prefix "$compiler_dir" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund solc-0.8.26@npm:solc@0.8.26 solc-0.8.27@npm:solc@0.8.27 @openzeppelin/contracts@5.4.0 >> "$GITHUB_WORKSPACE/.source-zip-smoke/install.log" 2>&1
          ln -s "$compiler_dir/node_modules/solc-0.8.26" node_modules/solc-0.8.26
          ln -s "$compiler_dir/node_modules/solc-0.8.27" node_modules/solc-0.8.27
          # Match the exact Balancer upstream revision yarn.lock.
          mv node_modules/@openzeppelin/contracts "$compiler_dir/original-openzeppelin-contracts"
          ln -s "$compiler_dir/node_modules/@openzeppelin/contracts" node_modules/@openzeppelin/contracts
          node -e 'const p=require("./node_modules/@openzeppelin/contracts/package.json"); if(p.version!=="5.4.0") process.exit(1); console.log("Resolved OpenZeppelin:",p.version)' >> "$GITHUB_WORKSPACE/.source-zip-smoke/install.log"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile, deploy and qualify V17 Stable Surge callbacks and fee mathematics on an isolated Base fork
        id: compile
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
          RPC_BASE: ${{ secrets.RPC_BASE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RPC_BASE:-}" || { echo "::error::RPC_BASE unavailable; cannot run authenticated Base fork"; exit 1; }
          export BASE_RPC_URL=http://127.0.0.1:8545
          test "$(cast chain-id --rpc-url "$RPC_BASE")" = 8453
          export PINNED_BLOCK="$(cast block-number --rpc-url "$RPC_BASE")"
          block_hash() {
            RPC_CHECK_URL="$1" node --input-type=module -e 'const r=await fetch(process.env.RPC_CHECK_URL,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method:"eth_getBlockByNumber",params:["0x"+BigInt(process.env.PINNED_BLOCK).toString(16),false]})}); if(!r.ok)throw new Error("Block RPC HTTP failure"); const j=await r.json(); const hash=j.result?.hash; if(!/^0x[0-9a-fA-F]{64}$/.test(hash||""))throw new Error("Missing authoritative block hash");process.stdout.write(hash.toLowerCase());'
          }
          export PINNED_HASH="$(block_hash "$RPC_BASE")"
          anvil --fork-url "$RPC_BASE" --fork-block-number "$PINNED_BLOCK" --chain-id 8453 --host 127.0.0.1 --port 8545 --compute-units-per-second 30 --retries 8 --fork-retry-backoff 2000 --silent > "$GITHUB_WORKSPACE/.source-zip-smoke/anvil.log" 2>&1 &
          anvil_pid=$!
          trap 'kill "$anvil_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if cast chain-id --rpc-url "$BASE_RPC_URL" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          test "$(cast chain-id --rpc-url "$BASE_RPC_URL")" = 8453
          test "$(block_hash "$BASE_RPC_URL")" = "$PINNED_HASH"
          echo "Pinned Base fork block $PINNED_BLOCK hash $PINNED_HASH"
          cd "$PROJECT_DIR"
          export DEPLOYER_PRIVATE_KEY="$(node -e 'process.stdout.write("0x"+require("node:crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::$DEPLOYER_PRIVATE_KEY"
          export DEPLOYER_ADDRESS="$(cast wallet address --private-key "$DEPLOYER_PRIVATE_KEY")"
          cast rpc anvil_setBalance "$DEPLOYER_ADDRESS" 0x3635c9adc5dea00000 --rpc-url "$BASE_RPC_URL" >/dev/null
          export MAX_FEE_PER_GAS_WEI="$(node -e 'const f=BigInt(process.argv[1]);process.stdout.write((f*3n+10000000n).toString())' "$(cast block latest --rpc-url "$BASE_RPC_URL" --json | jq -er .baseFeePerGas)")"
          npm run ops:deploy-curveyield-dex-fresh > "$GITHUB_WORKSPACE/.source-zip-smoke/compile.log" 2>&1
          node --input-type=module > "$GITHUB_WORKSPACE/.source-zip-smoke/fork.log" 2>&1 <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createPublicClient, createWalletClient, defineChain, http, parseAbi, toFunctionSelector, zeroAddress, maxUint256} from 'viem';
          import {privateKeyToAccount} from 'viem/accounts';
          const url='http://127.0.0.1:8545';
          assert.equal(process.env.BASE_RPC_URL,url);
          const chain=defineChain({id:8453,name:'Isolated Base fork',nativeCurrency:{name:'Ether',symbol:'ETH',decimals:18},rpcUrls:{default:{http:[url]}}});
          const transport=http(url);
          const pub=createPublicClient({chain,transport});
          assert.equal(await pub.getChainId(),8453);
          assert.equal((await pub.getBlock({blockNumber:BigInt(process.env.PINNED_BLOCK)})).hash,process.env.PINNED_HASH);
          const account=privateKeyToAccount(process.env.DEPLOYER_PRIVATE_KEY);
          const wallet=createWalletClient({account,chain,transport});
          const reports=fs.readdirSync('deployment-artifacts').filter(x=>x.startsWith('curveyield-dex-fresh-')).sort();
          const r=JSON.parse(fs.readFileSync('deployment-artifacts/'+reports.at(-1),'utf8'));
          assert.ok(r.completedAt && !r.error);
          assert.equal(Object.keys(r.deployments).length,20);
          assert.ok(!r.deployments.CurveYieldProtocolRevenue);
          const addr=n=>r.deployments[n].address;
          for(const d of Object.values(r.deployments)) assert.ok((await pub.getCode({address:d.address})).length>2);
          const dao=r.dao, router=addr('Router'), factory=addr('StablePoolFactory'), vault=addr('Vault'), volume=addr('CurveYieldVolumeFeeController'), infra=addr('CurveYieldHookInfrastructure');
          const read=(address,abi,functionName,args=[])=>pub.readContract({address,abi,functionName,args});
          const receipts=[];
          async function send(w,address,abi,functionName,args=[],value=0n) {
            const s=await pub.simulateContract({account:w.account,address,abi,functionName,args,value});
            const hash=await w.writeContract(s.request);
            const receipt=await pub.waitForTransactionReceipt({hash});
            assert.equal(receipt.status,'success');
            receipts.push({functionName,hash,gasUsed:receipt.gasUsed.toString()});
            return s.result;
          }
          async function impersonate(address) {
            await pub.request({method:'anvil_impersonateAccount',params:[address]});
            await pub.request({method:'anvil_setBalance',params:[address,'0x56bc75e2d63100000']});
            return createWalletClient({account:address,chain,transport});
          }
          // Actual fork assets: canonical WETH and native USDC; acquire test USDC
          // from real fork pool balance only, via local impersonation.
          const weth=r.weth, usdc='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';
          const uni='0x33128a8fC17869897dcE68Ed026d694621f6FDfD';
          const token=parseAbi(['function balanceOf(address) view returns (uint256)','function approve(address,uint256) returns (bool)','function transfer(address,uint256) returns (bool)','function decimals() view returns (uint8)','function deposit() payable']);
          assert.equal(await read(weth,token,'decimals'),18);
          assert.equal(await read(usdc,token,'decimals'),6);
          const uabi=parseAbi(['function getPool(address,address,uint24) view returns (address)']);
          let holder;
          for(const tier of [500,3000,100,10000]){
            const p=await read(uni,uabi,'getPool',[weth,usdc,tier]);
            if(p!==zeroAddress && await read(usdc,token,'balanceOf',[p])>=100000000n){holder=p;break;}
          }
          assert.ok(holder,'No actual USDC pool with enough local fork fixture funds');
          const holderWallet=await impersonate(holder);
          await send(holderWallet,usdc,token,'transfer',[account.address,100000000n]);
          await pub.request({method:'anvil_stopImpersonatingAccount',params:[holder]});
          await send(wallet,weth,token,'deposit',[],20n*10n**18n);
          const permit=parseAbi(['function approve(address,address,uint160,uint48)']);
          const expiry=Number((await pub.getBlock()).timestamp)+86400;
          for(const t of [weth,usdc]){
            await send(wallet,t,token,'approve',[r.permit2,maxUint256]);
            await send(wallet,r.permit2,permit,'approve',[t,router,(1n<<160n)-1n,expiry]);
          }
          const create=parseAbi(['function create(string,string,(address token,uint8 tokenType,address rateProvider,bool paysYieldFees)[],uint256,(address pauseManager,address swapFeeManager,address poolCreator),uint256,address,bool,bool,bytes32) returns (address)']);
          const configs=[weth,usdc].map(token=>({token,tokenType:0,rateProvider:zeroAddress,paysYieldFees:false}));
          const route=parseAbi(['function initialize(address,address[],uint256[],uint256,bool,bytes) payable returns (uint256)','function swapSingleTokenExactIn(address,address,address,uint256,uint256,uint256,bool,bytes) payable returns (uint256)','function swapSingleTokenExactOut(address,address,address,uint256,uint256,uint256,bool,bytes) payable returns (uint256)','function addLiquidityProportional(address,uint256[],uint256,bool,bytes) payable returns (uint256[])','function removeLiquidityProportional(address,uint256,uint256[],bool,bytes) payable returns (uint256[])','function donate(address,uint256[],bool,bytes) payable','function addLiquidityUnbalanced(address,uint256[],uint256,bool,bytes) payable returns (uint256)']);
          const params='(uint8 kind,uint256 amountGivenScaled18,uint256[] balancesScaled18,uint256 indexIn,uint256 indexOut,address router,bytes userData)';
          const afterParams='(uint8 kind,address tokenIn,address tokenOut,uint256 amountInScaled18,uint256 amountOutScaled18,uint256 tokenInBalanceScaled18,uint256 tokenOutBalanceScaled18,uint256 amountCalculatedScaled18,uint256 amountCalculatedRaw,address router,address pool,bytes userData)';
          const hookAbi=parseAbi(['function getHookFlags() view returns ((bool enableHookAdjustedAmounts,bool shouldCallBeforeInitialize,bool shouldCallAfterInitialize,bool shouldCallComputeDynamicSwapFee,bool shouldCallBeforeSwap,bool shouldCallAfterSwap,bool shouldCallBeforeAddLiquidity,bool shouldCallAfterAddLiquidity,bool shouldCallBeforeRemoveLiquidity,bool shouldCallAfterRemoveLiquidity,bool shouldCallAdjustSwapGiven))','function getDefaultMaxSurgeFeePercentage() view returns (uint256)','function getDefaultSurgeThresholdPercentage() view returns (uint256)','function getMaxSurgeFeePercentage(address) view returns (uint256)','function getSurgeThresholdPercentage(address) view returns (uint256)','function setMaxSurgeFeePercentage(address,uint256)','function setSurgeThresholdPercentage(address,uint256)','function computeSwapSurgeFeePercentage('+params+',address,uint256) view returns (uint256)','function isSurgingSwap('+params+',address,uint256) view returns (bool)','function onComputeDynamicSwapFeePercentage('+params+',address,uint256) view returns (bool,uint256)','function onAdjustSwapGiven(address,address,uint256,bool) returns (uint256)','function onAfterSwap('+afterParams+') returns (bool,uint256)','function onBeforeSwap('+params+',address) returns (bool)','function onAfterAddLiquidity(address,address,uint8,uint256[],uint256[],uint256,uint256[],bytes) returns (bool,uint256[])','function onAfterRemoveLiquidity(address,address,uint8,uint256,uint256[],uint256[],uint256[],bytes) returns (bool,uint256[])','function onBeforeInitialize(uint256[],bytes) returns (bool)','function onAfterInitialize(uint256[],uint256,bytes) returns (bool)','function onBeforeAddLiquidity(address,address,uint8,uint256[],uint256,uint256[],bytes) returns (bool)','function onBeforeRemoveLiquidity(address,address,uint8,uint256,uint256[],uint256[],bytes) returns (bool)','function getVault() view returns (address)','function getAuthorizer() view returns (address)','function getActionId(bytes4) view returns (bytes32)','function version() view returns (string)','function infrastructure() view returns (address)','function volumeFeeController() view returns (address)','function combinedFeeCap() view returns (uint256)']);
          const va=parseAbi(['function getCurrentLiveBalances(address) view returns (uint256[])','function getPoolHook(address) view returns (address)','function getAuthorizer() view returns (address)','function computeDynamicSwapFeePercentage(address,'+params+') view returns (uint256)']);
          const vol=parseAbi(['function setPoolVolumeFeeConfig(address,uint256,uint8,uint8)','function getPoolActivityState(address) view returns (uint128,uint48)','function previewVolumeSurcharge(address,uint256,uint256,uint256[]) view returns (uint256)']);
          const pa=parseAbi(['function onSwap('+params+') view returns (uint256)']);
          const tax=parseAbi(['function setTokenPolicy(address,(uint16 depositBps,uint16 withdrawalBps,uint16 burnBps,uint16 transferFeeBps))']);
          const same=(a,b)=>assert.equal(a.toLowerCase(),b.toLowerCase());
          const W=10n**18n, fee=10n**16n, threshold=3n*10n**17n, max=8n*10n**17n;
          const medianImbalance=balances=>{
            const s=[...balances].sort((a,b)=>a<b?-1:a>b?1:0), m=s.length>>1;
            const median=s.length%2?s[m]:(s[m-1]+s[m])/2n;
            return s.reduce((a,b)=>a+(b>median?b-median:median-b),0n)*W/s.reduce((a,b)=>a+b,0n);
          };
          const daoWallet=await impersonate(dao);
          for(const t of [weth,usdc]) await send(daoWallet,infra,tax,'setTokenPolicy',[t,{depositBps:25,withdrawalBps:35,burnBps:0,transferFeeBps:50}]);
          const scenarios=[];
          for(const [n,name] of ['CurveYieldStableSurgeHook','CurveYieldStableSurgeVolumeHookV14'].entries()){
            const combined=n===1, hook=addr(name);
            const pool=await send(wallet,factory,create,'create',['V17 Stable qualification '+n,'V17S'+n,configs,100n,{pauseManager:zeroAddress,swapFeeManager:account.address,poolCreator:account.address},fee,hook,true,true,'0x'+(n+1).toString(16).padStart(64,'0')]);
            same(await read(vault,va,'getPoolHook',[pool]),hook);
            same(await read(hook,hookAbi,'getVault'),vault);
            same(await read(hook,hookAbi,'getAuthorizer'),await read(vault,va,'getAuthorizer'));
            same(await read(hook,hookAbi,'infrastructure'),infra);
            assert.ok((await read(hook,hookAbi,'version')).length);
            assert.match(await read(hook,hookAbi,'getActionId',[toFunctionSelector('setMaxSurgeFeePercentage(address,uint256)')]),/^0x[0-9a-f]{64}$/i);
            const flags=await read(hook,hookAbi,'getHookFlags');
            assert.equal(flags.shouldCallBeforeSwap,combined);
            for(const flag of ['enableHookAdjustedAmounts','shouldCallComputeDynamicSwapFee','shouldCallAfterSwap','shouldCallAfterAddLiquidity','shouldCallAfterRemoveLiquidity','shouldCallAdjustSwapGiven']) assert.equal(flags[flag],true);
            for(const flag of ['shouldCallBeforeInitialize','shouldCallAfterInitialize','shouldCallBeforeAddLiquidity','shouldCallBeforeRemoveLiquidity']) assert.equal(flags[flag],false);
            assert.equal(await read(hook,hookAbi,'getDefaultMaxSurgeFeePercentage'),max);
            assert.equal(await read(hook,hookAbi,'getDefaultSurgeThresholdPercentage'),threshold);
            assert.equal(await read(hook,hookAbi,'getMaxSurgeFeePercentage',[pool]),max);
            assert.equal(await read(hook,hookAbi,'getSurgeThresholdPercentage',[pool]),threshold);
            const cap=combined?await read(hook,hookAbi,'combinedFeeCap'):W;
            if(combined) same(await read(hook,hookAbi,'volumeFeeController'),volume);
            await send(wallet,router,route,'initialize',[pool,[weth,usdc],[4n*W,4000000n],0n,false,'0x']);
            await send(wallet,pool,token,'approve',[router,maxUint256]);
            // Compare native surge results against exact original median and rounding formulas.
            const quotes=[];
            for(const [kind,amount,indexIn,indexOut] of [[0, W/100n,0,1],[0,2n*W,0,1],[1,W/20n,1,0]]){
              const balances=await read(vault,va,'getCurrentLiveBalances',[pool]);
              const p={kind,amountGivenScaled18:amount,balancesScaled18:balances,indexIn,indexOut,router,userData:'0x'};
              const out=await read(pool,pa,'onSwap',[p]);
              const next=[...balances];next[indexIn]+=kind===0?amount:out;next[indexOut]-=kind===0?out:amount;
              const before=medianImbalance(balances),after=medianImbalance(next),surging=after>before&&after>threshold;
              const expected=surging?fee+(max-fee)*((after-threshold)*W/(W-threshold))/W:fee;
              assert.equal(await read(hook,hookAbi,'isSurgingSwap',[p,pool,fee]),surging);
              assert.equal(await read(hook,hookAbi,'computeSwapSurgeFeePercentage',[p,pool,fee]),expected);
              const surcharge=combined?await read(volume,vol,'previewVolumeSurcharge',[pool,amount,kind===0?indexIn:indexOut,balances]):0n;
              const sum=expected+surcharge, capped=sum<cap?sum:cap, expectedCombined=combined?(capped>fee?capped:fee):expected;
              assert.deepEqual(await read(hook,hookAbi,'onComputeDynamicSwapFeePercentage',[p,pool,fee]),[true,expectedCombined]);
              assert.equal(await read(vault,va,'computeDynamicSwapFeePercentage',[pool,p]),expectedCombined);
              quotes.push({kind,amount,before,after,expected,expectedCombined,surging});
            }
            assert.ok(quotes.some(x=>x.surging)&&quotes.some(x=>!x.surging));
            const rejected=(functionName,args)=>assert.rejects(pub.simulateContract({account:account.address,address:hook,abi:hookAbi,functionName,args}));
            const p={kind:0,amountGivenScaled18:W/100n,balancesScaled18:await read(vault,va,'getCurrentLiveBalances',[pool]),indexIn:0,indexOut:1,router,userData:'0x'};
            await rejected('onAdjustSwapGiven',[pool,weth,W/100n,true]);
            await rejected('onAfterSwap',[{kind:0,tokenIn:weth,tokenOut:usdc,amountInScaled18:0n,amountOutScaled18:0n,tokenInBalanceScaled18:0n,tokenOutBalanceScaled18:0n,amountCalculatedScaled18:0n,amountCalculatedRaw:0n,router,pool,userData:'0x'}]);
            await rejected('onAfterAddLiquidity',[router,pool,0,[1n,1n],[1n,1n],1n,[1n,1n],'0x']);
            await rejected('onAfterRemoveLiquidity',[router,pool,0,1n,[1n,1n],[1n,1n],[1n,1n],'0x']);
            if(combined) await rejected('onBeforeSwap',[p,pool]);
            else assert.equal((await pub.simulateContract({account:account.address,address:hook,abi:hookAbi,functionName:'onBeforeSwap',args:[p,pool]})).result,false);
            for(const [fn,args] of [['onBeforeInitialize',[[1n,1n],'0x']],['onAfterInitialize',[[1n,1n],1n,'0x']],['onBeforeAddLiquidity',[router,pool,0,[1n,1n],1n,[1n,1n],'0x']],['onBeforeRemoveLiquidity',[router,pool,0,1n,[1n,1n],[1n,1n],'0x']]]) assert.equal((await pub.simulateContract({account:account.address,address:hook,abi:hookAbi,functionName:fn,args})).result,false);
            // Config setters retain original exclusive manager permission and numeric bounds.
            await assert.rejects(pub.simulateContract({account:dao,address:hook,abi:hookAbi,functionName:'setSurgeThresholdPercentage',args:[pool,threshold]}));
            await rejected('setMaxSurgeFeePercentage',[pool,W+1n]);
            await send(wallet,hook,hookAbi,'setMaxSurgeFeePercentage',[pool,max-1n]);
            await send(wallet,hook,hookAbi,'setSurgeThresholdPercentage',[pool,threshold+1n]);
            assert.equal(await read(hook,hookAbi,'getMaxSurgeFeePercentage',[pool]),max-1n);
            assert.equal(await read(hook,hookAbi,'getSurgeThresholdPercentage',[pool]),threshold+1n);
            await send(wallet,hook,hookAbi,'setMaxSurgeFeePercentage',[pool,max]);
            await send(wallet,hook,hookAbi,'setSurgeThresholdPercentage',[pool,threshold]);
            const beforeFees=await Promise.all([weth,usdc].map(t=>read(t,token,'balanceOf',[dao])));
            await send(wallet,router,route,'addLiquidityProportional',[pool,[maxUint256,maxUint256],W/5n,false,'0x']);
            await send(wallet,router,route,'removeLiquidityProportional',[pool,W/10n,[0n,0n],false,'0x']);
            const afterLiquidity=await Promise.all([weth,usdc].map(t=>read(t,token,'balanceOf',[dao])));
            assert.ok(afterLiquidity.every((v,i)=>v>beforeFees[i]));
            await send(wallet,router,route,'donate',[pool,[W/10n,100000n],false,'0x']);
            await assert.rejects(pub.simulateContract({account:account.address,address:router,abi:route,functionName:'donate',args:[pool,[8n*W,0n],false,'0x']}));
            await assert.rejects(pub.simulateContract({account:account.address,address:router,abi:route,functionName:'addLiquidityUnbalanced',args:[pool,[W/100n,10000n],0n,false,'0x']}));
            const deadline=(await pub.getBlock()).timestamp+3600n;
            const beforeState=await read(volume,vol,'getPoolActivityState',[pool]);
            await send(wallet,router,route,'swapSingleTokenExactIn',[pool,weth,usdc,W/10n,0n,deadline,false,'0x']);
            await send(wallet,router,route,'swapSingleTokenExactOut',[pool,usdc,weth,W/20n,1000000n,deadline,false,'0x']);
            const afterState=await read(volume,vol,'getPoolActivityState',[pool]);
            if(combined) assert.ok(afterState[0]>beforeState[0]);else assert.deepEqual(afterState,beforeState);
            const afterSwaps=await Promise.all([weth,usdc].map(t=>read(t,token,'balanceOf',[dao])));
            assert.ok(afterSwaps.every((v,i)=>v>afterLiquidity[i]));
            scenarios.push({name,pool,quotes,liquidityFeesReceived:afterLiquidity.map((v,i)=>v-beforeFees[i]),swapTransferFeesReceived:afterSwaps.map((v,i)=>v-afterLiquidity[i]),activityBefore:beforeState,activityAfter:afterState,proportionalAddRemove:true,balancedDonation:true,surgingDonationRejected:true,unbalancedRejected:true});
          }
          await pub.request({method:'anvil_stopImpersonatingAccount',params:[dao]});
          const evidence={chainId:8453,block:process.env.PINNED_BLOCK,blockHash:process.env.PINNED_HASH,sourceWorkspaceSha256:process.env.V17_WORKSPACE_SHA256,deployments:Object.keys(r.deployments),holder,dao,scenarios,receipts};
          fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/.source-zip-smoke/fork-evidence.json',JSON.stringify(evidence,(_,v)=>typeof v==='bigint'?v.toString():v,2)+'\n');
          console.log('V17 isolated Base fork qualification passed: two stable hook variants, original median/fee comparison, liquidity, donation, swap and permission scenarios.');
          JS
      - name: Preserve private fork qualification evidence
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
          SOURCE_STATUS: ${{ steps.source.outcome }}
          INSTALL_STATUS: ${{ steps.install.outcome }}
          COMPILE_STATUS: ${{ steps.compile.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .source-zip-smoke
          python3 - <<'PY'
          import os, json, pathlib, base64
          d=pathlib.Path(".source-zip-smoke")
          project=pathlib.Path(os.environ["PROJECT_DIR"]) if os.environ.get("PROJECT_DIR") else None
          reports=sorted((project/"deployment-artifacts").glob("curveyield-dex-fresh-*.json")) if project else []
          def log(name):
              p=d/name
              return p.read_text(errors="replace")[-150000:] if p.exists() else None
          result=dict(sourceBlob=os.environ["SOURCE_BLOB"],sourceSha256=os.environ["SOURCE_SHA256"],sourceCommit=os.environ["SOURCE_COMMIT"],workspaceDeltaBlob=os.environ["WORKSPACE_DELTA_BLOB"],workspaceDeltaSha256=os.environ["WORKSPACE_DELTA_SHA256"],workspaceSha256=os.environ["WORKSPACE_SHA256"],originalV11ArchiveSha256=os.environ["ORIGINAL_V11_ARCHIVE_SHA256"],v12DeltaBlob=os.environ["V12_DELTA_BLOB"],v12DeltaSha256=os.environ["V12_DELTA_SHA256"],v12WorkspaceSha256=os.environ["V12_WORKSPACE_SHA256"],originalV12ArchiveSha256=os.environ["ORIGINAL_V12_ARCHIVE_SHA256"],v13DeltaBlob=os.environ["V13_DELTA_BLOB"],v13DeltaSha256=os.environ["V13_DELTA_SHA256"],v13WorkspaceSha256=os.environ["V13_WORKSPACE_SHA256"],originalV13ArchiveSha256=os.environ["ORIGINAL_V13_ARCHIVE_SHA256"],v14DeltaBlob=os.environ["V14_DELTA_BLOB"],v14DeltaSha256=os.environ["V14_DELTA_SHA256"],v14WorkspaceSha256=os.environ["V14_WORKSPACE_SHA256"],originalV14ArchiveSha256=os.environ["ORIGINAL_V14_ARCHIVE_SHA256"],v15DeltaBlob=os.environ["V15_DELTA_BLOB"],v15DeltaSha256=os.environ["V15_DELTA_SHA256"],v15WorkspaceSha256=os.environ["V15_WORKSPACE_SHA256"],originalV15ArchiveSha256=os.environ["ORIGINAL_V15_ARCHIVE_SHA256"],v16DeltaBlob=os.environ["V16_DELTA_BLOB"],v16DeltaSha256=os.environ["V16_DELTA_SHA256"],v16WorkspaceSha256=os.environ["V16_WORKSPACE_SHA256"],originalV16ArchiveSha256=os.environ["ORIGINAL_V16_ARCHIVE_SHA256"],v17DeltaBlob=os.environ["V17_DELTA_BLOB"],v17DeltaSha256=os.environ["V17_DELTA_SHA256"],v17WorkspaceSha256=os.environ["V17_WORKSPACE_SHA256"],originalV17ArchiveSha256=os.environ["ORIGINAL_V17_ARCHIVE_SHA256"],runId=os.environ["GITHUB_RUN_ID"],runAttempt=os.environ["GITHUB_RUN_ATTEMPT"],sourceStatus=os.environ["SOURCE_STATUS"],installStatus=os.environ["INSTALL_STATUS"],compileStatus=os.environ["COMPILE_STATUS"],installLog=log("install.log"),compileLog=log("compile.log"),forkLog=log("fork.log"),forkEvidence=json.loads((d/"fork-evidence.json").read_text()) if (d/"fork-evidence.json").exists() else None,buildReport=json.loads(reports[-1].read_text()) if reports else None)
          (d/"compile-evidence.json").write_text(json.dumps(result,indent=2)+"\n")
          PY
          target="campaigns/CurveYield_DEX_Simplified_Native_Fees_v17_fork_evidence_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.json"
          ref="development/dex-simplified-native-fees-v1"
          old="$(gh api "repos/curveyield3/Audit-Controller/contents/$target?ref=$ref" --jq .sha 2>/dev/null || true)"
          base64 -w0 .source-zip-smoke/compile-evidence.json > .source-zip-smoke/evidence.b64
          jq -n --arg branch "$ref" --arg old "$old" --arg msg "Record DEX v17 exact workspace fork evidence (run $GITHUB_RUN_ID)" --rawfile content .source-zip-smoke/evidence.b64 '{branch:$branch,message:$msg,content:$content} + (if $old=="" then {} else {sha:$old} end)' > .source-zip-smoke/upload.json
          gh api --method PUT "repos/curveyield3/Audit-Controller/contents/$target" --input .source-zip-smoke/upload.json --silent
          echo "Private evidence recorded. Source: $SOURCE_STATUS; install: $INSTALL_STATUS; compile: $COMPILE_STATUS"
