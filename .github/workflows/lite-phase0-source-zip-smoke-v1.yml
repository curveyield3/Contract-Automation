    name: Compile PoL Manager v20 and prepare Safe add-on
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact compiler and deployment encoder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .v20-deps
          npm install --prefix .v20-deps --ignore-scripts --no-audit --no-fund --no-save solc@0.8.28 ethers@6.13.5
      - name: Compile exact v20 Solidity and encode Safe CREATE2/Locker batch
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$GITHUB_WORKSPACE/.v20-deps/node_modules" node github-native-sim/cyvlsdt-runtime-compare-v1/pol-morpho-v20/build-v1.cjs
          python3 - <<'PY'
          from pathlib import Path
          import json
          base=Path('github-native-sim/cyvlsdt-runtime-compare-v1/pol-morpho-v20/outputs')
          manifest=json.loads((base/'Build-Manifest-v1.json').read_text())
          assert 0<manifest['deployedBytes']<=24576
          assert manifest['safeCalls']==4
          assert manifest['constructorArgsBytes']>0
          tx=json.loads((base/'Safe-Transaction-Builder-AddOn-v1.json').read_text())
          assert len(tx['transactions'])==4
          labels=['performCreate2','setLiquidityBounds','setProfitRecipient','setPoLDepositShare']
          assert all(x['data'].startswith('0x') and len(x['data'])>10 for x in tx['transactions'])
          assert all(int(x['value'])==0 for x in tx['transactions'])
          print('V20_ADDON_MANIFEST_VERIFIED',manifest['predictedAddress'])
          PY
      - name: Preserve compiled v20 source, artifacts and calldata in this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-native-sim/cyvlsdt-runtime-compare-v1/pol-morpho-v20/outputs/
          git commit -m 'Preserve v20 Morpho ERC4626 compiled artifacts and four Safe batch calls'
          git push origin HEAD:cyvlsdt-pol-morpho-v20-v1
      - name: Upload complete v20 compiled Safe batch package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CurveYield-PoLManager-MorphoV1-v20-Safe-AddOn-v1
          path: |
            github-native-sim/cyvlsdt-runtime-compare-v1/pol-morpho-v20/PoL_Manager_Contract_v20.sol
            github-native-sim/cyvlsdt-runtime-compare-v1/pol-morpho-v20/build-v1.cjs
            github-native-sim/cyvlsdt-runtime-compare-v1/pol-morpho-v20/outputs/
          if-no-files-found: warn
          retention-days: 90

