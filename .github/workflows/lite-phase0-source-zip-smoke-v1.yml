name: Lite Phase 0 Archived Source ZIP Smoke v1

# Isolated compile-only adaptation for the verified private DEX v17 workspace.
# The main-branch workflow remains unchanged.
on:
  push:
    branches: [development/dex-native-fees-v13-compile]
    paths:
      - '.github/smoke-trigger/lite-phase0-source-zip-smoke-v1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dex-native-fees-v13-compile
  cancel-in-progress: false

jobs:
  source-zip-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_BLOB: 17bc0b4eeb2dfa74bca525e2a173f9deafdea5e6
      SOURCE_SHA256: 6be6b24d09adbbf7173c9e902a88e6d770fc1aadf07c0574e13b4e38e773b177
      SOURCE_COMMIT: bc0774e9163a39a932fb6f50407a10eaccfc8b3c
      V17_DELTA_BLOB: f38dab6205310e78d123c01a6728eed9b9da5253
      V17_DELTA_SHA256: 0539058673497ac86b8f81658c5aca79fc3f762e96ca09d9be1239d6caa68571
      V17_WORKSPACE_SHA256: 21c9afae1681a6a0efda3a0ffdf7df6d1129f473ef9c10939c1f39bf14b5fa83
