name: cyvlSDT v70 vault capability surgical compile and bytecode comparison
on:
  push:
    branches: [cyvlsdt-v69-postdeploy-simulation-v1]
    paths: ['.github/workflows/lite-phase0-source-zip-smoke-v1.yml', 'github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json', 'github-native-sim/cyvlsdt-runtime-compare-v1/v69-postdeploy-suite-v1.cjs']
permissions:
  contents: read
jobs:
  fork-gas:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FOUNDRY_OPTIMIZER_RUNS: '25'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Materialize exact v64 source and benchmark-only optimization candidate
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/curveyield3/Smart-Contracts/6b058498554f58936daf1216c222d554ee666f5e/Audit-Intake/CurveYield-cyvlSDT-Deployment-Package-v64.zip' -o /tmp/cyv64.zip
          echo 'a2d46ab6bf63a760efecf914f36419b8ec271c0e36f9b3ee9821cd842ea0d7ee  /tmp/cyv64.zip' | sha256sum -c -
          mkdir -p /tmp/cyv64 /tmp/cyv65
          unzip -q /tmp/cyv64.zip -d /tmp/cyv64
          cp -a /tmp/cyv64/contracts /tmp/cyv65/
          mkdir -p /tmp/cyv-deps
          npm install --prefix /tmp/cyv-deps --ignore-scripts --no-audit --no-fund --no-save '@openzeppelin/contracts@5.4.0' '@openzeppelin-4/contracts@npm:@openzeppelin/contracts@4.9.6' '@openzeppelin/contracts-upgradeable@4.9.6' 'ethers@6.17.0'
          ln -s /tmp/cyv-deps/node_modules /tmp/cyv64/node_modules
          ln -s /tmp/cyv-deps/node_modules /tmp/cyv65/node_modules
          for ROOT in /tmp/cyv64 /tmp/cyv65; do
            rm -f "$ROOT/contracts/PoL_Manager_Contract_v22.sol" "$ROOT/contracts/VoteMarketSingleGaugeBribeAllocator.sol"
            rm -rf "$ROOT/contracts/external_guard_v8"
            cat > "$ROOT/foundry.toml" <<'EOF'
          [profile.default]
          src = "contracts"
          out = "out"
          libs = ["node_modules"]
          remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/", "@openzeppelin-4/contracts/=node_modules/@openzeppelin-4/contracts/", "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/"]
          solc_version = "0.8.28"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          evm_version = "cancun"
          EOF
          done
          python3 - <<'PY'
          import json,pathlib
          p=json.loads(pathlib.Path('github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json').read_text())
          exec(compile(p['transform'],'v65-transform','exec'))
          exec(compile(p['unifiedTransform'],'v66-transform','exec'))
          exec(compile(p['packingTransform'],'v67-transform','exec'))
          PY
      - name: Compile exact v69 baseline and minimal v70 candidate (compile only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v70-report
          forge --version
          FOUNDRY_OUT=out-25 forge build --root /tmp/cyv65 --force --skip test --skip script
          (cd /tmp/cyv65 && find contracts -type f -name '*.sol' -print0 | sort -z | xargs -0 sha256sum) > /tmp/v70-report/source-before-v1.sha256
          python3 - <<'PY'
          import json,pathlib
          p=json.loads(pathlib.Path('github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json').read_text())
          exec(compile(p['vaultEmergencyCapabilityPatch'],'v70-vault-capability','exec'))
          PY
          (cd /tmp/cyv65 && find contracts -type f -name '*.sol' -print0 | sort -z | xargs -0 sha256sum) > /tmp/v70-report/source-after-v1.sha256
          FOUNDRY_OUT=out-25-capability forge build --root /tmp/cyv65 --force --skip test --skip script
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('/tmp/cyv65')
          out=pathlib.Path('/tmp/v70-report')
          name='BeefyVaultCurveYieldV8cyvlSDT'
          def hashes(p):
              return {line.split('  ',1)[1]:line.split('  ',1)[0] for line in p.read_text().splitlines()}
          a=hashes(out/'source-before-v1.sha256');b=hashes(out/'source-after-v1.sha256')
          assert a.keys()==b.keys()
          changed=[k for k in a if a[k]!=b[k]]
          assert changed==['contracts/'+name+'.sol'],changed
          def artifact(directory):
              return json.loads((root/directory/(name+'.sol')/(name+'.json')).read_text())
          old=artifact('out-25');new=artifact('out-25-capability')
          def sizes(o):
              return {k:len(bytes.fromhex(o[k]['object'].removeprefix('0x'))) for k in ('bytecode','deployedBytecode')}
          def sigs(o):
              return sorted(x['name']+'('+','.join(y['type'] for y in x.get('inputs',[]))+')' for x in o['abi'] if x['type']=='function')
          before=sizes(old);after=sizes(new)
          added=sorted(set(sigs(new))-set(sigs(old)));removed=sorted(set(sigs(old))-set(sigs(new)))
          assert added==['initialize(address,string,string,uint256,address,address,bool,bool,bool)','setStrategy(address,bool)'],added
          assert removed==['initialize(address,string,string,uint256,address,address,bool,bool)','setStrategy(address)'],removed
          oldmeta=old.get('metadata',{});newmeta=new.get('metadata',{})
          if isinstance(oldmeta,str):oldmeta=json.loads(oldmeta)
          if isinstance(newmeta,str):newmeta=json.loads(newmeta)
          for k in ['compiler','settings']:
              assert oldmeta.get(k)==newmeta.get(k),k
          result={'contract':name,'changedSoliditySources':changed,'totalSoliditySources':len(a),'compiler':oldmeta.get('compiler'),'settings':oldmeta.get('settings'),'baselineBytes':before,'candidateBytes':after,'deltaBytes':{k:after[k]-before[k] for k in before},'abiAdded':added,'abiRemoved':removed,'runtimeHeadroom':24576-after['deployedBytecode'],'deployment':False,'testsExecuted':False}
          (out/'size-and-abi-comparison-v1.json').write_text(json.dumps(result,indent=2))
          print('VAULT_CAPABILITY_SIZE',json.dumps(result),flush=True)
          PY
      - name: Retain source diff and bytecode size evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CurveYield-cyvlSDT-Vault-Emergency-Capability-v1
          path: /tmp/v70-report/
          if-no-files-found: error
