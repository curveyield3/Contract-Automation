name: Exact live-state nonce36 without approval resets v24
on:
  push:
    branches: [cyvlsdt-v69-postdeploy-simulation-v1]
    paths: ['.github/workflows/lite-phase0-source-zip-smoke-v1.yml', 'github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json', 'github-native-sim/cyvlsdt-runtime-compare-v1/v69-postdeploy-suite-v1.cjs']
permissions:
  contents: read
  actions: read
jobs:
  fork-gas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FOUNDRY_OPTIMIZER_RUNS: '25'
      UPSTREAM_RPC: ${{ secrets.RPC_ETHEREUM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Replay retained exact nonce36 on fresh Ethereum fork
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPSTREAM_RPC"
          npm install --prefix /tmp/replay36 --ignore-scripts --no-audit --no-fund --no-save ethers@6.17.0
          export FORK_BLOCK=$(cast block-number --rpc-url "$UPSTREAM_RPC")
          anvil --fork-url "$UPSTREAM_RPC" --fork-block-number "$FORK_BLOCK" --host 127.0.0.1 --port 8545 --silent >/tmp/anvil.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          cd /tmp/replay36
          node <<'JS'
          const E=require('ethers'),assert=require('assert/strict');
          const SAFE=E.getAddress('0x47623c62f281807d615eeb4a2ceee9d97f9d3c49'),EOA=E.getAddress('0x9f2b20a772246960810045905b7daccf960ee288'),MULTI=E.getAddress('0xa238cbeb142c10ef7ad8442c6d1f9e89e07e7761'),cap=16777216n;
          const p=new E.JsonRpcProvider('http://127.0.0.1:8545',1,{staticNetwork:true,cacheTimeout:-1});
          const old="",data="";
          const labels=["Deploy staking","Bind PoL profit recipient","Register SDT staking reward","Register USDC staking reward","Register cyvlSDT staking reward","Set PoL deposit share 25%","Enable marketplace operator","Approve 10000 SDT for locker","Approve 10000 cyvlSDT for vlSDT vault","Deploy revenue","Deploy merchant","Configure locker system","Initialize rvault"];
          const si=new E.Interface(['function nonce() view returns(uint256)','function getThreshold() view returns(uint256)','function getOwners() view returns(address[])','function getTransactionHash(address,uint256,bytes,uint8,uint256,uint256,uint256,address,address,uint256) view returns(bytes32)','function execTransaction(address,uint256,bytes,uint8,uint256,uint256,uint256,address,address,bytes) payable returns(bool)']);
          const ms=new E.Interface(['function multiSend(bytes)']);const sig=E.concat([E.zeroPadValue(EOA,32),E.ZeroHash,'0x01']);
          const erc=new E.Interface(['function allowance(address,address) view returns(uint256)','function balanceOf(address) view returns(uint256)']);
          const sd=new E.Contract('0xe19d1c837b8a1c83a56cd9165b2c0256d39653ad',erc,p),fv='0x5f5da46852de82ae4bd8d1da16bec50b0906b53b';
          const sdt=new E.Contract('0x73968b9a57c6e53d41345fd57a6e6ae27d6cdb2f',erc,p),token=new E.Contract('0x4abc523b4eab1fad413018711de14ccd8843d839',erc,p),rv='0x48ce7408e14251d40ef2dc9da64b971bb60e318d',locker='0x786e17f913a3b6d2764e77374268c009660cc27f';
          const A=10000n*10n**18n;
          function parse(d){const b=E.getBytes(ms.decodeFunctionData('multiSend',d)[0]);let i=0,out=[];while(i<b.length){const n=Number(BigInt(E.hexlify(b.slice(i+53,i+85))));assert(i+85+n<=b.length);out.push({op:b[i],to:E.getAddress(E.hexlify(b.slice(i+1,i+21))),data:E.hexlify(b.slice(i+85,i+85+n)),raw:E.hexlify(b.slice(i,i+85+n))});i+=85+n;}assert.equal(i,b.length);return out;}
          async function main(){
            assert.equal(await p.getBlockNumber(),Number(process.env.FORK_BLOCK));
            assert.equal(BigInt(await p.send('eth_getTransactionCount',[SAFE,'latest'])),10n);
            await p.send('anvil_impersonateAccount',[EOA]);await p.send('anvil_setBalance',[EOA,E.toQuantity(E.parseEther('100'))]);
            const safe=new E.Contract(SAFE,si,await p.getSigner(EOA));
            assert.equal(await safe.nonce(),36n);assert.equal(await safe.getThreshold(),1n);assert((await safe.getOwners()).includes(EOA));
            const args=d=>[MULTI,0n,d,1,0n,0n,0n,E.ZeroAddress,E.ZeroAddress];
            assert.equal(await safe.getTransactionHash(...args(old),36n),'0x2d09be181721683f9b0140791398d45b684bc920168c956378a17aefa3b9e846');
            const before=parse(old),after=parse(data);assert.equal(after.length,13);assert.equal(after.filter(x=>x.op===1).length,3);
            const resets=before.filter(x=>x.data.slice(0,10)==='0x095ea7b3'&&BigInt('0x'+x.data.slice(74,138))===0n);
            assert.equal(resets.length,1);assert.deepEqual(after.map(x=>x.raw),before.filter(x=>x!==resets[0]).map(x=>x.raw));
            const approvals=after.filter(x=>x.data.slice(0,10)==='0x095ea7b3');assert.equal(approvals.length,2);assert(approvals.every(x=>BigInt('0x'+x.data.slice(74,138))===A));
            const allowanceBefore=await sd.allowance(SAFE,fv);assert.equal(await sd.balanceOf(SAFE),0n);
            const h=await safe.getTransactionHash(...args(data),36n),gas=await safe.execTransaction.estimateGas(...args(data),sig,{gasLimit:cap});assert(gas<=cap);
            assert(await safe.execTransaction.staticCall(...args(data),sig,{gasLimit:cap}));
            const tx=await safe.execTransaction(...args(data),sig,{gasLimit:cap}),receipt=await tx.wait();assert.equal(receipt.status,1);assert.equal(await safe.nonce(),37n);
            assert.equal(await sd.allowance(SAFE,fv),allowanceBefore);
            assert.equal(await sdt.allowance(SAFE,locker),A);assert.equal(await token.allowance(SAFE,rv),A);
            const v=new E.Contract(rv,['function asset() view returns(address)','function strategy() view returns(address)'],p);assert.equal((await v.asset()).toLowerCase(),token.target.toLowerCase());assert.equal((await v.strategy()).toLowerCase(),'0x7c9977ce98710eaee2fdaa9c0a425e85f98a7a6c');
            const deployed=[10,11,12].map(n=>E.getCreateAddress({from:SAFE,nonce:n}));for(const a of deployed)assert.notEqual(await p.getCode(a),'0x');
            console.log('NONCE36_PASS '+JSON.stringify({hash:h,gasEstimate:gas.toString(),gasUsed:receipt.gasUsed.toString(),block:process.env.FORK_BLOCK,bytes:E.dataLength(data),calls:labels,zeroApprovals:0,approvalBefore:allowanceBefore.toString(),approvalAfter:(await sd.allowance(SAFE,fv)).toString(),deployed,txHash:tx.hash}));
            for(let i=0;i<data.length;i+=8000)console.log('NONCE36_DATA '+JSON.stringify({offset:i,data:data.slice(i,i+8000)}));
          }
          main().catch(e=>{console.error(e);process.exitCode=1});
          JS
