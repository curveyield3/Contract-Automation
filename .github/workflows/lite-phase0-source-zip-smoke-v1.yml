name: cyvlSDT gross NAV pool fork simulation v1
on:
  push:
    branches: [cyvlsdt-gross-nav-pool-fork-v1]
    paths:
      - .github/workflows/lite-phase0-source-zip-smoke-v1.yml
permissions:
  contents: read
concurrency:
  group: cyvlsdt-gross-nav-pool-fork-v1
  cancel-in-progress: false
jobs:
  fork-gas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: curveyield3/Smart-Contracts
          ref: 806938f4f8369773efe3c68248308e530ea87d3f
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Authenticate exact candidate source and configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gross-nav"
          base64 --decode candidate/cyvlSDT/optimization-v58/source-v58.zip.b64 > "$RUNNER_TEMP/gross-nav.zip"
          unzip -q "$RUNNER_TEMP/gross-nav.zip" -d "$RUNNER_TEMP/gross-nav"
          cd "$RUNNER_TEMP/gross-nav"
          sha256sum -c <<'EOF'
          d8b239014254bd8bbb748e2ab236faf497d1f258637382c98ffae6c0f06b38c3  contracts/CurveYieldRevenueStrategyV8.sol
          810a34b7ed54c8a07ab74542253cc980e37bb39bf0053297d3bc3f0fdaf7b3f4  contracts/interfaces/ICurveYield.sol
          50d5d73c55d0f46fabf611186dab21fd9b776ebd9064571f9bd408264bebea48  contracts/interfaces/ICurveYieldOmniRouter.sol
          d3b3ccae007294a9d572623a4e8c9da3162f4463328152b14041241d385b1c98  contracts/interfaces/IStrategyBoostHubV1.sol
          7d01c71a7ba5ea78afe469d1d13fbe22dd33ae5e6bc2d91b031720103d7cc47f  foundry.toml
          2ba73adf9ba847ae9818b4b4d3d419c2b4af70d5807786b97a4c9d173e4ae7c4  package.json
          EOF
      - name: Install pinned compiler and dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gross-nav"
          npm install --ignore-scripts --no-audit --no-fund --save-exact solc@0.8.28 ethers@6.17.0
      - name: Compile strategy and retain exact compiler evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gross-nav"
          node <<'JS'
          const fs = require('node:fs'), path = require('node:path'), solc = require('solc');
          const target = 'contracts/CurveYieldRevenueStrategyV8.sol', name = 'CurveYieldRevenueStrategyV8';
          if (!solc.version().startsWith('0.8.28+commit.7893614a')) throw Error('compiler mismatch');
          const sources = {};
          function add(p) {
            if (sources[p]) return;
            const file = p.startsWith('@') ? path.join('node_modules',p) : p;
            const content = fs.readFileSync(file,'utf8');
            sources[p] = {content};
            for (const m of content.matchAll(/import\s+(?:[^;]*?\sfrom\s*)?["']([^"']+)["']\s*;/g)) {
              add(m[1].startsWith('.') ? path.posix.normalize(path.posix.join(path.posix.dirname(p),m[1])) : m[1]);
            }
          }
          add(target);
          const input = {language:'Solidity', sources, settings:{optimizer:{enabled:true,runs:25},viaIR:true,evmVersion:'cancun',metadata:{bytecodeHash:'ipfs'},outputSelection:{'*':{'*':['abi','metadata','evm.bytecode.object','evm.deployedBytecode.object','evm.deployedBytecode.immutableReferences','evm.methodIdentifiers']}}}};
          fs.mkdirSync('out',{recursive:true});
          fs.writeFileSync('out/standard-input.json',JSON.stringify(input));
          const output = JSON.parse(solc.compile(JSON.stringify(input)));
          fs.writeFileSync('out/standard-output.json',JSON.stringify(output));
          for(const e of output.errors || []) console.log(e.formattedMessage);
          if((output.errors || []).some(e=>e.severity==='error')) process.exit(1);
          const a=output.contracts[target][name];
          const byteCount=x=>{if(!/^(?:[0-9a-fA-F]{2})+$/.test(x))throw Error('invalid bytecode');return x.length/2};
          const report={compiler:solc.version(),contract:target+':'+name,optimizerRuns:25,viaIR:true,evmVersion:'cancun',runtimeBytes:byteCount(a.evm.deployedBytecode.object),creationBytes:byteCount(a.evm.bytecode.object),warningCount:(output.errors||[]).filter(e=>e.severity==='warning').length,errorCount:0};
          if(report.runtimeBytes>24576 || report.creationBytes+9*32>49152) throw Error('EVM size limit exceeded');
          fs.writeFileSync('out/strategy-artifact.json',JSON.stringify(a));
          fs.writeFileSync('out/compile-report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          JS
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Deploy and seed on pinned Ethereum Anvil fork
        shell: bash
        env:
          ETHEREUM_FORK_RPC_URL: ${{ secrets.RPC_ETHEREUM }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gross-nav"
          cp out/strategy-artifact.json out/standard-input.json out/compile-report.json .
          test -s strategy-artifact.json
          jq -e '.runtimeBytes==10709 and .creationBytes==12040 and .errorCount==0' compile-report.json >/dev/null
          jq -r '.sources["contracts/CurveYieldRevenueStrategyV8.sol"].content' standard-input.json | head -25 > header.txt
          grep -q 'CurveYield System Component' header.txt
          python3 - <<'PY'
          import json,hashlib
          s=json.load(open('standard-input.json'))['sources']['contracts/CurveYieldRevenueStrategyV8.sol']['content']
          assert hashlib.sha256(s.encode()).hexdigest()=='d8b239014254bd8bbb748e2ab236faf497d1f258637382c98ffae6c0f06b38c3'
          PY
          test -n "$ETHEREUM_FORK_RPC_URL" || { echo 'RPC_ETHEREUM unavailable'; exit 1; }
          echo 'PREFLIGHT: source authenticated; resolving upstream block'
          mkdir -p evidence
          node <<'JS' > evidence/upstream-pin.json
          const url=process.env.ETHEREUM_FORK_RPC_URL;
          async function rpc(method,params) {
            for(let i=0;i<3;i++){
              try{
                const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params}),signal:AbortSignal.timeout(20000)});
                if(!r.ok) throw Error('HTTP '+r.status);
                const j=await r.json();
                if(j.error) throw Error('RPC code '+j.error.code);
                if(j.result==null) throw Error('empty result');
                return j.result;
              }catch(e){console.error(method+' attempt '+(i+1)+': '+String(e.message).replace(/https?:\S+/g,'[redacted]'));if(i===2)throw Error('upstream RPC failed');await new Promise(r=>setTimeout(r,2000));}
            }
          }
          (async()=>{const chain=await rpc('eth_chainId',[]);if(BigInt(chain)!==1n)throw Error('wrong chain');const b=await rpc('eth_getBlockByNumber',['latest',false]);if(!/^0x[0-9a-f]{64}$/i.test(b.hash))throw Error('invalid hash');console.log(JSON.stringify({block:Number(BigInt(b.number)),hash:b.hash}));})().catch(e=>{console.error(e.message);process.exit(1)});
          JS
          BLOCK="$(jq -er .block evidence/upstream-pin.json)"
          HASH="$(jq -er .hash evidence/upstream-pin.json)"
          printf 'UPSTREAM_PIN block=%s hash=%s\n' "$BLOCK" "$HASH"
          SAFE=0x47623c62f281807d615eeb4a2ceee9d97f9d3c49
          SDT=0x73968b9a57c6e53d41345fd57a6e6ae27d6cdb2f
          WANT=0x4abc523b4eab1fad413018711de14ccd8843d839
          LOCKER=0x786e17f913a3b6d2764e77374268c009660cc27f
          STAKING=0x8003fa826f5414a7c6cf0aa9fd3c73df97e77bac
          ROUTER=0xa4a533025fef8d3446e7cb8a434824e1ee865b00
          OLD=0x48ce7408e14251d40ef2dc9da64b971bb60e318d
          TEMPLATE=0x00f63308ebb429f0967aa36a0def66ec1074975b
          FACTORY=0x6a8cbed756804b16e05e741edabd5cb544ae21bf
          ADMIN=0x9f2b20a772246960810045905b7daccf960ee288
          POL=0xad60c84f4addec612ce6bd329435d5718a4d9b7a
          TEN=10000000000000000000
          TWENTY=20000000000000000000
          APPROVE=10000000000000000000000
          export ETH_RPC_URL=http://127.0.0.1:8545
          mkdir -p evidence
          anvil --fork-url "$ETHEREUM_FORK_RPC_URL" --fork-block-number "$BLOCK" --chain-id 1 --host 127.0.0.1 --port 8545 --silent > /tmp/gross-nav-anvil.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; cp /tmp/gross-nav-anvil.log evidence/anvil.log 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do if cast chain-id --rpc-url "$ETH_RPC_URL" >/dev/null 2>&1; then break; fi; sleep 1; done
          echo "PREFLIGHT: verify local chain, historical block and code"
          export BLOCK HASH SAFE SDT WANT LOCKER STAKING ROUTER OLD TEMPLATE FACTORY
          node <<'JS'
          const assert=require('node:assert/strict');
          async function rpc(url,method,params){
            const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params}),signal:AbortSignal.timeout(20000)});
            if(!r.ok)throw Error(method+' HTTP '+r.status);
            const j=await r.json();if(j.error)throw Error(method+' RPC '+j.error.code);return j.result;
          }
          (async()=>{
            const local='http://127.0.0.1:8545', upstream=process.env.ETHEREUM_FORK_RPC_URL, tag='0x'+BigInt(process.env.BLOCK).toString(16);
            const chain=await rpc(local,'eth_chainId',[]), number=await rpc(local,'eth_blockNumber',[]), b=await rpc(local,'eth_getBlockByNumber',[tag,false]);
            console.log('FORK IDENTITY',JSON.stringify({chain,number,hash:b?.hash,expected:process.env.HASH}));
            assert.equal(BigInt(chain),1n);assert.equal(BigInt(number),BigInt(tag));assert.equal(b?.hash,process.env.HASH);
            assert.equal((await rpc(local,'eth_getCode',[process.env.OLD,tag])).slice(22,62),process.env.TEMPLATE.slice(2));
            for(const key of ['SAFE','SDT','WANT','LOCKER','STAKING','ROUTER','OLD','TEMPLATE','FACTORY']){
              const a=process.env[key], x=await rpc(local,'eth_getCode',[a,tag]), y=await rpc(upstream,'eth_getCode',[a,tag]);
              assert.notEqual(x,'0x',key+' empty code');assert.equal(x,y,key+' code mismatch');console.log('CODE VERIFIED',key,a);
            }
          })().catch(e=>{console.error(String(e.message).replace(/https?:\S+/g,'[redacted]'));process.exit(1)});
          JS
          echo "VERIFIED FORK block=$BLOCK hash=$HASH"
          export ADMIN POL TEN TWENTY APPROVE
          node <<'JS'
          const E=require('ethers'), fs=require('fs'), assert=require('node:assert/strict');
          const p=new E.JsonRpcProvider('http://127.0.0.1:8545',1,{staticNetwork:true,cacheTimeout:-1});
          const W=10n**18n,TEN=10n*W,TWENTY=20n*W,SAFE=process.env.SAFE;
          const {SDT,WANT,LOCKER,STAKING,ROUTER,OLD,TEMPLATE,FACTORY,ADMIN,POL}=process.env;
          const J=x=>JSON.stringify(x,(_,v)=>typeof v==='bigint'?v.toString():v);
          const artifact=JSON.parse(fs.readFileSync('strategy-artifact.json','utf8'));
          const erc=new E.Interface(['function balanceOf(address) view returns(uint256)','function approve(address,uint256) returns(bool)','function allowance(address,address) view returns(uint256)']);
          const vaultI=new E.Interface(['function initialize(address,string,string,uint256,address,address,bool,bool,bool)','function strategy() view returns(address)','function totalSupply() view returns(uint256)','function depositFeeBps() view returns(uint256)','function previewDeposit(uint256) view returns(uint256)','function deposit(uint256,address) returns(uint256)','function totalAssets() view returns(uint256)','function convertToAssets(uint256) view returns(uint256)','function name() view returns(string)']);
          const lockerI=new E.Interface(['function deposit(uint256,address) returns(uint256)','function poLDepositShareBps() view returns(uint16)']);
          const stakingI=new E.Interface(['function activeBalance(address) view returns(uint256)']);
          const factoryI=new E.Interface(['function pool_count() view returns(uint256)','function pool_list(uint256) view returns(address)','function get_pool_asset_types(address) view returns(uint8[])']);
          const poolI=new E.Interface(['function coins(uint256) view returns(address)','function add_liquidity(uint256[],uint256,address) returns(uint256)','function stored_rates() view returns(uint256[])']);
          const read=async(to,I,f,args=[])=>I.decodeFunctionResult(f,await p.call({to,data:I.encodeFunctionData(f,args)}))[0];
          const bal=(t,a)=>read(t,erc,'balanceOf',[a]);
          const lower=x=>x.toLowerCase();
          const eqaddr=(a,b)=>assert.equal(lower(a),lower(b));
          const actions=[];
          async function send(label,to,data){
            const tx={from:SAFE,data,gas:'0xf42400',...(to?{to}:{})};
            console.log('EXECUTE',label);
            try {
              await p.send('eth_call',[tx,'latest']);
              const hash=await p.send('eth_sendTransaction',[tx]);
              const receipt=await p.send('eth_getTransactionReceipt',[hash]);
              assert(receipt,label+' missing receipt');
              fs.writeFileSync('evidence/'+label+'.json',J(receipt));
              assert.equal(BigInt(receipt.status),1n,label+' reverted');
              actions.push({label,hash,gas:BigInt(receipt.gasUsed)});
              console.log('MINED',label,hash,'gas='+BigInt(receipt.gasUsed));
              return receipt;
            }catch(e){console.error('FAILED',label,J({message:e.shortMessage||e.message,data:e.data||e.info?.error?.data}));throw e;}
          }
          const call=(label,to,I,f,args)=>send(label,to,I.encodeFunctionData(f,args));
          (async()=>{
            assert.equal(await p.getBlockNumber(),Number(process.env.BLOCK));
            await p.send('anvil_impersonateAccount',[SAFE]);
            await p.send('anvil_setBalance',[SAFE,E.toQuantity(10n*W)]);
            console.log('BEFORE',J({SDT:await bal(SDT,SAFE),cyvlSDT:await bal(WANT,SAFE)}));
            const cloneCode='0x3d602d80600a3d3981f3363d3d373d3d3d363d73'+TEMPLATE.slice(2)+'5af43d82803e903d91602b57fd5bf3';
            const VAULT=(await send('01-vault-clone',null,cloneCode)).contractAddress;
            assert.equal(await p.getCode(VAULT),await p.getCode(OLD));
            const ctor=E.AbiCoder.defaultAbiCoder().encode(['address','address','address','address','address','address','address','uint16','uint16'],[SAFE,VAULT,WANT,SDT,STAKING,LOCKER,ROUTER,390,10]);
            const init=E.concat(['0x'+artifact.evm.bytecode.object,ctor]);
            const STRATEGY=(await send('02-revenue-strategy',null,init)).contractAddress;
            console.log('NEW_VAULT='+VAULT,'NEW_STRATEGY='+STRATEGY);
            await call('03-initialize',VAULT,vaultI,'initialize',[STRATEGY,'CurveYield vlSDT Vault','cyvlSDTav',10n,ADMIN,SAFE,true,false,true]);
            eqaddr(await read(VAULT,vaultI,'strategy'),STRATEGY);
            assert.equal(await read(VAULT,vaultI,'totalSupply'),0n);
            assert.equal(await read(VAULT,vaultI,'depositFeeBps'),0n);
            assert.equal(await read(LOCKER,lockerI,'poLDepositShareBps'),2500n);
            assert((await read(SDT,erc,'allowance',[SAFE,LOCKER]))>=TWENTY);
            await call('04-locker',LOCKER,lockerI,'deposit',[TWENTY,SAFE]);
            assert.equal(await bal(WANT,SAFE),TWENTY);
            await call('05-vault-approval',WANT,erc,'approve',[VAULT,TEN]);
            const preview=await read(VAULT,vaultI,'previewDeposit',[TEN]);
            await call('06-deposit',VAULT,vaultI,'deposit',[TEN,SAFE]);
            const shares=await bal(VAULT,SAFE),nav=await read(VAULT,vaultI,'totalAssets'),active=await read(STAKING,stakingI,'activeBalance',[STRATEGY]),rate=await read(VAULT,vaultI,'convertToAssets',[W]);
            const remaining=await bal(WANT,SAFE);
            const deposit={preview,shares,nav,active,rate,remaining};
            fs.writeFileSync('evidence/deposit-result.json',J(deposit));
            console.log('DEPOSIT_RESULT',J(deposit));
            assert.equal(shares,TEN);assert.equal(nav,TEN);assert.equal(active,TEN);assert.equal(rate,W);assert.equal(remaining,TEN);
            const pooldata=''.replace(OLD.slice(2),VAULT.slice(2).toLowerCase());
            assert(pooldata!== '');
            const idx=await read(FACTORY,factoryI,'pool_count');
            await send('07-create-pool',FACTORY,pooldata);
            const POOL=await read(FACTORY,factoryI,'pool_list',[idx]);
            console.log('NEW_POOL='+POOL);
            assert.notEqual(await p.getCode(POOL),'0x');
            for(const [i,t] of [SDT,WANT,VAULT].entries())eqaddr(await read(POOL,poolI,'coins',[i]),t);
            const types=Array.from(await read(FACTORY,factoryI,'get_pool_asset_types',[POOL]));
            assert.deepEqual(types,[0n,0n,3n]);
            for(const [i,t] of [SDT,WANT,VAULT].entries())await call('08-approve-'+i,t,erc,'approve',[POOL,10000n*W]);
            await call('09-add-liquidity',POOL,poolI,'add_liquidity',[[TEN,TEN,TEN],297n*W/10n,POL]);
            const amounts=await Promise.all([SDT,WANT,VAULT].map(t=>bal(t,POOL))),lp=await bal(POOL,POL);
            const rates=Array.from(await read(POOL,poolI,'stored_rates'));
            const finalNav=await read(VAULT,vaultI,'totalAssets'),finalRate=await read(VAULT,vaultI,'convertToAssets',[W]);
            const result={vault:VAULT,strategy:STRATEGY,pool:POOL,deposit,poolSDT:amounts[0],poolCyvlSDT:amounts[1],poolCyvlSDTav:amounts[2],lp,rates,types,finalNav,finalRate,actions,totalGas:actions.reduce((s,a)=>s+a.gas,0n)};
            fs.writeFileSync('evidence/result.json',J(result));console.log('POOL_RESULT',J(result));
            assert.deepEqual(amounts,[TEN,TEN,TEN]);assert.deepEqual(rates,[W,W,W]);assert.equal(finalNav,TEN);assert.equal(finalRate,W);assert(lp>=297n*W/10n);
            console.log('SIMULATION_PASS');
          })().catch(e=>{console.error('SIMULATION_FAILURE',e.shortMessage||e.message);process.exitCode=1;}).finally(()=>p.destroy());
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cyvlsdt-gross-nav-pool-fork-v1
          path: ${{ runner.temp }}/gross-nav/evidence/
          if-no-files-found: warn
