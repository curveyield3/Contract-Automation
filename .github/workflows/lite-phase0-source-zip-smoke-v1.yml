environ["ORIGINAL_V19_ARCHIVE_SHA256"],v20DeltaBlob=os.environ["V20_DELTA_BLOB"],v20DeltaSha256=os.environ["V20_DELTA_SHA256"],v20WorkspaceSha256=os.environ["V20_WORKSPACE_SHA256"],originalV20ArchiveSha256=os.environ["ORIGINAL_V20_ARCHIVE_SHA256"],runId=os.environ["GITHUB_RUN_ID"],runAttempt=os.environ["GITHUB_RUN_ATTEMPT"],sourceStatus=os.environ["SOURCE_STATUS"],installStatus=os.environ["INSTALL_STATUS"],compileStatus=os.environ["COMPILE_STATUS"],installLog=log("install.log"),compileLog=log("compile.log"),forkLog=log("fork.log"),rpcPacingLog=log("rpc-pacing.log"),anvilLog=log("anvil.log"),forkEvidence=json.loads((d/"fork-evidence.json").read_text()) if (d/"fork-evidence.json").exists() else None,buildReport=json.loads(reports[-1].read_text()) if reports else None,mevBenchmark=json.loads((d/"mev-benchmark.json").read_text()) if (d/"mev-benchmark.json").exists() else None)
          (d/"compile-evidence.json").write_text(json.dumps(result,indent=2)+"\n")
          PY
          target="campaigns/CurveYield_DEX_Simplified_Native_Fees_v20_mev_benchmark_evidence_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.json"
