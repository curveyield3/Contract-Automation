name: CurveYield deployment header equivalence v1
on:
  push:
    branches: [cyvlsdt-v69-postdeploy-simulation-v1]
    paths: ['.github/workflows/lite-phase0-source-zip-smoke-v1.yml', 'github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json', 'github-native-sim/cyvlsdt-runtime-compare-v1/v69-postdeploy-suite-v1.cjs']
permissions:
  contents: read
jobs:
  fork-gas:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FOUNDRY_OPTIMIZER_RUNS: '25'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Materialize exact v64 source and benchmark-only optimization candidate
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/curveyield3/Smart-Contracts/6b058498554f58936daf1216c222d554ee666f5e/Audit-Intake/CurveYield-cyvlSDT-Deployment-Package-v64.zip' -o /tmp/cyv64.zip
          echo 'a2d46ab6bf63a760efecf914f36419b8ec271c0e36f9b3ee9821cd842ea0d7ee  /tmp/cyv64.zip' | sha256sum -c -
          mkdir -p /tmp/cyv64 /tmp/cyv65
          unzip -q /tmp/cyv64.zip -d /tmp/cyv64
          cp -a /tmp/cyv64/contracts /tmp/cyv65/
          mkdir -p /tmp/cyv-deps
          npm install --prefix /tmp/cyv-deps --ignore-scripts --no-audit --no-fund --no-save '@openzeppelin/contracts@5.4.0' '@openzeppelin-4/contracts@npm:@openzeppelin/contracts@4.9.6' '@openzeppelin/contracts-upgradeable@4.9.6' 'ethers@6.17.0'
          ln -s /tmp/cyv-deps/node_modules /tmp/cyv64/node_modules
          ln -s /tmp/cyv-deps/node_modules /tmp/cyv65/node_modules
          for ROOT in /tmp/cyv64 /tmp/cyv65; do
            rm -f "$ROOT/contracts/PoL_Manager_Contract_v22.sol" "$ROOT/contracts/VoteMarketSingleGaugeBribeAllocator.sol"
            rm -rf "$ROOT/contracts/external_guard_v8"
            cat > "$ROOT/foundry.toml" <<'EOF'
          [profile.default]
          src = "contracts"
          out = "out"
          libs = ["node_modules"]
          remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/", "@openzeppelin-4/contracts/=node_modules/@openzeppelin-4/contracts/", "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/"]
          solc_version = "0.8.28"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          evm_version = "cancun"
          EOF
          done
          python3 - <<'PY'
          import json,pathlib
          p=json.loads(pathlib.Path('github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json').read_text())
          exec(compile(p['transform'],'v65-transform','exec'))
          exec(compile(p['unifiedTransform'],'v66-transform','exec'))
          exec(compile(p['packingTransform'],'v67-transform','exec'))
          PY
      - name: Compile pinned original proposal artifacts and updated vault and SDT strategy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v72-report
          FOUNDRY_OUT=out-25-v69 forge build --root /tmp/cyv65 --force --skip test --skip script
          mkdir -p /tmp/cyv-header69
          cp -a /tmp/cyv65/contracts /tmp/cyv65/foundry.toml /tmp/cyv-header69/
          ln -s /tmp/cyv-deps/node_modules /tmp/cyv-header69/node_modules
          python3 - <<'PY'
          import json,pathlib,re,difflib
          p=json.loads(pathlib.Path('github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json').read_text())
          exec(compile(p['vaultEmergencyCapabilityPatch'],'v70-vault-capability','exec'))
          exec(compile(p['vaultMintAllowancePatch'],'v71-mint-allowance','exec'))
          f=pathlib.Path('/tmp/cyv65/contracts/StrategyCurveSDTYearnRebindable.sol')
          before=f.read_text()
          after,n=re.subn(r'(\bCURVE_LP_SLIPPAGE_BPS\s*=\s*)200\b',r'\g<1>100',before)
          assert n==1,('expected exactly one 200 bps SDT slippage constant',n)
          assert re.search(r'quoteDeposit\s*\([^;]*CURVE_LP_SLIPPAGE_BPS',after)
          assert re.search(r'quoteWithdraw\s*\([^;]*CURVE_LP_SLIPPAGE_BPS',after)
          f.write_text(after)
          diff=''.join(difflib.unified_diff(before.splitlines(keepends=True),after.splitlines(keepends=True),fromfile='v71/'+f.name,tofile='v72/'+f.name))
          print('SDT_SLIPPAGE_SOURCE_DIFF\n'+diff,flush=True)
          out=pathlib.Path('/tmp/v72-report')
          (out/'StrategyCurveSDTYearnRebindable-v72.sol').write_text(after)
          (out/'SDT-slippage-diff-v1.patch').write_text(diff)
          (out/'BeefyVaultCurveYieldV8cyvlSDT-v71.sol').write_text(pathlib.Path('/tmp/cyv65/contracts/BeefyVaultCurveYieldV8cyvlSDT.sol').read_text())
          pathlib.Path('/tmp/cyv64/replay.cjs').write_text(p['replay'])
          PY
          FOUNDRY_OUT=out-25-v72 forge build --root /tmp/cyv65 --force --skip test --skip script
          python3 - <<'PY'
          import pathlib,json
          root=pathlib.Path('/tmp/cyv65')
          report={}
          for name in ['BeefyVaultCurveYieldV8cyvlSDT','StrategyCurveSDTYearnRebindable']:
              a=json.loads((root/'out-25-v69'/(name+'.sol')/(name+'.json')).read_text())
              b=json.loads((root/'out-25-v72'/(name+'.sol')/(name+'.json')).read_text())
              sizes=lambda v:{k:len(bytes.fromhex(v[k]['object'].removeprefix('0x'))) for k in ['bytecode','deployedBytecode']}
              report[name]={'before':sizes(a),'after':sizes(b)}
              assert report[name]['after']['deployedBytecode']<=24576
          pathlib.Path('/tmp/v72-report/Compiled-size-v72.json').write_text(json.dumps(report,indent=2))
          print('COMPILED_SIZE_V72',json.dumps(report))
          PY
      - name: Apply exact header only to deployed source units
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cyv-header72 /tmp/cyv-header-report /tmp/pol-base/contracts /tmp/pol-header/contracts /tmp/oracle-base/contracts /tmp/oracle-header/contracts
          cp -a /tmp/cyv65/contracts /tmp/cyv65/foundry.toml /tmp/cyv-header72/
          ln -s /tmp/cyv-deps/node_modules /tmp/cyv-header72/node_modules
          for root in /tmp/oracle-base /tmp/oracle-header; do
            cp /tmp/cyv65/foundry.toml "$root/foundry.toml"
            ln -s /tmp/cyv-deps/node_modules "$root/node_modules"
          done
          curl -fsSL 'https://raw.githubusercontent.com/curveyield3/Smart-Contracts/60354e796ce4ed088981187a1493110fe48b0194/cyvlSDT/contracts/CurveYieldSDTShareOracle.sol' -o /tmp/oracle-base/contracts/CurveYieldSDTShareOracle.sol
          curl -fsSL 'https://raw.githubusercontent.com/curveyield3/Smart-Contracts/a3c5061842a61edab35941643343003fab296ad3/cyvlSDT/contracts/CurveYieldSDTShareOracle.sol' -o /tmp/oracle-header/contracts/CurveYieldSDTShareOracle.sol
          python3 - <<'PY'
          import pathlib,json,re,hashlib
          P=pathlib.Path
          out=P('/tmp/cyv-header-report')
          pattern=r'/\*\*\s*\n\s*\*\s*@title CurveYield System Component\b.*?\*/'
          oracle=P('/tmp/oracle-header/contracts/CurveYieldSDTShareOracle.sol')
          header=re.search(pattern,oracle.read_text(),re.S).group(0)
          (out/'CurveYield_Extended_Header_v1.txt').write_text(header+'\n')
          def patch(src):
              s=src.read_text()
              body=re.sub(pattern,'',s,flags=re.S)
              m=re.search(r'^// SPDX-License-Identifier:[^\n]*\n',body,re.M)
              assert m and m.start()==0,src
              new=body[:m.end()]+'\n'+header+'\n'+body[m.end():].lstrip('\n')
              assert new.count(header)==1,src
              src.write_text(new)
          names=['BeefyVaultCurveYieldV8cyvlSDT','StrategyDualFXNUnifiedV43','StrategyConvexBoostHubStakingDirectV66','CurveYieldVlSDTToken','BoostHubInitializedClone','CurveYieldVlSDTLocker','CurveYieldvlSDTStaking','CurveYieldRevenueStrategyV8','CurveYieldVlSDTBoostMerchant','StrategyCurveSDTYearnRebindable']
          def digest(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          manifest={}
          for profile in ('69','72'):
              root=P('/tmp/cyv-header'+profile)/'contracts'
              original={str(f.relative_to(root)):digest(f) for f in root.rglob('*.sol')}
              targets=set()
              for name in names:
                  paths=list(root.rglob(name+'.sol'))
                  assert len(paths)==1,(name,paths)
                  f=paths[0];targets.add(str(f.relative_to(root)));patch(f)
              after={str(f.relative_to(root)):digest(f) for f in root.rglob('*.sol')}
              assert original.keys()==after.keys()
              changed={k for k in original if original[k]!=after[k]}
              assert changed<=targets,changed-targets
              manifest[profile]={'deployedSourceUnits':sorted(targets),'changed':sorted(changed),'unchangedDependencyUnits':len(original)-len(targets),'dependencyHashes':{k:v for k,v in after.items() if k not in targets}}
          cfg=json.loads(P('github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json').read_text())['polManagerV26']['candidate']
          for root in ('/tmp/pol-base','/tmp/pol-header'):
              p=P(root)/cfg['path'];p.parent.mkdir(parents=True,exist_ok=True);p.write_text(cfg['source'])
              (P(root)/'foundry.toml').write_text('[profile.default]\nsrc="contracts"\nsolc_version="0.8.28"\noptimizer=true\noptimizer_runs=25\nvia_ir=true\nevm_version="cancun"\n')
          patch(P('/tmp/pol-header')/cfg['path'])
          (out/'Source-header-manifest-v1.json').write_text(json.dumps(manifest,indent=2))
          (out/'PoL-source-path.txt').write_text(cfg['path'])
          print('HEADER_SOURCE_MANIFEST',json.dumps({k:{x:y for x,y in v.items() if x!='dependencyHashes'} for k,v in manifest.items()}))
          PY
      - name: Compile and compare all deployed contract artifacts
        shell: bash
        run: |
          set -euo pipefail
          for root in /tmp/cyv-header69 /tmp/cyv-header72 /tmp/pol-base /tmp/pol-header /tmp/oracle-base /tmp/oracle-header; do
            forge build --root "$root" --force --skip test --skip script
          done
          python3 - <<'PY'
          import pathlib,json,hashlib,shutil
          P=pathlib.Path
          out=P('/tmp/cyv-header-report')
          def code(a,k):return bytes.fromhex(a[k]['object'].removeprefix('0x'))
          def strip(b):
              n=int.from_bytes(b[-2:],'big')
              return b[:-n-2] if 0<n<len(b)-2 and b[-n-2]>>5==5 else b
          def artifact(root,filename,name):
              p=P(root)/(filename+'.sol')/(name+'.json')
              assert p.is_file(),p
              return json.loads(p.read_text())
          def compare(name,filename,oldroot,newroot,source):
              a=artifact(oldroot,filename,name);b=artifact(newroot,filename,name)
              row={'name':name,'abiEqual':a['abi']==b['abi']}
              for k in ('bytecode','deployedBytecode'):
                  x,y=code(a,k),code(b,k)
                  row[k]={'oldBytes':len(x),'newBytes':len(y),'exactEqual':x==y,'withoutTrailingMetadataEqual':strip(x)==strip(y),'oldSha256':hashlib.sha256(x).hexdigest(),'newSha256':hashlib.sha256(y).hexdigest()}
              assert row['abiEqual'],row
              assert row['deployedBytecode']['withoutTrailingMetadataEqual'],row
              assert row['deployedBytecode']['newBytes']<=24576,row
              folder=out/'artifacts'/name;folder.mkdir(parents=True,exist_ok=True)
              (folder/'original.json').write_text(json.dumps(a))
              (folder/'header.json').write_text(json.dumps(b))
              shutil.copyfile(source,folder/(filename+'.sol'))
              return row
          names=['BeefyVaultCurveYieldV8cyvlSDT','StrategyDualFXNUnifiedV43','StrategyConvexBoostHubStakingDirectV66','CurveYieldVlSDTToken','BoostHubInitializedClone','CurveYieldVlSDTLocker','CurveYieldvlSDTStaking','CurveYieldRevenueStrategyV8','CurveYieldVlSDTBoostMerchant','StrategyCurveSDTYearnRebindable']
          rows=[]
          for name in names:
              v='72' if name in ('BeefyVaultCurveYieldV8cyvlSDT','StrategyCurveSDTYearnRebindable') else '69'
              root=P('/tmp/cyv-header'+v)
              rows.append(compare(name,name,'/tmp/cyv65/out-25-v'+v,root/'out',next((root/'contracts').rglob(name+'.sol'))))
          pol=P((out/'PoL-source-path.txt').read_text())
          rows.append(compare('PoLManager',pol.stem,'/tmp/pol-base/out','/tmp/pol-header/out',P('/tmp/pol-header')/pol))
          rows.append(compare('CurveYieldSDTShareOracle','CurveYieldSDTShareOracle','/tmp/oracle-base/out','/tmp/oracle-header/out','/tmp/oracle-header/contracts/CurveYieldSDTShareOracle.sol'))
          for root in ('cyv-header69','cyv-header72','pol-header','oracle-header'):
              dst=out/'compiler-inputs'/root;dst.mkdir(parents=True,exist_ok=True)
              shutil.copytree(P('/tmp')/root/'contracts',dst/'contracts')
              shutil.copyfile(P('/tmp')/root/'foundry.toml',dst/'foundry.toml')
          report={'compiler':'0.8.28','optimizerRuns':25,'viaIR':True,'evmVersion':'cancun','testsExecuted':False,'contracts':rows}
          (out/'Header-compiler-comparison-v1.json').write_text(json.dumps(report,indent=2))
          print('HEADER_COMPILATION_COMPLETE',json.dumps(report),flush=True)
          PY
      - name: Retain header sources and compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CurveYield-Deployment-Headers-v1
          path: /tmp/cyv-header-report/
          if-no-files-found: error
