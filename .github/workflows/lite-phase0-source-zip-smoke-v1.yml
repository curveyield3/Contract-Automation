        id: compile
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          node --input-type=module > "$GITHUB_WORKSPACE/.source-zip-smoke/compile.log" 2>&1 <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {compileContracts} from './tooling/lib/compileSolc.mjs';
          const target='contracts/hooks/CurveYieldMevVolumeHookV14.sol', name='CurveYieldMevVolumeHookV14';
          const dir=process.env.GITHUB_WORKSPACE+'/.source-zip-smoke';
          const original=fs.readFileSync(dir+'/mev-v18.sol','utf8');
          const v19=fs.readFileSync(target,'utf8');
          const sha=s=>crypto.createHash('sha256').update(s).digest('hex');
          const replace=(s,a,b)=>{if(s.split(a).length!==2)throw Error('Unexpected source: '+a);return s.replace(a,b)};
          const stable=fs.readFileSync('contracts/hooks/CurveYieldStableSurgeVolumeHookV14.sol','utf8');
          const toggleFunction=stable.slice(stable.indexOf('    function setVolumeDisabled('),stable.indexOf('    function onBeforeSwap('));
          if(!toggleFunction.includes('_ensureAuthenticatedByRole'))throw Error('Missing exact qualified toggle');
          let toggle=replace(original,'    uint256 public globalCombinedFeeCap;','    mapping(address pool => bool disabled) public volumeDisabled;\n    event VolumeDisabledSet(address indexed pool, bool disabled);\n\n    uint256 public globalCombinedFeeCap;');
          toggle=replace(toggle,'    function onBeforeSwap(',toggleFunction+'    function onBeforeSwap(');
          toggle=replace(toggle,'public override onlyVault returns (bool) {\n        uint256 index = params.kind','public override onlyVault returns (bool) {\n        if (volumeDisabled[pool]) return true;\n        uint256 index = params.kind');
          const mevLine='        uint256 mevFee = _mevTaxEnabled && !_isExemptRouterSender(params.router)\n            ? _calculateSwapFeePercentage(pool, staticFee) : staticFee;\n';
          toggle=replace(toggle,mevLine,'');
          toggle=replace(toggle,'        uint256 active = msg.sender',mevLine+'        if (volumeDisabled[pool]) return (true, mevFee);\n        uint256 active = msg.sender');
          toggle=replace(toggle,'        _activeVolumeFee.tSet(params.pool, 0);\n        return (true, infrastructure.afterSwap(params));','        if (_activeVolumeFee.tGet(params.pool) != 0) _activeVolumeFee.tSet(params.pool, 0);\n        return (true, infrastructure.afterSwap(params));');
          // Same principle as SurgeFeeData: pack only bounded config; retain full-width native multiplier and threshold.
          let packed=replace(toggle,'    mapping(address pool => bool disabled) public volumeDisabled;\n','');
          packed=replace(packed,'    mapping(address pool => uint256 capPlusOne) private _poolCombinedFeeCap;','    struct PoolFeeSettings { uint64 capPlusOne; bool volumeDisabled; }\n    mapping(address pool => PoolFeeSettings) private _poolFeeSettings;');
          packed=replace(packed,'        volumeDisabled[pool] = disabled;','        _poolFeeSettings[pool].volumeDisabled = disabled;');
          packed=replace(packed,'    function setVolumeDisabled(','    function volumeDisabled(address pool) public view returns (bool) {\n        return _poolFeeSettings[pool].volumeDisabled;\n    }\n\n    function setVolumeDisabled(');
          packed=replace(packed,'        _poolCombinedFeeCap[pool] = enabled ? cap + 1 : 0;','        _poolFeeSettings[pool].capPlusOne = enabled ? uint64(cap + 1) : 0;');
          packed=replace(packed,'        uint256 cap = _poolCombinedFeeCap[pool];','        uint256 cap = _poolFeeSettings[pool].capPlusOne;');
          packed=packed.replaceAll('if (volumeDisabled[pool])','if (volumeDisabled(pool))');
          // The original overflow branch saturated at maximum. Since maximum <= 1e18,
          // maxUint256 / 1e18 is above it, and static + product/1e18 cannot overflow
          // following the original early return static < maximum.
          const math=s=>replace(s,'        (bool success, uint256 feeIncrement) = Math.tryMul(\n            priorityGasPrice - threshold,\n            _poolMevTaxMultipliers[pool]\n        );\n        if (!success) return maxMevSwapFeePercentage;\n\n        feeIncrement = feeIncrement / 1e18;\n        uint256 mevSwapFeePercentage = staticSwapFeePercentage + feeIncrement;\n        return Math.min(mevSwapFeePercentage, maxMevSwapFeePercentage);','        unchecked {\n            return Math.min(\n                staticSwapFeePercentage + Math.saturatingMul(priorityGasPrice - threshold, _poolMevTaxMultipliers[pool]) / 1e18,\n                maxMevSwapFeePercentage\n            );\n        }');
          const variants=[['v18-original',original],['v19-qualified',v19],['toggle-only',toggle],['toggle-packed-config',packed],['toggle-simplified-math',math(toggle)],['toggle-packed-and-math',math(packed)]];
          const measurements=[];
          const expectedAbi=(abi)=>abi.filter(x=>x.type==='function'||x.type==='event'||x.type==='error').map(x=>JSON.stringify(x)).sort();
          let reference;
          try{
            for(const [variant,source] of variants){
              fs.writeFileSync(target,source);
              const {compiled,compilerProfile}=compileContracts([target],[name],'custom');
              const art=compiled[name]; if(!art)throw Error('Missing measured artifact');
              if(variant==='v19-qualified')reference=expectedAbi(art.abi);
              const row={variant,sourceSha256:sha(source),runtime:(art.deployedBytecode.length-2)/2,creation:(art.bytecode.length-2)/2,profile:compilerProfile,abi:expectedAbi(art.abi)};
              measurements.push(row);
              console.log(variant+' runtime='+row.runtime+' creation='+row.creation+' sha256='+row.sourceSha256);
              fs.writeFileSync(dir+'/mev-benchmark.json',JSON.stringify({measurements},null,2)+'\n');
            }
            const compatible=measurements.filter(x=>x.variant.startsWith('toggle')&&JSON.stringify(x.abi)===JSON.stringify(reference));
            const best=compatible.sort((a,b)=>a.runtime-b.runtime||a.creation-b.creation)[0];
            if(!best)throw Error('No ABI-compatible candidate');
            fs.writeFileSync(dir+'/mev-benchmark.json',JSON.stringify({measurements:measurements.map(({abi,...r})=>r),selected:best.variant,selectedSha256:best.sourceSha256,selectedRuntime:best.runtime},null,2)+'\n');
          } finally {fs.writeFileSync(target,v19);}
          JS
