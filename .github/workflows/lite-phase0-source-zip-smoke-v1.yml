name: cyvlSDT exact two-batch configuration packing
on:
  push:
    branches: [cyvlsdt-v69-postdeploy-simulation-v1]
    paths: ['github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json', '.github/workflows/lite-phase0-source-zip-smoke-v1.yml']
permissions:
  contents: read
jobs:
  fork-gas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UPSTREAM_RPC: ${{ secrets.RPC_ETHEREUM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Simulate exact already-compiled proposal payloads
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/cyv-deps --ignore-scripts --no-audit --no-fund --no-save ethers@6.17.0
          mkdir -p /tmp/cyv64
          ln -s /tmp/cyv-deps/node_modules /tmp/cyv64/node_modules
          export FORK_BLOCK=26482950
          anvil --fork-url "$UPSTREAM_RPC" --fork-block-number "$FORK_BLOCK" --host 127.0.0.1 --port 8545 --silent >/tmp/anvil.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import json,pathlib
          p=json.loads(pathlib.Path('github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json').read_text())
          pathlib.Path('/tmp/cyv64/replay.cjs').write_text(p['replay'])
          PY
          node /tmp/cyv64/replay.cjs
