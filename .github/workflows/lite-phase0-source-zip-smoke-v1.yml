name: Lite Phase 0 Archived Source ZIP Smoke v1

# Source-only compilation smoke for archived campaigns which do not yet carry
# the canonical Phase-0 execution artifact/receipt bundle. Does not publish
# campaign evidence or claim a 300-call economic simulation.
on:
  push:
    paths:
      - '.github/smoke-trigger/lite-phase0-source-zip-smoke-v1.json'
      - 'packages/github-native-sim/inputs/AVKAT_Consolidated_Safe_Module_v2.sol'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-zip-smoke-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  source-zip-smoke:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'compile(avkat):')
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: BoostHub v11
            archive: campaigns/Boosthub Staking v2/source/CurveYield-BoostHub-sdCRV-sdFXN-Deployment-Package-v11.zip
            config: hardhat.config.v3.js
          - label: BoostHub remediated v4
            archive: campaigns/Boosthub Staking v2/source/CurveYield-BoostHub-sdCRV-sdFXN-sdYB-Deployment-Package-Remediated-v4.zip
            config: hardhat.config.js
          - label: cyvlSDT v30
            archive: campaigns/cyvlSDT v30 Audit v29/source/CurveYield-cyvlSDT-Deployment-Package-v30.zip
            config: hardhat.config.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Authenticate read-only Audit-Controller access
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Fetch and verify exact archival source
        id: source
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          SOURCE_ARCHIVE: ${{ matrix.archive }}
          SOURCE_CONFIG: ${{ matrix.config }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --depth 1 --filter=blob:none --sparse https://github.com/curveyield3/Audit-Controller.git .audit-controller
          git -C .audit-controller sparse-checkout set --no-cone "$SOURCE_ARCHIVE"
          test -s ".audit-controller/$SOURCE_ARCHIVE"
          mkdir -p .source-zip-smoke .source-project
          python3 - <<'PY'
          import os,zipfile,hashlib,json,pathlib
          src=pathlib.Path(".audit-controller")/os.environ["SOURCE_ARCHIVE"]
          assert zipfile.is_zipfile(src),"Invalid source ZIP"
          digest=hashlib.sha256(src.read_bytes()).hexdigest()
          out=pathlib.Path(".source-project")
          with zipfile.ZipFile(src) as z:
              corrupt=z.testzip()
              assert corrupt is None,f"Corrupt ZIP member: {corrupt}"
              members=z.infolist()
              assert members,"Archive is empty"
              for member in members:
                  path=pathlib.PurePosixPath(member.filename)
                  assert not path.is_absolute() and ".." not in path.parts, f"Unsafe ZIP member: {member.filename}"
              z.extractall(out)
          roots=[p for p in out.iterdir() if p.is_dir()]
          project=roots[0] if len(roots)==1 else out
          files=[p for p in project.rglob("*") if p.is_file()]
          assert any(p.suffix in {".sol",".vy"} for p in files),"No Solidity or Vyper source files found"
          manifest={"sourceArchive":os.environ["SOURCE_ARCHIVE"],"sha256":digest,"zipBytes":src.stat().st_size,"sourceFiles":sum(p.suffix in {".sol",".vy"} for p in files),"project":str(project),"config":os.environ["SOURCE_CONFIG"],"mode":"SOURCE_ONLY_BUILD_SMOKE","economicTelemetryCalls":0}
          pathlib.Path(".source-zip-smoke/source-identity.json").write_text(json.dumps(manifest,indent=2)+"\n")
          pathlib.Path(".source-zip-smoke/project-dir").write_text(str(project))
          print(json.dumps(manifest,indent=2))
          PY
          echo "project_dir=$(cat .source-zip-smoke/project-dir)" >> "$GITHUB_OUTPUT"
          test -f "$(cat .source-zip-smoke/project-dir)/package.json"
          test -f "$(cat .source-zip-smoke/project-dir)/${SOURCE_CONFIG}"

      - name: Install locked project dependencies
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if test -f package-lock.json; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Compile actual archived contract sources
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
          SOURCE_CONFIG: ${{ matrix.config }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npx --no-install hardhat compile --config "$SOURCE_CONFIG" 2>&1 | tee "$GITHUB_WORKSPACE/.source-zip-smoke/compile.log"
          # Respect paths.artifacts in each archived project's Hardhat config.
          # Hardhat can compile successfully into a nonstandard build directory.
          SOURCE_ARTIFACT_DIR="$(HARDHAT_CONFIG="$SOURCE_CONFIG" node -e 'process.stdout.write(require("hardhat").config.paths.artifacts)')"
          export SOURCE_ARTIFACT_DIR
          test -d "$SOURCE_ARTIFACT_DIR" || { echo "::error::Hardhat artifact directory is missing: $SOURCE_ARTIFACT_DIR"; exit 1; }
          echo "Hardhat artifact directory: $SOURCE_ARTIFACT_DIR"
          python3 - <<'PY'
          import json, pathlib, os
          root=pathlib.Path(os.environ["SOURCE_ARTIFACT_DIR"])
          contracts=[]
          for f in root.rglob("*.json"):
              try:
                  d=json.loads(f.read_text())
                  if isinstance(d,dict) and d.get("abi") is not None and d.get("bytecode") not in (None,"0x"):
                      contracts.append({"name":d.get("contractName",f.stem),"path":str(f)})
              except (ValueError,UnicodeDecodeError): pass
          report=json.loads((pathlib.Path(os.environ["GITHUB_WORKSPACE"])/".source-zip-smoke/source-identity.json").read_text())
          report["compiledContracts"]=len(contracts)
          report["contracts"]=contracts[:100]
          report["status"]="PASS" if contracts else "NO_DEPLOYABLE_COMPILED_ARTIFACTS"
          (pathlib.Path(os.environ["GITHUB_WORKSPACE"])/".source-zip-smoke/compile-summary.json").write_text(json.dumps(report,indent=2)+"\n")
          print(f"Compiled deployable Solidity contracts: {len(contracts)}")
          assert contracts,"No deployable compiled artifacts"
          PY

      - name: Run included Node source tests if present
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mapfile -d '' tests < <(find test tests -type f \( -name '*.test.js' -o -name '*.test.mjs' \) -print0 2>/dev/null || true)
          if (( ${#tests[@]} > 0 )); then
            node --test "${tests[@]}" | tee "$GITHUB_WORKSPACE/.source-zip-smoke/tests.log"
          else
            echo 'No standalone Node tests included; compilation smoke only' | tee "$GITHUB_WORKSPACE/.source-zip-smoke/tests.log"
          fi

      - name: Preserve independent source ZIP smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: source-zip-smoke-${{ matrix.label }}-${{ github.run_id }}
          path: .source-zip-smoke/
          if-no-files-found: warn
          include-hidden-files: true


  avkat-source-compile:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'compile(avkat):')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing pinned Solidity compiler
        run: npm ci --ignore-scripts
      - name: Compile standalone AVKAT v2 and calculate creation/runtime limits
        shell: bash
        run: |
          mkdir -p avkat-compile-output
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import solc from 'solc';
          import crypto from 'node:crypto';
          const path='packages/github-native-sim/inputs/AVKAT_Consolidated_Safe_Module_v2.sol';
          const source=fs.readFileSync(path,'utf8');
          const input={language:'Solidity',sources:{'AVKAT_Consolidated_Safe_Module_v2.sol':{content:source}},
            settings:{optimizer:{enabled:true,runs:200},viaIR:true,evmVersion:'cancun',
            outputSelection:{'*':{'*':['abi','evm.bytecode.object','evm.deployedBytecode.object']}}}};
          const output=JSON.parse(solc.compile(JSON.stringify(input)));
          const diagnostics=(output.errors||[]).map(x=>({severity:x.severity,formattedMessage:x.formattedMessage}));
          for(const d of diagnostics) console.log(d.formattedMessage);
          const contracts=output.contracts?.['AVKAT_Consolidated_Safe_Module_v2.sol']||{};
          const artifacts={};
          for(const [name,artifact] of Object.entries(contracts)){
            const creation=artifact.evm?.bytecode?.object||'';
            const runtime=artifact.evm?.deployedBytecode?.object||'';
            artifacts[name]={abi:artifact.abi,bytecode:'0x'+creation,deployedBytecode:'0x'+runtime,
              creationBytes:creation.length/2,runtimeBytes:runtime.length/2,
              creationLimitBytes:49152,runtimeLimitBytes:24576,
              creationHeadroomBytes:49152-creation.length/2,runtimeHeadroomBytes:24576-runtime.length/2};
            console.log('COMPILED_SIZE',JSON.stringify({contract:name,creationBytes:creation.length/2,
              runtimeBytes:runtime.length/2,creationLimit:49152,runtimeLimit:24576,
              runtimeHeadroom:24576-runtime.length/2}));
          }
          const report={compilerVersion:solc.version(),sha256:crypto.createHash('sha256').update(source).digest('hex'),
            configuration:input.settings,success:!diagnostics.some(d=>d.severity==='error'),
            diagnostics,artifacts};
          fs.writeFileSync('avkat-compile-output/compile-v2.json',JSON.stringify(report,null,2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '### AVKAT standalone v2 compile\n\n'+
            '- Compiler: '+report.compilerVersion+'\n- SHA-256: '+report.sha256+
            '\n- Success: '+report.success+'\n\n'+
            Object.entries(artifacts).map(([n,a])=>'- '+n+': creation '+a.creationBytes+
              '/49152 bytes; runtime '+a.runtimeBytes+'/24576 bytes; runtime headroom '+a.runtimeHeadroomBytes).join('\n')+
            '\n\n');
          if(!report.success||!Object.keys(artifacts).length)process.exitCode=1;
          NODE
      - name: Archive compilation report and bytecode
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avkat-consolidated-v2-compilation-${{ github.run_id }}
          path: avkat-compile-output/compile-v2.json
          if-no-files-found: warn
          retention-days: 14
