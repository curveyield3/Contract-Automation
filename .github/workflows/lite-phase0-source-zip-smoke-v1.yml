name: cyvlSDT v69 verify recovered source against queued creation bytecode
on:
  push:
    branches: [cyvlsdt-v69-source-recovery-v1]
    paths: ['.github/workflows/lite-phase0-source-zip-smoke-v1.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CurveYield-cyvlSDT-Deployment-Source-v69
          run-id: 45335465514
          github-token: ${{ github.token }}
          path: /tmp/cyv65
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile exact downloaded source ZIP without tests
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/cyv65
          sha256sum -c SHA256SUMS
          npm install --ignore-scripts --no-audit --no-fund
          forge build --root /tmp/cyv65 --skip test --skip script
      - name: Compare full creation bytecode and constructor arguments to exact queued Safe inputs
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          cases=json.loads('''[{"nonce":34,"index":1,"contract":"BeefyVaultCurveYieldV8cyvlSDT","creationBytes":20334,"creationSha256":"3211f72d6b2241d0a574c99f44514443b30ce8c5c5153080f67505324356432e","initBytes":20366,"initSha256":"15c7cce8bb0fe9299e9d7a8109f2ecbb4ca3f6b2f7b155a1adb7918339eb1fdc","args":"000000000000000000000000064256591313eeb86a84a5cbcc4c6460791b96dd"},{"nonce":34,"index":2,"contract":"StrategyDualFXNUnifiedV43","creationBytes":17409,"creationSha256":"11460cae9e5bf8e9678acbb7b17c5710d9892aec6f1eb732c4632679dba1fc82","initBytes":17729,"initSha256":"ce2a2bb74fe8839fbfac5adeeb0131f47350326c052d9c07afacf66da4f1cd24","args":""},{"nonce":34,"index":3,"contract":"CurveYieldVlSDTToken","creationBytes":3384,"creationSha256":"5e3b9fbcc4123fb2a54439c15a905a52b39da89fdbfc9325560044d1bb8e8a0c","initBytes":3416,"initSha256":"6f87c7afe8fe7a0a845d30e06db64b9d75a10b340be97512199fa38caba40ba2","args":"000000000000000000000000064256591313eeb86a84a5cbcc4c6460791b96dd"},{"nonce":34,"index":4,"contract":"BoostHubInitializedClone","creationBytes":219,"creationSha256":"fe5f993ebcc93de243f4cda28207b9f086732b22046c40eac34fb21c8b84dcde","initBytes":251,"initSha256":"d18afdad26a53f4bb25ce7b860865ab5bdbd6d648d5a2af12694579314f9ca64","args":"00000000000000000000000000f63308ebb429f0967aa36a0def66ec1074975b"},{"nonce":35,"index":0,"contract":"CurveYieldVlSDTLocker","creationBytes":16602,"creationSha256":"74fb21d0005572ff5e23cffa90dbaa48fc70b4d5972d911e6bf9c2243318a2a3","initBytes":16922,"initSha256":"9cf668fb2c1b493914066b54c58a440ba8bd3fb16b147649cb54adeaa321d2e4","args":""},{"nonce":35,"index":1,"contract":"CurveYieldvlSDTStaking","creationBytes":15273,"creationSha256":"dc20c8b1aa5fc0ce63a9a70428e111011c3e0e1c25e4147fde51045e7d085aad","initBytes":15625,"initSha256":"67dbc0f700d8643b34e519e380e7cdf816175d5072e05db4b6f6576bc6d4cf47","args":""},{"nonce":35,"index":2,"contract":"CurveYieldRevenueStrategyV8","creationBytes":12113,"creationSha256":"055fdbd16ef08ae238bd829145053271aff639cee6551e3c6357fd9dc4d731ee","initBytes":12401,"initSha256":"36e291b100a51db0e509b95655b5eb2136f498ee2af500d75bb4ca290913c066","args":""},{"nonce":35,"index":3,"contract":"CurveYieldVlSDTBoostMerchant","creationBytes":11521,"creationSha256":"4ca85f36a1ac18795cee61e8b169eea0768838a30b1c87a006068ad3c8c7fdba","initBytes":11617,"initSha256":"f815e0fa6d1d91792e34a59280e8a1225d1fe07a4040da7464ffa3ffd33f904a","args":"000000000000000000000000064256591313eeb86a84a5cbcc4c6460791b96dd0000000000000000000000005f5da46852de82ae4bd8d1da16bec50b0906b53b000000000000000000000000bc38d256e559fed3fa95a6cdc633c667283fb6b8"},{"nonce":35,"index":4,"contract":"StrategyCurveSDTYearnRebindable","creationBytes":10339,"creationSha256":"4918a2668acb920e42e0c873ff9a7d56ccfefe90df3045626bd8caebdd608e8d","initBytes":10467,"initSha256":"b5684c57aed3a3da291262e5c7b83b868e0dff266122291d80b8884aa83b95a3","args":"0000000000000000000000007c9977ce98710eaee2fdaa9c0a425e85f98a7a6c0000000000000000000000000df3604071c080edd761c4bb19e5dc909df5c8f2000000000000000000000000ab989d9daa0279e123d453204545be556f2d3072000000000000000000000000064256591313eeb86a84a5cbcc4c6460791b96dd"},{"nonce":35,"index":5,"contract":"StrategyConvexBoostHubStakingDirectV66","creationBytes":8312,"creationSha256":"d7214eaa2522a25489c22868614341b23e61cb23806cd7b2364d4c9d4b561151","initBytes":8632,"initSha256":"ef979c61ffeeee948058b0112039e2b1f58802154b42910be62e299f575b2e7b","args":""},{"nonce":35,"index":6,"contract":"BoostHubInitializedClone","creationBytes":219,"creationSha256":"fe5f993ebcc93de243f4cda28207b9f086732b22046c40eac34fb21c8b84dcde","initBytes":251,"initSha256":"d18afdad26a53f4bb25ce7b860865ab5bdbd6d648d5a2af12694579314f9ca64","args":"00000000000000000000000000f63308ebb429f0967aa36a0def66ec1074975b"},{"nonce":35,"index":7,"contract":"BoostHubInitializedClone","creationBytes":219,"creationSha256":"fe5f993ebcc93de243f4cda28207b9f086732b22046c40eac34fb21c8b84dcde","initBytes":251,"initSha256":"d18afdad26a53f4bb25ce7b860865ab5bdbd6d648d5a2af12694579314f9ca64","args":"00000000000000000000000000f63308ebb429f0967aa36a0def66ec1074975b"},{"nonce":35,"index":8,"contract":"BoostHubInitializedClone","creationBytes":219,"creationSha256":"fe5f993ebcc93de243f4cda28207b9f086732b22046c40eac34fb21c8b84dcde","initBytes":251,"initSha256":"d18afdad26a53f4bb25ce7b860865ab5bdbd6d648d5a2af12694579314f9ca64","args":"00000000000000000000000000f63308ebb429f0967aa36a0def66ec1074975b"}]''')
          failures=[]
          for c in cases:
              a=json.loads((pathlib.Path('/tmp/cyv65/out-25')/(c['contract']+'.sol')/(c['contract']+'.json')).read_text())
              code=bytes.fromhex(a['bytecode']['object'].removeprefix('0x'))
              digest=hashlib.sha256(code).hexdigest()
              full=code+bytes.fromhex(c['args'])
              ok=len(code)==c['creationBytes'] and digest==c['creationSha256'] and len(full)==c['initBytes'] and hashlib.sha256(full).hexdigest()==c['initSha256']
              print('CREATION_MATCH',c['nonce'],c['index'],c['contract'],len(code),digest,ok,flush=True)
              if not ok: failures.append(c['contract'])
          print('DIRECT_CREATE_MATCHES',len(cases)-len(failures),'/',len(cases))
          assert not failures, failures
          PY
