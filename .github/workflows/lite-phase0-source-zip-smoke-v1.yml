          const supplyAbi=parseAbi(['function totalSupply() view returns (uint256)']);
          const fullPools=[];
          const unit=10n**18n;
          async function tx(w,a,abi,fn,args=[],verify){
            qualifying=true;
            try{
              const result=await send(w,a,abi,fn,args);
              if(verify)verify(lastAction,result);
              const fees={};for(const l of lastAction.logs){
                if(l.address.toLowerCase()!==infra.toLowerCase())continue;
                try{const e=decodeEventLog({abi:feeEvent,data:l.data,topics:l.topics});const t=e.args.token.toLowerCase();const f=fees[t]??[0n,0n];f[0]+=e.args.vaultFee;f[1]+=e.args.burned;fees[t]=f;}catch{}
              }
              if(lastAction.actor.toLowerCase()!==dao.toLowerCase())for(const [t,[fee,burn]] of Object.entries(fees)){
                assert.equal(deltaOf(lastAction,t,dao),fee,'Fee recipient balance delta');
                assert.equal(lastAction.after.tokens[t].supply-lastAction.before.tokens[t].supply,-burn,'Hook burn supply delta');
              }
              actionCount++;
              record(campaignLedger,{kind:'qualified',hash:lastAction.hash,actionNumber:actionCount});
              if(actionCount%25===0)console.log('Qualifying actions completed: '+actionCount);
              return result;
            }finally{qualifying=false;}
          }
          async function sim(w,address,abi,functionName,args=[]){
            const r0=await pub.simulateContract({account:w.account,address,abi,functionName,args});
            record(coverageLedger,{kind:'simulation',address,functionName,args,result:r0.result});return r0.result;
          }
          const actorOf=w=>w.account.address;
          const expiry2=Number((await pub.getBlock()).timestamp)+86400*30;
          await send(wallet,T,ft,'setExempt',[vault,true]);
          assert.equal(await read(T,ft,'exempt',[vault]),true);
          await send(daoWallet,infra,tax,'setTokenPolicy',[T,{depositBps:25,withdrawalBps:35,burnBps:20,transferFeeBps:50}]);
          assert.deepEqual(await read(infra,iabi,'tokenPolicy',[T]),[25,35,20,50]);
          for(const t of [A,B,T])await send(wallet,t,ft,'transfer',[actor2.address,2000000n*unit]);
          for(const w of [wallet,wallet2]){
            for(const v of shareTokens){
              await send(w,A,ft,'approve',[v,maxUint256]);
              await send(w,v,fv,'deposit',[200000n*unit,actorOf(w)]);
            }
            for(const t of fixtureTokens){
              await send(w,t,token,'approve',[r.permit2,maxUint256]);
              for(const rt of [router,batch,composite])await send(w,r.permit2,permit,'approve',[t,rt,(1n<<160n)-1n,expiry2]);
            }
          }
          const configOf=t=>({token:t,tokenType:shareTokens.includes(t)?1:0,rateProvider:shareTokens.includes(t)?t:zeroAddress,paysYieldFees:shareTokens.includes(t)});
          const sortTokens=ts=>[...ts].sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()));
          async function newPool(name,type,ts,hookAddress,disabled=false,weights=null){
            const sorted=sortTokens(ts),cfg=sorted.map(configOf),salt='0x'+(100+fullPools.length).toString(16).padStart(64,'0');
            const base=['Full '+name,'FULL'+fullPools.length,cfg];
            let p;
            if(type==='weighted')p=await send(wallet,factory,create,'create',[...base,weights||sorted.map(()=>unit/BigInt(sorted.length)),role,unit/1000n,hookAddress,true,hookAddress!==zeroAddress,salt]);
            else if(type==='stable')p=await send(wallet,stableFactory,stableCreate,'create',[...base,200n,role,unit/1000n,hookAddress,true,hookAddress!==zeroAddress,salt]);
            else p=await send(wallet,reFactory,rcCreate,'create',[...base,role,unit/1000n,{initialMinPrice:unit/2n,initialMaxPrice:2n*unit,initialTargetPrice:unit,tokenAPriceIncludesRate:false,tokenBPriceIncludesRate:false},unit/10n,unit/5n,salt]);
            if(hookAddress===hook)await send(wallet,hook,hookAbi,'setPoolMevTaxThreshold',[p,1000n*threshold]);
            if(hookAddress===hook||hookAddress===surge){
              await send(wallet,volume,vol,'setPoolVolumeFeeConfig',[p,unit/100n,20,8]);
              await send(wallet,hookAddress,hookAddress===hook?hookAbi:surgeAbi,'setVolumeDisabled',[p,disabled]);
            }
            const seed=type==='reclamm'?await read(p,rcAbi,'computeInitialBalancesRaw',[sorted[0],10000n*unit]):sorted.map(()=>10000n*unit);
            await send(wallet,router,route,'initialize',[p,sorted,seed,1n,false,'0x']);
            for(const w of [wallet,wallet2])for(const rt of [router,composite,batch])await send(w,p,token,'approve',[rt,maxUint256]);
            await send(wallet,pc,pcAbi,'setPoolCreatorSwapFeePercentage',[p,unit/20n]);
            await send(wallet,pc,pcAbi,'setPoolCreatorYieldFeePercentage',[p,unit/20n]);
            const rec={name,type,address:p,tokens:sorted,hook:hookAddress,disabled};fullPools.push(rec);return p;
          }
          const P0=await newPool('weighted fee-free shares','weighted',[A,F],zeroAddress);
          const P1=await newPool('weighted tax / MEV-volume','weighted',[A,T],hook,false,[unit*8n/10n,unit*2n/10n]);
          const P2=await newPool('stable surge-volume / free shares','stable',[A,F],surge,false);
          const P3=await newPool('stable pure surge / fee shares','stable',[A,Z],surge,true);
          const P4=await newPool('stable three-token fee shares','stable',[A,D,X],zeroAddress);
          const P5=await newPool('reCLAMM plain assets','reclamm',[A,B],zeroAddress);
          const P6=await newPool('weighted both-fee shares','weighted',[B,Z],hook,true);
          const P7=await newPool('weighted exempt native-tax token','weighted',[B,T],zeroAddress);
          assert.equal(fullPools.length,8);
          record(campaignLedger,{kind:'fixture-manifest',fixtureDeployments,fullPools,actors:[account.address,actor2.address],feeSink});
          const actorList=[wallet,wallet2];
          const step=(pool,tokenOut)=>({pool,tokenOut,isBuffer:false});
          const exactInPath=(tokenIn,steps,amt)=>({tokenIn,steps,exactAmountIn:amt,minAmountOut:1n});
          const exactOutPath=(tokenIn,steps,amt)=>({tokenIn,steps,maxAmountIn:1000n*unit,exactAmountOut:amt});
          async function singleSwap(w,p,ti,to,amount,kind){
            const who=actorOf(w),dl=(await pub.getBlock()).timestamp+3600n;
            const fn=kind===0?'swapSingleTokenExactIn':'swapSingleTokenExactOut';
            const params0=kind===0?[p,ti,to,amount,1n,dl,false,'0x']:[p,ti,to,amount,1000n*unit,dl,false,'0x'];
            await tx(w,router,route,fn,params0,a=>{
              const di=deltaOf(a,ti,who),dout=deltaOf(a,to,who);
              assert.ok(di<0n&&dout>0n,'Swap must debit input and credit output');
              if(kind===0)assert.equal(-di,amount,'Exact-in debit');
              else{assert.equal(dout,amount,'Exact-out credit');assert.ok(-di<=1000n*unit);}
            });
          }
          async function joinExit(w,p,amount){
            const who=actorOf(w),n=p.tokens.length;
            await tx(w,router,route,'addLiquidityProportional',[p.address,Array(n).fill(1000n*unit),amount,false,'0x'],a=>assert.equal(deltaOf(a,p.address,who),amount));
            await tx(w,router,route,'removeLiquidityProportional',[p.address,amount/2n,Array(n).fill(0n),false,'0x'],a=>assert.equal(deltaOf(a,p.address,who),-amount/2n));
          }
          async function vaultLifecycle(w,v,amt){
            const who=actorOf(w);
            await tx(w,v,fv,'deposit',[amt,who],a=>{assert.equal(deltaOf(a,A,who),-amt);assert.ok(deltaOf(a,v,who)>0n);});
            await tx(w,v,fv,'mint',[amt/2n,who],a=>{assert.equal(deltaOf(a,v,who),amt/2n);assert.ok(deltaOf(a,A,who)<0n);});
            await tx(w,v,fv,'withdraw',[amt/3n,who,who],a=>{assert.equal(deltaOf(a,A,who),amt/3n);assert.ok(deltaOf(a,v,who)<0n);});
            await tx(w,v,fv,'redeem',[amt/4n,who,who],a=>{assert.equal(deltaOf(a,v,who),-amt/4n);assert.ok(deltaOf(a,A,who)>0n);});
          }
          for(let cycle=0;cycle<12;cycle++){
            const w=actorList[cycle%2],who=actorOf(w),amount=BigInt(1+(cycle*7)%19)*unit;
            const dl=(await pub.getBlock()).timestamp+3600n;
            if(cycle%3===0){
              for(const v of shareTokens)await tx(w,A,ft,'transfer',[v,100n*unit]);
              // Change genuine rate conditions; subsequent pool interactions realize yield accounting.
              await send(wallet,surge,surgeAbi,'setVolumeDisabled',[P2,cycle%2===0]);
              await send(wallet,hook,hookAbi,'setVolumeDisabled',[P1,cycle%2!==0]);
              await send(wallet,surge,surgeAbi,'setSurgeThresholdPercentage',[P2,unit/10n+BigInt(cycle)*unit/100n]);
              await send(wallet,volume,vol,'setPoolVolumeFeeConfig',[P1,unit/100n,20+cycle,8]);
            }
            for(const p of fullPools){
              const i=cycle%p.tokens.length,j=(i+1)%p.tokens.length,ti=p.tokens[i],to=p.tokens[j];
              await singleSwap(w,p.address,ti,to,amount,0);
              await singleSwap(w,p.address,to,ti,amount/2n,1);
              await joinExit(w,p,unit+BigInt(cycle%4)*unit/4n);
              if(cycle%4===0){
                await sim(w,router,addRoute,'querySwapSingleTokenExactIn',[p.address,ti,to,unit,who,'0x']);
                await sim(w,router,addRoute,'querySwapSingleTokenExactOut',[p.address,to,ti,unit/2n,who,'0x']);
                await sim(w,router,addRoute,'queryAddLiquidityProportional',[p.address,unit/10n,who,'0x']);
                await sim(w,router,addRoute,'queryRemoveLiquidityProportional',[p.address,unit/10n,who,'0x']);
              }
            }
            for(const v of shareTokens)await vaultLifecycle(w,v,amount);
            const path1=exactInPath(T,[step(P1,A),step(P3,Z),step(P6,B)],amount/2n);
            const path2=exactOutPath(B,[step(P6,Z),step(P3,A),step(P1,T)],amount/3n);
            const path3=exactInPath(F,[step(P2,A),step(P5,B),step(P7,T)],amount/3n);
            const path4=exactOutPath(T,[step(P7,B),step(P5,A),step(P2,F)],amount/4n);
            await tx(w,batch,batchAbi,'swapExactIn',[[path1],dl,false,'0x'],a=>{assert.equal(deltaOf(a,T,who),-path1.exactAmountIn);assert.ok(deltaOf(a,B,who)>0n);assert.equal(deltaOf(a,A,who),0n);assert.equal(deltaOf(a,Z,who),0n);});
            await tx(w,batch,batchAbi,'swapExactOut',[[path2],dl,false,'0x'],a=>{assert.equal(deltaOf(a,T,who),path2.exactAmountOut);assert.ok(deltaOf(a,B,who)<0n);assert.equal(deltaOf(a,A,who),0n);assert.equal(deltaOf(a,Z,who),0n);});
            await tx(w,batch,batchAbi,'swapExactIn',[[path3],dl,false,'0x'],a=>{assert.equal(deltaOf(a,F,who),-path3.exactAmountIn);assert.ok(deltaOf(a,T,who)>0n);assert.equal(deltaOf(a,A,who),0n);assert.equal(deltaOf(a,B,who),0n);});
            await tx(w,batch,batchAbi,'swapExactOut',[[path4],dl,false,'0x'],a=>{assert.equal(deltaOf(a,F,who),path4.exactAmountOut);assert.ok(deltaOf(a,T,who)<0n);assert.equal(deltaOf(a,A,who),0n);assert.equal(deltaOf(a,B,who),0n);});
            if(cycle%4===0){
              await sim(w,batch,batchAbi,'querySwapExactIn',[[path1,path3],who,'0x']);
              await sim(w,batch,batchAbi,'querySwapExactOut',[[path2,path4],who,'0x']);
              await tx(w,batch,batchAbi,'swapExactIn',[[path1,path3],dl,false,'0x']);
              await tx(w,batch,batchAbi,'swapExactOut',[[path2,path4],dl,false,'0x']);
            }
            const p=fullPools.find(p=>p.address===P0);
            await tx(w,router,route,'donate',[P0,p.tokens.map(()=>unit),false,'0x']);
            await tx(w,router,addRoute,'addLiquidityUnbalanced',[P0,[unit,unit/2n],1n,false,'0x']);
            await tx(w,router,addRoute,'addLiquiditySingleTokenExactOut',[P0,A,100n*unit,unit/10n,false,'0x']);
            await tx(w,router,addRoute,'removeLiquiditySingleTokenExactIn',[P0,unit/20n,A,1n,false,'0x']);
            await tx(w,router,addRoute,'removeLiquiditySingleTokenExactOut',[P0,100n*unit,A,unit/20n,false,'0x']);
            await tx(w,T,ft,'transfer',[w===wallet?actor2.address:account.address,unit],a=>{assert.equal(deltaOf(a,T,who),-unit);assert.equal(deltaOf(a,T,feeSink),unit*75n/10000n);});
            // Collect and withdraw fees as independent post-configuration actions.
            if(cycle%3===2){
              for(const p0 of fullPools){
                await tx(w,pc,pcAbi,'collectAggregateFees',[p0.address]);
                await read(pc,pcAbi,'getProtocolFeeAmounts',[p0.address]);
                await read(pc,pcAbi,'getPoolCreatorFeeAmounts',[p0.address]);
                await tx(wallet,pc,pcAbi,'withdrawPoolCreatorFees',[p0.address,account.address]);
                await tx(daoWallet,pc,pcAbi,'withdrawProtocolFees',[p0.address,dao]);
              }
            }
            await read(P5,rcAbi,'computeCurrentPriceRange');
            await read(P5,rcAbi,'computeCurrentVirtualBalances');
            await read(P5,rcAbi,'computeCurrentPoolCenteredness');
            for(const p0 of [P1,P2,P3,P6]){
              await send(w,infra,iabi,'observe',[p0]); // checkpoint read/re-accounting excluded from minimum count
              await read(infra,iabi,'isObservationWarm',[p0]);
            }
          }
          assert.ok(actionCount>=500,'Fewer than 500 qualifying non-configuration functional transactions');
          record(campaignLedger,{kind:'summary',actionCount,fixtureDeployments,fullPools,coverageStatus:'functional expansion; complete selector coverage separately measured'});
          console.log('Expanded functional campaign completed: '+actionCount+' qualifying actions across '+fullPools.length+' added pools.');
          
          await pub.request({method:'anvil_stopImpersonatingAccount',params:[dao]});
          const evidence={fullCampaignV1:{actionCount,fixtureDeployments,fullPools,coverageStatus:'functional expansion; exact exhaustive selector coverage not established'},chainId:8453,block:process.env.PINNED_BLOCK,blockHash:process.env.PINNED_HASH,sourceWorkspaceSha256:process.env.V21_WORKSPACE_SHA256,deployments:Object.keys(r.deployments),holder,dao,scenarios,receipts};
          fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/.source-zip-smoke/fork-evidence.json',JSON.stringify(evidence,(_,v)=>typeof v==='bigint'?v.toString():v,2)+'\n');
          console.log('V21 isolated Base fork qualification passed: 18 deployments, matched measured MEV runtime, two modes, native fee/cap/exemptions, maximum multiplication overflow, static floor, extreme threshold, zero combined cap, zero-surcharge activity/cache, and liquidity/swap callbacks.');
          JS
      - name: Preserve private fork qualification evidence
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
          SOURCE_STATUS: ${{ steps.source.outcome }}
          INSTALL_STATUS: ${{ steps.install.outcome }}
          COMPILE_STATUS: ${{ steps.compile.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .source-zip-smoke
          python3 - <<'PY'
          import os, json, pathlib, base64, gzip, hashlib
          d=pathlib.Path(".source-zip-smoke")
          project=pathlib.Path(os.environ["PROJECT_DIR"]) if os.environ.get("PROJECT_DIR") else None
          reports=sorted((project/"deployment-artifacts").glob("curveyield-dex-fresh-*.json")) if project else []
          def log(name):
              p=d/name
              return p.read_text(errors="replace")[-150000:] if p.exists() else None
          result=dict(sourceBlob=os.environ["SOURCE_BLOB"],sourceSha256=os.environ["SOURCE_SHA256"],sourceCommit=os.environ["SOURCE_COMMIT"],workspaceDeltaBlob=os.environ["WORKSPACE_DELTA_BLOB"],workspaceDeltaSha256=os.environ["WORKSPACE_DELTA_SHA256"],workspaceSha256=os.environ["WORKSPACE_SHA256"],originalV11ArchiveSha256=os.environ["ORIGINAL_V11_ARCHIVE_SHA256"],v12DeltaBlob=os.environ["V12_DELTA_BLOB"],v12DeltaSha256=os.environ["V12_DELTA_SHA256"],v12WorkspaceSha256=os.environ["V12_WORKSPACE_SHA256"],originalV12ArchiveSha256=os.environ["ORIGINAL_V12_ARCHIVE_SHA256"],v13DeltaBlob=os.environ["V13_DELTA_BLOB"],v13DeltaSha256=os.environ["V13_DELTA_SHA256"],v13WorkspaceSha256=os.environ["V13_WORKSPACE_SHA256"],originalV13ArchiveSha256=os.environ["ORIGINAL_V13_ARCHIVE_SHA256"],v14DeltaBlob=os.environ["V14_DELTA_BLOB"],v14DeltaSha256=os.environ["V14_DELTA_SHA256"],v14WorkspaceSha256=os.environ["V14_WORKSPACE_SHA256"],originalV14ArchiveSha256=os.environ["ORIGINAL_V14_ARCHIVE_SHA256"],v15DeltaBlob=os.environ["V15_DELTA_BLOB"],v15DeltaSha256=os.environ["V15_DELTA_SHA256"],v15WorkspaceSha256=os.environ["V15_WORKSPACE_SHA256"],originalV15ArchiveSha256=os.environ["ORIGINAL_V15_ARCHIVE_SHA256"],v16DeltaBlob=os.environ["V16_DELTA_BLOB"],v16DeltaSha256=os.environ["V16_DELTA_SHA256"],v16WorkspaceSha256=os.environ["V16_WORKSPACE_SHA256"],originalV16ArchiveSha256=os.environ["ORIGINAL_V16_ARCHIVE_SHA256"],v17DeltaBlob=os.environ["V17_DELTA_BLOB"],v17DeltaSha256=os.environ["V17_DELTA_SHA256"],v17WorkspaceSha256=os.environ["V17_WORKSPACE_SHA256"],originalV17ArchiveSha256=os.environ["ORIGINAL_V17_ARCHIVE_SHA256"],v18DeltaBlob=os.environ["V18_DELTA_BLOB"],v18DeltaSha256=os.environ["V18_DELTA_SHA256"],v18WorkspaceSha256=os.environ["V18_WORKSPACE_SHA256"],originalV18ArchiveSha256=os.environ["ORIGINAL_V18_ARCHIVE_SHA256"],v19DeltaBlob=os.environ["V19_DELTA_BLOB"],v19DeltaSha256=os.environ["V19_DELTA_SHA256"],v19WorkspaceSha256=os.environ["V19_WORKSPACE_SHA256"],originalV19ArchiveSha256=os.environ["ORIGINAL_V19_ARCHIVE_SHA256"],v20DeltaBlob=os.environ["V20_DELTA_BLOB"],v20DeltaSha256=os.environ["V20_DELTA_SHA256"],v20WorkspaceSha256=os.environ["V20_WORKSPACE_SHA256"],originalV20ArchiveSha256=os.environ["ORIGINAL_V20_ARCHIVE_SHA256"],v21DeltaBlob=os.environ["V21_DELTA_BLOB"],v21DeltaSha256=os.environ["V21_DELTA_SHA256"],v21WorkspaceSha256=os.environ["V21_WORKSPACE_SHA256"],originalV21ArchiveSha256=os.environ["ORIGINAL_V21_ARCHIVE_SHA256"],runId=os.environ["GITHUB_RUN_ID"],runAttempt=os.environ["GITHUB_RUN_ATTEMPT"],sourceStatus=os.environ["SOURCE_STATUS"],installStatus=os.environ["INSTALL_STATUS"],compileStatus=os.environ["COMPILE_STATUS"],installLog=log("install.log"),compileLog=log("compile.log"),forkLog=log("fork.log"),rpcPacingLog=log("rpc-pacing.log"),anvilLog=log("anvil.log"),forkEvidence=json.loads((d/"fork-evidence.json").read_text()) if (d/"fork-evidence.json").exists() else None,buildReport=json.loads(reports[-1].read_text()) if reports else None)
          for name in ["action-ledger.ndjson", "selector-ledger.ndjson"]:
              p=d/name
              if p.exists():
                  raw=p.read_bytes()
                  result[name]={"encoding":"gzip+base64","sha256":hashlib.sha256(raw).hexdigest(),"lines":len(raw.splitlines()),"data":base64.b64encode(gzip.compress(raw,compresslevel=6)).decode()}
          (d/"compile-evidence.json").write_text(json.dumps(result,indent=2)+"\n")
          PY
          target="campaigns/CurveYield_DEX_Simplified_Native_Fees_v21_full_fork_evidence_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.json"
          ref="development/dex-simplified-native-fees-v1"
          old="$(gh api "repos/curveyield3/Audit-Controller/contents/$target?ref=$ref" --jq .sha 2>/dev/null || true)"
          base64 -w0 .source-zip-smoke/compile-evidence.json > .source-zip-smoke/evidence.b64
          jq -n --arg branch "$ref" --arg old "$old" --arg msg "Record DEX v21 expanded fork evidence (run $GITHUB_RUN_ID)" --rawfile content .source-zip-smoke/evidence.b64 '{branch:$branch,message:$msg,content:$content} + (if $old=="" then {} else {sha:$old} end)' > .source-zip-smoke/upload.json
          gh api --method PUT "repos/curveyield3/Audit-Controller/contents/$target" --input .source-zip-smoke/upload.json --silent
          echo "Private evidence recorded. Source: $SOURCE_STATUS; install: $INSTALL_STATUS; compile: $COMPILE_STATUS"
