name: Nonce38 SDT Yearn vault deposit withdrawal redeposit simulation v37
on:
  push:
    branches: [cyvlsdt-v69-postdeploy-simulation-v1]
    paths: ['.github/workflows/lite-phase0-source-zip-smoke-v1.yml', 'github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json', 'github-native-sim/cyvlsdt-runtime-compare-v1/v69-postdeploy-suite-v1.cjs']
permissions:
  contents: read
  actions: read
jobs:
  fork-gas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPSTREAM_RPC: ${{ secrets.RPC_ETHEREUM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Simulate exact deposit proposal and subsequent exit and redeposit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPSTREAM_RPC"
          test "$(cast chain-id --rpc-url "$UPSTREAM_RPC")" = 1
          export FORK_BLOCK=$(cast block-number --rpc-url "$UPSTREAM_RPC")
          export FORK_HASH=$(cast block "$FORK_BLOCK" --field hash --rpc-url "$UPSTREAM_RPC")
          anvil --fork-url "$UPSTREAM_RPC" --fork-block-number "$FORK_BLOCK" --chain-id 1 --host 127.0.0.1 --port 8545 --silent >/tmp/anvil.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          npm install --prefix /tmp/replay37 --ignore-scripts --no-audit --no-fund --no-save ethers@6.17.0
          cd /tmp/replay37
          node <<'JS'
          const E=require('ethers'),assert=require('assert/strict');
          const SAFE=E.getAddress('0x47623c62f281807d615eeb4a2ceee9d97f9d3c49'),OWNER=E.getAddress('0x9f2b20a772246960810045905b7daccf960ee288'),MULTI=E.getAddress('0xa238cbeb142c10ef7ad8442c6d1f9e89e07e7761'),Z=E.ZeroAddress;
          const SDT=E.getAddress('0x73968b9a57c6e53d41345fd57a6e6ae27d6cdb2f'),VAULT=E.getAddress('0x2d9cc96463a0f21e9836cdb060226d033ec97c22'),STRAT=E.getAddress('0x458f089aa290210fbd1118001c4c3ae8ea611544'),LP=E.getAddress('0xa19bf6fbf05624282cb6ed498f4761f22e084edd'),YEARN=E.getAddress('0x0df3604071c080edd761c4bb19e5dc909df5c8f2'),GUARD=E.getAddress('0xab989d9daa0279e123d453204545be556f2d3072');
          const p=new E.JsonRpcProvider('http://127.0.0.1:8545',1,{staticNetwork:true,cacheTimeout:-1});
          const si=new E.Interface(['function nonce() view returns(uint256)','function getThreshold() view returns(uint256)','function getOwners() view returns(address[])','function getTransactionHash(address,uint256,bytes,uint8,uint256,uint256,uint256,address,address,uint256) view returns(bytes32)','function execTransaction(address,uint256,bytes,uint8,uint256,uint256,uint256,address,address,bytes) payable returns(bool)']);
          const ei=new E.Interface(['function balanceOf(address) view returns(uint256)','function allowance(address,address) view returns(uint256)','function approve(address,uint256) returns(bool)','function totalSupply() view returns(uint256)']);
          const vi=new E.Interface(['function name() view returns(string)','function symbol() view returns(string)','function asset() view returns(address)','function strategy() view returns(address)','function balanceOf(address) view returns(uint256)','function totalAssets() view returns(uint256)','function totalSupply() view returns(uint256)','function depositFeeBps() view returns(uint256)','function withdrawalFeeBps() view returns(uint256)','function maxWithdraw(address) view returns(uint256)','function maxRedeem(address) view returns(uint256)','function previewRedeem(uint256) view returns(uint256)','function deposit(uint256,address) returns(uint256)','function redeem(uint256,address,address) returns(uint256)']);
          const sti=new E.Interface(['function vault() view returns(address)','function yearn() view returns(address)','function curve() view returns(address)','function curveLiquidityGuard() view returns(address)','function totalCurveLp() view returns(uint256)','function balanceOf() view returns(uint256)','event Invested(uint256 sdtIn,uint256 curveLpOut,uint256 yearnSharesOut)','event Withdrawn(uint256 grossSDT,uint256 lpBurned,uint256 yearnSharesBurned)','event InvestmentDeferred(uint8 reason)']);
          const yi=new E.Interface(['function token() view returns(address)','function balanceOf(address) view returns(uint256)','function pricePerShare() view returns(uint256)','function name() view returns(string)']);
          const safe=new E.Contract(SAFE,si,p),sdt=new E.Contract(SDT,ei,p),v=new E.Contract(VAULT,vi,p),st=new E.Contract(STRAT,sti,p),lp=new E.Contract(LP,ei,p),y=new E.Contract(YEARN,yi,p),mi=new E.Interface(['function multiSend(bytes)']);
          const J=x=>JSON.stringify(x,(_,v)=>typeof v==='bigint'?v.toString():v);
          const args=d=>[MULTI,0n,d,1,0n,0n,0n,Z,Z],sig=E.concat([E.zeroPadValue(OWNER,32),E.ZeroHash,'0x01']);
          const call=(to,data)=>E.solidityPacked(['uint8','address','uint256','uint256','bytes'],[0,to,0,E.dataLength(data),data]);
          const batch=c=>mi.encodeFunctionData('multiSend',[E.concat(c)]);
          const deposit=a=>batch([call(SDT,ei.encodeFunctionData('approve',[VAULT,a])),call(VAULT,vi.encodeFunctionData('deposit',[a,SAFE]))]);
          const redeem=a=>batch([call(VAULT,vi.encodeFunctionData('redeem',[a,SAFE,SAFE]))]);
          async function state(){return {safeSDT:await sdt.balanceOf(SAFE),safeShares:await v.balanceOf(SAFE),vaultAssets:await v.totalAssets(),vaultSupply:await v.totalSupply(),vaultSDT:await sdt.balanceOf(VAULT),strategySDT:await sdt.balanceOf(STRAT),strategyLp:await lp.balanceOf(STRAT),strategyYearn:await y.balanceOf(STRAT),strategyLpTotal:await st.totalCurveLp(),strategyNAV:await st.balanceOf(),pps:await y.pricePerShare(),allowance:await sdt.allowance(SAFE,VAULT)};}
          async function main(){
            const b=await p.getBlock(Number(process.env.FORK_BLOCK));assert.equal(await p.send('eth_chainId',[]),'0x1');assert.equal(b.hash.toLowerCase(),process.env.FORK_HASH.trim().toLowerCase());
            assert.equal(await safe.nonce(),38n);assert.equal(await safe.getThreshold(),1n);assert((await safe.getOwners()).includes(OWNER));assert.equal(await v.asset(),SDT);assert.equal(await v.strategy(),STRAT);assert.equal(await st.vault(),VAULT);assert.equal(await st.yearn(),YEARN);assert.equal(await st.curve(),LP);assert.equal(await st.curveLiquidityGuard(),GUARD);assert.equal(await y.token(),LP);
            await p.send('anvil_impersonateAccount',[OWNER]);await p.send('anvil_setBalance',[OWNER,E.toQuantity(100n*10n**18n)]);
            const w=safe.connect(await p.getSigner(OWNER)),gasLimit=16777216n;
            async function exec(label,data){const before=await state(),nonce=await safe.nonce(),hash=await safe.getTransactionHash(...args(data),nonce);const gas=await w.execTransaction.estimateGas(...args(data),sig,{gasLimit});assert(await w.execTransaction.staticCall(...args(data),sig,{gasLimit}));const rec=await(await w.execTransaction(...args(data),sig,{gasLimit})).wait();assert.equal(rec.status,1);assert.equal(await safe.nonce(),nonce+1n);const after=await state(),events=[];for(const l of rec.logs){if(l.address.toLowerCase()===STRAT.toLowerCase()){try{const e=sti.parseLog(l);if(e)events.push({name:e.name,args:Array.from(e.args)});}catch{}}}console.log('SDT38_STEP '+J({label,nonce,hash,gasEstimate:gas,gasUsed:rec.gasUsed,before,after,events,receipt:rec.hash}));return {before,after,events,hash};}
            const initial=await state(),amount=initial.safeSDT;assert(amount>0n);assert.equal(initial.safeShares,0n);const data=deposit(amount),hash=await safe.getTransactionHash(...args(data),38n);
            console.log('SDT38_PLAN '+J({block:b.number,blockHash:b.hash,amount,hash,data,to:MULTI,nonce:38,depositFeeBps:await v.depositFeeBps(),withdrawalFeeBps:await v.withdrawalFeeBps(),vaultName:await v.name(),vaultSymbol:await v.symbol(),yearnName:await y.name(),yearn:YEARN,lp:LP,strategy:STRAT}));
            const a=await exec('deposit_all_safe_SDT',data);assert.equal(a.after.safeSDT,0n);assert(a.after.safeShares>0n);assert(a.after.strategyYearn>a.before.strategyYearn,'Yearn allocation not completed');assert(a.events.some(e=>e.name==='Invested'&&e.args[2]>0n));assert.equal(a.after.allowance,0n);
            const half=a.after.safeShares/2n;assert(half>0n);const c=await exec('redeem_half',redeem(half));assert.equal(c.after.safeShares,a.after.safeShares-half);assert(c.after.safeSDT>0n);assert(c.after.strategyYearn<c.before.strategyYearn);
            const d=await exec('redeposit_half_proceeds',deposit(c.after.safeSDT));assert.equal(d.after.safeSDT,0n);assert(d.after.safeShares>c.after.safeShares);assert(d.after.strategyYearn>d.before.strategyYearn);
            const e=await exec('redeem_entire_safe_position',redeem(d.after.safeShares));assert.equal(e.after.safeShares,0n);assert(e.after.safeSDT>0n);assert(e.after.strategyYearn<e.before.strategyYearn);
            const g=await exec('redeposit_all_recovered_SDT',deposit(e.after.safeSDT));assert.equal(g.after.safeSDT,0n);assert(g.after.safeShares>0n);assert(g.after.strategyYearn>g.before.strategyYearn);
            console.log('SDT38_PASS '+J({hash,amount,initialShares:a.after.safeShares,initialYearnShares:a.after.strategyYearn-a.before.strategyYearn,halfRedeemSDT:c.after.safeSDT,fullRedeemSDT:e.after.safeSDT,finalShares:g.after.safeShares,initialState:initial,finalState:g.after}));
          }
          main().catch(e=>{console.error(e);process.exitCode=1});
          JS
