          node -e 'const p=require("./node_modules/@openzeppelin/contracts/package.json"); if(p.version!=="5.4.0") process.exit(1); console.log("Resolved OpenZeppelin:",p.version)' >> "$GITHUB_WORKSPACE/.source-zip-smoke/install.log"
