name: cyvlSDT v64 exact Safe batch live fork gas
on:
  push:
    branches: [cyvlsdt-v64-safe-gas-fork-v1]
    paths: ['github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fork-gas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Replay exact queued Safe nonces on local fork
        shell: bash
        env:
          UPSTREAM_RPC: ${{ secrets.RPC_ETHEREUM }}
        run: |
          set -euo pipefail
          test -n "$UPSTREAM_RPC"
          BLOCK=$(cast block-number --rpc-url "$UPSTREAM_RPC")
          echo "FORK_BLOCK=$BLOCK"
          anvil --fork-url "$UPSTREAM_RPC" --fork-block-number "$BLOCK" --host 127.0.0.1 --port 8545 --silent >anvil.log 2>&1 &
          ANVIL_PID=$!
          trap 'kill "$ANVIL_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          cast chain-id --rpc-url http://127.0.0.1:8545
          cp 'github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json' /tmp/queued-safe.json
          python3 -u - <<'PY'
          import json, urllib.request, time, subprocess, os
          stages=json.load(open('/tmp/queued-safe.json'))
          owner='0x9f2B20A772246960810045905B7daccf960eE288'
          safe=stages[0]['safe']
          url='http://127.0.0.1:8545'
          def rpc(method,params=[]):
              req=urllib.request.Request(url,json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode(),{'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=240) as response: r=json.load(response)
              if 'error' in r: raise RuntimeError(method+' '+json.dumps(r['error'])[:1500])
              return r['result']
          def word(x):
              return (int(x,16) if isinstance(x,str) and x.startswith('0x') else int(x)).to_bytes(32,'big').hex()
          def dyn(x):
              x=x.removeprefix('0x')
              return word(len(x)//2)+x+'0'*((-len(x))%64)
          def selector(s): return subprocess.check_output(['cast','sig',s],text=True).strip()
          def call(data): return rpc('eth_call',[{'to':safe,'data':data},'latest'])
          nonce=lambda:int(call(selector('nonce()')),16)
          assert int(call(selector('getThreshold()')),16)==1
          owners=call(selector('getOwners()')).lower()
          assert owner[2:].lower() in owners
          assert nonce()==34, f'Unexpected starting nonce {nonce()}'
          assert rpc('eth_chainId')=='0x1'
          rpc('anvil_impersonateAccount',[owner])
          if int(rpc('eth_getBalance',[owner,'latest']),16)<10**18: rpc('anvil_setBalance',[owner,hex(100*10**18)])
          sig=word(owner)+word(0)+'01'
          hashsel=selector('getTransactionHash(address,uint256,bytes,uint8,uint256,uint256,uint256,address,address,uint256)')
          execsel=selector('execTransaction(address,uint256,bytes,uint8,uint256,uint256,uint256,address,address,bytes)')
          results=[]
          for s in stages:
              assert nonce()==s['nonce']
              assert s['operation']==1 and s['safe'].lower()==safe.lower()
              data=dyn(s['data'])
              fields=[s['to'],s['value'],320,s['operation'],s['safeTxGas'],s['baseGas'],s['gasPrice'],s['gasToken'],s['refundReceiver']]
              expected=call(hashsel+''.join(map(word,fields+[s['nonce']]))+data)
              assert expected.lower()==s['safeTxHash'].lower(),(expected,s['safeTxHash'])
              txdata=execsel+''.join(map(word,fields+[320+len(data)//2]))+data+dyn(sig)
              tx={'from':owner,'to':safe,'data':txdata,'gas':hex(16777216),'value':'0x0'}
              print('REPLAY_START',s['nonce'],s['safeTxHash'],flush=True)
              try:
                  estimate=rpc('eth_estimateGas',[tx])
                  print('ESTIMATE',s['nonce'],int(estimate,16),flush=True)
              except Exception as e: print('ESTIMATE_ERROR',s['nonce'],str(e),flush=True)
              try:
                  check=rpc('eth_call',[tx,'latest'])
                  assert int(check,16)==1, 'Safe returned false'
              except Exception as e:
                  print('REPLAY_PREFLIGHT_FAILED',s['nonce'],str(e),flush=True)
                  raise
              h=rpc('eth_sendTransaction',[tx])
              receipt=None
              for _ in range(60):
                  receipt=rpc('eth_getTransactionReceipt',[h])
                  if receipt: break
                  time.sleep(1)
              assert receipt
              result={'nonce':s['nonce'],'safeTxHash':s['safeTxHash'],'forkTxHash':h,'gasUsed':int(receipt['gasUsed'],16),'status':int(receipt['status'],16),'safeNonceAfter':nonce()}
              print('FORK_RECEIPT',json.dumps(result),flush=True)
              results.append(result)
              assert result['status']==1 and result['safeNonceAfter']==s['nonce']+1
          print('FORK_GAS_COMPLETE',json.dumps(results),flush=True)
          PY
