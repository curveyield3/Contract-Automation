name: Actual cyvlSDT share oracle Safe batch fork v2
on:
  push:
    branches: [cyvlsdt-v69-postdeploy-simulation-v1]
    paths: ['.github/workflows/lite-phase0-source-zip-smoke-v1.yml', 'github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json', 'github-native-sim/cyvlsdt-runtime-compare-v1/v69-postdeploy-suite-v1.cjs']
permissions:
  contents: read
jobs:
  fork-gas:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FOUNDRY_OPTIMIZER_RUNS: '25'
      UPSTREAM_RPC: ${{ secrets.RPC_ETHEREUM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Materialize exact v64 source and benchmark-only optimization candidate
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/curveyield3/Smart-Contracts/6b058498554f58936daf1216c222d554ee666f5e/Audit-Intake/CurveYield-cyvlSDT-Deployment-Package-v64.zip' -o /tmp/cyv64.zip
          echo 'a2d46ab6bf63a760efecf914f36419b8ec271c0e36f9b3ee9821cd842ea0d7ee  /tmp/cyv64.zip' | sha256sum -c -
          mkdir -p /tmp/cyv64 /tmp/cyv65
          unzip -q /tmp/cyv64.zip -d /tmp/cyv64
          cp -a /tmp/cyv64/contracts /tmp/cyv65/
          mkdir -p /tmp/cyv-deps
          npm install --prefix /tmp/cyv-deps --ignore-scripts --no-audit --no-fund --no-save '@openzeppelin/contracts@5.4.0' '@openzeppelin-4/contracts@npm:@openzeppelin/contracts@4.9.6' '@openzeppelin/contracts-upgradeable@4.9.6' 'ethers@6.17.0'
          ln -s /tmp/cyv-deps/node_modules /tmp/cyv64/node_modules
          ln -s /tmp/cyv-deps/node_modules /tmp/cyv65/node_modules
          for ROOT in /tmp/cyv64 /tmp/cyv65; do
            rm -f "$ROOT/contracts/PoL_Manager_Contract_v22.sol" "$ROOT/contracts/VoteMarketSingleGaugeBribeAllocator.sol"
            rm -rf "$ROOT/contracts/external_guard_v8"
            cat > "$ROOT/foundry.toml" <<'EOF'
          [profile.default]
          src = "contracts"
          out = "out"
          libs = ["node_modules"]
          remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/", "@openzeppelin-4/contracts/=node_modules/@openzeppelin-4/contracts/", "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/"]
          solc_version = "0.8.28"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          evm_version = "cancun"
          EOF
          done
          python3 - <<'PY'
          import json,pathlib
          p=json.loads(pathlib.Path('github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json').read_text())
          exec(compile(p['transform'],'v65-transform','exec'))
          exec(compile(p['unifiedTransform'],'v66-transform','exec'))
          exec(compile(p['packingTransform'],'v67-transform','exec'))
          PY
      - name: Compile pinned original proposal artifacts and updated vault and SDT strategy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v72-report
          FOUNDRY_OUT=out-25-v69 forge build --root /tmp/cyv65 --force --skip test --skip script
          python3 - <<'PY'
          import json,pathlib,re,difflib
          p=json.loads(pathlib.Path('github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json').read_text())
          exec(compile(p['vaultEmergencyCapabilityPatch'],'v70-vault-capability','exec'))
          exec(compile(p['vaultMintAllowancePatch'],'v71-mint-allowance','exec'))
          f=pathlib.Path('/tmp/cyv65/contracts/StrategyCurveSDTYearnRebindable.sol')
          before=f.read_text()
          after,n=re.subn(r'(\bCURVE_LP_SLIPPAGE_BPS\s*=\s*)200\b',r'\g<1>100',before)
          assert n==1,('expected exactly one 200 bps SDT slippage constant',n)
          assert re.search(r'quoteDeposit\s*\([^;]*CURVE_LP_SLIPPAGE_BPS',after)
          assert re.search(r'quoteWithdraw\s*\([^;]*CURVE_LP_SLIPPAGE_BPS',after)
          f.write_text(after)
          diff=''.join(difflib.unified_diff(before.splitlines(keepends=True),after.splitlines(keepends=True),fromfile='v71/'+f.name,tofile='v72/'+f.name))
          print('SDT_SLIPPAGE_SOURCE_DIFF\n'+diff,flush=True)
          out=pathlib.Path('/tmp/v72-report')
          (out/'StrategyCurveSDTYearnRebindable-v72.sol').write_text(after)
          (out/'SDT-slippage-diff-v1.patch').write_text(diff)
          (out/'BeefyVaultCurveYieldV8cyvlSDT-v71.sol').write_text(pathlib.Path('/tmp/cyv65/contracts/BeefyVaultCurveYieldV8cyvlSDT.sol').read_text())
          pathlib.Path('/tmp/cyv64/replay.cjs').write_text(p['replay'])
          PY
          FOUNDRY_OUT=out-25-v72 forge build --root /tmp/cyv65 --force --skip test --skip script
          python3 - <<'PY'
          import pathlib,json
          root=pathlib.Path('/tmp/cyv65')
          report={}
          for name in ['BeefyVaultCurveYieldV8cyvlSDT','StrategyCurveSDTYearnRebindable']:
              a=json.loads((root/'out-25-v69'/(name+'.sol')/(name+'.json')).read_text())
              b=json.loads((root/'out-25-v72'/(name+'.sol')/(name+'.json')).read_text())
              sizes=lambda v:{k:len(bytes.fromhex(v[k]['object'].removeprefix('0x'))) for k in ['bytecode','deployedBytecode']}
              report[name]={'before':sizes(a),'after':sizes(b)}
              assert report[name]['after']['deployedBytecode']<=24576
          pathlib.Path('/tmp/v72-report/Compiled-size-v72.json').write_text(json.dumps(report,indent=2))
          print('COMPILED_SIZE_V72',json.dumps(report))
          PY
      - name: Compile pinned share oracle adapter
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/curveyield3/Smart-Contracts/60354e796ce4ed088981187a1493110fe48b0194/cyvlSDT/contracts/CurveYieldSDTShareOracle.sol' -o /tmp/cyv65/contracts/CurveYieldSDTShareOracle.sol
          FOUNDRY_OUT=out-25-oracle forge build --root /tmp/cyv65 --skip test --skip script /tmp/cyv65/contracts/CurveYieldSDTShareOracle.sol
          cp /tmp/cyv65/contracts/CurveYieldSDTShareOracle.sol /tmp/v72-report/
          cp /tmp/cyv65/out-25-oracle/CurveYieldSDTShareOracle.sol/CurveYieldSDTShareOracle.json /tmp/v72-report/CurveYieldSDTShareOracle-v1-artifact.json
      - name: Replay exact queued Safe payloads and oracle batch
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPSTREAM_RPC"
          export FORK_BLOCK=26484022
          anvil --fork-url "$UPSTREAM_RPC" --fork-block-number "$FORK_BLOCK" --host 127.0.0.1 --port 8545 --silent >/tmp/anvil.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import pathlib
          f=pathlib.Path('/tmp/cyv64/replay.cjs')
          s=f.read_text()
          old=' await post.run(p,A,SAFE,EOA,artifactForSuite,current,POL);'
          assert s.count(old)==1
          experiment=" const W=10n**18n, q=W/1000n, lower=x=>x.toLowerCase();\n const faddr='0x6a8cbed756804b16e05e741edabd5cb544ae21bf';\n const erc=['function balanceOf(address) view returns(uint256)','function approve(address,uint256) returns(bool)','function transfer(address,uint256) returns(bool)','function decimals() view returns(uint8)'];\n const tokens=[SDT,A.token,A.rvault];\n await p.send('anvil_impersonateAccount',[SAFE]);await p.send('anvil_setBalance',[SAFE,E.toQuantity(100n*W)]);\n const ss=await p.getSigner(SAFE),tc=tokens.map(x=>new E.Contract(x,erc,ss));\n const vault=new E.Contract(A.rvault,[...erc,'function deposit(uint256,address) returns(uint256)','function asset() view returns(address)','function totalAssets() view returns(uint256)','function totalSupply() view returns(uint256)','function convertToAssets(uint256) view returns(uint256)'],ss);\n const locker=new E.Contract(A.locker,artifactForSuite(current,contracts.locker).abi,ss);\n const f=new E.Contract(faddr,['function deploy_plain_pool(string,string,address[],uint256,uint256,uint256,uint256,uint256,uint8[],bytes4[],address[]) returns(address)','function pool_count() view returns(uint256)','function pool_list(uint256) view returns(address)','function pool_implementations(uint256) view returns(address)','function get_implementation_address(address) view returns(address)','function get_pool_asset_types(address) view returns(uint8[])'],ss);\n const evidence={forkBlock:Number(process.env.FORK_BLOCK),tokens,addresses:A,observations:[],transactions:[],swaps:[]};\n const save=()=>fs.writeFileSync(output+'/cyvlSDT-curve-oracle-v1.json',J(evidence));\n let poolAddress;\n async function balances(){const accounts=[SAFE,A.rvault,A.revenue,A.locker,A.staking,POL,...(poolAddress?[poolAddress]:[])];return Promise.all(tokens.map(async(token,i)=>({token,balances:await Promise.all(accounts.map(async account=>({account,balance:await tc[i].balanceOf(account)})))})))}\n async function tx(label,send){const before=await balances();const r=await (await send()).wait();assert.equal(r.status,1);const after=await balances();const row={label,hash:r.hash,gas:r.gasUsed,before,after};evidence.transactions.push(row);save();log('POOL_ACTION',{label,hash:r.hash,gas:r.gasUsed});return r}\n assert.equal(lower(await vault.asset()),lower(A.token));for(const t of tc)assert.equal(await t.decimals(),18n);\n assert(await tc[0].balanceOf(SAFE)>=21n*W,'Safe SDT funding');\n await tx('approve SDT locker',()=>tc[0].approve(A.locker,20n*W));\n await tx('lock 20 SDT',()=>locker.deposit(20n*W,SAFE,{gasLimit:6000000}));\n await tx('approve 10 cyvlSDT to vault',()=>tc[1].approve(A.rvault,10n*W));\n await tx('deposit 10 cyvlSDT',()=>vault.deposit(10n*W,SAFE,{gasLimit:6000000}));\n const count=await f.pool_count(),impl=await f.pool_implementations(0);\n const params=['CurveYield SDT cyvlSDT cyvlSDTav','cySDT-3',tokens,500n,20000000n,25000000000n,300n,0n,[0,0,3],['0x00000000','0x00000000','0x00000000'],[E.ZeroAddress,E.ZeroAddress,E.ZeroAddress]];\n await tx('create specified StableSwap NG pool',()=>f.deploy_plain_pool(...params,{gasLimit:10000000}));\n assert.equal(await f.pool_count(),count+1n);poolAddress=await f.pool_list(count);\n const pool=new E.Contract(poolAddress,['function add_liquidity(uint256[],uint256) returns(uint256)','function exchange(int128,int128,uint256,uint256) returns(uint256)','function coins(uint256) view returns(address)','function stored_rates() view returns(uint256[])','function price_oracle(uint256) view returns(uint256)','function get_p(uint256) view returns(uint256)','function get_dy(int128,int128,uint256) view returns(uint256)','function A() view returns(uint256)','function fee() view returns(uint256)','function offpeg_fee_multiplier() view returns(uint256)','function ma_exp_time() view returns(uint256)','function balances(uint256) view returns(uint256)'],ss);\n assert.equal(lower(await f.get_implementation_address(poolAddress)),lower(impl));assert.deepEqual(Array.from(await f.get_pool_asset_types(poolAddress)),[0n,0n,3n]);for(let i=0;i<3;i++)assert.equal(lower(await pool.coins(i)),lower(tokens[i]));\n assert.equal(await pool.A(),500n);assert.equal(await pool.fee(),20000000n);assert.equal(await pool.offpeg_fee_multiplier(),25000000000n);\n evidence.pool=poolAddress;evidence.implementation=impl;evidence.config={params,maExpTime:await pool.ma_exp_time()};save();log('ACTUAL_POOL_CONFIG',{pool:poolAddress,...evidence.config});\n for(let i=0;i<3;i++){assert(await tc[i].balanceOf(SAFE)>=W);await tx('approve seed token '+i,()=>tc[i].approve(poolAddress,E.MaxUint256));}\n await tx('seed one unit of each coin',()=>pool.add_liquidity([W,W,W],1n,{gasLimit:6000000}));\n // Simulate the oracle deployment and route-registration component of the second new proposal.\n // The first new proposal (PoL and pool creation) is not yet queued; the nonce here is fork-only.\n const oracleArtifact=JSON.parse(fs.readFileSync(output+'/CurveYieldSDTShareOracle-v1-artifact.json'));\n const oracleIface=new E.Interface(oracleArtifact.abi);\n const oracleInit=E.concat([oracleArtifact.bytecode.object,oracleIface.encodeDeploy([poolAddress,...tokens])]);\n const oracleAddress=E.getCreateAddress({from:SAFE,nonce:await p.getTransactionCount(SAFE,'latest')});\n const createHelper=deployments[0].to;\n const oracleDeployment={op:1,to:createHelper,value:0n,data:ci.encodeFunctionData('performCreate',[0n,oracleInit]),label:'Deploy immutable CurveYieldSDTShareOracle'};\n const oracleSelector=E.id('price_oracle(uint256)').slice(0,10);\n const routeSpecs=[];\n for(let i=0;i<3;i++)for(let k=0;k<3;k++)if(i!==k){\n  const pair=i===0||k===0?(i===2||k===2?1:0):2;\n  const invert=i<k;\n  const reader=pair===0?poolAddress:oracleAddress;\n  const hop=[7,tokens[k],poolAddress,E.ZeroHash,ac.encode(['uint8','uint8'],[i,k]),[reader,oracleSelector,ac.encode(['uint256'],[pair]),invert,18]];\n  assert.equal(await router.routeLength(tokens[i],tokens[k]),0n,'existing route would be overwritten');\n  routeSpecs.push({i,j:k,pair,invert,reader,hop,call:call(ROUTER,ri,'setRouteConfig',[tokens[i],tokens[k],[hop],fee,150], 'Register route '+i+'->'+k)});\n }\n const adapterBatch=[oracleDeployment,...routeSpecs.map(x=>x.call)];\n const adapterArgs=safeArgs(adapterBatch),adapterNonce=await safe.nonce(),adapterEstimate=await safe.execTransaction.estimateGas(...adapterArgs,{gasLimit:cap});\n assert(await safe.execTransaction.staticCall(...adapterArgs,{gasLimit:cap}));\n const adapterHash=await safe.getTransactionHash(...adapterArgs.slice(0,9),adapterNonce);\n const adapterReceipt=await(await safe.execTransaction(...adapterArgs,{gasLimit:cap})).wait();assert.equal(adapterReceipt.status,1);\n assert.notEqual(await p.getCode(oracleAddress),'0x');assert.equal(await safe.nonce(),adapterNonce+1n);\n const oracle=new E.Contract(oracleAddress,oracleArtifact.abi,p);\n assert.equal(lower(await oracle.pool()),lower(poolAddress));assert.equal(lower(await oracle.vault()),lower(A.rvault));\n evidence.oracle={address:oracleAddress,sourceCommit:'60354e796ce4ed088981187a1493110fe48b0194',runtimeBytes:E.dataLength(await p.getCode(oracleAddress)),creationBytes:E.dataLength(oracleArtifact.bytecode.object),batchGasEstimate:adapterEstimate,batchGasUsed:adapterReceipt.gasUsed,forkNonce:adapterNonce,forkSafeTxHash:adapterHash,routeSpecs};\n const proposalComponent={status:'fork-simulated component only; rebind actual pool and predict Safe CREATE address after preceding proposal executes; not a live queued proposal',oracleConstructor:[poolAddress,...tokens],safe:SAFE,to:MULTI,value:'0',operation:1,nonce:adapterNonce,data:adapterArgs[2],safeTxHash:adapterHash,calls:adapterBatch,routeSpecs};\n fs.writeFileSync(output+'/Oracle-proposal-component-v1.json',J(proposalComponent));\n save();log('ORACLE_BATCH_VERIFIED',{address:oracleAddress,gas:adapterReceipt.gasUsed,estimate:adapterEstimate,creationBytes:E.dataLength(oracleArtifact.bytecode.object),runtimeBytes:E.dataLength(await p.getCode(oracleAddress)),nonce:adapterNonce,hash:adapterHash,routes:routeSpecs.map(x=>({i:x.i,j:x.j,pair:x.pair,invert:x.invert,reader:x.reader}))});\n async function read(label){\n  const rate=await vault.convertToAssets(W),rates=Array.from(await pool.stored_rates()),ema=[await pool.price_oracle(0),await pool.price_oracle(1)],spot=[await pool.get_p(0),await pool.get_p(1)];\n  let index2;try{index2={value:await pool.price_oracle(2)}}catch(e){index2={reverted:true,message:e.shortMessage}};\n  const normalized=[W,...ema],adjusted=normalized.map((x,i)=>x*rates[i]/rates[0]);\n  const pairs=[];for(let i=0;i<3;i++)for(let k=0;k<3;k++)if(i!==k)pairs.push({i,j:k,amount:q,quote:await pool.get_dy(i,k,q),rawPrediction:q*normalized[i]/normalized[k],adjustedPrediction:q*adjusted[i]/adjusted[k]});\n  const adapterRates=await Promise.all([0,1,2].map(i=>oracle.price_oracle(i)));\n  assert.equal(adapterRates[0],ema[0]);assert.equal(adapterRates[1],ema[1]*rate/W);assert.equal(adapterRates[2],ema[1]*rate/ema[0]);\n  const routerRates=[];\n  for(const spec of routeSpecs){\n   const observed=await router.price_oracle(tokens[spec.i],tokens[spec.j]);\n   const expected=spec.invert?W*W/adapterRates[spec.pair]:adapterRates[spec.pair];\n   assert.equal(observed,expected);\n   const rc=await router.routeConfig(tokens[spec.i],tokens[spec.j]);assert(rc[2]);assert.equal(rc[0],fee);assert.equal(rc[1],150n);\n   routerRates.push({i:spec.i,j:spec.j,observed,expected,guardedMinOut:await router.guardedMinOut(tokens[spec.i],tokens[spec.j],q)});\n  }\n  const row={label,block:await p.getBlockNumber(),rate,rates,ema,spot,index2,adapterRates,routerRates,totalAssets:await vault.totalAssets(),totalSupply:await vault.totalSupply(),poolBalances:await Promise.all([0,1,2].map(i=>pool.balances(i))),pairs};evidence.observations.push(row);save();log('ACTUAL_POOL_ORACLE',row);return row;\n }\n async function swaps(label){for(let i=0;i<3;i++)for(let k=0;k<3;k++)if(i!==k){\n  const snap=await p.send('evm_snapshot',[]),quote=await pool.get_dy(i,k,q),b=await Promise.all([tc[i].balanceOf(SAFE),tc[k].balanceOf(SAFE),tc[i].balanceOf(poolAddress),tc[k].balanceOf(poolAddress)]);\n  const r=await (await pool.exchange(i,k,q,quote*999n/1000n,{gasLimit:2000000})).wait();\n  const z=await Promise.all([tc[i].balanceOf(SAFE),tc[k].balanceOf(SAFE),tc[i].balanceOf(poolAddress),tc[k].balanceOf(poolAddress)]);\n  const row={label,i,j:k,quote,hash:r.hash,before:b,after:z,actualInput:b[0]-z[0],actualOutput:z[1]-b[1],poolInput:z[2]-b[2],poolOutput:b[3]-z[3]};assert.equal(r.status,1);assert.equal(row.actualInput,q);assert.equal(row.poolInput,q);assert.equal(row.poolOutput,row.actualOutput);assert(row.actualOutput>=quote*999n/1000n);evidence.swaps.push(row);save();log('ACTUAL_POOL_SWAP',row);assert(await p.send('evm_revert',[snap]));\n }}\n const before=await read('baseline');await swaps('baseline');\n const donation=before.totalAssets/10n;assert(donation>0n);assert(await tc[1].balanceOf(SAFE)>=donation+q);\n await tx('donate cyvlSDT to actual revenue vault to increase assets by 10 percent',()=>tc[1].transfer(A.rvault,donation));\n const after=await read('after vault appreciation before pool interaction');\n assert.equal(after.totalSupply,before.totalSupply);assert(after.rate*1000n/before.rate>=1099n&&after.rate*1000n/before.rate<=1101n,'actual vault share rate did not increase 10 percent');\n await swaps('appreciated');\n await tx('small pool exchange to update EMA observation',()=>pool.exchange(0,1,q,1n,{gasLimit:2000000}));\n await p.send('evm_increaseTime',[1800]);await p.send('evm_mine',[]);\n const settled=await read('after EMA settling');await swaps('settled');\n evidence.complete=true;save();log('ACTUAL_POOL_COMPLETE',{pool:poolAddress,rateBefore:before.rate,rateAfter:after.rate,observations:evidence.observations.length,swaps:evidence.swaps.length});\n"
          f.write_text(s.replace(old,experiment))
          PY
          node /tmp/cyv64/replay.cjs
      - name: Retain verified proposal payload and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CurveYield-cyvlSDT-Curve-oracle-fork-v2
          path: /tmp/v72-report/
          if-no-files-found: error
