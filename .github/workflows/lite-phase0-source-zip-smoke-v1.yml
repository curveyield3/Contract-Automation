          gh api "repos/curveyield3/Audit-Controller/git/blobs/$WORKSPACE_DELTA_BLOB" --jq .content | base64 --decode > .source-zip-smoke/workspace.delta
          echo "$WORKSPACE_DELTA_SHA256  .source-zip-smoke/workspace.delta" | sha256sum -c
          gh api "repos/curveyield3/Audit-Controller/git/blobs/$V12_DELTA_BLOB" --jq .content | base64 --decode > .source-zip-smoke/workspace-v12.delta
          echo "$V12_DELTA_SHA256  .source-zip-smoke/workspace-v12.delta" | sha256sum -c
          gh api "repos/curveyield3/Audit-Controller/git/blobs/$V13_DELTA_BLOB" --jq .content | base64 --decode > .source-zip-smoke/workspace-v13.delta
          echo "$V13_DELTA_SHA256  .source-zip-smoke/workspace-v13.delta" | sha256sum -c
