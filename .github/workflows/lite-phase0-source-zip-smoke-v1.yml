name: Header-amended Safe proposal 35 and 36 redistribution v5
on:
  push:
    branches: [cyvlsdt-v69-postdeploy-simulation-v1]
    paths: ['.github/workflows/lite-phase0-source-zip-smoke-v1.yml', 'github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json', 'github-native-sim/cyvlsdt-runtime-compare-v1/v69-postdeploy-suite-v1.cjs']
permissions:
  contents: read
  actions: read
jobs:
  fork-gas:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FOUNDRY_OPTIMIZER_RUNS: '25'
      UPSTREAM_RPC: ${{ secrets.RPC_ETHEREUM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Materialize exact v64 source and benchmark-only optimization candidate
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/curveyield3/Smart-Contracts/6b058498554f58936daf1216c222d554ee666f5e/Audit-Intake/CurveYield-cyvlSDT-Deployment-Package-v64.zip' -o /tmp/cyv64.zip
          echo 'a2d46ab6bf63a760efecf914f36419b8ec271c0e36f9b3ee9821cd842ea0d7ee  /tmp/cyv64.zip' | sha256sum -c -
          mkdir -p /tmp/cyv64 /tmp/cyv65
          unzip -q /tmp/cyv64.zip -d /tmp/cyv64
          cp -a /tmp/cyv64/contracts /tmp/cyv65/
          mkdir -p /tmp/cyv-deps
          npm install --prefix /tmp/cyv-deps --ignore-scripts --no-audit --no-fund --no-save '@openzeppelin/contracts@5.4.0' '@openzeppelin-4/contracts@npm:@openzeppelin/contracts@4.9.6' '@openzeppelin/contracts-upgradeable@4.9.6' 'ethers@6.17.0'
          ln -s /tmp/cyv-deps/node_modules /tmp/cyv64/node_modules
          ln -s /tmp/cyv-deps/node_modules /tmp/cyv65/node_modules
          for ROOT in /tmp/cyv64 /tmp/cyv65; do
            rm -f "$ROOT/contracts/PoL_Manager_Contract_v22.sol" "$ROOT/contracts/VoteMarketSingleGaugeBribeAllocator.sol"
            rm -rf "$ROOT/contracts/external_guard_v8"
            cat > "$ROOT/foundry.toml" <<'EOF'
          [profile.default]
          src = "contracts"
          out = "out"
          libs = ["node_modules"]
          remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/", "@openzeppelin-4/contracts/=node_modules/@openzeppelin-4/contracts/", "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/"]
          solc_version = "0.8.28"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          evm_version = "cancun"
          EOF
          done
          python3 - <<'PY'
          import json,pathlib
          p=json.loads(pathlib.Path('github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json').read_text())
          exec(compile(p['transform'],'v65-transform','exec'))
          exec(compile(p['unifiedTransform'],'v66-transform','exec'))
          exec(compile(p['packingTransform'],'v67-transform','exec'))
          PY
      - name: Compile pinned original proposal artifacts and updated vault and SDT strategy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v72-report
          FOUNDRY_OUT=out-25-v69 forge build --root /tmp/cyv65 --force --skip test --skip script
          python3 - <<'PY'
          import json,pathlib,re,difflib
          p=json.loads(pathlib.Path('github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json').read_text())
          exec(compile(p['vaultEmergencyCapabilityPatch'],'v70-vault-capability','exec'))
          exec(compile(p['vaultMintAllowancePatch'],'v71-mint-allowance','exec'))
          f=pathlib.Path('/tmp/cyv65/contracts/StrategyCurveSDTYearnRebindable.sol')
          before=f.read_text()
          after,n=re.subn(r'(\bCURVE_LP_SLIPPAGE_BPS\s*=\s*)200\b',r'\g<1>100',before)
          assert n==1,('expected exactly one 200 bps SDT slippage constant',n)
          assert re.search(r'quoteDeposit\s*\([^;]*CURVE_LP_SLIPPAGE_BPS',after)
          assert re.search(r'quoteWithdraw\s*\([^;]*CURVE_LP_SLIPPAGE_BPS',after)
          f.write_text(after)
          diff=''.join(difflib.unified_diff(before.splitlines(keepends=True),after.splitlines(keepends=True),fromfile='v71/'+f.name,tofile='v72/'+f.name))
          print('SDT_SLIPPAGE_SOURCE_DIFF\n'+diff,flush=True)
          out=pathlib.Path('/tmp/v72-report')
          (out/'StrategyCurveSDTYearnRebindable-v72.sol').write_text(after)
          (out/'SDT-slippage-diff-v1.patch').write_text(diff)
          (out/'BeefyVaultCurveYieldV8cyvlSDT-v71.sol').write_text(pathlib.Path('/tmp/cyv65/contracts/BeefyVaultCurveYieldV8cyvlSDT.sol').read_text())
          pathlib.Path('/tmp/cyv64/replay.cjs').write_text(p['replay'])
          PY
          FOUNDRY_OUT=out-25-v72 forge build --root /tmp/cyv65 --force --skip test --skip script
          python3 - <<'PY'
          import pathlib,json
          root=pathlib.Path('/tmp/cyv65')
          report={}
          for name in ['BeefyVaultCurveYieldV8cyvlSDT','StrategyCurveSDTYearnRebindable']:
              a=json.loads((root/'out-25-v69'/(name+'.sol')/(name+'.json')).read_text())
              b=json.loads((root/'out-25-v72'/(name+'.sol')/(name+'.json')).read_text())
              sizes=lambda v:{k:len(bytes.fromhex(v[k]['object'].removeprefix('0x'))) for k in ['bytecode','deployedBytecode']}
              report[name]={'before':sizes(a),'after':sizes(b)}
              assert report[name]['after']['deployedBytecode']<=24576
          pathlib.Path('/tmp/v72-report/Compiled-size-v72.json').write_text(json.dumps(report,indent=2))
          print('COMPILED_SIZE_V72',json.dumps(report))
          PY
      - name: Fork replay redistributed exact Safe payloads 34 through 36
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPSTREAM_RPC"
          export FORK_BLOCK=26486999
          anvil --fork-url "$UPSTREAM_RPC" --fork-block-number "$FORK_BLOCK" --host 127.0.0.1 --port 8545 --silent >/tmp/anvil.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import pathlib
          f=pathlib.Path('/tmp/cyv64/replay.cjs')
          s=f.read_text()
          old=' await post.run(p,A,SAFE,EOA,artifactForSuite,current,POL);'
          assert s.count(old)==1
          experiment=" log('REDISTRIBUTION_VERIFIED',{addresses:A,proposals:receiptResults.map(x=>x.info),creationNonce:await p.getTransactionCount(SAFE,'latest')});"
          s=s.replace(old,experiment)
          old='const args=safeArgs(list);assert.equal(await safe.nonce(),BigInt(nonce));'
          assert s.count(old)==1
          s=s.replace(old,old+"const patches={34:[[20809,\"dce823ed9948a98376ee3975c9c5d9b29a23389ee1f7161b1ecc7e508b05d190\",\"844711a051a2b39d54cc31c8cb6ff249ac0e93d41030e68191ffe12ef8de05e9\"],[38469,\"ad2cb09f3decb9f830597c8d94a678acbf81bfb49df6dd1dfa7d49f772b9878e\",\"03182f0ee791c5e0197fbf3aa7d77fc6650da03af09e664cdcaf0e127ad24718\"],[47317,\"6ec0931a432df24e9d17c67e7aafe797284cc54bb10c51ef21f1ef67a0e6c1b0\",\"06b3bc49bda13b98f5af9dc5a89d2936c8d5853d2439a5f2ed19f07485029de5\"]],35:[[3594,\"b6298c09be3cb029d2205da3c01600fba6d78e0a2a8a06382c2ba501d1354142\",\"0fb7a8e03c489d51d1090929855c54608704bd8085a4df793c97d6819980f3f3\"],[20862,\"97aec27d8c9195d28aa6e4d1200f87d30a4bdcd4c0fec15f3b44f4266961c4db\",\"2a2459df300f1cd54c8904693813ba2871479372be05c6fe6f4045815f9dbdea\"],[36646,\"ef99e0b3c5d30509fac04ee99b3f48b42da89234922ee3158e12ac6b554d0e4b\",\"cfe9b9f51df66440b265b96fdb2e45bb9e2dc228aad463e0e481629b4255dbaa\"],[49319,\"8307fdbc2cead67635478b962d83e6685b233ff367986094a545f6422480847d\",\"495e67f5f75b2fee06d9651fdfecc97e0d8dc6f71374c0ecf31348cdcfec7133\"],[61296,\"530b5f3987545bb7672b1c3dab1fb4450d4876d01a31c2a665d8b75ecb0cf571\",\"09a906ca63858baabea685735d9fc1aec05404e6c81640c9d5179e0ff0322a38\"],[71915,\"607765eecd37a7110a15e5be01fd1d28f4cabf68ab8958622e9c05ae4426f463\",\"662be53bec0ffa85bff2d6f6111492f6c22f6117275aafff573b9177b88bc155\"]]};for(const [off,a,b] of patches[nonce]||[]){const i=2+2*off;assert.equal(args[2].slice(i,i+a.length),a);args[2]=args[2].slice(0,i)+b+args[2].slice(i+a.length)};")
          s=s.replace('0xa71a462f986ae34e48ae76de4a06c3e39dc1fdeee5f0dc6073f033e0f1960c14','0x4802a84de6417ad35eb65d726e243ef2bce72d2122c3598d4c2e6aef5479229b').replace('0xef9f3557b876ca55928bd86b79583c74723499a7e299bad42a6e6a7569d1455d','0x7863d10f8fcbd00e8be012cdf5cca370c869bd54311f8c88cd81b01c867bfe06')
          old=' second.push(initCalls[0]);\n await execute(second,35);\n await execute([...initCalls.slice(1),route],36);'
          new=' second.push(initCalls[0]);\n assert.equal(second.length,20);const moved=second.splice(8,2);assert.deepEqual(moved.map(x=>x.label),["Deploy crvVault","Deploy fxnVault"]);\n await execute(second,35);\n await execute([...moved,...initCalls.slice(1),route],36);'
          assert s.count(old)==1
          s=s.replace(old,new)
          old='const gasLimit=await estimate(list);'
          assert s.count(old)==1
          s=s.replace(old,'const gasLimit=await safe.execTransaction.estimateGas(...args,{gasLimit:cap});assert(gasLimit<=cap);')
          s=s.replace('0x7863d10f8fcbd00e8be012cdf5cca370c869bd54311f8c88cd81b01c867bfe06","bytes":75140','0x5df28d9039f80cfe367f3643af13dd26e16e03bd39123eb36f1bfc7cf75a340a","bytes":74276')
          s=s.replace('0x6164dd971b88145dff593fab4f7c8a9e60d04e4e3746eabd41003beff3fc9321","bytes":2852','0x28d89d4162e98290f1cc884f82f8d0e7d05ac386e35be72eef56eccf9adb8fe3","bytes":3716')
          assert '0x5df28d9039f80cfe367f3643af13dd26e16e03bd39123eb36f1bfc7cf75a340a' in s
          assert '0x28d89d4162e98290f1cc884f82f8d0e7d05ac386e35be72eef56eccf9adb8fe3' in s
          s=s.replace('Safe-proposals-v72.json','Safe-proposals-redistributed-v5.json').replace('Proposal-configuration-v72.json','Proposal-configuration-redistributed-v5.json')
          f.write_text(s)
          PY
          node /tmp/cyv64/replay.cjs
      - name: Retain final proposal payloads and fork evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CurveYield-Redistributed-Proposals-v5
          path: /tmp/v72-report/
          if-no-files-found: error
