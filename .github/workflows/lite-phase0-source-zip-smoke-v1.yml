name: Lite Phase 0 Archived Source ZIP Smoke v1

# Source-only compilation smoke for archived campaigns which do not yet carry
# the canonical Phase-0 execution artifact/receipt bundle. Does not publish
# campaign evidence or claim a 300-call economic simulation.
on:
  push:
    paths:
      - '.github/smoke-trigger/lite-phase0-source-zip-smoke-v1.json'
      - '.github/workflows/lite-phase0-source-zip-smoke-v1.yml'
      - 'github-native-sim/cyvlsdt-runtime-compare-v1/source-bundle-v47-to-v49.txt'
      - 'github-native-sim/cyvlsdt-runtime-compare-v1/v49-adversarial-*.sol'
      - 'github-native-sim/cyvlsdt-runtime-compare-v1/v49-adversarial-*.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-zip-smoke-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  source-zip-smoke:
    if: github.ref != 'refs/heads/cyvlsdt-v48-compile-v1' && github.ref != 'refs/heads/cyvlsdt-runtime-compare-v1' && github.ref != 'refs/heads/cyvlsdt-v49-adversarial-v1'
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: BoostHub v11
            archive: campaigns/Boosthub Staking v2/source/CurveYield-BoostHub-sdCRV-sdFXN-Deployment-Package-v11.zip
            config: hardhat.config.v3.js
          - label: BoostHub remediated v4
            archive: campaigns/Boosthub Staking v2/source/CurveYield-BoostHub-sdCRV-sdFXN-sdYB-Deployment-Package-Remediated-v4.zip
            config: hardhat.config.js
          - label: cyvlSDT v30
            archive: campaigns/cyvlSDT v30 Audit v29/source/CurveYield-cyvlSDT-Deployment-Package-v30.zip
            config: hardhat.config.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Authenticate read-only Audit-Controller access
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Fetch and verify exact archival source
        id: source
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          SOURCE_ARCHIVE: ${{ matrix.archive }}
          SOURCE_CONFIG: ${{ matrix.config }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --depth 1 --filter=blob:none --sparse https://github.com/curveyield3/Audit-Controller.git .audit-controller
          git -C .audit-controller sparse-checkout set --no-cone "$SOURCE_ARCHIVE"
          test -s ".audit-controller/$SOURCE_ARCHIVE"
          mkdir -p .source-zip-smoke .source-project
          python3 - <<'PY'
          import os,zipfile,hashlib,json,pathlib
          src=pathlib.Path(".audit-controller")/os.environ["SOURCE_ARCHIVE"]
          assert zipfile.is_zipfile(src),"Invalid source ZIP"
          digest=hashlib.sha256(src.read_bytes()).hexdigest()
          out=pathlib.Path(".source-project")
          with zipfile.ZipFile(src) as z:
              corrupt=z.testzip()
              assert corrupt is None,f"Corrupt ZIP member: {corrupt}"
              members=z.infolist()
              assert members,"Archive is empty"
              for member in members:
                  path=pathlib.PurePosixPath(member.filename)
                  assert not path.is_absolute() and ".." not in path.parts, f"Unsafe ZIP member: {member.filename}"
              z.extractall(out)
          roots=[p for p in out.iterdir() if p.is_dir()]
          project=roots[0] if len(roots)==1 else out
          files=[p for p in project.rglob("*") if p.is_file()]
          assert any(p.suffix in {".sol",".vy"} for p in files),"No Solidity or Vyper source files found"
          manifest={"sourceArchive":os.environ["SOURCE_ARCHIVE"],"sha256":digest,"zipBytes":src.stat().st_size,"sourceFiles":sum(p.suffix in {".sol",".vy"} for p in files),"project":str(project),"config":os.environ["SOURCE_CONFIG"],"mode":"SOURCE_ONLY_BUILD_SMOKE","economicTelemetryCalls":0}
          pathlib.Path(".source-zip-smoke/source-identity.json").write_text(json.dumps(manifest,indent=2)+"\n")
          pathlib.Path(".source-zip-smoke/project-dir").write_text(str(project))
          print(json.dumps(manifest,indent=2))
          PY
          echo "project_dir=$(cat .source-zip-smoke/project-dir)" >> "$GITHUB_OUTPUT"
          test -f "$(cat .source-zip-smoke/project-dir)/package.json"
          test -f "$(cat .source-zip-smoke/project-dir)/${SOURCE_CONFIG}"

      - name: Install locked project dependencies
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if test -f package-lock.json; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Compile actual archived contract sources
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
          SOURCE_CONFIG: ${{ matrix.config }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npx --no-install hardhat compile --config "$SOURCE_CONFIG" 2>&1 | tee "$GITHUB_WORKSPACE/.source-zip-smoke/compile.log"
          # Respect paths.artifacts in each archived project's Hardhat config.
          # Hardhat can compile successfully into a nonstandard build directory.
          SOURCE_ARTIFACT_DIR="$(HARDHAT_CONFIG="$SOURCE_CONFIG" node -e 'process.stdout.write(require("hardhat").config.paths.artifacts)')"
          export SOURCE_ARTIFACT_DIR
          test -d "$SOURCE_ARTIFACT_DIR" || { echo "::error::Hardhat artifact directory is missing: $SOURCE_ARTIFACT_DIR"; exit 1; }
          echo "Hardhat artifact directory: $SOURCE_ARTIFACT_DIR"
          python3 - <<'PY'
          import json, pathlib, os
          root=pathlib.Path(os.environ["SOURCE_ARTIFACT_DIR"])
          contracts=[]
          for f in root.rglob("*.json"):
              try:
                  d=json.loads(f.read_text())
                  if isinstance(d,dict) and d.get("abi") is not None and d.get("bytecode") not in (None,"0x"):
                      contracts.append({"name":d.get("contractName",f.stem),"path":str(f)})
              except (ValueError,UnicodeDecodeError): pass
          report=json.loads((pathlib.Path(os.environ["GITHUB_WORKSPACE"])/".source-zip-smoke/source-identity.json").read_text())
          report["compiledContracts"]=len(contracts)
          report["contracts"]=contracts[:100]
          report["status"]="PASS" if contracts else "NO_DEPLOYABLE_COMPILED_ARTIFACTS"
          (pathlib.Path(os.environ["GITHUB_WORKSPACE"])/".source-zip-smoke/compile-summary.json").write_text(json.dumps(report,indent=2)+"\n")
          print(f"Compiled deployable Solidity contracts: {len(contracts)}")
          assert contracts,"No deployable compiled artifacts"
          PY

      - name: Run included Node source tests if present
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mapfile -d '' tests < <(find test tests -type f \( -name '*.test.js' -o -name '*.test.mjs' \) -print0 2>/dev/null || true)
          if (( ${#tests[@]} > 0 )); then
            node --test "${tests[@]}" | tee "$GITHUB_WORKSPACE/.source-zip-smoke/tests.log"
          else
            echo 'No standalone Node tests included; compilation smoke only' | tee "$GITHUB_WORKSPACE/.source-zip-smoke/tests.log"
          fi

      - name: Preserve independent source ZIP smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: source-zip-smoke-${{ matrix.label }}-${{ github.run_id }}
          path: .source-zip-smoke/
          if-no-files-found: warn
          include-hidden-files: true

  cyvlsdt-runtime-size:
    name: cyvlSDT v47-v49 deployed runtime bytecode
    if: github.ref == 'refs/heads/cyvlsdt-runtime-compare-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore original source sets and verify their identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,io,lzma,pathlib,shutil,subprocess,tarfile
          root=pathlib.Path('.cyvlsdt-runtime-size')
          root.mkdir(exist_ok=True)
          lines=pathlib.Path('github-native-sim/cyvlsdt-runtime-compare-v1/source-bundle-v47-to-v49.txt').read_text().splitlines()
          assert lines[0]=='V47_XZ_BASE64'
          idx=lines.index('V49_PATCH_XZ_BASE64')
          archive=base64.b64decode(''.join(lines[1:idx]),validate=True)
          patch_xz=base64.b64decode(''.join(lines[idx+1:]),validate=True)
          assert hashlib.sha256(archive).hexdigest()=='495b95243f69ad2b56879c630f7b86b1e2492337e241ba6149b05de61fa91e29'
          assert hashlib.sha256(patch_xz).hexdigest()=='b98f470501b3fff6bd198f7ee9db142f4c9904d4fda4f11fbc132216e463cc36'
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(archive))) as tf:
              for m in tf.getmembers():
                  p=pathlib.PurePosixPath(m.name)
                  assert not p.is_absolute() and '..' not in p.parts
              tf.extractall(root/'v47',filter='data')
          shutil.copytree(root/'v47',root/'v49')
          patch=lzma.decompress(patch_xz)
          subprocess.run(['patch','--batch','--fuzz=0','-p1'],cwd=root/'v49',input=patch,check=True)
          expected={
            'v47':'3613ec9f294ff5b00eb0602c3bba604f190cf4c933da6f70083a5d11a92b6596',
            'v49':'087e6bdd46f74019eff2750fb028afa02ecc80c2246749874221cca50f7aa1c9'
          }
          for version in ('v47','v49'):
              paths=sorted([x for x in (root/version/'contracts').rglob('*.sol')] +
                  [root/version/'package.json',root/version/'hardhat.config.js'])
              digest=''.join(f'{p.relative_to(root/version).as_posix()}:{hashlib.sha256(p.read_bytes()).hexdigest()}\n' for p in paths)
              observed=hashlib.sha256(digest.encode()).hexdigest()
              assert observed==expected[version],f'{version} source identities differ: {observed}'
              print(version,'verified original source-set SHA256',observed,'files',len(paths))
          PY
      - name: Normalize invalid USDC literal checksums in temporary build copies only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          canonical='0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
          fixes={
            'contracts/CurveYieldRevenueStrategyV20.sol':'0xA0b86991c6218b36c1d19d4a2e9eb0ce3606eb48',
            'contracts/VoteMarketSingleGaugeBribeAllocator.sol':'0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48'
          }
          for version in ('v47','v49'):
              for path,old in fixes.items():
                  p=Path('.cyvlsdt-runtime-size')/version/path
                  s=p.read_text()
                  assert s.count(old)==1,(version,path,'unexpected address occurrence count')
                  p.write_text(s.replace(old,canonical,1))
                  print(version,path,'fixed checksum casing without changing address')
          PY
      - name: Install exactly pinned dependencies and compile v47 and v49
        shell: bash
        run: |
          set -euo pipefail
          for version in v47 v49; do
            echo "=== COMPILING $version ==="
            cd "$GITHUB_WORKSPACE/.cyvlsdt-runtime-size/$version"
            npm install --no-audit --no-fund --package-lock=false 2>&1 | tee "$GITHUB_WORKSPACE/.cyvlsdt-runtime-size/$version-install.log"
            npx --no-install hardhat compile 2>&1 | tee "$GITHUB_WORKSPACE/.cyvlsdt-runtime-size/$version-compile.log"
          done
      - name: Compare measured deployed runtime sizes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,json,pathlib
          root=pathlib.Path('.cyvlsdt-runtime-size')
          results={}
          for version in ('v47','v49'):
              artifacts=root/version/('artifacts-'+version)/'contracts'
              assert artifacts.is_dir(),f'{version} artifact directory missing'
              sizes={}
              for p in artifacts.rglob('*.json'):
                  if p.name.endswith('.dbg.json'):continue
                  d=json.loads(p.read_text())
                  obj=d.get('deployedBytecode')
                  if not isinstance(obj,str) or not obj.startswith('0x') or len(obj)<=2:continue
                  assert (len(obj)-2)%2==0
                  key=d.get('sourceName','?')+':'+d.get('contractName',p.stem)
                  sizes[key]=(len(obj)-2)//2
              assert sizes,f'{version} has no deployable runtime bytecode'
              results[version]=sizes
          names=sorted(set(results['v47'])|set(results['v49']))
          rows=[]
          for name in names:
              a=results['v47'].get(name);b=results['v49'].get(name)
              delta=b-a if a is not None and b is not None else None
              rows.append({'contract':name,'v47_runtime_bytes':a,'v49_runtime_bytes':b,'delta_bytes':delta,'delta_pct':round(100*delta/a,4) if a and delta is not None else None,'v49_over_EIP170':b>24576 if b is not None else None})
          (root/'runtime-size-results.json').write_text(json.dumps(rows,indent=2)+'\n')
          with (root/'runtime-size-results.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          report=['# Compiler-measured cyvlSDT deployed runtime sizes','','Solidity v47 vs v49; 200 optimizer runs, viaIR, Cancun; includes metadata.','','| Contract | v47 | v49 | Difference | Status |','|---|---:|---:|---:|---|']
          for row in rows:
              a=row['v47_runtime_bytes'];b=row['v49_runtime_bytes'];d=row['delta_bytes']
              report.append(f"| `{row['contract']}` | {a if a is not None else 'n/a'} | {b if b is not None else 'n/a'} | {d if d is not None else 'n/a'} | {'OVER EIP-170' if row['v49_over_EIP170'] else 'OK'} |")
          out='\n'.join(report)+'\n'
          (root/'runtime-size-report.md').write_text(out)
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(out)
          print(out)
          PY
      - name: Upload comparison and compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyvlsdt-runtime-compare-v47-v49-${{ github.run_id }}
          path: |
            .cyvlsdt-runtime-size/runtime-size-results.json
            .cyvlsdt-runtime-size/runtime-size-results.csv
            .cyvlsdt-runtime-size/runtime-size-report.md
            .cyvlsdt-runtime-size/*-compile.log
            .cyvlsdt-runtime-size/*-install.log
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

  cyvlsdt-v48-compile:
    if: github.ref == 'refs/heads/cyvlsdt-v48-compile-v1' || github.ref == 'refs/heads/cyvlsdt-v49-adversarial-v1'
    name: cyvlSDT v49 exact source compile and adversarial stress qualification
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and identify exact v48 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .v48-source .v48-evidence
          python3 - <<'PY'
          from pathlib import Path
          import base64,lzma
          lines=Path('github-native-sim/cyvlsdt-runtime-compare-v1/source-bundle-v47-to-v49.txt').read_text().splitlines()
          a=lines.index('V47_XZ_BASE64')
          b=lines.index('V49_PATCH_XZ_BASE64')
          Path('/tmp/cyvlsdt-v47-archive').write_bytes(lzma.decompress(base64.b64decode(''.join(lines[a+1:b]))))
          idx=lines.index('V48_PATCH_XZ_BASE64')
          Path('/tmp/v48.patch').write_bytes(lzma.decompress(base64.b64decode(''.join(lines[idx+1:]))))
          PY
          file /tmp/cyvlsdt-v47-archive
          if tar -tf /tmp/cyvlsdt-v47-archive >/dev/null 2>&1; then
            tar -xf /tmp/cyvlsdt-v47-archive -C .v48-source
          elif unzip -t /tmp/cyvlsdt-v47-archive >/dev/null 2>&1; then
            unzip -q /tmp/cyvlsdt-v47-archive -d .v48-source
          else
            echo "::error::Unknown v47 source archive format"
            exit 1
          fi
          ROOT="$(find .v48-source -type f -name hardhat.config.js -printf '%h\n' | head -n 1)"
          test -n "$ROOT"
          echo "SOURCE_ROOT=$ROOT" >> "$GITHUB_ENV"
          ACTUAL_V47_SHA="$(sha256sum "$ROOT/contracts/CurveYieldVlSDTLocker.sol" | cut -d ' ' -f 1)"
          test "$ACTUAL_V47_SHA" = 'ea624b164c7697756e28d8f75bd029d2a41901eb49e66781720b9486b1ea8a1a'
          (cd "$ROOT" && patch -p1 --batch < /tmp/v48.patch)
          ACTUAL_V48_SHA="$(sha256sum "$ROOT/contracts/CurveYieldVlSDTLocker.sol" | cut -d ' ' -f 1)"
          test "$ACTUAL_V48_SHA" = '15ce47410538a1c2437fb16613eb0194efce42407e7594c890f7c75400bb8166'
          printf 'v47_lock=%s\nv48_lock=%s\n' "$ACTUAL_V47_SHA" "$ACTUAL_V48_SHA" > .v48-evidence/source-identity.txt

          # Compile-only normalization of two pre-existing invalid EIP-55 address literals.
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.v48-source/contracts')
          fixed='0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
          for name,old in (
              ('CurveYieldRevenueStrategyV20.sol','0xA0b86991c6218b36c1d19d4a2e9eb0ce3606eb48'),
              ('VoteMarketSingleGaugeBribeAllocator.sol','0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48'),
          ):
              path=root/name
              text=path.read_text()
              assert text.count(old)==1,(name,text.count(old))
              path.write_text(text.replace(old,fixed))
              print('Fixed EIP-55 literal:',name)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.v48-source')
          h=hashlib.sha256()
          for p in sorted((root/'contracts').rglob('*.sol')):
              h.update(p.relative_to(root).as_posix().encode())
              h.update(bytes([0]))
              h.update(p.read_bytes())
              h.update(bytes([0]))
          assert h.hexdigest()=='aaee36e12c911e170c7284cd92ce0919196ca721dc61020c4c8d6baea3f8287d',h.hexdigest()
          assert hashlib.sha256((root/'hardhat.config.js').read_bytes()).hexdigest()=='0bbfa425db0a1236a481e99557c35c7053c077a0474267affe8a316b69810b4f'
          print('All v49 Solidity sources and Hardhat config match delivered package exactly')
          PY

      - name: Stage v49 adversarial mocks and independent multicase suite
        if: github.ref == 'refs/heads/cyvlsdt-v49-adversarial-v1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_ROOT/test"
          cp github-native-sim/cyvlsdt-runtime-compare-v1/v49-adversarial-mocks.sol "$SOURCE_ROOT/contracts/StressAdversarialMocks.sol"
          cp github-native-sim/cyvlsdt-runtime-compare-v1/v49-adversarial-suite.js "$SOURCE_ROOT/test/v49-adversarial.js"
          test -s "$SOURCE_ROOT/contracts/StressAdversarialMocks.sol"
          test -s "$SOURCE_ROOT/test/v49-adversarial.js"
      - name: Install dependencies and compile (no tests)
        shell: bash
        run: |
          set -eo pipefail
          cd "$SOURCE_ROOT"
          if test -f package-lock.json; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi
          npx --no-install hardhat compile 2>&1 | tee "$GITHUB_WORKSPACE/.v48-evidence/compile.log"
      - name: Run v49 multiactor adversarial simulations with per-state invariants
        if: github.ref == 'refs/heads/cyvlsdt-v49-adversarial-v1'
        shell: bash
        run: |
          set -eo pipefail
          cd "$SOURCE_ROOT"
          npx --no-install hardhat test test/v49-adversarial.js --no-compile 2>&1 | tee "$GITHUB_WORKSPACE/.v48-evidence/adversarial.log"
      - name: Record runtime bytecode sizes
        shell: bash
        run: |
          set -eo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['SOURCE_ROOT'])
          counts=0
          for p in sorted(root.glob('artifacts*/contracts/**/*.json'))+sorted(root.glob('artifacts/contracts/**/*.json')):
              try:
                  obj=json.loads(p.read_text())
                  name=obj.get('contractName')
                  code=obj.get('deployedBytecode','0x')
                  if name and isinstance(code,str) and code.startswith('0x') and len(code)>2:
                      counts+=1
                      print(f'RUNTIME_BYTES {name} {(len(code)-2)//2} EIP170_LIMIT 24576')
              except (ValueError,UnicodeDecodeError): pass
          assert counts>0, 'No compiled deployable bytecode artifacts'
          PY
      - name: Upload compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyvlsdt-v49-adversarial-qualification
          path: .v48-evidence/
          if-no-files-found: warn
          include-hidden-files: true
