        id: compile
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
          RPC_BASE: ${{ secrets.RPC_BASE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RPC_BASE:-}" || { echo "::error::RPC_BASE unavailable; cannot run authenticated Base fork"; exit 1; }
          export BASE_RPC_URL=http://127.0.0.1:8545
          test "$(cast chain-id --rpc-url "$RPC_BASE")" = 8453
          export PINNED_BLOCK="$(cast block-number --rpc-url "$RPC_BASE")"
          block_hash() {
            RPC_CHECK_URL="$1" node --input-type=module -e 'const r=await fetch(process.env.RPC_CHECK_URL,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method:"eth_getBlockByNumber",params:["0x"+BigInt(process.env.PINNED_BLOCK).toString(16),false]})}); if(!r.ok)throw new Error("Block RPC HTTP failure"); const j=await r.json(); const hash=j.result?.hash; if(!/^0x[0-9a-fA-F]{64}$/.test(hash||""))throw new Error("Missing authoritative block hash");process.stdout.write(hash.toLowerCase());'
          }
          export PINNED_HASH="$(block_hash "$RPC_BASE")"
          # Anvil CUPS controls reactive retries, not initial request pacing.
          # Serialize archive reads through this job-local relay; never forward writes.
          node --input-type=module > "$GITHUB_WORKSPACE/.source-zip-smoke/rpc-pacing.log" 2>&1 <<'RPC_PACING' &
          import http from 'node:http';
          import {setTimeout as sleep} from 'node:timers/promises';
          const upstream=process.env.RPC_BASE;
          let tail=Promise.resolve(), next=0, calls=0, limited=0;
          const readOnly=/^(eth_get[A-Za-z]+|eth_chainId|eth_blockNumber|eth_call|eth_feeHistory|eth_gasPrice|eth_maxPriorityFeePerGas|net_version|web3_clientVersion|anvil_nodeInfo|anvil_metadata)$/;
          async function forward(msg) {
            if(!readOnly.test(msg.method||'')) return {jsonrpc:'2.0',id:msg.id,error:{code:-32601,message:'Read-only archive relay'}};
            for(let attempt=0;attempt<5;attempt++){
              await sleep(Math.max(0,next-Date.now())); next=Date.now()+1500; calls++;
              const res=await fetch(upstream,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(msg),signal:AbortSignal.timeout(45000)});
              const raw=await res.text(); let result;
              try{result=JSON.parse(raw)}catch{}
              if(res.status===429 || result?.error?.code===15 || result?.error?.code===429 || /rate limit/i.test(result?.error?.message||'')){
                limited++;
                const h=res.headers.get('retry-after');
                const requested=h?(Number.isFinite(Number(h))?Number(h)*1000:Date.parse(h)-Date.now()):0;
                const delay=Math.max(10000*2**attempt,Number.isFinite(requested)?requested:0);
                console.log('Archive throttled; reads='+calls+' rate_limits='+limited+' retry_delay_ms='+delay);
                if(attempt===4) return result?.error?result:{jsonrpc:'2.0',id:msg.id,error:{code:429,message:'Archive provider rate limit persists'}};
                await sleep(delay); continue;
              }
              if(result && typeof result==='object' && ('result' in result || 'error' in result)){
                if(result.error) console.log('Archive RPC method='+msg.method+' HTTP='+res.status+' error_code='+result.error.code);
                return {...result,jsonrpc:'2.0',id:msg.id};
              }
              console.log('Archive invalid response method='+msg.method+' HTTP='+res.status);
              return {jsonrpc:'2.0',id:msg.id,error:{code:-32000,message:'Archive RPC returned invalid JSON-RPC (HTTP '+res.status+')'}};
            }
          }
          http.createServer(async(req,res)=>{
            try{
              let raw='';for await(const c of req)raw+=c;
              const msg=JSON.parse(raw);
              const run=tail.then(async()=>{
                if(!Array.isArray(msg))return forward(msg);
                const out=[];for(const item of msg)out.push(await forward(item));return out;
              });
              tail=run.catch(()=>{});
              const out=await run;res.writeHead(200,{'content-type':'application/json'});res.end(JSON.stringify(out));
              if(calls%25===0)console.log('Archive reads='+calls+' rate_limits='+limited);
            }catch(e){res.writeHead(502,{'content-type':'application/json'});res.end(JSON.stringify({jsonrpc:'2.0',id:null,error:{code:-32000,message:'Archive relay request failed'}}));console.log('Archive relay failure: '+e.name);}
          }).listen(8546,'127.0.0.1',()=>console.log('Archive relay ready: one request every 1500ms'));
          RPC_PACING
