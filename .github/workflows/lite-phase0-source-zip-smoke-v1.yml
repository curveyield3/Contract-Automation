          trap 'kill "$pacing_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if cast chain-id --rpc-url http://127.0.0.1:8546 >/dev/null 2>&1; then break; fi
            sleep 1
          done
