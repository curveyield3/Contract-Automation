              for m in z.infolist():
                  p = pathlib.PurePosixPath(m.filename)
                  assert not p.is_absolute() and ".." not in p.parts
              z.extractall(dest)
          root = dest / "CurveYield_DEX_Simplified_Native_Fees_v5"
          delta = json.loads(zlib.decompress(pathlib.Path(".source-zip-smoke/workspace.delta").read_bytes()))
          for name, ops in delta.items():
              p = pathlib.PurePosixPath(name)
              assert p.parts[0] == "workspace" and not p.is_absolute() and ".." not in p.parts
              target = root.joinpath(*p.parts)
              if ops is None:
                  target.unlink()
                  continue
              lines = target.read_bytes().decode().splitlines(True) if target.exists() else []
              for i,j,s in reversed(ops):
                  lines[i:j] = s.splitlines(True)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes("".join(lines).encode())
