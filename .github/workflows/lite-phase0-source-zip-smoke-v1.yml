name: Exact executed nonce37 verification input v36
on:
  push:
    branches: [cyvlsdt-v69-postdeploy-simulation-v1]
    paths: ['.github/workflows/lite-phase0-source-zip-smoke-v1.yml', 'github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json', 'github-native-sim/cyvlsdt-runtime-compare-v1/v69-postdeploy-suite-v1.cjs']
permissions:
  contents: read
  actions: read
jobs:
  fork-gas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FOUNDRY_OPTIMIZER_RUNS: '25'
      UPSTREAM_RPC: ${{ secrets.RPC_ETHEREUM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover retained compiler artifacts and pinned dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 45386347328 -n CurveYield-Deployment-Headers-v1 -D /tmp/header-evidence
          npm install --prefix /tmp/verify36 --ignore-scripts --no-audit --no-fund --no-save '@openzeppelin/contracts@5.4.0' '@openzeppelin-4/contracts@npm:@openzeppelin/contracts@4.9.6' '@openzeppelin/contracts-upgradeable@4.9.6' 'ethers@6.17.0'
      - name: Compile exact GrossNAV source package
        run: |
          set -euo pipefail
          cp -a /tmp/header-evidence/compiler-inputs/cyv-header69 /tmp/grossnav
          ln -s /tmp/verify36/node_modules /tmp/grossnav/node_modules
          python3 - <<'PY'
          import pathlib,hashlib
          p=pathlib.Path('/tmp/grossnav/contracts/CurveYieldRevenueStrategyV8.sol')
          s=p.read_text()
          pairs=[
              ('    /// @dev Both strategy NAV and gross-up read the current staking exit fee;\n    ///      only the vault charges its separate shareholder-retained fee.', '    /// @dev NAV is gross principal. The vault receives the exact requested amount;\n    ///      its exit-fee quote recovers the maximum backend gross-up cost.'),
              ('uint256 fee = immediateWithdrawFeePpm();','uint256 fee = uint256(REVENUE_STAKING.immediateWithdrawFeePpm());'),
              ('            // No fee when the configured staking fee is zero; otherwise round up\n            // the staked amount so the vault receives its requested net amount.\n            unstaked = Math.mulDiv(needed, 1_000_000, 1_000_000 - fee, Math.Rounding.Ceil);','            // Minimal gross principal whose post-fee amount covers needed.\n            // The staking fee rounds down, so net = ceil(gross * (1 - fee)).\n            unstaked = Math.mulDiv(needed - 1, 1_000_000, 1_000_000 - fee) + 1;'),
              ('function grossBalanceOf() external view returns (uint256)','function grossBalanceOf() public view returns (uint256)'),
              ('    /// @notice Read the exact live rate used for the staking backend\'s instant withdrawals.\n    function immediateWithdrawFeePpm() public view returns (uint256) {\n        return uint256(REVENUE_STAKING.immediateWithdrawFeePpm());','    /// @notice Vault-side recovery rate for the cost of delivering an exact net amount.\n    /// @dev The backend fee itself is unchanged. Round up the gross-up cost rate so\n    ///      ordinary partial exits do not charge this cost to remaining shareholders.\n    ///      The vault applies this amount-independent quote also to idle/early-queue exits.\n    function immediateWithdrawFeePpm() public view returns (uint256) {\n        uint256 fee = uint256(REVENUE_STAKING.immediateWithdrawFeePpm());\n        return Math.mulDiv(fee, 1_000_000, 1_000_000 - fee, Math.Rounding.Ceil);'),
              ('        // Price active stake at its currently instant-withdrawable net value.\n        // Exclude reserved idle and queued principal: those belong to burned shares.\n        return _unreservedIdle()\n            + REVENUE_STAKING.previewImmediateWithdrawal(REVENUE_STAKING.activeBalance(address(this)));','        // Gross active principal and unreserved idle; an optional future instant\n        // exit fee is not a loss of principal. Queued assets remain excluded.\n        return grossBalanceOf();')
          ]
          for a,b in pairs:
              assert s.count(a)==1, a
              s=s.replace(a,b)
          p.write_text(s)
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='d8b239014254bd8bbb748e2ab236faf497d1f258637382c98ffae6c0f06b38c3'
          print('GROSSNAV_SOURCE_SHA256_MATCH')
          PY
          npm install --prefix /tmp/verify36 --ignore-scripts --no-audit --no-fund --no-save solc@0.8.28 '@openzeppelin/contracts@5.4.0' '@openzeppelin-4/contracts@npm:@openzeppelin/contracts@4.9.6' '@openzeppelin/contracts-upgradeable@4.9.6' 'ethers@6.17.0'
          cd /tmp/grossnav
          node <<'JS'
          const fs=require('node:fs'),path=require('node:path'),solc=require('solc'),assert=require('assert/strict');
          const target='contracts/CurveYieldRevenueStrategyV8.sol',name='CurveYieldRevenueStrategyV8';
          assert(solc.version().startsWith('0.8.28+commit.7893614a'));
          const sources={};
          function add(p){if(sources[p])return;const file=p.startsWith('@')?path.join('node_modules',p):p;const content=fs.readFileSync(file,'utf8');sources[p]={content};for(const m of content.matchAll(/import\s+(?:[^;]*?\sfrom\s*)?["']([^"']+)["']\s*;/g))add(m[1].startsWith('.')?path.posix.normalize(path.posix.join(path.posix.dirname(p),m[1])):m[1]);}
          add(target);
          const input={language:'Solidity',sources,settings:{optimizer:{enabled:true,runs:25},viaIR:true,evmVersion:'cancun',metadata:{bytecodeHash:'ipfs'},outputSelection:{'*':{'*':['abi','metadata','evm.bytecode.object','evm.deployedBytecode.object','evm.deployedBytecode.immutableReferences','evm.methodIdentifiers']}}}};
          const output=JSON.parse(solc.compile(JSON.stringify(input)));for(const e of output.errors||[])if(e.severity==='error')console.log(e.formattedMessage);assert(!(output.errors||[]).some(e=>e.severity==='error'));
          const a=output.contracts[target][name];
          assert.equal(a.evm.bytecode.object.length/2,12040);assert.equal(a.evm.deployedBytecode.object.length/2,10709);
          fs.writeFileSync('/tmp/grossnav-compiler.json',JSON.stringify({input,contractName:target+':'+name,compilerVersion:'v0.8.28+commit.7893614a',creation:'0x'+a.evm.bytecode.object,runtimeBytes:10709,constructor:a.abi.find(x=>x.type==='constructor').inputs}));
          JS
      - name: Assemble exact verified standard JSON from compiler metadata
        run: |
          set -euo pipefail
          cd /tmp/verify36
          node <<'JS'
          const fs=require('fs'),E=require('ethers'),assert=require('assert/strict');
          const root='/tmp/header-evidence';
          const deployments=[{address:'0x458f089aa290210fbd1118001c4c3ae8ea611544',init:''},{address:'0xcb85b940619e68da7bf1970d106fa17cc0bedbb7',init:''}];
          const c=JSON.parse(fs.readFileSync('/tmp/grossnav-compiler.json')),d=deployments.find(x=>x.address==='0xcb85b940619e68da7bf1970d106fa17cc0bedbb7');
          assert(d.init.toLowerCase().startsWith(c.creation.toLowerCase()),'Creation bytecode mismatch');
          const constructorArguments=d.init.slice(c.creation.length);
          assert.equal(constructorArguments.length,9*64);
          const name='CurveYieldRevenueStrategyV8',out=JSON.stringify({...c,name,address:d.address,constructorArguments});
          for(let i=0;i<out.length;i+=6000)console.log('VERIFY37_CHUNK '+JSON.stringify({name,offset:i,data:out.slice(i,i+6000)}));
          console.log('VERIFY37_READY '+JSON.stringify({name,length:out.length,creationBytes:12040,runtimeBytes:10709,exactCreationMatch:true}));
          JS
