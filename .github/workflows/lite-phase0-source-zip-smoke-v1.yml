name: cyvlSDT complete installation and replacement vault nonce37 v3
on:
  push:
    branches: [cyvlsdt-gross-nav-pool-fork-v1]
    paths:
      - .github/workflows/lite-phase0-source-zip-smoke-v1.yml
permissions:
  contents: read
concurrency:
  group: cyvlsdt-gross-nav-pool-fork-v1
  cancel-in-progress: false
jobs:
  fork-gas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: curveyield3/Smart-Contracts
          ref: 806938f4f8369773efe3c68248308e530ea87d3f
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Authenticate exact candidate source and configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gross-nav"
          base64 --decode candidate/cyvlSDT/optimization-v58/source-v58.zip.b64 > "$RUNNER_TEMP/gross-nav.zip"
          unzip -q "$RUNNER_TEMP/gross-nav.zip" -d "$RUNNER_TEMP/gross-nav"
          cd "$RUNNER_TEMP/gross-nav"
          sha256sum -c <<'EOF'
          d8b239014254bd8bbb748e2ab236faf497d1f258637382c98ffae6c0f06b38c3  contracts/CurveYieldRevenueStrategyV8.sol
          810a34b7ed54c8a07ab74542253cc980e37bb39bf0053297d3bc3f0fdaf7b3f4  contracts/interfaces/ICurveYield.sol
          50d5d73c55d0f46fabf611186dab21fd9b776ebd9064571f9bd408264bebea48  contracts/interfaces/ICurveYieldOmniRouter.sol
          d3b3ccae007294a9d572623a4e8c9da3162f4463328152b14041241d385b1c98  contracts/interfaces/IStrategyBoostHubV1.sol
          7d01c71a7ba5ea78afe469d1d13fbe22dd33ae5e6bc2d91b031720103d7cc47f  foundry.toml
          2ba73adf9ba847ae9818b4b4d3d419c2b4af70d5807786b97a4c9d173e4ae7c4  package.json
          EOF
      - name: Install pinned compiler and dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gross-nav"
          npm install --ignore-scripts --no-audit --no-fund --save-exact solc@0.8.28 ethers@6.17.0
      - name: Compile strategy and retain exact compiler evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gross-nav"
          node <<'JS'
          const fs = require('node:fs'), path = require('node:path'), solc = require('solc');
          const target = 'contracts/CurveYieldRevenueStrategyV8.sol', name = 'CurveYieldRevenueStrategyV8';
          if (!solc.version().startsWith('0.8.28+commit.7893614a')) throw Error('compiler mismatch');
          const sources = {};
          function add(p) {
            if (sources[p]) return;
            const file = p.startsWith('@') ? path.join('node_modules',p) : p;
            const content = fs.readFileSync(file,'utf8');
            sources[p] = {content};
            for (const m of content.matchAll(/import\s+(?:[^;]*?\sfrom\s*)?["']([^"']+)["']\s*;/g)) {
              add(m[1].startsWith('.') ? path.posix.normalize(path.posix.join(path.posix.dirname(p),m[1])) : m[1]);
            }
          }
          add(target);
          const input = {language:'Solidity', sources, settings:{optimizer:{enabled:true,runs:25},viaIR:true,evmVersion:'cancun',metadata:{bytecodeHash:'ipfs'},outputSelection:{'*':{'*':['abi','metadata','evm.bytecode.object','evm.deployedBytecode.object','evm.deployedBytecode.immutableReferences','evm.methodIdentifiers']}}}};
          fs.mkdirSync('out',{recursive:true});
          fs.writeFileSync('out/standard-input.json',JSON.stringify(input));
          const output = JSON.parse(solc.compile(JSON.stringify(input)));
          fs.writeFileSync('out/standard-output.json',JSON.stringify(output));
          for(const e of output.errors || []) console.log(e.formattedMessage);
          if((output.errors || []).some(e=>e.severity==='error')) process.exit(1);
          const a=output.contracts[target][name];
          const byteCount=x=>{if(!/^(?:[0-9a-fA-F]{2})+$/.test(x))throw Error('invalid bytecode');return x.length/2};
          const report={compiler:solc.version(),contract:target+':'+name,optimizerRuns:25,viaIR:true,evmVersion:'cancun',runtimeBytes:byteCount(a.evm.deployedBytecode.object),creationBytes:byteCount(a.evm.bytecode.object),warningCount:(output.errors||[]).filter(e=>e.severity==='warning').length,errorCount:0};
          if(report.runtimeBytes>24576 || report.creationBytes+9*32>49152) throw Error('EVM size limit exceeded');
          fs.writeFileSync('out/strategy-artifact.json',JSON.stringify(a));
          fs.writeFileSync('out/compile-report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          JS
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Simulate exact complete Safe installation batch
        shell: bash
        env:
          ETHEREUM_FORK_RPC_URL: ${{ secrets.RPC_ETHEREUM }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gross-nav"
          cp out/strategy-artifact.json out/standard-input.json out/compile-report.json .
          test -s strategy-artifact.json
          jq -e '.runtimeBytes==10709 and .creationBytes==12040 and .errorCount==0' compile-report.json >/dev/null
          jq -r '.sources["contracts/CurveYieldRevenueStrategyV8.sol"].content' standard-input.json | head -25 > header.txt
          grep -q 'CurveYield System Component' header.txt
          python3 - <<'PY'
          import json,hashlib
          s=json.load(open('standard-input.json'))['sources']['contracts/CurveYieldRevenueStrategyV8.sol']['content']
          assert hashlib.sha256(s.encode()).hexdigest()=='d8b239014254bd8bbb748e2ab236faf497d1f258637382c98ffae6c0f06b38c3'
          PY
          test -n "$ETHEREUM_FORK_RPC_URL" || { echo 'RPC_ETHEREUM unavailable'; exit 1; }
          echo 'PREFLIGHT: source authenticated; resolving upstream block'
          mkdir -p evidence
          node <<'JS' > evidence/upstream-pin.json
          const url=process.env.ETHEREUM_FORK_RPC_URL;
          async function rpc(method,params) {
            for(let i=0;i<3;i++){
              try{
                const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params}),signal:AbortSignal.timeout(20000)});
                if(!r.ok) throw Error('HTTP '+r.status);
                const j=await r.json();
                if(j.error) throw Error('RPC code '+j.error.code);
                if(j.result==null) throw Error('empty result');
                return j.result;
              }catch(e){console.error(method+' attempt '+(i+1)+': '+String(e.message).replace(/https?:\S+/g,'[redacted]'));if(i===2)throw Error('upstream RPC failed');await new Promise(r=>setTimeout(r,2000));}
            }
          }
          (async()=>{const chain=await rpc('eth_chainId',[]);if(BigInt(chain)!==1n)throw Error('wrong chain');const b=await rpc('eth_getBlockByNumber',['latest',false]);if(!/^0x[0-9a-f]{64}$/i.test(b.hash))throw Error('invalid hash');console.log(JSON.stringify({block:Number(BigInt(b.number)),hash:b.hash}));})().catch(e=>{console.error(e.message);process.exit(1)});
          JS
          BLOCK="$(jq -er .block evidence/upstream-pin.json)"
          HASH="$(jq -er .hash evidence/upstream-pin.json)"
          printf 'UPSTREAM_PIN block=%s hash=%s\n' "$BLOCK" "$HASH"
          SAFE=0x47623c62f281807d615eeb4a2ceee9d97f9d3c49
          SDT=0x73968b9a57c6e53d41345fd57a6e6ae27d6cdb2f
          WANT=0x4abc523b4eab1fad413018711de14ccd8843d839
          LOCKER=0x786e17f913a3b6d2764e77374268c009660cc27f
          STAKING=0x8003fa826f5414a7c6cf0aa9fd3c73df97e77bac
          ROUTER=0xa4a533025fef8d3446e7cb8a434824e1ee865b00
          OLD=0x48ce7408e14251d40ef2dc9da64b971bb60e318d
          TEMPLATE=0x00f63308ebb429f0967aa36a0def66ec1074975b
          FACTORY=0x6a8cbed756804b16e05e741edabd5cb544ae21bf
          ADMIN=0x9f2b20a772246960810045905b7daccf960ee288
          POL=0xad60c84f4addec612ce6bd329435d5718a4d9b7a
          TEN=10000000000000000000
          TWENTY=20000000000000000000
          APPROVE=10000000000000000000000
          export ETH_RPC_URL=http://127.0.0.1:8545
          mkdir -p evidence
          anvil --fork-url "$ETHEREUM_FORK_RPC_URL" --fork-block-number "$BLOCK" --chain-id 1 --host 127.0.0.1 --port 8545 --silent > /tmp/gross-nav-anvil.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; cp /tmp/gross-nav-anvil.log evidence/anvil.log 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do if cast chain-id --rpc-url "$ETH_RPC_URL" >/dev/null 2>&1; then break; fi; sleep 1; done
          echo "PREFLIGHT: verify local chain, historical block and code"
          export BLOCK HASH SAFE SDT WANT LOCKER STAKING ROUTER OLD TEMPLATE FACTORY
          node <<'JS'
          const assert=require('node:assert/strict');
          async function rpc(url,method,params){
            const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params}),signal:AbortSignal.timeout(20000)});
            if(!r.ok)throw Error(method+' HTTP '+r.status);
            const j=await r.json();if(j.error)throw Error(method+' RPC '+j.error.code);return j.result;
          }
          (async()=>{
            const local='http://127.0.0.1:8545', upstream=process.env.ETHEREUM_FORK_RPC_URL, tag='0x'+BigInt(process.env.BLOCK).toString(16);
            const chain=await rpc(local,'eth_chainId',[]), number=await rpc(local,'eth_blockNumber',[]), b=await rpc(local,'eth_getBlockByNumber',[tag,false]);
            console.log('FORK IDENTITY',JSON.stringify({chain,number,hash:b?.hash,expected:process.env.HASH}));
            assert.equal(BigInt(chain),1n);assert.equal(BigInt(number),BigInt(tag));assert.equal(b?.hash,process.env.HASH);
            assert.equal((await rpc(local,'eth_getCode',[process.env.OLD,tag])).slice(22,62),process.env.TEMPLATE.slice(2));
            for(const key of ['SAFE','SDT','WANT','LOCKER','STAKING','ROUTER','OLD','TEMPLATE','FACTORY']){
              const a=process.env[key], x=await rpc(local,'eth_getCode',[a,tag]), y=await rpc(upstream,'eth_getCode',[a,tag]);
              assert.notEqual(x,'0x',key+' empty code');assert.equal(x,y,key+' code mismatch');console.log('CODE VERIFIED',key,a);
            }
          })().catch(e=>{console.error(String(e.message).replace(/https?:\S+/g,'[redacted]'));process.exit(1)});
          JS
          echo "VERIFIED FORK block=$BLOCK hash=$HASH"
          export ADMIN POL TEN TWENTY APPROVE
          node <<'JS'
          const E=require('ethers'), fs=require('fs'), assert=require('node:assert/strict');
          const p=new E.JsonRpcProvider('http://127.0.0.1:8545',1,{staticNetwork:true,cacheTimeout:-1});
          const W=10n**18n,SAFE=E.getAddress(process.env.SAFE),ADMIN=E.getAddress(process.env.ADMIN);
          const {SDT,WANT,LOCKER,STAKING,ROUTER,OLD,TEMPLATE,FACTORY,POL}=Object.fromEntries(['SDT','WANT','LOCKER','STAKING','ROUTER','OLD','TEMPLATE','FACTORY','POL'].map(k=>[k,E.getAddress(process.env[k])]));
          const ZERO=E.ZeroAddress,MULTI=E.getAddress('0xa238cbeb142c10ef7ad8442c6d1f9e89e07e7761'),HELPER='0x9b35af71d77eaf8d7e40252370304687390a1a52',NPM='0xc36442b4a4522e871399cd717abdd847ab11fe88',YEARN='0x2d9cc96463a0f21e9836cdb060226d033ec97c22';
          const CAP=16777216n;
          const J=x=>JSON.stringify(x,(_,v)=>typeof v==='bigint'?v.toString():v);
          const artifact=JSON.parse(fs.readFileSync('strategy-artifact.json','utf8'));
          const safeI=new E.Interface(['function nonce() view returns(uint256)','function getOwners() view returns(address[])','function getThreshold() view returns(uint256)','function getTransactionHash(address,uint256,bytes,uint8,uint256,uint256,uint256,address,address,uint256) view returns(bytes32)','function execTransaction(address,uint256,bytes,uint8,uint256,uint256,uint256,address,address,bytes) payable returns(bool)','event ExecutionSuccess(bytes32 indexed txHash,uint256 payment)','event ExecutionFailure(bytes32 indexed txHash,uint256 payment)']);
          const ms=new E.Interface(['function multiSend(bytes)']);
          const ci=new E.Interface(['function performCreate(uint256,bytes) returns(address)']);
          const erc=new E.Interface(['function balanceOf(address) view returns(uint256)','function approve(address,uint256) returns(bool)','function allowance(address,address) view returns(uint256)']);
          const vi=new E.Interface(['function initialize(address,string,string,uint256,address,address,bool,bool,bool)','function strategy() view returns(address)','function asset() view returns(address)','function name() view returns(string)','function symbol() view returns(string)','function withdrawalFeeBps() view returns(uint256)','function depositFeeBps() view returns(uint256)','function totalSupply() view returns(uint256)','function totalAssets() view returns(uint256)','function convertToAssets(uint256) view returns(uint256)','function previewQueuedRedeem(uint256) view returns(uint256)','function stakingExitFeePpm() view returns(uint256)']);
          const li=new E.Interface(['function poLDepositShareBps() view returns(uint16)','function cyvlSdtPoLContract() view returns(address)']);
          const fi=new E.Interface(['function deploy_plain_pool(string,string,address[],uint256,uint256,uint256,uint256,uint256,uint8[],bytes4[],address[]) returns(address)','function pool_count() view returns(uint256)','function pool_list(uint256) view returns(address)','function get_pool_asset_types(address) view returns(uint8[])']);
          const pi=new E.Interface(['function add_liquidity(uint256[],uint256,address) returns(uint256)','function stored_rates() view returns(uint256[])','function coins(uint256) view returns(address)']);
          const polI=new E.Interface(['function vaults(uint256) view returns(address)','function curvePool() view returns(address)','function uniTokenId() view returns(uint256)','function allocations(uint256) view returns(uint16)','function sdtVaultIndex() view returns(uint8)']);
          const ui=new E.Interface(['function ownerOf(uint256) view returns(address)']);
          const stI=new E.Interface(['function activeBalance(address) view returns(uint256)']);
          const read=async(to,I,f,args=[])=>I.decodeFunctionResult(f,await p.call({to,data:I.encodeFunctionData(f,args)}))[0];
          const bal=(t,a=SAFE)=>read(t,erc,'balanceOf',[a]);
          const eqaddr=(a,b)=>assert.equal(a.toLowerCase(),b.toLowerCase());
          const oldData='';
          const raw=E.getBytes(ms.decodeFunctionData('multiSend',oldData)[0]);
          const old=[];let off=0;
          while(off<raw.length){const op=raw[off],to=E.hexlify(raw.slice(off+1,off+21)),value=E.toBigInt(raw.slice(off+21,off+53)),length=Number(E.toBigInt(raw.slice(off+53,off+85)));assert.equal(value,0n);old.push({op,to,data:E.hexlify(raw.slice(off+85,off+85+length))});off+=85+length;}
          assert.equal(off,raw.length);assert.equal(old.length,18);assert.equal(old[0].op,1);
          const pack=list=>ms.encodeFunctionData('multiSend',[E.concat(list.map(x=>E.solidityPacked(['uint8','address','uint256','uint256','bytes'],[x.op,x.to,0,E.dataLength(x.data),x.data])))]);
          const call=(to,I,f,args,label)=>({op:0,to,data:I.encodeFunctionData(f,args),label});
          const create=(init,label)=>({op:1,to:HELPER,data:ci.encodeFunctionData('performCreate',[0,init]),label});
          const labelOld=['Deploy SDT Yearn strategy','Initialize cySDT-ETH vault','Register Yearn vault slot 0','100% Yearn allocation','Set liquidity bounds','Set PoL profit recipient','Redirect 25% locker PoL','Create Curve pool','Lock 20 SDT','Deposit 10 cyvlSDT','Approve SDT for Curve','Approve cyvlSDT for Curve','Approve vault shares for Curve','Seed Curve 10 each','Register Curve pool','Register Uniswap NFT','Transfer Uniswap NFT to PoL','Invest 5 SDT into Yearn'];
          old.forEach((x,i)=>x.label=labelOld[i]);
          (async()=>{
            assert.equal(await p.getBlockNumber(),Number(process.env.BLOCK));
            assert.equal(await read(SAFE,safeI,'nonce'),37n);
            assert.equal(await read(SAFE,safeI,'getThreshold'),1n);
            assert((await read(SAFE,safeI,'getOwners')).map(x=>x.toLowerCase()).includes(ADMIN.toLowerCase()));
            const createNonce=await p.getTransactionCount(SAFE);
            assert.equal(createNonce,14);
            assert.equal(await read(OLD,vi,'totalSupply'),0n);
            const yearn=E.getCreateAddress({from:SAFE,nonce:createNonce});
            const VAULT=E.getCreateAddress({from:SAFE,nonce:createNonce+1}),STRATEGY=E.getCreateAddress({from:SAFE,nonce:createNonce+2});
            eqaddr('0x'+old[1].data.slice(34,74),yearn);
            for(const a of [yearn,VAULT,STRATEGY])assert.equal(await p.getCode(a),'0x');
            const pool=E.getAddress(old[13].to);
            assert.equal(await p.getCode(pool),'0x');
            const nftId=E.toBigInt('0x'+old[15].data.slice(-64));
            eqaddr(await read(NPM,ui,'ownerOf',[nftId]),SAFE);
            const before={sdt:await bal(SDT),cyvlSDT:await bal(WANT),polSDT:await bal(SDT,POL),oldSupply:await read(OLD,vi,'totalSupply')};
            assert(before.sdt>=30n*W);assert.equal(before.cyvlSDT,0n);assert.equal(before.polSDT,0n);
            const cloneCode='0x3d602d80600a3d3981f3363d3d373d3d3d363d73'+TEMPLATE.slice(2).toLowerCase()+'5af43d82803e903d91602b57fd5bf3';
            const ctor=E.AbiCoder.defaultAbiCoder().encode(['address','address','address','address','address','address','address','uint16','uint16'],[SAFE,VAULT,WANT,SDT,STAKING,LOCKER,ROUTER,390,10]);
            const init=E.concat(['0x'+artifact.evm.bytecode.object,ctor]);
            const poolArgs=Array.from(fi.decodeFunctionData('deploy_plain_pool',old[7].data));
            poolArgs[0]='CurveYield SDT cyvlSDT cyvlSDT-V';assert(Buffer.byteLength(poolArgs[0])<=32);
            poolArgs[2]=[SDT,WANT,VAULT];
            for(const i of [8,9,10])poolArgs[i]=Array.from(poolArgs[i]);
            const list=[...old.slice(0,2),create(cloneCode,'Deploy replacement revenue vault clone'),create(init,'Deploy gross-NAV revenue strategy'),call(VAULT,vi,'initialize',[STRATEGY,'CurveYield vlSDT Vault','cyvlSDT-V',30n,ADMIN,SAFE,true,false,true],'Initialize cyvlSDT-V with 30 bps withdrawal fee'),...old.slice(2,7),call(FACTORY,fi,'deploy_plain_pool',poolArgs,'Create Curve SDT/cyvlSDT/cyvlSDT-V pool'),old[8],call(WANT,erc,'approve',[VAULT,10000n*W],'Approve cyvlSDT for new vault'),{...old[9],to:VAULT},old[10],old[11],{...old[12],to:VAULT},call(pool,pi,'add_liquidity',[[10n*W,10n*W,10n*W],297n*W/10n,POL],'Seed 10 each; mint LP to PoL'),...old.slice(14)];
            assert.equal(list.length,22);assert.equal(list.filter(x=>x.op===1).length,3);
            assert(!list.some(x=>x.data.slice(0,10)==='0x095ea7b3'&&E.toBigInt('0x'+x.data.slice(-64))===0n));
            const data=pack(list),args=[MULTI,0n,data,1,0n,0n,0n,ZERO,ZERO],safeHash=await read(SAFE,safeI,'getTransactionHash',[...args,37n]);
            const sig=E.concat([E.zeroPadValue(ADMIN,32),E.ZeroHash,'0x01']);
            const txData=safeI.encodeFunctionData('execTransaction',[...args,sig]);
            await p.send('anvil_impersonateAccount',[ADMIN]);await p.send('anvil_setBalance',[ADMIN,E.toQuantity(100n*W)]);
            console.log('PLAN',J({vault:VAULT,strategy:STRATEGY,yearn,pool,nftId,safeHash,bytes:E.dataLength(data),calls:list.map(x=>x.label),before}));
            const tx={from:ADMIN,to:SAFE,data:txData,gas:E.toQuantity(CAP)};
            const simulated=await p.send('eth_call',[tx,'latest']);
            assert.equal(safeI.decodeFunctionResult('execTransaction',simulated)[0],true);
            const gasEstimate=BigInt(await p.send('eth_estimateGas',[tx]));assert(gasEstimate<=CAP);
            const hash=await p.send('eth_sendTransaction',[tx]);let receipt=await p.send('eth_getTransactionReceipt',[hash]);
            if(!receipt)await p.send('evm_mine',[]);
            for(let i=0;i<80&&!receipt;i++){await new Promise(r=>setTimeout(r,250));receipt=await p.send('eth_getTransactionReceipt',[hash]);}
            assert(receipt);fs.writeFileSync('evidence/safe-receipt-v3.json',J(receipt));assert.equal(BigInt(receipt.status),1n);
            assert(receipt.logs.some(l=>l.address.toLowerCase()===SAFE.toLowerCase()&&l.topics[0]===safeI.getEvent('ExecutionSuccess').topicHash));
            assert.equal(await read(SAFE,safeI,'nonce'),38n);
            assert.equal(await p.getCode(VAULT),await p.getCode(OLD));
            eqaddr(await read(VAULT,vi,'strategy'),STRATEGY);eqaddr(await read(VAULT,vi,'asset'),WANT);
            assert.equal(await read(VAULT,vi,'name'),'CurveYield vlSDT Vault');assert.equal(await read(VAULT,vi,'symbol'),'cyvlSDT-V');
            assert.equal(await read(VAULT,vi,'withdrawalFeeBps'),30n);assert.equal(await read(VAULT,vi,'depositFeeBps'),0n);
            assert.equal(await read(VAULT,vi,'totalSupply'),10n*W);assert.equal(await read(VAULT,vi,'totalAssets'),10n*W);assert.equal(await read(VAULT,vi,'convertToAssets',[W]),W);
            assert.equal(await read(STAKING,stI,'activeBalance',[STRATEGY]),10n*W);
            assert.equal(await read(VAULT,vi,'previewQueuedRedeem',[W]),997n*W/1000n);
            assert.equal(await read(VAULT,vi,'stakingExitFeePpm'),32259n);
            for(const [i,t] of [SDT,WANT,VAULT].entries()){eqaddr(await read(pool,pi,'coins',[i]),t);assert.equal(await bal(t,pool),10n*W);}
            assert.deepEqual(Array.from(await read(pool,pi,'stored_rates')),[W,W,W]);assert.deepEqual(Array.from(await read(FACTORY,fi,'get_pool_asset_types',[pool])),[0n,0n,3n]);
            assert.equal(await bal(pool,POL),30n*W);
            eqaddr(await read(POL,polI,'curvePool'),pool);eqaddr(await read(POL,polI,'vaults',[0]),YEARN);
            assert.equal(await read(POL,polI,'uniTokenId'),nftId);eqaddr(await read(NPM,ui,'ownerOf',[nftId]),POL);
            assert.equal(await read(LOCKER,li,'poLDepositShareBps'),2500n);eqaddr(await read(LOCKER,li,'cyvlSdtPoLContract'),POL);
