name: PoL manager v24 ERC4626-only compile comparison
on:
  push:
    branches: [cyvlsdt-v69-postdeploy-simulation-v1]
    paths: ['.github/workflows/lite-phase0-source-zip-smoke-v1.yml', 'github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json', 'github-native-sim/cyvlsdt-runtime-compare-v1/v69-postdeploy-suite-v1.cjs']
permissions:
  contents: read
jobs:
  fork-gas:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FOUNDRY_OPTIMIZER_RUNS: '25'
      UPSTREAM_RPC: ${{ secrets.RPC_ETHEREUM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile verified v23 and slim v24 with identical settings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pol-v24-report
          python3 - <<'PY'
          import json,pathlib,difflib
          c=json.loads(pathlib.Path('github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json').read_text())['polManagerV24']
          out=pathlib.Path('/tmp/pol-v24-report')
          for version,part in [('v23',c['baseline']),('v24',c['candidate'])]:
              root=pathlib.Path('/tmp/pol-'+version);root.mkdir(exist_ok=True)
              f=root/part['path'];f.parent.mkdir(exist_ok=True);f.write_text(part['source'])
              (out/f.name).write_text(part['source'])
              (root/'foundry.toml').write_text('[profile.default]\nsrc="contracts"\nsolc_version="0.8.28"\noptimizer=true\noptimizer_runs=200\nvia_ir=true\nevm_version="cancun"\n')
          (out/'PoL-v24-source-diff.patch').write_text(''.join(difflib.unified_diff(c['baseline']['source'].splitlines(keepends=True),c['candidate']['source'].splitlines(keepends=True),fromfile=c['baseline']['path'],tofile=c['candidate']['path'])))
          (out/'PoL-v24-config.json').write_text(json.dumps(c['intendedConfig'],indent=2))
          PY
          FOUNDRY_OPTIMIZER_RUNS=200 forge build --root /tmp/pol-v23 --skip test --skip script
          FOUNDRY_OPTIMIZER_RUNS=200 forge build --root /tmp/pol-v24 --skip test --skip script
          python3 - <<'PY'
          import json,pathlib
          out=pathlib.Path('/tmp/pol-v24-report')
          def read(v):return json.loads(pathlib.Path('/tmp/pol-'+v+'/out/PoL_Manager_Contract_'+v+'.sol/PoLManager.json').read_text())
          a,b=read('v23'),read('v24')
          def size(o):return {k:len(bytes.fromhex(o[k]['object'].removeprefix('0x'))) for k in ['bytecode','deployedBytecode']}
          def signatures(o):return {f['name']+'('+','.join(x['type'] for x in f['inputs'])+')' for f in o['abi'] if f['type']=='function'}
          x,y=size(a),size(b)
          result={'baseline':x,'candidate':y,'delta':{k:y[k]-x[k] for k in x},'removed':sorted(signatures(a)-signatures(b)),'added':sorted(signatures(b)-signatures(a)),'compiler':'0.8.28','optimizerRuns':200,'viaIR':True,'evmVersion':'cancun','testsExecuted':False}
          assert y['deployedBytecode']<24576
          (out/'PoL-v24-compilation.json').write_text(json.dumps(result,indent=2))
          (out/'PoLManager-v24-artifact.json').write_text(json.dumps(b))
          print('POL_V24_COMPILE',json.dumps(result),flush=True)
          PY
      - name: Retain PoL source and compilation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CurveYield-PoL-Manager-v24
          path: /tmp/pol-v24-report/
          if-no-files-found: error
