              forking:{url:process.env.RPC_ETHEREUM},
              throwOnTransactionFailures:false,
              throwOnCallFailures:true,
              mining:{auto:true}
            }}
          };
          HARDHAT_CONFIG
          export NODE_PATH="$GITHUB_WORKSPACE/.slip-deps28/node_modules"
          export HARDHAT_CONFIG="$GITHUB_WORKSPACE/hardhat.config.cjs"
          node github-native-sim/cyvlsdt-runtime-compare-v1/pol-slippage-75bps-v2/fork-stress-v2.cjs \
            2>&1 | tee github-native-sim/cyvlsdt-runtime-compare-v1/pol-slippage-75bps-v2/outputs-v2/fork-run.log
          test -s github-native-sim/cyvlsdt-runtime-compare-v1/pol-slippage-75bps-v2/outputs-v2/Fork-Stress-Results-v2.json
      - name: Preserve compiled artifacts, exact calldata and fork receipts on GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-native-sim/cyvlsdt-runtime-compare-v1/pol-slippage-75bps-v2/outputs-v2/
          git commit -m 'Preserve v21+v7 75/200-bps compiled artifacts and adversarial fork evidence v2'
          git push origin HEAD:cyvlsdt-pol-slippage-75bps-v2
      - name: Upload v2 compiled and fork-tested deployment package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CurveYield-PoL-v21-BoundsV7-75bps-ForkProof-v2
          path: |
            github-native-sim/cyvlsdt-runtime-compare-v1/pol-slippage-75bps-v2/*.sol
            github-native-sim/cyvlsdt-runtime-compare-v1/pol-slippage-75bps-v2/*.cjs
            github-native-sim/cyvlsdt-runtime-compare-v1/pol-slippage-75bps-v2/outputs-v2/
          if-no-files-found: warn
          retention-days: 90
