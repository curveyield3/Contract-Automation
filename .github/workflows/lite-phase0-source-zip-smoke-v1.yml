name: Exact executed nonce36 verification input v27
on:
  push:
    branches: [cyvlsdt-v69-postdeploy-simulation-v1]
    paths: ['.github/workflows/lite-phase0-source-zip-smoke-v1.yml', 'github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json', 'github-native-sim/cyvlsdt-runtime-compare-v1/v69-postdeploy-suite-v1.cjs']
permissions:
  contents: read
  actions: read
jobs:
  fork-gas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FOUNDRY_OPTIMIZER_RUNS: '25'
      UPSTREAM_RPC: ${{ secrets.RPC_ETHEREUM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover retained compiler artifacts and pinned dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 45386347328 -n CurveYield-Deployment-Headers-v1 -D /tmp/header-evidence
          npm install --prefix /tmp/verify36 --ignore-scripts --no-audit --no-fund --no-save '@openzeppelin/contracts@5.4.0' '@openzeppelin-4/contracts@npm:@openzeppelin/contracts@4.9.6' '@openzeppelin/contracts-upgradeable@4.9.6' 'ethers@6.17.0'
      - name: Assemble exact verified standard JSON from compiler metadata
        run: |
          set -euo pipefail
          cd /tmp/verify36
          node <<'JS'
          const fs=require('fs'),E=require('ethers'),assert=require('assert/strict');
          const root='/tmp/header-evidence';
          for(const name of ['CurveYieldvlSDTStaking','CurveYieldRevenueStrategyV8','CurveYieldVlSDTBoostMerchant','PoLManager']){
            const a=JSON.parse(fs.readFileSync(root+'/artifacts/'+name+'/header.json'));
            const m=typeof a.metadata==='string'?JSON.parse(a.metadata):a.metadata;
            const settings={...m.settings};const target=Object.entries(settings.compilationTarget)[0];delete settings.compilationTarget;
            settings.outputSelection={'*':{'*':['abi','evm.bytecode','evm.deployedBytecode','metadata']}};
            const sources={};
            for(const [p,v] of Object.entries(m.sources)){
              const f=p.startsWith('node_modules/')?'/tmp/verify36/'+p:root+'/compiler-inputs/'+(name==='PoLManager'?'pol-header':'cyv-header69')+'/'+p;
              const content=fs.readFileSync(f,'utf8');assert.equal(E.keccak256(E.toUtf8Bytes(content)),v.keccak256,p);
              sources[p]={content};
            }
            const out=JSON.stringify({name,contractName:target.join(':'),compilerVersion:'v'+m.compiler.version,input:{language:'Solidity',sources,settings},creation:a.bytecode.object,runtimeBytes:E.dataLength(a.deployedBytecode.object),constructor:a.abi.find(x=>x.type==='constructor')?.inputs||[]});
            for(let i=0;i<out.length;i+=6000)console.log('VERIFY36_CHUNK '+JSON.stringify({name,offset:i,data:out.slice(i,i+6000)}));
            console.log('VERIFY36_READY '+JSON.stringify({name,length:out.length,sources:Object.keys(sources).length,creationBytes:E.dataLength(a.bytecode.object)}));
          }
          JS
