name: Lite Phase 0 Archived Source ZIP Smoke v1

# Isolated compile-only adaptation for the exact private DEX v6 source.
# The main-branch workflow remains unchanged.
on:
  push:
    branches: [development/dex-native-fees-v4-compile]
    paths:
      - '.github/smoke-trigger/lite-phase0-source-zip-smoke-v1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dex-native-fees-v4-compile
  cancel-in-progress: false

jobs:
  source-zip-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_BLOB: bfbf6dbc52e1e4ad52c1eea6e9abf71eba60b425
      SOURCE_SHA256: 6149391584065985b945c52fcacd06bdd6205055c3d2589e6930aa951b800c24
      SOURCE_COMMIT: 81ed2de7b78cd9265730b6df857262266f78f908
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and verify exact private source
        id: source
        env:
          GH_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .source-zip-smoke .source-project
          gh api "repos/curveyield3/Audit-Controller/git/blobs/$SOURCE_BLOB" --jq .content | base64 --decode > .source-zip-smoke/source.zip
          echo "$SOURCE_SHA256  .source-zip-smoke/source.zip" | sha256sum -c
          python3 - <<'PY'
          import os, pathlib, zipfile
          dest = pathlib.Path(".source-project")
          with zipfile.ZipFile(".source-zip-smoke/source.zip") as z:
              assert z.testzip() is None
              for m in z.infolist():
                  p = pathlib.PurePosixPath(m.filename)
                  assert not p.is_absolute() and ".." not in p.parts
              z.extractall(dest)
          project = dest / "CurveYield_DEX_Simplified_Native_Fees_v6" / "workspace" / "contracts-repo" / "CurveYield DEX"
          assert (project / "package-lock.json").is_file()
          assert (project / "tooling/scripts/deployCurveYieldDexFresh.mjs").is_file()
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"project_dir={project}\n")
          PY
      - name: Install locked compiler dependencies
        id: install
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm ci --no-audit --no-fund --ignore-scripts > "$GITHUB_WORKSPACE/.source-zip-smoke/install.log" 2>&1
          compiler_dir="$(mktemp -d)"
          npm install --prefix "$compiler_dir" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund solc-0.8.26@npm:solc@0.8.26 solc-0.8.27@npm:solc@0.8.27 >> "$GITHUB_WORKSPACE/.source-zip-smoke/install.log" 2>&1
          ln -s "$compiler_dir/node_modules/solc-0.8.26" node_modules/solc-0.8.26
          ln -s "$compiler_dir/node_modules/solc-0.8.27" node_modules/solc-0.8.27
      - name: Compile DEX with its existing deployment compiler
        id: compile
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm run ops:compile-curveyield-dex > "$GITHUB_WORKSPACE/.source-zip-smoke/compile.log" 2>&1
      - name: Preserve private compile evidence
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
          SOURCE_STATUS: ${{ steps.source.outcome }}
          INSTALL_STATUS: ${{ steps.install.outcome }}
          COMPILE_STATUS: ${{ steps.compile.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .source-zip-smoke
          python3 - <<'PY'
          import os, json, pathlib, base64
          d=pathlib.Path(".source-zip-smoke")
          project=pathlib.Path(os.environ["PROJECT_DIR"]) if os.environ.get("PROJECT_DIR") else None
          reports=sorted((project/"deployment-artifacts").glob("curveyield-dex-fresh-*.json")) if project else []
          def log(name):
              p=d/name
              return p.read_text(errors="replace")[-150000:] if p.exists() else None
          result=dict(sourceBlob=os.environ["SOURCE_BLOB"],sourceSha256=os.environ["SOURCE_SHA256"],sourceCommit=os.environ["SOURCE_COMMIT"],runId=os.environ["GITHUB_RUN_ID"],runAttempt=os.environ["GITHUB_RUN_ATTEMPT"],sourceStatus=os.environ["SOURCE_STATUS"],installStatus=os.environ["INSTALL_STATUS"],compileStatus=os.environ["COMPILE_STATUS"],installLog=log("install.log"),compileLog=log("compile.log"),buildReport=json.loads(reports[-1].read_text()) if reports else None)
          (d/"compile-evidence.json").write_text(json.dumps(result,indent=2)+"\n")
          PY
          target="campaigns/CurveYield_DEX_Simplified_Native_Fees_v6_compile.json"
          ref="development/dex-simplified-native-fees-v1"
          old="$(gh api "repos/curveyield3/Audit-Controller/contents/$target?ref=$ref" --jq .sha 2>/dev/null || true)"
          base64 -w0 .source-zip-smoke/compile-evidence.json > .source-zip-smoke/evidence.b64
          jq -n --arg branch "$ref" --arg old "$old" --arg msg "Record DEX v6 compile evidence (run $GITHUB_RUN_ID)" --rawfile content .source-zip-smoke/evidence.b64 '{branch:$branch,message:$msg,content:$content} + (if $old=="" then {} else {sha:$old} end)' > .source-zip-smoke/upload.json
          gh api --method PUT "repos/curveyield3/Audit-Controller/contents/$target" --input .source-zip-smoke/upload.json --silent
          echo "Private evidence recorded. Source: $SOURCE_STATUS; install: $INSTALL_STATUS; compile: $COMPILE_STATUS"
