name: Header-amended Safe proposals 37 and 38 fork assembly v4
on:
  push:
    branches: [cyvlsdt-v69-postdeploy-simulation-v1]
    paths: ['.github/workflows/lite-phase0-source-zip-smoke-v1.yml', 'github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json', 'github-native-sim/cyvlsdt-runtime-compare-v1/v69-postdeploy-suite-v1.cjs']
permissions:
  contents: read
  actions: read
jobs:
  fork-gas:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FOUNDRY_OPTIMIZER_RUNS: '25'
      UPSTREAM_RPC: ${{ secrets.RPC_ETHEREUM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Materialize exact v64 source and benchmark-only optimization candidate
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/curveyield3/Smart-Contracts/6b058498554f58936daf1216c222d554ee666f5e/Audit-Intake/CurveYield-cyvlSDT-Deployment-Package-v64.zip' -o /tmp/cyv64.zip
          echo 'a2d46ab6bf63a760efecf914f36419b8ec271c0e36f9b3ee9821cd842ea0d7ee  /tmp/cyv64.zip' | sha256sum -c -
          mkdir -p /tmp/cyv64 /tmp/cyv65
          unzip -q /tmp/cyv64.zip -d /tmp/cyv64
          cp -a /tmp/cyv64/contracts /tmp/cyv65/
          mkdir -p /tmp/cyv-deps
          npm install --prefix /tmp/cyv-deps --ignore-scripts --no-audit --no-fund --no-save '@openzeppelin/contracts@5.4.0' '@openzeppelin-4/contracts@npm:@openzeppelin/contracts@4.9.6' '@openzeppelin/contracts-upgradeable@4.9.6' 'ethers@6.17.0'
          ln -s /tmp/cyv-deps/node_modules /tmp/cyv64/node_modules
          ln -s /tmp/cyv-deps/node_modules /tmp/cyv65/node_modules
          for ROOT in /tmp/cyv64 /tmp/cyv65; do
            rm -f "$ROOT/contracts/PoL_Manager_Contract_v22.sol" "$ROOT/contracts/VoteMarketSingleGaugeBribeAllocator.sol"
            rm -rf "$ROOT/contracts/external_guard_v8"
            cat > "$ROOT/foundry.toml" <<'EOF'
          [profile.default]
          src = "contracts"
          out = "out"
          libs = ["node_modules"]
          remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/", "@openzeppelin-4/contracts/=node_modules/@openzeppelin-4/contracts/", "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/"]
          solc_version = "0.8.28"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          evm_version = "cancun"
          EOF
          done
          python3 - <<'PY'
          import json,pathlib
          p=json.loads(pathlib.Path('github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json').read_text())
          exec(compile(p['transform'],'v65-transform','exec'))
          exec(compile(p['unifiedTransform'],'v66-transform','exec'))
          exec(compile(p['packingTransform'],'v67-transform','exec'))
          PY
      - name: Compile pinned original proposal artifacts and updated vault and SDT strategy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v72-report
          FOUNDRY_OUT=out-25-v69 forge build --root /tmp/cyv65 --force --skip test --skip script
          python3 - <<'PY'
          import json,pathlib,re,difflib
          p=json.loads(pathlib.Path('github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json').read_text())
          exec(compile(p['vaultEmergencyCapabilityPatch'],'v70-vault-capability','exec'))
          exec(compile(p['vaultMintAllowancePatch'],'v71-mint-allowance','exec'))
          f=pathlib.Path('/tmp/cyv65/contracts/StrategyCurveSDTYearnRebindable.sol')
          before=f.read_text()
          after,n=re.subn(r'(\bCURVE_LP_SLIPPAGE_BPS\s*=\s*)200\b',r'\g<1>100',before)
          assert n==1,('expected exactly one 200 bps SDT slippage constant',n)
          assert re.search(r'quoteDeposit\s*\([^;]*CURVE_LP_SLIPPAGE_BPS',after)
          assert re.search(r'quoteWithdraw\s*\([^;]*CURVE_LP_SLIPPAGE_BPS',after)
          f.write_text(after)
          diff=''.join(difflib.unified_diff(before.splitlines(keepends=True),after.splitlines(keepends=True),fromfile='v71/'+f.name,tofile='v72/'+f.name))
          print('SDT_SLIPPAGE_SOURCE_DIFF\n'+diff,flush=True)
          out=pathlib.Path('/tmp/v72-report')
          (out/'StrategyCurveSDTYearnRebindable-v72.sol').write_text(after)
          (out/'SDT-slippage-diff-v1.patch').write_text(diff)
          (out/'BeefyVaultCurveYieldV8cyvlSDT-v71.sol').write_text(pathlib.Path('/tmp/cyv65/contracts/BeefyVaultCurveYieldV8cyvlSDT.sol').read_text())
          pathlib.Path('/tmp/cyv64/replay.cjs').write_text(p['replay'])
          PY
          FOUNDRY_OUT=out-25-v72 forge build --root /tmp/cyv65 --force --skip test --skip script
          python3 - <<'PY'
          import pathlib,json
          root=pathlib.Path('/tmp/cyv65')
          report={}
          for name in ['BeefyVaultCurveYieldV8cyvlSDT','StrategyCurveSDTYearnRebindable']:
              a=json.loads((root/'out-25-v69'/(name+'.sol')/(name+'.json')).read_text())
              b=json.loads((root/'out-25-v72'/(name+'.sol')/(name+'.json')).read_text())
              sizes=lambda v:{k:len(bytes.fromhex(v[k]['object'].removeprefix('0x'))) for k in ['bytecode','deployedBytecode']}
              report[name]={'before':sizes(a),'after':sizes(b)}
              assert report[name]['after']['deployedBytecode']<=24576
          pathlib.Path('/tmp/v72-report/Compiled-size-v72.json').write_text(json.dumps(report,indent=2))
          print('COMPILED_SIZE_V72',json.dumps(report))
          PY
      - name: Retrieve immutable header-amended compiler evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 45386347328 -n CurveYield-Deployment-Headers-v1 -D /tmp/header-evidence
          test -s /tmp/header-evidence/artifacts/PoLManager/header.json
          test -s /tmp/header-evidence/artifacts/CurveYieldSDTShareOracle/header.json
      - name: Fork replay final queued payloads and assemble proposals 37 and 38
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPSTREAM_RPC"
          export FORK_BLOCK=26484858
          anvil --fork-url "$UPSTREAM_RPC" --fork-block-number "$FORK_BLOCK" --host 127.0.0.1 --port 8545 --silent >/tmp/anvil.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import pathlib
          f=pathlib.Path('/tmp/cyv64/replay.cjs')
          s=f.read_text()
          old=' await post.run(p,A,SAFE,EOA,artifactForSuite,current,POL);'
          assert s.count(old)==1
          experiment="\n const W=10n**18n, lower=x=>x.toLowerCase(), z=E.ZeroAddress;\n const header='/tmp/header-evidence/artifacts';\n const pa=JSON.parse(fs.readFileSync(header+'/PoLManager/header.json')),oa=JSON.parse(fs.readFileSync(header+'/CurveYieldSDTShareOracle/header.json'));\n const pif=new E.Interface(pa.abi),oif=new E.Interface(oa.abi);\n const erc=new E.Interface(['function approve(address,uint256) returns(bool)','function balanceOf(address) view returns(uint256)']);\n const vi=new E.Interface(artifact(current,contracts.impl).abi),li=new E.Interface(artifact(old,contracts.locker).abi);\n const faddr=E.getAddress('0x6a8cbed756804b16e05e741edabd5cb544ae21bf'),npm=E.getAddress('0xc36442b4a4522e871399cd717abdd847ab11fe88');\n const fi=new E.Interface(['function deploy_plain_pool(string,string,address[],uint256,uint256,uint256,uint256,uint256,uint8[],bytes4[],address[]) returns(address)','function pool_count() view returns(uint256)','function pool_list(uint256) view returns(address)','function get_pool_asset_types(address) view returns(uint8[])']);\n const ni=new E.Interface(['function createAndInitializePoolIfNecessary(address,address,uint24,uint160) payable returns(address)','function mint((address,address,uint24,int24,int24,uint256,uint256,uint256,uint256,address,uint256)) payable returns(uint256,uint128,uint256,uint256)','function ownerOf(uint256) view returns(address)','function positions(uint256) view returns(uint96,address,address,address,uint24,int24,int24,uint128,uint256,uint256,uint128,uint128)','function safeTransferFrom(address,address,uint256)','event Transfer(address indexed from,address indexed to,uint256 indexed tokenId)']);\n const fac3=new E.Contract(faddr,fi,p),np=new E.Contract(npm,ni,p);\n const tokens=[SDT,A.token,A.rvault],sdcrv=E.getAddress('0xd1b5651e55d4ceed36251c61c50c889b36f6abb5'),sdfxn=E.getAddress('0xe19d1c837b8a1c83a56cd9165b2c0256d39653ad');\n const crvToken=E.getAddress('0xd533a949740bb3306d119cc777fa900ba034cd52'),guardAddr=E.getAddress('0xab989d9daa0279e123d453204545be556f2d3072');\n const bal=async(token,account=SAFE)=>new E.Contract(token,erc,p).balanceOf(account);\n const preNonce=await p.getTransactionCount(SAFE,'latest'),newPol=E.getCreateAddress({from:SAFE,nonce:preNonce}),createHelper=deployments[0].to;\n const pcfg=[SAFE,[A.svault,z,z,z,z],0,crvToken,A.token,SDT,USDC,ROUTER];\n const deploy={op:1,to:createHelper,value:0n,data:ci.encodeFunctionData('performCreate',[0n,E.concat([pa.bytecode.object,pif.encodeDeploy([pcfg])])]),label:'Deploy header-amended PoLManager v26'};\n const approve=(t,to,amount)=>call(t,erc,'approve',[to,amount],'Approve '+t+' for '+to);\n const P=(m,a)=>call(newPol,pif,m,a,m);\n const count=await fac3.pool_count();\n const poolParams=['CurveYield SDT cyvlSDT cyvlSDTav','cySDT-3',tokens,500n,20000000n,25000000000n,300n,0n,[0,0,3],['0x00000000','0x00000000','0x00000000'],[z,z,z]];\n assert(BigInt(SDT)<BigInt(A.token));\n const deadline=BigInt((await p.getBlock('latest')).timestamp)+7n*86400n;\n const core=[deploy,P('setLiquidityBounds',[guardAddr]),P('setProfitRecipient',[A.locker]),P('setAllocations',[[0,0,10000,0,0,0,0]]),call(A.locker,li,'setPoLDepositShare',[2500,newPol],'Rebind locker PoL at 25%'),approve(SDT,A.locker,20n*W),call(A.locker,li,'deposit',[20n*W,SAFE],'Lock 20 SDT'),approve(A.token,A.rvault,10n*W),call(A.rvault,vi,'deposit(uint256,address)',[10n*W,SAFE],'Deposit 10 cyvlSDT'),call(faddr,fi,'deploy_plain_pool',poolParams,'Create three-coin Curve pool'),call(npm,ni,'createAndInitializePoolIfNecessary',[SDT,A.token,10000,2n**96n],'Create Uniswap 1% pool at 1:1'),approve(SDT,npm,W),call(npm,ni,'mint',[[SDT,A.token,10000,0,13800,W,0n,995n*W/1000n,0n,SAFE,deadline]],'Mint approximately 1 SDT single-sided NFT')];\n const migration=[]; // Only direct Safe-held sdCRV and sdFXN are deposited. No legacy vault interactions.\n migration.push(approve(sdcrv,A.crvVault,E.MaxUint256),call(A.crvVault,vi,'depositAll',[],'Deposit all Safe sdCRV'),approve(sdcrv,A.crvVault,0n),approve(sdfxn,A.fxnVault,E.MaxUint256),call(A.fxnVault,vi,'depositAll',[],'Deposit all Safe sdFXN'),approve(sdfxn,A.fxnVault,0n));\n const tracked=[SDT,A.token,A.rvault,sdcrv,sdfxn,A.crvVault,A.fxnVault,A.svault];\n const before=async()=>Object.fromEntries(await Promise.all(tracked.map(async t=>[t,await bal(t)])));\n const report={forkBlock:Number(process.env.FORK_BLOCK),newPol,deadline,preNonce,proposals:[]};\n async function batch(list,nonce){\n  assert.equal(await safe.nonce(),BigInt(nonce));const args=safeArgs(list),gas=await estimate(list);\n  assert(await safe.execTransaction.staticCall(...args,{gasLimit:cap}),'Safe static call failed');\n  const hash=await safe.getTransactionHash(...args.slice(0,9),nonce),pre=await before();\n  const rec=await (await safe.execTransaction(...args,{gasLimit:cap})).wait();assert.equal(rec.status,1);assert.equal(await safe.nonce(),BigInt(nonce+1));const after=await before();\n  const record={safe:SAFE,to:MULTI,value:'0',data:args[2],operation:1,nonce,safeTxGas:'0',baseGas:'0',gasPrice:'0',gasToken:z,refundReceiver:z,safeTxHash:hash};\n  const info={nonce,hash,gasEstimate:gas,gasUsed:rec.gasUsed,calls:list.map(x=>({label:x.label,to:x.to,operation:x.op,selector:x.data.slice(0,10)})),pre,after};\n  report.proposals.push({record,info});fs.writeFileSync(output+'/Final-proposal-stack-v4.json',J(report));log('FINAL_BATCH',info);await post.deploymentReceipt(p,rec,'Safe proposal '+nonce);return rec;\n }\n // Both pool creations precede the dependent registrations; shift the large PoL deployment to nonce 38.\n const poolCreation=core.slice(9);\n const polSetup=core.slice(0,9);\n let first37=poolCreation,rest=migration;\n for(let n=1;n<=poolCreation.length;n++){const gas=await estimate(poolCreation.slice(0,n));log('REBALANCED_PREFIX_OK',{n,label:poolCreation[n-1].label,gas});}\n try{const gas=await estimate([...poolCreation,...migration]);first37=[...poolCreation,...migration];rest=[];log('MIGRATION_FITS_37',{gas});}catch(e){log('MIGRATION_DEFERRED_TO_38',{reason:String(e.shortMessage||e.message).slice(0,500)});}\n const r37=await batch(first37,37);\n assert.equal(await fac3.pool_count(),count+1n);const pool=await fac3.pool_list(count);\n assert.deepEqual(Array.from(await fac3.get_pool_asset_types(pool)),[0n,0n,3n]);\n let id;for(const event of r37.logs){if(lower(event.address)!==lower(npm))continue;try{const x=ni.parseLog(event);if(x.name==='Transfer'&&x.args.from===z&&lower(x.args.to)===lower(SAFE))id=x.args.tokenId;}catch{}}\n assert(id!==undefined,'NFT mint missing');assert.equal(lower(await np.ownerOf(id)),lower(SAFE));\n const pos=await np.positions(id);assert.equal(pos[4],10000n);assert.equal(pos[5],0n);assert.equal(pos[6],13800n);assert(pos[7]>0n);\n report.pool=pool;report.nftId=id;report.nftRange=[0,13800];report.newPol=newPol;\n const record37=report.proposals[0].record;fs.writeFileSync(output+'/Safe-proposal-37-v4.json',J(record37));fs.writeFileSync(output+'/Final-proposal-stack-v4.json',J(report));\n log('PROPOSAL37_READY',{hash:record37.safeTxHash,pool,nftId:id,newPol,gas:r37.gasUsed,deferredMigration:rest.length});\n for(let i=0;i<record37.data.length;i+=5000)log('PROPOSAL37_DATA',{offset:i,data:record37.data.slice(i,i+5000)});\n // Proposal 38 is simulated but not usable until actual pool and NFT identifiers are read from execution of 37.\n const pooli=new E.Interface(['function add_liquidity(uint256[],uint256) returns(uint256)','function price_oracle(uint256) view returns(uint256)','function get_dy(int128,int128,uint256) view returns(uint256)','function coins(uint256) view returns(address)']);\n assert.equal(await p.getTransactionCount(SAFE,'latest'),preNonce,'pool factories do not consume Safe CREATE nonce'); const oracleAddress=E.getCreateAddress({from:SAFE,nonce:preNonce+1});\n const oracleDeploy={op:1,to:createHelper,value:0n,data:ci.encodeFunctionData('performCreate',[0n,E.concat([oa.bytecode.object,oif.encodeDeploy([pool,...tokens])])]),label:'Deploy header-amended share oracle'};\n const routes=[];\n for(let i=0;i<3;i++)for(let k=0;k<3;k++)if(i!==k){\n  const pair=i===0||k===0?(i===2||k===2?1:0):2;\n  const hop=[7,tokens[k],pool,E.ZeroHash,ac.encode(['uint8','uint8'],[i,k]),[pair===0?pool:oracleAddress,E.id('price_oracle(uint256)').slice(0,10),ac.encode(['uint256'],[pair]),i<k,18]];\n  assert.equal(await router.routeLength(tokens[i],tokens[k]),0n);\n  routes.push(call(ROUTER,ri,'setRouteConfig',[tokens[i],tokens[k],[hop],fee,150],'Route '+i+'->'+k));\n }\n const second38=[...polSetup,...rest,...tokens.map(t=>approve(t,pool,W)),call(pool,pooli,'add_liquidity',[[W,W,W],1n],'Seed 1 unit each'),P('configureCurvePool',[pool]),call(pool,erc,'approve',[newPol,W*3n],'Approve LP to manager')];\n // LP must be transferred as all actual minted shares; the exact minted balance is 3 units in this initialized equal-rate pool.\n const lpI=new E.Interface(['function transfer(address,uint256) returns(bool)']);\n second38.pop();second38.push(call(pool,lpI,'transfer',[newPol,3n*W],'Transfer initial LP to PoL'),P('configureUniswapPosition',[npm,id]),call(npm,ni,'safeTransferFrom',[SAFE,newPol,id],'Transfer NFT to PoL'),oracleDeploy,...routes);\n for(let n=1;n<=second38.length;n++){try{const gas=await estimate(second38.slice(0,n));log('SECOND_PREFIX_OK',{n,label:second38[n-1].label,gas});}catch(e){log('SECOND_PREFIX_FAIL',{n,label:second38[n-1].label,error:String(e.shortMessage||e.message).slice(0,500)});throw e;}}\n await batch(second38,38);\n assert.notEqual(await p.getCode(newPol),'0x');const manager=new E.Contract(newPol,pa.abi,p);\n assert.equal(lower(await manager.owner()),lower(SAFE));assert.equal(lower(await manager.cyvlSDT()),lower(A.token));assert.equal(lower(await manager.vaults(0)),lower(A.svault));assert.equal(await manager.allocations(2),10000n);assert.equal(lower(await manager.liquidityBounds()),lower(guardAddr));assert.equal(lower(await manager.profitRecipient()),lower(A.locker));\n\n assert.equal(lower(await manager.curvePool()),lower(pool));assert.equal(lower(await np.ownerOf(id)),lower(newPol));assert.equal(await manager.uniTokenId(),id);assert.equal(await bal(sdcrv),0n);assert.equal(await bal(sdfxn),0n);\n assert(await bal(A.crvVault)>0n);assert(await bal(A.fxnVault)>0n);\n const oracle=new E.Contract(oracleAddress,oa.abi,p);assert.equal(lower(await oracle.pool()),lower(pool));for(let i=0;i<3;i++)for(let k=0;k<3;k++)if(i!==k)assert(await router.price_oracle(tokens[i],tokens[k])>0n);\n report.complete=true;report.oracleAddress=oracleAddress;fs.writeFileSync(output+'/Final-proposal-stack-v4.json',J(report));log('FINAL_STACK_COMPLETE',{newPol,pool,nftId:id,oracleAddress,proposals:report.proposals.map(x=>({nonce:x.record.nonce,hash:x.record.safeTxHash,gas:x.info.gasUsed}))});\n"
          s=s.replace(old,experiment)
          old='const args=safeArgs(list);assert.equal(await safe.nonce(),BigInt(nonce));'
          assert s.count(old)==1
          s=s.replace(old,old+"const patches={34:[[20809,\"dce823ed9948a98376ee3975c9c5d9b29a23389ee1f7161b1ecc7e508b05d190\",\"844711a051a2b39d54cc31c8cb6ff249ac0e93d41030e68191ffe12ef8de05e9\"],[38469,\"ad2cb09f3decb9f830597c8d94a678acbf81bfb49df6dd1dfa7d49f772b9878e\",\"03182f0ee791c5e0197fbf3aa7d77fc6650da03af09e664cdcaf0e127ad24718\"],[47317,\"6ec0931a432df24e9d17c67e7aafe797284cc54bb10c51ef21f1ef67a0e6c1b0\",\"06b3bc49bda13b98f5af9dc5a89d2936c8d5853d2439a5f2ed19f07485029de5\"]],35:[[3594,\"b6298c09be3cb029d2205da3c01600fba6d78e0a2a8a06382c2ba501d1354142\",\"0fb7a8e03c489d51d1090929855c54608704bd8085a4df793c97d6819980f3f3\"],[20862,\"97aec27d8c9195d28aa6e4d1200f87d30a4bdcd4c0fec15f3b44f4266961c4db\",\"2a2459df300f1cd54c8904693813ba2871479372be05c6fe6f4045815f9dbdea\"],[36646,\"ef99e0b3c5d30509fac04ee99b3f48b42da89234922ee3158e12ac6b554d0e4b\",\"cfe9b9f51df66440b265b96fdb2e45bb9e2dc228aad463e0e481629b4255dbaa\"],[49319,\"8307fdbc2cead67635478b962d83e6685b233ff367986094a545f6422480847d\",\"495e67f5f75b2fee06d9651fdfecc97e0d8dc6f71374c0ecf31348cdcfec7133\"],[61296,\"530b5f3987545bb7672b1c3dab1fb4450d4876d01a31c2a665d8b75ecb0cf571\",\"09a906ca63858baabea685735d9fc1aec05404e6c81640c9d5179e0ff0322a38\"],[71915,\"607765eecd37a7110a15e5be01fd1d28f4cabf68ab8958622e9c05ae4426f463\",\"662be53bec0ffa85bff2d6f6111492f6c22f6117275aafff573b9177b88bc155\"]]};for(const [off,a,b] of patches[nonce]||[]){const i=2+2*off;assert.equal(args[2].slice(i,i+a.length),a);args[2]=args[2].slice(0,i)+b+args[2].slice(i+a.length)};")
          s=s.replace('0xa71a462f986ae34e48ae76de4a06c3e39dc1fdeee5f0dc6073f033e0f1960c14','0x4802a84de6417ad35eb65d726e243ef2bce72d2122c3598d4c2e6aef5479229b').replace('0xef9f3557b876ca55928bd86b79583c74723499a7e299bad42a6e6a7569d1455d','0x7863d10f8fcbd00e8be012cdf5cca370c869bd54311f8c88cd81b01c867bfe06')
          f.write_text(s)
          PY
          node /tmp/cyv64/replay.cjs
      - name: Retain final proposal payloads and fork evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CurveYield-Final-Proposal-Stack-v4
          path: /tmp/v72-report/
          if-no-files-found: error
