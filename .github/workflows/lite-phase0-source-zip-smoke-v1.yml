name: Lite Phase 0 Archived Source ZIP Smoke v1

# Isolated compile-only adaptation for the verified private DEX v16 workspace.
# The main-branch workflow remains unchanged.
on:
  push:
    branches: [development/dex-native-fees-v13-compile]
    paths:
      - '.github/smoke-trigger/lite-phase0-source-zip-smoke-v1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dex-native-fees-v13-compile
  cancel-in-progress: false

jobs:
  source-zip-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_BLOB: 17bc0b4eeb2dfa74bca525e2a173f9deafdea5e6
      SOURCE_SHA256: 6be6b24d09adbbf7173c9e902a88e6d770fc1aadf07c0574e13b4e38e773b177
      SOURCE_COMMIT: 2bd09be0f82dd02b5297affebe0b2352aa624257
      V16_DELTA_BLOB: d03a748f5f62a23d5dc69e2b16a7cf96dc40b8dd
      V16_DELTA_SHA256: 6b93183ef8ec127506e48a066670cae5ca4ce645767fbd2af6731912b0096a7f
      V16_WORKSPACE_SHA256: e336f0a82334b9c4cac5aee41c0be4b9a99bbfeb679c6fa2e66cdebb15def01e
      ORIGINAL_V16_ARCHIVE_SHA256: 42512c3a5527e2d1c9b631926af4cd37d4c0fffea7bc893dfd409bd050be2bc3
      V15_DELTA_BLOB: 8eb3ea0426e9df5ac7db7be5f0d3baa21e5ab990
      V15_DELTA_SHA256: ea9a62b9b1ee0626d6c473e1bfe568efa2679bf0cfaf3a64b5afe5ccfa188812
      V15_WORKSPACE_SHA256: 085a943f101a63eedf597437774f41855b9902501da59e2628cf7dea75d0b413
      ORIGINAL_V15_ARCHIVE_SHA256: 90ae7ba4a8ab5d99947b7b741842f7ecbe15c662c99dfb14d196383d5ab9ea5c
      V14_DELTA_BLOB: 79e0d537b8d6a695052318472f44e82c5be36fa9
      V14_DELTA_SHA256: 6376a637c7a08bc83e29d7749ea3887b2ac2b426cdb302a3bba31f5bd45862f1
      V14_WORKSPACE_SHA256: cecf9bed5f5946a7ffdbe8280c9e6ebad920955b9a4959614415b11f022747d6
      ORIGINAL_V14_ARCHIVE_SHA256: 2c1a6afe7ac8045e7c54d28bd7cc66414b2553ddd9f2fbaa2e2881d43a2e5848
      V13_DELTA_BLOB: 88cdd264af9d34e611b7834830d11b8c827af65f
      V13_DELTA_SHA256: 7acbd9a0c3da02ca3866241e0775d1d9edb0494b98e40c164768c41311e33240
      V13_WORKSPACE_SHA256: 4d844e84ed18f78cbef3d7e5272364e4bf278f1ec579921bcd66564f0ffe345e
      ORIGINAL_V13_ARCHIVE_SHA256: 059d81fda63d25927b80271ec39a4cfa4def4c9d110fb381b78b71c7e913bc0f
      V12_DELTA_BLOB: bbb74a8f2bab275a8011780fa2764e29d8d3970f
      V12_DELTA_SHA256: 9fcb5e8a56e268ecad2bd96a075f49e4f56c40fc1f3eca3c328a9f973dfaeee0
      V12_WORKSPACE_SHA256: 89c3fda46cdc19ee6495f03ced7c8614ee6a161799bec4572794a0016b40434b
      ORIGINAL_V12_ARCHIVE_SHA256: 676678b9ba7b00146f17f6f9063b0bf919d1015a7da8f3f6dd1153efd58bf149
      WORKSPACE_DELTA_BLOB: c32d946e68396e178d0645e02e40b82c9159a044
      WORKSPACE_DELTA_SHA256: a9a302d2abce076d60cf89b2c8638a9f22ba4c5ba711579ee068f072d3ec9164
      WORKSPACE_SHA256: f17e17ea13dfccda2ab9a3acb42513f6f7fdca056201defd83ba6bdc2da62dc8
      ORIGINAL_V11_ARCHIVE_SHA256: d3d6277dac7b069ca150cdc825c8fdf204b9be6e0916c8cec16650e01b307a71
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and verify exact private source
        id: source
        env:
          GH_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .source-zip-smoke .source-project
          gh api "repos/curveyield3/Audit-Controller/git/blobs/$SOURCE_BLOB" --jq .content | base64 --decode > .source-zip-smoke/source.zip
          echo "$SOURCE_SHA256  .source-zip-smoke/source.zip" | sha256sum -c
          gh api "repos/curveyield3/Audit-Controller/git/blobs/$WORKSPACE_DELTA_BLOB" --jq .content | base64 --decode > .source-zip-smoke/workspace.delta
          echo "$WORKSPACE_DELTA_SHA256  .source-zip-smoke/workspace.delta" | sha256sum -c
          gh api "repos/curveyield3/Audit-Controller/git/blobs/$V12_DELTA_BLOB" --jq .content | base64 --decode > .source-zip-smoke/workspace-v12.delta
          echo "$V12_DELTA_SHA256  .source-zip-smoke/workspace-v12.delta" | sha256sum -c
          gh api "repos/curveyield3/Audit-Controller/git/blobs/$V13_DELTA_BLOB" --jq .content | base64 --decode > .source-zip-smoke/workspace-v13.delta
          echo "$V13_DELTA_SHA256  .source-zip-smoke/workspace-v13.delta" | sha256sum -c
          gh api "repos/curveyield3/Audit-Controller/git/blobs/$V14_DELTA_BLOB" --jq .content | base64 --decode > .source-zip-smoke/workspace-v14.delta
          echo "$V14_DELTA_SHA256  .source-zip-smoke/workspace-v14.delta" | sha256sum -c
          gh api "repos/curveyield3/Audit-Controller/git/blobs/$V15_DELTA_BLOB" --jq .content | base64 --decode > .source-zip-smoke/workspace-v15.delta
          echo "$V15_DELTA_SHA256  .source-zip-smoke/workspace-v15.delta" | sha256sum -c
          gh api "repos/curveyield3/Audit-Controller/git/blobs/$V16_DELTA_BLOB" --jq .content | base64 --decode > .source-zip-smoke/workspace-v16.delta
          echo "$V16_DELTA_SHA256  .source-zip-smoke/workspace-v16.delta" | sha256sum -c
          python3 - <<'PY'
          import os, pathlib, zipfile, zlib, json, hashlib
          dest = pathlib.Path(".source-project")
          with zipfile.ZipFile(".source-zip-smoke/source.zip") as z:
              assert z.testzip() is None
              for m in z.infolist():
                  p = pathlib.PurePosixPath(m.filename)
                  assert not p.is_absolute() and ".." not in p.parts
              z.extractall(dest)
          root = dest / "CurveYield_DEX_Simplified_Native_Fees_v5"
          delta = json.loads(zlib.decompress(pathlib.Path(".source-zip-smoke/workspace.delta").read_bytes()))
          for name, ops in delta.items():
              p = pathlib.PurePosixPath(name)
              assert p.parts[0] == "workspace" and not p.is_absolute() and ".." not in p.parts
              target = root.joinpath(*p.parts)
              if ops is None:
                  target.unlink()
                  continue
              lines = target.read_bytes().decode().splitlines(True) if target.exists() else []
              for i,j,s in reversed(ops):
                  lines[i:j] = s.splitlines(True)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes("".join(lines).encode())
          files = sorted(p for p in (root / "workspace").rglob("*") if p.is_file())
          manifest = "".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}\n" for p in files)
          assert len(files) == 319, len(files)
          digest = hashlib.sha256(manifest.encode()).hexdigest()
          assert digest == os.environ["WORKSPACE_SHA256"], digest
          print("Exact V11 workspace verified:", len(files), "files; SHA256", digest)
          delta = json.loads(zlib.decompress(pathlib.Path(".source-zip-smoke/workspace-v12.delta").read_bytes()))
          for name, ops in delta.items():
              p = pathlib.PurePosixPath(name)
              assert p.parts[0] == "workspace" and not p.is_absolute() and ".." not in p.parts
              target = root.joinpath(*p.parts)
              if ops is None:
                  target.unlink()
                  continue
              lines = target.read_bytes().decode().splitlines(True) if target.exists() else []
              for i,j,s in reversed(ops):
                  lines[i:j] = s.splitlines(True)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes("".join(lines).encode())
          files = sorted(p for p in (root / "workspace").rglob("*") if p.is_file())
          manifest = "".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}\n" for p in files)
          assert len(files) == 313, len(files)
          digest = hashlib.sha256(manifest.encode()).hexdigest()
          assert digest == os.environ["V12_WORKSPACE_SHA256"], digest
          print("Exact V12 workspace verified:", len(files), "files; SHA256", digest)
          delta = json.loads(zlib.decompress(pathlib.Path(".source-zip-smoke/workspace-v13.delta").read_bytes()))
          for name, ops in delta.items():
              p = pathlib.PurePosixPath(name)
              assert p.parts[0] == "workspace" and not p.is_absolute() and ".." not in p.parts
              target = root.joinpath(*p.parts)
              if ops is None:
                  target.unlink()
                  continue
              lines = target.read_bytes().decode().splitlines(True) if target.exists() else []
              for i,j,s in reversed(ops):
                  lines[i:j] = s.splitlines(True)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes("".join(lines).encode())
          files = sorted(p for p in (root / "workspace").rglob("*") if p.is_file())
          manifest = "".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}\n" for p in files)
          assert len(files) == 313, len(files)
          digest = hashlib.sha256(manifest.encode()).hexdigest()
          assert digest == os.environ["V13_WORKSPACE_SHA256"], digest
          print("Exact V13 workspace verified:", len(files), "files; SHA256", digest)
          delta = json.loads(zlib.decompress(pathlib.Path(".source-zip-smoke/workspace-v14.delta").read_bytes()))
          for name, ops in delta.items():
              p = pathlib.PurePosixPath(name)
              assert p.parts[0] == "workspace" and not p.is_absolute() and ".." not in p.parts
              target = root.joinpath(*p.parts)
              if ops is None:
                  target.unlink()
                  continue
              lines = target.read_bytes().decode().splitlines(True) if target.exists() else []
              for i,j,s in reversed(ops):
                  lines[i:j] = s.splitlines(True)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes("".join(lines).encode())
          files = sorted(p for p in (root / "workspace").rglob("*") if p.is_file())
          manifest = "".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}\n" for p in files)
          assert len(files) == 313, len(files)
          digest = hashlib.sha256(manifest.encode()).hexdigest()
          assert digest == os.environ["V14_WORKSPACE_SHA256"], digest
          print("Exact V14 workspace verified:", len(files), "files; SHA256", digest)
          delta = json.loads(zlib.decompress(pathlib.Path(".source-zip-smoke/workspace-v15.delta").read_bytes()))
          for name, ops in delta.items():
              p = pathlib.PurePosixPath(name)
              assert p.parts[0] == "workspace" and not p.is_absolute() and ".." not in p.parts
              target = root.joinpath(*p.parts)
              if ops is None:
                  target.unlink()
                  continue
              lines = target.read_bytes().decode().splitlines(True) if target.exists() else []
              for i,j,s in reversed(ops):
                  lines[i:j] = s.splitlines(True)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes("".join(lines).encode())
          files = sorted(p for p in (root / "workspace").rglob("*") if p.is_file())
          manifest = "".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}\n" for p in files)
          assert len(files) == 313, len(files)
          digest = hashlib.sha256(manifest.encode()).hexdigest()
          assert digest == os.environ["V15_WORKSPACE_SHA256"], digest
          print("Exact V15 workspace verified:", len(files), "files; SHA256", digest)
          delta = json.loads(zlib.decompress(pathlib.Path(".source-zip-smoke/workspace-v16.delta").read_bytes()))
          for name, ops in delta.items():
              p = pathlib.PurePosixPath(name)
              assert p.parts[0] == "workspace" and not p.is_absolute() and ".." not in p.parts
              target = root.joinpath(*p.parts)
              if ops is None:
                  target.unlink()
                  continue
              lines = target.read_bytes().decode().splitlines(True) if target.exists() else []
              for i,j,s in reversed(ops):
                  lines[i:j] = s.splitlines(True)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes("".join(lines).encode())
          files = sorted(p for p in (root / "workspace").rglob("*") if p.is_file())
          manifest = "".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}\n" for p in files)
          assert len(files) == 312, len(files)
          digest = hashlib.sha256(manifest.encode()).hexdigest()
          assert digest == os.environ["V16_WORKSPACE_SHA256"], digest
          print("Exact V16 workspace verified:", len(files), "files; SHA256", digest)
          project = root / "workspace" / "contracts-repo" / "CurveYield DEX"
          assert (project / "package-lock.json").is_file()
          assert (project / "tooling/scripts/deployCurveYieldDexFresh.mjs").is_file()
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"project_dir={project}\n")
          PY
      - name: Install locked compiler dependencies
        id: install
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm ci --no-audit --no-fund --ignore-scripts > "$GITHUB_WORKSPACE/.source-zip-smoke/install.log" 2>&1
          compiler_dir="$(mktemp -d)"
          npm install --prefix "$compiler_dir" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund solc-0.8.26@npm:solc@0.8.26 solc-0.8.27@npm:solc@0.8.27 @openzeppelin/contracts@5.4.0 >> "$GITHUB_WORKSPACE/.source-zip-smoke/install.log" 2>&1
          ln -s "$compiler_dir/node_modules/solc-0.8.26" node_modules/solc-0.8.26
          ln -s "$compiler_dir/node_modules/solc-0.8.27" node_modules/solc-0.8.27
          # Match the exact Balancer upstream revision yarn.lock.
          mv node_modules/@openzeppelin/contracts "$compiler_dir/original-openzeppelin-contracts"
          ln -s "$compiler_dir/node_modules/@openzeppelin/contracts" node_modules/@openzeppelin/contracts
          node -e 'const p=require("./node_modules/@openzeppelin/contracts/package.json"); if(p.version!=="5.4.0") process.exit(1); console.log("Resolved OpenZeppelin:",p.version)' >> "$GITHUB_WORKSPACE/.source-zip-smoke/install.log"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile, deploy and qualify V16 native DAO fee wiring on an isolated Base fork
        id: compile
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
          RPC_BASE: ${{ secrets.RPC_BASE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RPC_BASE:-}" || { echo "::error::RPC_BASE unavailable; cannot run authenticated Base fork"; exit 1; }
          export BASE_RPC_URL=http://127.0.0.1:8545
          test "$(cast chain-id --rpc-url "$RPC_BASE")" = 8453
          export PINNED_BLOCK="$(cast block-number --rpc-url "$RPC_BASE")"
          export PINNED_HASH="$(cast block "$PINNED_BLOCK" --rpc-url "$RPC_BASE" --json | jq -er .hash)"
          anvil --fork-url "$RPC_BASE" --fork-block-number "$PINNED_BLOCK" --chain-id 8453 --host 127.0.0.1 --port 8545 --silent > "$GITHUB_WORKSPACE/.source-zip-smoke/anvil.log" 2>&1 &
          anvil_pid=$!
          trap 'kill "$anvil_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if cast chain-id --rpc-url "$BASE_RPC_URL" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          test "$(cast chain-id --rpc-url "$BASE_RPC_URL")" = 8453
          test "$(cast block "$PINNED_BLOCK" --rpc-url "$BASE_RPC_URL" --json | jq -er .hash)" = "$PINNED_HASH"
          echo "Pinned Base fork block $PINNED_BLOCK hash $PINNED_HASH"
          cd "$PROJECT_DIR"
          export DEPLOYER_PRIVATE_KEY="$(node -e 'process.stdout.write("0x"+require("node:crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::$DEPLOYER_PRIVATE_KEY"
          export DEPLOYER_ADDRESS="$(cast wallet address --private-key "$DEPLOYER_PRIVATE_KEY")"
          cast rpc anvil_setBalance "$DEPLOYER_ADDRESS" 0x3635c9adc5dea00000 --rpc-url "$BASE_RPC_URL" >/dev/null
          export MAX_FEE_PER_GAS_WEI="$(node -e 'const f=BigInt(process.argv[1]);process.stdout.write((f*3n+10000000n).toString())' "$(cast block latest --rpc-url "$BASE_RPC_URL" --json | jq -er .baseFeePerGas)")"
          npm run ops:deploy-curveyield-dex-fresh > "$GITHUB_WORKSPACE/.source-zip-smoke/compile.log" 2>&1
          node --input-type=module > "$GITHUB_WORKSPACE/.source-zip-smoke/fork.log" 2>&1 <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createPublicClient, createWalletClient, defineChain, http, parseAbi, toFunctionSelector, zeroAddress, maxUint256} from 'viem';
          import {privateKeyToAccount} from 'viem/accounts';
          const url='http://127.0.0.1:8545';
          assert.equal(process.env.BASE_RPC_URL,url);
          const chain=defineChain({id:8453,name:'Isolated Base fork',nativeCurrency:{name:'Ether',symbol:'ETH',decimals:18},rpcUrls:{default:{http:[url]}}});
          const transport=http(url);
          const pub=createPublicClient({chain,transport});
          assert.equal(await pub.getChainId(),8453);
          assert.equal((await pub.getBlock({blockNumber:BigInt(process.env.PINNED_BLOCK)})).hash,process.env.PINNED_HASH);
          const account=privateKeyToAccount(process.env.DEPLOYER_PRIVATE_KEY);
          const wallet=createWalletClient({account,chain,transport});
          const reports=fs.readdirSync('deployment-artifacts').filter(x=>x.startsWith('curveyield-dex-fresh-')).sort();
          const r=JSON.parse(fs.readFileSync('deployment-artifacts/'+reports.at(-1),'utf8'));
          assert.ok(r.completedAt && !r.error);
          assert.equal(Object.keys(r.deployments).length,20);
          assert.ok(!r.deployments.CurveYieldProtocolRevenue);
          const addr=n=>r.deployments[n].address;
          for(const d of Object.values(r.deployments)) assert.ok((await pub.getCode({address:d.address})).length>2);
          const fees=addr('ProtocolFeeController'), auth=addr('TimelockAuthorizer'), dao=r.dao, router=addr('Router'), factory=addr('WeightedPoolFactory');
          const fa=parseAbi(['function getActionId(bytes4) view returns (bytes32)','function getGlobalProtocolSwapFeePercentage() view returns (uint256)','function getGlobalProtocolYieldFeePercentage() view returns (uint256)','function collectAggregateFees(address)','function withdrawProtocolFees(address,address)','function getProtocolFeeAmounts(address) view returns (uint256[])','function getPoolCreatorFeeAmounts(address) view returns (uint256[])','function setPoolCreatorSwapFeePercentage(address,uint256)','function withdrawPoolCreatorFees(address)']);
          const read=(address,abi,functionName,args=[])=>pub.readContract({address,abi,functionName,args});
          const action=await read(fees,fa,'getActionId',[toFunctionSelector('withdrawProtocolFees(address,address)')]);
          const aa=parseAbi(['function hasPermission(bytes32,address,address) view returns (bool)']);
          assert.equal(await read(auth,aa,'hasPermission',[action,dao,fees]),true);
          assert.equal(await read(auth,aa,'hasPermission',[action,account.address,fees]),false);
          const reg=parseAbi(['function getBalancerContract(uint8,string) view returns (address,bool)']);
          for(const name of ['curveyield-v1-protocol-revenue','ProtocolRevenue']) assert.deepEqual(await read(addr('BalancerContractRegistry'),reg,'getBalancerContract',[0,name]),[zeroAddress,false]);
          assert.equal(await read(fees,fa,'getGlobalProtocolSwapFeePercentage'),80000000000000000n);
          assert.equal(await read(fees,fa,'getGlobalProtocolYieldFeePercentage'),120000000000000000n);
          const receipts=[];
          async function send(w,address,abi,functionName,args=[],value=0n) {
            const s=await pub.simulateContract({account:w.account,address,abi,functionName,args,value});
            const hash=await w.writeContract(s.request);
            const receipt=await pub.waitForTransactionReceipt({hash});
            assert.equal(receipt.status,'success');
            receipts.push({functionName,hash,gasUsed:receipt.gasUsed.toString()});
            return s.result;
          }
          async function impersonate(address) {
            await pub.request({method:'anvil_impersonateAccount',params:[address]});
            await pub.request({method:'anvil_setBalance',params:[address,'0x56bc75e2d63100000']});
            return createWalletClient({account:address,chain,transport});
          }
          // Actual fork assets: canonical WETH and native USDC; acquire test USDC
          // from real fork pool balance only, via local impersonation.
          const weth=r.weth, usdc='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';
          const uni='0x33128a8fC17869897dcE68Ed026d694621f6FDfD';
          const token=parseAbi(['function balanceOf(address) view returns (uint256)','function approve(address,uint256) returns (bool)','function transfer(address,uint256) returns (bool)','function decimals() view returns (uint8)','function deposit() payable']);
          assert.equal(await read(weth,token,'decimals'),18);
          assert.equal(await read(usdc,token,'decimals'),6);
          const uabi=parseAbi(['function getPool(address,address,uint24) view returns (address)']);
          let holder;
          for(const tier of [500,3000,100,10000]){
            const p=await read(uni,uabi,'getPool',[weth,usdc,tier]);
            if(p!==zeroAddress && await read(usdc,token,'balanceOf',[p])>=20000000000n){holder=p;break;}
          }
          assert.ok(holder,'No actual USDC pool with enough local fork fixture funds');
          const holderWallet=await impersonate(holder);
          await send(holderWallet,usdc,token,'transfer',[account.address,20000000000n]);
          await pub.request({method:'anvil_stopImpersonatingAccount',params:[holder]});
          await send(wallet,weth,token,'deposit',[],20n*10n**18n);
          const permit=parseAbi(['function approve(address,address,uint160,uint48)']);
          const expiry=Number((await pub.getBlock()).timestamp)+86400;
          for(const t of [weth,usdc]){
            await send(wallet,t,token,'approve',[r.permit2,maxUint256]);
            await send(wallet,r.permit2,permit,'approve',[t,router,(1n<<160n)-1n,expiry]);
          }
          const create=parseAbi(['function create(string,string,(address token,uint8 tokenType,address rateProvider,bool paysYieldFees)[],uint256[],(address pauseManager,address swapFeeManager,address poolCreator),uint256,address,bool,bool,bytes32) returns (address)']);
          const configs=[weth,usdc].map(token=>({token,tokenType:0,rateProvider:zeroAddress,paysYieldFees:false}));
          const pool=await send(wallet,factory,create,'create',['V16 fee qualification','V16F',configs,[500000000000000000n,500000000000000000n],{pauseManager:zeroAddress,swapFeeManager:zeroAddress,poolCreator:account.address},10000000000000000n,zeroAddress,false,false,'0x'+'00'.repeat(31)+'01']);
          assert.ok((await pub.getCode({address:pool})).length>2);
          const route=parseAbi(['function initialize(address,address[],uint256[],uint256,bool,bytes) payable returns (uint256)','function swapSingleTokenExactIn(address,address,address,uint256,uint256,uint256,bool,bytes) payable returns (uint256)']);
          await send(wallet,router,route,'initialize',[pool,[weth,usdc],[10n*10n**18n,10000000000n],0n,false,'0x']);
          await send(wallet,fees,fa,'setPoolCreatorSwapFeePercentage',[pool,100000000000000000n]);
          const daoWallet=await impersonate(dao);
          const scenarios=[];
          for(const [tIn,tOut,amount] of [[weth,usdc,100000000000000000n],[usdc,weth,500000000n]]){
            const deadline=(await pub.getBlock()).timestamp+3600n;
            await send(wallet,router,route,'swapSingleTokenExactIn',[pool,tIn,tOut,amount,0n,deadline,false,'0x']);
            await send(wallet,fees,fa,'collectAggregateFees',[pool]);
            const accrued=await read(fees,fa,'getProtocolFeeAmounts',[pool]);
            const creatorBefore=await read(fees,fa,'getPoolCreatorFeeAmounts',[pool]);
            assert.ok(accrued.some(x=>x>0n));
            assert.ok(creatorBefore.some(x=>x>0n));
            await assert.rejects(pub.simulateContract({account:account.address,address:fees,abi:fa,functionName:'withdrawProtocolFees',args:[pool,account.address]}));
            const before=await Promise.all([weth,usdc].map(t=>read(t,token,'balanceOf',[dao])));
            await send(daoWallet,fees,fa,'withdrawProtocolFees',[pool,dao]);
            const after=await Promise.all([weth,usdc].map(t=>read(t,token,'balanceOf',[dao])));
            assert.deepEqual(after.map((x,i)=>x-before[i]),accrued);
            assert.deepEqual(await read(fees,fa,'getProtocolFeeAmounts',[pool]),[0n,0n]);
            assert.deepEqual(await read(fees,fa,'getPoolCreatorFeeAmounts',[pool]),creatorBefore);
            await send(wallet,fees,fa,'withdrawPoolCreatorFees',[pool]);
            assert.deepEqual(await read(fees,fa,'getPoolCreatorFeeAmounts',[pool]),[0n,0n]);
            scenarios.push({tokenIn:tIn,amount,accrued,creatorBefore,daoReceived:after.map((x,i)=>x-before[i]),unauthorizedWithdrawalRejected:true});
          }
          await pub.request({method:'anvil_stopImpersonatingAccount',params:[dao]});
          const evidence={chainId:8453,block:process.env.PINNED_BLOCK,blockHash:process.env.PINNED_HASH,sourceWorkspaceSha256:process.env.V16_WORKSPACE_SHA256,deployments:Object.keys(r.deployments),pool,holder,dao,withdrawalPermission:true,legacyRevenueRegistryAbsent:true,scenarios,receipts};
          fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/.source-zip-smoke/fork-evidence.json',JSON.stringify(evidence,(_,v)=>typeof v==='bigint'?v.toString():v,2)+'\n');
          console.log('V16 isolated Base fork qualification passed: 20 deployments, direct DAO withdrawal, two real token fee scenarios, unchanged creator fee accounting, no legacy revenue registration.');
          JS
      - name: Preserve private fork qualification evidence
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
          SOURCE_STATUS: ${{ steps.source.outcome }}
          INSTALL_STATUS: ${{ steps.install.outcome }}
          COMPILE_STATUS: ${{ steps.compile.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .source-zip-smoke
          python3 - <<'PY'
          import os, json, pathlib, base64
          d=pathlib.Path(".source-zip-smoke")
          project=pathlib.Path(os.environ["PROJECT_DIR"]) if os.environ.get("PROJECT_DIR") else None
          reports=sorted((project/"deployment-artifacts").glob("curveyield-dex-fresh-*.json")) if project else []
          def log(name):
              p=d/name
              return p.read_text(errors="replace")[-150000:] if p.exists() else None
          result=dict(sourceBlob=os.environ["SOURCE_BLOB"],sourceSha256=os.environ["SOURCE_SHA256"],sourceCommit=os.environ["SOURCE_COMMIT"],workspaceDeltaBlob=os.environ["WORKSPACE_DELTA_BLOB"],workspaceDeltaSha256=os.environ["WORKSPACE_DELTA_SHA256"],workspaceSha256=os.environ["WORKSPACE_SHA256"],originalV11ArchiveSha256=os.environ["ORIGINAL_V11_ARCHIVE_SHA256"],v12DeltaBlob=os.environ["V12_DELTA_BLOB"],v12DeltaSha256=os.environ["V12_DELTA_SHA256"],v12WorkspaceSha256=os.environ["V12_WORKSPACE_SHA256"],originalV12ArchiveSha256=os.environ["ORIGINAL_V12_ARCHIVE_SHA256"],v13DeltaBlob=os.environ["V13_DELTA_BLOB"],v13DeltaSha256=os.environ["V13_DELTA_SHA256"],v13WorkspaceSha256=os.environ["V13_WORKSPACE_SHA256"],originalV13ArchiveSha256=os.environ["ORIGINAL_V13_ARCHIVE_SHA256"],v14DeltaBlob=os.environ["V14_DELTA_BLOB"],v14DeltaSha256=os.environ["V14_DELTA_SHA256"],v14WorkspaceSha256=os.environ["V14_WORKSPACE_SHA256"],originalV14ArchiveSha256=os.environ["ORIGINAL_V14_ARCHIVE_SHA256"],v15DeltaBlob=os.environ["V15_DELTA_BLOB"],v15DeltaSha256=os.environ["V15_DELTA_SHA256"],v15WorkspaceSha256=os.environ["V15_WORKSPACE_SHA256"],originalV15ArchiveSha256=os.environ["ORIGINAL_V15_ARCHIVE_SHA256"],v16DeltaBlob=os.environ["V16_DELTA_BLOB"],v16DeltaSha256=os.environ["V16_DELTA_SHA256"],v16WorkspaceSha256=os.environ["V16_WORKSPACE_SHA256"],originalV16ArchiveSha256=os.environ["ORIGINAL_V16_ARCHIVE_SHA256"],runId=os.environ["GITHUB_RUN_ID"],runAttempt=os.environ["GITHUB_RUN_ATTEMPT"],sourceStatus=os.environ["SOURCE_STATUS"],installStatus=os.environ["INSTALL_STATUS"],compileStatus=os.environ["COMPILE_STATUS"],installLog=log("install.log"),compileLog=log("compile.log"),forkLog=log("fork.log"),forkEvidence=json.loads((d/"fork-evidence.json").read_text()) if (d/"fork-evidence.json").exists() else None,buildReport=json.loads(reports[-1].read_text()) if reports else None)
          (d/"compile-evidence.json").write_text(json.dumps(result,indent=2)+"\n")
          PY
          target="campaigns/CurveYield_DEX_Simplified_Native_Fees_v16_fork_evidence_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.json"
          ref="development/dex-simplified-native-fees-v1"
          old="$(gh api "repos/curveyield3/Audit-Controller/contents/$target?ref=$ref" --jq .sha 2>/dev/null || true)"
          base64 -w0 .source-zip-smoke/compile-evidence.json > .source-zip-smoke/evidence.b64
          jq -n --arg branch "$ref" --arg old "$old" --arg msg "Record DEX v16 exact workspace fork evidence (run $GITHUB_RUN_ID)" --rawfile content .source-zip-smoke/evidence.b64 '{branch:$branch,message:$msg,content:$content} + (if $old=="" then {} else {sha:$old} end)' > .source-zip-smoke/upload.json
          gh api --method PUT "repos/curveyield3/Audit-Controller/contents/$target" --input .source-zip-smoke/upload.json --silent
          echo "Private evidence recorded. Source: $SOURCE_STATUS; install: $INSTALL_STATUS; compile: $COMPILE_STATUS"
