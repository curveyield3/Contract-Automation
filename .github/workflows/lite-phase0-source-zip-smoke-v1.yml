name: Header-amended Safe exact nonce35 minus three approvals v20
on:
  push:
    branches: [cyvlsdt-v69-postdeploy-simulation-v1]
    paths: ['.github/workflows/lite-phase0-source-zip-smoke-v1.yml', 'github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json', 'github-native-sim/cyvlsdt-runtime-compare-v1/v69-postdeploy-suite-v1.cjs']
permissions:
  contents: read
  actions: read
jobs:
  fork-gas:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FOUNDRY_OPTIMIZER_RUNS: '25'
      UPSTREAM_RPC: ${{ secrets.RPC_ETHEREUM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Materialize exact v64 source and benchmark-only optimization candidate
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/curveyield3/Smart-Contracts/6b058498554f58936daf1216c222d554ee666f5e/Audit-Intake/CurveYield-cyvlSDT-Deployment-Package-v64.zip' -o /tmp/cyv64.zip
          echo 'a2d46ab6bf63a760efecf914f36419b8ec271c0e36f9b3ee9821cd842ea0d7ee  /tmp/cyv64.zip' | sha256sum -c -
          mkdir -p /tmp/cyv64 /tmp/cyv65
          unzip -q /tmp/cyv64.zip -d /tmp/cyv64
          cp -a /tmp/cyv64/contracts /tmp/cyv65/
          mkdir -p /tmp/cyv-deps
          npm install --prefix /tmp/cyv-deps --ignore-scripts --no-audit --no-fund --no-save '@openzeppelin/contracts@5.4.0' '@openzeppelin-4/contracts@npm:@openzeppelin/contracts@4.9.6' '@openzeppelin/contracts-upgradeable@4.9.6' 'ethers@6.17.0'
          ln -s /tmp/cyv-deps/node_modules /tmp/cyv64/node_modules
          ln -s /tmp/cyv-deps/node_modules /tmp/cyv65/node_modules
          for ROOT in /tmp/cyv64 /tmp/cyv65; do
            rm -f "$ROOT/contracts/PoL_Manager_Contract_v22.sol" "$ROOT/contracts/VoteMarketSingleGaugeBribeAllocator.sol"
            rm -rf "$ROOT/contracts/external_guard_v8"
            cat > "$ROOT/foundry.toml" <<'EOF'
          [profile.default]
          src = "contracts"
          out = "out"
          libs = ["node_modules"]
          remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/", "@openzeppelin-4/contracts/=node_modules/@openzeppelin-4/contracts/", "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/"]
          solc_version = "0.8.28"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          evm_version = "cancun"
          EOF
          done
          python3 - <<'PY'
          import json,pathlib
          p=json.loads(pathlib.Path('github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json').read_text())
          exec(compile(p['transform'],'v65-transform','exec'))
          exec(compile(p['unifiedTransform'],'v66-transform','exec'))
          exec(compile(p['packingTransform'],'v67-transform','exec'))
          PY
      - name: Compile pinned original proposal artifacts and updated vault and SDT strategy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v72-report
          FOUNDRY_OUT=out-25-v69 forge build --root /tmp/cyv65 --force --skip test --skip script
          python3 - <<'PY'
          import json,pathlib,re,difflib
          p=json.loads(pathlib.Path('github-native-sim/cyvlsdt-runtime-compare-v1/config-safe-mainnet-v51.json').read_text())
          exec(compile(p['vaultEmergencyCapabilityPatch'],'v70-vault-capability','exec'))
          exec(compile(p['vaultMintAllowancePatch'],'v71-mint-allowance','exec'))
          f=pathlib.Path('/tmp/cyv65/contracts/StrategyCurveSDTYearnRebindable.sol')
          before=f.read_text()
          after,n=re.subn(r'(\bCURVE_LP_SLIPPAGE_BPS\s*=\s*)200\b',r'\g<1>100',before)
          assert n==1,('expected exactly one 200 bps SDT slippage constant',n)
          assert re.search(r'quoteDeposit\s*\([^;]*CURVE_LP_SLIPPAGE_BPS',after)
          assert re.search(r'quoteWithdraw\s*\([^;]*CURVE_LP_SLIPPAGE_BPS',after)
          f.write_text(after)
          diff=''.join(difflib.unified_diff(before.splitlines(keepends=True),after.splitlines(keepends=True),fromfile='v71/'+f.name,tofile='v72/'+f.name))
          print('SDT_SLIPPAGE_SOURCE_DIFF\n'+diff,flush=True)
          out=pathlib.Path('/tmp/v72-report')
          (out/'StrategyCurveSDTYearnRebindable-v72.sol').write_text(after)
          (out/'SDT-slippage-diff-v1.patch').write_text(diff)
          (out/'BeefyVaultCurveYieldV8cyvlSDT-v71.sol').write_text(pathlib.Path('/tmp/cyv65/contracts/BeefyVaultCurveYieldV8cyvlSDT.sol').read_text())
          pathlib.Path('/tmp/cyv64/replay.cjs').write_text(p['replay'])
          PY
          FOUNDRY_OUT=out-25-v72 forge build --root /tmp/cyv65 --force --skip test --skip script
          python3 - <<'PY'
          import pathlib,json
          root=pathlib.Path('/tmp/cyv65')
          report={}
          for name in ['BeefyVaultCurveYieldV8cyvlSDT','StrategyCurveSDTYearnRebindable']:
              a=json.loads((root/'out-25-v69'/(name+'.sol')/(name+'.json')).read_text())
              b=json.loads((root/'out-25-v72'/(name+'.sol')/(name+'.json')).read_text())
              sizes=lambda v:{k:len(bytes.fromhex(v[k]['object'].removeprefix('0x'))) for k in ['bytecode','deployedBytecode']}
              report[name]={'before':sizes(a),'after':sizes(b)}
              assert report[name]['after']['deployedBytecode']<=24576
          pathlib.Path('/tmp/v72-report/Compiled-size-v72.json').write_text(json.dumps(report,indent=2))
          print('COMPILED_SIZE_V72',json.dumps(report))
          PY
      - name: Retrieve immutable header-amended compiler evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 45386347328 -n CurveYield-Deployment-Headers-v1 -D /tmp/header-evidence
          test -s /tmp/header-evidence/artifacts/PoLManager/header.json
          test -s /tmp/header-evidence/artifacts/CurveYieldSDTShareOracle/header.json
      - name: Replay two-full-deployment batches and dependent PoL setup
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPSTREAM_RPC"
          export FORK_BLOCK=26488957
          anvil --fork-url "$UPSTREAM_RPC" --fork-block-number "$FORK_BLOCK" --host 127.0.0.1 --port 8545 --silent >/tmp/anvil.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import pathlib,re
          f=pathlib.Path('/tmp/cyv64/replay.cjs')
          s=f.read_text()
          old=' await execute(first,34);\n second.push(initCalls[0]);\n await execute(second,35);\n await execute([...initCalls.slice(1),route],36);'
          assert s.count(old)==1
          s=s.replace(old,"\n second.push(initCalls[0]);\n const headerList=(list,nonce)=>{const args=safeArgs(list);const patches={34:[[20809,\"dce823ed9948a98376ee3975c9c5d9b29a23389ee1f7161b1ecc7e508b05d190\",\"844711a051a2b39d54cc31c8cb6ff249ac0e93d41030e68191ffe12ef8de05e9\"],[38469,\"ad2cb09f3decb9f830597c8d94a678acbf81bfb49df6dd1dfa7d49f772b9878e\",\"03182f0ee791c5e0197fbf3aa7d77fc6650da03af09e664cdcaf0e127ad24718\"],[47317,\"6ec0931a432df24e9d17c67e7aafe797284cc54bb10c51ef21f1ef67a0e6c1b0\",\"06b3bc49bda13b98f5af9dc5a89d2936c8d5853d2439a5f2ed19f07485029de5\"]],35:[[3594,\"b6298c09be3cb029d2205da3c01600fba6d78e0a2a8a06382c2ba501d1354142\",\"0fb7a8e03c489d51d1090929855c54608704bd8085a4df793c97d6819980f3f3\"],[20862,\"97aec27d8c9195d28aa6e4d1200f87d30a4bdcd4c0fec15f3b44f4266961c4db\",\"2a2459df300f1cd54c8904693813ba2871479372be05c6fe6f4045815f9dbdea\"],[36646,\"ef99e0b3c5d30509fac04ee99b3f48b42da89234922ee3158e12ac6b554d0e4b\",\"cfe9b9f51df66440b265b96fdb2e45bb9e2dc228aad463e0e481629b4255dbaa\"],[49319,\"8307fdbc2cead67635478b962d83e6685b233ff367986094a545f6422480847d\",\"495e67f5f75b2fee06d9651fdfecc97e0d8dc6f71374c0ecf31348cdcfec7133\"],[61296,\"530b5f3987545bb7672b1c3dab1fb4450d4876d01a31c2a665d8b75ecb0cf571\",\"09a906ca63858baabea685735d9fc1aec05404e6c81640c9d5179e0ff0322a38\"],[71915,\"607765eecd37a7110a15e5be01fd1d28f4cabf68ab8958622e9c05ae4426f463\",\"662be53bec0ffa85bff2d6f6111492f6c22f6117275aafff573b9177b88bc155\"]]};for(const [off,a,b] of patches[nonce]||[]){const i=2+2*off;assert.equal(args[2].slice(i,i+a.length),a);args[2]=args[2].slice(0,i)+b+args[2].slice(i+a.length)}; const decoded=parse(args[2]);assert.equal(decoded.length,list.length);return decoded.map((x,i)=>({...x,label:list[i].label}));};\n const aa=headerList(first,34),bb=headerList(second,35),cc=[...initCalls.slice(1),route],dd=parse(\"\").map((x,i)=>({...x,label:[\"Create three-coin Curve pool\",\"Create Uniswap 1% pool at 1:1\",\"Approve SDT for NFT\",\"Mint 1 SDT single-sided NFT\",\"Withdraw legacy sdCRV vault 1\",\"Withdraw legacy sdCRV vault 2\",\"Withdraw legacy sdFXN vault\",\"Approve sdCRV\",\"Deposit all sdCRV\",\"Reset sdCRV allowance\",\"Approve sdFXN\",\"Deposit all sdFXN\",\"Reset sdFXN allowance\"][i]}));\n assert.equal(await safe.getTransactionHash(...safeArgs(aa).slice(0,9),34),'0x4802a84de6417ad35eb65d726e243ef2bce72d2122c3598d4c2e6aef5479229b');\n assert.equal(await safe.getTransactionHash(...safeArgs(bb).slice(0,9),35),'0x7863d10f8fcbd00e8be012cdf5cca370c869bd54311f8c88cd81b01c867bfe06');\n assert.equal(await safe.getTransactionHash(...safeArgs(cc).slice(0,9),36),'0x6164dd971b88145dff593fab4f7c8a9e60d04e4e3746eabd41003beff3fc9321');\n assert.equal(await safe.getTransactionHash(...safeArgs(dd).slice(0,9),37),'0x9f588ceea855b9a9f6095a3de58ecf9a5cd12b2d51a1b2d93031ca436263a12d');\n assert.deepEqual([aa.length,bb.length,cc.length,dd.length],[4,20,4,13]);\n\n // Rebind only ABI constructor/configuration parameters, never search-and-replace executable bytecode.\n const order=['impl','rvault','svault','crvVault','fxnVault','crv','fxn','token','locker','staking','revenue','merchant','yearn'];\n const oldA={...A},newA=Object.fromEntries(order.map((k,i)=>[k,E.getCreateAddress({from:SAFE,nonce:i+1})]));\n const addressMap=new Map(Object.keys(oldA).map(k=>[oldA[k].toLowerCase(),newA[k]]));\n const addr=v=>addressMap.get(v.toLowerCase())??v;\n function remapParam(param,v){\n  if(param.baseType==='address')return addr(v);\n  if(param.baseType==='array')return Array.from(v,x=>remapParam(param.arrayChildren,x));\n  if(param.baseType==='tuple')return param.components.map((p,i)=>remapParam(p,v[i]));\n  return v;\n }\n function rebindCreate(x,key){\n  const c=constructorEvidence.find(c=>c.key===key);\n  const ar=artifact(key==='impl'||key==='yearn'?current:old,c.name);\n  const iface=new E.Interface(ar.abi),[value,init]=ci.decodeFunctionData('performCreate',x.data);\n  const initBytes=E.dataLength(init),argsBytes=E.dataLength(iface.encodeDeploy(c.newArgs));\n  const code=E.dataSlice(init,0,initBytes-argsBytes);\n  const decoded=Array.from(ac.decode(iface.deploy.inputs,E.dataSlice(init,initBytes-argsBytes)));\n  assert.equal(iface.encodeDeploy(decoded).toLowerCase(),iface.encodeDeploy(c.newArgs).toLowerCase(),key+' old args');\n  const args=iface.deploy.inputs.map((p,i)=>remapParam(p,decoded[i]));\n  c.previousAddress=c.address;c.address=newA[key];c.newArgs=args;\n  return {...x,data:ci.encodeFunctionData('performCreate',[value,E.concat([code,iface.encodeDeploy(args)])])};\n }\n function rebindCall(x){\n  // Every mutable address is a full ABI word. Replace simultaneously and only in calldata words, not selectors.\n  const selector=x.data.slice(0,10),raw=x.data.slice(10);assert.equal(raw.length%64,0);\n  const words=raw.match(/.{64}/g)||[];\n  const mapped=words.map(w=>{if(!/^0{24}[0-9a-fA-F]{40}$/.test(w))return w;const a=addressMap.get('0x'+w.slice(24).toLowerCase());return a?'0'.repeat(24)+a.slice(2).toLowerCase():w;});\n  return {...x,to:addr(x.to),data:selector+mapped.join('')};\n }\n const oldCreates=[...aa.slice(1),...bb.slice(0,10)];\n assert.deepEqual(oldCreates.map(x=>x.label),keys.map(k=>'Deploy '+k));\n const D=Object.fromEntries(oldCreates.map((x,i)=>[keys[i],rebindCreate(x,keys[i])]));\n const B=bb.map((x,i)=>i<10?x:rebindCall(x)),C=cc.map(rebindCall),F=dd.map(rebindCall);\n Object.assign(A,newA);\n // Uniswap V3 requires ascending token addresses; preserve the economics of the original SDT-only mint when token order reverses.\n const uniFactoryIface=new E.Interface(['function createAndInitializePoolIfNecessary(address token0,address token1,uint24 fee,uint160 sqrtPriceX96) payable returns(address)']);\n const uniMintIface=new E.Interface(['function mint((address token0,address token1,uint24 fee,int24 tickLower,int24 tickUpper,uint256 amount0Desired,uint256 amount1Desired,uint256 amount0Min,uint256 amount1Min,address recipient,uint256 deadline) params) payable returns(uint256,uint128,uint256,uint256)']);\n const ucreate=Array.from(uniFactoryIface.decodeFunctionData('createAndInitializePoolIfNecessary',F[1].data));\n const umint=Array.from(uniMintIface.decodeFunctionData('mint',F[3].data)[0]);\n assert.equal(ucreate[0].toLowerCase(),SDT.toLowerCase());assert.equal(ucreate[1].toLowerCase(),A.token.toLowerCase());\n assert.equal(umint[0].toLowerCase(),SDT.toLowerCase());assert.equal(umint[1].toLowerCase(),A.token.toLowerCase());assert.equal(umint[5],10n**18n);assert.equal(umint[6],0n);\n const inverted=BigInt(ucreate[0])>BigInt(ucreate[1]);\n if(inverted){\n   assert.equal(ucreate[3],2n**96n,'existing initial price must be parity');\n   [ucreate[0],ucreate[1]]=[ucreate[1],ucreate[0]];\n   [umint[0],umint[1]]=[umint[1],umint[0]];\n   [umint[3],umint[4]]=[-umint[4],-umint[3]];\n   [umint[5],umint[6]]=[umint[6],umint[5]];\n   [umint[7],umint[8]]=[umint[8],umint[7]];\n }\n assert(BigInt(ucreate[0])<BigInt(ucreate[1]));assert.equal(umint[0],ucreate[0]);assert.equal(umint[1],ucreate[1]);\n F[1]={...F[1],data:uniFactoryIface.encodeFunctionData('createAndInitializePoolIfNecessary',ucreate)};\n F[3]={...F[3],data:uniMintIface.encodeFunctionData('mint',[umint])};\n log('UNI_ORDER_REPAIRED',{inverted,token0:ucreate[0],token1:ucreate[1],tickLower:umint[3],tickUpper:umint[4],amount0:umint[5],amount1:umint[6],min0:umint[7],min1:umint[8],deadline:umint[10]});\n\n log('ADDRESS_REBINDING',{previous:oldA,current:A,order});\n // The first proposal is exactly the requested template, four clones, Yearn factory, sdCRV strategy and initializer.\n // Move the existing guarded route and sdCRV migration into the first batch only if they fit the 15M target.\n const firstCore=[aa[0],D.impl,D.rvault,D.svault,D.crvVault,D.fxnVault,D.crv,C[1]];\n const crvMigration=[F[4],F[5],F[7],F[8],F[9]];\n const fxnMigration=[F[6],F[10],F[11],F[12]];\n const groups=[firstCore,[D.fxn,D.token,B[18],C[2],...fxnMigration,C[3]],[D.locker,D.staking,...B.slice(10,15)],[D.revenue,D.merchant,...B.slice(15,18),B[19]],[D.yearn,C[0],F[0],...F.slice(1,4)]];\n // Preserve deployment sequence, move only previously approved independent operations.\n const base=[...firstCore,...crvMigration];\n const candidates=[F[6],C[3]];\n const candidateNames=candidates.map(x=>x.label);\n let best=null;\n const fixed34=[...base,...candidates];best={list:fixed34,moved:candidates,actual:14700105n,gas:15811660n,distance:299895n};\n assert(best,'no feasible batch');groups[0]=best.list;\n groups[1]=groups[1].filter(x=>!best.moved.includes(x));\n log('FIRST_PACK_SELECTED',{moved:best.moved.map(x=>x.label),actual:best.actual,estimate:best.gas,distance:best.distance});\n // Apply the exact requested metadata edits, preserving every other initializer argument.\n for(const group of groups)for(let k=0;k<group.length;k++){const x=group[k];if(x.label==='Initialize rvault'||x.label==='Initialize svault'){const v=new E.Interface(artifact(current,contracts.impl).abi),args=Array.from(v.decodeFunctionData('initialize',x.data));if(x.label==='Initialize rvault'){args[1]='CurveYield vlSDT Vault';args[2]='cyvlSDT-V';}else{args[1]='CurveYield SDT-ETH LP Vault';args[2]='cySDT-ETH';}group[k]={...x,data:v.encodeFunctionData('initialize',args)};}}\n const hashOf=async(list,nonce)=>await safe.getTransactionHash(...safeArgs(list).slice(0,9),nonce);\n assert.equal(await hashOf(groups[0],34),'0x3aa9784142a1d953cdc4fd7ddd6954e9c9f618091ba522f55331b1a085e693fa');\n assert.equal(await hashOf(groups[1],35),'0x4f46ca89af2ddca9f8f0ff7a4933937c50f8cf963097589a9b730748a24b3749');\n assert.equal(await hashOf(groups[2],36),'0x7084b81180768987478e81cf745c0142f2dad0df0f7e8b01ae5eea78f8da70b9');\n const merged=[...groups[1],...groups[2]];\n assert.equal(merged.length,14);assert.equal(await hashOf(merged,35),'0xeca312c0f04463fbe08241ea18b6d593792b9ae4fafeb341e44580348df44891');\n await execute(groups[0],34);\n const approveIface=new E.Interface(['function approve(address,uint256) returns(bool)']);\n const pending=[groups[3][3],groups[3][4],...groups[4].filter(x=>x.label==='Approve SDT for NFT'),call(SDT,approveIface,'approve',[A.locker,20n*10n**18n],'Approve 20 SDT for locker'),call(A.token,approveIface,'approve',[A.rvault,10n*10n**18n],'Approve 10 cyvlSDT for vlSDT vault')];\n assert.equal(pending.length,5);assert.equal(pending[0].label,'Set PoL deposit share 25%');assert.equal(pending[1].label,'Enable marketplace operator');\n let selected=merged.slice();\n for(const x of pending){const candidate=[...selected,x];try{const gas=await estimate(candidate);assert(gas<=16500000n,'target');assert(await safe.execTransaction.staticCall(...safeArgs(candidate),{gasLimit:16500000n}));selected=candidate;log('ADVANCE_ACCEPT',{label:x.label,gas});}catch(e){log('ADVANCE_DEFER',{label:x.label,reason:String(e.shortMessage||e.message).slice(0,500)});}}\n assert.equal(selected.length,19);assert.equal(await hashOf(selected,35),'0x619d4d053c21749cc9556515edb6a8c506a142e098cc81a55055ccb4b93806ae');\n const moved=groups[4][0];assert.equal(moved.label,'Deploy yearn');assert(E.dataLength(moved.data)<E.dataLength(groups[3][0].data)&&E.dataLength(moved.data)<E.dataLength(groups[3][1].data));\n const prior={...A};const changed={yearn:prior.revenue,revenue:prior.merchant,merchant:prior.yearn};\n const movedInit=groups[4][1];assert.equal(movedInit.label,'Initialize svault');\n const vi35=new E.Interface(artifact(current,contracts.impl).abi),init35=Array.from(vi35.decodeFunctionData('initialize',movedInit.data));assert.equal(init35[0].toLowerCase(),prior.yearn.toLowerCase());init35[0]=changed.yearn;\n const initCall={...movedInit,data:vi35.encodeFunctionData('initialize',init35)};\n const currentPol35=E.getAddress('0xc2381a483fd735a1e323b85536901d83d4e75f58');\n const pi35=new E.Interface(['function setVault(uint8,address)','function setAllocations(uint16[7])','function vaults(uint256) view returns(address)','function allocations(uint256) view returns(uint16)','function allocationEnabledMask() view returns(uint8)','function morphoV2(uint256) view returns(bool)','function liquidityBounds() view returns(address)','function profitRecipient() view returns(address)']);\n const pol35=new E.Contract(currentPol35,pi35,p);assert.equal(await pol35.vaults(3),E.ZeroAddress);\n const additions=[moved,initCall,call(currentPol35,pi35,'setVault',[3,A.svault],'Register SDT Yearn vault in ERC4626 slot 3'),call(currentPol35,pi35,'setAllocations',[[0,0,0,0,0,10000,0]],'Set 100% allocation to slot 3')];\n const migration=selected.slice(4,7);assert.deepEqual(migration.map(x=>x.label),['Approve sdFXN','Deposit all sdFXN','Reset sdFXN allowance']);\n let candidate,gas,deferred=[];\n const base35=[...selected.filter(x=>!migration.includes(x)),...additions];assert.equal(await hashOf(base35,35),'0x7d297eed0cb734f1f2e7c0009e86f6b0141da31e3488f9c9d4470617d6116f1a');\n const allowance35=10000n*10n**18n;const approve35=new E.Interface(['function approve(address,uint256) returns(bool)','function allowance(address,address) view returns(uint256)','function balanceOf(address) view returns(uint256)','function decimals() view returns(uint8)']);\n const approvals35=[];selected=selected.map(x=>{if(x.data.slice(0,10)!=='0x095ea7b3')return x;const [spender,amount]=approve35.decodeFunctionData('approve',x.data);if(amount===0n)return x;const y={...x,data:approve35.encodeFunctionData('approve',[spender,allowance35]),label:'Approve 10000 '+(x.label==='Approve sdFXN'?'sdFXN':x.label==='Approve SDT for NFT'?'SDT for NFT':x.label==='Approve 20 SDT for locker'?'SDT for locker':'cyvlSDT for vlSDT vault')};approvals35.push({token:y.to,spender,amount:allowance35});return y;});assert.equal(approvals35.length,4);\n const sdApproval=selected[4],sdDeposit=selected[5],sdReset=selected[6];assert.equal(sdApproval.label,'Approve 10000 sdFXN');assert.equal(sdDeposit.label,'Deposit all sdFXN');assert.equal(sdReset.label,'Reset sdFXN allowance');\n const sdToken35=new E.Contract(sdApproval.to,approve35,p);const sdBalance35=await sdToken35.balanceOf(