name: Lite Phase-5 Native Fuzz Gate Regression v1
# Regression execution requires explicit audit-owner permission; never auto-run on source push.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check packages/github-native-sim/src/native-fuzz.mjs
          node --check packages/github-native-sim/src/lite-boundary-artifacts-v1.mjs
          node --check scripts/tests/phase5-native-fuzz-fail-closed-v1.test.mjs
      - name: Install runtime imports in GitHub Actions
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify fail-closed forge results
        run: node --test scripts/tests/phase5-native-fuzz-fail-closed-v1.test.mjs
