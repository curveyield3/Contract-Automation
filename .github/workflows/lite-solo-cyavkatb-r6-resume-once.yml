name: CYAVKAT-B Lite-Solo r6 Phase 0 Resume (one shot)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lite-solo-cyavkatb-r6-resume-once.yml'
permissions:
  contents: read
  actions: write
jobs:
  resume:
    if: github.repository == 'curveyield3/Contract-Automation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch already-authorized Phase 0 finalization, without rerunning machine tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run lite-solo-phase0-bootstrap-v1.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f campaign_id=cyavkatv25b-r6 \
            -f campaign_path='campaigns/cyavKATv25b r6' \
            -f audit_controller_ref=main \
            -f authorization_confirmed=true \
            -f resume_from_finalize=true
          echo 'Dispatched Phase 0 finalize for existing lite-solo campaign cyavkatv25b-r6.' >> "$GITHUB_STEP_SUMMARY"
