name: Katana Network Specific Anvil Simulator v13

on:
  push:
    paths:
      - 'packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v13/requests/*.json'
      - '.github/workflows/katana-network-specific-anvil-simulator-v13.yml'
      - 'packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v13/run-v13.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cyvbwbtc-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout verified Smart-Contracts candidate
        uses: actions/checkout@v4
        with:
          repository: curveyield3/Smart-Contracts
          ref: 9c9a28f06eef0ed55498b630098d49f8a8a778c5
          path: .smart-contracts
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Contract-Automation dependencies
        run: npm ci --force

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install forge-std in Smart-Contracts checkout
        working-directory: .smart-contracts
        run: forge install foundry-rs/forge-std --no-git

      - name: Run cyvbWBTC full lifecycle on Katana Anvil fork
        shell: bash
        run: |
          set -euo pipefail
          rm -rf katana-cyvbwbtc-simulation-v13-output
          node packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v13/run-v13.mjs \
            --smart-contracts-root .smart-contracts \
            --fork-url https://katana.drpc.org/ \
            --deposit-amount 200000 \
            --output katana-cyvbwbtc-simulation-v13-output

      - name: Show lifecycle result
        if: always()
        shell: bash
        run: |
          RESULT=katana-cyvbwbtc-simulation-v13-output/KATANA_CYVBWBTC_LIFECYCLE_RESULT_v13.json
          if [ -f "$RESULT" ]; then
            cat "$RESULT"
          else
            echo "::error::Lifecycle result missing"
          fi

      - name: Persist lifecycle result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULT=katana-cyvbwbtc-simulation-v13-output/KATANA_CYVBWBTC_LIFECYCLE_RESULT_v13.json
          test -f "$RESULT" || exit 0
          DEST=packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v13/results/KATANA_CYVBWBTC_LIFECYCLE_RESULT_v13.json
          mkdir -p "$(dirname "$DEST")"
          cp "$RESULT" "$DEST"
          git config user.name "curveyield3 CI"
          git config user.email "actions@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "sim: record Katana cyvbWBTC lifecycle result v13 [skip ci]"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main || true
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
