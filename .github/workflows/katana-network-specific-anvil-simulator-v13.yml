name: Katana Network Specific Anvil Simulator v13

on:
  push:
    paths:
      - 'packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v13/requests/*.json'
      - '.github/workflows/katana-network-specific-anvil-simulator-v13.yml'
      - 'packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v13/run-v13.mjs'
      - 'test/katana/cyavkat-morpho-partial-fork-v3.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cyvbwbtc-lifecycle:
    if: ${{ !contains(github.event.head_commit.message, '[cyavkat-morpho-exit]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout verified Smart-Contracts candidate
        uses: actions/checkout@v4
        with:
          repository: curveyield3/Smart-Contracts
          ref: 9c9a28f06eef0ed55498b630098d49f8a8a778c5
          path: .smart-contracts
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Contract-Automation dependencies
        run: npm ci --force

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install forge-std in Smart-Contracts checkout
        working-directory: .smart-contracts
        run: forge install foundry-rs/forge-std --no-git

      - name: Run cyvbWBTC full lifecycle on Katana Anvil fork
        shell: bash
        run: |
          set -euo pipefail
          rm -rf katana-cyvbwbtc-simulation-v13-output
          node packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v13/run-v13.mjs \
            --smart-contracts-root .smart-contracts \
            --fork-url https://katana.drpc.org/ \
            --deposit-amount 200000 \
            --output katana-cyvbwbtc-simulation-v13-output

      - name: Show lifecycle result
        if: always()
        shell: bash
        run: |
          RESULT=katana-cyvbwbtc-simulation-v13-output/KATANA_CYVBWBTC_LIFECYCLE_RESULT_v13.json
          if [ -f "$RESULT" ]; then
            cat "$RESULT"
          else
            echo "::error::Lifecycle result missing"
          fi

      - name: Persist lifecycle result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULT=katana-cyvbwbtc-simulation-v13-output/KATANA_CYVBWBTC_LIFECYCLE_RESULT_v13.json
          test -f "$RESULT" || exit 0
          DEST=packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v13/results/KATANA_CYVBWBTC_LIFECYCLE_RESULT_v13.json
          mkdir -p "$(dirname "$DEST")"
          cp "$RESULT" "$DEST"
          git config user.name "curveyield3 CI"
          git config user.email "actions@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "sim: record Katana cyvbWBTC lifecycle result v13 [skip ci]"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main || true
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

  cyavkat-morpho-partial-exit:
    if: ${{ contains(github.event.head_commit.message, '[cyavkat-morpho-exit]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned JS dependencies and Anvil
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Start pinned Katana Anvil fork (no public-chain writes)
        shell: bash
        env:
          KATANA_UPSTREAM: ${{ secrets.RPC_KATANA }}
        run: |
          set -euo pipefail
          upstream="${KATANA_UPSTREAM:-https://katana.drpc.org/}"
          echo "::add-mask::$upstream"
          test "$(cast chain-id --rpc-url "$upstream")" = 747474
          PIN="$(cast block-number --rpc-url "$upstream")"
          [[ "$PIN" =~ ^[0-9]+$ ]] && [ "$PIN" -gt 0 ]
          HASH="$(cast block "$PIN" --field hash --rpc-url "$upstream" | tr -d '\r\n')"
          (timeout 28m anvil --fork-url "$upstream" --fork-block-number "$PIN" --chain-id 747474 --port 8545 --host 127.0.0.1 > "$RUNNER_TEMP/avkat-anvil.log" 2>&1 &)
          ready=0
          for i in $(seq 1 90); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1 || { tail -100 "$RUNNER_TEMP/avkat-anvil.log"; exit 1; }
          test "$(cast chain-id --rpc-url http://127.0.0.1:8545)" = 747474
          test "$(cast block "$PIN" --field hash --rpc-url http://127.0.0.1:8545 | tr -d '\r\n')" = "$HASH"
          echo "Pinned Katana fork block $PIN, hash $HASH. All writes LOCAL to Anvil." >> "$GITHUB_STEP_SUMMARY"
      - name: Simulate 40 percent collateral withdrawal targeting 76.6 percent LTV
        run: node test/katana/cyavkat-morpho-partial-fork-v3.mjs
      - name: Display evidence and fork receipts
        if: always()
        shell: bash
        run: |
          if [ -f cyavkat-morpho-partial-fork-v3.json ]; then
            cat cyavkat-morpho-partial-fork-v3.json
            echo '### avKAT Morpho unwind simulation' >> "$GITHUB_STEP_SUMMARY"
            jq -r '"Status: " + .status, "Pinned block: " + (.forkBlock|tostring), "Estimated gas: " + (.gas.estimated // "unavailable")' cyavkat-morpho-partial-fork-v3.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::Simulation evidence missing'
            tail -100 "$RUNNER_TEMP/avkat-anvil.log" || true
          fi
      - name: Upload immutable simulation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyavkat-morpho-partial-fork-v3-${{ github.run_id }}
          path: cyavkat-morpho-partial-fork-v3.json
          if-no-files-found: warn
          retention-days: 30
