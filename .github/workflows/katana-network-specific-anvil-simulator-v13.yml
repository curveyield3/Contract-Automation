name: Katana Network Specific Anvil Simulator v13

on:
  push:
    paths:
      - 'packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v13/requests/*.json'
      - '.github/workflows/katana-network-specific-anvil-simulator-v13.yml'
      - 'packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v13/run-v13.mjs'
      - 'test/katana/cyavkat-morpho-fulfill-safe-batch-v6.mjs'
      - 'test/katana/cyavkat-safe-proposal-ltv-swap-v1.mjs'
      - 'test/katana/cyavkat-scheduled-recovery-v9.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cyvbwbtc-lifecycle:
    if: ${{ !contains(github.event.head_commit.message, '[cyavkat-morpho-exit]') && !contains(github.event.head_commit.message, '[cyavkat-ltv-swap]') && !contains(github.event.head_commit.message, '[cyavkat-scheduled]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout verified Smart-Contracts candidate
        uses: actions/checkout@v4
        with:
          repository: curveyield3/Smart-Contracts
          ref: 9c9a28f06eef0ed55498b630098d49f8a8a778c5
          path: .smart-contracts
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Contract-Automation dependencies
        run: npm ci --force

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install forge-std in Smart-Contracts checkout
        working-directory: .smart-contracts
        run: forge install foundry-rs/forge-std --no-git

      - name: Run cyvbWBTC full lifecycle on Katana Anvil fork
        shell: bash
        run: |
          set -euo pipefail
          rm -rf katana-cyvbwbtc-simulation-v13-output
          node packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v13/run-v13.mjs \
            --smart-contracts-root .smart-contracts \
            --fork-url https://katana.drpc.org/ \
            --deposit-amount 200000 \
            --output katana-cyvbwbtc-simulation-v13-output

      - name: Show lifecycle result
        if: always()
        shell: bash
        run: |
          RESULT=katana-cyvbwbtc-simulation-v13-output/KATANA_CYVBWBTC_LIFECYCLE_RESULT_v13.json
          if [ -f "$RESULT" ]; then
            cat "$RESULT"
          else
            echo "::error::Lifecycle result missing"
          fi

      - name: Persist lifecycle result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULT=katana-cyvbwbtc-simulation-v13-output/KATANA_CYVBWBTC_LIFECYCLE_RESULT_v13.json
          test -f "$RESULT" || exit 0
          DEST=packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v13/results/KATANA_CYVBWBTC_LIFECYCLE_RESULT_v13.json
          mkdir -p "$(dirname "$DEST")"
          cp "$RESULT" "$DEST"
          git config user.name "curveyield3 CI"
          git config user.email "actions@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "sim: record Katana cyvbWBTC lifecycle result v13 [skip ci]"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main || true
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

  cyavkat-morpho-partial-exit:
    if: ${{ contains(github.event.head_commit.message, '[cyavkat-morpho-exit]') || contains(github.event.head_commit.message, '[cyavkat-ltv-swap]') || contains(github.event.head_commit.message, '[cyavkat-scheduled]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned JS dependencies and Anvil
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Checkout canonical Smart-Contracts for corrected fee-fuse compilation
        if: ${{ contains(github.event.head_commit.message, '[cyavkat-scheduled]') }}
        uses: actions/checkout@v4
        with:
          repository: curveyield3/Smart-Contracts
          ref: main
          path: .smart-contracts
          persist-credentials: false
      - name: Build canonical corrected IPOR fee-burn fuse for fork-only CREATE2
        if: ${{ contains(github.event.head_commit.message, '[cyavkat-scheduled]') }}
        working-directory: .smart-contracts/cyavKAT Ipor Vault/next-phase
        shell: bash
        run: |
          set -euo pipefail
          grep -qi '465d2ff0062318fe6f4c7e9ac78cfcd70bc86a1d992722875ef83a9770513100' ../ipor-fusion/contracts/libraries/PlasmaVaultStorageLib.sol
          forge build ../ipor-fusion/contracts/fuses/burn_request_fee/BurnRequestFeeFuse.sol --force --skip test
          test -s out/BurnRequestFeeFuse.sol/BurnRequestFeeFuse.json
      - name: Start pinned Katana Anvil fork (no public-chain writes)
        shell: bash
        env:
          KATANA_UPSTREAM: ${{ secrets.RPC_KATANA }}
        run: |
          set -euo pipefail
          upstream="${KATANA_UPSTREAM:-https://katana.drpc.org/}"
          echo "::add-mask::$upstream"
          test "$(cast chain-id --rpc-url "$upstream")" = 747474
          PIN="$(cast block-number --rpc-url "$upstream")"
          [[ "$PIN" =~ ^[0-9]+$ ]] && [ "$PIN" -gt 0 ]
          HASH="$(cast block "$PIN" --field hash --rpc-url "$upstream" | tr -d '\r\n')"
          (timeout 28m anvil --fork-url "$upstream" --fork-block-number "$PIN" --chain-id 747474 --port 8545 --host 127.0.0.1 > "$RUNNER_TEMP/avkat-anvil.log" 2>&1 &)
          ready=0
          for i in $(seq 1 90); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1 || { tail -100 "$RUNNER_TEMP/avkat-anvil.log"; exit 1; }
          test "$(cast chain-id --rpc-url http://127.0.0.1:8545)" = 747474
          test "$(cast block "$PIN" --field hash --rpc-url http://127.0.0.1:8545 | tr -d '\r\n')" = "$HASH"
          echo "Pinned Katana fork block $PIN, hash $HASH. All writes LOCAL to Anvil." >> "$GITHUB_STEP_SUMMARY"
      - name: Simulate OWNER Safe callback unwind and full 6113 avKAT pending withdrawal request fulfillment
        if: ${{ contains(github.event.head_commit.message, '[cyavkat-morpho-exit]') }}
        run: node test/katana/cyavkat-morpho-fulfill-safe-batch-v6.mjs
      - name: Replay exact queued Safe role grants, Morpho exit and KAT-to-avKAT swap; prove idle ERC4626 withdrawal
        if: ${{ contains(github.event.head_commit.message, '[cyavkat-ltv-swap]') }}
        run: node test/katana/cyavkat-safe-proposal-ltv-swap-v1.mjs
      - name: Run two-block 0% scheduled request and full flash-deleverage Safe recovery
        if: ${{ contains(github.event.head_commit.message, '[cyavkat-scheduled]') }}
        run: node test/katana/cyavkat-scheduled-recovery-v9.mjs
      - name: Show scheduled recovery checkpoint outcomes
        if: ${{ always() && contains(github.event.head_commit.message, '[cyavkat-scheduled]') }}
        shell: bash
        run: |
          if [ -f cyavkat-scheduled-recovery-v9-report.json ]; then
            jq '{version,status,fork,plan,errors,atomic,steps: [.steps[] | {n,ltvBps,idleAvkat,safeAvkat,managerEarnedShares,safeShares}]}' cyavkat-scheduled-recovery-v9-report.json
            if [ -f cyavkat-scheduled-recovery-v9-proposal.json ]; then
              echo 'Fork-only atomic Safe proposal v9 verified; no public Katana writes performed.' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo '::error::Scheduled withdrawal fork evidence missing'
            tail -80 "$RUNNER_TEMP/avkat-anvil.log" || true
          fi
      - name: Display evidence and fork receipts
        if: ${{ always() && contains(github.event.head_commit.message, '[cyavkat-morpho-exit]') }}
        shell: bash
        run: |
          if [ -f cyavkat-morpho-fulfill-safe-batch-v6-report.json ]; then
            cat cyavkat-morpho-fulfill-safe-batch-v6-report.json
            if [ -f cyavkat-morpho-fulfill-safe-batch-v6.json ]; then
              echo "SAFE_BATCH_JSON_V6=$(jq -c . cyavkat-morpho-fulfill-safe-batch-v6.json)"
            fi
            echo '### avKAT Morpho unwind simulation' >> "$GITHUB_STEP_SUMMARY"
            jq -r '"Status: " + .status, "Pinned block: " + (.forkBlock|tostring), "Estimated gas: " + (.gas.estimated // "unavailable")' cyavkat-morpho-fulfill-safe-batch-v6-report.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::Simulation evidence missing'
            tail -100 "$RUNNER_TEMP/avkat-anvil.log" || true
          fi
      - name: Display exact queued Safe replay and vault-user withdrawal evidence
        if: ${{ always() && contains(github.event.head_commit.message, '[cyavkat-ltv-swap]') }}
        shell: bash
        run: |
          if [ -f cyavkat-safe-proposal-ltv-swap-v1-report.json ]; then
            cat cyavkat-safe-proposal-ltv-swap-v1-report.json
            echo '### cyavKAT queued Safe proposal live fork v1' >> "$GITHUB_STEP_SUMMARY"
            jq -r '"Status: " + .status, "Pinned block: " + (.pinnedBlock.number|tostring), "Atomic resulting LTV bps: " + (.atomic.resultingLtvBps // "unavailable"), "Swap output avKAT: " + (.atomic.swappedAvkat // "unavailable"), "Vault withdrawal successful: " + ((.withdrawability.atomic.success // false)|tostring)' cyavkat-safe-proposal-ltv-swap-v1-report.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::Queued-Safe fork evidence missing'
            tail -100 "$RUNNER_TEMP/avkat-anvil.log" || true
          fi
      - name: Upload immutable simulation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyavkat-morpho-fulfill-safe-batch-v6-${{ github.run_id }}
          path: |
            cyavkat-morpho-fulfill-safe-batch-v6-report.json
            cyavkat-morpho-fulfill-safe-batch-v6.json
            cyavkat-safe-proposal-ltv-swap-v1-report.json
            cyavkat-scheduled-recovery-v9-report.json
            cyavkat-scheduled-recovery-v9-proposal.json
          if-no-files-found: warn
          retention-days: 30
