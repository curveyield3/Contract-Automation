name: Browser Stop-Click Self-Test v1

# Proves on the real runner desktop that the watchdog's human X11 stop click lands on
# the ChatGPT send/stop button and unfreezes a generating chat. Uses a scratch chat only.
on:
  workflow_dispatch:
    inputs:
      chat_url:
        description: Scratch ChatGPT chat URL (never an audit reviewer chat)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  # Same shared browser-session queue as wakes and watchdog sweeps.
  group: chatgpt-shared-browser-session-v1
  cancel-in-progress: false

jobs:
  stop-click:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CHATGPT_STORAGE_STATE_B64: ${{ secrets.CHATGPT_STORAGE_STATE_B64 }}
      BROWSER_HEADLESS: 'false'
      DISPLAY: ':99'
      INTERACTIVE_VIEW_ENABLED: 'true'
      MANUAL_CHALLENGE_WAIT_MS: '900000'
      HOME_EXIT_NODE: ${{ vars.BROWSER_HOME_EXIT_NODE || '100.112.238.56' }}
      CHAT_URL: ${{ inputs.chat_url }}
      WAKE_ID: stop-click-self-test-${{ github.run_id }}
    steps:
      - name: Checkout trusted Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Refuse registered audit chats
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHAT_URL" =~ ^https://chatgpt\.com/(g/[^/]+/)?c/[0-9a-f-]{36}$ ]] || { echo "::error::chat_url must be a saved chatgpt.com/c/<uuid> chat"; exit 1; }
          for f in $(gh api "repos/$GITHUB_REPOSITORY/contents/process/browser-agent-wake/registrations?ref=main" --jq '.[].path'); do
            if gh api "repos/$GITHUB_REPOSITORY/contents/$f?ref=main" --jq '.content' | base64 -d | grep -qF "${CHAT_URL##*/c/}"; then
              echo "::error::chat_url is a registered audit chat ($f)"; exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up isolated browser-agent runtime
        uses: ./.github/actions/setup-browser-agent-runtime

      - name: Install private VNC helper
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y x11vnc xclip xdotool scrot imagemagick
          command -v scrot >/dev/null
          command -v xclip >/dev/null

      - name: Record runner egress before home exit node
        shell: bash
        run: |
          set -euo pipefail
          direct="$(curl -fsS --max-time 15 https://api.ipify.org)"
          test -n "$direct"
          printf '%s' "$direct" | sha256sum | awk '{print "DIRECT_EGRESS_HASH="$1}' >> "$GITHUB_ENV"

      - name: Connect runner to tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:audit-browser
          ping: ${{ env.HOME_EXIT_NODE }}

      - name: Start visible Chrome display and private tailnet VNC
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension RANDR >/tmp/xvfb-browser-watchdog.log 2>&1 &
          echo $! >/tmp/xvfb-browser-watchdog.pid
          for i in {1..20}; do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 1
          done
          xdpyinfo -display :99 >/dev/null 2>&1 || { cat /tmp/xvfb-browser-watchdog.log || true; exit 1; }
          ts_ip="$(tailscale ip -4 | head -n1)"
          test -n "$ts_ip"
          echo "TAILSCALE_RUNNER_IP=$ts_ip" >> "$GITHUB_ENV"
          x11vnc -display :99 -rfbport 5900 -listen "$ts_ip" -nopw -forever -shared -quiet >/tmp/x11vnc-browser-watchdog.log 2>&1 &
          echo $! >/tmp/x11vnc-browser-watchdog.pid
          echo "TAILSCALE_VNC=$ts_ip:5900"

      - name: Route self-test browser through home exit node
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 3s 10s tailscale status
          timeout -k 5s 20s sudo tailscale set --exit-node="$HOME_EXIT_NODE"
          changed=false
          for i in {1..8}; do
            current="$(curl -fsS --connect-timeout 3 --max-time 5 https://api.ipify.org || true)"
            if [ -n "$current" ]; then
              current_hash="$(printf '%s' "$current" | sha256sum | awk '{print $1}')"
              if [ "$current_hash" != "$DIRECT_EGRESS_HASH" ]; then changed=true; break; fi
            fi
            sleep 2
          done
          [ "$changed" = true ] || { echo "::error::Tailscale exit node did not change runner egress."; exit 1; }
          echo "HOME_EXIT_EGRESS_ACTIVE=true"


      - name: Start a long generation in the scratch chat
        shell: bash
        run: |
          set -euo pipefail
          export WAKE_MESSAGE='Stop-click self-test. Write a 4000-word essay on the history of bridges in 40 numbered paragraphs.'
          export WAKE_RESULT_PATH=/tmp/selftest-start.json
          bash scripts/browser-deliver-message-v1.sh | tee /tmp/selftest-start.out
          grep -qx 'ok=true' /tmp/selftest-start.out || { echo "::error::could not start generation"; exit 1; }
          mv /tmp/browser-wake-evidence-v1 /tmp/selftest-evidence-1-start

      - name: Poke with stop-before-send while it is still generating
        shell: bash
        run: |
          set -euo pipefail
          export STOP_BEFORE_SEND='true'
          export WAKE_MESSAGE='Stop-click self-test poke. Reply with the single word OK.'
          export WAKE_RESULT_PATH=/tmp/selftest-poke.json
          bash scripts/browser-deliver-message-v1.sh | tee /tmp/selftest-poke.out || true
          mv /tmp/browser-wake-evidence-v1 /tmp/selftest-evidence-2-poke || true
          status="$(jq -r '.stopClick.status // "NO_STOP_CLICK"' "$WAKE_RESULT_PATH")"
          {
            echo "## Stop-click self-test"
            echo "- stop click: \`$(jq -c '.stopClick // null' "$WAKE_RESULT_PATH")\`"
            echo "- poke sent: $(sed -n 's/^ok=//p' /tmp/selftest-poke.out)"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$status" = STOP_CLICKED_BUTTON_CHANGED || { echo "::error::stop click verification failed: $status"; exit 1; }
          grep -qx 'ok=true' /tmp/selftest-poke.out || { echo "::error::poke was not sent after stopping"; exit 1; }
          echo "PASS: stop click landed on the button, changed it, and the poke was sent."

      - name: Disable home exit node
        if: always()
        shell: bash
        run: |
          set +e
          sudo tailscale set --exit-node=""

      - name: Cleanup browser display
        if: always()
        shell: bash
        run: |
          set +e
          [ -f /tmp/x11vnc-browser-watchdog.pid ] && kill "$(cat /tmp/x11vnc-browser-watchdog.pid)" 2>/dev/null
          [ -f /tmp/xvfb-browser-watchdog.pid ] && kill "$(cat /tmp/xvfb-browser-watchdog.pid)" 2>/dev/null

      - name: Upload desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stop-click-self-test-${{ github.run_id }}
          path: /tmp/selftest-evidence-*/
          if-no-files-found: warn
          retention-days: 7
