name: BoostHub v51 Ethereum source-only compile v1
on:
  push:
    branches: [boosthub-v51-safe-staging-v1]
    paths:
      - '.github/workflows/boosthub-v11-fraxtal-converter-anvil-v1.yml'
      - 'github-native-sim/boosthub-fraxtal-v40/v51-essential-source-v1.tar.xz'
      - 'github-native-sim/boosthub-fraxtal-v40/tooling/v51-safe-builder-v1.cjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile-v51:
    name: Compile exact BoostHub v51 staking and strategies, no tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Install source and pinned compiler dependencies
        working-directory: github-native-sim/boosthub-fraxtal-v40
        run: |
          set -euo pipefail
          tar -xJf v51-essential-source-v1.tar.xz
          pip install vyper==0.4.3
          npm install --prefix dependencies --ignore-scripts --no-audit --no-fund
          forge --version
          vyper --version
      - name: Build Solidity and Vyper artifacts without running tests
        working-directory: github-native-sim/boosthub-fraxtal-v40
        run: |
          set -euo pipefail
          python tooling/make_staking_artifact.py
          forge build --root . contracts/StrategyConvexBoostHubStakingV5.sol contracts/StrategyBoostHubChildV42.sol contracts/StrategyConvexFXNPool8V42.sol contracts/StrategyDualFXNMasterV42.sol contracts/BeefyVaultV7FixedV2.sol --force -vvv
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('build/forge')
          out={}
          for name in ('StrategyConvexBoostHubStakingV5','StrategyBoostHubChildV42','StrategyConvexFXNPool8V42','StrategyDualFXNMasterV42','BeefyVaultV7FixedV2'):
              files=list(root.rglob(name+'.json'))
              if len(files)!=1: raise SystemExit('Missing or duplicate artifact '+name+': '+str(files))
              a=json.loads(files[0].read_text())
              bc=a['bytecode']['object']; deployed=a['deployedBytecode']['object']
              assert bc.startswith('0x') and deployed.startswith('0x')
              out[name]={'creationBytes':(len(bc)-2)//2,'runtimeBytes':(len(deployed)-2)//2,'artifact':str(files[0])}
              if out[name]['runtimeBytes']>24576: raise SystemExit('Runtime EIP170 limit exceeded: '+name)
          a=json.loads(pathlib.Path('artifacts/staking.json').read_text())
          out['BoostHubStaking']={'creationBytes':(len(a['bytecode'])-2)//2,'runtimeBytes':(len(a['deployedBytecode'])-2)//2,'artifact':'artifacts/staking.json'}
          if out['BoostHubStaking']['runtimeBytes']>24576: raise SystemExit('Staking runtime EIP170 limit exceeded')
          pathlib.Path('build/v51-runtime-manifest-v1.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Build two equal-size Ethereum Safe proposals from exact v51 and v23 artifacts
        working-directory: github-native-sim/boosthub-fraxtal-v40
        env:
          RPC_ETHEREUM: ${{ secrets.RPC_ETHEREUM }}
        run: |
          set -euo pipefail
          test -n "$RPC_ETHEREUM"
          npm install --prefix .safe-builder-node --ignore-scripts --no-audit --no-fund --no-save ethers@6.14.4
          mkdir -p build/pol-artifacts-v23
          git fetch --depth=1 origin cyvlsdt-pol-v23-morpho-v2-safe-v1
          for f in CurveYieldSafeDeployHelper-v1-Artifact.json Build-Manifest-v5.json Safe-Transaction-Builder-AddOn-v5.json Predicted-Addresses-and-ConstructorArgs-v5.json; do
            git show "FETCH_HEAD:github-native-sim/cyvlsdt-runtime-compare-v1/pol-configurable-v8-v4/outputs-v5/$f" > "build/pol-artifacts-v23/$f"
          done
          export NODE_PATH="$PWD/.safe-builder-node/node_modules"
          node tooling/v51-safe-builder-v1.cjs
      - name: Read back Safe service registration for both exact EIP-712 hashes
        working-directory: github-native-sim/boosthub-fraxtal-v40
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,pathlib,hashlib
          base=pathlib.Path('build/safe-mainnet-v51-v23-v1')
          safe='0x47623C62f281807D615eeb4A2CEee9d97F9D3C49'
          hashes=[
            '0x7a751ed1152e3a813b4e37eb5cc68693c75cd3c6fce839c7bede12a695bdce93',
            '0x1353ba3508f09dd9a197928b7595aa62fd776f1443d733587d9892c3c8439b35']
          out=[]
          for i,h in enumerate(hashes,1):
            expected=json.loads((base/('Safe-Batch-'+str(i)+'-v1.json')).read_text())
            url='https://safe-transaction-mainnet.safe.global/api/v1/multisig-transactions/'+h+'/'
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'CurveYield-GitHub-Safe-Queue-Verify-v1'}),timeout=60) as resp:
              record=json.load(resp)
            verified=(record.get('safe','').lower()==safe.lower() and
              record.get('safeTxHash','').lower()==h.lower() and
              record.get('to','').lower()==expected['to'].lower() and
              str(record.get('nonce'))==expected['nonce'] and
              int(record.get('operation',-1))==1 and
              record.get('data','').lower()==expected['data'].lower() and
              not record.get('isExecuted',True))
            if not verified: raise SystemExit('Safe service registration did not match batch '+str(i))
            out.append({'batch':i,'safeTxHash':h,'nonce':record['nonce'],'queueVerified':True,
              'executed':record['isExecuted'],'confirmationsRequired':record.get('confirmationsRequired'),
              'confirmations':len(record.get('confirmations') or []),
              'calldataSha256':hashlib.sha256(bytes.fromhex(expected['data'][2:])).hexdigest()})
          (base/'Safe-Queue-Verification-v1.json').write_text(json.dumps(out,indent=2)+'\\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Commit compiled bytecode and sizes to source branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f github-native-sim/boosthub-fraxtal-v40/artifacts/staking.json
          git add -f github-native-sim/boosthub-fraxtal-v40/build/forge/
          git add -f github-native-sim/boosthub-fraxtal-v40/build/v51-runtime-manifest-v1.json
          git add -f github-native-sim/boosthub-fraxtal-v40/build/safe-mainnet-v51-v23-v1/
          git commit -m 'Preserve exact v51 bytecode and two balanced Ethereum Safe batches v1'
          git push origin HEAD:boosthub-v51-safe-staging-v1
      - name: Upload compiled artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BoostHub-v51-Ethereum-Compiled-v1
          path: |
            github-native-sim/boosthub-fraxtal-v40/artifacts/staking.json
            github-native-sim/boosthub-fraxtal-v40/build/forge/
            github-native-sim/boosthub-fraxtal-v40/build/v51-runtime-manifest-v1.json
            github-native-sim/boosthub-fraxtal-v40/build/safe-mainnet-v51-v23-v1/
          if-no-files-found: warn
          retention-days: 90
