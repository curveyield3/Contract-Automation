name: BoostHub v51 Ethereum source-only compile v1
on:
  push:
    branches: [boosthub-v51-safe-staging-v1]
    paths:
      - '.github/workflows/boosthub-v11-fraxtal-converter-anvil-v1.yml'
      - 'github-native-sim/boosthub-fraxtal-v40/v51-essential-source-v1.tar.xz'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile-v51:
    name: Compile exact BoostHub v51 staking and strategies, no tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Install source and pinned compiler dependencies
        working-directory: github-native-sim/boosthub-fraxtal-v40
        run: |
          set -euo pipefail
          tar -xJf v51-essential-source-v1.tar.xz
          pip install vyper==0.4.3
          npm install --prefix dependencies --ignore-scripts --no-audit --no-fund
          forge --version
          vyper --version
      - name: Build Solidity and Vyper artifacts without running tests
        working-directory: github-native-sim/boosthub-fraxtal-v40
        run: |
          set -euo pipefail
          python tooling/make_staking_artifact.py
          forge build --root . contracts/StrategyConvexBoostHubStakingV5.sol contracts/StrategyBoostHubChildV42.sol contracts/StrategyConvexFXNPool8V42.sol contracts/StrategyDualFXNMasterV42.sol contracts/BeefyVaultV7FixedV2.sol --force -vvv
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('build/forge')
          out={}
          for name in ('StrategyConvexBoostHubStakingV5','StrategyBoostHubChildV42','StrategyConvexFXNPool8V42','StrategyDualFXNMasterV42','BeefyVaultV7FixedV2'):
              files=list(root.rglob(name+'.json'))
              if len(files)!=1: raise SystemExit('Missing or duplicate artifact '+name+': '+str(files))
              a=json.loads(files[0].read_text())
              bc=a['bytecode']['object']; deployed=a['deployedBytecode']['object']
              assert bc.startswith('0x') and deployed.startswith('0x')
              out[name]={'creationBytes':(len(bc)-2)//2,'runtimeBytes':(len(deployed)-2)//2,'artifact':str(files[0])}
              if out[name]['runtimeBytes']>24576: raise SystemExit('Runtime EIP170 limit exceeded: '+name)
          a=json.loads(pathlib.Path('artifacts/staking.json').read_text())
          out['BoostHubStaking']={'creationBytes':(len(a['bytecode'])-2)//2,'runtimeBytes':(len(a['deployedBytecode'])-2)//2,'artifact':'artifacts/staking.json'}
          if out['BoostHubStaking']['runtimeBytes']>24576: raise SystemExit('Staking runtime EIP170 limit exceeded')
          pathlib.Path('build/v51-runtime-manifest-v1.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Commit compiled bytecode and sizes to source branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f github-native-sim/boosthub-fraxtal-v40/artifacts/staking.json
          git add -f github-native-sim/boosthub-fraxtal-v40/build/forge/
          git add -f github-native-sim/boosthub-fraxtal-v40/build/v51-runtime-manifest-v1.json
          git commit -m 'Preserve BoostHub v51 exact bytecode and runtime sizes'
          git push origin HEAD:boosthub-v51-safe-staging-v1
      - name: Upload compiled artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BoostHub-v51-Ethereum-Compiled-v1
          path: |
            github-native-sim/boosthub-fraxtal-v40/artifacts/staking.json
            github-native-sim/boosthub-fraxtal-v40/build/forge/
            github-native-sim/boosthub-fraxtal-v40/build/v51-runtime-manifest-v1.json
          if-no-files-found: warn
          retention-days: 90
