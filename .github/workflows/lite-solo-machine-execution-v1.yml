name: Lite-Solo Generation-Bound Machine Execution v1
run-name: lite-solo-machine-${{ inputs.phase_sequence }}-${{ inputs.campaign_id }}
on:
  push:
    branches: [main]
    paths:
      - '.github/audit-dispatch/boosthub-phase5-one-v1.json'
  workflow_dispatch:
    inputs:
      campaign_id:
        description: Exact audit campaign ID including r-number
        type: string
        required: true
      generation_id:
        description: Immutable Audit-Controller campaignGenerationId
        type: string
        required: true
      phase_sequence:
        description: Phase of exact-generation machine requests
        type: number
        required: true
permissions:
  contents: write
  actions: write
concurrency:
  group: lite-solo-machine-${{ inputs.campaign_id }}-${{ inputs.generation_id }}-${{ inputs.phase_sequence }}
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore existing dependencies
        run: npm ci --force --ignore-scripts --no-audit --no-fund
      - name: Checkout only exact campaign generation
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          GENERATION_ID: ${{ inputs.generation_id }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            input=.github/audit-dispatch/boosthub-phase5-one-v1.json
            jq -e '.schemaVersion=="boosthub-phase5-one-target-v1" and .campaignId=="cloudflare-audit-boosthub-v9-20261029-mcp-0812-r1" and .generationId=="cloudflare-audit-boosthub-v9-20261029-mcp-0812-r1-g1-20261029T151418Z" and (.candidateKey|test("^[A-Za-z0-9._-]{1,128}$"))' "$input"
            CAMPAIGN_ID="$(jq -er .campaignId "$input")"
            GENERATION_ID="$(jq -er .generationId "$input")"
            echo "candidate_key=$(jq -er .candidateKey "$input")" >> "$GITHUB_OUTPUT"
          fi
          [[ "$CAMPAIGN_ID" =~ ^[A-Za-z0-9._-]+-r[0-9]+$ ]]
          slug="$(printf '%s' "$CAMPAIGN_ID" | sed -E 's/-r[0-9]+$//')"
          directory="Audit Campaign Directory/campaigns/$slug.json"
          encoded="$(jq -rn --arg p "$directory" '$p|split("/")|map(@uri)|join("/")')"
          gh api "repos/curveyield3/Audit-Controller/contents/$encoded?ref=main" --jq .content | base64 -d > /tmp/lite-machine-directory.json
          jq -e --arg id "$CAMPAIGN_ID" --arg gen "$GENERATION_ID" \
            '.campaignId==$id and .campaignGenerationId==$gen' /tmp/lite-machine-directory.json
          campaign_path="$(jq -er .workspacePath /tmp/lite-machine-directory.json)"
          bash scripts/lite-solo-checkout-bound-controller-v1.sh .audit-controller main "$campaign_path"
          echo "campaign_path=$campaign_path" >> "$GITHUB_OUTPUT"
      - name: Install the existing V7 execution toolchain in machine lane only
        uses: ./.github/actions/setup-v7-toolchain
      - name: Execute one accepted Foundry test against pinned live Ethereum Anvil fork
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          ETHEREUM_FORK_RPC_URL: ${{ secrets.RPC_ETHEREUM }}
          RPC_KATANA: ${{ secrets.RPC_KATANA }}
          RPC_BASE: ${{ secrets.RPC_BASE }}
          GENERATION_ID: cloudflare-audit-boosthub-v9-20261029-mcp-0812-r1-g1-20261029T151418Z
          CANDIDATE_KEY: ${{ steps.scope.outputs.candidate_key }}
          CAMPAIGN_PATH: ${{ steps.scope.outputs.campaign_path }}
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_KEY"
          request=".audit-controller/$CAMPAIGN_PATH/work/phase-05/execution-requests/$CANDIDATE_KEY.json"
          test -s "$request"
          jq -e --arg src "876bae622270c99a48fa7cf5e984ee0b46f74b02d38e32a2be394bbc69aeb5b3" \
            '.gateId=="phase5-target-execution" and .source.archiveSha256==$src and .configuration.v26.reproduction.reproductionType=="FOUNDRY_TEST"' "$request"
          mkdir -p .isolated-phase5-evidence
          set +e
          AUDIT_CAMPAIGN_GENERATION_ID="$GENERATION_ID" \
            node packages/github-native-sim/src/v7-cli.mjs execute \
            --request "$request" --evidence-dir .isolated-phase5-evidence \
            --workspace ".audit-work/phase5-one/$CANDIDATE_KEY" \
            --compact-raw-result
          result=$?
          set -e
          CANDIDATE_KEY="$CANDIDATE_KEY" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import zlib from 'node:zlib';
          import crypto from 'node:crypto';
          const files=fs.readdirSync('.isolated-phase5-evidence',{withFileTypes:true}).filter(d=>d.isDirectory());
          if(files.length!==1)throw Error('Exactly one request evidence directory expected, received '+files.length);
          const p=path.join('.isolated-phase5-evidence',files[0].name);
          const env=JSON.parse(fs.readFileSync(path.join(p,'raw-result.json'),'utf8'));
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const packed=Buffer.concat(env.parts.map(f=>{
            const b=fs.readFileSync(path.join(p,f.file));
            if(hash(b)!==f.sha256)throw Error('Evidence chunk integrity failure');
            return b;
          }));
          if(hash(packed)!==env.compressedSha256)throw Error('Evidence gzip integrity failure');
          const full=zlib.gunzipSync(packed);
          if(hash(full)!==env.originalSha256)throw Error('Evidence raw integrity failure');
          const raw=JSON.parse(full.toString('utf8'));
          const n=raw.analysis?.nativeFuzz??{}, out=n.rawOutput??{};
          const scrub=s=>String(s??'').replace(/https?:\/\/\S+/g,'<redacted-rpc>');
          const record={candidate:process.env.CANDIDATE_KEY,status:raw.status,disposition:raw.disposition,
            preflight:raw.preflight?.status,slitherInvoked:Boolean(raw.analysis?.slither),
            foundryStatus:n.status,componentStatus:n.componentStatus,
            failureKind:n.failureKind,testExecution:n.testExecution,testResults:n.testResults,
            exitCode:out.exitCode,stdoutHead:scrub(out.stdout).slice(0,2000),
            stdoutTail:scrub(out.stdout).slice(-3500),stderrTail:scrub(out.stderr).slice(-2200),
            testAndErrorLines:(scrub(out.stdout)+'\n'+scrub(out.stderr)).split(/\r?\n/).filter(x=>/\[PASS\]|\[FAIL\]|(no tests match)|(Compiler run successful)|(Error \(\d+\))|(Suite result)|(Ran \d+ test)|(Test result)|(Failing tests)|(Warning: no tests)/i.test(x)).slice(-45),
            error:raw.error?.message??null};
          fs.writeFileSync(path.join(p,'ISOLATED_TEST_RESULT_v1.json'),JSON.stringify(record,null,2)+'\n');
          console.log('BOOSTHUB_PHASE5_ONE_RESULT_START');
          console.log(JSON.stringify(record,null,2));
          console.log('BOOSTHUB_PHASE5_ONE_RESULT_END');
          if(raw.analysis?.slither)process.exitCode=1;
          if(raw.status!=='completed'||n.componentStatus!=='COMPLETED'||n.testExecution?.successful!==true)process.exitCode=1;
          NODE
          test "$result" = 0
      - name: Retain single-test execution evidence
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-phase5-one-${{ github.run_id }}
          path: .isolated-phase5-evidence/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 20
      - name: Execute only this generation's explicit tests
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: result
        shell: bash
        env:
          ETHEREUM_FORK_RPC_URL: ${{ secrets.RPC_ETHEREUM }}
          RPC_KATANA: ${{ secrets.RPC_KATANA }}
          RPC_BASE: ${{ secrets.RPC_BASE }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          GENERATION_ID: ${{ inputs.generation_id }}
          PHASE_SEQUENCE: ${{ inputs.phase_sequence }}
          AUDIT_CAMPAIGN_GENERATION_ID: ${{ inputs.generation_id }}
        run: |
          set -euo pipefail
          node scripts/lite-solo-machine-execution-v1.mjs \
            --controller-root .audit-controller \
            --campaign-id "$CAMPAIGN_ID" \
            --generation-id "$GENERATION_ID" \
            --phase "$PHASE_SEQUENCE" > /tmp/lite-machine-execution.json
          cat /tmp/lite-machine-execution.json
          echo "status=$(jq -er .status /tmp/lite-machine-execution.json)" >> "$GITHUB_OUTPUT"
      - name: Publish only generation-owned requests and machine results
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          CAMPAIGN_PATH: ${{ steps.scope.outputs.campaign_path }}
          PHASE_SEQUENCE: ${{ inputs.phase_sequence }}
        run: |
          set -euo pipefail
          cd .audit-controller
          git config user.name 'CurveYield Lite-Solo Machine Executor'
          git config user.email 'lite-solo-machine-executor@users.noreply.github.com'
          tag="$(printf '%02d' "$PHASE_SEQUENCE")"
          git add -- "$CAMPAIGN_PATH/evidence/phase-$tag-machine"
          if [ "$PHASE_SEQUENCE" = 5 ]; then
            git add -- "$CAMPAIGN_PATH/evidence/phase5-boundary"
            if [ -d "$CAMPAIGN_PATH/work/phase-05/execution-requests" ]; then
              git add -- "$CAMPAIGN_PATH/work/phase-05/execution-requests"
            fi
            git add -- "$CAMPAIGN_PATH/controller/preflight"
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit(machine): generation-bound phase-$tag execution evidence"
          for attempt in $(seq 1 8); do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          echo '::error::Machine results could not be persisted at authoritative main' >&2
          exit 1
      - name: Re-enter existing unit finalization only after evidence was persisted
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.phase_sequence == 5 && steps.result.outputs.status == 'COMPLETE' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
        run: |
          # Re-enter the exact controller family; do not cross an Audit Preview
          # generation into an unrelated Lite-Solo request queue.
          if [[ "$CAMPAIGN_ID" == audit-preview-completion-* ]]; then
            workflow=audit-preview-completion-unit-controller-v1.yml
          else
            workflow=lite-solo-unit-controller-v1.yml
          fi
          gh workflow run "$workflow" \
            --repo "$GITHUB_REPOSITORY" -f campaign_id="$CAMPAIGN_ID"
