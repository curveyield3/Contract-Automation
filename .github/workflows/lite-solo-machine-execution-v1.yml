name: Lite-Solo Generation-Bound Machine Execution v1
run-name: lite-solo-machine-${{ inputs.phase_sequence }}-${{ inputs.campaign_id }}
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lite-solo-machine-execution-v1.yml'
  workflow_dispatch:
    inputs:
      campaign_id:
        description: Exact audit campaign ID including r-number
        type: string
        required: true
      generation_id:
        description: Immutable Audit-Controller campaignGenerationId
        type: string
        required: true
      phase_sequence:
        description: Phase of exact-generation machine requests
        type: number
        required: true
permissions:
  contents: write
  actions: write
concurrency:
  group: lite-solo-machine-${{ inputs.campaign_id }}-${{ inputs.generation_id }}-${{ inputs.phase_sequence }}
  cancel-in-progress: false
jobs:
  evidence-diagnostics:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select existing Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh
      - name: Extract authenticated existing Phase-5 raw reports (read only)
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import zlib from 'node:zlib';
          import {execFileSync} from 'node:child_process';
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const root='campaigns/cloudflare-audit-boosthub-v9-20261029-mcp-0812/cloudflare-audit-boosthub-v9-20261029-mcp-0812 r1/evidence/phase5-boundary';
          const cases=[
            ['Reward claim','P4-CAND-REWARD-CLAIM-SILENT-ERC20-FAIL','dar-f8d21764b6bc2f0eba01f8385669d0ec'],
            ['LP withdrawal','P4-CAND-LP-WITHDRAW-SILENT-ERC20-FAIL','dar-42de841c2d3ac8053537ce508eae1087'],
            ['Reward slot boundary','P4-CAND-STAKING-REWARD-SLOT-OVERFLOW','dar-51fce408bc6976ec1b023d355cc992ec'],
            ['Nested harvest','P4-CAND-STRATEGY-HARVEST-NESTED-CALL','dar-9f4b5b2591f8cc0bc07c8be5fd4a8bd9'],
            ['Last stake gauge','P4-CAND-LAST-STAKE-GAUGE-REWARDS-UNHARVESTED','dar-ffa81475b648dd58022c1c138aabd089'],
            ['Role/config binding','P4-CAND-LIVE-ROLE-CONFIG-BINDING','dar-cb6b19058d6982b9c6c691b7de9ba7d6'],
            ['Vault shares extinction','P5-CAND-VAULT-PARTIAL-REDEMPTION-SHARE-EXTINCTION','dar-a12283f08c3cb91d87e084094285278d']
          ];
          const scrub=x=>String(x??'').replace(/https?:\/\/\S+/g,'<redacted-url>').replace(/(?:Bearer|token|password|secret)\s*[=:]\s*\S+/gi,'<redacted-credential>');
          const api=(p)=>{
            const location='/repos/curveyield3/Audit-Controller/contents/'+p.split('/').map(encodeURIComponent).join('/')+'?ref=main';
            const json=JSON.parse(execFileSync('gh',['api',location],{maxBuffer:12*1024*1024,encoding:'utf8'}));
            // GitHub Contents API omits inline base64 above 1 MiB.
            // Fetch the immutable Git blob by SHA for those large evidence parts.
            const encoded=json.encoding==='base64'?json:
              json.sha?JSON.parse(execFileSync('gh',['api','/repos/curveyield3/Audit-Controller/git/blobs/'+json.sha],{maxBuffer:12*1024*1024,encoding:'utf8'})):null;
            if(encoded?.encoding!=='base64'||!encoded.content)throw Error('GitHub blob base64 unavailable for '+p);
            return Buffer.from(encoded.content.replace(/\s/g,''),'base64');
          };
          function extractOutput(comp){
            const o=comp?.rawOutput??{};
            const out=String(o.stdout??''),err=String(o.stderr??''),joined=out+'\n'+err;
            const lines=joined.split(/\r?\n/);
            const interesting=lines.filter(x=>/(?:No tests|no tests|No matches|Ran \d+ tests?|Suite result|Test result|\[PASS\]|\[FAIL\]|Compiler run failed|ParserError|TypeError|DeclarationError|Compilation failed|error:|Exception|Traceback|Error \(\d+\))/i.test(x));
            let parsed=null;
            if(out.trim().startsWith('{'))try{parsed=JSON.parse(out)}catch{}
            const detectors=parsed?.results?.detectors;
            const severities={};
            for(const d of Array.isArray(detectors)?detectors:[]){const k=d.impact??'UNKNOWN';severities[k]=(severities[k]??0)+1;}
            return {status:comp?.status??null,componentStatus:comp?.componentStatus??null,failureKind:comp?.failureKind??null,
              toolInvoked:comp?.toolInvoked??null,exitCode:o.exitCode??null,stdoutChars:out.length,stderrChars:err.length,
              parsedJSON:parsed?{success:parsed.success,errors:parsed.error??parsed.errors??null,keys:Object.keys(parsed),
                detectorCount:Array.isArray(detectors)?detectors.length:null,detectorSeverities:severities,
                detectorSamples:(detectors??[]).slice(0,7).map(d=>({check:d.check,impact:d.impact,description:scrub(d.description).slice(0,350)}))}:null,
              first:scrub(joined.slice(0,1500)),last:scrub(joined.slice(-2000)),
              interesting:interesting.slice(0,25).map(x=>scrub(x).slice(0,480)),
              testResults:comp?.testResults??null,testExecution:comp?.testExecution??null};
          }
          const report=[];
          for(const [label,key,id] of cases){
            const dir=root+'/'+key+'/'+id;
            const env=JSON.parse(api(dir+'/raw-result.json').toString('utf8'));
            const compressed=Buffer.concat(env.parts.map(p=>{
              const bytes=api(dir+'/'+p.file);
              if(hash(bytes)!==p.sha256)throw Error('part checksum invalid for '+key);
              return bytes;
            }));
            if(hash(compressed)!==env.compressedSha256)throw Error('compressed checksum invalid for '+key);
            const full=zlib.gunzipSync(compressed);
            if(hash(full)!==env.originalSha256)throw Error('raw checksum invalid for '+key);
            const raw=JSON.parse(full.toString('utf8'));
            report.push({label,key,requestId:id,integrity:'VERIFIED',rawBytes:full.length,
              overall:{status:raw.status,disposition:raw.disposition,blocking:raw.blocking,
                preflight:raw.preflight?.status,error:raw.error??null,
                analysisComponentFailureCount:raw.analysisComponentFailureCount,
                reproduction:raw.reproduction?.status},
              foundry:extractOutput(raw.analysis?.nativeFuzz),slither:extractOutput(raw.analysis?.slither)});
          }
          console.log('PHASE5_EXTRACTED_DIAGNOSTICS_START');
          console.log(JSON.stringify(report,null,2));
          console.log('PHASE5_EXTRACTED_DIAGNOSTICS_END');
          NODE
  execute:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore existing dependencies
        run: npm ci --force --ignore-scripts --no-audit --no-fund
      - name: Checkout only exact campaign generation
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          GENERATION_ID: ${{ inputs.generation_id }}
        run: |
          set -euo pipefail
          [[ "$CAMPAIGN_ID" =~ ^[A-Za-z0-9._-]+-r[0-9]+$ ]]
          slug="$(printf '%s' "$CAMPAIGN_ID" | sed -E 's/-r[0-9]+$//')"
          directory="Audit Campaign Directory/campaigns/$slug.json"
          encoded="$(jq -rn --arg p "$directory" '$p|split("/")|map(@uri)|join("/")')"
          gh api "repos/curveyield3/Audit-Controller/contents/$encoded?ref=main" --jq .content | base64 -d > /tmp/lite-machine-directory.json
          jq -e --arg id "$CAMPAIGN_ID" --arg gen "$GENERATION_ID" \
            '.campaignId==$id and .campaignGenerationId==$gen' /tmp/lite-machine-directory.json
          campaign_path="$(jq -er .workspacePath /tmp/lite-machine-directory.json)"
          bash scripts/lite-solo-checkout-bound-controller-v1.sh .audit-controller main "$campaign_path"
          echo "campaign_path=$campaign_path" >> "$GITHUB_OUTPUT"
      - name: Install the existing V7 execution toolchain in machine lane only
        uses: ./.github/actions/setup-v7-toolchain
      - name: Execute only this generation's explicit tests
        id: result
        shell: bash
        env:
          ETHEREUM_FORK_RPC_URL: ${{ secrets.RPC_ETHEREUM }}
          RPC_KATANA: ${{ secrets.RPC_KATANA }}
          RPC_BASE: ${{ secrets.RPC_BASE }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          GENERATION_ID: ${{ inputs.generation_id }}
          PHASE_SEQUENCE: ${{ inputs.phase_sequence }}
          AUDIT_CAMPAIGN_GENERATION_ID: ${{ inputs.generation_id }}
        run: |
          set -euo pipefail
          node scripts/lite-solo-machine-execution-v1.mjs \
            --controller-root .audit-controller \
            --campaign-id "$CAMPAIGN_ID" \
            --generation-id "$GENERATION_ID" \
            --phase "$PHASE_SEQUENCE" > /tmp/lite-machine-execution.json
          cat /tmp/lite-machine-execution.json
          echo "status=$(jq -er .status /tmp/lite-machine-execution.json)" >> "$GITHUB_OUTPUT"
      - name: Publish only generation-owned requests and machine results
        shell: bash
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          CAMPAIGN_PATH: ${{ steps.scope.outputs.campaign_path }}
          PHASE_SEQUENCE: ${{ inputs.phase_sequence }}
        run: |
          set -euo pipefail
          cd .audit-controller
          git config user.name 'CurveYield Lite-Solo Machine Executor'
          git config user.email 'lite-solo-machine-executor@users.noreply.github.com'
          tag="$(printf '%02d' "$PHASE_SEQUENCE")"
          git add -- "$CAMPAIGN_PATH/evidence/phase-$tag-machine"
          if [ "$PHASE_SEQUENCE" = 5 ]; then
            git add -- "$CAMPAIGN_PATH/evidence/phase5-boundary"
            if [ -d "$CAMPAIGN_PATH/work/phase-05/execution-requests" ]; then
              git add -- "$CAMPAIGN_PATH/work/phase-05/execution-requests"
            fi
            git add -- "$CAMPAIGN_PATH/controller/preflight"
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit(machine): generation-bound phase-$tag execution evidence"
          for attempt in $(seq 1 8); do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          echo '::error::Machine results could not be persisted at authoritative main' >&2
          exit 1
      - name: Re-enter existing unit finalization only after evidence was persisted
        if: ${{ inputs.phase_sequence == 5 && steps.result.outputs.status == 'COMPLETE' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
        run: |
          # Re-enter the exact controller family; do not cross an Audit Preview
          # generation into an unrelated Lite-Solo request queue.
          if [[ "$CAMPAIGN_ID" == audit-preview-completion-* ]]; then
            workflow=audit-preview-completion-unit-controller-v1.yml
          else
            workflow=lite-solo-unit-controller-v1.yml
          fi
          gh workflow run "$workflow" \
            --repo "$GITHUB_REPOSITORY" -f campaign_id="$CAMPAIGN_ID"
