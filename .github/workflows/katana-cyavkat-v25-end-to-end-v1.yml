name: Katana cyavKAT v25 Complete Deployment
on:
  push:
    branches: [main, avkat-v9-revalidation-20261105]
    paths:
      - '.github/workflows/katana-cyavkat-v25-end-to-end-v1.yml'
      - 'process/avkat-fork-simulation-v1/**'
  workflow_dispatch:
    inputs:
      source_url:
        description: "Direct URL to cyavKAT_signing_layer_v25.zip; default uses staged Drive file"
        required: false
        type: string

permissions:
  contents: read

jobs:
  fork-deployment:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PACKAGE_SHA256: d69638b0622b2b5212a39af3d288b1da38be4131b5bc6c9deca2c1f8a4fe2176
      DEPLOYER: '0x11b78837cadC8E894F1c6e13fA9f3A085a75FA35'
    steps:
      - uses: actions/checkout@v4
      - name: Obtain exact v25 package and verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p katana-cyavkat-v25-future-evidence
          cp packages/github-native-sim/inputs/cyavKAT_signing_layer_v25.zip /tmp/cyavkat-v25.zip
          python3 - <<'PY'
          import hashlib,zipfile,os
          p='/tmp/cyavkat-v25.zip'
          assert os.path.getsize(p)==827481, f"source size mismatch: {os.path.getsize(p)}"
          digest=hashlib.sha256(open(p,'rb').read()).hexdigest()
          assert digest==os.environ['PACKAGE_SHA256'],f"v25 SHA256 mismatch: {digest}"
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None, "corrupt archive"
            assert 'cyavKAT/upgrade/script/P2_01_Deploy.s.sol' in z.namelist()
          print(f"Verified exact v25 source: {digest}")
          PY
          unzip -q /tmp/cyavkat-v25.zip
          cp /tmp/cyavkat-v25.zip katana-cyavkat-v25-future-evidence/source_v25.zip
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile exact v25 package and retain all Solidity artifacts
        working-directory: cyavKAT/upgrade
        shell: bash
        run: |
          set -euo pipefail
          forge --version
          forge build --skip test --build-info --sizes 2>&1 | tee ../../katana-cyavkat-v25-future-evidence/compile.log
      - name: Start isolated Katana Anvil fork
        shell: bash
        env:
          KATANA_RPC_URL: ${{ secrets.RPC_KATANA }}
        run: |
          set -euo pipefail
          upstream="${KATANA_RPC_URL:-https://katana.drpc.org/}"
          echo "::add-mask::$upstream"
          anvil --fork-url "$upstream" --chain-id 747474 --auto-impersonate --host 127.0.0.1 --port 8545 >katana-cyavkat-v25-future-evidence/anvil.log 2>&1 &
          echo "$!" >/tmp/katana-anvil.pid
          for n in $(seq 1 45); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then break; fi
            if ! kill -0 "$(cat /tmp/katana-anvil.pid)" 2>/dev/null; then cat katana-cyavkat-v25-future-evidence/anvil.log; exit 1; fi
            sleep 2
          done
          test "$(cast chain-id --rpc-url http://127.0.0.1:8545)" = 747474
          cast rpc anvil_setBalance "$DEPLOYER" "0x3635c9adc5dea00000" --rpc-url http://127.0.0.1:8545 >/dev/null
          echo "Only a local Anvil fork is used; no live Katana transactions."
      - name: Full same-fork deployment and configuration (stop on mandatory safety failure)
        working-directory: cyavKAT/upgrade
        shell: bash
        env:
          KATANA_RPC_URL: http://127.0.0.1:8545
        run: |
          set -euo pipefail
          evidence="../../katana-cyavkat-v25-future-evidence"
          mkdir -p "$evidence/phase-logs"
          printf 'phase,status,started_utc,finished_utc\n' >"$evidence/phase_status.csv"
          runphase() {
            local name="$1"
            local started finished
            started="$(date -u +%FT%TZ)"
            echo "::group::v25 $name"
            set +e
            forge script "script/$name.s.sol:$name" --rpc-url http://127.0.0.1:8545 --broadcast --unlocked --slow --sender "$DEPLOYER" --non-interactive 2>&1 | tee "$evidence/phase-logs/$name.log"
            local status="${PIPESTATUS[0]}"
            set -e
            finished="$(date -u +%FT%TZ)"
            if [ "$status" -ne 0 ]; then
              printf '%s,FAIL,%s,%s\n' "$name" "$started" "$finished" >>"$evidence/phase_status.csv"
              echo "::error::$name failed (status $status), stopping dependent steps without bypassing preconditions."
              echo "::endgroup::"
              return 1
            fi
            printf '%s,PASS,%s,%s\n' "$name" "$started" "$finished" >>"$evidence/phase_status.csv"
            echo "::endgroup::"
          }
          runquest() {
            local started finished
            started="$(date -u +%FT%TZ)"
            echo "::group::v25 Quest V2 signing"
            current_base="$(cast call 0xEd83daf48429cfb2C650Fd721b9241e180fd4548 'PLASMA_VAULT_BASE()(address)' --rpc-url http://127.0.0.1:8545 | tr '[:upper:]' '[:lower:]')"
            saved_wrapper="$(jq -r .base1271 deployments/katana-quests.json | tr '[:upper:]' '[:lower:]')"
            saved_original="$(jq -r .originalBase deployments/katana-quests.json | tr '[:upper:]' '[:lower:]')"
            local mode=""
            if [ "$current_base" = "$saved_wrapper" ]; then
              mode="QUEST_DETACH_INSTALL=true"
            elif [ "$current_base" = "$saved_original" ]; then
              supported="$(cast call 0xEd83daf48429cfb2C650Fd721b9241e180fd4548 'isFuseSupported(address)(bool)' "$(jq -r .signatureFuse deployments/katana-quests.json)" --rpc-url http://127.0.0.1:8545)"
              if [ "$supported" = true ]; then mode="QUEST_FINISH=true"; fi
            else
              echo "::error::Unexpected current PLASMA_VAULT_BASE; aborting";return 1
            fi
            set +e
            env $mode forge script 'script/K1_QuestSigning.s.sol:K1_QuestSigning' --rpc-url http://127.0.0.1:8545 --broadcast --unlocked --slow --sender "$DEPLOYER" --non-interactive 2>&1 | tee "$evidence/phase-logs/K1_QuestSigning.log"
            local status="${PIPESTATUS[0]}"
            set -e
            finished="$(date -u +%FT%TZ)"
            if [ "$status" -ne 0 ]; then
              printf 'K1_QuestSigning,FAIL,%s,%s\n' "$started" "$finished" >>"$evidence/phase_status.csv"
              echo "::endgroup::";return 1
            fi
            printf 'K1_QuestSigning,PASS,%s,%s\n' "$started" "$finished" >>"$evidence/phase_status.csv"
            echo "::endgroup::"
          }
          runquest
          runphase P0_00_DeployGateConfig
          runphase P2_00_VerifyQuestSigning
          runphase P2_01_Deploy
          runphase P2_02_ConfigureVault
          echo "::group::Old withdrawal manager expiry-queue preflight"
          old_wm=0x59B340EAb30AFE0cecD51C609d3190e8C75C40AE
          echo "Active shares before permissionless expiry-prune:"
          cast call "$old_wm" 'activeRequestedShares()(uint256)' --rpc-url http://127.0.0.1:8545 | tee "$evidence/old_requests_before.txt"
          echo "Release shares:"
          cast call "$old_wm" 'getSharesToRelease()(uint256)' --rpc-url http://127.0.0.1:8545 | tee "$evidence/old_released_shares.txt"
          echo "::warning::FUTURE-EXPIRY SCENARIO ONLY: advancing local Anvil by 130 days to expire outstanding legacy requests; not deployable-today evidence."
          cast rpc evm_increaseTime 11232000 --rpc-url http://127.0.0.1:8545
          cast rpc evm_mine --rpc-url http://127.0.0.1:8545
          echo "Future time: $(cast block latest --field timestamp --rpc-url http://127.0.0.1:8545)"
          cast send "$old_wm" 'pruneExpiredRequests(uint256)' 500 --unlocked --from "$DEPLOYER" --rpc-url http://127.0.0.1:8545 2>&1 | tee "$evidence/phase-logs/prune_old_expired_requests.log"
          echo "Active shares after permissionless expiry-prune:"
          cast call "$old_wm" 'activeRequestedShares()(uint256)' --rpc-url http://127.0.0.1:8545 | tee "$evidence/old_requests_after.txt"
          echo "::endgroup::"
          runphase P2_03_Cutover
          echo "::group::Mandatory live Merkl preflight for both vault and RCM"
          python3 scripts/merkl_preflight_v6.py --rpc-url http://127.0.0.1:8545 --out deployments/merkl-preflight-v6.json 2>&1 | tee "$evidence/phase-logs/merkl_preflight_v6.log"
          export MERKL_PREFLIGHT_RECEIPT_PATH=deployments/merkl-preflight-v6.json
          cp "$MERKL_PREFLIGHT_RECEIPT_PATH" "$evidence/merkl-preflight-v6.json"
          echo "::endgroup::"
          runphase P2_04_RemoveV1Fuses
          runphase P3_03_DeployGovernanceCore
          runphase P3_04_ConfigureGate
          runphase P5_01_DeployPol
          runphase P3_05_Handover
          runphase P6_01_CustodyV2Migration
          runphase L10_RouteWrapperFeesToCustodyV2
          runphase P9_FinalizeFeeAuthority
          echo "FORK_DEPLOYMENT_SUCCESS=true" >>"$GITHUB_ENV"
      - name: Record phase sequence coverage and preflight outcomes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out=katana-cyavkat-v25-future-evidence
          mkdir -p "$out"
          cat > "$out/phase_scope.md" <<'EOF'
          # v25 FUTURE-EXPIRY deployment/configuration scope
          - All stages use one persistent, local Katana fork (chain ID 747474). The fork is advanced 130 days after Phase 2 configuration to expire previously open withdrawal requests via the manager's actual pruning function. This is NOT a current-state migration clearance.
          - Quest V2, Phase 0, Phase 2 verify/deploy/configure/cutover/retire, Phase 3 IPOR governance delegation/gate/handover, Phase 5 POL + revenue custody, Phase 6 migration, L10 wrapper routing, and Phase 9 final verification.
          - Blocks downstream stages on hard precondition failures. Does not bypass live share/fee/request/role safeties.
          - Phase 5 POL venues are optional; missing pool information means controllers are not proof of active Balancer/Charm venue routing.
          - Excluded operational/older branches: L1 (already installed), L2/L3 (lend/withdraw), L5/L5b/L6/L7/L8/L9 (separate historical market-lending migrations), P3_99 (rollback).
          - No live Katana changes: local fork only.
          EOF
          if [ -f "$out/phase_status.csv" ]; then
            echo '## v25 phase status' >> "$GITHUB_STEP_SUMMARY"
            cat "$out/phase_status.csv" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Write per-contract receipts and ETH deployment costs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from decimal import Decimal
          import json,csv,os
          root=Path('cyavKAT/upgrade/broadcast')
          out=Path('katana-cyavkat-v25-future-evidence')
          out.mkdir(exist_ok=True)
          def integer(v):
              if v is None:return 0
              if isinstance(v,int):return v
              if isinstance(v,str):return int(v,16) if v.startswith('0x') else int(v)
              return 0
          rows=[]
          for p in sorted(root.glob('*/747474/run-latest.json')):
              if p.name!='run-latest.json':continue
              data=json.loads(p.read_text())
              receipts={str(r.get('transactionHash','')).lower():r for r in data.get('receipts',[])}
              for t in data.get('transactions',[]):
                  tx_hash=str(t.get('hash') or t.get('transactionHash') or '').lower()
                  receipt=receipts.get(tx_hash,{})
                  if not receipt:continue
                  gas=integer(receipt.get('gasUsed'))
                  wei_price=integer(receipt.get('effectiveGasPrice',receipt.get('gasPrice')))
                  if not wei_price:
                      wei_price=integer((t.get('transaction') or {}).get('gasPrice'))
                  is_create=str(t.get('transactionType','')).upper()=='CREATE' or bool(receipt.get('contractAddress'))
                  row={'script':p.parent.parent.name,'contract':t.get('contractName') or 'unidentified','contract_address':receipt.get('contractAddress') or t.get('contractAddress') or '',
                       'tx_hash':tx_hash,'is_deployment':is_create,'gas_used':gas,'effective_gas_price_wei':wei_price,
                       'cost_eth':str(Decimal(gas*wei_price)/Decimal(10**18))}
                  rows.append(row)
          fields=['script','contract','contract_address','tx_hash','is_deployment','gas_used','effective_gas_price_wei','cost_eth']
          with (out/'deployment_gas_v1.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(rows)
          creations=[r for r in rows if r['is_deployment']]
          total_gas=sum(r['gas_used'] for r in rows)
          total_wei=sum(r['gas_used']*r['effective_gas_price_wei'] for r in rows)
          summary={'deployment_complete':os.environ.get('FORK_DEPLOYMENT_SUCCESS')=='true',
                   'per_transaction':rows,'contract_deployments':creations,
                   'total_transaction_gas':total_gas,'total_eth':str(Decimal(total_wei)/Decimal(10**18)),
                   'contract_creation_gas':sum(r['gas_used'] for r in creations),
                   'contract_creation_eth':str(sum(Decimal(r['gas_used']*r['effective_gas_price_wei']) for r in creations)/Decimal(10**18)),
                   'source_sha256':os.environ['PACKAGE_SHA256']}
          (out/'deployment_gas_v1.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          with (Path(os.environ['GITHUB_STEP_SUMMARY'])).open('a') as f:
              f.write('## cyavKAT v25 Katana fork deployment\n\n')
              f.write(f"Deployment complete: **{summary['deployment_complete']}**. Recorded {len(creations)} creation tx and {len(rows)} total tx. Total gas: **{total_gas}**. ETH cost: **{summary['total_eth']} ETH**.\n\n")
              f.write('| Contract | Gas | ETH |\\n|---|---:|---:|\\n')
              for r in creations:
                  f.write(f"| {r['contract']} | {r['gas_used']} | {r['cost_eth']} |\\n")
              if not rows:f.write('\nNo transaction receipts generated; no gas estimate is asserted.\n')
          PY
      - name: Upload compile artifacts, receipts, source identity and gas report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyavkat-v25-future-expiry-full-v1
          path: |
            katana-cyavkat-v25-future-evidence/
            cyavKAT/upgrade/out/
            cyavKAT/upgrade/broadcast/
            cyavKAT/upgrade/deployments/katana-gate-v4.json
            cyavKAT/upgrade/deployments/katana-phase2.json
          if-no-files-found: warn
          retention-days: 30

  avkat-v9-fork-simulation:
    if: github.ref == 'refs/heads/avkat-v9-revalidation-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Execute isolated real-state Katana fork tests and write per-function results
        shell: bash
        working-directory: process/avkat-fork-simulation-v1
        env:
          PRIVATE_RPC_KATANA: ${{ secrets.RPC_KATANA }}
        run: |
          set -uo pipefail
          RPC="${PRIVATE_RPC_KATANA:-https://katana.drpc.org/}"
          echo "::add-mask::$RPC"
          mkdir -p "$RUNNER_TEMP/avkat-fork-v1"
          echo 'fork-only, no broadcast, no main-branch writes' > "$RUNNER_TEMP/avkat-fork-v1/simulation-mode.txt"
          cast chain-id --rpc-url "$RPC" > "$RUNNER_TEMP/avkat-fork-v1/chain-id.txt"
          cast block-number --rpc-url "$RPC" > "$RUNNER_TEMP/avkat-fork-v1/fork-block.txt"
          echo "chain=$(cat "$RUNNER_TEMP/avkat-fork-v1/chain-id.txt") block=$(cat "$RUNNER_TEMP/avkat-fork-v1/fork-block.txt")"
          project="$RUNNER_TEMP/avkat-fork-v1/project"
          mkdir -p "$project/src" "$project/test"
          cp src/*.sol "$project/src/"
          cp test/*.sol "$project/test/"
          python3 merkl_fetch.py "$project/test/MerklProofFixture.sol" "$RUNNER_TEMP/avkat-fork-v1/merkl-live-claim.json"

          cd "$project"
          echo "Isolated Foundry files: $(find src test -type f | wc -l)"
          set +e
          forge test --root "$project" --use 0.8.30 --via-ir --optimize --optimizer-runs 200 --fork-url "$RPC" -vvv 2>&1 | tee "$RUNNER_TEMP/avkat-fork-v1/forge-test.log"
          result="${PIPESTATUS[0]}"
          set -e
          export SIMULATION_EXIT="$result"
          python3 - <<'PY'
          import os,re,csv,json,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"avkat-fork-v1"
          src=pathlib.Path("test/AVKATForkSimulationV1.t.sol").read_text()
          log=(root/"forge-test.log").read_text(errors="replace")
          cases=list(dict.fromkeys(re.findall(r"\bfunction\s+(test_[A-Za-z0-9_]+)\s*\(",src)))
          matched=re.findall(r"\[(PASS|FAIL)(?::[^\]\r\n]*)?\]\s+(test_[A-Za-z0-9_]+)\(",log)
          results={name:status for status,name in matched}
          reasons={}
          for m in re.finditer(r"\[FAIL(?::([^\]\r\n]*))?\]\s+(test_[A-Za-z0-9_]+)\(",log):
              reasons[m.group(2)]=m.group(1) or "failed"
          rows=[dict(function_case=n,status=results.get(n,"NOT_RUN"),
                     reason=reasons.get(n,"") if results.get(n)=="FAIL" else
                            ("suite/compilation/setup aborted" if n not in results else ""))
                for n in cases]
          with (root/"function-matrix-v1.csv").open("w",newline="") as f:
              writer=csv.DictWriter(f,fieldnames=["function_case","status","reason"])
              writer.writeheader();writer.writerows(rows)
          stats={status:sum(x["status"]==status for x in rows) for status in ("PASS","FAIL","NOT_RUN")}
          payload={"suite":"AVKAT v9 fork simulation v1","scope":"real Katana chain state on isolated fork",
                   "fork_block":(root/"fork-block.txt").read_text().strip(),
                   "chain_id":(root/"chain-id.txt").read_text().strip(),
                   "forge_exit":int(os.environ["SIMULATION_EXIT"]),
                   "counts":stats,"cases":rows}
          (root/"function-matrix-v1.json").write_text(json.dumps(payload,indent=2)+"\n")
          md=["# AVKAT v9 - GitHub Katana fork simulation v1","",
              f"Fork block: {payload['fork_block']}; chain ID: {payload['chain_id']}",
              f"PASS: {stats['PASS']}, FAIL: {stats['FAIL']}, NOT_RUN: {stats['NOT_RUN']}","",
              "| Contract function / scenario | Status | Failure reason |","|---|---|---|"]
          md += [f"| {x['function_case']} | {x['status']} | {x['reason'][:230].replace('|','/')} |" for x in rows]
          (root/"function-matrix-v1.md").write_text("\n".join(md)+"\n")
          print("\n".join(md))
          if not results or stats["NOT_RUN"]:
              print("ERROR: missing test executions; report is not a passing result")
              raise SystemExit(6)
          PY
          exit "$result"
      - name: Upload compilation, simulation diagnostics, and PASS/FAIL matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avkat-v9-fork-simulation-v1
          path: |
            ${{ runner.temp }}/avkat-fork-v1/
            process/avkat-fork-simulation-v1/out/
          if-no-files-found: warn
          retention-days: 14

      - name: Export v9 CREATE2 proposal data to this isolated branch if and only if simulation passed
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_WORKSPACE"
          root="$RUNNER_TEMP/avkat-v9-verified-deployment"
          mkdir -p "$root/src"
          cp process/avkat-fork-simulation-v1/src/AVKAT_Consolidated_Safe_Module_v9.sol "$root/src/AVKAT_Consolidated_Safe_Module_v9.sol"
          cd "$root"
          forge build --root "$root" --use 0.8.30 --via-ir --optimize --optimizer-runs 200 --skip test --sizes
          export VERIFIED_DEPLOY_REPO="$repo"
          python3 - <<'PY'
          import pathlib,json,subprocess,hashlib,os
          root=pathlib.Path.cwd()
          dest=pathlib.Path(os.environ["VERIFIED_DEPLOY_REPO"])/"process"/"avkat-fork-simulation-v1"
          artifacts=list((root/"out").glob("**/AVKATConsolidatedSafeModule.json"))
          if len(artifacts)!=1:raise RuntimeError(f"Expected one contract artifact, found {len(artifacts)}")
          j=json.loads(artifacts[0].read_text())
          runtime=j["deployedBytecode"]["object"].removeprefix("0x")
          creation=bytes.fromhex(j["bytecode"]["object"].removeprefix("0x"))
          addrs=["f39087af2107eadbf81f10a64051740a76b6291d",
                 "d50f2dfffd62f94ee4aed9ca05c61d0753268abc",
                 "7f1f4b4b29f5058fa32cc7a97141b8d7e5abdc2d",
                 "7231dbacdfc968e07656d12389ab20de82fbfceb"]
          market="80e60fe453223b0f84a567724f88190bef708420d24397157067d424429783e9"
          args=bytes.fromhex("".join(v.zfill(64) for v in addrs)+market)
          assert len(args)==160
          init=creation+args
          def keccak(data):
              x="0x"+data.hex()
              return subprocess.check_output(["cast","keccak",x],text=True).strip().lower()
          salt=keccak(b"AVKAT_Consolidated_Safe_Module_v9_Katana_Safe_2026-11-06")
          factory="0x4e59b44847b379578588920ca78fbf26c0b4956c"
          init_hash=keccak(init)
          predicted=keccak(bytes.fromhex("ff"+factory[2:]+salt[2:]+init_hash[2:]))[-40:]
          assert predicted=="b0832afff2387edb89d799b967b49f910efc343d",predicted
          call_data="0x"+salt[2:]+init.hex()
          out=dest/"deployment-create2-call-v1.txt"
          out.write_text(call_data)
          meta={"factory":factory,"salt":salt,"predictedModuleAddress":"0x"+predicted,
                "initcodeHash":init_hash,"creationBytes":len(creation),"constructorArgsBytes":len(args),
                "runtimeBytes":len(runtime)//2,"callDataBytes":(len(call_data)-2)//2,
                "sourceSha256":hashlib.sha256((root/"src"/"AVKAT_Consolidated_Safe_Module_v9.sol").read_bytes()).hexdigest(),
                "safe":"0x"+addrs[0],"morpho":"0x"+addrs[1],"KAT":"0x"+addrs[2],
                "avKAT":"0x"+addrs[3],"marketId":"0x"+market,
                "forkTestsPassed":True}
          (dest/"deployment-create2-manifest-v1.json").write_text(json.dumps(meta,indent=2)+"\n")
          print("CREATE2_SAFETX_MANIFEST",json.dumps(meta))
          PY
          cd "$repo"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add process/avkat-fork-simulation-v1/deployment-create2-call-v1.txt process/avkat-fork-simulation-v1/deployment-create2-manifest-v1.json
          git commit -m "ci(avkat): stage verified v9 Safe CREATE2 deployment calldata on isolated branch"
          git push origin HEAD:avkat-v9-revalidation-20261105
