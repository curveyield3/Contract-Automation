name: WBTC IPOR governance Merkle preparation and Ethereum fork rehearsal v2

on:
  push:
    branches:
      - feature/wbtc-ipor-aragon-governance-v1
    paths:
      - governance/wbtc-ipor-merkle-v1/.package-request-v1.json
  workflow_dispatch:
    inputs:
      mode:
        description: Choose proof preparation, authenticated fork-only preflight, or full governance fork rehearsal
        required: true
        type: choice
        default: prepare
        options:
          - prepare
          - fork_preflight
          - fork_full
      fork_block:
        description: Optional pinned Ethereum fork height (default 80 blocks behind latest)
        required: false
        type: string
      proposal_id:
        description: On-chain pending proposal ID (required only for prepare)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: wbtc-ipor-governance-proof-${{ inputs.proposal_id }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'prepare' || inputs.mode == '')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ETH_RPC_URL: ${{ secrets.GOVERNANCE_ARCHIVE_RPC_URL }}
      PROPOSAL_ID: ${{ inputs.proposal_id }}
      CONFIG_PATH: ${{ github.workspace }}/governance/wbtc-ipor-merkle-v1/config/protocol.json
      RISC0_DEV_MODE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract pinned governance preparation package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wbtc-ipor-governance"
          tar -xJf governance/wbtc-ipor-merkle-v1/WBTC_IPOR_Governance_Merkle_Workflow_v1.tar.xz -C "$RUNNER_TEMP/wbtc-ipor-governance"
      - name: Require deployed-contract configuration
        shell: bash
        run: |
          set -euo pipefail
          test -s "$CONFIG_PATH" || { echo "::error::Configure governance/wbtc-ipor-merkle-v1/config/protocol.json after governance contracts deploy"; exit 1; }
      - name: Install exact direct dependencies
        working-directory: ${{ runner.temp }}/wbtc-ipor-governance/WBTC_IPOR_Governance_Merkle_Workflow_v1
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Read finalized proposal state
        working-directory: ${{ runner.temp }}/wbtc-ipor-governance/WBTC_IPOR_Governance_Merkle_Workflow_v1
        run: node scripts/collect-snapshot.mjs
      - name: Build standard Merkle tree
        working-directory: ${{ runner.temp }}/wbtc-ipor-governance/WBTC_IPOR_Governance_Merkle_Workflow_v1
        run: node scripts/build-tree.mjs
      - name: Prove authenticated historical state (no mock or dev mode)
        working-directory: ${{ runner.temp }}/wbtc-ipor-governance/WBTC_IPOR_Governance_Merkle_Workflow_v1
        run: bash scripts/prove.sh
      - name: Verify receipt and build unsigned submission
        working-directory: ${{ runner.temp }}/wbtc-ipor-governance/WBTC_IPOR_Governance_Merkle_Workflow_v1
        run: node scripts/prepare-submission.mjs
      - name: Upload verified submission bundle
        uses: actions/upload-artifact@v4
        with:
          name: wbtc-ipor-proposal-${{ inputs.proposal_id }}-submission
          path: ${{ runner.temp }}/wbtc-ipor-governance/WBTC_IPOR_Governance_Merkle_Workflow_v1/output/
          if-no-files-found: error
          retention-days: 30

  fork-rehearsal:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'fork_preflight' || inputs.mode == 'fork_full')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UPSTREAM_RPC_URL: ${{ secrets.RPC_ETHEREUM }}
      FORK_BLOCK: ${{ inputs.fork_block }}
      FORK_ONLY_PREFLIGHT: ${{ inputs.mode == 'fork_preflight' && '1' || '0' }}
      RISC0_DEV_MODE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Run authenticated local fork and source-bound governance rehearsal
        shell: bash
        run: bash governance/wbtc-ipor-merkle-v1/fork/fork-rehearsal-v1.sh
      - name: Publish fork evidence, even if a required integration is missing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wbtc-ipor-mainnet-fork-${{ inputs.mode }}-${{ github.run_id }}
          path: governance/wbtc-ipor-merkle-v1/fork-output/
          if-no-files-found: warn
          retention-days: 14

  source-package:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9de7ee8b1deee6f5eccedf6644e12db9d00065c7
          persist-credentials: false
      - name: Produce source-bound WBTC IPOR DAO ZIP
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9de7ee8b1deee6f5eccedf6644e12db9d00065c7"
          mkdir -p "$RUNNER_TEMP/wbtc-ipor-snapshot"
          git archive HEAD governance/wbtc-ipor-merkle-v1/ .github/workflows/wbtc-ipor-merkle-proof-v1.yml | tar -xf - -C "$RUNNER_TEMP/wbtc-ipor-snapshot"
          cat > "$RUNNER_TEMP/wbtc-ipor-snapshot/PACKAGE_MANIFEST_v1.md" <<'MANIFEST'
          # WBTC IPOR Aragon DAO development snapshot — v1

          **Source repository:** curveyield3/Contract-Automation
          **Branch:** feature/wbtc-ipor-aragon-governance-v1
          **Immutable source commit:** 9de7ee8b1deee6f5eccedf6644e12db9d00065c7
          **Contents:** all governance/wbtc-ipor-merkle-v1 files and the existing Merkle/fork workflow.
          **State:** draft source; uncompiled, unaudited, unfork-tested. Not deployable.
          **Known incomplete:** source-wide Guardian removal voting-power census, fully authenticated RISC Zero validity proof, deployable setup/permissions, reviewed market whitelist, and complete fork rehearsal.
          **Source licenses:** Aragon AGPL, legacy AragonOne VotingAggregator GPL/AGPL, calendar library MIT. IPOR plugin external BUSL dependency is referenced but not copied.
          MANIFEST
          (
            cd "$RUNNER_TEMP/wbtc-ipor-snapshot"
            zip -qr "$GITHUB_WORKSPACE/WBTC_IPOR_Aragon_DAO_Development_v1.zip" .
          )
          sha256sum "WBTC_IPOR_Aragon_DAO_Development_v1.zip"
          unzip -Z1 "WBTC_IPOR_Aragon_DAO_Development_v1.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: wbtc-ipor-dao-source-package-v1
          path: WBTC_IPOR_Aragon_DAO_Development_v1.zip
          if-no-files-found: error
          retention-days: 7
