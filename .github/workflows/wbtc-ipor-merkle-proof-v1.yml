name: WBTC IPOR governance Merkle preparation and Ethereum fork rehearsal v2

on:
  push:
    branches:
      - feature/wbtc-ipor-aragon-governance-v1
    paths:
      - governance/wbtc-ipor-merkle-v1/.compile-request-v2.json
  workflow_dispatch:
    inputs:
      mode:
        description: Choose proof preparation, authenticated fork-only preflight, or full governance fork rehearsal
        required: true
        type: choice
        default: prepare
        options:
          - prepare
          - fork_preflight
          - fork_full
      fork_block:
        description: Optional pinned Ethereum fork height (default 80 blocks behind latest)
        required: false
        type: string
      proposal_id:
        description: On-chain pending proposal ID (required only for prepare)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: wbtc-ipor-governance-proof-${{ inputs.proposal_id }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'prepare' || inputs.mode == '')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ETH_RPC_URL: ${{ secrets.GOVERNANCE_ARCHIVE_RPC_URL }}
      PROPOSAL_ID: ${{ inputs.proposal_id }}
      CONFIG_PATH: config/protocol.json
      GOVERNANCE_PROTOCOL_CONFIG_JSON: ${{ secrets.GOVERNANCE_PROTOCOL_CONFIG_JSON }}
      RISC0_DEV_MODE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require configured deployed-source manifest
        shell: bash
        working-directory: ${{ github.workspace }}/governance/wbtc-ipor-merkle-v1/proof
        run: |
          set -euo pipefail
          test -n "$GOVERNANCE_PROTOCOL_CONFIG_JSON" || { echo "::error::Missing GOVERNANCE_PROTOCOL_CONFIG_JSON secret"; exit 1; }
          printf '%s\n' "$GOVERNANCE_PROTOCOL_CONFIG_JSON" > config/protocol.json
      - name: Install exact direct dependencies
        working-directory: ${{ github.workspace }}/governance/wbtc-ipor-merkle-v1/proof
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Read finalized proposal state
        working-directory: ${{ github.workspace }}/governance/wbtc-ipor-merkle-v1/proof
        run: node scripts/collect-snapshot.mjs
      - name: Build standard Merkle tree
        working-directory: ${{ github.workspace }}/governance/wbtc-ipor-merkle-v1/proof
        run: node scripts/build-tree.mjs
      - name: Install pinned RISC Zero Rust toolchain
        uses: risc0/risc0/.github/actions/rustup@352dea62857ba57331053cd0986a12c1a4708732
        with:
          toolchain: '1.94.1'
      - name: Install official Groth16 prover toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.risc0/bin:$PATH"
          rzup install --verbose --force cargo-risczero 3.0.5
          rzup install --verbose --force r0vm 3.0.5
          rzup install --verbose --force rust 1.94.1
          rzup install --verbose --force cpp
      - name: Prove authenticated historical state (no mock or dev mode)
        working-directory: ${{ github.workspace }}/governance/wbtc-ipor-merkle-v1/proof
        run: bash scripts/prove.sh
      - name: Verify receipt and build unsigned submission
        working-directory: ${{ github.workspace }}/governance/wbtc-ipor-merkle-v1/proof
        run: node scripts/prepare-submission.mjs
      - name: Upload verified submission bundle
        uses: actions/upload-artifact@v4
        with:
          name: wbtc-ipor-proposal-${{ inputs.proposal_id }}-submission
          path: ${{ github.workspace }}/governance/wbtc-ipor-merkle-v1/proof/output/
          if-no-files-found: error
          retention-days: 30

  fork-rehearsal:
    if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[compile-only]')) || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'fork_preflight' || inputs.mode == 'fork_full'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UPSTREAM_RPC_URL: ${{ secrets.RPC_ETHEREUM }}
      GOVERNANCE_DEPLOY_CONFIG_JSON: ${{ secrets.GOVERNANCE_DEPLOY_CONFIG_JSON }}
      FORK_BLOCK: ${{ inputs.fork_block }}
      FORK_ONLY_PREFLIGHT: ${{ github.event_name == 'push' && '1' || (inputs.mode == 'fork_preflight' && '1' || '0') }}
      RISC0_DEV_MODE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wbtc-ipor-aragon-governance-v1
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Run authenticated local fork and source-bound governance rehearsal
        shell: bash
        run: bash governance/wbtc-ipor-merkle-v1/fork/fork-rehearsal-v1.sh
      - name: Publish fork evidence, even if a required integration is missing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wbtc-ipor-mainnet-fork-${{ github.event_name }}-${{ github.run_id }}
          path: governance/wbtc-ipor-merkle-v1/fork-output/
          if-no-files-found: warn
          retention-days: 14

  compile-only:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile v14 weighted TokenVoting (no tests or forks)
        if: contains(github.event.head_commit.message, '[compile-only]')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/compile-evidence"
          git clone https://github.com/aragon/token-voting-plugin.git "$RUNNER_TEMP/aragon-token-v14"
          (
            cd "$RUNNER_TEMP/aragon-token-v14"
            git checkout e726c28061486114d601c547e4da1180ed5ab6da
            git submodule update --init --recursive
            cp -r "$GITHUB_WORKSPACE/governance/wbtc-ipor-merkle-v1/native-restart-v14/src/." src/
            status=0
            forge build src/extensions/WbtcCollateralTokenVoting_v7.sol --via-ir --optimizer-runs 1 --sizes || status=$?
            artifact="out/WbtcCollateralTokenVoting_v7.sol/WbtcCollateralTokenVoting.json"
            if test -f "$artifact"; then
              jq -r '.deployedBytecode.object' "$artifact" > "$GITHUB_WORKSPACE/compile-evidence/v14-runtime-bytecode.txt"
              hex=$(cat "$GITHUB_WORKSPACE/compile-evidence/v14-runtime-bytecode.txt")
              if [[ "$hex" == 0x* ]]; then
                bytes=$(( (${#hex} - 2) / 2 ))
                echo "V14_RUNTIME_BYTES=$bytes" | tee "$GITHUB_WORKSPACE/compile-evidence/v14-size.txt"
                echo "EIP170_HEADROOM_BYTES=$(( 24576 - bytes ))" | tee -a "$GITHUB_WORKSPACE/compile-evidence/v14-size.txt"
              fi
            else
              echo "V14_ARTIFACT_MISSING" | tee "$GITHUB_WORKSPACE/compile-evidence/v14-size.txt"
              status=1
            fi
            exit "$status"
          ) 2>&1 | tee "$GITHUB_WORKSPACE/compile-evidence/v14-compile.log"
      - name: Upload v14 compile and size evidence
        if: always() && contains(github.event.head_commit.message, '[compile-only]')
        uses: actions/upload-artifact@v4
        with:
          name: wbtc-ipor-v14-weighted-tokenvoting-compile
          path: compile-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Compile v11 native-based Standard and Guardian SPP (v12 rehearsal)
        if: "!contains(github.event.head_commit.message, '[compile-only]')"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/compile-evidence"
          git clone https://github.com/aragon/staged-proposal-processor-plugin.git "$RUNNER_TEMP/aragon-spp"
          (
            cd "$RUNNER_TEMP/aragon-spp"
            git checkout a1d84e0542cf2db0a542f0159878457dbb7e3515
            git submodule update --init --recursive
            cp -r "$GITHUB_WORKSPACE/governance/wbtc-ipor-merkle-v1/native-restart-v12/src/." src/
            forge build src/extensions/WbtcStandardSPP_v2.sol src/extensions/WbtcGuardianRemovalSPP_v1.sol --via-ir --optimizer-runs 1 --sizes || { echo "SPP_BUILD_OR_SIZE_FAILED" >&2; touch "$GITHUB_WORKSPACE/compile-evidence/spp-failed.marker"; }
          ) 2>&1 | tee "$GITHUB_WORKSPACE/compile-evidence/spp-build-v12.log"
      - name: Compile v11 collateral TokenVoting and original RISC Zero verifier
        if: "!contains(github.event.head_commit.message, '[compile-only]')"
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/aragon/token-voting-plugin.git "$RUNNER_TEMP/aragon-token"
          (
            cd "$RUNNER_TEMP/aragon-token"
            git checkout e726c28061486114d601c547e4da1180ed5ab6da
            git submodule update --init --recursive
            cp -r "$GITHUB_WORKSPACE/governance/wbtc-ipor-merkle-v1/native-restart-v12/src/." src/
            forge build src/extensions/WbtcCollateralTokenVoting_v4.sol src/verifier/WbtcIporZkProofVerifier_v1.sol --via-ir --optimizer-runs 1 --sizes || { echo "TOKEN_BUILD_OR_SIZE_FAILED" >&2; touch "$GITHUB_WORKSPACE/compile-evidence/token-failed.marker"; }
          ) 2>&1 | tee "$GITHUB_WORKSPACE/compile-evidence/voting-build-v12.log"
      - name: Check v11 collateral Merkle generation and tampering resistance (format-only)
        if: "!contains(github.event.head_commit.message, '[compile-only]')"
        shell: bash
        run: |
          set -euo pipefail
          cd governance/wbtc-ipor-merkle-v1/proof
          npm install --ignore-scripts --no-audit --no-fund
          mkdir -p output
          cat > output/snapshot.json <<'JSON'
          {"schemaVersion":3,"processor":"0x3000000000000000000000000000000000000003","parentId":"123","snapshotBlock":1234567,"collateralPenaltyBps":5000,"positions":[{"delegate":"0x1000000000000000000000000000000000000001","rawShares":"100"},{"delegate":"0x2000000000000000000000000000000000000002","rawShares":"200"},{"delegate":"0x1000000000000000000000000000000000000001","rawShares":"100"}]}
          JSON
          node scripts/build-tree.mjs
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {AbiCoder, keccak256, concat} from 'ethers';
          const t=JSON.parse(fs.readFileSync('output/merkle.json','utf8'));
          assert.equal(t.membershipCount,2);
          assert.equal(t.positionsProvided,3);
          assert.equal(t.rawCollateralShares,'400');
          assert.equal(t.weightedCollateralShares,'200');
          assert.equal(t.proofAuthenticated,false);
          const abi=AbiCoder.defaultAbiCoder();
          function pair(a,b){return keccak256(concat(a.toLowerCase()<b.toLowerCase()?[a,b]:[b,a]));}
          function pathOk(address,raw,proof){
            let h=keccak256(abi.encode(['address','uint256','address','uint256'],
              [t.processor,BigInt(t.parentId),address,BigInt(raw)]));
            for(const sib of proof)h=pair(h,sib);
            return h.toLowerCase()===t.collateralMerkleRoot.toLowerCase();
          }
          for(const [addr,v] of Object.entries(t.proofs)){
            assert.ok(pathOk(addr,v.rawShares,v.proof),'valid onchain-equivalent proof');
            assert.equal(pathOk(addr,(BigInt(v.rawShares)+1n).toString(),v.proof),false,
              'tampered balance must not verify');
          }
          console.log('MERKLE_FORMAT_AND_NEGATIVE_TAMPER_CHECK_PASS; no historical census or RISC0 receipt implied');
          JS
      - name: Preserve compile diagnostics
        if: always() && !contains(github.event.head_commit.message, '[compile-only]')
        uses: actions/upload-artifact@v4
        with:
          name: wbtc-ipor-native-restart-contracts-compile-v12
          path: |
            compile-evidence/
            governance/wbtc-ipor-merkle-v1/native-restart-v12/src/
            governance/wbtc-ipor-merkle-v1/CONTRACT_DESIGN_SPEC_v9.md
          if-no-files-found: error
          retention-days: 30
      - name: Enforce all native compilation and EIP-170 size gates
        if: always() && !contains(github.event.head_commit.message, '[compile-only]')
        shell: bash
        run: |
          set -euo pipefail
          ! test -e compile-evidence/spp-failed.marker
          ! test -e compile-evidence/token-failed.marker

