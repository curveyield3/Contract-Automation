name: Live Contract Fork Readiness Regression v1

on:
  push:
    branches:
      - fix/live-contract-fork-readiness-v1-20261027
    paths:
      - 'packages/github-native-sim/src/lite-boundary-artifacts-v1.mjs'
      - 'packages/github-native-sim/src/phase6-mutable-rpc-v1.mjs'
      - 'packages/github-native-sim/src/run-job-file-v2.mjs'
      - 'scripts/lib/lite-solo-live-fork-baseline-gate-v1.mjs'
      - 'scripts/lib/lite-solo-phase-prefill-v1.mjs'
      - 'scripts/lib/lite-solo-unit-queue-v1.mjs'
      - 'packages/github-native-sim/test/live-contract-fork-readiness-v1.test.mjs'
      - 'packages/github-native-sim/test/phase6-live-target-attestation-v1.test.mjs'
      - '.github/workflows/live-contract-fork-readiness-regression-v1.yml'
  pull_request:
    paths:
      - 'packages/github-native-sim/src/lite-boundary-artifacts-v1.mjs'
      - 'packages/github-native-sim/src/phase6-mutable-rpc-v1.mjs'
      - 'packages/github-native-sim/src/run-job-file-v2.mjs'
      - 'scripts/lib/lite-solo-live-fork-baseline-gate-v1.mjs'
      - 'scripts/lib/lite-solo-phase-prefill-v1.mjs'
      - 'scripts/lib/lite-solo-unit-queue-v1.mjs'
      - 'packages/github-native-sim/test/live-contract-fork-readiness-v1.test.mjs'
      - 'packages/github-native-sim/test/phase6-live-target-attestation-v1.test.mjs'

permissions:
  contents: read

jobs:
  live-fork-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Parse-check all repaired production entrypoints
        run: |
          node --check packages/github-native-sim/src/lite-boundary-artifacts-v1.mjs
          node --check packages/github-native-sim/src/phase6-mutable-rpc-v1.mjs
          node --check packages/github-native-sim/src/run-job-file-v2.mjs
          node --check scripts/lib/lite-solo-live-fork-baseline-gate-v1.mjs
          node --check scripts/lib/lite-solo-phase-prefill-v1.mjs
          node --check scripts/lib/lite-solo-unit-queue-v1.mjs
      - name: Live deployment and Phase 6 execution evidence regressions
        run: |
          node --test packages/github-native-sim/test/live-contract-fork-readiness-v1.test.mjs \
            packages/github-native-sim/test/phase6-live-target-attestation-v1.test.mjs \
            packages/github-native-sim/test/lite-boundary-artifacts-v1.test.mjs
