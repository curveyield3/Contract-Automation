name: Lite-Solo Source Initialization v1
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Direct ZIP URL (mutually exclusive with scan URLs)
        type: string
        required: false
      scan_urls:
        description: Etherscan/KatanaScan URLs, one per line
        type: string
        required: false
      request_id:
        description: Stable idempotency identifier (defaults to workflow run ID)
        type: string
        required: false
      report_pdf:
        description: Publish security audit PDF
        type: boolean
        default: false
        required: false
      audited_source:
        description: Publish audited source ZIP
        type: boolean
        default: false
        required: false
      scope_summary:
        description: Publish audited scope and exclusions
        type: boolean
        default: false
        required: false
      findings_remediation:
        description: Publish findings and remediation
        type: boolean
        default: false
        required: false
      methodology_analysis:
        description: Publish methodology and analysis
        type: boolean
        default: false
        required: false
      properties_hypotheses:
        description: Publish security properties and hypotheses
        type: boolean
        default: false
        required: false
      execution_results:
        description: Publish testing and execution results
        type: boolean
        default: false
        required: false
      architecture_dependencies:
        description: Publish architecture and dependencies
        type: boolean
        default: false
        required: false
      residual_risks:
        description: Publish residual risks and limitations
        type: boolean
        default: false
        required: false
      evidence_index:
        description: Publish evidence index
        type: boolean
        default: false
        required: false
  push:
    branches: [main]
    paths:
      - 'process/lite-solo-source-initialization/requests/*.json'
permissions:
  contents: write
  actions: write
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      requests: ${{ steps.requests.outputs.requests }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Discover independent Lite-Solo campaign initialization requests
        id: requests
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          : > /tmp/lite-solo-source-requests.ndjson
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            key="${REQUEST_ID:-$GITHUB_RUN_ID}"
            [[ "$key" =~ ^[A-Za-z0-9._-]+$ ]]
            jq -nc --arg key "$key" '{request_path:"__MANUAL__",request_key:$key}' >> /tmp/lite-solo-source-requests.ndjson
          else
            root=process/lite-solo-source-initialization/requests
            if [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
              mapfile -t changed < <(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- "$root/")
            else
              mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- "$root/")
            fi
            for request in "${changed[@]}"; do
              [[ "$request" =~ ^process/lite-solo-source-initialization/requests/[A-Za-z0-9._-]+\.json$ ]] || continue
              test -f "$request" || continue
              key="$(jq -er '.requestId | select(type=="string" and test("^[A-Za-z0-9._-]+$"))' "$request")"
              jq -nc --arg request "$request" --arg key "$key" '{request_path:$request,request_key:$key}' >> /tmp/lite-solo-source-requests.ndjson
            done
          fi
          echo "requests=$(jq -sc '{include:.}' /tmp/lite-solo-source-requests.ndjson)" >> "$GITHUB_OUTPUT"
  initialize:
    needs: discover
    if: ${{ needs.discover.outputs.requests != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.requests) }}
    concurrency:
      group: lite-solo-source-initialization-${{ matrix.request_key }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Resolve direct lite-solo source request (no chat)
        id: request
        env:
          RAW_SOURCE_URL: ${{ inputs.source_url }}
          RAW_SCAN_URLS: ${{ inputs.scan_urls }}
          RAW_REQUEST_ID: ${{ inputs.request_id }}
          EVENT_NAME: ${{ github.event_name }}
          RAW_SCAN_URLS: ${{ inputs.scan_urls }}
          RAW_REQUEST_ID: ${{ inputs.request_id }}
          RAW_REPORT_PDF: ${{ inputs.report_pdf }}
          RAW_AUDITED_SOURCE: ${{ inputs.audited_source }}
          RAW_SCOPE_SUMMARY: ${{ inputs.scope_summary }}
          RAW_FINDINGS_REMEDIATION: ${{ inputs.findings_remediation }}
          RAW_METHODOLOGY_ANALYSIS: ${{ inputs.methodology_analysis }}
          RAW_PROPERTIES_HYPOTHESES: ${{ inputs.properties_hypotheses }}
          RAW_EXECUTION_RESULTS: ${{ inputs.execution_results }}
          RAW_ARCHITECTURE_DEPENDENCIES: ${{ inputs.architecture_dependencies }}
          RAW_RESIDUAL_RISKS: ${{ inputs.residual_risks }}
          RAW_EVIDENCE_INDEX: ${{ inputs.evidence_index }}
          MATRIX_REQUEST: ${{ matrix.request_path }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          if [ "$EVENT_NAME" = push ]; then
            request="$MATRIX_REQUEST"
            [[ "$request" =~ ^process/lite-solo-source-initialization/requests/[A-Za-z0-9._-]+\.json$ ]]
            jq -e '.schemaVersion=="curveyield-lite-solo-source-request-v1" and .mode=="LITE_SOLO" and .deliveryTransport=="DIRECT" and (.requestId|type=="string" and test("^[A-Za-z0-9._-]+$")) and (.sourceUrl|type=="string" and startswith("https://")) and (.scanUrls|type=="array" and length==0)' "$request" >/dev/null
            source_url="$(jq -r .sourceUrl "$request")"
            scans="$(jq -c .scanUrls "$request")"
            request_id="$(jq -r .requestId "$request")"
            publish_files="$(jq -c 'if has("publishFiles") then .publishFiles else "__ABSENT__" end' "$request")"
          else
            source_url="$RAW_SOURCE_URL"
            scans="$(printf '%s' "$RAW_SCAN_URLS" | jq -Rsc 'split("\n")|map(gsub("^\\s+|\\s+$";""))|map(select(length>0))')"
            request_id="${RAW_REQUEST_ID:-$GITHUB_RUN_ID}"
            publish_files="$(jq -cn --argjson report_pdf "${RAW_REPORT_PDF:-false}" --argjson audited_source "${RAW_AUDITED_SOURCE:-false}" --argjson scope_summary "${RAW_SCOPE_SUMMARY:-false}" --argjson findings_remediation "${RAW_FINDINGS_REMEDIATION:-false}" --argjson methodology_analysis "${RAW_METHODOLOGY_ANALYSIS:-false}" --argjson properties_hypotheses "${RAW_PROPERTIES_HYPOTHESES:-false}" --argjson execution_results "${RAW_EXECUTION_RESULTS:-false}" --argjson architecture_dependencies "${RAW_ARCHITECTURE_DEPENDENCIES:-false}" --argjson residual_risks "${RAW_RESIDUAL_RISKS:-false}" --argjson evidence_index "${RAW_EVIDENCE_INDEX:-false}" '{report_pdf:$report_pdf,audited_source:$audited_source,scope_summary:$scope_summary,findings_remediation:$findings_remediation,methodology_analysis:$methodology_analysis,properties_hypotheses:$properties_hypotheses,execution_results:$execution_results,architecture_dependencies:$architecture_dependencies,residual_risks:$residual_risks,evidence_index:$evidence_index}')"
          fi
          [[ "$request_id" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$source_url" != *$'\n'* && "$source_url" != *$'\r'* ]]
          if [ -n "$source_url" ]; then [[ "$source_url" =~ ^https:// ]]; fi
          jq -e 'type=="array" and all(.[]; type=="string" and startswith("https://"))' <<<"$scans" >/dev/null
          if [ -n "$source_url" ]; then test "$scans" = '[]'; else test "$scans" != '[]'; fi
          {
            echo "source_url=$source_url"
            echo "scan_urls_json=$scans"
            echo "request_id=$request_id"
            echo "publish_files_json=$publish_files"
          } >> "$GITHUB_OUTPUT"
      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh
      - name: Initialize exact source in direct lite-solo mode
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRACT_AUTOMATION_TOKEN: ${{ github.token }}
          AUDIT_CONTROLLER_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          SOURCE_URL: ${{ steps.request.outputs.source_url }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          SCAN_URLS: ${{ steps.request.outputs.scan_urls_json }}
          PUBLISH_FILES_JSON: ${{ steps.request.outputs.publish_files_json }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/lite-solo-source-initialization/run-v1.sh
