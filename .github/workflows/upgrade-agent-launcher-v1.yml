name: Upgrade Agent Launcher v1

on:
  workflow_dispatch:
    inputs:
      task_name:
        description: Short name for the repository upgrade
        required: true
        type: string
      instruction:
        description: Exact requested end-state for the upgrade agent
        required: true
        type: string
      target_repository:
        description: Repository the development agent must modify
        required: true
        default: curveyield3/Contract-Automation
        type: choice
        options:
          - curveyield3/Contract-Automation
          - curveyield3/Audit-Controller
      base_ref:
        description: Base ref for the generated implementation branch
        required: false
        default: main
        type: string
      target_branch:
        description: Optional exact target branch override
        required: false
        type: string
      authority_path:
        description: Development authority path in Contract-Automation
        required: false
        default: process/development-agent-task-manager/UPGRADE_AGENT_EXECUTION_AUTHORITY_v1.md
        type: string
      continuity_mode:
        description: Project-backed is the default; standalone is for tiny tasks
        required: false
        default: managed_project
        type: choice
        options:
          - managed_project
          - standalone
      acceptance_criteria:
        description: Optional newline-separated acceptance criteria
        required: false
        type: string
      initial_assignment:
        description: Optional extra initial instruction
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: upgrade-agent-launcher-admission-v1
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TASK_NAME: ${{ inputs.task_name }}
      INSTRUCTION: ${{ inputs.instruction }}
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      BASE_REF: ${{ inputs.base_ref }}
      TARGET_BRANCH_OVERRIDE: ${{ inputs.target_branch }}
      AUTHORITY_PATH: ${{ inputs.authority_path }}
      CONTINUITY_MODE: ${{ inputs.continuity_mode }}
      ACCEPTANCE_CRITERIA: ${{ inputs.acceptance_criteria }}
      INITIAL_ASSIGNMENT: ${{ inputs.initial_assignment }}
    steps:
      - name: Checkout current Contract-Automation main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Select target-repository credential
        if: inputs.target_repository == 'curveyield3/Audit-Controller'
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Validate authority and allocate task identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TASK_NAME"
          test -n "$INSTRUCTION"
          test -n "$TARGET_REPOSITORY"
          case "$TARGET_REPOSITORY" in
            curveyield3/Contract-Automation|curveyield3/Audit-Controller) ;;
            *) echo "::error::Target repository is not allowlisted."; exit 1 ;;
          esac
          case "$CONTINUITY_MODE" in managed_project|standalone) ;; *) echo "::error::Invalid continuity mode."; exit 1;; esac

          gh api "repos/$GITHUB_REPOSITORY/contents/$AUTHORITY_PATH?ref=main" --silent

          slug="$(node --input-type=module <<'NODE'
          import { safeSlug } from './process/development-agent-task-manager/launcher/shared/launcher-admission-v1.js';
          console.log(safeSlug(process.env.TASK_NAME));
          NODE
          )"

          target_token="${AUDIT_CONTROLLER_GITHUB_TOKEN:-$GH_TOKEN}"
          for revision in $(seq 1 999); do
            manager_id="upgrade-${slug}-r${revision}"
            request_path="process/development-agent-task-manager/requests/${manager_id}_v1.json"
            active_path="process/development-agent-task-manager/active/${manager_id}.json"
            completed_path="process/development-agent-task-manager/completed/${manager_id}.json"
            target_branch="${TARGET_BRANCH_OVERRIDE:-upgrade/${slug}-r${revision}}"

            collision=false
            gh api "repos/$GITHUB_REPOSITORY/contents/$request_path?ref=main" --silent >/dev/null 2>&1 && collision=true || true
            gh api "repos/$GITHUB_REPOSITORY/contents/$active_path?ref=main" --silent >/dev/null 2>&1 && collision=true || true
            gh api "repos/$GITHUB_REPOSITORY/contents/$completed_path?ref=main" --silent >/dev/null 2>&1 && collision=true || true
            GH_TOKEN="$target_token" gh api "repos/$TARGET_REPOSITORY/git/ref/heads/$target_branch" --silent >/dev/null 2>&1 && collision=true || true
            if [ "$collision" = false ]; then
              echo "manager_id=$manager_id" >> "$GITHUB_OUTPUT"
              echo "revision=$revision" >> "$GITHUB_OUTPUT"
              echo "target_branch=$target_branch" >> "$GITHUB_OUTPUT"
              echo "slug=$slug" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -n "$TARGET_BRANCH_OVERRIDE" ]; then
              echo "::error::Requested target branch already collides with existing state."
              exit 1
            fi
          done
          echo "::error::No free task revision is available."
          exit 1

      - name: Render deterministic specification and manager request
        env:
          MANAGER_ID: ${{ steps.identity.outputs.manager_id }}
          TARGET_BRANCH: ${{ steps.identity.outputs.target_branch }}
        shell: bash
        run: |
          set -euo pipefail
          spec_path="process/development-agent-task-manager/specifications/${MANAGER_ID}_SPEC_v1.md"
          request_path="process/development-agent-task-manager/requests/${MANAGER_ID}_v1.json"
          mkdir -p "$(dirname "$spec_path")" "$(dirname "$request_path")"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            renderManagerRequest,
            renderTaskSpecification,
          } from './process/development-agent-task-manager/launcher/shared/launcher-admission-v1.js';

          const acceptanceCriteria = String(process.env.ACCEPTANCE_CRITERIA || '')
            .split(/\r?\n/)
            .map((item) => item.trim())
            .filter(Boolean);
          const input = {
            taskName: process.env.TASK_NAME,
            instruction: process.env.INSTRUCTION,
            targetRepository: process.env.TARGET_REPOSITORY,
            baseRef: process.env.BASE_REF || 'main',
            authorityPath: process.env.AUTHORITY_PATH,
            continuityMode: process.env.CONTINUITY_MODE || 'managed_project',
            initialAssignment: process.env.INITIAL_ASSIGNMENT || '',
            acceptanceCriteria,
            managerId: process.env.MANAGER_ID,
            resolvedTargetBranch: process.env.TARGET_BRANCH,
            specificationPath: `process/development-agent-task-manager/specifications/${process.env.MANAGER_ID}_SPEC_v1.md`,
          };
          fs.writeFileSync(input.specificationPath, renderTaskSpecification(input));
          fs.writeFileSync(
            `process/development-agent-task-manager/requests/${process.env.MANAGER_ID}_v1.json`,
            JSON.stringify(renderManagerRequest(input), null, 2) + '\n',
          );
          NODE

          git diff --exit-code -- "process/development-agent-task-manager/requests" >/dev/null 2>&1 && {
            echo "::error::Launcher did not create a manager request."
            exit 1
          }

      - name: Commit atomic admission to main
        env:
          MANAGER_ID: ${{ steps.identity.outputs.manager_id }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CurveYield Upgrade Agent Launcher'
          git config user.email 'actions@users.noreply.github.com'
          git add             "process/development-agent-task-manager/specifications/${MANAGER_ID}_SPEC_v1.md"             "process/development-agent-task-manager/requests/${MANAGER_ID}_v1.json"
          request_changes="$(git diff --cached --name-only | grep -Ec '^process/development-agent-task-manager/requests/[^/]+\.json$' || true)"
          [ "$request_changes" -eq 1 ] || {
            echo "::error::Admission commit must contain exactly one manager request."
            exit 1
          }
          git commit -m "chore(upgrade-launcher): admit ${MANAGER_ID}"

          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git rebase origin/main
            fi
            if git push origin HEAD:main; then
              echo "## Upgrade task admitted" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "- Manager: \`${MANAGER_ID}\`" >> "$GITHUB_STEP_SUMMARY"
              echo "- Target: \`$TARGET_REPOSITORY\`" >> "$GITHUB_STEP_SUMMARY"
              echo "- Branch: \`${{ steps.identity.outputs.target_branch }}\`" >> "$GITHUB_STEP_SUMMARY"
              echo "- Admission commit: \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Unable to fast-forward the atomic admission commit to main after bounded retries."
          exit 1
