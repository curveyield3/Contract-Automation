name: Lite Phase 5 Evidence Reuse Regression v1

# Regression execution requires explicit audit-owner permission; never auto-run on source push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase5-evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify controller and evidence helper syntax
        run: |
          node --check scripts/lite-phase-packet-controller-v1.mjs
          node --check packages/github-native-sim/src/lite-boundary-artifacts-v1.mjs
          node --check packages/github-native-sim/src/v7-compact-result-v1.mjs
          node --check packages/github-native-sim/src/v7-cli.mjs
      - name: Check sealed-evidence reuse, invalidation, and fail-closed gates
        run: node --test packages/github-native-sim/test/lite-phase5-execution-gate-v1.test.mjs
