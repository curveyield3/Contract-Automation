name: DAI Phase 8 Mutable Anvil BOB Evidence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dai-phase8-anvil-bob-evidence-v1.yml'
      - 'scripts/dai-phase8-execute-local-anvil.mjs'
permissions:
  contents: read
jobs:
  execute-dai-existing-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DAI_EVIDENCE_ATTEMPT: '3'
    steps:
      - name: Checkout current execution source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing Foundry and Anvil binaries
        shell: bash
        run: npm ci --force
      - name: Authenticate private source read and evidence writeback
        shell: bash
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh
      - name: Stage immutable original DAI Solidity source and pre-existing seven-check harness
        shell: bash
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source_path='campaigns/audit-preview-live-ethereum-Dai-6b175474%20r1/source/live-scan-project/contracts/Dai.sol'
          source_commit='b66ee2b336c949c3ecb0621307b9c188f8f81e89'
          source_ref="repos/curveyield3/Audit-Controller/contents/$source_path?ref=$source_commit"
          test "$(gh api "$source_ref" --jq .sha)" = '64df95d43b61305616f849c09a119d626bf699f2'
          mkdir -p .dai-phase8-work/contracts .dai-phase8-work/test/phase6
          gh api "$source_ref" --jq .content | base64 -d > .dai-phase8-work/contracts/Dai.sol
          bundle='packages/github-native-sim/audit-harnesses/dai-live-mainnet-r1-phase8-v1'
          cp "$bundle/foundry.toml" .dai-phase8-work/foundry.toml
          cp "$bundle/test/phase6/DAILiveForkSecurityV1.t.sol" .dai-phase8-work/test/phase6/
          test -s .dai-phase8-work/contracts/Dai.sol
          test -s .dai-phase8-work/test/phase6/DAILiveForkSecurityV1.t.sol
          grep -q '^solc_version = "0.5.12"$' .dai-phase8-work/foundry.toml
      - name: Execute exactly seven security checks on mutable historical Anvil DAI
        shell: bash
        env:
          ETHEREUM_FORK_RPC_URL: ${{ secrets.RPC_ETHEREUM }}
        run: node scripts/dai-phase8-execute-local-anvil.mjs
      - name: Upload raw Foundry and exact test result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dai-phase8-bob-live-fork-evidence-${{ github.sha }}
          path: process/dai-phase8-evidence/attempt-3/
          if-no-files-found: warn
          retention-days: 90
      - name: Persist source-bound attempt in private DAI Phase-8 controller folder
        if: always()
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          folder='campaigns/audit-preview-completion-live-ethereum-dai-6b175474-r1/controller/phase8-revalidation/TG-001'
          local_dir='process/dai-phase8-evidence/attempt-3'
          if [ ! -s "$local_dir/BOB_EXECUTION_EVIDENCE_v1.json" ]; then
            echo "::error::No executable property evidence generated; refusing to invent a receipt"
            exit 1
          fi
          send_proof() {
            local local_file="$1" destination="$2" note="$3"
            [ -f "$local_file" ] || return 0
            local encoded
            encoded="$(base64 -w0 "$local_file")"
            if existing="$(gh api "repos/curveyield3/Audit-Controller/contents/$destination?ref=main" --jq .sha 2>/dev/null)"; then
              gh api --method PUT "repos/curveyield3/Audit-Controller/contents/$destination" \
                -f message="$note" -f content="$encoded" -f sha="$existing" -f branch=main >/dev/null
            else
              gh api --method PUT "repos/curveyield3/Audit-Controller/contents/$destination" \
                -f message="$note" -f content="$encoded" -f branch=main >/dev/null
            fi
          }
          send_proof "$local_dir/BOB_EXECUTION_EVIDENCE_v1.json" "$folder/DAI_FORK_BOB_EXECUTION_ATTEMPT_003_v1.json" \
            'audit(dai): record real historical mutable Anvil execution evidence for BOB-0001..0008'
          send_proof "$local_dir/FORGE_RAW_STDOUT.txt" "$folder/DAI_FORK_FORGE_RAW_STDOUT_ATTEMPT_003.txt" \
            'audit(dai): retain original Foundry assertion output for Phase-8 proof validation'
          send_proof "$local_dir/FORGE_RAW_STDERR.txt" "$folder/DAI_FORK_FORGE_RAW_STDERR_ATTEMPT_003.txt" \
            'audit(dai): retain original Foundry diagnostics for Phase-8 proof validation'
