name: Lite-Solo Cloudflare Isolated Fork v1
run-name: lite-solo-cloudflare-${{ inputs.operation }}-${{ inputs.correlation_id }}
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Fork operation from authenticated Cloudflare Worker
        required: true
        type: choice
        options:
          - PHASE_0_INITIALIZE
          - PHASE_NEXT_STEP
          - PHASE_VALIDATE_STEP
          - PHASE_FINALIZE
      payload_json:
        description: Exact source/campaign/phase/commit-bound JSON payload
        required: true
        type: string
      correlation_id:
        description: Correlation ID generated by the Worker
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: lite-solo-cloudflare-${{ fromJSON(inputs.payload_json).audit_id }}
  cancel-in-progress: false
jobs:
  fork:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout isolated fork implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select authenticated Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore existing controller dependencies
        run: npm ci --force --ignore-scripts --no-audit --no-fund
      - name: Execute isolated request without legacy ingress
        shell: bash
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          FORK_CALLBACK_TOKEN: ${{ secrets.CLOUDFLARE_FORK_TOKEN }}
          CLOUDFLARE_WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
          FORK_OPERATION: ${{ inputs.operation }}
          FORK_PAYLOAD_JSON: ${{ inputs.payload_json }}
          FORK_CORRELATION_ID: ${{ inputs.correlation_id }}
          FORK_RUN_SHA: ${{ github.sha }}
          FORK_RUN_ID: ${{ github.run_id }}
          ETHEREUM_FORK_RPC_URL: ${{ secrets.RPC_ETHEREUM }}
          KATANA_FORK_RPC_URL: ${{ secrets.RPC_KATANA }}
          RPC_BASE: ${{ secrets.RPC_BASE }}
        run: node scripts/lite-solo-cloudflare-fork-v1.mjs
