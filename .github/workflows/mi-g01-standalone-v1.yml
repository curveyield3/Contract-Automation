name: "MI G01 Standalone Historical Arithmetic v1"
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "historical or target or both"
        required: true
        default: historical
        type: choice
        options: [historical, target, both]
      target_profile:
        description: "Relative path under isolated-mi-exploit-g01-v1/target-profiles/"
        required: false
        type: string
      historical_case:
        description: "E1, E2, E5, E55, E60 or all"
        required: false
        default: all
        type: string
  push:
    branches: [machine-intelligence-audit-controller-v1]
    paths:
      - isolated-mi-exploit-g01-v1/trigger/armed/*.json
permissions:
  contents: read
concurrency:
  group: mi-g01-standalone-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  group1:
    if: github.ref_name == 'machine-intelligence-audit-controller-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact isolated Machine Intelligence branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup isolated, copied/pinned G01 toolchain
        uses: ./.github/actions/mi-g01-toolchain-v1
      - name: Run standalone historical and/or target simulations
        continue-on-error: true
        env:
          G01_ETHEREUM_RPC: ${{ secrets.RPC_ETHEREUM }}
          G01_BSC_RPC: ${{ secrets.RPC_BSC }}
          G01_MODE: ${{ inputs.mode || 'historical' }}
          G01_HISTORICAL_CASE: ${{ inputs.historical_case || 'all' }}
          G01_TARGET_PROFILE: ${{ inputs.target_profile || '' }}
          G01_OUTPUT_DIR: ${{ runner.temp }}/mi-g01-standalone-report-v1
          G01_REPO_SHA: ${{ github.sha }}
          G01_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$G01_OUTPUT_DIR"
          timeout -s TERM -k 15s 2400s node isolated-mi-exploit-g01-v1/src/cli.mjs
      - name: Retain standalone evidence (including blocked and partial cases)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mi-g01-standalone-${{ github.run_id }}
          path: ${{ runner.temp }}/mi-g01-standalone-report-v1
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false
