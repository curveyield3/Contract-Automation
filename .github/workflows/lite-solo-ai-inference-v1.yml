name: Lite-Solo AI Source Inference and Autonomous Beta v2
on:
  push:
    branches: [main]
    paths:
      - 'process/agent-upload/lite-solo-ai-training-request-v1.json'
  workflow_dispatch:
    inputs:
      mode:
        description: Public source draft, legacy v5 step, new AI v6 start, or v6 autonomous continuation
        required: true
        default: public
        type: choice
        options: [public, campaign, autonomous_start, autonomous, train]
      source_url:
        description: HTTPS source ZIP URL for one-time new autonomous AI-v6 beta start
        required: false
        type: string
      ai_hop:
        description: Internal finite continuation counter; leave 0 when manually starting
        required: false
        default: '0'
        type: string
      campaign_id:
        description: Exact private campaign ID, including -rN (campaign mode)
        required: false
        type: string
      expected_phase:
        description: Exact authorized phase number (campaign mode)
        required: false
        type: string
      expected_step:
        description: Exact authorized numbered step (campaign mode)
        required: false
        type: string
      operator_authorized_step:
        description: Human operator authorizes this exact agent-authored step
        required: false
        default: false
        type: boolean
      submission_mode:
        description: Whether to submit generated work to the existing Worker after independent review
        required: true
        default: draft
        type: choice
        options: [draft, submit]
      train_dataset_path:
        description: Checked-in PUBLIC supervised JSONL input for train mode
        type: string
        required: false
      train_model_revision:
        description: Immutable original MiMo checkpoint SHA; auto-pin when blank
        type: string
        default: ''
        required: false
      train_steps:
        description: Target optimizer steps, up to 100
        type: string
        default: '1'
        required: false
      train_sequence_length:
        description: Max tokens per sample (32-256)
        type: string
        default: '128'
        required: false
      train_minutes:
        description: Per-rank execution budget (1-70 minutes)
        type: string
        default: '65'
        required: false
      train_resume_run:
        description: Optional previous eight-rank checkpoint workflow run ID
        type: string
        default: ''
        required: false
      source_path:
        description: Checked-in PUBLIC Solidity or Vyper file or directory (public mode only)
        required: false
        type: string
      max_chunks:
        description: Source chunks to analyze, 1-32
        required: false
        default: '12'
        type: string
permissions:
  contents: read
  id-token: write
  actions: write
concurrency:
  group: lite-solo-ai-${{ inputs.mode }}-${{ (inputs.mode == 'campaign' || inputs.mode == 'autonomous') && inputs.campaign_id || inputs.mode == 'autonomous_start' && inputs.source_url || inputs.source_path }}
  cancel-in-progress: false
jobs:
  infer:
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'train'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.mode == 'autonomous' && 355 || 100 }}
    env:
      AUDIT_AI_MODE: ${{ inputs.mode }}
      AUDIT_AI_SOURCE_URL: ${{ inputs.source_url }}
      AUDIT_AI_HOP: ${{ inputs.ai_hop }}
      AUDIT_AI_SOURCE_PATH: ${{ inputs.source_path }}
      AUDIT_AI_CAMPAIGN_ID: ${{ inputs.campaign_id }}
      AUDIT_AI_EXPECTED_PHASE: ${{ inputs.expected_phase }}
      AUDIT_AI_EXPECTED_STEP: ${{ inputs.expected_step }}
      AUDIT_AI_STEP_AUTHORIZED: ${{ inputs.operator_authorized_step }}
      AUDIT_AI_SUBMISSION_MODE: ${{ inputs.submission_mode }}
      AUDIT_AI_MAX_CHUNKS: ${{ inputs.max_chunks }}
      MODEL_FILE: MiMo-V2.6-Distill-Qwen-9B-Q4_K_M.gguf
      MODEL_REVISION: 4371da10c84fb26da3592d4cf312d24aa82b7b65
      MODEL_SHA256: 4bca6f18c73f72270c7a20c2ea2bea581de8246e318714277120369d34048c81
      LLAMA_SHA: 8642541b255bfb5dc39cd351a178be09013a55d6
    steps:
      - name: Record autonomous runner start for bounded 5h45 handoff
        if: inputs.mode == 'autonomous'
        shell: bash
        run: echo "AUDIT_AI_STARTED_AT_MS=$(($(date +%s)*1000))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Check resource budget
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AUDIT_AI_MAX_CHUNKS" =~ ^[0-9]+$ ]]
          test "$AUDIT_AI_MAX_CHUNKS" -ge 1
          test "$AUDIT_AI_MAX_CHUNKS" -le 32
          case "$AUDIT_AI_MODE" in
            public)
              test -n "$AUDIT_AI_SOURCE_PATH"
              test "$AUDIT_AI_SUBMISSION_MODE" = draft
              ;;
            autonomous_start)
              [[ "$AUDIT_AI_SOURCE_URL" =~ ^https:// ]]
              [[ "$AUDIT_AI_HOP" =~ ^[0-9]+$ ]]
              test "$AUDIT_AI_HOP" -eq 0
              ;;
            autonomous)
              test -n "$AUDIT_AI_CAMPAIGN_ID"
              [[ "$AUDIT_AI_EXPECTED_PHASE" =~ ^[0-9]+$ ]]
              [[ "$AUDIT_AI_EXPECTED_STEP" =~ ^[0-9]+$ ]]
              [[ "$AUDIT_AI_HOP" =~ ^[0-9]+$ ]]
              test "$AUDIT_AI_HOP" -le 120
              test "$AUDIT_AI_SUBMISSION_MODE" = submit
              ;;
            campaign)
              test "$AUDIT_AI_STEP_AUTHORIZED" = true
              test -n "$AUDIT_AI_CAMPAIGN_ID"
              [[ "$AUDIT_AI_EXPECTED_PHASE" =~ ^[0-9]+$ ]]
              [[ "$AUDIT_AI_EXPECTED_STEP" =~ ^[0-9]+$ ]]
              ;;
            *) exit 1;;
          esac
          df -h "$RUNNER_TEMP"
          free -h
      - name: Launch standalone AI-v6 beta using signed job identity
        if: inputs.mode == 'autonomous_start'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          const sourceUrl=process.env.AUDIT_AI_SOURCE_URL;
          if(!/^https:\/\//.test(sourceUrl))throw Error('Source ZIP HTTPS URL required');
          const endpoint=process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const grant=process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if(!endpoint||!grant)throw Error('GitHub OIDC identity unavailable');
          const tokenResponse=await fetch(endpoint+(endpoint.includes('?')?'&':'?')+'audience='+encodeURIComponent('urn:curveyield:lite-solo:github-actions-ai:v1'),
            {headers:{authorization:'bearer '+grant},signal:AbortSignal.timeout(20000)});
          if(!tokenResponse.ok)throw Error('OIDC issuance failed');
          const credential=(await tokenResponse.json()).value;
          const body={requestId:'ai-'+process.env.GITHUB_RUN_ID,sourceUrl,aiAutonomous:true};
          const response=await fetch('https://lite-solo-api.jamesnexus9999.workers.dev/api/campaign/start',{
            method:'POST',headers:{authorization:'Bearer '+credential,'content-type':'application/json'},
            body:JSON.stringify(body),signal:AbortSignal.timeout(90000)});
          const payload=await response.json();
          if(!response.ok)throw Error('AI beta campaign admission rejected HTTP '+response.status);
          const result={status:payload.status,requestId:payload.requestId,controllerAccepted:false};
          console.log(JSON.stringify(result));
          NODE
      - name: Resolve existing authorized private controller credential
        if: inputs.mode == 'campaign' || inputs.mode == 'autonomous'
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Build pinned CPU llama.cpp
        if: inputs.mode != 'autonomous_start'
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" fetch --quiet --depth=1 origin "$LLAMA_SHA"
          git -C "$RUNNER_TEMP/llama.cpp" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/llama.cpp" rev-parse HEAD)" = "$LLAMA_SHA"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama-build" -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          cmake --build "$RUNNER_TEMP/llama-build" --target llama-server -j 4
      - name: Fetch and verify pinned MiMo weights
        if: inputs.mode != 'autonomous_start'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/models"
          curl -fL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/models/$MODEL_FILE" \
            "https://huggingface.co/bartowski/MiMo-V2.6-Distill-Qwen-9B-GGUF/resolve/$MODEL_REVISION/$MODEL_FILE"
          printf '%s  %s\n' "$MODEL_SHA256" "$RUNNER_TEMP/models/$MODEL_FILE" | sha256sum --check
          df -h "$RUNNER_TEMP"
      - name: Run model inference in authorized mode
        if: inputs.mode != 'autonomous_start'
        shell: bash
        env:
          GITHUB_ACTIONS_DISPATCH_TOKEN: ${{ github.token }}
          AUDIT_AI_OUTPUT: ${{ runner.temp }}/lite-solo-ai/analysis.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$AUDIT_AI_OUTPUT")"
          "$RUNNER_TEMP/llama-build/bin/llama-server" --model "$RUNNER_TEMP/models/$MODEL_FILE" \
            --alias lite-solo-mimo-v1 --host 127.0.0.1 --port 8080 \
            --ctx-size 24576 --threads 4 --parallel 1 --n-gpu-layers 0 \
            > "$RUNNER_TEMP/mimo-server.log" 2>&1 &
          pid=$!
          # Passive resource telemetry; uses only Linux /proc and existing Python 3.
          python3 -u - "$pid" "$RUNNER_TEMP/mimo-resource-metrics.jsonl" <<'PY' &
          import json, os, pathlib, signal, sys, threading, time
          
          pid = int(sys.argv[1])
          report = pathlib.Path(sys.argv[2])
          stop = threading.Event()
          signal.signal(signal.SIGTERM, lambda *_: stop.set())
          hz = os.sysconf("SC_CLK_TCK")
          proc = pathlib.Path("/proc") / str(pid)
          cgroup = pathlib.Path("/sys/fs/cgroup")
          samples = 0
          max_cpu = 0.0
          sum_cpu = 0.0
          max_rss = 0.0
          max_group_ram = 0.0
          
          def read_int(path):
              try:
                  raw = pathlib.Path(path).read_text().strip()
                  return int(raw) if raw != "max" else None
              except (OSError, ValueError):
                  return None
          
          def cpu_ticks(stat):
              raw = pathlib.Path(stat).read_text()
              fields = raw[raw.rfind(")") + 2:].split()
              return int(fields[11]) + int(fields[12])
          
          def read_threads():
              values = {}
              for stat in (proc / "task").glob("*/stat"):
                  try:
                      values[int(stat.parent.name)] = cpu_ticks(stat)
                  except (OSError, ValueError, IndexError):
                      continue
              return values
          
          def fields_file(path):
              result = {}
              try:
                  for line in pathlib.Path(path).read_text().splitlines():
                      parts = line.replace(":", "").split()
                      if len(parts) >= 2 and parts[1].isdigit():
                          result[parts[0]] = int(parts[1])
              except OSError:
                  pass
              return result
          
          def mib(kib):
              return round(kib / 1024, 1) if kib is not None else None
          
          def bytes_mib(value):
              return round(value / 1048576, 1) if value is not None else None
          
          def emit(value):
              line = json.dumps(value, separators=(",", ":"), sort_keys=True)
              print(line, flush=True)
              try:
                  with report.open("a", encoding="utf-8") as f:
                      f.write(line + "\n")
              except OSError:
                  pass
          
          try:
              cpu_quota = (cgroup / "cpu.max").read_text().split()
              quota_cores = round(int(cpu_quota[0]) / int(cpu_quota[1]), 3) if cpu_quota[0] != "max" else None
          except (OSError, ValueError, ZeroDivisionError, IndexError):
              quota_cores = None
          try:
              affinity_cores = len(os.sched_getaffinity(pid))
          except OSError:
              affinity_cores = os.cpu_count()
          capacity = min(affinity_cores, quota_cores) if quota_cores else affinity_cores
          emit({"status": "MIMO_RESOURCE_MONITOR_STARTED", "intervalSeconds": 30,
                "cpuAffinityCores": affinity_cores, "cpuQuotaCores": quota_cores,
                "cpuEffectiveCapacityCores": capacity})
          previous_time = time.monotonic()
          try:
              previous_ticks = cpu_ticks(proc / "stat")
              previous_threads = read_threads()
          except (OSError, ValueError, IndexError):
              previous_ticks = None
              previous_threads = {}
          previous_cpu_stat = fields_file(cgroup / "cpu.stat")
          while previous_ticks is not None and not stop.wait(30):
              try:
                  now = time.monotonic()
                  ticks = cpu_ticks(proc / "stat")
                  elapsed = max(0.001, now - previous_time)
                  cpu = max(0.0, (ticks - previous_ticks) / hz / elapsed * 100)
                  thread_ticks = read_threads()
                  top_threads = sorted(
                      ({"tid": tid, "cpuPercentOneCore": round(max(0, count - previous_threads.get(tid, count)) / hz / elapsed * 100, 1)}
                       for tid, count in thread_ticks.items()),
                      key=lambda x: -x["cpuPercentOneCore"])[:8]
                  proc_status = fields_file(proc / "status")
                  mem = fields_file("/proc/meminfo")
                  cpu_stat = fields_file(cgroup / "cpu.stat")
                  cgroup_ram = bytes_mib(read_int(cgroup / "memory.current"))
                  rss = mib(proc_status.get("VmRSS"))
                  throttle_prev = previous_cpu_stat.get("throttled_usec")
                  throttle_now = cpu_stat.get("throttled_usec")
                  throttled_ms = round(max(0, throttle_now - throttle_prev) / 1000, 1) if throttle_prev is not None and throttle_now is not None else None
                  sample = {"status": "MIMO_RESOURCE_SAMPLE", "elapsedSeconds": round(elapsed, 1),
                            "cpuPercentOneCore": round(cpu, 1),
                            "cpuEffectiveCapacityPercent": round(cpu / capacity, 1) if capacity else None,
                            "activeThreads": proc_status.get("Threads"), "threadCpuTop": top_threads,
                            "processRssMiB": rss, "processPeakRssMiB": mib(proc_status.get("VmHWM")),
                            "processVirtualMiB": mib(proc_status.get("VmSize")),
                            "ramTotalMiB": mib(mem.get("MemTotal")), "ramAvailableMiB": mib(mem.get("MemAvailable")),
                            "cgroupMemoryCurrentMiB": cgroup_ram, "cgroupMemoryPeakMiB": bytes_mib(read_int(cgroup / "memory.peak")),
                            "cgroupMemoryLimitMiB": bytes_mib(read_int(cgroup / "memory.max")),
                            "cgroupCpuThrottledMs": throttled_ms,
                            "cgroupThrottleEvents": max(0, cpu_stat.get("nr_throttled", 0) - previous_cpu_stat.get("nr_throttled", 0))}
                  emit(sample)
                  samples += 1
                  max_cpu = max(max_cpu, cpu)
                  sum_cpu += cpu
                  max_rss = max(max_rss, rss or 0)
                  max_group_ram = max(max_group_ram, cgroup_ram or 0)
                  previous_time, previous_ticks, previous_threads, previous_cpu_stat = now, ticks, thread_ticks, cpu_stat
              except (OSError, ValueError, IndexError) as exc:
                  emit({"status": "MIMO_RESOURCE_MONITOR_WARNING", "reason": type(exc).__name__})
                  break
          summary = {"status": "MIMO_RESOURCE_SUMMARY", "samples": samples,
                     "averageCpuPercentOneCore": round(sum_cpu / samples, 1) if samples else None,
                     "peakCpuPercentOneCore": round(max_cpu, 1) if samples else None,
                     "peakProcessRssMiB": round(max_rss, 1) if samples else None,
                     "peakCgroupMemoryMiB": round(max_group_ram, 1) if samples else None,
                     "cpuEffectiveCapacityCores": capacity}
          emit(summary)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              try:
                  with open(summary_path, "a", encoding="utf-8") as f:
                      f.write("\n### MiMo CPU and RAM telemetry\n")
                      f.write(f"- Sample interval: 30 s; samples: {samples}\n")
                      f.write(f"- CPU effective capacity: {capacity} cores\n")
                      f.write(f"- Average / peak CPU use (one core = 100%): {summary['averageCpuPercentOneCore']}% / {summary['peakCpuPercentOneCore']}%\n")
                      f.write(f"- Peak model RSS / cgroup RAM: {summary['peakProcessRssMiB']} MiB / {summary['peakCgroupMemoryMiB']} MiB\n")
                      f.write("- Per-sample CPU, per-thread CPU, RAM, cgroup usage and throttling are in MIMO_RESOURCE_SAMPLE log records.\n")
              except OSError:
                  pass
          PY
          monitor_pid=$!
          cleanup_mimo() {
            kill "$monitor_pid" 2>/dev/null || true
            wait "$monitor_pid" 2>/dev/null || true
            kill "$pid" 2>/dev/null || true
          }
          trap cleanup_mimo EXIT
          ready=false
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health | jq -e '.status == "ok"' >/dev/null 2>&1; then ready=true; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then
              tail -n 30 "$RUNNER_TEMP/mimo-server.log"; exit 1
            fi
            sleep 2
          done
          test "$ready" = true || { echo "Model load timeout"; exit 1; }
          if [ "$AUDIT_AI_MODE" = campaign ] || [ "$AUDIT_AI_MODE" = autonomous ]; then
            export AUDIT_CONTROLLER_GITHUB_TOKEN="${AUDIT_CONTROLLER_GITHUB_TOKEN:-}"
            test -n "$AUDIT_CONTROLLER_GITHUB_TOKEN"
          fi
          node scripts/lite-solo-ai/review-v1.mjs
      - name: Retain public-source draft artifact
        if: always() && inputs.mode == 'public'
        uses: actions/upload-artifact@v4
        with:
          name: lite-solo-ai-draft-${{ github.run_id }}
          path: ${{ runner.temp }}/lite-solo-ai/analysis.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Summarize disposition without private evidence
        if: always()
        shell: bash
        run: |
          file="$RUNNER_TEMP/lite-solo-ai/analysis.json"
          if [ "$AUDIT_AI_MODE" = campaign ] || [ "$AUDIT_AI_MODE" = autonomous ]; then
            echo 'Private campaign mode: inspect the Worker for actual persisted acceptance. This job cannot seal a step.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$AUDIT_AI_MODE" = autonomous_start ]; then
            echo 'AI autonomous campaign initialization submitted; controller Phase0 acceptance and later execution must be checked separately.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'Public read-only AI draft; NOT a controller submission or completed audit.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$file" ]; then
            jq -r '"Status: \(.status); reviewed \(.reviewed|length)/\(.totalChunks) chunks"' "$file" >> "$GITHUB_STEP_SUMMARY"
          fi

  train:
    if: github.event_name == 'push' || inputs.mode == 'train'
    name: MiMo CPU training stage ${{ matrix.rank }} / 7
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: true
      matrix:
        rank: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      GLOO_SOCKET_IFNAME: tailscale0
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONUNBUFFERED: '1'
      DATASET: ${{ inputs.train_dataset_path }}
      STEPS: ${{ inputs.train_steps }}
      LENGTH: ${{ inputs.train_sequence_length }}
      MINUTES: ${{ inputs.train_minutes }}
      REVISION: ${{ inputs.train_model_revision }}
      RESUME_RUN: ${{ inputs.train_resume_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Resolve owner-approved file-trigger request
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          request='process/agent-upload/lite-solo-ai-training-request-v1.json'
          test -s "$request"
          jq -e '.schemaVersion=="mimo-eight-rank-training-request-v1" and .mode=="train"
            and (.train_dataset_path | type=="string")
            and (.train_steps | type=="number")
            and (.train_sequence_length | type=="number")
            and (.train_minutes | type=="number")' "$request" >/dev/null
          {
            echo "DATASET=$(jq -r '.train_dataset_path' "$request")"
            echo "STEPS=$(jq -r '.train_steps' "$request")"
            echo "LENGTH=$(jq -r '.train_sequence_length' "$request")"
            echo "MINUTES=$(jq -r '.train_minutes' "$request")"
            echo "REVISION=$(jq -r '.train_model_revision // ""' "$request")"
            echo "RESUME_RUN=$(jq -r '.train_resume_run // ""' "$request")"
          } >> "$GITHUB_ENV"
      - name: Validate bounded, checked-in public training input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DATASET" =~ ^[A-Za-z0-9._/-]+\.jsonl$ ]]
          [[ "$DATASET" != /* && "$DATASET" != *..* ]]
          test -s "$DATASET"
          test "$(stat -c%s "$DATASET")" -le 2097152
          [[ "$STEPS" =~ ^[0-9]+$ ]] && test "$STEPS" -ge 1 && test "$STEPS" -le 100
          [[ "$LENGTH" =~ ^[0-9]+$ ]] && test "$LENGTH" -ge 32 && test "$LENGTH" -le 256
          [[ "$MINUTES" =~ ^[0-9]+$ ]] && test "$MINUTES" -ge 1 && test "$MINUTES" -le 70
          [[ -z "$REVISION" || "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ -z "$RESUME_RUN" || "$RESUME_RUN" =~ ^[0-9]+$ ]]
      - name: Join private training network using existing GitHub OIDC helper
        shell: bash
        env:
          TS_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TAILNET_TAG: tag:ai-training
        run: |
          set -euo pipefail
          test -n "$TS_CLIENT_ID" || { echo "::error::Missing existing TS_OAUTH_CLIENT_ID"; exit 1; }
          bash scripts/browser-agent-tailnet-oidc.sh
          tailscale ip -4 | grep -E '^100\.[0-9]+\.[0-9]+\.[0-9]+$'
      - name: Install CPU training dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-input "torch==2.9.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-input "transformers==5.12.1" "huggingface_hub==1.4.0" "safetensors==0.7.0" "tokenizers==0.22.2"
      - name: Pin original MiMo revision and rendezvous address
        if: matrix.rank == 0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mimo-rendezvous"
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          sha=HfApi().model_info("XiaomiMiMo/MiMo-V2.6-Distill-Qwen-9B",revision=os.environ["REVISION"] or "main").sha
          if len(sha)!=40: raise RuntimeError("Expected immutable 40-character MiMo commit")
          (Path(os.environ["RUNNER_TEMP"])/"mimo-rendezvous"/"model_sha").write_text(sha)
          PY
          tailscale ip -4 | head -n 1 > "$RUNNER_TEMP/mimo-rendezvous/master_addr"
      - name: Publish private rank-0 rendezvous artifact
        if: matrix.rank == 0
        uses: actions/upload-artifact@v4
        with:
          name: mimo-rendezvous-${{ github.run_id }}
          path: ${{ runner.temp }}/mimo-rendezvous/
          if-no-files-found: error
          retention-days: 2
      - name: Resolve pinned eight-rank rendezvous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mimo-rendezvous"
          if [ "${{ matrix.rank }}" != 0 ]; then
            acquired=false
            for attempt in $(seq 1 80); do
              if gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" \
                -n "mimo-rendezvous-$GITHUB_RUN_ID" -D "$RUNNER_TEMP/mimo-rendezvous" >/dev/null 2>&1; then
                acquired=true; break
              fi
              sleep 15
            done
            test "$acquired" = true || { echo "::error::Rank-zero rendezvous timed out"; exit 1; }
          fi
          grep -Eq '^100\.[0-9]+\.[0-9]+\.[0-9]+$' "$RUNNER_TEMP/mimo-rendezvous/master_addr"
          grep -Eq '^[0-9a-f]{40}$' "$RUNNER_TEMP/mimo-rendezvous/model_sha"
      - name: Restore complete previous eight-rank generation
        if: github.event_name == 'push' || inputs.train_resume_run != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$RESUME_RUN" ]; then
            echo 'No previous training checkpoint requested'
            exit 0
          fi
          listing="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN/artifacts?per_page=100")"
          for rank in $(seq 0 7); do
            printf '%s' "$listing" | jq -e --arg n "mimo-cpu-checkpoint-rank-$rank" \
              '[.artifacts[] | select(.name==$n and .expired==false)] | length == 1' >/dev/null || {
                echo "::error::Previous training run lacks a complete eight-rank checkpoint"; exit 1;
              }
          done
          mkdir -p "$RUNNER_TEMP/mimo-resume"
          gh run download "$RESUME_RUN" -R "$GITHUB_REPOSITORY" \
            -n "mimo-cpu-checkpoint-rank-${{ matrix.rank }}" -D "$RUNNER_TEMP/mimo-resume"
          test -s "$RUNNER_TEMP/mimo-resume/checkpoint-rank-${{ matrix.rank }}.pt"
      - name: Train four owned Qwen3.5 layers and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mimo-output"
          extras=()
          if [ -n "$RESUME_RUN" ]; then
            extras=(--resume "$RUNNER_TEMP/mimo-resume/checkpoint-rank-${{ matrix.rank }}.pt")
          fi
          python -u scripts/lite-solo-ai/train_cpu_v1.py \
            --dataset "$DATASET" \
            --model-revision "$(cat "$RUNNER_TEMP/mimo-rendezvous/model_sha")" \
            --rank "${{ matrix.rank }}" --world-size 8 \
            --master-addr "$(cat "$RUNNER_TEMP/mimo-rendezvous/master_addr")" \
            --master-port 29631 --steps "$STEPS" --sequence-length "$LENGTH" \
            --minutes "$MINUTES" \
            --output "$RUNNER_TEMP/mimo-output/checkpoint-rank-${{ matrix.rank }}.pt" \
            "${extras[@]}"
      - name: Preserve this rank's checkpoint
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mimo-cpu-checkpoint-rank-${{ matrix.rank }}
          path: ${{ runner.temp }}/mimo-output/checkpoint-rank-${{ matrix.rank }}.pt
          retention-days: 7
          if-no-files-found: error
      - name: Distinguish stage checkpoint from deployed adapter
        if: always()
        run: |
          echo 'Eight rank checkpoints are NOT yet a merged LoRA adapter or Lite-Solo deployment.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Training does not change controller receipts, v5 approvals or v6 audit authority.' >> "$GITHUB_STEP_SUMMARY"

  training-package:
    if: github.event_name == 'push' || inputs.mode == 'train'
    name: Consolidate eight MiMo CPU LoRA stage checkpoints
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download all eight successful rank artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mimo-cpu-checkpoint-rank-*
          path: ${{ runner.temp }}/mimo-rank-checkpoints
          merge-multiple: false
      - name: Install CPU-only aggregation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-input "torch==2.9.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-input "safetensors==0.7.0"
      - name: Package exact matching model-stage adapters and provenance
        shell: bash
        env:
          RANK_ROOT: ${{ runner.temp }}/mimo-rank-checkpoints
          PACKAGE_DIR: ${{ runner.temp }}/mimo-training-package
        run: |
          set -euo pipefail
          mkdir -p "$PACKAGE_DIR"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import torch
          from safetensors.torch import save_file
          root=Path(os.environ["RANK_ROOT"])
          out=Path(os.environ["PACKAGE_DIR"])
          states=[]
          artifact_digests={}
          for rank in range(8):
              p=root/f"mimo-cpu-checkpoint-rank-{rank}"/f"checkpoint-rank-{rank}.pt"
              if not p.is_file():
                  raise RuntimeError(f"Missing rank {rank} checkpoint")
              artifact_digests[str(rank)]=hashlib.sha256(p.read_bytes()).hexdigest()
              ck=torch.load(p,map_location="cpu",weights_only=True)
              if ck["rank"] != rank:
                  raise RuntimeError("Checkpoint owner rank mismatch")
              states.append(ck)
          identity=states[0]["identity"]
          step=states[0]["step"]
          if any(s["identity"]!=identity or s["step"]!=step for s in states):
              raise RuntimeError("Incomplete or inconsistent rank checkpoint generation")
          layers={}
          for rank,ck in enumerate(states):
              for name,tensor in ck["adapter"].items():
                  if name in layers or not name.startswith("layers."):
                      raise RuntimeError("Unexpected or duplicated model-stage adapter tensor")
                  if not name.endswith((".a",".b")):
                      raise RuntimeError("Unrecognized adapter tensor")
                  layer=int(name.split(".")[1])
                  if layer not in range(rank*4,rank*4+4):
                      raise RuntimeError("Adapter tensor assigned to the wrong four-layer stage")
                  layers[name]=tensor.contiguous()
          if not layers:
              raise RuntimeError("Empty adapter bundle")
          save_file(layers,str(out/"mimo_cpu_lora_stages.safetensors"))
          report={
              "schemaVersion":"mimo-cpu-training-package-v1",
              "status":"TRAINED_STAGE_ADAPTERS_NOT_DEPLOYED",
              "baseModel":"XiaomiMiMo/MiMo-V2.6-Distill-Qwen-9B",
              "sourceAndDatasetIdentity":identity,
              "trainedOptimizerSteps":step,
              "pipelineRanks":8,
              "loraRank":8,
              "loraAlpha":16,
              "adapterTensorCount":len(layers),
              "checkpointSha256ByRank":artifact_digests,
              "adapterSha256":hashlib.sha256((out/"mimo_cpu_lora_stages.safetensors").read_bytes()).hexdigest(),
              "limitations":[
                  "Raw rank-merged LoRA tensors are not yet converted to a validated PEFT or GGUF adapter.",
                  "No audit evaluation or model promotion has been authorized.",
                  "Original Q4 llama.cpp inference and all audit authorities remain unchanged."
              ],
          }
          (out/"manifest.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps({"status":report["status"],"steps":step,"tensors":len(layers)}))
          PY
      - name: Upload consolidated training package
        uses: actions/upload-artifact@v4
        with:
          name: mimo-cpu-training-package-v1
          path: ${{ runner.temp }}/mimo-training-package/
          if-no-files-found: error
          retention-days: 7
