name: Lite-Solo AI Source Inference and Autonomous Beta v1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lite-solo-ai-inference-v1.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: Public source draft, legacy v5 step, new AI v6 start, or v6 autonomous continuation
        required: true
        default: public
        type: choice
        options: [public, campaign, autonomous_start, autonomous]
      source_url:
        description: HTTPS source ZIP URL for one-time new autonomous AI-v6 beta start
        required: false
        type: string
      ai_hop:
        description: Internal finite continuation counter; leave 0 when manually starting
        required: false
        default: '0'
        type: string
      campaign_id:
        description: Exact private campaign ID, including -rN (campaign mode)
        required: false
        type: string
      expected_phase:
        description: Exact authorized phase number (campaign mode)
        required: false
        type: string
      expected_step:
        description: Exact authorized numbered step (campaign mode)
        required: false
        type: string
      operator_authorized_step:
        description: Human operator authorizes this exact agent-authored step
        required: false
        default: false
        type: boolean
      submission_mode:
        description: Whether to submit generated work to the existing Worker after independent review
        required: true
        default: draft
        type: choice
        options: [draft, submit]
      source_path:
        description: Checked-in PUBLIC Solidity or Vyper file or directory (public mode only)
        required: false
        type: string
      max_chunks:
        description: Source chunks to analyze, 1-32
        required: false
        default: '12'
        type: string
permissions:
  contents: read
  id-token: write
  actions: write
concurrency:
  group: lite-solo-ai-${{ inputs.mode }}-${{ (inputs.mode == 'campaign' || inputs.mode == 'autonomous') && inputs.campaign_id || inputs.mode == 'autonomous_start' && inputs.source_url || inputs.source_path }}
  cancel-in-progress: false
jobs:
  dispatch-once:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'launch-ai-cyvbusdcv28-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch existing signed MiMo autonomous startup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run lite-solo-ai-inference-v1.yml \
            --repo "$GITHUB_REPOSITORY" --ref main \
            -f mode=autonomous_start \
            -f source_url='https://github.com/curveyield3/Audit-Controller/blob/main/campaigns/cyvbUSDCv28.zip' \
            -f ai_hop=0
  infer:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      AUDIT_AI_MODE: ${{ inputs.mode }}
      AUDIT_AI_SOURCE_URL: ${{ inputs.source_url }}
      AUDIT_AI_HOP: ${{ inputs.ai_hop }}
      AUDIT_AI_SOURCE_PATH: ${{ inputs.source_path }}
      AUDIT_AI_CAMPAIGN_ID: ${{ inputs.campaign_id }}
      AUDIT_AI_EXPECTED_PHASE: ${{ inputs.expected_phase }}
      AUDIT_AI_EXPECTED_STEP: ${{ inputs.expected_step }}
      AUDIT_AI_STEP_AUTHORIZED: ${{ inputs.operator_authorized_step }}
      AUDIT_AI_SUBMISSION_MODE: ${{ inputs.submission_mode }}
      AUDIT_AI_MAX_CHUNKS: ${{ inputs.max_chunks }}
      MODEL_FILE: MiMo-V2.6-Distill-Qwen-9B-Q4_K_M.gguf
      MODEL_REVISION: 4371da10c84fb26da3592d4cf312d24aa82b7b65
      MODEL_SHA256: 4bca6f18c73f72270c7a20c2ea2bea581de8246e318714277120369d34048c81
      LLAMA_SHA: 8642541b255bfb5dc39cd351a178be09013a55d6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Check resource budget
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AUDIT_AI_MAX_CHUNKS" =~ ^[0-9]+$ ]]
          test "$AUDIT_AI_MAX_CHUNKS" -ge 1
          test "$AUDIT_AI_MAX_CHUNKS" -le 32
          case "$AUDIT_AI_MODE" in
            public)
              test -n "$AUDIT_AI_SOURCE_PATH"
              test "$AUDIT_AI_SUBMISSION_MODE" = draft
              ;;
            autonomous_start)
              [[ "$AUDIT_AI_SOURCE_URL" =~ ^https:// ]]
              [[ "$AUDIT_AI_HOP" =~ ^[0-9]+$ ]]
              test "$AUDIT_AI_HOP" -eq 0
              ;;
            autonomous)
              test -n "$AUDIT_AI_CAMPAIGN_ID"
              [[ "$AUDIT_AI_EXPECTED_PHASE" =~ ^[0-9]+$ ]]
              [[ "$AUDIT_AI_EXPECTED_STEP" =~ ^[0-9]+$ ]]
              [[ "$AUDIT_AI_HOP" =~ ^[0-9]+$ ]]
              test "$AUDIT_AI_HOP" -le 120
              test "$AUDIT_AI_SUBMISSION_MODE" = submit
              ;;
            campaign)
              test "$AUDIT_AI_STEP_AUTHORIZED" = true
              test -n "$AUDIT_AI_CAMPAIGN_ID"
              [[ "$AUDIT_AI_EXPECTED_PHASE" =~ ^[0-9]+$ ]]
              [[ "$AUDIT_AI_EXPECTED_STEP" =~ ^[0-9]+$ ]]
              ;;
            *) exit 1;;
          esac
          df -h "$RUNNER_TEMP"
          free -h
      - name: Launch standalone AI-v6 beta using signed job identity
        if: inputs.mode == 'autonomous_start'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          const sourceUrl=process.env.AUDIT_AI_SOURCE_URL;
          if(!/^https:\/\//.test(sourceUrl))throw Error('Source ZIP HTTPS URL required');
          const endpoint=process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const grant=process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if(!endpoint||!grant)throw Error('GitHub OIDC identity unavailable');
          const tokenResponse=await fetch(endpoint+(endpoint.includes('?')?'&':'?')+'audience='+encodeURIComponent('urn:curveyield:lite-solo:github-actions-ai:v1'),
            {headers:{authorization:'bearer '+grant},signal:AbortSignal.timeout(20000)});
          if(!tokenResponse.ok)throw Error('OIDC issuance failed');
          const credential=(await tokenResponse.json()).value;
          const body={requestId:'ai-'+process.env.GITHUB_RUN_ID,sourceUrl,aiAutonomous:true};
          const response=await fetch('https://lite-solo-api.jamesnexus9999.workers.dev/api/campaign/start',{
            method:'POST',headers:{authorization:'Bearer '+credential,'content-type':'application/json'},
            body:JSON.stringify(body),signal:AbortSignal.timeout(90000)});
          const payload=await response.json();
          if(!response.ok)throw Error('AI beta campaign admission rejected HTTP '+response.status);
          const result={status:payload.status,requestId:payload.requestId,controllerAccepted:false};
          console.log(JSON.stringify(result));
          NODE
      - name: Resolve existing authorized private controller credential
        if: inputs.mode == 'campaign' || inputs.mode == 'autonomous'
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Build pinned CPU llama.cpp
        if: inputs.mode != 'autonomous_start'
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" fetch --quiet --depth=1 origin "$LLAMA_SHA"
          git -C "$RUNNER_TEMP/llama.cpp" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/llama.cpp" rev-parse HEAD)" = "$LLAMA_SHA"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama-build" -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          cmake --build "$RUNNER_TEMP/llama-build" --target llama-server -j 4
      - name: Fetch and verify pinned MiMo weights
        if: inputs.mode != 'autonomous_start'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/models"
          curl -fL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/models/$MODEL_FILE" \
            "https://huggingface.co/bartowski/MiMo-V2.6-Distill-Qwen-9B-GGUF/resolve/$MODEL_REVISION/$MODEL_FILE"
          printf '%s  %s\n' "$MODEL_SHA256" "$RUNNER_TEMP/models/$MODEL_FILE" | sha256sum --check
          df -h "$RUNNER_TEMP"
      - name: Run model inference in authorized mode
        if: inputs.mode != 'autonomous_start'
        shell: bash
        env:
          GITHUB_ACTIONS_DISPATCH_TOKEN: ${{ github.token }}
          AUDIT_AI_OUTPUT: ${{ runner.temp }}/lite-solo-ai/analysis.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$AUDIT_AI_OUTPUT")"
          "$RUNNER_TEMP/llama-build/bin/llama-server" --model "$RUNNER_TEMP/models/$MODEL_FILE" \
            --alias lite-solo-mimo-v1 --host 127.0.0.1 --port 8080 \
            --ctx-size 8192 --threads 4 --parallel 1 --n-gpu-layers 0 \
            > "$RUNNER_TEMP/mimo-server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health | jq -e '.status == "ok"' >/dev/null 2>&1; then ready=true; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then
              tail -n 30 "$RUNNER_TEMP/mimo-server.log"; exit 1
            fi
            sleep 2
          done
          test "$ready" = true || { echo "Model load timeout"; exit 1; }
          if [ "$AUDIT_AI_MODE" = campaign ] || [ "$AUDIT_AI_MODE" = autonomous ]; then
            export AUDIT_CONTROLLER_GITHUB_TOKEN="${AUDIT_CONTROLLER_GITHUB_TOKEN:-}"
            test -n "$AUDIT_CONTROLLER_GITHUB_TOKEN"
          fi
          node scripts/lite-solo-ai/review-v1.mjs
      - name: Retain public-source draft artifact
        if: always() && inputs.mode == 'public'
        uses: actions/upload-artifact@v4
        with:
          name: lite-solo-ai-draft-${{ github.run_id }}
          path: ${{ runner.temp }}/lite-solo-ai/analysis.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Summarize disposition without private evidence
        if: always()
        shell: bash
        run: |
          file="$RUNNER_TEMP/lite-solo-ai/analysis.json"
          if [ "$AUDIT_AI_MODE" = campaign ] || [ "$AUDIT_AI_MODE" = autonomous ]; then
            echo 'Private campaign mode: inspect the Worker for actual persisted acceptance. This job cannot seal a step.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$AUDIT_AI_MODE" = autonomous_start ]; then
            echo 'AI autonomous campaign initialization submitted; controller Phase0 acceptance and later execution must be checked separately.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'Public read-only AI draft; NOT a controller submission or completed audit.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$file" ]; then
            jq -r '"Status: \(.status); reviewed \(.reviewed|length)/\(.totalChunks) chunks"' "$file" >> "$GITHUB_STEP_SUMMARY"
          fi
# v1 launch marker: cyvbUSDCv28 source ZIP; uses existing dispatch-once job
