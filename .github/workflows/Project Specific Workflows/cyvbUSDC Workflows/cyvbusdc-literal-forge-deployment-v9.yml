name: cyvbUSDC Literal Forge Deployment Simulation v9

on:
  push:
    paths:
      - 'packages/github-native-sim/audit-harnesses/cyvbusdc-deployment-simulation-v1/requests/request-v9.json'
      - '.github/workflows/cyvbusdc-literal-forge-deployment-v9.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  literal-forge-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Contract-Automation
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact Smart-Contracts candidate
        uses: actions/checkout@v4
        with:
          repository: curveyield3/Smart-Contracts
          ref: fd0a01ab0e4a066a4e4ef8d28a6987a194ab5f45
          path: .smart-contracts
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Contract-Automation simulation dependencies
        run: npm ci --force

      - name: Install Foundry nightly
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install forge-std in Smart-Contracts runner checkout
        working-directory: .smart-contracts
        run: forge install foundry-rs/forge-std --no-git

      - name: Run literal DeployCyvbUSDC_v3 Forge script on Katana Anvil fork
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cyvbusdc-literal-forge-output-v9
          node packages/github-native-sim/audit-harnesses/cyvbusdc-deployment-simulation-v1/run-v2.mjs \
            --smart-contracts-root .smart-contracts \
            --fork-url https://katana.drpc.org/ \
            --output cyvbusdc-literal-forge-output-v9

      - name: Show literal Forge simulation summary
        if: always()
        shell: bash
        run: |
          summary=cyvbusdc-literal-forge-output-v9/CYVBUSDC_DEPLOYMENT_SIMULATION_SUMMARY_v1.json
          if [ -f "$summary" ]; then
            cat "$summary"
          else
            echo "::error::Simulation summary missing"
          fi

      - name: Upload literal Forge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyvbusdc-literal-forge-v9-${{ github.run_id }}
          path: cyvbusdc-literal-forge-output-v9
          if-no-files-found: warn
          retention-days: 14
