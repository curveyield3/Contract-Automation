name: cyvlSDT v30 Full Two-Pass Live Fork v5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cyvlsdt-v30-full-two-pass-live-fork-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-two-pass-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOYMENT_TAG: v30-remediation-v5-full-two-pass-livefork
      LOCAL_RPC: http://127.0.0.1:8545
      FORK_RPC: ${{ secrets.RPC_ETHEREUM }}
      FORK_BLOCK: '25835948'
      EXPECTED_BLOCK_HASH: '0x0b184e111de903ae1bf4618377a20763cabb3db48a3652bdda4f622a47eb46b8'
      CYGOV: '0x83E70Fa4AAF0aaf7f5F13C2C8261F1fB444af22b'
      CYGOV_OWNER_EXPECTED: '0x11b78837cadC8E894F1c6e13fA9f3A085a75FA35'
      FRAXSWAP_V2_FACTORY: '0x43eC799eAdd63848443E2347C49f5f52e8Fe0F6f'
      WETH: '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2'

    steps:
      - name: Checkout trusted runner
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Select working private controller credential
        env:
          AUDIT_CONTROLLER_PROBE_REPOSITORY: CurveYield2/Audit-Controller
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Checkout exact frozen v30 source
        uses: actions/checkout@v4
        with:
          repository: CurveYield2/Audit-Controller
          ref: 6bde63416a4611e127b8bb3a5958e6b6d874c188
          token: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller-source
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact remediation fixture
        uses: actions/checkout@v4
        with:
          repository: CurveYield2/Audit-Controller
          ref: 37319eab51d1ac1fc6a58916683114716157b922
          token: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller-fixture
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Reconstruct exact package and apply complete verifier ABI repair
        shell: bash
        run: |
          set -euo pipefail
          ZIP='.controller-source/campaigns/CurveYield-cyvlSDT-Deployment-Package-v30.zip'
          test "$(sha256sum "$ZIP"|awk '{print $1}')" = 'cc5c4dc6f8aa5d2e48043f6c3a837317ce6a4590c291e7e0571e4206c7d9877a'
          rm -rf .cyvlsdt-v30 && mkdir .cyvlsdt-v30
          unzip -q "$ZIP" -d .cyvlsdt-v30
          ROOT="$(find .cyvlsdt-v30 -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$ROOT"
          echo "ROOT=$(realpath "$ROOT")" >> "$GITHUB_ENV"
          (cd "$ROOT" && sha256sum -c Source-Manifest-v30.sha256) > cyvlsdt-v30-v5-source-manifest.txt

          base64 -d .controller-fixture/campaigns/cyvlsdt-v30-remediation-v2-livefork/runtime-remediation.patch.gz.b64 | gzip -dc > /tmp/runtime.patch
          test "$(sha256sum /tmp/runtime.patch|awk '{print $1}')" = 'fdd73714fad9076789c09368f6423c381165c17121e559e517701d9c141d2ae2'
          (cd "$ROOT" && patch -p1 --batch < /tmp/runtime.patch)
          base64 -d .controller-fixture/campaigns/cyvlsdt-v30-remediation-v2-livefork/anvil-impersonation.patch.gz.b64 | gzip -dc > /tmp/anvil.patch
          test "$(sha256sum /tmp/anvil.patch|awk '{print $1}')" = '4454e02b672b1d7e30abab3b4b1c199284bce04c2c150147c27f82838fb936ac'
          (cd "$ROOT" && patch -p1 --batch < /tmp/anvil.patch)
          base64 -d .controller-fixture/campaigns/cyvlsdt-v30-remediation-v2-livefork/vyper-0310-build.patch.gz.b64 | gzip -dc > /tmp/vyper.patch
          test "$(sha256sum /tmp/vyper.patch|awk '{print $1}')" = 'c5af9e97f34b03338e02210f0888c7339aec4c6d9cbc3d5f0bf08468555899eb'
          (cd "$ROOT" && patch -p1 --batch < /tmp/vyper.patch)

          TOKEN="$ROOT/contracts/CurveYieldGovernanceToken.sol"
          grep -q 'Governance delay is provided by the DAO' "$TOKEN"
          if grep -q 'MINTER_ALLOCATION_DELAY' "$TOKEN"; then
            echo 'Unexpected MINTER_ALLOCATION_DELAY remains in v30 token source'
            exit 1
          fi

          VERIFIER="$ROOT/deployment-v20/verify-deployment-v20.js"
          test "$(sha256sum "$VERIFIER"|awk '{print $1}')" = 'f1b30f8b22c6a446aa5633bdb5c066c538fd786ea3c7d05908db561bcfd158ca'
          python - "$VERIFIER" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          old='''  if ((await governanceStaking.BASE_PRODUCTION_BPS()) !== 3000n) throw new Error("governance staking baseline is not 30%");\n  if ((await governanceStaking.MAX_MOD_BOOST()) !== 5000n) throw new Error("governance staking Mod cap mismatch");\n  if ((await governanceStaking.MAX_ADMIN_BOOST()) !== 15000n) throw new Error("governance staking Admin cap mismatch");\n  if ((await governanceStaking.MAX_DAO_BOOST()) !== 10000n) throw new Error("governance staking DAO cap mismatch");\n  if ((await governanceStaking.MAX_TOTAL_BOOST()) !== 30000n) throw new Error("governance staking aggregate boost cap mismatch");\n'''
          new='''  // Vyper constant values are compile-time constants and are not ABI getters.\n  // Exact boost-cap constants remain enforced by governance-staking-static-v2.py.\n  if ((await governanceStaking.workingPercentBps(ethers.ZeroAddress)) !== 3000n) {\n    throw new Error("governance staking baseline is not 30%");\n  }\n'''
          assert old in s, 'stale Vyper constant getter block missing'
          s=s.replace(old,new,1)
          old2='''  if ((await governanceToken.MINTER_ALLOCATION_DELAY()) !== 14n * 24n * 60n * 60n) {\n    throw new Error("minter allocation delay mismatch");\n  }\n'''
          new2='''  // v30 minter allocation changes are immediate at the token layer; governance delay is provided by the DAO.\n'''
          assert old2 in s, 'stale minter allocation delay verifier block missing'
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          test "$(sha256sum "$VERIFIER"|awk '{print $1}')" = '890103530e9452a6557edd7ac342f1e7f3438a3fed262aafb8512fcb260c9d6d'
          node --check "$VERIFIER"
          python "$ROOT/verification-v24/governance-staking-static-v2.py" | tee cyvlsdt-v30-v5-governance-staking-static.txt

          python - "$ROOT/operator-inputs-v27-v1.json" <<'PY'
          import json,sys
          p=sys.argv[1]; x=json.load(open(p))
          assert x['existingContracts']['governanceToken'].lower()=='0x83e70fa4aaf0aaf7f5f13c2c8261f1fb444af22b'
          x['cyGovYieldStaking']['initialTargetYield']='1'; x['cyGovYieldStaking']['initialMaxMintRate']='1'
          x['boostStaking']['governanceEmissionRatePerSecond']='1'
          x['governanceStakingRewardSource']['periodicAmount']='1'; x['governanceStakingRewardSource']['periodicIntervalSeconds']='1'
          json.dump(x,open(p,'w'),indent=2); open(p,'a').write('\n')
          PY

          cd "$ROOT"
          node deployment-v27/production-config-v27-v1.js config-mainnet-v27-audited-base.json operator-inputs-v27-v1.json config-production-v30.json | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-v5-materialize-core.txt"
          npm ci --ignore-scripts

          cat > contracts/SimulationRevenueChildGauge.sol <<'SOL'
          // SPDX-License-Identifier: UNLICENSED
          pragma solidity 0.8.28;
          import {IERC20} from "@openzeppelin/contracts/token/ERC20/IERC20.sol";
          import {SafeERC20} from "@openzeppelin/contracts/token/ERC20/utils/SafeERC20.sol";
          contract SimulationRevenueChildGauge {
              using SafeERC20 for IERC20;
              struct Reward { address distributor; uint256 period_finish; uint256 rate; uint256 last_update; uint256 integral; }
              address public immutable lp_token;
              mapping(address => Reward) public reward_data;
              constructor(address lp, address rewardToken, address distributor) { lp_token=lp; reward_data[rewardToken].distributor=distributor; }
              function deposit_reward_token(address rewardToken, uint256 amount, uint256 epoch) external {
                  Reward storage r=reward_data[rewardToken]; require(msg.sender==r.distributor,"not distributor");
                  IERC20(rewardToken).safeTransferFrom(msg.sender,address(this),amount);
                  r.last_update=block.timestamp; r.period_finish=block.timestamp+epoch; r.rate=epoch==0?0:amount/epoch;
              }
          }
          SOL
          npx hardhat compile 2>&1 | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-v5-solidity-compile.txt"
          test -f artifacts-v20/contracts/SimulationRevenueChildGauge.sol/SimulationRevenueChildGauge.json
          rm contracts/SimulationRevenueChildGauge.sol
          python -m pip install --disable-pip-version-check --no-input --force-reinstall 'vyper==0.3.10'
          npm run --silent build:governance-staking:v30 2>&1 | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-v5-vyper-compile.txt"

      - name: Start exact pinned Flashbots Anvil fork
        shell: bash
        run: |
          set -euo pipefail
          test "$(cast chain-id --rpc-url "$FORK_RPC")" = '1'
          anvil --fork-url "$FORK_RPC" --fork-block-number "$FORK_BLOCK" --chain-id 1 --hardfork cancun --block-time 1 --port 8545 > cyvlsdt-v30-v5-anvil.log 2>&1 &
          echo $! > .anvil-v5.pid
          for i in $(seq 1 60); do cast chain-id --rpc-url "$LOCAL_RPC" >/dev/null 2>&1 && break; sleep 1; done
          test "$(cast chain-id --rpc-url "$LOCAL_RPC")" = '1'
          HASH="$(cast block "$FORK_BLOCK" --field hash --rpc-url "$LOCAL_RPC"|tr -d '\r\n')"
          test "${HASH,,}" = "${EXPECTED_BLOCK_HASH,,}"
          OWNER="$(cast call "$CYGOV" 'owner()(address)' --rpc-url "$LOCAL_RPC"|tr -d '\r\n')"
          test "${OWNER,,}" = "${CYGOV_OWNER_EXPECTED,,}"
          test "$(cast call "$CYGOV" 'totalInitialMinterCaps()(uint256)' --rpc-url "$LOCAL_RPC"|awk '{print $1}')" = '0'
          test "$(cast call "$CYGOV" 'totalAdditionalMinterBps()(uint256)' --rpc-url "$LOCAL_RPC"|awk '{print $1}')" = '0'
          echo "CYGOV_OWNER=$OWNER" >> "$GITHUB_ENV"
          printf 'fork_block=%s\nfork_hash=%s\nowner=%s\n' "$FORK_BLOCK" "$HASH" "$OWNER" | tee cyvlsdt-v30-v5-fork-identity.txt

      - name: Literal core deploy and configure first pass
        env:
          RPC_URL: ${{ env.LOCAL_RPC }}
          IMPERSONATE_DEPLOYER_ADDRESS: ${{ env.CYGOV_OWNER }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          npm run --silent deploy:v30 2>&1 | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-v5-deploy-pass1.txt"
          npm run --silent configure:v30 2>&1 | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-v5-configure-pass1.txt"
          STATE="deployment-output-v20/deployment-state-v20-${DEPLOYMENT_TAG}-1.json"
          test "$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["phase"])' "$STATE")" = 'configured-converter-pending'

      - name: Provision and bind simulation-only Revenue ChildGauge dependency
        env:
          RPC_URL: ${{ env.LOCAL_RPC }}
          IMPERSONATE_DEPLOYER_ADDRESS: ${{ env.CYGOV_OWNER }}
        shell: bash
        run: |
          set -euo pipefail
          STATE="$ROOT/deployment-output-v20/deployment-state-v20-${DEPLOYMENT_TAG}-1.json"
          VAULT="$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["contracts"]["revenueVault"]["address"])' "$STATE")"
          STRATEGY="$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["contracts"]["revenueStrategy"]["address"])' "$STATE")"
          cast rpc anvil_impersonateAccount "$CYGOV_OWNER" --rpc-url "$LOCAL_RPC" >/dev/null
          cast rpc anvil_setBalance "$CYGOV_OWNER" 0x56BC75E2D63100000 --rpc-url "$LOCAL_RPC" >/dev/null
          cd "$ROOT"
          node - "$LOCAL_RPC" "$CYGOV_OWNER" "$VAULT" "$CYGOV" "$STRATEGY" <<'JS' | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-v5-child-gauge-deploy.txt"
          const { ethers }=require('ethers'); const [rpc,owner,vault,token,strategy]=process.argv.slice(2);
          (async()=>{const p=new ethers.JsonRpcProvider(rpc); const s=await p.getSigner(owner); const a=require('./artifacts-v20/contracts/SimulationRevenueChildGauge.sol/SimulationRevenueChildGauge.json'); const f=new ethers.ContractFactory(a.abi,a.bytecode,s); const g=await f.deploy(vault,token,strategy); await g.waitForDeployment(); const x=await g.getAddress(); console.log(x); require('fs').writeFileSync('/tmp/revenue-child-gauge',x);})().catch(e=>{console.error(e);process.exit(1)});
          JS
          GAUGE="$(cat /tmp/revenue-child-gauge)"
          test "$(cast call "$GAUGE" 'lp_token()(address)' --rpc-url "$LOCAL_RPC"|tr -d '\r\n'|tr '[:upper:]' '[:lower:]')" = "$(echo "$VAULT"|tr '[:upper:]' '[:lower:]')"
          DIST="$(cast call "$GAUGE" 'reward_data(address)(address,uint256,uint256,uint256,uint256)' "$CYGOV" --rpc-url "$LOCAL_RPC"|head -1|tr -d '\r\n')"
          test "${DIST,,}" = "${STRATEGY,,}"
          REVENUE_CYGOV_CHILD_GAUGE="$GAUGE" npm run --silent configure:revenue-cygov-gauge:v30 2>&1 | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-v5-child-gauge-configure.txt"
          BOUND="$(cast call "$STRATEGY" 'cyGovChildGauge()(address)' --rpc-url "$LOCAL_RPC"|tr -d '\r\n')"
          test "${BOUND,,}" = "${GAUGE,,}"
          echo "REVENUE_CYGOV_CHILD_GAUGE=$GAUGE" >> "$GITHUB_ENV"
          printf 'scope=SIMULATION_ONLY_EXTERNAL_DEPENDENCY\ngauge=%s\nvault=%s\nstrategy=%s\n' "$GAUGE" "$VAULT" "$STRATEGY" | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-v5-child-gauge-identity.txt"

      - name: Create real Fraxswap V2 pair and materialize converter
        shell: bash
        run: |
          set -euo pipefail
          cast rpc anvil_impersonateAccount "$CYGOV_OWNER" --rpc-url "$LOCAL_RPC" >/dev/null
          PAIR="$(cast call "$FRAXSWAP_V2_FACTORY" 'getPair(address,address)(address)' "$CYGOV" "$WETH" --rpc-url "$LOCAL_RPC"|tr -d '\r\n')"
          if [ "${PAIR,,}" = '0x0000000000000000000000000000000000000000' ]; then
            cast send --unlocked --from "$CYGOV_OWNER" "$FRAXSWAP_V2_FACTORY" 'createPair(address,address)' "$CYGOV" "$WETH" --rpc-url "$LOCAL_RPC" >/dev/null
            PAIR="$(cast call "$FRAXSWAP_V2_FACTORY" 'getPair(address,address)(address)' "$CYGOV" "$WETH" --rpc-url "$LOCAL_RPC"|tr -d '\r\n')"
          fi
          test "${PAIR,,}" != '0x0000000000000000000000000000000000000000'
          echo "PRIMARY_FRAXSWAP_PAIR=$PAIR" >> "$GITHUB_ENV"
          python - "$ROOT/operator-inputs-cygov-converter-v27-v1.json" "$PAIR" <<'PY'
          import json,sys
          p,pair=sys.argv[1:]; x=json.load(open(p)); x['feeReceiver']=None; x['primaryPool']=pair; x['primaryFees']={'buyFeeBps':0,'sellFeeBps':0,'discountedSellFeeBps':0}; x['globalFees']=None; x['secondaryPools']=[]; x['feeExempt']=[]; json.dump(x,open(p,'w'),indent=2); open(p,'a').write('\n')
          PY
          cd "$ROOT"
          npm run --silent config:materialize:cygov-converter:v30 2>&1 | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-v5-materialize-converter.txt"
          printf 'scope=SIMULATION_ONLY_NOT_PRODUCTION\npair=%s\n' "$PAIR" | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-v5-fraxswap-pair.txt"

      - name: Literal second deploy and configure pass
        env:
          RPC_URL: ${{ env.LOCAL_RPC }}
          IMPERSONATE_DEPLOYER_ADDRESS: ${{ env.CYGOV_OWNER }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          npm run --silent deploy:v30 2>&1 | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-v5-deploy-pass2.txt"
          npm run --silent configure:v30 2>&1 | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-v5-configure-pass2.txt"

      - name: Run repaired exact v30 final verifier
        env:
          RPC_URL: ${{ env.LOCAL_RPC }}
          IMPERSONATE_DEPLOYER_ADDRESS: ${{ env.CYGOV_OWNER }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          npm run --silent verify:v30 2>&1 | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-v5-verify-final.txt"

      - name: Assert final state
        shell: bash
        run: |
          set -euo pipefail
          STATE="$ROOT/deployment-output-v20/deployment-state-v20-${DEPLOYMENT_TAG}-1.json"
          python - "$STATE" "$REVENUE_CYGOV_CHILD_GAUGE" "$PRIMARY_FRAXSWAP_PAIR" <<'PY' | tee cyvlsdt-v30-v5-final-summary.json
          import json,sys
          s=json.load(open(sys.argv[1])); gauge=sys.argv[2].lower(); pair=sys.argv[3].lower(); c=s['contracts']; status=s['productionConfigurationStatus']
          assert status['fullyActive'] is True and status['coreActive'] is True
          assert status['cyGovFraxswapConverter']['active'] is True
          assert status['cyGovFraxswapConverter']['primaryPool'].lower()==pair
          assert s.get('productionVerification')
          print(json.dumps({'status':'FULL_VERIFY_PASS','phase':s.get('phase'),'childGauge':gauge,'converter':c['cyGovFraxswapConverter']['address'],'primaryPair':pair,'transactions':len(s.get('transactions',[])),'gasUsed':s.get('gasUsed'),'productionVerification':s.get('productionVerification')},indent=2))
          PY
          test "$(cast call "$CYGOV" 'totalInitialMinterCaps()(uint256)' --rpc-url "$LOCAL_RPC"|awk '{print $1}')" = '50000000000000000000000000000'
          test "$(cast call "$CYGOV" 'totalAdditionalMinterBps()(uint256)' --rpc-url "$LOCAL_RPC"|awk '{print $1}')" = '8000'

      - name: Upload v5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyvlsdt-v30-full-two-pass-live-fork-v5
          path: |
            cyvlsdt-v30-v5-*.txt
            cyvlsdt-v30-v5-*.json
            .cyvlsdt-v30/**/config-production-v30.json
            .cyvlsdt-v30/**/deployment-output-v20/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Stop Anvil
        if: always()
        shell: bash
        run: |
          if [ -f .anvil-v5.pid ]; then kill "$(cat .anvil-v5.pid)" 2>/dev/null || true; fi
