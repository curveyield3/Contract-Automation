name: cyvlSDT v30 Remediation Live Fork v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cyvlsdt-v30-remediation-live-fork-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cyvlsdt-v30-live-fork:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout trusted Contract-Automation runner
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Select working private controller credential
        env:
          AUDIT_CONTROLLER_PROBE_REPOSITORY: CurveYield2/Audit-Controller
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Checkout exact frozen v30 source
        uses: actions/checkout@v4
        with:
          repository: CurveYield2/Audit-Controller
          ref: 6bde63416a4611e127b8bb3a5958e6b6d874c188
          token: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller-source
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact remediation fixture
        uses: actions/checkout@v4
        with:
          repository: CurveYield2/Audit-Controller
          ref: 37319eab51d1ac1fc6a58916683114716157b922
          token: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller-fixture
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Reconstruct exact v30 and apply remediation v2 runtime patch
        shell: bash
        run: |
          set -euo pipefail
          ZIP='.controller-source/campaigns/CurveYield-cyvlSDT-Deployment-Package-v30.zip'
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = 'cc5c4dc6f8aa5d2e48043f6c3a837317ce6a4590c291e7e0571e4206c7d9877a'
          rm -rf .cyvlsdt-v30 && mkdir -p .cyvlsdt-v30
          unzip -q "$ZIP" -d .cyvlsdt-v30
          ROOT="$(find .cyvlsdt-v30 -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$ROOT"
          cd "$ROOT"
          sha256sum -c Source-Manifest-v30.sha256 > "$GITHUB_WORKSPACE/cyvlsdt-v30-source-manifest-v1.txt"
          cd "$GITHUB_WORKSPACE"
          base64 -d .controller-fixture/campaigns/cyvlsdt-v30-remediation-v2-livefork/runtime-remediation.patch.gz.b64 | gzip -dc > remediation-v2-runtime.patch
          test "$(sha256sum remediation-v2-runtime.patch | awk '{print $1}')" = 'fdd73714fad9076789c09368f6423c381165c17121e559e517701d9c141d2ae2'
          (cd "$ROOT" && patch -p1 --batch < "$GITHUB_WORKSPACE/remediation-v2-runtime.patch")
          test "$(sha256sum "$ROOT/deployment-v20/deploy-configure-v20.js" | awk '{print $1}')" = 'e770457d7b04d9fcc22661c8f7b51303fd27f9faa9459910658c4f0aa11992b3'
          test "$(sha256sum "$ROOT/deployment-v20/lib-v20.js" | awk '{print $1}')" = 'c5cc175af27c25e96db67cb23b3c4aa7c74040d8e35872b79672e2854eb2e177'
          test "$(sha256sum "$ROOT/deployment-v27/deploy-cyvlsdt-v27-v1.js" | awk '{print $1}')" = '47532b64c08ad9e69ed45243082db1651cf1199791b5a09af8dd92cfd0f34763'
          test "$(sha256sum "$ROOT/deployment-v27/post-deploy-configure-cyvlsdt-v27-v1.js" | awk '{print $1}')" = 'be508d75c64ee4fe2b785091443e9e6f88a3e6f21ad14403b3a619975285e8d0'
          test "$(sha256sum "$ROOT/deployment-v27/production-config-v27-v1.js" | awk '{print $1}')" = 'e8997008636aadec4c345dcae932c3813147e1b0ffac778f04f44c23c70cd45e'
          test "$(sha256sum "$ROOT/deployment-v27/verify-production-cyvlsdt-v27-v1.js" | awk '{print $1}')" = '4d3c41d9d9e27522048865c378c5dbdf0d68be3c538f596e3e9881eb511e99f0'
          test "$(sha256sum "$ROOT/operator-inputs-v27-v1.json" | awk '{print $1}')" = '460a9d6ea82322cb54abe5e422444d980ed0bee64ec19ea1192b1e04a8b0a33e'
          printf 'frozen_archive_sha256=%s\nfrozen_source_commit=%s\nremediation_fixture_commit=%s\nruntime_patch_sha256=%s\n' \
            'cc5c4dc6f8aa5d2e48043f6c3a837317ce6a4590c291e7e0571e4206c7d9877a' \
            '6bde63416a4611e127b8bb3a5958e6b6d874c188' \
            '37319eab51d1ac1fc6a58916683114716157b922' \
            'fdd73714fad9076789c09368f6423c381165c17121e559e517701d9c141d2ae2' | tee cyvlsdt-v30-source-binding-v1.txt
          echo "ROOT=$(realpath "$ROOT")" >> "$GITHUB_ENV"

      - name: Apply fork-only Anvil impersonation signer bridge
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .controller-fixture/campaigns/cyvlsdt-v30-remediation-v2-livefork/anvil-impersonation.patch.gz.b64 | gzip -dc > anvil-impersonation.patch
          test "$(sha256sum anvil-impersonation.patch | awk '{print $1}')" = '4454e02b672b1d7e30abab3b4b1c199284bce04c2c150147c27f82838fb936ac'
          (cd "$ROOT" && patch -p1 --batch < "$GITHUB_WORKSPACE/anvil-impersonation.patch")
          test "$(sha256sum "$ROOT/deployment-v20/lib-v20.js" | awk '{print $1}')" = 'dcb9789aac337f5e6c2559d263dcbf73f631d4616a71fb34c1324c492b422f09'
          node --check "$ROOT/deployment-v20/lib-v20.js"
          node --check "$ROOT/deployment-v20/deploy-configure-v20.js"
          node --check "$ROOT/deployment-v27/deploy-cyvlsdt-v27-v1.js"
          node --check "$ROOT/deployment-v27/post-deploy-configure-cyvlsdt-v27-v1.js"
          node --check "$ROOT/deployment-v27/verify-production-cyvlsdt-v27-v1.js"

      - name: Apply Vyper 0.3.10 build-helper compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .controller-fixture/campaigns/cyvlsdt-v30-remediation-v2-livefork/vyper-0310-build.patch.gz.b64 | gzip -dc > vyper-0310-build.patch
          test "$(sha256sum vyper-0310-build.patch | awk '{print $1}')" = 'c5af9e97f34b03338e02210f0888c7339aec4c6d9cbc3d5f0bf08468555899eb'
          (cd "$ROOT" && patch -p1 --batch < "$GITHUB_WORKSPACE/vyper-0310-build.patch")
          test "$(sha256sum "$ROOT/scripts-v24/build-governance-staking-vyper-artifact-v2.py" | awk '{print $1}')" = '81aa1454a5df08c83c8700f4c50a1edbd2e122f7a09428028893f01f39c01336'

      - name: Materialize simulation-only economic inputs
        shell: bash
        run: |
          set -euo pipefail
          python - "$ROOT/operator-inputs-v27-v1.json" <<'PY'
          import json,sys
          p=sys.argv[1]
          x=json.load(open(p))
          assert x['existingContracts']['governanceToken'].lower() == '0x83e70fa4aaf0aaf7f5f13c2c8261f1fb444af22b'
          x['cyGovYieldStaking']['initialTargetYield']='1'
          x['cyGovYieldStaking']['initialMaxMintRate']='1'
          x['boostStaking']['governanceEmissionRatePerSecond']='1'
          x['governanceStakingRewardSource']['periodicAmount']='1'
          x['governanceStakingRewardSource']['periodicIntervalSeconds']='1'
          json.dump(x,open(p,'w'),indent=2);open(p,'a').write('\n')
          PY
          cd "$ROOT"
          node deployment-v27/production-config-v27-v1.js config-mainnet-v27-audited-base.json operator-inputs-v27-v1.json config-production-v30.json | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-materialize-v1.txt"
          python - <<'PY' | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-simulation-inputs-v1.json"
          import json
          x=json.load(open('config-production-v30.json'))
          out={
            'scope':'SIMULATION_ONLY_NOT_PRODUCTION',
            'existingCyGov':x['existingContracts']['governanceToken'],
            'initialTargetYield':x['cyGovYieldStaking']['initialTargetYield'],
            'initialMaxMintRate':x['cyGovYieldStaking']['initialMaxMintRate'],
            'boostGovernancePerSecond':x['emissions']['boostStakingGovernancePerSecond'],
            'governanceStakingPeriodic':x['governanceMinting']['governanceStaking'],
            'cyGovFraxswapConverterConfigured':bool(x.get('cyGovFraxswapConverter')),
          }
          print(json.dumps(out,indent=2))
          PY

      - name: Install exact package dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          npm ci --ignore-scripts

      - name: Compile Solidity deployment artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          npx hardhat compile 2>&1 | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-solidity-compile-v1.txt"

      - name: Compile Governance Staking with Vyper 0.3.10
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input --force-reinstall 'vyper==0.3.10'
          cd "$ROOT"
          npm run --silent build:governance-staking:v30 2>&1 | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-vyper-compile-v1.txt"
          test -f artifacts-vyper/CurveYieldGovernanceStaking.json

      - name: Start pinned Ethereum mainnet Anvil fork
        env:
          FORK_RPC: ${{ secrets.RPC_ETHEREUM }}
          EXPECTED_BLOCK_HASH: '0x0b184e111de903ae1bf4618377a20763cabb3db48a3652bdda4f622a47eb46b8'
        shell: bash
        run: |
          set -euo pipefail
          test "$(cast chain-id --rpc-url "$FORK_RPC")" = '1'
          test "$(cast code 0x83E70Fa4AAF0aaf7f5F13C2C8261F1fB444af22b --rpc-url "$FORK_RPC" --block 25835948)" != '0x'
          anvil --fork-url "$FORK_RPC" --fork-block-number 25835948 --chain-id 1 --hardfork cancun --block-time 1 --port 8545 > cyvlsdt-v30-anvil-v1.log 2>&1 &
          echo $! > .anvil.pid
          for i in $(seq 1 60); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          test "$(cast chain-id --rpc-url http://127.0.0.1:8545)" = '1'
          BLOCK_HASH="$(cast block 25835948 --field hash --rpc-url http://127.0.0.1:8545 | tr -d '\r\n')"
          test "${BLOCK_HASH,,}" = "${EXPECTED_BLOCK_HASH,,}"
          printf 'fork_block=25835948\nfork_block_hash=%s\nfork_provider=authenticated_RPC_ETHEREUM\n' "$BLOCK_HASH" | tee cyvlsdt-v30-fork-identity-v1.txt

      - name: Prove live cyGOV identity and owner
        shell: bash
        run: |
          set -euo pipefail
          RPC='http://127.0.0.1:8545'
          CYGOV='0x83E70Fa4AAF0aaf7f5F13C2C8261F1fB444af22b'
          OWNER="$(cast call "$CYGOV" 'owner()(address)' --rpc-url "$RPC" | tr -d '\r\n')"
          test "${OWNER,,}" = '0x11b78837cadc8e894f1c6e13fa9f3a085a75fa35'
          test "$(cast call "$CYGOV" 'totalInitialMinterCaps()(uint256)' --rpc-url "$RPC" | awk '{print $1}')" = '0'
          test "$(cast call "$CYGOV" 'totalAdditionalMinterBps()(uint256)' --rpc-url "$RPC" | awk '{print $1}')" = '0'
          CODE="$(cast code "$CYGOV" --rpc-url "$RPC")"
          test "$CODE" != '0x'
          printf 'cygov=%s\nowner=%s\ninitial_minter_caps=0\nadditional_minter_bps=0\n' "$CYGOV" "$OWNER" | tee cyvlsdt-v30-cygov-preflight-v1.txt
          echo "CYGOV_OWNER=$OWNER" >> "$GITHUB_ENV"

      - name: Execute actual v30 deploy script end to end
        env:
          RPC_URL: http://127.0.0.1:8545
          IMPERSONATE_DEPLOYER_ADDRESS: ${{ env.CYGOV_OWNER }}
          DEPLOYMENT_TAG: v30-remediation-v2-livefork-e2e
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          npm run --silent deploy:v30 2>&1 | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-live-fork-deploy-v1.txt"

      - name: Execute actual v30 post-deploy configuration script end to end
        env:
          RPC_URL: http://127.0.0.1:8545
          IMPERSONATE_DEPLOYER_ADDRESS: ${{ env.CYGOV_OWNER }}
          DEPLOYMENT_TAG: v30-remediation-v2-livefork-e2e
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          npm run --silent configure:v30 2>&1 | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-live-fork-configure-v1.txt"

      - name: Execute actual v30 verifier and preserve result
        id: verify
        env:
          RPC_URL: http://127.0.0.1:8545
          IMPERSONATE_DEPLOYER_ADDRESS: ${{ env.CYGOV_OWNER }}
          DEPLOYMENT_TAG: v30-remediation-v2-livefork-e2e
        shell: bash
        run: |
          set +e
          cd "$ROOT"
          npm run --silent verify:v30 2>&1 | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-live-fork-verify-v1.txt"
          RC=${PIPESTATUS[0]}
          set -e
          echo "verify_rc=$RC" >> "$GITHUB_OUTPUT"
          echo "$RC" > "$GITHUB_WORKSPACE/cyvlsdt-v30-verify-exit-code-v1.txt"

      - name: Assert core deployment/configuration state and summarize
        shell: bash
        run: |
          set -euo pipefail
          STATE="$ROOT/deployment-output-v20/deployment-state-v20-v30-remediation-v2-livefork-e2e-1.json"
          test -f "$STATE"
          python - "$STATE" '${{ steps.verify.outputs.verify_rc }}' <<'PY' | tee cyvlsdt-v30-live-fork-summary-v1.json
          import json,sys
          s=json.load(open(sys.argv[1])); verify_rc=int(sys.argv[2])
          c=s.get('contracts',{})
          expected=['governanceToken','governanceStaking','governanceMintController','cyvlSdt','locker','cyGovYieldStaking','revenueStaking','boostStaking','boostMerchant','revenueVault','revenueConverter','usdcToSdtConverter','revenueStrategy']
          missing=[k for k in expected if not c.get(k,{}).get('address')]
          assert not missing, missing
          assert c['governanceToken'].get('predeployed') is True
          assert c['governanceToken']['address'].lower()=='0x83e70fa4aaf0aaf7f5f13c2c8261f1fb444af22b'
          fresh=[k for k in expected if k!='governanceToken']
          assert all(c[k].get('deploymentTx') for k in fresh)
          status=s.get('productionConfigurationStatus') or {}
          out={
            'status':'CORE_DEPLOY_CONFIG_PASS',
            'phase':s.get('phase'),
            'existingCyGovAttached':True,
            'freshCoreDeployments':len(fresh),
            'missingCoreContracts':missing,
            'cyGovFraxswapConverterDeployed':bool(c.get('cyGovFraxswapConverter',{}).get('address')),
            'productionConfigurationStatus':status,
            'transactionCount':len(s.get('transactions',[])),
            'gasUsed':s.get('gasUsed'),
            'verifyExitCode':verify_rc,
          }
          print(json.dumps(out,indent=2))
          PY
          RPC='http://127.0.0.1:8545'
          CYGOV='0x83E70Fa4AAF0aaf7f5F13C2C8261F1fB444af22b'
          CAPS="$(cast call "$CYGOV" 'totalInitialMinterCaps()(uint256)' --rpc-url "$RPC" | awk '{print $1}')"
          BPS="$(cast call "$CYGOV" 'totalAdditionalMinterBps()(uint256)' --rpc-url "$RPC" | awk '{print $1}')"
          test "$CAPS" = '50000000000000000000000000000'
          test "$BPS" = '8000'
          printf 'totalInitialMinterCaps=%s\ntotalAdditionalMinterBps=%s\n' "$CAPS" "$BPS" | tee cyvlsdt-v30-cygov-postconfig-v1.txt

      - name: Upload full cyvlSDT v30 live-fork evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyvlsdt-v30-remediation-v2-live-fork-v1
          path: |
            cyvlsdt-v30-source-manifest-v1.txt
            cyvlsdt-v30-source-binding-v1.txt
            cyvlsdt-v30-materialize-v1.txt
            cyvlsdt-v30-simulation-inputs-v1.json
            cyvlsdt-v30-solidity-compile-v1.txt
            cyvlsdt-v30-vyper-compile-v1.txt
            cyvlsdt-v30-anvil-v1.log
            cyvlsdt-v30-fork-identity-v1.txt
            cyvlsdt-v30-cygov-preflight-v1.txt
            cyvlsdt-v30-live-fork-deploy-v1.txt
            cyvlsdt-v30-live-fork-configure-v1.txt
            cyvlsdt-v30-live-fork-verify-v1.txt
            cyvlsdt-v30-verify-exit-code-v1.txt
            cyvlsdt-v30-live-fork-summary-v1.json
            cyvlsdt-v30-cygov-postconfig-v1.txt
            .cyvlsdt-v30/**/config-production-v30.json
            .cyvlsdt-v30/**/deployment-output-v20/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail if exact production verifier failed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RC="$(cat cyvlsdt-v30-verify-exit-code-v1.txt 2>/dev/null || echo 99)"
          if [ "$RC" != '0' ]; then
            echo "Exact v30 verifier failed with exit code $RC; evidence uploaded."
            exit 1
          fi

      - name: Stop Anvil
        if: always()
        shell: bash
        run: |
          if [ -f .anvil.pid ]; then kill "$(cat .anvil.pid)" 2>/dev/null || true; fi
