name: BoostHubStaking V16 Runtime Compare v3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'github-native-sim/boosthub-staking-v16-runtime-compare-trigger-v3.txt'
      - '.github/workflows/boosthub-staking-v16-runtime-compare-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-v16:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted runner
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact Vyper 0.4.3
        run: python -m pip install --disable-pip-version-check --no-input 'vyper==0.4.3'

      - name: Verify Vyper
        run: |
          set -euo pipefail
          vyper --version | tee boosthub-staking-v16-vyper-version-v3.txt
          vyper --version | grep -F '0.4.3'

      - name: Select working private controller credential
        env:
          AUDIT_CONTROLLER_PROBE_REPOSITORY: curveyield3/Solo-Audit-Controller
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Checkout exact Solo Audit Controller source commit
        uses: actions/checkout@v4
        with:
          repository: curveyield3/Solo-Audit-Controller
          ref: 93062463611e798ab26544a88c4e119f9620be9a
          token: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller
          persist-credentials: false
          fetch-depth: 1

      - name: Compile original and remediated V16 and measure runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          import vyper
          from vyper.compiler import compile_code

          assert vyper.__version__ == '0.4.3', vyper.__version__
          base = Path('.controller/campaigns/Boosthub Staking v2/source')
          archives = {
              'original_v2': base / 'CurveYield-BoostHub-sdCRV-sdFXN-sdYB-Deployment-Package-v2.zip',
              'remediated_v4': base / 'CurveYield-BoostHub-sdCRV-sdFXN-sdYB-Deployment-Package-Remediated-v4.zip',
          }
          rows = {}
          for label, archive in archives.items():
              raw = archive.read_bytes()
              archive_sha = hashlib.sha256(raw).hexdigest()
              with zipfile.ZipFile(archive) as z:
                  names = [n for n in z.namelist() if n.endswith('/contracts/boosthub/vyper/BoostHubStaking-v16.vy')]
                  if len(names) != 1:
                      raise SystemExit(f'{label}: expected exactly one V16 source, found {names}')
                  source_name = names[0]
                  source_bytes = z.read(source_name)
              source_sha = hashlib.sha256(source_bytes).hexdigest()
              source = source_bytes.decode()
              out = compile_code(source, contract_path=source_name, output_formats=['bytecode','bytecode_runtime'])
              creation = out['bytecode']
              runtime = out['bytecode_runtime']
              creation_bytes = (len(creation) - 2) // 2 if creation.startswith('0x') else len(creation)//2
              runtime_bytes = (len(runtime) - 2) // 2 if runtime.startswith('0x') else len(runtime)//2
              rows[label] = {
                  'archive': str(archive),
                  'archive_sha256': archive_sha,
                  'source_name': source_name,
                  'source_sha256': source_sha,
                  'compiler': 'vyper',
                  'compiler_version': vyper.__version__,
                  'creation_bytes': creation_bytes,
                  'runtime_bytes': runtime_bytes,
                  'eip170_limit': 24576,
                  'headroom_bytes': 24576 - runtime_bytes,
              }
          rows['delta_v4_minus_v2_runtime_bytes'] = rows['remediated_v4']['runtime_bytes'] - rows['original_v2']['runtime_bytes']
          Path('boosthub-staking-v16-runtime-compare-v3.json').write_text(json.dumps(rows, indent=2)+'\n')
          Path('boosthub-staking-v16-runtime-compare-v3.txt').write_text(
              f"original_v2_runtime_bytes={rows['original_v2']['runtime_bytes']}\n"
              f"original_v2_headroom_bytes={rows['original_v2']['headroom_bytes']}\n"
              f"remediated_v4_runtime_bytes={rows['remediated_v4']['runtime_bytes']}\n"
              f"remediated_v4_headroom_bytes={rows['remediated_v4']['headroom_bytes']}\n"
              f"delta_v4_minus_v2_runtime_bytes={rows['delta_v4_minus_v2_runtime_bytes']}\n"
          )
          print(Path('boosthub-staking-v16-runtime-compare-v3.txt').read_text())
          PY

      - name: Upload V16 runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-staking-v16-runtime-compare-v3
          path: |
            boosthub-staking-v16-vyper-version-v3.txt
            boosthub-staking-v16-runtime-compare-v3.json
            boosthub-staking-v16-runtime-compare-v3.txt
          if-no-files-found: error
          retention-days: 30
