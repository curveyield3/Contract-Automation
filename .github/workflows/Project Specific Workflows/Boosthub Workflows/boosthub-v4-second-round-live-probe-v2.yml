name: BoostHub v4 Second-Round Live Probe v2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'github-native-sim/boosthub-v4-second-round-live-probe-trigger-v2.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select working private controller credential
        env:
          AUDIT_CONTROLLER_PROBE_REPOSITORY: curveyield3/Solo-Audit-Controller
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Checkout exact v4 source commit
        uses: actions/checkout@v4
        with:
          repository: curveyield3/Solo-Audit-Controller
          ref: 93062463611e798ab26544a88c4e119f9620be9a
          token: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller
          persist-credentials: false
      - name: Extract exact v4 and install ethers
        shell: bash
        run: |
          set -euo pipefail
          ZIP='.controller/campaigns/Boosthub Staking v2/source/CurveYield-BoostHub-sdCRV-sdFXN-sdYB-Deployment-Package-Remediated-v4.zip'
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = '4b502a2040712da8e6f4e80165ed74c8e3f492226e60141bc23ac8585a3855d4'
          rm -rf .v4 && mkdir .v4 && unzip -q "$ZIP" -d .v4
          ROOT="$(find .v4 -mindepth 1 -maxdepth 1 -type d | head -n1)"
          echo "ROOT=$(realpath "$ROOT")" >> "$GITHUB_ENV"
          cd "$ROOT" && npm ci --ignore-scripts
      - name: Run corrected raw pinned eth_call probe
        env:
          RPC_URL: ${{ secrets.ETHEREUM_RPC }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$ROOT/probe-v2.js" <<'NODE'
          const { ethers } = require('ethers');
          const fs = require('fs');
          const path = require('path');
          const BLOCK = 25737717;
          const BLOCK_HEX = ethers.toQuantity(BLOCK);
          const provider = new ethers.JsonRpcProvider(process.env.RPC_URL, 1, { staticNetwork: true });
          const cfg = JSON.parse(fs.readFileSync(path.join(process.env.ROOT, 'config-mainnet-v2.json')));
          const FEE_DEN=10000000000n, BPS=10000n, SLIP=100n;
          const NATIVE='0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE';
          async function raw(to, fragment, args=[]) {
            const iface = new ethers.Interface([`function ${fragment}`]);
            const name = fragment.slice(0, fragment.indexOf('('));
            const data = iface.encodeFunctionData(name,args);
            const ret = await provider.send('eth_call', [{to,data}, BLOCK_HEX]);
            return iface.decodeFunctionResult(name,ret)[0];
          }
          async function decimals(t){ if(t.toLowerCase()===NATIVE.toLowerCase()) return 18; return Number(await raw(t,'decimals() view returns(uint8)')); }
          function to18(x,d){return d===18?x:(d<18?x*10n**BigInt(18-d):x/10n**BigInt(d-18));}
          function from18(x,d){return d===18?x:(d<18?x/10n**BigInt(18-d):x*10n**BigInt(d-18));}
          async function fee(pool){return await raw(pool,'fee() view returns(uint256)');}
          async function oracle(pool,index){
            if(index===0n) return 10n**18n;
            if(index===1n){try{const v=await raw(pool,'price_oracle() view returns(uint256)');if(v>0n)return v;}catch{}}
            return await raw(pool,'price_oracle(uint256) view returns(uint256)',[index-1n]);
          }
          async function oracleHop(pool,cur,next,i,j,amount){
            const ni=to18(amount,await decimals(cur)); const pi=await oracle(pool,BigInt(i)); const po=await oracle(pool,BigInt(j));
            const f=await fee(pool); let out=ni*pi/po; out=out*(FEE_DEN-f)/FEE_DEN;
            return {out:from18(out,await decimals(next)),fee:f,pi,po};
          }
          async function getDy(pool,i,j,amount){
            for(const s of ['get_dy(uint256,uint256,uint256) view returns(uint256)','get_dy(int128,int128,uint256) view returns(uint256)']){try{return await raw(pool,s,[i,j,amount]);}catch{}}
            throw new Error('get_dy unavailable '+pool);
          }
          async function readConverter(addr,fragment,args=[]){return await raw(addr,fragment,args);}
          async function generic(label,addr,amounts,wst=false){
            const route=Array.from(await readConverter(addr,'route() view returns(address[9])'));
            const sp=Array.from(await readConverter(addr,'swapParams() view returns(uint256[3][4])')).map(x=>Array.from(x));
            const outToken=await readConverter(addr,'tokenOut() view returns(address)');
            const inToken=wst?await readConverter(addr,'wstEth() view returns(address)'):await readConverter(addr,'tokenIn() view returns(address)');
            const rows=[];
            for(const amt of amounts){
              const spot=await readConverter(addr,'previewConvert(address,address,uint256) view returns(uint256)',[inToken,outToken,amt]);
              let q=amt,start=0; const hops=[];
              if(wst){const st=await readConverter(addr,'stEth() view returns(address)');q=await raw(inToken,'getStETHByWstETH(uint256) view returns(uint256)',[amt]);q=await getDy(route[1],Number(sp[0][0]),Number(sp[0][1]),q);hops.push({pool:route[1],legacy:true,out:q});start=1;}
              for(let h=start;h<4;h++){const r=h*2,pool=route[r+1],next=route[r+2],cur=route[r];if(pool===ethers.ZeroAddress||next===ethers.ZeroAddress)break;const z=await oracleHop(pool,cur,next,sp[h][0],sp[h][1],q);q=z.out;hops.push({pool,fee:z.fee,pi:z.pi,po:z.po,out:q});}
              const floor=q*(BPS-SLIP)/BPS; rows.push({amount:amt,spot,oracleFee:q,floor1pct:floor,executable:spot>=floor,spotVsFloorBps:(spot-floor)*10000n/floor,hops});
            }
            return {label,addr,inToken,outToken,rows};
          }
          async function fixedSdCrv(amount){
            const tri='0x4eBdF703948ddCEA3B11f675B4D1Fba9d2414A14', crvpool='0xCA0253A98D16e9C1e3614caFDA19318EE69772D0';
            const crvusd='0xf939E0A03FB07F59A73314E73794Be0E57ac1b4E', crv='0xD533a949740bb3306d119CC777fa900bA034cd52', sdcrv=cfg.pools.sdCRV.asset;
            const h1=await oracleHop(tri,crvusd,crv,0,2,amount); const h2=await oracleHop(crvpool,crv,sdcrv,0,1,h1.out); const floor=h2.out*99n/100n;
            const spot=await readConverter(cfg.pools.sdCRV.strategyRouteConverters[1],'previewConvert(address,address,uint256) view returns(uint256)',[crvusd,sdcrv,amount]);
            return {amount,spot,oracleFee:h2.out,floor1pct:floor,executable:spot>=floor,spotVsFloorBps:(spot-floor)*10000n/floor,fees:[h1.fee,h2.fee]};
          }
          async function sdYb(amount){
            const a=cfg.sdYbConverter; const h1=await oracleHop(a.crvUsdYbPool,a.crvUSD,a.yb,0,1,amount); const h2=await oracleHop(a.ybSdYbPool,a.yb,a.sdYB,0,1,h1.out); const floor=h2.out*99n/100n;
            const spot1=await getDy(a.crvUsdYbPool,0,1,amount), spot=await getDy(a.ybSdYbPool,0,1,spot1); const firstFloor=h1.out*99n/100n;
            return {amount,spot,oracleFee:h2.out,floor1pct:floor,executable:spot>=floor,spotVsFloorBps:(spot-floor)*10000n/floor,fees:[h1.fee,h2.fee],firstHop:{spot:spot1,oracleFee:h1.out,floor1pct:firstFloor,executable:spot1>=firstFloor}};
          }
          (async()=>{
            const cls={};
            for(const [name,p] of Object.entries(cfg.pools)){cls[name]={pid:p.pid,want:p.asset,wantIsBoostHubReward:await raw(cfg.boostHub,'isRewardToken(uint256,address) view returns(bool)',[p.pid,p.asset]),additional:[]};for(const t of p.rewardTokens)cls[name].additional.push({token:t,isBoostHubReward:await raw(cfg.boostHub,'isRewardToken(uint256,address) view returns(bool)',[p.pid,t])});}
            const out={block:BLOCK,classifications:cls};
            out.crvGeneric=await generic('CRV->sdCRV',cfg.pools.sdCRV.strategyRouteConverters[0],[10n**18n,10n**16n],false);
            out.wstEth=await generic('wstETH->sdFXN',cfg.pools.sdFXN.strategyRouteConverters[0],[10n**18n,10n**15n,10n**13n],true);
            out.crvUsdSdCrv=[await fixedSdCrv(10n**18n),await fixedSdCrv(10n**16n)];
            out.crvUsdSdYb=[await sdYb(10n**18n),await sdYb(10n**16n)];
            const text=JSON.stringify(out,(k,v)=>typeof v==='bigint'?v.toString():v,2);fs.writeFileSync('boosthub-v4-second-round-live-probe-v2.json',text);console.log(text);
            if(out.classifications.sdYB.wantIsBoostHubReward!==false)throw new Error('PID2 want classification regression');
            for(const x of Object.values(cls))for(const r of x.additional)if(!r.isBoostHubReward)throw new Error('non-native additional reward');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          cd "$ROOT" && node probe-v2.js | tee "$GITHUB_WORKSPACE/boosthub-v4-second-round-live-probe-v2.txt"
          cp "$ROOT/boosthub-v4-second-round-live-probe-v2.json" "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boosthub-v4-second-round-live-probe-v2
          path: |
            boosthub-v4-second-round-live-probe-v2.txt
            boosthub-v4-second-round-live-probe-v2.json
          if-no-files-found: error
          retention-days: 30
