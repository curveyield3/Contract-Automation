name: BoostHub v4 Second Round Compile v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'github-native-sim/boosthub-v4-second-round-compile-trigger-v1.txt'
      - '.github/workflows/boosthub-v4-second-round-compile-v1.yml'

permissions:
  contents: read

jobs:
  compile-second-round:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted runner
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Select working private controller credential
        env:
          AUDIT_CONTROLLER_PROBE_REPOSITORY: curveyield3/Solo-Audit-Controller
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Checkout exact remediated source commit
        uses: actions/checkout@v4
        with:
          repository: curveyield3/Solo-Audit-Controller
          ref: 93062463611e798ab26544a88c4e119f9620be9a
          token: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller
          persist-credentials: false
          fetch-depth: 1

      - name: Extract exact v4 and prepare ephemeral dependency
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          ZIP='.controller/campaigns/Boosthub Staking v2/source/CurveYield-BoostHub-sdCRV-sdFXN-sdYB-Deployment-Package-Remediated-v4.zip'
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = '4b502a2040712da8e6f4e80165ed74c8e3f492226e60141bc23ac8585a3855d4'
          rm -rf .v4compile && mkdir .v4compile
          unzip -q "$ZIP" -d .v4compile
          ROOT="$(find .v4compile -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$ROOT"
          mkdir -p "$ROOT/lib"
          git clone --depth 1 --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git "$ROOT/lib/openzeppelin-contracts"
          printf '@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/\n' > "$ROOT/remappings.txt"
          echo "root=$(realpath "$ROOT")" >> "$GITHUB_OUTPUT"

      - name: Compile every Solidity file changed in second remediation round
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.prep.outputs.root }}'
          : > boosthub-v4-second-round-compile-result-v1.txt
          for target in \
            contracts/boosthub/SdYbRewardConverter.sol \
            reference/converters/CurveRouterRewardConverter.sol \
            reference/converters/CysdCrvCrvUsdRewardConverterV1-flattened-v3.sol \
            reference/converters/WstEthCurveRouterRewardConverter.sol; do
              echo "COMPILING $target" | tee -a boosthub-v4-second-round-compile-result-v1.txt
              forge build --root "$ROOT" "$target" --force -vv 2>&1 | tee -a boosthub-v4-second-round-compile-result-v1.txt
              echo "PASS $target" | tee -a boosthub-v4-second-round-compile-result-v1.txt
          done

      - name: Upload compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-v4-second-round-compile-evidence-v1
          path: boosthub-v4-second-round-compile-result-v1.txt
          if-no-files-found: error
          retention-days: 30
