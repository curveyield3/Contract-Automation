name: BoostHub v6 Deployment Live Fork v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'github-native-sim/boosthub-v6-live-fork/**'

permissions:
  contents: read

jobs:
  v6-live-fork:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout trusted runner
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout v6 overlay from PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .request
          persist-credentials: false
          fetch-depth: 1

      - name: Select working private controller credential
        env:
          AUDIT_CONTROLLER_PROBE_REPOSITORY: CurveYield2/Audit-Controller
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Checkout Audit Controller source
        uses: actions/checkout@v4
        with:
          repository: CurveYield2/Audit-Controller
          ref: main
          token: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Reconstruct audited base and apply v6 overlay
        shell: bash
        run: |
          set -euo pipefail
          ZIP='.controller/campaigns/Boosthub Staking v2/source/CurveYield-BoostHub-sdCRV-sdFXN-sdYB-Deployment-Package-Remediated-v4.zip'
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = '4b502a2040712da8e6f4e80165ed74c8e3f492226e60141bc23ac8585a3855d4'
          rm -rf .v6 && mkdir -p .v6
          unzip -q "$ZIP" -d .v6
          ROOT="$(find .v6 -mindepth 1 -maxdepth 1 -type d | head -n1)"
          V16="$ROOT/contracts/boosthub/vyper/BoostHubStaking-v16.vy"
          V17="$ROOT/contracts/boosthub/vyper/BoostHubStaking-v17.vy"
          cp "$V16" "$V17"
          python - "$V17" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          R=[
            ('MAX_YIELD_BOOST_FEE_BPS: constant(uint256) = 500\n','MAX_YIELD_BOOST_FEE_BPS: constant(uint256) = 500\nMAX_FEE_CONVERSION_SLIPPAGE_BPS: constant(uint256) = 400\n'),
            ('yield_boost_fee_bps: public(uint256)\n\n# Converter','yield_boost_fee_bps: public(uint256)\nfee_conversion_slippage_bps: uint256\n\n# Converter'),
            ('    self.yield_boost_fee_bps = _yield_boost_fee_bps\n    self.reward_smoothing_units','    self.yield_boost_fee_bps = _yield_boost_fee_bps\n    self.fee_conversion_slippage_bps = 100\n    self.reward_smoothing_units'),
            ('    assert quote != 0, "zero quote"\n    response: Bytes[32] = raw_call(','    assert quote != 0, "zero quote"\n    quote = quote * (FEE_DENOMINATOR - self.fee_conversion_slippage_bps) // FEE_DENOMINATOR\n    response: Bytes[32] = raw_call('),
            ('def set_yield_boost_fee_bps(_fee_bps: uint256):\n    assert msg.sender == self.admin and _fee_bps <= MAX_YIELD_BOOST_FEE_BPS\n    self.yield_boost_fee_bps = _fee_bps\n    log SetYieldBoostFee(_fee_bps)\n\n@external\ndef set_reward_converter','def set_yield_boost_fee_bps(_fee_bps: uint256):\n    assert msg.sender == self.admin and _fee_bps <= MAX_YIELD_BOOST_FEE_BPS\n    self.yield_boost_fee_bps = _fee_bps\n    log SetYieldBoostFee(_fee_bps)\n\n@external\ndef set_fee_conversion_slippage_bps(_slippage_bps: uint256):\n    assert msg.sender == self.admin and _slippage_bps <= MAX_FEE_CONVERSION_SLIPPAGE_BPS\n    self.fee_conversion_slippage_bps = _slippage_bps\n\n@external\ndef set_reward_converter')]
          for a,b in R:
              assert a in s
              s=s.replace(a,b,1)
          p.write_text(s)
          PY
          test "$(sha256sum "$V17" | awk '{print $1}')" = 'd579f10a191bcf72feb8c220d7de4de447d9667e4ae923540df42781ee8f4216'
          OVER='.request/github-native-sim/boosthub-v6-live-fork/overlay'
          test -d "$OVER"
          cp -a "$OVER"/. "$ROOT"/
          mkdir -p "$ROOT/contracts/boosthub/converters" "$ROOT/contracts/gauges"
          cp "$ROOT/reference/converters/CurveRouterRewardConverter.sol" "$ROOT/contracts/boosthub/converters/CurveRouterRewardConverter-v1.sol"
          cp "$ROOT/reference/converters/CysdCrvCrvUsdRewardConverterV1-flattened-v3.sol" "$ROOT/contracts/boosthub/converters/CysdCrvCrvUsdRewardConverterV1-flattened-v3.sol"
          cp "$ROOT/reference/converters/WstEthCurveRouterRewardConverter.sol" "$ROOT/contracts/boosthub/converters/WstEthCurveRouterRewardConverter-v1.sol"
          cp "$ROOT/contracts/boosthub/SdYbRewardConverter.sol" "$ROOT/contracts/boosthub/converters/SdYbRewardConverter-v1.sol"
          python "$ROOT/scripts-v3/build-standalone-gauge-v1.py" | tee boosthub-v6-gauge-generation-v1.txt
          test "$(sha256sum "$ROOT/contracts/gauges/CurveYieldGauge-v1.vy" | awk '{print $1}')" = '1bd0acfebab73739835e85224b37037d5f9d52c19b9778083e1972278c90637b'
          echo "ROOT=$(realpath "$ROOT")" >> "$GITHUB_ENV"
          printf 'v4_sha256=%s\nv17_sha256=%s\noverlay_commit=%s\n' \
            "$(sha256sum "$ZIP"|awk '{print $1}')" \
            "$(sha256sum "$V17"|awk '{print $1}')" \
            '${{ github.event.pull_request.head.sha }}' | tee boosthub-v6-source-binding-v1.txt

      - name: Run v6 static gates before compilation
        shell: bash
        run: |
          set -euo pipefail
          python "$ROOT/verification-v3/standalone-gauge-static-v1.py" | tee boosthub-v6-gauge-static-v1.txt
          python "$ROOT/verification-v3/deployment-orchestrator-static-v1.py" | tee boosthub-v6-orchestrator-static-v1.txt
          node --check "$ROOT/deployment-v3/lib-v3.js"
          node --check "$ROOT/deployment-v3/materialize-config-v1.js"
          node --check "$ROOT/deployment-v3/deploy-configure-suite-v1.js"

      - name: Install package dependencies in GitHub only
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          npm ci --ignore-scripts

      - name: Compile Solidity v6 surfaces
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          npx hardhat compile --config hardhat.config.v3.js 2>&1 | tee "$GITHUB_WORKSPACE/boosthub-v6-solidity-compile-v1.txt"

      - name: Compile exact V17 with Vyper 0.4.3
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input --force-reinstall 'vyper==0.4.3'
          cd "$ROOT"
          python scripts-v3/build-vyper-artifact-v1.py staking 2>&1 | tee "$GITHUB_WORKSPACE/boosthub-v6-v17-compile-v1.txt"
          python - <<'PY' | tee "$GITHUB_WORKSPACE/boosthub-v6-v17-size-v1.txt"
          import json, os
          from pathlib import Path
          p=Path(os.environ['ROOT'])/'artifacts-vyper-v3/BoostHubStaking-v17.json'
          x=json.loads(p.read_text()); runtime=x['bytecode_runtime']
          n=(len(runtime)-2)//2
          print('runtime_bytes='+str(n))
          assert n == 24552
          assert n <= 24576
          PY

      - name: Compile standalone gauge with Vyper 0.3.10
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input --force-reinstall 'vyper==0.3.10'
          cd "$ROOT"
          python scripts-v3/build-vyper-artifact-v1.py gauge 2>&1 | tee "$GITHUB_WORKSPACE/boosthub-v6-gauge-compile-v1.txt"

      - name: Start pinned Ethereum mainnet fork
        env:
          ARCHIVE_RPC: ${{ secrets.RPC_ETHEREUM }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ARCHIVE_RPC"
          test "$(cast chain-id --rpc-url "$ARCHIVE_RPC")" = 1
          UPSTREAM_HASH="$(cast block 25737717 --field hash --rpc-url "$ARCHIVE_RPC" | tr -d '\\r\\n')"
          [[ "$UPSTREAM_HASH" =~ ^0x[0-9a-fA-F]{64}$ ]] || { echo "::error::Authenticated archive block hash unavailable"; exit 1; }
          anvil --fork-url "$ARCHIVE_RPC" --fork-block-number 25737717 --chain-id 1 --port 8545 > boosthub-v6-anvil-v1.log 2>&1 &
          echo $! > .anvil.pid
          for i in $(seq 1 45); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          test "$(cast chain-id --rpc-url http://127.0.0.1:8545)" = '1'
          LOCAL_HASH="$(cast block 25737717 --field hash --rpc-url http://127.0.0.1:8545 | tr -d '\\r\\n')"
          test "${LOCAL_HASH,,}" = "${UPSTREAM_HASH,,}" || { echo "::error::Local Anvil historical block hash mismatch"; exit 1; }
          test "$(cast code 0xFbEF8941Da53EA724385B44E91ae9672061D0263 --rpc-url http://127.0.0.1:8545)" != '0x' || { echo "::error::Deployed target code missing"; exit 1; }

      - name: Materialize fork-only operator inputs from live BoostHub owner
        shell: bash
        run: |
          set -euo pipefail
          HUB='0xFbEF8941Da53EA724385B44E91ae9672061D0263'
          OWNER="$(cast call "$HUB" 'owner()(address)' --rpc-url http://127.0.0.1:8545 | tr -d '\r\n')"
          test -n "$OWNER"
          python - "$ROOT/operator-inputs-v3.json" "$OWNER" <<'PY'
          import json,sys
          p=sys.argv[1]; owner=sys.argv[2]
          x=json.load(open(p))
          x['finalAdmin']=owner
          x['vaultFeeReceiver']=owner
          for label in ('sdCRV','sdFXN','sdYB'):
              q=x['pools'][label]
              q['withdrawFeeBps']=0
              q['performanceFeeBps']=0
              q['performanceFeeReceiver']=owner
              q['performanceFeeStaked']=False
              q['yieldBoostFeeBps']=0
              q['rewardSmoothingUnits']=0
              q['keeper']=owner
          json.dump(x,open(p,'w'),indent=2);open(p,'a').write('\n')
          PY
          cd "$ROOT"
          node deployment-v3/materialize-config-v1.js config-mainnet-v3.json operator-inputs-v3.json config-production-v3.json
          printf 'boosthub_owner=%s\nfork_block=25737717\n' "$OWNER" | tee "$GITHUB_WORKSPACE/boosthub-v6-fork-identity-v1.txt"
          echo "BOOSTHUB_OWNER=$OWNER" >> "$GITHUB_ENV"

      - name: Execute exact v6 deployment and configuration orchestrator on fork
        env:
          RPC_URL: http://127.0.0.1:8545
          IMPERSONATE_DEPLOYER_ADDRESS: ${{ env.BOOSTHUB_OWNER }}
          STATE_FILE: ${{ env.ROOT }}/deployment-state-v3.json
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          node deployment-v3/deploy-configure-suite-v1.js deploy config-production-v3.json 2>&1 | tee "$GITHUB_WORKSPACE/boosthub-v6-live-fork-deploy-v1.txt"
          node deployment-v3/deploy-configure-suite-v1.js verify config-production-v3.json 2>&1 | tee "$GITHUB_WORKSPACE/boosthub-v6-live-fork-verify-v1.txt"

      - name: Assert v6 fork invariants and summarize gas
        shell: bash
        run: |
          set -euo pipefail
          python - "$ROOT/deployment-state-v3.json" <<'PY' | tee boosthub-v6-live-fork-summary-v1.json
          import json,sys
          s=json.load(open(sys.argv[1]))
          c=s['contracts']; ch=s['checks']
          assert all(k in c for k in ['sdcrvStaking','sdfxnStaking','sdybStaking','sdcrvVault','sdfxnVault','sdcrvStrategy','sdfxnStrategy','sdcrvGauge','sdfxnGauge'])
          assert all(k not in c for k in ['sdybVault','sdybStrategy','sdybGauge'])
          assert all(k in c for k in ['crvToSdCrvConverter','crvUsdToSdCrvConverter','wstEthToSdFxnConverter','crvUsdToSdYbConverter'])
          assert ch['boostHubCutover']['method']=='setPoolRuntimeConfigs'
          assert ch['boostHubCutover']['lockFunctionCalled'] is False
          assert ch['boostHubCutover']['postCutoverUnlocked'] is True
          assert ch['finalVerification']['passed'] is True
          assert ch['finalVerification']['sdYbVaultStrategyGaugeAbsent'] is True
          assert ch['finalVerification']['boostHubDepositorsUnlocked'] is True
          gas={k:int(v.get('gasUsed','0')) for k,v in c.items() if isinstance(v,dict) and 'gasUsed' in v}
          txgas={k:int(v) for k,v in ch.get('gas',{}).items()}
          out={'status':'PASS','phase':s.get('phase'),'contractDeployments':len(gas),'deploymentGas':gas,'configurationGas':txgas,'deploymentGasTotal':sum(gas.values()),'configurationGasTotal':sum(txgas.values()),'sdYbVaultStrategyGaugeAbsent':True,'boostHubCutoverUnlocked':True}
          print(json.dumps(out,indent=2))
          PY

      - name: Upload v6 deployment simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-v6-live-fork-v1
          path: |
            boosthub-v6-source-binding-v1.txt
            boosthub-v6-gauge-generation-v1.txt
            boosthub-v6-gauge-static-v1.txt
            boosthub-v6-orchestrator-static-v1.txt
            boosthub-v6-solidity-compile-v1.txt
            boosthub-v6-v17-compile-v1.txt
            boosthub-v6-v17-size-v1.txt
            boosthub-v6-gauge-compile-v1.txt
            boosthub-v6-anvil-v1.log
            boosthub-v6-fork-identity-v1.txt
            boosthub-v6-live-fork-deploy-v1.txt
            boosthub-v6-live-fork-verify-v1.txt
            boosthub-v6-live-fork-summary-v1.json
            .v6/**/deployment-state-v3.json
            .v6/**/config-production-v3.json
            .v6/**/artifacts-vyper-v3/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Stop Anvil
        if: always()
        shell: bash
        run: |
          if [ -f .anvil.pid ]; then kill "$(cat .anvil.pid)" 2>/dev/null || true; fi
