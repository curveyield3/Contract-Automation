name: BoostHub V17 Slippage GREEN v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'github-native-sim/boosthub-v17-slippage-green-trigger-v1.txt'

permissions:
  contents: read

jobs:
  compile-and-size:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted runner
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Select working private controller credential
        env:
          AUDIT_CONTROLLER_PROBE_REPOSITORY: curveyield3/Solo-Audit-Controller
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Checkout exact canonical v4 source
        uses: actions/checkout@v4
        with:
          repository: curveyield3/Solo-Audit-Controller
          ref: 93062463611e798ab26544a88c4e119f9620be9a
          token: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Vyper
        run: python -m pip install --disable-pip-version-check 'vyper==0.4.3'

      - name: Build exact V17 candidate and compare runtime size
        shell: bash
        run: |
          set -euo pipefail
          ZIP='.controller/campaigns/Boosthub Staking v2/source/CurveYield-BoostHub-sdCRV-sdFXN-sdYB-Deployment-Package-Remediated-v4.zip'
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = '4b502a2040712da8e6f4e80165ed74c8e3f492226e60141bc23ac8585a3855d4'
          rm -rf .v4 && mkdir .v4 && unzip -q "$ZIP" -d .v4
          V16="$(find .v4 -type f -name 'BoostHubStaking-v16.vy' | head -n1)"
          V17='BoostHubStaking-v17.vy'
          cp "$V16" "$V17"
          python - "$V17" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          repls=[
              ('MAX_YIELD_BOOST_FEE_BPS: constant(uint256) = 500\n', 'MAX_YIELD_BOOST_FEE_BPS: constant(uint256) = 500\nMAX_FEE_CONVERSION_SLIPPAGE_BPS: constant(uint256) = 400\n'),
              ('yield_boost_fee_bps: public(uint256)\n\n# Converter', 'yield_boost_fee_bps: public(uint256)\nfee_conversion_slippage_bps: uint256\n\n# Converter'),
              ('    self.yield_boost_fee_bps = _yield_boost_fee_bps\n    self.reward_smoothing_units', '    self.yield_boost_fee_bps = _yield_boost_fee_bps\n    self.fee_conversion_slippage_bps = 100\n    self.reward_smoothing_units'),
              ('    assert quote != 0, "zero quote"\n    response: Bytes[32] = raw_call(', '    assert quote != 0, "zero quote"\n    quote = quote * (FEE_DENOMINATOR - self.fee_conversion_slippage_bps) // FEE_DENOMINATOR\n    response: Bytes[32] = raw_call('),
              ('def set_yield_boost_fee_bps(_fee_bps: uint256):\n    assert msg.sender == self.admin and _fee_bps <= MAX_YIELD_BOOST_FEE_BPS\n    self.yield_boost_fee_bps = _fee_bps\n    log SetYieldBoostFee(_fee_bps)\n\n@external\ndef set_reward_converter', 'def set_yield_boost_fee_bps(_fee_bps: uint256):\n    assert msg.sender == self.admin and _fee_bps <= MAX_YIELD_BOOST_FEE_BPS\n    self.yield_boost_fee_bps = _fee_bps\n    log SetYieldBoostFee(_fee_bps)\n\n@external\ndef set_fee_conversion_slippage_bps(_slippage_bps: uint256):\n    assert msg.sender == self.admin and _slippage_bps <= MAX_FEE_CONVERSION_SLIPPAGE_BPS\n    self.fee_conversion_slippage_bps = _slippage_bps\n\n@external\ndef set_reward_converter')
          ]
          for old,new in repls:
              assert old in s, f'missing patch anchor: {old[:60]!r}'
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          test "$(sha256sum "$V17" | awk '{print $1}')" = 'd579f10a191bcf72feb8c220d7de4de447d9667e4ae923540df42781ee8f4216'
          python - "$V16" "$V17" <<'PY'
          from pathlib import Path
          import sys, vyper
          from vyper.compiler import compile_code
          assert vyper.__version__ == '0.4.3'
          old=Path(sys.argv[1]); new=Path(sys.argv[2])
          old_out=compile_code(old.read_text(), contract_path=str(old), output_formats=['abi','bytecode_runtime'])
          new_text=new.read_text()
          new_out=compile_code(new_text, contract_path=str(new), output_formats=['abi','bytecode_runtime'])
          old_size=(len(old_out['bytecode_runtime'])-2)//2
          new_size=(len(new_out['bytecode_runtime'])-2)//2
          delta=new_size-old_size
          headroom=24576-new_size
          names={x.get('name') for x in new_out['abi'] if x.get('type')=='function'}
          assert 'set_fee_conversion_slippage_bps' in names
          assert 'fee_conversion_slippage_bps' not in names, 'private storage unexpectedly emitted getter'
          assert 'MAX_FEE_CONVERSION_SLIPPAGE_BPS: constant(uint256) = 400' in new_text
          assert 'self.fee_conversion_slippage_bps = 100' in new_text
          assert 'quote = quote * (FEE_DENOMINATOR - self.fee_conversion_slippage_bps) // FEE_DENOMINATOR' in new_text
          assert new_size <= 24576, f'EIP-170 runtime limit exceeded: {new_size}'
          print(f'V16_RUNTIME_BYTES={old_size}')
          print(f'V17_RUNTIME_BYTES={new_size}')
          print(f'RUNTIME_DELTA_BYTES={delta}')
          print(f'EIP170_HEADROOM_BYTES={headroom}')
          print('DEFAULT_SLIPPAGE_BPS=100')
          print('MAX_SLIPPAGE_BPS=400')
          PY
