name: BoostHub v4 Second Round Audit v2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'github-native-sim/boosthub-v4-second-round-audit-trigger-v2.txt'
      - '.github/workflows/boosthub-v4-second-round-audit-v2.yml'

permissions:
  contents: read

jobs:
  focused-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted runner
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Select working private controller credential
        env:
          AUDIT_CONTROLLER_PROBE_REPOSITORY: curveyield3/Solo-Audit-Controller
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Checkout exact remediated source commit
        uses: actions/checkout@v4
        with:
          repository: curveyield3/Solo-Audit-Controller
          ref: 93062463611e798ab26544a88c4e119f9620be9a
          token: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact v4 archive and query pinned live route data
        env:
          RPC_URL: ${{ secrets.ETHEREUM_RPC }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP='.controller/campaigns/Boosthub Staking v2/source/CurveYield-BoostHub-sdCRV-sdFXN-sdYB-Deployment-Package-Remediated-v4.zip'
          test -f "$ZIP"
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = '4b502a2040712da8e6f4e80165ed74c8e3f492226e60141bc23ac8585a3855d4'
          test -n "$RPC_URL"
          BLOCK=25737717
          out='boosthub-v4-second-round-live-v2.env'
          : > "$out"
          call() { cast call "$1" "$2" ${3:-} --rpc-url "$RPC_URL" --block "$BLOCK" | awk '{print $1}'; }

          TRI=0x4eBdF703948ddCEA3B11f675B4D1Fba9d2414A14
          CRVSD=0xCA0253A98D16e9C1e3614caFDA19318EE69772D0
          STETHPOOL=0xDC24316b9AE028F1497c275EB9192a3Ea0f67022
          ETHFXN=0xC15F285679a1Ef2d25F53D4CbD0265E1D02F2A92
          FXNSD=0x28Ca243dc0aC075dD012fCf9375C25D18A844d96
          CRVUSDYB=0xec977F46467a3021785Cff88894886E617abd65b
          YBSD=0x98b540fa89690969D111D045afCa575C91519B1A
          WSTETH=0x7f39C581F595B53c5cb19bD0b3f8dA6c935E2Ca0

          echo BLOCK=$BLOCK >> "$out"
          echo TRI_ORACLE=$(call "$TRI" 'price_oracle(uint256)(uint256)' '1') >> "$out"
          echo TRI_FEE=$(call "$TRI" 'fee()(uint256)') >> "$out"
          echo TRI_SPOT=$(call "$TRI" 'get_dy(uint256,uint256,uint256)(uint256)' '0 2 1000000000000000000') >> "$out"
          TRI_SPOT=$(grep '^TRI_SPOT=' "$out" | cut -d= -f2)
          echo CRVSD_ORACLE=$(call "$CRVSD" 'price_oracle()(uint256)') >> "$out"
          echo CRVSD_FEE=$(call "$CRVSD" 'fee()(uint256)') >> "$out"
          echo CRVSD_SPOT=$(call "$CRVSD" 'get_dy(uint256,uint256,uint256)(uint256)' "0 1 $TRI_SPOT") >> "$out"

          echo WSTETH_STETH=$(call "$WSTETH" 'getStETHByWstETH(uint256)(uint256)' '1000000000000000000') >> "$out"
          WSTETH_STETH=$(grep '^WSTETH_STETH=' "$out" | cut -d= -f2)
          echo STETH_ETH_SPOT=$(call "$STETHPOOL" 'get_dy(int128,int128,uint256)(uint256)' "1 0 $WSTETH_STETH") >> "$out"
          STETH_ETH_SPOT=$(grep '^STETH_ETH_SPOT=' "$out" | cut -d= -f2)
          echo ETHFXN_ORACLE=$(call "$ETHFXN" 'price_oracle()(uint256)') >> "$out"
          echo ETHFXN_FEE=$(call "$ETHFXN" 'fee()(uint256)') >> "$out"
          echo ETHFXN_SPOT=$(call "$ETHFXN" 'get_dy(uint256,uint256,uint256)(uint256)' "0 1 $STETH_ETH_SPOT") >> "$out"
          ETHFXN_SPOT=$(grep '^ETHFXN_SPOT=' "$out" | cut -d= -f2)
          echo FXNSD_ORACLE=$(call "$FXNSD" 'price_oracle()(uint256)') >> "$out"
          echo FXNSD_FEE=$(call "$FXNSD" 'fee()(uint256)') >> "$out"
          echo FXNSD_SPOT=$(call "$FXNSD" 'get_dy(uint256,uint256,uint256)(uint256)' "0 1 $ETHFXN_SPOT") >> "$out"

          echo CRVUSDYB_ORACLE=$(call "$CRVUSDYB" 'price_oracle()(uint256)') >> "$out"
          echo CRVUSDYB_FEE=$(call "$CRVUSDYB" 'fee()(uint256)') >> "$out"
          echo CRVUSDYB_SPOT=$(call "$CRVUSDYB" 'get_dy(uint256,uint256,uint256)(uint256)' '0 1 1000000000000000000') >> "$out"
          CRVUSDYB_SPOT=$(grep '^CRVUSDYB_SPOT=' "$out" | cut -d= -f2)
          echo YBSD_ORACLE=$(call "$YBSD" 'price_oracle(uint256)(uint256)' '0') >> "$out"
          echo YBSD_FEE=$(call "$YBSD" 'fee()(uint256)') >> "$out"
          echo YBSD_SPOT=$(call "$YBSD" 'get_dy(int128,int128,uint256)(uint256)' "0 1 $CRVUSDYB_SPOT") >> "$out"
          cat "$out"

      - name: Recompute v4 oracle-fee floors and assert pinned-route liveness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          vals={}
          for line in Path('boosthub-v4-second-round-live-v2.env').read_text().splitlines():
              k,v=line.split('=',1); vals[k]=int(v)
          D=10**10
          BPS=10_000
          def fee(x,f):
              assert 0 <= f < D
              return x*(D-f)//D
          crv=10**36//vals['TRI_ORACLE']
          crv=fee(crv,vals['TRI_FEE'])
          sd=crv*10**18//vals['CRVSD_ORACLE']
          sd=fee(sd,vals['CRVSD_FEE'])
          sd_floor=sd*9900//BPS
          sd_spot=vals['CRVSD_SPOT']
          fxn=vals['STETH_ETH_SPOT']*10**18//vals['ETHFXN_ORACLE']
          fxn=fee(fxn,vals['ETHFXN_FEE'])
          sdfxn=fxn*10**18//vals['FXNSD_ORACLE']
          sdfxn=fee(sdfxn,vals['FXNSD_FEE'])
          sdfxn_floor=sdfxn*9900//BPS
          sdfxn_spot=vals['FXNSD_SPOT']
          yb=10**36//vals['CRVUSDYB_ORACLE']
          yb=fee(yb,vals['CRVUSDYB_FEE'])
          sdyb=yb*10**18//vals['YBSD_ORACLE']
          sdyb=fee(sdyb,vals['YBSD_FEE'])
          sdyb_floor=sdyb*9900//BPS
          sdyb_spot=vals['YBSD_SPOT']
          rows={'sdCRV':(sd,sd_floor,sd_spot),'sdFXN':(sdfxn,sdfxn_floor,sdfxn_spot),'sdYB':(sdyb,sdyb_floor,sdyb_spot)}
          lines=[]
          for name,(oracle_net,floor,spot) in rows.items():
              margin_bps=(spot-floor)*BPS//floor
              lines.append(f'{name}: oracle_net={oracle_net} floor_1pct={floor} executable_spot={spot} margin_over_floor_bps={margin_bps}')
              assert spot >= floor, f'{name} normal pinned route output below v4 minimum floor'
          Path('boosthub-v4-second-round-audit-result-v2.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY

      - name: Upload focused audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-v4-second-round-audit-evidence-v2
          path: |
            boosthub-v4-second-round-live-v2.env
            boosthub-v4-second-round-audit-result-v2.txt
          if-no-files-found: warn
          retention-days: 30
