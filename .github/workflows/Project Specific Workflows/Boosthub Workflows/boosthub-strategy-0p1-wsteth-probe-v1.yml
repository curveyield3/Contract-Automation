name: BoostHub Strategy 0.1 wstETH Probe v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'github-native-sim/boosthub-strategy-0p1-wsteth-trigger-v1.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted runner
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Select working private controller credential
        env:
          AUDIT_CONTROLLER_PROBE_REPOSITORY: curveyield3/Solo-Audit-Controller
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Checkout exact canonical v4 source
        uses: actions/checkout@v4
        with:
          repository: curveyield3/Solo-Audit-Controller
          ref: 93062463611e798ab26544a88c4e119f9620be9a
          token: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller
          persist-credentials: false
          fetch-depth: 1

      - name: Bind unchanged Strategy source
        shell: bash
        run: |
          set -euo pipefail
          ZIP='.controller/campaigns/Boosthub Staking v2/source/CurveYield-BoostHub-sdCRV-sdFXN-sdYB-Deployment-Package-Remediated-v4.zip'
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = '4b502a2040712da8e6f4e80165ed74c8e3f492226e60141bc23ac8585a3855d4'
          rm -rf .v4 && mkdir .v4 && unzip -q "$ZIP" -d .v4
          STRAT="$(find .v4 -type f -name 'CurveYieldStakingStrategyV2.sol' | head -n1)"
          test -n "$STRAT"
          grep -q 'uint256 public constant MAX_SLIPPAGE_BPS = 400;' "$STRAT"
          grep -q 'maxSlippageBps = 100;' "$STRAT"
          grep -q 'quoted \* (FEE_DENOMINATOR - maxSlippageBps) / FEE_DENOMINATOR' "$STRAT"
          printf 'base_package_sha256=%s\nstrategy_sha256=%s\ndefault_slippage_bps=100\nmax_slippage_bps=400\n' \
            "$(sha256sum "$ZIP" | awk '{print $1}')" \
            "$(sha256sum "$STRAT" | awk '{print $1}')" > strategy-static-0p1-v1.txt
          cat strategy-static-0p1-v1.txt

      - name: Execute 0.1 wstETH route and test 1 percent floor
        env:
          RPC_URL: ${{ secrets.ETHEREUM_RPC }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RPC_URL"
          BLOCK=25737717
          AMOUNT=100000000000000000
          WSTETH=0x7f39C581F595B53c5cb19bD0b3f8dA6c935E2Ca0
          STETHPOOL=0xDC24316b9AE028F1497c275EB9192a3Ea0f67022
          ETHFXN=0xC15F285679a1Ef2d25F53D4CbD0265E1D02F2A92
          FXNSD=0x28Ca243dc0aC075dD012fCf9375C25D18A844d96
          call() { cast call "$1" "$2" ${3:-} --rpc-url "$RPC_URL" --block "$BLOCK" | awk '{print $1}'; }
          dy() {
            local pool="$1" i="$2" j="$3" amount="$4"
            local sig val
            for sig in 'get_dy(int128,int128,uint256)(uint256)' 'get_dy(uint256,uint256,uint256)(uint256)'; do
              if val=$(cast call "$pool" "$sig" "$i" "$j" "$amount" --rpc-url "$RPC_URL" --block "$BLOCK" 2>/dev/null | awk '{print $1}'); then
                if [ -n "$val" ]; then printf '%s|%s' "$sig" "$val"; return 0; fi
              fi
            done
            return 1
          }

          STETH=$(call "$WSTETH" 'getStETHByWstETH(uint256)(uint256)' "$AMOUNT")
          P=$(dy "$STETHPOOL" 1 0 "$STETH"); STETH_ABI=${P%%|*}; ETH=${P##*|}
          P=$(dy "$ETHFXN" 0 1 "$ETH"); ETHFXN_ABI=${P%%|*}; FXN_EXEC=${P##*|}
          P=$(dy "$FXNSD" 0 1 "$FXN_EXEC"); FXNSD_ABI=${P%%|*}; SDFXN_EXEC=${P##*|}
          OR1=$(call "$ETHFXN" 'price_oracle()(uint256)')
          F1=$(call "$ETHFXN" 'fee()(uint256)')
          OR2=$(call "$FXNSD" 'price_oracle()(uint256)')
          F2=$(call "$FXNSD" 'fee()(uint256)')

          cat > strategy-route-0p1-v1.env <<EOF
          BLOCK=$BLOCK
          AMOUNT_WSTETH=$AMOUNT
          STETH=$STETH
          STETH_POOL_ABI=$STETH_ABI
          LEGACY_ETH_EXEC=$ETH
          ETHFXN_ABI=$ETHFXN_ABI
          FXN_EXEC=$FXN_EXEC
          FXNSD_ABI=$FXNSD_ABI
          SDFXN_EXEC=$SDFXN_EXEC
          ETHFXN_ORACLE=$OR1
          ETHFXN_FEE=$F1
          FXNSD_ORACLE=$OR2
          FXNSD_FEE=$F2
          EOF
          cat strategy-route-0p1-v1.env

          python - <<'PY'
          from pathlib import Path
          vals={}
          for line in Path('strategy-route-0p1-v1.env').read_text().splitlines():
              if '=' in line:
                  k,v=line.split('=',1); vals[k]=v
          D=10**10; BPS=10_000
          def fee(x,f): return x*(D-f)//D
          eth=int(vals['LEGACY_ETH_EXEC'])
          fxn=eth*10**18//int(vals['ETHFXN_ORACLE']); fxn=fee(fxn,int(vals['ETHFXN_FEE']))
          preview=fxn*10**18//int(vals['FXNSD_ORACLE']); preview=fee(preview,int(vals['FXNSD_FEE']))
          floor=preview*(BPS-100)//BPS
          spot=int(vals['SDFXN_EXEC'])
          pass_1pct=spot>=floor
          margin_bps=(spot-floor)*BPS/floor
          divergence_bps=(preview-spot)*BPS/preview
          result=(
              f'amount_wsteth=0.1\n'
              f'fee_adjusted_oracle_preview={preview}\n'
              f'strategy_1pct_minout={floor}\n'
              f'executable_sdfxn={spot}\n'
              f'pass_1pct={pass_1pct}\n'
              f'margin_vs_1pct_floor_bps={margin_bps:.6f}\n'
              f'executable_below_oracle_bps={divergence_bps:.6f}\n'
          )
          Path('boosthub-strategy-0p1-wsteth-probe-v1.txt').write_text(result)
          print(result)
          assert pass_1pct, '0.1 wstETH fails Strategy default 1% minOut'
          PY

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-strategy-0p1-wsteth-probe-v1
          path: |
            strategy-static-0p1-v1.txt
            strategy-route-0p1-v1.env
            boosthub-strategy-0p1-wsteth-probe-v1.txt
          if-no-files-found: warn
          retention-days: 30
