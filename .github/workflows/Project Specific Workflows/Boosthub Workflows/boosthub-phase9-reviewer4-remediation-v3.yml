name: BoostHub Phase9 Reviewer4 Remediation v3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'github-native-sim/boosthub-phase9-reviewer4-remediation-trigger-v3.txt'

permissions:
  contents: read

jobs:
  phase9-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Select working private controller credential
        env:
          AUDIT_CONTROLLER_PROBE_REPOSITORY: curveyield3/Audit-Controller
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - uses: actions/checkout@v4
        with:
          repository: curveyield3/Audit-Controller
          ref: 6e186513a8cdcb155600b1afb7b8cdc20c6b40cf
          token: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Bind exact v4 and V17 source
        id: src
        shell: bash
        run: |
          set -euo pipefail
          ZIP='.controller/campaigns/Boosthub Staking v2/source/CurveYield-BoostHub-sdCRV-sdFXN-sdYB-Deployment-Package-Remediated-v4.zip'
          test "$(sha256sum "$ZIP"|awk '{print $1}')" = '4b502a2040712da8e6f4e80165ed74c8e3f492226e60141bc23ac8585a3855d4'
          rm -rf .phase9 && mkdir .phase9 && unzip -q "$ZIP" -d .phase9
          ROOT="$(find .phase9 -mindepth 1 -maxdepth 1 -type d | head -n1)"; V16="$ROOT/contracts/boosthub/vyper/BoostHubStaking-v16.vy"; V17="$ROOT/contracts/boosthub/vyper/BoostHubStaking-v17.vy"; cp "$V16" "$V17"
          python - "$V17" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          R=[('MAX_YIELD_BOOST_FEE_BPS: constant(uint256) = 500\n','MAX_YIELD_BOOST_FEE_BPS: constant(uint256) = 500\nMAX_FEE_CONVERSION_SLIPPAGE_BPS: constant(uint256) = 400\n'),('yield_boost_fee_bps: public(uint256)\n\n# Converter','yield_boost_fee_bps: public(uint256)\nfee_conversion_slippage_bps: uint256\n\n# Converter'),('    self.yield_boost_fee_bps = _yield_boost_fee_bps\n    self.reward_smoothing_units','    self.yield_boost_fee_bps = _yield_boost_fee_bps\n    self.fee_conversion_slippage_bps = 100\n    self.reward_smoothing_units'),('    assert quote != 0, "zero quote"\n    response: Bytes[32] = raw_call(','    assert quote != 0, "zero quote"\n    quote = quote * (FEE_DENOMINATOR - self.fee_conversion_slippage_bps) // FEE_DENOMINATOR\n    response: Bytes[32] = raw_call('),('def set_yield_boost_fee_bps(_fee_bps: uint256):\n    assert msg.sender == self.admin and _fee_bps <= MAX_YIELD_BOOST_FEE_BPS\n    self.yield_boost_fee_bps = _fee_bps\n    log SetYieldBoostFee(_fee_bps)\n\n@external\ndef set_reward_converter','def set_yield_boost_fee_bps(_fee_bps: uint256):\n    assert msg.sender == self.admin and _fee_bps <= MAX_YIELD_BOOST_FEE_BPS\n    self.yield_boost_fee_bps = _fee_bps\n    log SetYieldBoostFee(_fee_bps)\n\n@external\ndef set_fee_conversion_slippage_bps(_slippage_bps: uint256):\n    assert msg.sender == self.admin and _slippage_bps <= MAX_FEE_CONVERSION_SLIPPAGE_BPS\n    self.fee_conversion_slippage_bps = _slippage_bps\n\n@external\ndef set_reward_converter')]
          for a,b in R: assert a in s; s=s.replace(a,b,1)
          p.write_text(s)
          PY
          test "$(sha256sum "$V17"|awk '{print $1}')" = 'd579f10a191bcf72feb8c220d7de4de447d9667e4ae923540df42781ee8f4216'
          echo "root=$(realpath "$ROOT")" >> "$GITHUB_OUTPUT"; echo "v17=$(realpath "$V17")" >> "$GITHUB_OUTPUT"
          printf 'v4_sha256=%s\nv17_sha256=%s\n' "$(sha256sum "$ZIP"|awk '{print $1}')" "$(sha256sum "$V17"|awk '{print $1}')" | tee phase9-source-binding-v3.txt

      - name: Install exact dependencies
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          npm ci --ignore-scripts
          python -m pip install --disable-pip-version-check --no-input 'vyper==0.4.3'

      - name: Compile exact changed surfaces and size V17
        env:
          ROOT: ${{ steps.src.outputs.root }}
          V17: ${{ steps.src.outputs.v17 }}
        shell: bash
        run: |
          set -euo pipefail; cd "$ROOT"; npx hardhat compile 2>&1 | tee "$GITHUB_WORKSPACE/phase9-solidity-compile-v3.txt"
          python - <<'PY' | tee "$GITHUB_WORKSPACE/phase9-static-and-v17-size-v3.txt"
          import os,json,vyper
          from pathlib import Path
          from vyper.compiler import compile_code
          r=Path(os.environ['ROOT']); s=(r/'contracts/boosthub/CurveYieldStakingStrategyV2.sol').read_text(); v=Path(os.environ['V17']).read_text()
          assert 'maxSlippageBps = 100;' in s and 'MAX_SLIPPAGE_BPS = 400' in s and 'delete tokenRescueReadyAt[token];' in s
          assert 'quoted * (FEE_DENOMINATOR - maxSlippageBps) / FEE_DENOMINATOR' in s
          assert 'self.reward_from_boosthub[_lp_token] = staticcall BoostHub(_boost_hub).isRewardToken(_pid, _lp_token)' in v
          assert 'assert staticcall BoostHub(_boost_hub).isRewardToken(_pid, token)' in v and 'if not self.reward_from_boosthub[token]:' in v
          assert 'self.fee_conversion_slippage_bps = 100' in v and 'MAX_FEE_CONVERSION_SLIPPAGE_BPS: constant(uint256) = 400' in v
          out=compile_code(v,contract_path=os.environ['V17'],output_formats=['abi','bytecode','bytecode_runtime']); runtime=(len(out['bytecode_runtime'])-2)//2
          assert vyper.__version__=='0.4.3' and runtime==24552 and runtime<=24576
          names={x.get('name') for x in out['abi'] if x.get('type')=='function'}; assert 'set_fee_conversion_slippage_bps' in names and 'fee_conversion_slippage_bps' not in names
          Path(os.environ['GITHUB_WORKSPACE'],'phase9-v17-artifact-v3.json').write_text(json.dumps({'abi':out['abi'],'bytecode':out['bytecode']}))
          print('STATIC=PASS'); print('runtime_bytes='+str(runtime)); print('headroom='+str(24576-runtime))
          PY

      - name: Fresh stale-rescue regression
        env:
          ROOT: ${{ steps.src.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail; cd "$ROOT"; mkdir -p contracts/audit test
          cat > contracts/audit/Phase9MockERC20.sol <<'SOL'
          // SPDX-License-Identifier: UNLICENSED
          pragma solidity 0.8.28;
          import {ERC20} from '@openzeppelin/contracts/token/ERC20/ERC20.sol';
          contract Phase9MockERC20 is ERC20 { constructor(string memory n,string memory s) ERC20(n,s) {} }
          SOL
          cat > test/phase9-rescue-v3.js <<'NODE'
          const {expect}=require('chai'); const {ethers,network}=require('hardhat');
          describe('rescue timer remediation',()=>{it('requires fresh delay after re-enable',async()=>{const [o]=await ethers.getSigners(); const T=await ethers.getContractFactory('Phase9MockERC20'); const w=await T.deploy('W','W'),r=await T.deploy('R','R'); await w.waitForDeployment();await r.waitForDeployment(); const S=await ethers.getContractFactory('CurveYieldStakingStrategyV2'); const s=await S.deploy(await w.getAddress(),o.address,o.address,o.address,[],[],[]);await s.waitForDeployment();const a=await r.getAddress();await s.addRewardRoute(a,o.address,1);await s.removeRewardRoute(a);await s.inCaseTokensGetStuck(a);await network.provider.send('evm_increaseTime',[5184001]);await network.provider.send('evm_mine');await s.addRewardRoute(a,o.address,1);expect(await s.tokenRescueReadyAt(a)).to.equal(0n);await s.removeRewardRoute(a);await expect(s.executeTokenRescue(a)).to.be.revertedWithCustomError(s,'NoPendingChange');await s.inCaseTokensGetStuck(a);await expect(s.executeTokenRescue(a)).to.be.revertedWithCustomError(s,'TimelockNotReady');});});
          NODE
          npx hardhat test test/phase9-rescue-v3.js 2>&1 | tee "$GITHUB_WORKSPACE/phase9-rescue-regression-v3.txt"

      - name: Fresh pinned sdYB V17 deployment regression
        env:
          RPC_URL: ${{ secrets.ETHEREUM_RPC }}
          ROOT: ${{ steps.src.outputs.root }}
          V17_ARTIFACT: ${{ github.workspace }}/phase9-v17-artifact-v3.json
        shell: bash
        run: |
          set -euo pipefail; anvil --fork-url "$RPC_URL" --fork-block-number 25737717 --chain-id 1 --port 8545 > "$GITHUB_WORKSPACE/phase9-anvil-v3.log" 2>&1 & APID=$!; trap 'kill $APID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -s -X POST -H 'content-type: application/json' --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' http://127.0.0.1:8545 | grep -q '0x1' && break; sleep 1; done
          cd "$ROOT"; node <<'NODE' | tee "$GITHUB_WORKSPACE/phase9-sdyb-v17-regression-v3.txt"
          const {ethers}=require('ethers'),fs=require('fs'); const HUB='0xFbEF8941Da53EA724385B44E91ae9672061D0263',SDYB='0x0c057598dcE1891688829581f890DD2a3685a43f',CRVUSD='0xf939E0A03FB07F59A73314E73794Be0E57ac1b4E',CRV='0xD533a949740bb3306d119CC777fa900bA034cd52';
          (async()=>{const p=new ethers.JsonRpcProvider('http://127.0.0.1:8545'),o=await p.getSigner(0),oa=await o.getAddress(),h=new ethers.Contract(HUB,['function isRewardToken(uint256,address) view returns(bool)'],o);if(await h.isRewardToken(2,SDYB)!==false||await h.isRewardToken(2,CRVUSD)!==true)throw Error('classification');const x=JSON.parse(fs.readFileSync(process.env.V17_ARTIFACT)),F=new ethers.ContractFactory(x.abi,x.bytecode,o),z=ethers.ZeroAddress,c=await F.deploy(SDYB,CRV,HUB,2,oa,[CRVUSD,z,z,z,z,z,z,z],[oa,z,z,z,z,z,z,z],0,0,oa,0,0,0,oa);await c.waitForDeployment();if(await c.reward_from_boosthub(SDYB)!==false||await c.reward_from_boosthub(CRVUSD)!==true||(await c.reward_count())!==2n)throw Error('post-deploy classification');console.log('SDYB_V17=PASS '+await c.getAddress());})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Correct-interface pinned oracle/execution regression
        env:
          RPC_URL: ${{ secrets.ETHEREUM_RPC }}
          ROOT: ${{ steps.src.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail; cd "$ROOT"; node <<'NODE' | tee "$GITHUB_WORKSPACE/phase9-oracle-execution-v3.txt"
          const {ethers}=require('ethers'); const p=new ethers.JsonRpcProvider(process.env.RPC_URL,1,{staticNetwork:true}),B=25737717,FEE=10000000000n,BPS=10000n;const P1='0xec977F46467a3021785Cff88894886E617abd65b',P2='0x98b540fa89690969D111D045afCa575C91519B1A';
          const A1=['function fee() view returns(uint256)','function price_oracle() view returns(uint256)','function get_dy(uint256,uint256,uint256) view returns(uint256)']; const A2=['function fee() view returns(uint256)','function price_oracle(uint256) view returns(uint256)','function get_dy(int128,int128,uint256) view returns(uint256)'];
          const at=(c,f,args=[])=>c[f](...args,{blockTag:B});(async()=>{const a=new ethers.Contract(P1,A1,p),b=new ethers.Contract(P2,A2,p),n=10n**18n,f1=await at(a,'fee'),f2=await at(b,'fee'),o1=await at(a,'price_oracle'),o2=await at(b,'price_oracle',[0]);let q=n*10n**18n/o1;q=q*(FEE-f1)/FEE;q=q*10n**18n/o2;q=q*(FEE-f2)/FEE;const x1=await at(a,'get_dy',[0,1,n]),x2=await at(b,'get_dy',[0,1,x1]),m=q*(BPS-100n)/BPS;console.log('preview='+q);console.log('executable='+x2);console.log('one_pct_min='+m);console.log('margin_bps_x100='+((x2-m)*1000000n/m));if(x2<m)throw Error('1pct floor');console.log('ORACLE_EXECUTION=PASS');})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload accepted reviewer4 evidence
        run: |
          cat > phase9-reviewer4-summary-v3.json <<'JSON'
          {"phase":9,"reviewer":"reviewer-4","source":{"v4_sha256":"4b502a2040712da8e6f4e80165ed74c8e3f492226e60141bc23ac8585a3855d4","v17_sha256":"d579f10a191bcf72feb8c220d7de4de447d9667e4ae923540df42781ee8f4216"},"obligations":{"OBL-P9-001":"PASS","OBL-P9-002":"PASS","OBL-P9-003":"PASS","OBL-P9-004":"PASS"},"runtime_bytes":24552,"eip170_headroom_bytes":24,"supersededRunnerFailures":["32684241876 Hardhat/EDR fork config","32684465801 wrong generic sdYB pool oracle ABI"]}
          JSON
      - uses: actions/upload-artifact@v4
        with:
          name: boosthub-phase9-reviewer4-remediation-v3
          path: |
            phase9-source-binding-v3.txt
            phase9-solidity-compile-v3.txt
            phase9-static-and-v17-size-v3.txt
            phase9-v17-artifact-v3.json
            phase9-rescue-regression-v3.txt
            phase9-anvil-v3.log
            phase9-sdyb-v17-regression-v3.txt
            phase9-oracle-execution-v3.txt
            phase9-reviewer4-summary-v3.json
          if-no-files-found: error
          retention-days: 30
