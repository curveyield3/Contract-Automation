name: BoostHub v4 Executable Route Probe v3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'github-native-sim/boosthub-v4-executable-route-probe-trigger-v3.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted runner
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Select working private controller credential
        env:
          AUDIT_CONTROLLER_PROBE_REPOSITORY: curveyield3/Solo-Audit-Controller
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Checkout exact remediated source commit
        uses: actions/checkout@v4
        with:
          repository: curveyield3/Solo-Audit-Controller
          ref: 93062463611e798ab26544a88c4e119f9620be9a
          token: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source and static remediation invariants
        shell: bash
        run: |
          set -euo pipefail
          ZIP='.controller/campaigns/Boosthub Staking v2/source/CurveYield-BoostHub-sdCRV-sdFXN-sdYB-Deployment-Package-Remediated-v4.zip'
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = '4b502a2040712da8e6f4e80165ed74c8e3f492226e60141bc23ac8585a3855d4'
          rm -rf .v4 && mkdir .v4 && unzip -q "$ZIP" -d .v4
          ROOT="$(find .v4 -mindepth 1 -maxdepth 1 -type d | head -n1)"
          STRAT="$(find "$ROOT" -type f -name 'CurveYieldStakingStrategyV2.sol' | head -n1)"
          V16="$(find "$ROOT" -type f -name 'BoostHubStaking-v16.vy' | head -n1)"
          SDYB="$(find "$ROOT" -type f -name 'SdYbRewardConverter.sol' | head -n1)"
          WST="$(find "$ROOT" -type f -name 'WstEthCurveRouterRewardConverter.sol' | head -n1)"
          grep -q 'uint256 public constant MAX_SLIPPAGE_BPS = 400;' "$STRAT"
          grep -q 'maxSlippageBps = 100;' "$STRAT"
          grep -q 'quoted \* (FEE_DENOMINATOR - maxSlippageBps) / FEE_DENOMINATOR' "$STRAT"
          grep -q 'quote: uint256 = self._preview_reward_convert' "$V16"
          grep -q 'convert(quote, bytes32)' "$V16"
          grep -q 'self.reward_from_boosthub\[_lp_token\] = staticcall BoostHub' "$V16"
          grep -q 'if not self.reward_from_boosthub\[token\]:' "$V16"
          grep -q 'CURVE_FEE_DENOMINATOR = 1e10' "$SDYB"
          grep -q 'CURVE_FEE_DENOMINATOR = 1e10' "$WST"
          printf 'source_sha256=%s\nstrategy_default_slippage_bps=100\nstrategy_max_slippage_bps=400\nv16_fee_conversion_minout=EXACT_PREVIEW\n' "$(sha256sum "$ZIP" | awk '{print $1}')" > static-v3.txt
          cat static-v3.txt

      - name: Probe exact executable routes at pinned block
        env:
          RPC_URL: ${{ secrets.ETHEREUM_RPC }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RPC_URL"
          BLOCK=25737717
          OUT=route-v3.env
          : > "$OUT"
          call() { cast call "$1" "$2" ${3:-} --rpc-url "$RPC_URL" --block "$BLOCK" | awk '{print $1}'; }
          dy() {
            local pool="$1" i="$2" j="$3" amount="$4"
            local sig val
            for sig in 'get_dy(int128,int128,uint256)(uint256)' 'get_dy(uint256,uint256,uint256)(uint256)'; do
              if val=$(cast call "$pool" "$sig" "$i" "$j" "$amount" --rpc-url "$RPC_URL" --block "$BLOCK" 2>/dev/null | awk '{print $1}'); then
                if [ -n "$val" ]; then printf '%s|%s\n' "$sig" "$val"; return 0; fi
              fi
            done
            return 1
          }

          BOOST=0xFbEF8941Da53EA724385B44e91ae9672061D0263
          SDCRV=0xD1b5651E55D4CeeD36251c61c50C889B36F6abB5
          SDFXN=0xe19d1c837B8A1C83A56cD9165b2c0256D39653aD
          SDYB=0x0c057598dcE1891688829581f890DD2a3685a43f
          CRVUSD=0xf939E0A03FB07F59A73314E73794Be0E57ac1b4E
          CRV=0xD533a949740bb3306d119CC777fa900bA034cd52
          WSTETH=0x7f39C581F595B53c5cb19bD0b3f8dA6c935E2Ca0
          TRI=0x4eBdF703948ddCEA3B11f675B4D1Fba9d2414A14
          CRVSD=0xCA0253A98D16e9C1e3614caFDA19318EE69772D0
          STETHPOOL=0xDC24316b9AE028F1497c275EB9192a3Ea0f67022
          ETHFXN=0xC15F285679a1Ef2d25F53D4CbD0265E1D02F2A92
          FXNSD=0x28Ca243dc0aC075dD012fCf9375C25D18A844d96
          CRVUSDYB=0xec977F46467a3021785Cff88894886E617abd65b
          YBSD=0x98b540fa89690969D111D045afCa575C91519B1A

          echo BLOCK=$BLOCK >> "$OUT"
          echo PID0_WANT_IS_REWARD=$(call "$BOOST" 'isRewardToken(uint256,address)(bool)' "0 $SDCRV") >> "$OUT"
          echo PID1_WANT_IS_REWARD=$(call "$BOOST" 'isRewardToken(uint256,address)(bool)' "1 $SDFXN") >> "$OUT"
          echo PID2_WANT_IS_REWARD=$(call "$BOOST" 'isRewardToken(uint256,address)(bool)' "2 $SDYB") >> "$OUT"
          echo PID0_CRVUSD_IS_REWARD=$(call "$BOOST" 'isRewardToken(uint256,address)(bool)' "0 $CRVUSD") >> "$OUT"
          echo PID0_CRV_IS_REWARD=$(call "$BOOST" 'isRewardToken(uint256,address)(bool)' "0 $CRV") >> "$OUT"
          echo PID1_WSTETH_IS_REWARD=$(call "$BOOST" 'isRewardToken(uint256,address)(bool)' "1 $WSTETH") >> "$OUT"
          echo PID2_CRVUSD_IS_REWARD=$(call "$BOOST" 'isRewardToken(uint256,address)(bool)' "2 $CRVUSD") >> "$OUT"

          echo TRI_ORACLE=$(call "$TRI" 'price_oracle(uint256)(uint256)' '1') >> "$OUT"
          echo TRI_FEE=$(call "$TRI" 'fee()(uint256)') >> "$OUT"
          echo CRVSD_ORACLE=$(call "$CRVSD" 'price_oracle()(uint256)') >> "$OUT"
          echo CRVSD_FEE=$(call "$CRVSD" 'fee()(uint256)') >> "$OUT"
          pair=$(dy "$CRVSD" 0 1 1000000000000000000); echo CRVSD_DY_ABI="${pair%%|*}" >> "$OUT"

          echo ETHFXN_ORACLE=$(call "$ETHFXN" 'price_oracle()(uint256)') >> "$OUT"
          echo ETHFXN_FEE=$(call "$ETHFXN" 'fee()(uint256)') >> "$OUT"
          echo FXNSD_ORACLE=$(call "$FXNSD" 'price_oracle()(uint256)') >> "$OUT"
          echo FXNSD_FEE=$(call "$FXNSD" 'fee()(uint256)') >> "$OUT"
          pair=$(dy "$FXNSD" 0 1 1000000000000000000); echo FXNSD_DY_ABI="${pair%%|*}" >> "$OUT"

          echo CRVUSDYB_ORACLE=$(call "$CRVUSDYB" 'price_oracle()(uint256)') >> "$OUT"
          echo CRVUSDYB_FEE=$(call "$CRVUSDYB" 'fee()(uint256)') >> "$OUT"
          echo YBSD_ORACLE=$(call "$YBSD" 'price_oracle(uint256)(uint256)' '0') >> "$OUT"
          echo YBSD_FEE=$(call "$YBSD" 'fee()(uint256)') >> "$OUT"

          for amount in 1000000000000000000 100000000000000000 10000000000000000 1000000000000000 10000000000000; do
            st=$(call "$WSTETH" 'getStETHByWstETH(uint256)(uint256)' "$amount")
            p=$(dy "$STETHPOOL" 1 0 "$st"); eth=${p##*|}
            p=$(dy "$ETHFXN" 0 1 "$eth"); fxn=${p##*|}
            p=$(dy "$FXNSD" 0 1 "$fxn"); sdfxn=${p##*|}
            echo WST_${amount}_STETH=$st >> "$OUT"
            echo WST_${amount}_LEGACY_ETH=$eth >> "$OUT"
            echo WST_${amount}_EXEC_SDFXN=$sdfxn >> "$OUT"
          done

          for amount in 1000000000000000000 10000000000000000; do
            p=$(dy "$CRVUSDYB" 0 1 "$amount"); yb=${p##*|}
            p=$(dy "$YBSD" 0 1 "$yb"); sdyb=${p##*|}
            echo SDYB_${amount}_EXEC_YB=$yb >> "$OUT"
            echo SDYB_${amount}_EXEC_SDYB=$sdyb >> "$OUT"
          done

          cat "$OUT"

      - name: Recompute v4 minima and validate residual findings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          vals={}
          for line in Path('route-v3.env').read_text().splitlines():
              k,v=line.split('=',1); vals[k]=v
          I={k:int(v) for k,v in vals.items() if v.isdigit()}
          D=10**10; BPS=10_000
          def fee(x,f): return x*(D-f)//D
          def pctfloor(x,bps=100): return x*(BPS-bps)//BPS

          assert vals['PID0_WANT_IS_REWARD']=='true'
          assert vals['PID1_WANT_IS_REWARD']=='true'
          assert vals['PID2_WANT_IS_REWARD']=='false'
          assert vals['PID0_CRVUSD_IS_REWARD']=='true'
          assert vals['PID0_CRV_IS_REWARD']=='true'
          assert vals['PID1_WSTETH_IS_REWARD']=='true'
          assert vals['PID2_CRVUSD_IS_REWARD']=='true'

          lines=[]
          # sdYB: fee-adjusted oracle preview versus true two-hop get_dy route.
          for amount in [10**18,10**16]:
              yb=amount*10**18//I['CRVUSDYB_ORACLE']; yb=fee(yb,I['CRVUSDYB_FEE'])
              oracle=yb*10**18//I['YBSD_ORACLE']; oracle=fee(oracle,I['YBSD_FEE'])
              floor=pctfloor(oracle)
              spot=I[f'SDYB_{amount}_EXEC_SDYB']
              v16_exact_pass=spot>=oracle
              strat_1pct_pass=spot>=floor
              lines.append(f'sdYB amount={amount} oracle_fee={oracle} strategy_floor_1pct={floor} executable_spot={spot} v16_exact_preview_min_pass={v16_exact_pass} strategy_1pct_pass={strat_1pct_pass}')
              if amount==10**18:
                  assert not v16_exact_pass, 'expected V16 exact-preview minOut liveness finding not reproduced'
                  assert strat_1pct_pass, 'Strategy 1% unexpectedly fails sdYB pinned route'

          # wstETH: first legacy hop is exact get_dy, then fee-adjusted oracles for ETH/FXN and FXN/sdFXN.
          wst_results=[]
          for amount in [10**18,10**17,10**16,10**15,10**13]:
              eth=I[f'WST_{amount}_LEGACY_ETH']
              fxn=eth*10**18//I['ETHFXN_ORACLE']; fxn=fee(fxn,I['ETHFXN_FEE'])
              oracle=fxn*10**18//I['FXNSD_ORACLE']; oracle=fee(oracle,I['FXNSD_FEE'])
              floor=pctfloor(oracle)
              spot=I[f'WST_{amount}_EXEC_SDFXN']
              ok=spot>=floor
              margin=(spot-floor)*BPS//floor
              wst_results.append((amount,ok,margin,oracle,floor,spot))
              lines.append(f'wstETH amount={amount} oracle_fee={oracle} strategy_floor_1pct={floor} executable_spot={spot} strategy_1pct_pass={ok} margin_vs_floor_bps={margin}')
          assert not wst_results[0][1], 'expected 1 wstETH default-1% liveness finding not reproduced'
          assert any(ok for _,ok,_,_,_,_ in wst_results[1:]), 'expected smaller wstETH route to demonstrate size dependence'

          Path('boosthub-v4-executable-route-probe-v3.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-v4-executable-route-probe-v3
          path: |
            static-v3.txt
            route-v3.env
            boosthub-v4-executable-route-probe-v3.txt
          if-no-files-found: warn
          retention-days: 30
