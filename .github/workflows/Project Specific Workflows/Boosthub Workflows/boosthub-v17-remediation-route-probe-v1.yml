name: BoostHub V17 Remediation Route Probe v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'github-native-sim/boosthub-v17-remediation-route-trigger-v1.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted runner
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Select working private controller credential
        env:
          AUDIT_CONTROLLER_PROBE_REPOSITORY: curveyield3/Solo-Audit-Controller
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Checkout campaign state containing V17 remediation delta
        uses: actions/checkout@v4
        with:
          repository: curveyield3/Solo-Audit-Controller
          ref: 482332db92c6f5e46169a7848da5f8bc89a5fdfe
          token: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller
          persist-credentials: false
          fetch-depth: 1

      - name: Reconstruct exact V17 and bind source identity
        shell: bash
        run: |
          set -euo pipefail
          ZIP='.controller/campaigns/Boosthub Staking v2/source/CurveYield-BoostHub-sdCRV-sdFXN-sdYB-Deployment-Package-Remediated-v4.zip'
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = '4b502a2040712da8e6f4e80165ed74c8e3f492226e60141bc23ac8585a3855d4'
          rm -rf .v4 && mkdir .v4 && unzip -q "$ZIP" -d .v4
          ROOT="$(find .v4 -mindepth 1 -maxdepth 1 -type d | head -n1)"
          V16="$ROOT/contracts/boosthub/vyper/BoostHubStaking-v16.vy"
          V17="$ROOT/contracts/boosthub/vyper/BoostHubStaking-v17.vy"
          cp "$V16" "$V17"
          python - "$V17" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          repls=[
              ('MAX_YIELD_BOOST_FEE_BPS: constant(uint256) = 500\n', 'MAX_YIELD_BOOST_FEE_BPS: constant(uint256) = 500\nMAX_FEE_CONVERSION_SLIPPAGE_BPS: constant(uint256) = 400\n'),
              ('yield_boost_fee_bps: public(uint256)\n\n# Converter', 'yield_boost_fee_bps: public(uint256)\nfee_conversion_slippage_bps: uint256\n\n# Converter'),
              ('    self.yield_boost_fee_bps = _yield_boost_fee_bps\n    self.reward_smoothing_units', '    self.yield_boost_fee_bps = _yield_boost_fee_bps\n    self.fee_conversion_slippage_bps = 100\n    self.reward_smoothing_units'),
              ('    assert quote != 0, "zero quote"\n    response: Bytes[32] = raw_call(', '    assert quote != 0, "zero quote"\n    quote = quote * (FEE_DENOMINATOR - self.fee_conversion_slippage_bps) // FEE_DENOMINATOR\n    response: Bytes[32] = raw_call('),
              ('def set_yield_boost_fee_bps(_fee_bps: uint256):\n    assert msg.sender == self.admin and _fee_bps <= MAX_YIELD_BOOST_FEE_BPS\n    self.yield_boost_fee_bps = _fee_bps\n    log SetYieldBoostFee(_fee_bps)\n\n@external\ndef set_reward_converter', 'def set_yield_boost_fee_bps(_fee_bps: uint256):\n    assert msg.sender == self.admin and _fee_bps <= MAX_YIELD_BOOST_FEE_BPS\n    self.yield_boost_fee_bps = _fee_bps\n    log SetYieldBoostFee(_fee_bps)\n\n@external\ndef set_fee_conversion_slippage_bps(_slippage_bps: uint256):\n    assert msg.sender == self.admin and _slippage_bps <= MAX_FEE_CONVERSION_SLIPPAGE_BPS\n    self.fee_conversion_slippage_bps = _slippage_bps\n\n@external\ndef set_reward_converter')
          ]
          for old,new in repls:
              assert old in s
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm "$V16"
          test "$(sha256sum "$V17" | awk '{print $1}')" = 'd579f10a191bcf72feb8c220d7de4de447d9667e4ae923540df42781ee8f4216'
          grep -q 'MAX_FEE_CONVERSION_SLIPPAGE_BPS: constant(uint256) = 400' "$V17"
          grep -q 'self.fee_conversion_slippage_bps = 100' "$V17"
          grep -q 'quote = quote \* (FEE_DENOMINATOR - self.fee_conversion_slippage_bps) // FEE_DENOMINATOR' "$V17"
          printf 'v17_sha256=%s\ndefault_slippage_bps=100\nmax_slippage_bps=400\n' "$(sha256sum "$V17" | awk '{print $1}')" > v17-static-v1.txt

      - name: Reproduce prior sdYB route and assert V17 floor passes
        env:
          RPC_URL: ${{ secrets.ETHEREUM_RPC }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RPC_URL"
          BLOCK=25737717
          CRVUSDYB=0xec977F46467a3021785Cff88894886E617abd65b
          YBSD=0x98b540fa89690969D111D045afCa575C91519B1A
          call() { cast call "$1" "$2" ${3:-} --rpc-url "$RPC_URL" --block "$BLOCK" | awk '{print $1}'; }
          dy() {
            local pool="$1" i="$2" j="$3" amount="$4"
            local sig val
            for sig in 'get_dy(int128,int128,uint256)(uint256)' 'get_dy(uint256,uint256,uint256)(uint256)'; do
              if val=$(cast call "$pool" "$sig" "$i" "$j" "$amount" --rpc-url "$RPC_URL" --block "$BLOCK" 2>/dev/null | awk '{print $1}'); then
                if [ -n "$val" ]; then printf '%s' "$val"; return 0; fi
              fi
            done
            return 1
          }
          OR1=$(call "$CRVUSDYB" 'price_oracle()(uint256)')
          F1=$(call "$CRVUSDYB" 'fee()(uint256)')
          OR2=$(call "$YBSD" 'price_oracle(uint256)(uint256)' '0')
          F2=$(call "$YBSD" 'fee()(uint256)')
          OUT=route-v17-v1.env
          printf 'BLOCK=%s\nOR1=%s\nF1=%s\nOR2=%s\nF2=%s\n' "$BLOCK" "$OR1" "$F1" "$OR2" "$F2" > "$OUT"
          for amount in 1000000000000000000 10000000000000000; do
            yb=$(dy "$CRVUSDYB" 0 1 "$amount")
            sdyb=$(dy "$YBSD" 0 1 "$yb")
            printf 'EXEC_YB_%s=%s\nEXEC_SDYB_%s=%s\n' "$amount" "$yb" "$amount" "$sdyb" >> "$OUT"
          done
          cat "$OUT"
          python - <<'PY'
          from pathlib import Path
          vals={}
          for line in Path('route-v17-v1.env').read_text().splitlines():
              k,v=line.split('=',1); vals[k]=int(v)
          D=10**10; BPS=10_000
          def fee(x,f): return x*(D-f)//D
          lines=[]
          for amount in (10**18,10**16):
              yb=amount*10**18//vals['OR1']; yb=fee(yb,vals['F1'])
              preview=yb*10**18//vals['OR2']; preview=fee(preview,vals['F2'])
              v17_min=preview*(BPS-100)//BPS
              spot=vals[f'EXEC_SDYB_{amount}']
              old_exact_pass=spot>=preview
              v17_pass=spot>=v17_min
              lines.append(f'amount={amount} preview={preview} old_exact_pass={old_exact_pass} v17_minout_1pct={v17_min} executable={spot} v17_pass={v17_pass}')
              assert v17_pass, f'V17 1% floor still fails for amount {amount}'
              if amount==10**18:
                  assert not old_exact_pass, 'prior exact-minOut failure no longer reproduced at pinned state; evidence mismatch'
          Path('boosthub-v17-remediation-route-probe-v1.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY

      - name: Upload remediation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-v17-remediation-route-probe-v1
          path: |
            v17-static-v1.txt
            route-v17-v1.env
            boosthub-v17-remediation-route-probe-v1.txt
          if-no-files-found: warn
          retention-days: 30
