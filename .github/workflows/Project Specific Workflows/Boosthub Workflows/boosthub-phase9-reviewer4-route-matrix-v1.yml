name: BoostHub Phase9 Reviewer4 Route Matrix v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'github-native-sim/boosthub-phase9-reviewer4-route-matrix-trigger-v1.txt'

permissions:
  contents: read

jobs:
  route-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Select working private controller credential
        env:
          AUDIT_CONTROLLER_PROBE_REPOSITORY: curveyield3/Audit-Controller
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - uses: actions/checkout@v4
        with:
          repository: curveyield3/Audit-Controller
          ref: 6e186513a8cdcb155600b1afb7b8cdc20c6b40cf
          token: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller
          persist-credentials: false
          fetch-depth: 1

      - name: Bind exact v4 remediation source
        run: |
          set -euo pipefail
          ZIP='.controller/campaigns/Boosthub Staking v2/source/CurveYield-BoostHub-sdCRV-sdFXN-sdYB-Deployment-Package-Remediated-v4.zip'
          test "$(sha256sum "$ZIP"|awk '{print $1}')" = '4b502a2040712da8e6f4e80165ed74c8e3f492226e60141bc23ac8585a3855d4'
          echo 'v4_sha256=4b502a2040712da8e6f4e80165ed74c8e3f492226e60141bc23ac8585a3855d4' | tee phase9-route-matrix-source-v1.txt

      - name: Query pinned executable routes and oracle baselines
        env:
          RPC_URL: ${{ secrets.ETHEREUM_RPC }}
        shell: bash
        run: |
          set -euo pipefail
          B=25737717; OUT=phase9-route-matrix-raw-v1.env; : > "$OUT"
          call(){ cast call "$1" "$2" ${3:-} --rpc-url "$RPC_URL" --block "$B" | awk '{print $1}'; }
          dy(){ local pool="$1" i="$2" j="$3" amount="$4" sig val; for sig in 'get_dy(int128,int128,uint256)(uint256)' 'get_dy(uint256,uint256,uint256)(uint256)'; do if val=$(cast call "$pool" "$sig" "$i" "$j" "$amount" --rpc-url "$RPC_URL" --block "$B" 2>/dev/null | awk '{print $1}'); then [ -n "$val" ] && { printf '%s|%s\n' "$sig" "$val"; return 0; }; fi; done; return 1; }
          TRI=0x4eBdF703948ddCEA3B11f675B4D1Fba9d2414A14
          CRVSD=0xCA0253A98D16e9C1e3614caFDA19318EE69772D0
          CRVUSDYB=0xec977F46467a3021785Cff88894886E617abd65b
          YBSD=0x98b540fa89690969D111D045afCa575C91519B1A
          WSTETH=0x7f39C581F595B53c5cb19bD0b3f8dA6c935E2Ca0
          STETHPOOL=0xDC24316b9AE028F1497c275EB9192a3Ea0f67022
          ETHFXN=0xC15F285679a1Ef2d25F53D4CbD0265E1D02F2A92
          FXNSD=0x28Ca243dc0aC075dD012fCf9375C25D18A844d96
          echo BLOCK=$B >> "$OUT"
          echo TRI_ORACLE_CRV=$(call "$TRI" 'price_oracle(uint256)(uint256)' '1') >> "$OUT"; echo TRI_FEE=$(call "$TRI" 'fee()(uint256)') >> "$OUT"
          echo CRVSD_ORACLE=$(call "$CRVSD" 'price_oracle()(uint256)') >> "$OUT"; echo CRVSD_FEE=$(call "$CRVSD" 'fee()(uint256)') >> "$OUT"
          p=$(dy "$TRI" 0 2 1000000000000000000); echo SDCRV_EXEC_CRV=${p##*|} >> "$OUT"; p=$(dy "$CRVSD" 0 1 "${p##*|}"); echo SDCRV_EXEC_SDCRV=${p##*|} >> "$OUT"
          echo CRVUSDYB_ORACLE=$(call "$CRVUSDYB" 'price_oracle()(uint256)') >> "$OUT"; echo CRVUSDYB_FEE=$(call "$CRVUSDYB" 'fee()(uint256)') >> "$OUT"
          echo YBSD_ORACLE=$(call "$YBSD" 'price_oracle(uint256)(uint256)' '0') >> "$OUT"; echo YBSD_FEE=$(call "$YBSD" 'fee()(uint256)') >> "$OUT"
          p=$(dy "$CRVUSDYB" 0 1 1000000000000000000); echo SDYB_EXEC_YB=${p##*|} >> "$OUT"; p=$(dy "$YBSD" 0 1 "${p##*|}"); echo SDYB_EXEC_SDYB=${p##*|} >> "$OUT"
          echo ETHFXN_ORACLE=$(call "$ETHFXN" 'price_oracle()(uint256)') >> "$OUT"; echo ETHFXN_FEE=$(call "$ETHFXN" 'fee()(uint256)') >> "$OUT"
          echo FXNSD_ORACLE=$(call "$FXNSD" 'price_oracle()(uint256)') >> "$OUT"; echo FXNSD_FEE=$(call "$FXNSD" 'fee()(uint256)') >> "$OUT"
          ST=$(call "$WSTETH" 'getStETHByWstETH(uint256)(uint256)' '100000000000000000'); echo WST_01_STETH=$ST >> "$OUT"; p=$(dy "$STETHPOOL" 1 0 "$ST"); ETH=${p##*|}; echo WST_01_ETH=$ETH >> "$OUT"; p=$(dy "$ETHFXN" 0 1 "$ETH"); FXN=${p##*|}; echo WST_01_EXEC_FXN=$FXN >> "$OUT"; p=$(dy "$FXNSD" 0 1 "$FXN"); echo WST_01_EXEC_SDFXN=${p##*|} >> "$OUT"
          cat "$OUT"

      - name: Recompute 1 percent floors and assert matrix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee phase9-route-matrix-result-v1.txt
          from pathlib import Path
          v={}
          for l in Path('phase9-route-matrix-raw-v1.env').read_text().splitlines(): k,x=l.split('=',1); v[k]=int(x)
          D=10**10; BPS=10_000
          fee=lambda x,f:x*(D-f)//D
          floor=lambda x:x*9900//BPS
          # crvUSD -> CRV -> sdCRV
          crv=10**18*10**18//v['TRI_ORACLE_CRV']; crv=fee(crv,v['TRI_FEE']); q=crv*10**18//v['CRVSD_ORACLE']; q=fee(q,v['CRVSD_FEE']); m=floor(q); x=v['SDCRV_EXEC_SDCRV']; assert x>=m
          print(f'sdCRV input_crvUSD=1 preview={q} one_pct_min={m} executable={x} margin_bps={(x-m)*BPS/x if x else 0:.4f} PASS')
          # crvUSD -> YB -> sdYB
          yb=10**18*10**18//v['CRVUSDYB_ORACLE']; yb=fee(yb,v['CRVUSDYB_FEE']); q=yb*10**18//v['YBSD_ORACLE']; q=fee(q,v['YBSD_FEE']); m=floor(q); x=v['SDYB_EXEC_SDYB']; assert x>=m
          print(f'sdYB input_crvUSD=1 preview={q} one_pct_min={m} executable={x} margin_bps={(x-m)*BPS/x if x else 0:.4f} PASS')
          # 0.1 wstETH -> stETH -> ETH (legacy executable) -> FXN -> sdFXN
          eth=v['WST_01_ETH']; fxn=eth*10**18//v['ETHFXN_ORACLE']; fxn=fee(fxn,v['ETHFXN_FEE']); q=fxn*10**18//v['FXNSD_ORACLE']; q=fee(q,v['FXNSD_FEE']); m=floor(q); x=v['WST_01_EXEC_SDFXN']; assert x>=m
          print(f'sdFXN input_wstETH=0.1 preview={q} one_pct_min={m} executable={x} margin_bps={(x-m)*BPS/x if x else 0:.4f} PASS')
          print('PHASE9_ROUTE_MATRIX=PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: boosthub-phase9-reviewer4-route-matrix-v1
          path: |
            phase9-route-matrix-source-v1.txt
            phase9-route-matrix-raw-v1.env
            phase9-route-matrix-result-v1.txt
          if-no-files-found: error
          retention-days: 30
