name: BoostHub Phase10 Release Reconciliation v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'github-native-sim/boosthub-phase10-release-reconciliation-trigger-v1.txt'

permissions:
  contents: read

jobs:
  reconcile-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Select working private controller credential
        env:
          AUDIT_CONTROLLER_PROBE_REPOSITORY: curveyield3/Audit-Controller
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - uses: actions/checkout@v4
        with:
          repository: curveyield3/Audit-Controller
          ref: main
          token: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact Vyper compiler
        run: python -m pip install --disable-pip-version-check --no-input 'vyper==0.4.3'

      - name: Inspect release package and reconstruct exact V17
        shell: bash
        run: |
          set -euo pipefail
          CAMPAIGN='.controller/campaigns/Boosthub Staking v2'
          ZIP="$CAMPAIGN/source/CurveYield-BoostHub-sdCRV-sdFXN-sdYB-Deployment-Package-Remediated-v4.zip"
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = '4b502a2040712da8e6f4e80165ed74c8e3f492226e60141bc23ac8585a3855d4'
          rm -rf .phase10 && mkdir .phase10
          unzip -q "$ZIP" -d .phase10/v4
          ROOT="$(find .phase10/v4 -mindepth 1 -maxdepth 1 -type d | head -n1)"
          V16="$ROOT/contracts/boosthub/vyper/BoostHubStaking-v16.vy"
          V17='.phase10/BoostHubStaking-v17.vy'
          cp "$V16" "$V17"
          python - "$V17" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          replacements=[
            ('MAX_YIELD_BOOST_FEE_BPS: constant(uint256) = 500\n','MAX_YIELD_BOOST_FEE_BPS: constant(uint256) = 500\nMAX_FEE_CONVERSION_SLIPPAGE_BPS: constant(uint256) = 400\n'),
            ('yield_boost_fee_bps: public(uint256)\n\n# Converter','yield_boost_fee_bps: public(uint256)\nfee_conversion_slippage_bps: uint256\n\n# Converter'),
            ('    self.yield_boost_fee_bps = _yield_boost_fee_bps\n    self.reward_smoothing_units','    self.yield_boost_fee_bps = _yield_boost_fee_bps\n    self.fee_conversion_slippage_bps = 100\n    self.reward_smoothing_units'),
            ('    assert quote != 0, "zero quote"\n    response: Bytes[32] = raw_call(','    assert quote != 0, "zero quote"\n    quote = quote * (FEE_DENOMINATOR - self.fee_conversion_slippage_bps) // FEE_DENOMINATOR\n    response: Bytes[32] = raw_call('),
            ('def set_yield_boost_fee_bps(_fee_bps: uint256):\n    assert msg.sender == self.admin and _fee_bps <= MAX_YIELD_BOOST_FEE_BPS\n    self.yield_boost_fee_bps = _fee_bps\n    log SetYieldBoostFee(_fee_bps)\n\n@external\ndef set_reward_converter','def set_yield_boost_fee_bps(_fee_bps: uint256):\n    assert msg.sender == self.admin and _fee_bps <= MAX_YIELD_BOOST_FEE_BPS\n    self.yield_boost_fee_bps = _fee_bps\n    log SetYieldBoostFee(_fee_bps)\n\n@external\ndef set_fee_conversion_slippage_bps(_slippage_bps: uint256):\n    assert msg.sender == self.admin and _slippage_bps <= MAX_FEE_CONVERSION_SLIPPAGE_BPS\n    self.fee_conversion_slippage_bps = _slippage_bps\n\n@external\ndef set_reward_converter')]
          for old,new in replacements:
              assert old in s
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          test "$(sha256sum "$V17" | awk '{print $1}')" = 'd579f10a191bcf72feb8c220d7de4de447d9667e4ae923540df42781ee8f4216'
          printf 'controller_commit=%s\nv4_sha256=%s\nv17_sha256=%s\n' "$(git -C .controller rev-parse HEAD)" "$(sha256sum "$ZIP"|awk '{print $1}')" "$(sha256sum "$V17"|awk '{print $1}')" > phase10-source-binding-v1.txt
          find "$ROOT" -type f -printf '%P\n' | sort > phase10-v4-package-filelist-v1.txt
          grep -RIn --binary-files=without-match -E 'REQUIRED_[A-Z0-9_]+' "$ROOT" > phase10-required-placeholders-v1.txt || true
          find "$ROOT" -type f \( -iname '*config*' -o -iname '*deploy*' -o -iname '*release*' -o -iname '*address*' \) -print | sort > .phase10/release-files.txt
          {
            echo '# Release/configuration candidate files'
            while IFS= read -r f; do
              echo "===== ${f#$ROOT/} ====="
              sed -n '1,260p' "$f" || true
            done < .phase10/release-files.txt
          } > phase10-release-config-candidates-v1.txt
          find "$CAMPAIGN/source" -maxdepth 3 -type f \( -iname '*deploy*' -o -iname '*release*' -o -iname '*address*' -o -iname '*config*' -o -iname '*manifest*' \) -printf '%P\n' | sort > phase10-controller-source-release-files-v1.txt

      - name: Compile exact V17 and classify release obligations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee phase10-release-reconciliation-v1.json
          import json, re, hashlib
          from pathlib import Path
          import vyper
          from vyper.compiler import compile_code
          v17=Path('.phase10/BoostHubStaking-v17.vy')
          src=v17.read_text()
          out=compile_code(src,contract_path=str(v17),output_formats=['bytecode','bytecode_runtime'])
          runtime=bytes.fromhex(out['bytecode_runtime'][2:])
          placeholders=[]
          ph=Path('phase10-required-placeholders-v1.txt')
          if ph.exists():
              for line in ph.read_text(errors='replace').splitlines():
                  m=re.findall(r'REQUIRED_[A-Z0-9_]+',line)
                  placeholders.extend(m)
          placeholders=sorted(set(placeholders))
          release_candidates=Path('phase10-release-config-candidates-v1.txt').read_text(errors='replace')
          explicit_final_deployment=bool(re.search(r'FINAL[_ -]DEPLOY|PRODUCTION[_ -]DEPLOYED|deployedRuntime|deployedBytecodeHash',release_candidates,re.I))
          result={
            'phase':10,
            'campaign':'Boosthub Staking v2',
            'reviewer':'reviewer-4',
            'controller_commit':Path('phase10-source-binding-v1.txt').read_text().split('controller_commit=',1)[1].splitlines()[0],
            'source':{
              'v4_sha256':'4b502a2040712da8e6f4e80165ed74c8e3f492226e60141bc23ac8585a3855d4',
              'v17_sha256':hashlib.sha256(v17.read_bytes()).hexdigest(),
              'vyper':vyper.__version__,
              'runtime_bytes':len(runtime),
              'runtime_sha256':hashlib.sha256(runtime).hexdigest(),
              'eip170_headroom_bytes':24576-len(runtime),
            },
            'release_materialization':{
              'required_placeholders':placeholders,
              'required_placeholder_count':len(placeholders),
              'explicit_final_deployment_record_detected':explicit_final_deployment,
            },
            'obligations':{
              'OBL-P10-001':'SATISFIED' if len(placeholders)==0 else 'BLOCKED_CARRIED',
              'OBL-P10-002':'SATISFIED' if len(placeholders)==0 and explicit_final_deployment else 'BLOCKED_CARRIED'
            }
          }
          assert result['source']['v17_sha256']=='d579f10a191bcf72feb8c220d7de4de447d9667e4ae923540df42781ee8f4216'
          assert result['source']['vyper']=='0.4.3'
          assert result['source']['runtime_bytes']==24552
          print(json.dumps(result,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: boosthub-phase10-release-reconciliation-v1
          path: |
            phase10-source-binding-v1.txt
            phase10-v4-package-filelist-v1.txt
            phase10-required-placeholders-v1.txt
            phase10-release-config-candidates-v1.txt
            phase10-controller-source-release-files-v1.txt
            phase10-release-reconciliation-v1.json
          if-no-files-found: error
          retention-days: 30
