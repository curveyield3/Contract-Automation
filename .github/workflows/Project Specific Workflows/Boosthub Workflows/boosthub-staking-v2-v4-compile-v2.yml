name: Boosthub Staking v2 v4 Compile v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boosthub-staking-v2-v4-compile-v2.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'github-native-sim/boosthub-staking-v2-v4-compile-trigger-v2.txt'
      - '.github/workflows/boosthub-staking-v2-v4-compile-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-staking:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted Contract-Automation runner
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Forge 1.7.1
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Verify Forge version
        shell: bash
        run: |
          set -euo pipefail
          forge --version | tee boosthub-staking-v2-v4-forge-version-v2.txt
          forge --version | grep -F '1.7.1'

      - name: Select working private controller credential
        env:
          AUDIT_CONTROLLER_PROBE_REPOSITORY: curveyield3/Solo-Audit-Controller
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Checkout exact Solo Audit Controller source commit
        uses: actions/checkout@v4
        with:
          repository: curveyield3/Solo-Audit-Controller
          ref: 93062463611e798ab26544a88c4e119f9620be9a
          token: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller
          persist-credentials: false
          fetch-depth: 1

      - name: Extract exact remediated v4 archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP='.controller/campaigns/Boosthub Staking v2/source/CurveYield-BoostHub-sdCRV-sdFXN-sdYB-Deployment-Package-Remediated-v4.zip'
          test -f "$ZIP"
          sha256sum "$ZIP" | tee boosthub-staking-v2-v4-archive-sha256-v2.txt

          rm -rf .boosthub-v4
          mkdir -p .boosthub-v4
          unzip -q "$ZIP" -d .boosthub-v4

          ROOT="$(find .boosthub-v4 -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$ROOT"
          TARGET="$ROOT/contracts/boosthub/CurveYieldStakingStrategyV2.sol"
          test -f "$TARGET"
          test -f "$ROOT/contracts/interfaces/ICurveYieldVaultStrategy.sol"
          test -f "$ROOT/contracts/interfaces/ICurveYieldVault.sol"
          test -f "$ROOT/contracts/interfaces/ICurveChildGauge.sol"

          echo "package_root=$(realpath "$ROOT")" >> "$GITHUB_OUTPUT"
          echo "target=contracts/boosthub/CurveYieldStakingStrategyV2.sol" >> "$GITHUB_OUTPUT"

          find "$ROOT" -maxdepth 3 -type f \( -name 'foundry.toml' -o -name 'remappings.txt' -o -name 'package.json' -o -name 'package-lock.json' \) -print | sort | tee boosthub-staking-v2-v4-build-metadata-v2.txt
          sha256sum "$TARGET" | tee boosthub-staking-v2-v4-staking-source-sha256-v2.txt

      - name: Supply OpenZeppelin dependency in ephemeral GitHub build root
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.source.outputs.package_root }}'
          mkdir -p "$ROOT/lib"
          git clone --depth 1 --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git "$ROOT/lib/openzeppelin-contracts"
          git -C "$ROOT/lib/openzeppelin-contracts" rev-parse HEAD | tee boosthub-staking-v2-v4-openzeppelin-commit-v2.txt
          printf '@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/\n' > "$ROOT/remappings.txt"

      - name: Compile exact staking contract with pinned Forge
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.source.outputs.package_root }}'
          TARGET='${{ steps.source.outputs.target }}'
          {
            echo "package_root=$ROOT"
            echo "target=$TARGET"
            echo "forge=$(forge --version | head -n 1)"
            echo 'openzeppelin_tag=v5.4.0'
            echo 'command=forge build --root <package_root> <target> --force -vvv'
          } | tee boosthub-staking-v2-v4-compile-summary-v2.txt

          forge build --root "$ROOT" "$TARGET" --force -vvv 2>&1 | tee boosthub-staking-v2-v4-compile-log-v2.txt
          echo 'compile_status=PASS' | tee -a boosthub-staking-v2-v4-compile-summary-v2.txt

          test -d "$ROOT/out"
          find "$ROOT/out" -type f -name '*.json' -print | sort | tee boosthub-staking-v2-v4-compiled-artifacts-v2.txt
          test -s boosthub-staking-v2-v4-compiled-artifacts-v2.txt

      - name: Collect compile evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E='boosthub-staking-v2-v4-compile-evidence-v2'
          mkdir -p "$E"
          for f in \
            boosthub-staking-v2-v4-forge-version-v2.txt \
            boosthub-staking-v2-v4-archive-sha256-v2.txt \
            boosthub-staking-v2-v4-build-metadata-v2.txt \
            boosthub-staking-v2-v4-staking-source-sha256-v2.txt \
            boosthub-staking-v2-v4-openzeppelin-commit-v2.txt \
            boosthub-staking-v2-v4-compile-summary-v2.txt \
            boosthub-staking-v2-v4-compile-log-v2.txt \
            boosthub-staking-v2-v4-compiled-artifacts-v2.txt; do
            [ ! -f "$f" ] || cp "$f" "$E/"
          done
          ROOT='${{ steps.source.outputs.package_root }}'
          if [ -n "$ROOT" ] && [ -d "$ROOT/out" ]; then
            mkdir -p "$E/out"
            cp -R "$ROOT/out/." "$E/out/"
          fi

      - name: Upload compile evidence v2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-staking-v2-v4-compile-evidence-v2
          path: boosthub-staking-v2-v4-compile-evidence-v2
          if-no-files-found: error
          retention-days: 30
