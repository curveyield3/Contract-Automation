name: BoostHub Phase9 V17 Setter Boundary v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'github-native-sim/boosthub-phase9-v17-setter-boundary-trigger-v1.txt'

permissions:
  contents: read

jobs:
  setter-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Select working private controller credential
        env:
          AUDIT_CONTROLLER_PROBE_REPOSITORY: curveyield3/Audit-Controller
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - uses: actions/checkout@v4
        with:
          repository: curveyield3/Audit-Controller
          ref: 6e186513a8cdcb155600b1afb7b8cdc20c6b40cf
          token: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Bind exact source and compile V17
        id: src
        shell: bash
        run: |
          set -euo pipefail
          ZIP='.controller/campaigns/Boosthub Staking v2/source/CurveYield-BoostHub-sdCRV-sdFXN-sdYB-Deployment-Package-Remediated-v4.zip'
          test "$(sha256sum "$ZIP"|awk '{print $1}')" = '4b502a2040712da8e6f4e80165ed74c8e3f492226e60141bc23ac8585a3855d4'
          rm -rf .setter && mkdir .setter && unzip -q "$ZIP" -d .setter
          ROOT="$(find .setter -mindepth 1 -maxdepth 1 -type d | head -n1)"
          V16="$ROOT/contracts/boosthub/vyper/BoostHubStaking-v16.vy"; V17="$ROOT/contracts/boosthub/vyper/BoostHubStaking-v17.vy"; cp "$V16" "$V17"
          python - "$V17" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          R=[('MAX_YIELD_BOOST_FEE_BPS: constant(uint256) = 500\n','MAX_YIELD_BOOST_FEE_BPS: constant(uint256) = 500\nMAX_FEE_CONVERSION_SLIPPAGE_BPS: constant(uint256) = 400\n'),('yield_boost_fee_bps: public(uint256)\n\n# Converter','yield_boost_fee_bps: public(uint256)\nfee_conversion_slippage_bps: uint256\n\n# Converter'),('    self.yield_boost_fee_bps = _yield_boost_fee_bps\n    self.reward_smoothing_units','    self.yield_boost_fee_bps = _yield_boost_fee_bps\n    self.fee_conversion_slippage_bps = 100\n    self.reward_smoothing_units'),('    assert quote != 0, "zero quote"\n    response: Bytes[32] = raw_call(','    assert quote != 0, "zero quote"\n    quote = quote * (FEE_DENOMINATOR - self.fee_conversion_slippage_bps) // FEE_DENOMINATOR\n    response: Bytes[32] = raw_call('),('def set_yield_boost_fee_bps(_fee_bps: uint256):\n    assert msg.sender == self.admin and _fee_bps <= MAX_YIELD_BOOST_FEE_BPS\n    self.yield_boost_fee_bps = _fee_bps\n    log SetYieldBoostFee(_fee_bps)\n\n@external\ndef set_reward_converter','def set_yield_boost_fee_bps(_fee_bps: uint256):\n    assert msg.sender == self.admin and _fee_bps <= MAX_YIELD_BOOST_FEE_BPS\n    self.yield_boost_fee_bps = _fee_bps\n    log SetYieldBoostFee(_fee_bps)\n\n@external\ndef set_fee_conversion_slippage_bps(_slippage_bps: uint256):\n    assert msg.sender == self.admin and _slippage_bps <= MAX_FEE_CONVERSION_SLIPPAGE_BPS\n    self.fee_conversion_slippage_bps = _slippage_bps\n\n@external\ndef set_reward_converter')]
          for a,b in R: assert a in s; s=s.replace(a,b,1)
          p.write_text(s)
          PY
          test "$(sha256sum "$V17"|awk '{print $1}')" = 'd579f10a191bcf72feb8c220d7de4de447d9667e4ae923540df42781ee8f4216'
          python -m pip install --disable-pip-version-check --no-input 'vyper==0.4.3'
          python - "$V17" <<'PY'
          import json,sys,vyper
          from pathlib import Path
          from vyper.compiler import compile_code
          p=Path(sys.argv[1]); out=compile_code(p.read_text(),contract_path=str(p),output_formats=['abi','bytecode','bytecode_runtime'])
          runtime=(len(out['bytecode_runtime'])-2)//2
          assert vyper.__version__=='0.4.3' and runtime==24552
          Path('phase9-v17-setter-artifact-v1.json').write_text(json.dumps({'abi':out['abi'],'bytecode':out['bytecode']}))
          print('runtime_bytes='+str(runtime))
          PY
          echo "root=$(realpath "$ROOT")" >> "$GITHUB_OUTPUT"
          printf 'v4_sha256=%s\nv17_sha256=%s\nruntime_bytes=24552\n' "$(sha256sum "$ZIP"|awk '{print $1}')" "$(sha256sum "$V17"|awk '{print $1}')" | tee phase9-v17-setter-source-binding-v1.txt

      - name: Install ethers
        working-directory: ${{ steps.src.outputs.root }}
        run: npm ci --ignore-scripts

      - name: Execute setter authority and cap boundary on pinned fork
        env:
          RPC_URL: ${{ secrets.ETHEREUM_RPC }}
          ROOT: ${{ steps.src.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          anvil --fork-url "$RPC_URL" --fork-block-number 25737717 --chain-id 1 --port 8545 > phase9-v17-setter-anvil-v1.log 2>&1 &
          APID=$!; trap 'kill $APID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -s -X POST -H 'content-type: application/json' --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' http://127.0.0.1:8545 | grep -q '0x1' && break; sleep 1; done
          cp phase9-v17-setter-artifact-v1.json "$ROOT/"
          cd "$ROOT"
          node <<'NODE' | tee "$GITHUB_WORKSPACE/phase9-v17-setter-boundary-v1.txt"
          const {ethers}=require('ethers'),fs=require('fs');
          const HUB='0xFbEF8941Da53EA724385B44E91ae9672061D0263', SDYB='0x0c057598dcE1891688829581f890DD2a3685a43f', CRVUSD='0xf939E0A03FB07F59A73314E73794Be0E57ac1b4E', CRV='0xD533a949740bb3306d119CC777fa900bA034cd52';
          (async()=>{const p=new ethers.JsonRpcProvider('http://127.0.0.1:8545'),admin=await p.getSigner(0),other=await p.getSigner(1),aa=await admin.getAddress(),a=JSON.parse(fs.readFileSync('phase9-v17-setter-artifact-v1.json')),F=new ethers.ContractFactory(a.abi,a.bytecode,admin),z=ethers.ZeroAddress;
            const c=await F.deploy(SDYB,CRV,HUB,2,aa,[CRVUSD,z,z,z,z,z,z,z],[aa,z,z,z,z,z,z,z],0,0,aa,0,0,0,aa); await c.waitForDeployment();
            await (await c.set_fee_conversion_slippage_bps(400)).wait(); console.log('admin_400=PASS');
            let high=false; try{await (await c.set_fee_conversion_slippage_bps(401)).wait();}catch(e){high=true;} if(!high) throw Error('401 unexpectedly accepted'); console.log('admin_401_reverts=PASS');
            let unauth=false; try{await (await c.connect(other).set_fee_conversion_slippage_bps(100)).wait();}catch(e){unauth=true;} if(!unauth) throw Error('non-admin unexpectedly accepted'); console.log('non_admin_reverts=PASS');
            console.log('V17_SETTER_BOUNDARY=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Write summary
        run: |
          cat > phase9-v17-setter-summary-v1.json <<'JSON'
          {"phase":9,"reviewer":"reviewer-4","v17_sha256":"d579f10a191bcf72feb8c220d7de4de447d9667e4ae923540df42781ee8f4216","runtime_bytes":24552,"admin_400":"PASS","admin_401":"REVERT_PASS","non_admin_100":"REVERT_PASS"}
          JSON

      - uses: actions/upload-artifact@v4
        with:
          name: boosthub-phase9-v17-setter-boundary-v1
          path: |
            phase9-v17-setter-source-binding-v1.txt
            phase9-v17-setter-artifact-v1.json
            phase9-v17-setter-anvil-v1.log
            phase9-v17-setter-boundary-v1.txt
            phase9-v17-setter-summary-v1.json
          if-no-files-found: error
          retention-days: 30
