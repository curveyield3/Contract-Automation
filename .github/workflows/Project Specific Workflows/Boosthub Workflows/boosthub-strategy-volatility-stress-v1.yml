name: BoostHub Strategy Volatility Stress v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'github-native-sim/boosthub-strategy-volatility-stress-trigger-v1.txt'

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted runner
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Select working private controller credential
        env:
          AUDIT_CONTROLLER_PROBE_REPOSITORY: curveyield3/Solo-Audit-Controller
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Checkout exact canonical v4 source
        uses: actions/checkout@v4
        with:
          repository: curveyield3/Solo-Audit-Controller
          ref: 93062463611e798ab26544a88c4e119f9620be9a
          token: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller
          persist-credentials: false
          fetch-depth: 1

      - name: Bind Strategy source
        shell: bash
        run: |
          set -euo pipefail
          ZIP='.controller/campaigns/Boosthub Staking v2/source/CurveYield-BoostHub-sdCRV-sdFXN-sdYB-Deployment-Package-Remediated-v4.zip'
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = '4b502a2040712da8e6f4e80165ed74c8e3f492226e60141bc23ac8585a3855d4'
          rm -rf .v4 && mkdir .v4 && unzip -q "$ZIP" -d .v4
          STRAT="$(find .v4 -type f -name 'CurveYieldStakingStrategyV2.sol' | head -n1)"
          test "$(sha256sum "$STRAT" | awk '{print $1}')" = 'e2821e3ce2d45e78cc3f2080837427ad96673d5a9aab081c4c4526938c0ee255'
          grep -q 'maxSlippageBps = 100;' "$STRAT"
          grep -q 'uint256 public constant MAX_SLIPPAGE_BPS = 400;' "$STRAT"

      - name: Stress oracle-vs-execution across blocks and sizes
        env:
          RPC_URL: ${{ secrets.ETHEREUM_RPC }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RPC_URL"
          WSTETH=0x7f39C581F595B53c5cb19bD0b3f8dA6c935E2Ca0
          STETHPOOL=0xDC24316b9AE028F1497c275EB9192a3Ea0f67022
          ETHFXN=0xC15F285679a1Ef2d25F53D4CbD0265E1D02F2A92
          FXNSD=0x28Ca243dc0aC075dD012fCf9375C25D18A844d96
          ETHUSD=0x5f4ec3df9cbd43714fe2740f5e3616155c5b8419
          CENTER=25737717
          BLOCKS='25730517 25732317 25734117 25735917 25737717 25739517 25741317 25743117 25744917'
          AMOUNTS='10000000000000000 100000000000000000 250000000000000000 500000000000000000 1000000000000000000'

          call() { cast call "$1" "$2" ${3:-} --rpc-url "$RPC_URL" --block "$4"; }
          dy() {
            local pool="$1" i="$2" j="$3" amount="$4" block="$5"
            local sig val
            for sig in 'get_dy(int128,int128,uint256)(uint256)' 'get_dy(uint256,uint256,uint256)(uint256)'; do
              if val=$(cast call "$pool" "$sig" "$i" "$j" "$amount" --rpc-url "$RPC_URL" --block "$block" 2>/dev/null | awk '{print $1}'); then
                if [ -n "$val" ]; then printf '%s' "$val"; return 0; fi
              fi
            done
            return 1
          }

          : > stress-raw-v1.csv
          echo 'block,eth_usd_8,amount_wsteth_wei,legacy_eth_exec,ethfxn_oracle,ethfxn_fee,fxnsd_oracle,fxnsd_fee,exec_sdfxn' >> stress-raw-v1.csv
          for block in $BLOCKS; do
            ROUND=$(cast call "$ETHUSD" 'latestRoundData()(uint80,int256,uint256,uint256,uint80)' --rpc-url "$RPC_URL" --block "$block")
            ETHPX=$(echo "$ROUND" | sed -n '2p' | awk '{print $1}')
            OR1=$(cast call "$ETHFXN" 'price_oracle()(uint256)' --rpc-url "$RPC_URL" --block "$block" | awk '{print $1}')
            F1=$(cast call "$ETHFXN" 'fee()(uint256)' --rpc-url "$RPC_URL" --block "$block" | awk '{print $1}')
            OR2=$(cast call "$FXNSD" 'price_oracle()(uint256)' --rpc-url "$RPC_URL" --block "$block" | awk '{print $1}')
            F2=$(cast call "$FXNSD" 'fee()(uint256)' --rpc-url "$RPC_URL" --block "$block" | awk '{print $1}')
            for amount in $AMOUNTS; do
              STETH=$(cast call "$WSTETH" 'getStETHByWstETH(uint256)(uint256)' "$amount" --rpc-url "$RPC_URL" --block "$block" | awk '{print $1}')
              ETH=$(dy "$STETHPOOL" 1 0 "$STETH" "$block")
              FXN=$(dy "$ETHFXN" 0 1 "$ETH" "$block")
              SDFXN=$(dy "$FXNSD" 0 1 "$FXN" "$block")
              echo "$block,$ETHPX,$amount,$ETH,$OR1,$F1,$OR2,$F2,$SDFXN" >> stress-raw-v1.csv
            done
          done

          python - <<'PY'
          import csv
          from pathlib import Path
          D=10**10; BPS=10_000
          rows=[]
          def fee(x,f): return x*(D-f)//D
          with open('stress-raw-v1.csv', newline='') as f:
              for r in csv.DictReader(f):
                  q={k:int(v) for k,v in r.items()}
                  fxn=q['legacy_eth_exec']*10**18//q['ethfxn_oracle']; fxn=fee(fxn,q['ethfxn_fee'])
                  preview=fxn*10**18//q['fxnsd_oracle']; preview=fee(preview,q['fxnsd_fee'])
                  floor1=preview*9900//10000
                  floor2=preview*9800//10000
                  floor4=preview*9600//10000
                  exec_=q['exec_sdfxn']
                  divergence=(preview-exec_)*BPS/preview
                  margin1=(exec_-floor1)*BPS/floor1
                  rows.append({**q,'preview':preview,'floor_1pct':floor1,'floor_2pct':floor2,'floor_4pct':floor4,
                               'pass_1pct':exec_>=floor1,'pass_2pct':exec_>=floor2,'pass_4pct':exec_>=floor4,
                               'oracle_exec_gap_bps':divergence,'margin_vs_1pct_bps':margin1})
          out=Path('boosthub-strategy-volatility-stress-v1.csv')
          fields=list(rows[0].keys())
          with out.open('w', newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          # Summaries by amount and worst state.
          lines=[]
          amounts=sorted({r['amount_wsteth_wei'] for r in rows})
          for a in amounts:
              rs=[r for r in rows if r['amount_wsteth_wei']==a]
              worst=max(rs,key=lambda r:r['oracle_exec_gap_bps'])
              fails=sum(not r['pass_1pct'] for r in rs)
              lines.append(f"amount_wei={a} one_pct_fail_blocks={fails}/{len(rs)} worst_block={worst['block']} worst_eth_usd={worst['eth_usd_8']/1e8:.2f} worst_oracle_exec_gap_bps={worst['oracle_exec_gap_bps']:.4f} worst_margin_vs_1pct_bps={worst['margin_vs_1pct_bps']:.4f} pass_2pct={worst['pass_2pct']} pass_4pct={worst['pass_4pct']}")
          # Block-to-block ETH move metrics and 1% failures.
          byblock={}
          for r in rows: byblock.setdefault(r['block'],r['eth_usd_8']/1e8)
          ordered=sorted(byblock)
          lines.append('')
          lines.append('ETH price snapshots:')
          for i,b in enumerate(ordered):
              px=byblock[b]
              change='n/a' if i==0 else f"{(px/byblock[ordered[i-1]]-1)*100:.3f}%"
              lines.append(f'block={b} eth_usd={px:.2f} change_from_prior_sample={change}')
          Path('boosthub-strategy-volatility-stress-summary-v1.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-strategy-volatility-stress-v1
          path: |
            stress-raw-v1.csv
            boosthub-strategy-volatility-stress-v1.csv
            boosthub-strategy-volatility-stress-summary-v1.txt
          if-no-files-found: warn
          retention-days: 30
