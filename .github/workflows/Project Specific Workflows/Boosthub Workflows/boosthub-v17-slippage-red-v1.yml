name: BoostHub V17 Slippage RED v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'github-native-sim/boosthub-v17-slippage-red-pr-v1.txt'

permissions:
  contents: read

jobs:
  red-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted runner
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Select working private controller credential
        env:
          AUDIT_CONTROLLER_PROBE_REPOSITORY: curveyield3/Solo-Audit-Controller
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Checkout exact canonical v4 source
        uses: actions/checkout@v4
        with:
          repository: curveyield3/Solo-Audit-Controller
          ref: 93062463611e798ab26544a88c4e119f9620be9a
          token: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Vyper
        run: python -m pip install --disable-pip-version-check 'vyper==0.4.3'

      - name: Compile V16 and assert requested V17 interface
        shell: bash
        run: |
          set -euo pipefail
          ZIP='.controller/campaigns/Boosthub Staking v2/source/CurveYield-BoostHub-sdCRV-sdFXN-sdYB-Deployment-Package-Remediated-v4.zip'
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = '4b502a2040712da8e6f4e80165ed74c8e3f492226e60141bc23ac8585a3855d4'
          rm -rf .v4 && mkdir .v4 && unzip -q "$ZIP" -d .v4
          SRC="$(find .v4 -type f -name 'BoostHubStaking-v16.vy' | head -n1)"
          python - "$SRC" <<'PY'
          from pathlib import Path
          import sys, vyper
          from vyper.compiler import compile_code
          src = Path(sys.argv[1])
          text = src.read_text()
          assert vyper.__version__ == '0.4.3'
          out = compile_code(text, contract_path=str(src), output_formats=['abi','bytecode_runtime'])
          names = {x.get('name') for x in out['abi'] if x.get('type') == 'function'}
          print('baseline_runtime_bytes=', (len(out['bytecode_runtime']) - 2)//2)
          assert 'fee_conversion_slippage_bps' in names, 'RED: configurable slippage getter missing'
          assert 'set_fee_conversion_slippage_bps' in names, 'RED: configurable slippage setter missing'
          assert 'MAX_FEE_CONVERSION_SLIPPAGE_BPS: constant(uint256) = 400' in text
          assert 'self.fee_conversion_slippage_bps = 100' in text
          assert 'quote * (FEE_DENOMINATOR - self.fee_conversion_slippage_bps) // FEE_DENOMINATOR' in text
          PY
