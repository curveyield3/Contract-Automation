[build-system]
# Match the current original Composer packaging family; no upstream fork.
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curveyield-autoprover-local-mimo"
version = "0.1.0"
description = "CurveYield Security Pipeline v1 adapter for Certora AutoProver Composer and existing local MiMo inference"
requires-python = ">=3.12"
# No dependency installation from this package: install only into a previously
# source-pinned and independently qualified Certora/AutoProver environment.
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["curveyield_autoprover_mimo*"]

[project.entry-points."certora.autoprove.llm_provider"]
local_mimo = "curveyield_autoprover_mimo:LOCAL_MIMO_SPEC"
